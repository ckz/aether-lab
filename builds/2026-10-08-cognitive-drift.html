<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cognitive Drift — Aether Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #07070d; }
  canvas { display: block; width: 100%; height: 100%; }

  #ui {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 10;
    opacity: 0.85;
    transition: opacity 0.4s;
  }
  #ui:hover { opacity: 1; }
  .pill {
    background: rgba(15,15,25,0.55);
    border: 1px solid rgba(255,255,255,0.08);
    color: #b8b8c8;
    padding: 6px 12px;
    border-radius: 999px;
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.08em;
    cursor: pointer;
    user-select: none;
    backdrop-filter: blur(8px);
  }
  .pill:hover { background: rgba(25,25,45,0.7); color: #fff; }
  .pill.active { border-color: rgba(140,160,255,0.35); color: #cdd2ff; }

  #legend {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.35);
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.1em;
    text-align: center;
    pointer-events: none;
  }
  kbd {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 4px;
    padding: 2px 6px;
    font-family: inherit;
    color: rgba(255,255,255,0.55);
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="ui">
  <div class="pill" data-mode="wander">Wander</div>
  <div class="pill" data-mode="focus">Focus</div>
  <div class="pill" data-mode="dream">Dream</div>
  <div class="pill" data-mode="recall">Recall</div>
</div>

<div id="legend">
  <kbd>1-4</kbd> modes · <kbd>click</kbd> plant memory · <kbd>drag</kbd> attract · <kbd>space</kbd> pause · <kbd>c</kbd> clear · <kbd>s</kbd> save
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // — State —
  const modeNames = ['wander','focus','dream','recall'];
  let mode = 'wander';
  let paused = false;
  let time = 0;
  const mouse = { x: W/2, y: H/2, down: false, active: false };

  // — Palettes —
  const palettes = [
    ['#7fb3ff','#c4b5fd','#f9a8d4','#fde68a','#a7f3d0'],
    ['#f9a8d4','#fda4af','#fdba74','#fde047','#c4b5fd'],
    ['#99f6e4','#67e8f9','#a5b4fc','#c4b5fd','#f9a8d4'],
    ['#fde047','#fde68a','#d9f99d','#a7f3d0','#bae6fd'],
    ['#c4b5fd','#e879f9','#fb7185','#fda4af','#fde047']
  ];
  let palette = palettes[0];

  // — Memory seeds (click-planted) —
  const seeds = [];
  const MAX_SEEDS = 40;

  // — Particles —
  const TOTAL = 900;
  const particles = [];
  class Particle {
    constructor() { this.init(); }
    init() {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.vx = 0; this.vy = 0;
      this.ax = 0; this.ay = 0;
      this.size = 1 + Math.random() * 2;
      this.baseSize = this.size;
      this.life = 0.5 + Math.random() * 0.5;
      this.maxLife = 400 + Math.random() * 600;
      this.age = Math.random() * this.maxLife;
      this.color = palette[Math.floor(Math.random() * palette.length)];
      this.trail = [];
      this.trailMax = 6 + Math.floor(Math.random() * 10);
      this.memory = null; // attached seed
      this.noiseOff = Math.random() * 1000;
      this.phase = Math.random() * Math.PI * 2;
    }
  }
  for (let i = 0; i < TOTAL; i++) particles.push(new Particle());

  // — Noise —
  // Simple 2D value noise with smooth interpolation
  const perm = new Uint8Array(512);
  (() => {
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(Math.random() * (i+1));
      [p[i], p[j]] = [p[j], p[i]];
    }
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  })();
  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function lerp(a, b, t) { return a + t * (b - a); }
  function grad(hash, x, y) {
    const h = hash & 3;
    const u = h < 2 ? x : y;
    const v = h < 2 ? y : x;
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  }
  function noise2D(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const u = fade(xf), v = fade(yf);
    const a = perm[X] + Y, b = perm[X+1] + Y;
    return lerp(
      lerp(grad(perm[a], xf, yf), grad(perm[b], xf-1, yf), u),
      lerp(grad(perm[a+1], xf, yf-1), grad(perm[b+1], xf-1, yf-1), u),
      v
    );
  }

  // — Input —
  function setMode(m) {
    mode = m;
    document.querySelectorAll('.pill').forEach(p => {
      p.classList.toggle('active', p.dataset.mode === m);
    });
  }
  document.querySelectorAll('.pill').forEach(p => {
    p.addEventListener('click', () => setMode(p.dataset.mode));
  });
  window.addEventListener('keydown', e => {
    if (e.key >= '1' && e.key <= '4') setMode(modeNames[+e.key - 1]);
    if (e.key === ' ') { paused = !paused; e.preventDefault(); }
    if (e.key === 'c') { seeds.length = 0; particles.forEach(p => p.memory = null); }
    if (e.key === 's') savePNG();
  });
  canvas.addEventListener('mousedown', e => {
    mouse.down = true; mouse.active = true;
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (seeds.length < MAX_SEEDS) {
      seeds.push({
        x: e.clientX, y: e.clientY,
        birth: time,
        strength: 0.6 + Math.random() * 0.4,
        color: palette[Math.floor(Math.random() * palette.length)],
        life: 1200 + Math.random() * 800
      });
      // assign nearby particles to remember this seed
      particles.forEach(pt => {
        const dx = pt.x - e.clientX, dy = pt.y - e.clientY;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < 160 && !pt.memory) {
          pt.memory = seeds[seeds.length - 1];
        }
      });
    }
  });
  canvas.addEventListener('mousemove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  });
  canvas.addEventListener('mouseup', () => mouse.down = false);
  canvas.addEventListener('mouseleave', () => { mouse.active = false; mouse.down = false; });
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    mouse.down = true; mouse.active = true;
    mouse.x = t.clientX; mouse.y = t.clientY;
  }, {passive:true});
  canvas.addEventListener('touchmove', e => {
    const t = e.touches[0];
    mouse.x = t.clientX; mouse.y = t.clientY;
  }, {passive:true});
  canvas.addEventListener('touchend', () => mouse.down = false);

  function savePNG() {
    const a = document.createElement('a');
    a.download = 'cognitive-drift.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  // — Color helper —
  function hexToRGBA(hex, a) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  // — Update —
  function update(dt) {
    time += dt;

    // Age and expire seeds
    for (let i = seeds.length - 1; i >= 0; i--) {
      seeds[i].strength *= 0.9997;
      if (time - seeds[i].birth > seeds[i].life) seeds.splice(i, 1);
    }

    particles.forEach(pt => {
      const nx = pt.x * 0.0025 + pt.noiseOff;
      const ny = pt.y * 0.0025 + time * 0.0004;
      const n = noise2D(nx, ny);

      let fx = 0, fy = 0;

      if (mode === 'wander') {
        const angle = n * Math.PI * 4;
        fx += Math.cos(angle) * 0.35;
        fy += Math.sin(angle) * 0.35;
        // gentle curl
        fx += Math.cos(angle + 1.2) * 0.15;
        fy += Math.sin(angle + 1.2) * 0.15;
      } else if (mode === 'focus') {
        const toCenterX = W/2 - pt.x, toCenterY = H/2 - pt.y;
        const dist = Math.sqrt(toCenterX*toCenterX + toCenterY*toCenterY) + 1;
        const pull = 0.0004 * dist;
        fx += toCenterX / dist * pull * 800;
        fy += toCenterY / dist * pull * 800;
        fx += Math.cos(n * Math.PI * 2) * 0.12;
        fy += Math.sin(n * Math.PI * 2) * 0.12;
      } else if (mode === 'dream') {
        const angle = n * Math.PI * 6 + time * 0.0008;
        fx += Math.cos(angle) * 0.25;
        fy += Math.sin(angle) * 0.25;
        // levitation
        fx += Math.sin(pt.y * 0.01 + time * 0.001) * 0.18;
        fy += Math.cos(pt.x * 0.01 + time * 0.0012) * 0.18;
      } else if (mode === 'recall') {
        if (pt.memory) {
          const dx = pt.memory.x - pt.x, dy = pt.memory.y - pt.y;
          const d = Math.sqrt(dx*dx + dy*dy) + 1;
          const pull = 0.015 * pt.memory.strength;
          fx += dx / d * pull * d * 0.4;
          fy += dy / d * pull * d * 0.4;
          fx += Math.cos(n * Math.PI * 2) * 0.05;
          fy += Math.sin(n * Math.PI * 2) * 0.05;
        } else {
          // drift toward nearest memory
          let nearest = null, nd = 300;
          seeds.forEach(s => {
            const dx = s.x - pt.x, dy = s.y - pt.y;
            const d = Math.sqrt(dx*dx + dy*dy);
            if (d < nd) { nd = d; nearest = s; }
          });
          if (nearest) {
            const dx = nearest.x - pt.x, dy = nearest.y - pt.y;
            const d = Math.sqrt(dx*dx + dy*dy) + 1;
            fx += dx / d * 0.08;
            fy += dy / d * 0.08;
          } else {
            fx += Math.cos(n * Math.PI * 3) * 0.12;
            fy += Math.sin(n * Math.PI * 3) * 0.12;
          }
        }
      }

      // Mouse interaction
      if (mouse.active) {
        const dx = mouse.x - pt.x, dy = mouse.y - pt.y;
        const d = Math.sqrt(dx*dx + dy*dy) + 1;
        if (d < 180) {
          const falloff = 1 - d / 180;
          const strength = mouse.down ? 0.6 : -0.25;
          fx += (dx / d) * strength * falloff;
          fy += (dy / d) * strength * falloff;
        }
      }

      // Apply forces
      pt.vx = (pt.vx + fx) * 0.92;
      pt.vy = (pt.vy + fy) * 0.92;

      // Speed cap
      const speed = Math.sqrt(pt.vx*pt.vx + pt.vy*pt.vy);
      const maxSpeed = mode === 'dream' ? 3.5 : 2.2;
      if (speed > maxSpeed) {
        pt.vx = pt.vx / speed * maxSpeed;
        pt.vy = pt.vy / speed * maxSpeed;
      }

      pt.x += pt.vx;
      pt.y += pt.vy;

      // Wrap
      if (pt.x < -20) pt.x = W + 20;
      if (pt.x > W + 20) pt.x = -20;
      if (pt.y < -20) pt.y = H + 20;
      if (pt.y > H + 20) pt.y = -20;

      // Trail
      pt.trail.unshift({ x: pt.x, y: pt.y });
      if (pt.trail.length > pt.trailMax) pt.trail.pop();

      // Age
      pt.age += dt;
      const lifeRatio = pt.age / pt.maxLife;
      pt.life = lifeRatio < 0.1 ? lifeRatio / 0.1 : lifeRatio > 0.8 ? (1 - lifeRatio) / 0.2 : 1;
      pt.life = Math.max(0, Math.min(1, pt.life));
      pt.size = pt.baseSize * (0.6 + 0.4 * Math.sin(pt.age * 0.02 + pt.phase));

      if (pt.age > pt.maxLife) pt.init();
    });
  }

  // — Draw —
  function draw() {
    // Trails
    ctx.globalCompositeOperation = 'lighter';
    particles.forEach(pt => {
      if (pt.trail.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(pt.trail[0].x, pt.trail[0].y);
      for (let i = 1; i < pt.trail.length; i++) {
        ctx.lineTo(pt.trail[i].x, pt.trail[i].y);
      }
      ctx.strokeStyle = hexToRGBA(pt.color, 0.15 * pt.life);
      ctx.lineWidth = pt.size * 0.6;
      ctx.stroke();
    });

    // Heads
    particles.forEach(pt => {
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fillStyle = hexToRGBA(pt.color, 0.85 * pt.life);
      ctx.fill();
    });

    // Memory seeds — soft glow
    seeds.forEach(s => {
      const age = time - s.birth;
      const a = Math.max(0, s.strength * (1 - age / s.life));
      const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 90);
      grad.addColorStop(0, hexToRGBA(s.color, 0.25 * a));
      grad.addColorStop(1, hexToRGBA(s.color, 0));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 90, 0, Math.PI * 2);
      ctx.fill();

      // ring
      ctx.beginPath();
      ctx.arc(s.x, s.y, 4 + Math.sin(time * 0.04 + s.birth) * 2, 0, Math.PI * 2);
      ctx.strokeStyle = hexToRGBA(s.color, 0.5 * a);
      ctx.lineWidth = 1;
      ctx.stroke();
    });

    ctx.globalCompositeOperation = 'source-over';
  }

  // — Loop —
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(32, now - last);
    last = now;
    if (!paused) { update(dt); }
    // fade background
    ctx.fillStyle = 'rgba(7,7,13,0.18)';
    ctx.fillRect(0, 0, W, H);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // Init mode UI
  setMode('wander');
})();
</script>
</body>
</html>
