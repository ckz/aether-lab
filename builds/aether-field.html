<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Field — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
  }
  #overlay {
    position: fixed;
    bottom: 24px;
    left: 24px;
    color: rgba(255,255,255,0.5);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
  #overlay .title {
    font-size: 13px;
    color: rgba(255,255,255,0.75);
    margin-bottom: 4px;
  }
  #controls {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 10;
    display: flex;
    gap: 8px;
  }
  #controls button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.6);
    padding: 6px 14px;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    transition: all 0.3s;
  }
  #controls button:hover {
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.9);
  }
  #hint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.25);
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
    transition: opacity 2s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div class="title">Aether Field</div>
  <div id="info">particles: 0 | connections: 0</div>
</div>
<div id="controls">
  <button onclick="cycleMode()">mode</button>
  <button onclick="resetField()">reset</button>
  <button onclick="togglePause()">pause</button>
</div>
<div id="hint">click to attract</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const info = document.getElementById('info');
const hint = document.getElementById('hint');

let W, H, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

let mode = 0;
const modes = ['flow', 'orbit', 'bloom', 'drift'];
function cycleMode() {
  mode = (mode + 1) % modes.length;
}
function togglePause() {
  paused = !paused;
}
let paused = false;

const mouse = { x: W/2, y: H/2, active: false };
window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
  hint.style.opacity = '0';
});
window.addEventListener('mousedown', () => { mouse.active = true; });
window.addEventListener('mouseup', () => { mouse.active = false; });
window.addEventListener('touchmove', e => {
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
  hint.style.opacity = '0';
}, { passive: true });

const palettes = [
  // aurora
  ['#00ffc8', '#00b4d8', '#7b2ff7', '#ff006e', '#ffbe0b'],
  // deep ocean
  ['#03045e', '#023e8a', '#0077b6', '#0096c7', '#90e0ef'],
  // ember
  ['#370617', '#6a040f', '#9d0208', '#d00000', '#dc2f02', '#ffba08'],
  // frost
  ['#e0fbfc', '#c2dfe3', '#9db4c0', '#5c4d7d', '#2b2d42'],
  // neon dusk
  ['#ff006e', '#8338ec', '#3a86ff', '#06ffa5', '#ffbe0b'],
];
let palette = palettes[0];

class Particle {
  constructor() {
    this.reset();
    this.x = Math.random() * W;
    this.y = Math.random() * H;
  }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = (Math.random() - 0.5) * 1.5;
    this.life = 0;
    this.maxLife = 300 + Math.random() * 400;
    this.size = 1 + Math.random() * 2.5;
    this.color = palette[Math.floor(Math.random() * palette.length)];
    this.phase = Math.random() * Math.PI * 2;
    this.amplitude = 0.5 + Math.random() * 2;
  }
  update(time) {
    this.life++;
    if (this.life > this.maxLife || this.x < -50 || this.x > W+50 || this.y < -50 || this.y > H+50) {
      this.reset();
    }

    const t = time * 0.001;
    const m = modes[mode];

    if (m === 'flow') {
      const angle = Math.sin(this.x * 0.003 + t) * Math.cos(this.y * 0.003 + t * 0.7) * Math.PI * 2;
      this.vx += Math.cos(angle) * 0.15;
      this.vy += Math.sin(angle) * 0.15;
    } else if (m === 'orbit') {
      const cx = W/2, cy = H/2;
      const dx = this.x - cx, dy = this.y - cy;
      const dist = Math.sqrt(dx*dx + dy*dy) + 0.01;
      const force = 50 / dist;
      this.vx += (-dy / dist) * force * 0.01;
      this.vy += (dx / dist) * force * 0.01;
      this.vx += dx * 0.00005;
      this.vy += dy * 0.00005;
    } else if (m === 'bloom') {
      const cx = W/2, cy = H/2;
      const dx = cx - this.x, dy = cy - this.y;
      const dist = Math.sqrt(dx*dx + dy*dy) + 0.01;
      const wave = Math.sin(dist * 0.01 - t * 2) * 0.5;
      this.vx += (dx / dist) * wave * 0.1;
      this.vy += (dy / dist) * wave * 0.1;
    } else if (m === 'drift') {
      this.vx += Math.sin(t + this.phase) * this.amplitude * 0.05;
      this.vy += Math.cos(t * 0.7 + this.phase) * this.amplitude * 0.05;
    }

    // mouse interaction
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx*dx + dy*dy) + 0.01;
      if (dist < 200) {
        const force = (200 - dist) / 200;
        const attract = modes[mode] === 'drift';
        this.vx += attract ? (dx / dist) * force * 0.5 : -(dx / dist) * force * 0.3;
        this.vy += attract ? (dy / dist) * force * 0.5 : -(dy / dist) * force * 0.3;
      }
    }

    const damping = 0.97;
    this.vx *= damping;
    this.vy *= damping;
    const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
    if (speed > 4) {
      this.vx = (this.vx / speed) * 4;
      this.vy = (this.vy / speed) * 4;
    }

    this.x += this.vx;
    this.y += this.vy;
  }
}

const N = 180;
const particles = [];
for (let i = 0; i < N; i++) particles.push(new Particle());

let connections = 0;
function draw(time) {
  if (!paused) {
    // fade trail
    ctx.fillStyle = 'rgba(10, 10, 15, 0.12)';
    ctx.fillRect(0, 0, W, H);

    connections = 0;
    const maxDist = 100;

    for (let i = 0; i < N; i++) {
      particles[i].update(time);
      const p = particles[i];
      const lifeRatio = 1 - Math.abs(p.life - p.maxLife/2) / (p.maxLife/2);
      const alpha = lifeRatio * 0.8;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color + Math.round(alpha * 255).toString(16).padStart(2, '0');
      ctx.fill();

      // connections
      for (let j = i + 1; j < N; j++) {
        const q = particles[j];
        const dx = p.x - q.x;
        const dy = p.y - q.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < maxDist) {
          connections++;
          const lineAlpha = (1 - dist/maxDist) * alpha * 0.3;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = p.color + Math.round(lineAlpha * 255).toString(16).padStart(2, '0');
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    info.textContent = `particles: ${N} | connections: ${connections}`;
  }
  requestAnimationFrame(draw);
}

function resetField() {
  palette = palettes[Math.floor(Math.random() * palettes.length)];
  particles.forEach(p => {
    p.color = palette[Math.floor(Math.random() * palette.length)];
    p.reset();
  });
  ctx.fillStyle = 'rgba(10, 10, 15, 1)';
  ctx.fillRect(0, 0, W, H);
}

window.addEventListener('resize', () => {
  resize();
});

requestAnimationFrame(draw);
</script>
</body>
</html>
