<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Flow — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Georgia', serif;
    cursor: crosshair;
  }
  canvas { display: block; }
  .title {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.5);
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
    text-shadow: 0 0 20px rgba(255,255,255,0.1);
  }
  .hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.3);
    font-size: 11px;
    letter-spacing: 0.15em;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="title">Aether Flow</div>
<canvas id="c"></canvas>
<div class="hint">move your cursor to weave light</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let mouse = { x: -9999, y: -9999, active: false };
let particles = [];
const PARTICLE_COUNT = 180;
const CONNECTION_DIST = 120;
const MOUSE_RADIUS = 180;

class Particle {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.6;
    this.vy = (Math.random() - 0.5) * 0.6;
    this.baseX = this.x;
    this.baseY = this.y;
    this.size = Math.random() * 2 + 0.5;
    this.hue = Math.random() * 40 + 180; // cool cyan to teal
    this.saturation = Math.random() * 30 + 60;
    this.lightness = Math.random() * 30 + 50;
    this.alpha = Math.random() * 0.5 + 0.2;
    this.pulseSpeed = Math.random() * 0.02 + 0.005;
    this.pulseOffset = Math.random() * Math.PI * 2;
  }

  update(time) {
    // Gentle wandering
    this.vx += (Math.random() - 0.5) * 0.03;
    this.vy += (Math.random() - 0.5) * 0.03;
    this.vx *= 0.99;
    this.vy *= 0.99;

    // Mouse interaction — gentle attraction and swirl
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < MOUSE_RADIUS && dist > 0) {
        const force = (1 - dist / MOUSE_RADIUS) * 0.04;
        const angle = Math.atan2(dy, dx);
        // Swirl + pull
        this.vx += Math.cos(angle + 1.2) * force * 2 + dx / dist * force;
        this.vy += Math.sin(angle + 1.2) * force * 2 + dy / dist * force;
      }
    }

    this.x += this.vx;
    this.y += this.vy;

    // Wrap edges softly
    const margin = 40;
    if (this.x < -margin) this.x = W + margin;
    if (this.x > W + margin) this.x = -margin;
    if (this.y < -margin) this.y = H + margin;
    if (this.y > H + margin) this.y = -margin;

    // Pulse alpha
    this.currentAlpha = this.alpha + Math.sin(time * this.pulseSpeed + this.pulseOffset) * 0.15;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${this.currentAlpha})`;
    ctx.fill();

    // Glow
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${this.currentAlpha * 0.15})`;
    ctx.fill();
  }
}

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function init() {
  resize();
  particles = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(new Particle());
  }
}

function drawConnections() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < CONNECTION_DIST) {
        const alpha = (1 - dist / CONNECTION_DIST) * 0.15;
        const hue = (particles[i].hue + particles[j].hue) / 2;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `hsla(${hue}, 70%, 60%, ${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

// Mouse connections with gradient effect
function drawMouseConnections() {
  if (!mouse.active) return;
  for (let i = 0; i < particles.length; i++) {
    const dx = mouse.x - particles[i].x;
    const dy = mouse.y - particles[i].y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < MOUSE_RADIUS) {
      const alpha = (1 - dist / MOUSE_RADIUS) * 0.3;
      const gradient = ctx.createLinearGradient(
        particles[i].x, particles[i].y, mouse.x, mouse.y
      );
      gradient.addColorStop(0, `hsla(${particles[i].hue}, 80%, 65%, ${alpha * 0.5})`);
      gradient.addColorStop(1, `hsla(200, 90%, 70%, ${alpha})`);
      ctx.beginPath();
      ctx.moveTo(particles[i].x, particles[i].y);
      ctx.lineTo(mouse.x, mouse.y);
      ctx.strokeStyle = gradient;
      ctx.lineWidth = (1 - dist / MOUSE_RADIUS) * 1.5;
      ctx.stroke();
    }
  }
}

let time = 0;

function animate() {
  time++;
  // Fade trail
  ctx.fillStyle = 'rgba(10, 10, 15, 0.12)';
  ctx.fillRect(0, 0, W, H);

  drawConnections();
  drawMouseConnections();

  for (const p of particles) {
    p.update(time);
    p.draw();
  }

  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
  resize();
});

window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

window.addEventListener('mouseleave', () => {
  mouse.active = false;
});

window.addEventListener('touchmove', (e) => {
  if (e.touches.length > 0) {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    mouse.active = true;
  }
}, { passive: true });

window.addEventListener('touchend', () => {
  mouse.active = false;
});

// Click burst
window.addEventListener('click', (e) => {
  for (const p of particles) {
    const dx = p.x - e.clientX;
    const dy = p.y - e.clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 200 && dist > 0) {
      const force = (1 - dist / 200) * 6;
      p.vx += (dx / dist) * force;
      p.vy += (dy / dist) * force;
    }
  }
});

init();
animate();
</script>
</body>
</html>
