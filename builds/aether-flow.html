<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Flow — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; }
  #info {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
  #title {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.15);
    font-size: 14px;
    letter-spacing: 6px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="title">Aether Flow</div>
<div id="info">move mouse to disturb the field</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
let particles = [];
let mouse = { x: -9999, y: -9999, active: false };
const PARTICLE_COUNT = 1200;
const CONNECTION_DIST = 80;

// Color palettes - cosmic aurora themes
const palettes = [
  ['#00ffc8', '#00a8ff', '#7b2fff', '#ff2d95'],
  ['#ff6b35', '#f7c548', '#ff2d95', '#7b2fff'],
  ['#00ffc8', '#48ff9c', '#00a8ff', '#0066ff'],
  ['#ff2d95', '#ff6b9d', '#c44dff', '#6b5bff']
];
let currentPalette = palettes[0];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => {
  mouse.active = false;
});
canvas.addEventListener('click', (e) => {
  // Burst on click
  for (let i = 0; i < 50; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    particles.push({
      x: e.clientX,
      y: e.clientY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: Math.random() * 0.01 + 0.005,
      size: Math.random() * 3 + 1,
      color: currentPalette[Math.floor(Math.random() * currentPalette.length)]
    });
  }
  // Cycle palette
  currentPalette = palettes[Math.floor(Math.random() * palettes.length)];
});

class Particle {
  constructor() {
    this.reset();
  }
  
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.baseX = this.x;
    this.baseY = this.y;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5;
    this.size = Math.random() * 2 + 0.5;
    this.color = currentPalette[Math.floor(Math.random() * currentPalette.length)];
    this.alpha = Math.random() * 0.5 + 0.3;
    this.phase = Math.random() * Math.PI * 2;
    this.speed = Math.random() * 0.02 + 0.01;
  }
  
  update(time) {
    // Organic drift
    this.x += this.vx + Math.sin(time * this.speed + this.phase) * 0.3;
    this.y += this.vy + Math.cos(time * this.speed + this.phase) * 0.3;
    
    // Mouse repulsion
    if (mouse.active) {
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) {
        const force = (150 - dist) / 150;
        this.x += (dx / dist) * force * 3;
        this.y += (dy / dist) * force * 3;
      }
    }
    
    // Wrap around
    if (this.x < 0) this.x = W;
    if (this.x > W) this.x = 0;
    if (this.y < 0) this.y = H;
    if (this.y > H) this.y = 0;
    
    // Gentle return to base
    this.x += (this.baseX - this.x) * 0.001;
    this.y += (this.baseY - this.y) * 0.001;
  }
  
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = this.alpha;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// Initialize particles
for (let i = 0; i < PARTICLE_COUNT; i++) {
  particles.push(new Particle());
}

let time = 0;
let lastPaletteChange = 0;

function animate() {
  // Fade trail
  ctx.fillStyle = 'rgba(10, 10, 15, 0.08)';
  ctx.fillRect(0, 0, W, H);
  
  time++;
  
  // Update and draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    
    if (p.life !== undefined) {
      // Burst particle
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.98;
      p.vy *= 0.98;
      p.life -= p.decay;
      
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life * 0.8;
      ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      p.update(time);
      p.draw();
    }
  }
  
  // Draw connections (only for main particles)
  ctx.strokeStyle = currentPalette[0];
  ctx.lineWidth = 0.3;
  
  for (let i = 0; i < Math.min(particles.length, 300); i++) {
    const p1 = particles[i];
    if (p1.life !== undefined) continue;
    
    for (let j = i + 1; j < Math.min(particles.length, 300); j++) {
      const p2 = particles[j];
      if (p2.life !== undefined) continue;
      
      const dx = p1.x - p2.x;
      const dy = p1.y - p2.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist < CONNECTION_DIST) {
        ctx.globalAlpha = (1 - dist / CONNECTION_DIST) * 0.15;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
  
  // Slow palette rotation
  if (time - lastPaletteChange > 600) {
    currentPalette = palettes[Math.floor(Math.random() * palettes.length)];
    lastPaletteChange = time;
  }
  
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
