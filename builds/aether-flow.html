<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Flow — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #e0e0e0;
  }
  canvas { display: block; }
  #info {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
  #title {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.25);
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="title">Aether Flow</div>
<div id="info">move mouse to disturb the field</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let mouse = { x: W/2, y: H/2, active: false };
window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
window.addEventListener('touchmove', e => {
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
});

// Noise function (simplex-inspired)
class Noise {
  constructor() {
    this.perm = new Uint8Array(512);
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [p[i], p[j]] = [p[j], p[i]];
    }
    for (let i = 0; i < 512; i++) this.perm[i] = p[i & 255];
  }
  
  fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  lerp(a, b, t) { return a + t * (b - a); }
  grad(hash, x, y, z) {
    const h = hash & 15;
    const u = h < 8 ? x : y;
    const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
    return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
  }
  
  noise3D(x, y, z) {
    const X = Math.floor(x) & 255;
    const Y = Math.floor(y) & 255;
    const Z = Math.floor(z) & 255;
    x -= Math.floor(x);
    y -= Math.floor(y);
    z -= Math.floor(z);
    const u = this.fade(x), v = this.fade(y), w = this.fade(z);
    const p = this.perm;
    const A = p[X] + Y, AA = p[A] + Z, AB = p[A+1] + Z;
    const B = p[X+1] + Y, BA = p[B] + Z, BB = p[B+1] + Z;
    return this.lerp(
      this.lerp(
        this.lerp(this.grad(p[AA], x, y, z), this.grad(p[BA], x-1, y, z), u),
        this.lerp(this.grad(p[AB], x, y-1, z), this.grad(p[BB], x-1, y-1, z), u),
        v
      ),
      this.lerp(
        this.lerp(this.grad(p[AA+1], x, y, z-1), this.grad(p[BA+1], x-1, y, z-1), u),
        this.lerp(this.grad(p[AB+1], x, y-1, z-1), this.grad(p[BB+1], x-1, y-1, z-1), u),
        v
      ),
      w
    );
  }
}

const noise = new Noise();
const particles = [];
const NUM_PARTICLES = 2000;
const TIME_SPEED = 0.0008;

// Color palettes
const palettes = [
  { name: 'nebula', colors: [[120, 40, 200], [40, 120, 255], [200, 60, 180], [60, 200, 220]] },
  { name: 'ember', colors: [[255, 100, 30], [255, 180, 40], [200, 40, 20], [255, 220, 100]] },
  { name: 'forest', colors: [[20, 180, 80], [40, 120, 60], [100, 200, 140], [180, 220, 100]] },
  { name: 'ocean', colors: [[20, 80, 200], [40, 160, 220], [80, 40, 180], [120, 200, 255]] },
  { name: 'aurora', colors: [[80, 255, 180], [40, 200, 255], [180, 100, 255], [100, 255, 200]] },
];

let palette = palettes[Math.floor(Math.random() * palettes.length)];

class Particle {
  constructor() {
    this.reset();
  }
  
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.prevX = this.x;
    this.prevY = this.y;
    this.speed = 0.5 + Math.random() * 2.5;
    this.life = 0;
    this.maxLife = 200 + Math.random() * 400;
    const c = palette.colors[Math.floor(Math.random() * palette.colors.length)];
    this.r = c[0]; this.g = c[1]; this.b = c[2];
    this.size = 0.5 + Math.random() * 1.5;
  }
  
  update(time) {
    this.prevX = this.x;
    this.prevY = this.y;
    
    const scale = 0.003;
    const n1 = noise.noise3D(this.x * scale, this.y * scale, time);
    const n2 = noise.noise3D(this.x * scale + 100, this.y * scale + 100, time);
    const angle = n1 * Math.PI * 4;
    const force = n2 * this.speed;
    
    this.x += Math.cos(angle) * force;
    this.y += Math.sin(angle) * force;
    
    // Mouse disturbance
    if (mouse.active) {
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) {
        const strength = (1 - dist / 150) * 3;
        this.x += (dx / dist) * strength;
        this.y += (dy / dist) * strength;
      }
    }
    
    this.life++;
    
    // Wrap or reset
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H || this.life > this.maxLife) {
      this.reset();
      this.life = 0;
    }
  }
  
  draw() {
    const alpha = Math.sin((this.life / this.maxLife) * Math.PI) * 0.6;
    ctx.strokeStyle = `rgba(${this.r},${this.g},${this.b},${alpha})`;
    ctx.lineWidth = this.size;
    ctx.beginPath();
    ctx.moveTo(this.prevX, this.prevY);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();
  }
}

// Initialize particles
for (let i = 0; i < NUM_PARTICLES; i++) {
  particles.push(new Particle());
}

let time = 0;
let fadeAlpha = 0.03;

function animate() {
  // Fade trail
  ctx.fillStyle = `rgba(10, 10, 15, ${fadeAlpha})`;
  ctx.fillRect(0, 0, W, H);
  
  time += TIME_SPEED;
  
  for (const p of particles) {
    p.update(time);
    p.draw();
  }
  
  requestAnimationFrame(animate);
}

// Start with full black
ctx.fillStyle = '#0a0a0f';
ctx.fillRect(0, 0, W, H);
animate();

// Cycle palette every 30 seconds
setInterval(() => {
  palette = palettes[Math.floor(Math.random() * palettes.length)];
  // Gradually shift particle colors
  for (const p of particles) {
    const c = palette.colors[Math.floor(Math.random() * palette.colors.length)];
    p.r = c[0]; p.g = c[1]; p.b = c[2];
  }
}, 30000);

// Spacebar to clear
window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);
  }
});
</script>
</body>
</html>
