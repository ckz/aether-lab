<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Flow — Generative Cosmos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #fff;
    cursor: crosshair;
  }
  canvas { display: block; }
  #info {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }
  #info h1 {
    font-size: 1.4em;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    text-shadow: 0 0 20px rgba(120,180,255,0.5);
  }
  #info p {
    font-size: 0.75em;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.15em;
    margin-top: 6px;
  }
  #stats {
    position: fixed;
    bottom: 15px;
    left: 20px;
    font-size: 0.65em;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.1em;
    z-index: 10;
    pointer-events: none;
  }
  #palette-info {
    position: fixed;
    bottom: 15px;
    right: 20px;
    font-size: 0.65em;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.1em;
    z-index: 10;
    pointer-events: none;
    text-align: right;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">
  <h1>Aether Flow</h1>
  <p>move your mouse · click to burst · space to change palette</p>
</div>
<div id="stats"></div>
<div id="palette-info"></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Palettes ---
const palettes = [
  { name: 'NEBULA',   colors: ['#ff6b9d','#c44dff','#6b5bff','#3d7aff','#00d4ff','#ff6b9d'] },
  { name: 'AURORA',   colors: ['#00ff87','#60efff','#0061ff','#a855f7','#00ff87','#60efff'] },
  { name: 'SOLAR',    colors: ['#ff4500','#ff8c00','#ffd700','#fff44f','#ff6a00','#ff4500'] },
  { name: 'OCEANIC',  colors: ['#0077b6','#00b4d8','#90e0ef','#caf0f8','#48cae4','#0077b6'] },
  { name: 'FOREST',   colors: ['#2d6a4f','#52b788','#95d5b2','#d8f3dc','#40916c','#1b4332'] },
  { name: 'EMBER',    colors: ['#370617','#6a040f','#9d0208','#d00000','#dc2f02','#e85d04'] },
  { name: 'FROST',    colors: ['#caf0f8','#ade8f4','#90e0ef','#48cae4','#0077b6','#03045e'] },
  { name: 'NEON',     colors: ['#ff00ff','#00ffff','#ff00aa','#00ff88','#ffff00','#ff00ff'] },
];
let paletteIdx = 0;
function palette() { return palettes[paletteIdx]; }

// --- Flow field using simplex-like noise ---
const perm = new Uint8Array(512);
(function initNoise() {
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [p[i], p[j]] = [p[j], p[i]];
  }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
})();

function noise2D(x, y) {
  const xi = Math.floor(x) & 255, yi = Math.floor(y) & 255;
  const xf = x - Math.floor(x), yf = y - Math.floor(y);
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = perm[xi] + yi, b = perm[xi + 1] + yi;
  const grad = (h, x, y) => { const g = h & 3; return ((g & 1) ? -x : x) + ((g & 2) ? -y : y); };
  return (1 - v) * ((1 - u) * grad(perm[a], xf, yf) + u * grad(perm[b], xf - 1, yf))
       + v * ((1 - u) * grad(perm[a + 1], xf, yf - 1) + u * grad(perm[b + 1], xf - 1, yf - 1));
}

function fbm(x, y, octaves = 4) {
  let val = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < octaves; i++) {
    val += amp * noise2D(x * freq, y * freq);
    amp *= 0.5; freq *= 2;
  }
  return val;
}

// --- Particles ---
const MAX_PARTICLES = 2000;
let particles = [];

class Particle {
  constructor(x, y, burst = false) {
    this.x = x !== undefined ? x : Math.random() * W;
    this.y = y !== undefined ? y : Math.random() * H;
    this.burst = burst;
    if (burst) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1;
      this.decay = Math.random() * 0.015 + 0.005;
      this.size = Math.random() * 2.5 + 1;
    } else {
      this.vx = 0;
      this.vy = 0;
      this.life = 1;
      this.decay = 0;
      this.size = Math.random() * 1.8 + 0.3;
    }
    this.colorIdx = Math.floor(Math.random() * (palette().colors.length - 1));
    this.speed = Math.random() * 1.5 + 0.5;
    this.turnRate = Math.random() * 0.02 + 0.005;
    this.angle = Math.random() * Math.PI * 2;
    this.noiseOffX = Math.random() * 1000;
    this.noiseOffY = Math.random() * 1000;
    this.history = [];
    this.maxHistory = burst ? 5 : 20;
  }
  update(time, mouse) {
    if (this.burst) {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.97;
      this.vy *= 0.97;
      this.life -= this.decay;
      return this.life > 0;
    }
    // Flow field angle
    const scale = 0.003;
    const n = fbm(this.x * scale + this.noiseOffX + time * 0.0001,
                  this.y * scale + this.noiseOffY + time * 0.0001, 4);
    let targetAngle = n * Math.PI * 4;

    // Mouse influence
    if (mouse.active) {
      const dx = mouse.x - this.x, dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 200) {
        const influence = 1 - dist / 200;
        targetAngle += Math.atan2(dy, dx) * influence * 2;
      }
    }

    // Smoothly rotate toward target
    let diff = targetAngle - this.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    this.angle += diff * this.turnRate;

    this.vx += Math.cos(this.angle) * 0.15;
    this.vy += Math.sin(this.angle) * 0.15;
    const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    const maxSpd = this.speed * 2;
    if (spd > maxSpd) { this.vx = (this.vx / spd) * maxSpd; this.vy = (this.vy / spd) * maxSpd; }

    this.x += this.vx;
    this.y += this.vy;

    // Wrap
    if (this.x < -10) this.x = W + 10;
    if (this.x > W + 10) this.x = -10;
    if (this.y < -10) this.y = H + 10;
    if (this.y > H + 10) this.y = -10;

    this.history.push({ x: this.x, y: this.y });
    if (this.history.length > this.maxHistory) this.history.shift();

    // Slowly cycle color
    this.colorIdx = (this.colorIdx + 0.001) % (palette().colors.length - 1);
    return true;
  }
  draw(ctx) {
    const col = palette().colors[Math.floor(this.colorIdx)];
    const alpha = this.burst ? this.life * 0.9 : 0.6;

    if (this.history.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.history[0].x, this.history[0].y);
      for (let i = 1; i < this.history.length; i++) {
        ctx.lineTo(this.history[i].x, this.history[i].y);
      }
      ctx.strokeStyle = col + Math.floor(alpha * 80).toString(16).padStart(2, '0');
      ctx.lineWidth = this.size * 0.6;
      ctx.stroke();
    }

    // Bright head
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * (this.burst ? this.life : 0.7), 0, Math.PI * 2);
    ctx.fillStyle = col + Math.floor(alpha * 200).toString(16).padStart(2, '0');
    ctx.fill();
  }
}

// --- Mouse ---
const mouse = { x: 0, y: 0, active: false };
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
canvas.addEventListener('mouseleave', () => { mouse.active = false; });
canvas.addEventListener('click', e => {
  const count = 60;
  for (let i = 0; i < count; i++) {
    if (particles.length < MAX_PARTICLES + 200) {
      particles.push(new Particle(e.clientX, e.clientY, true));
    }
  }
});

// --- Keyboard ---
window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    paletteIdx = (paletteIdx + 1) % palettes.length;
  }
});

// --- Init particles ---
for (let i = 0; i < 1200; i++) {
  particles.push(new Particle());
}

// --- Background fade ---
function drawBackground() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
  ctx.fillRect(0, 0, W, H);
}

// --- Animation ---
let frame = 0;
const statsEl = document.getElementById('stats');
const paletteEl = document.getElementById('palette-info');

function animate(time) {
  frame++;
  drawBackground();

  particles = particles.filter(p => p.update(time, mouse));
  particles.forEach(p => p.draw(ctx));

  // Maintain minimum particles
  while (particles.filter(p => !p.burst).length < 800) {
    particles.push(new Particle());
  }

  if (frame % 30 === 0) {
    statsEl.textContent = `particles: ${particles.length}`;
    paletteEl.textContent = `palette: ${palette().name}`;
  }

  requestAnimationFrame(animate);
}

// --- Seed canvas ---
ctx.fillStyle = '#000';
ctx.fillRect(0, 0, W, H);
requestAnimationFrame(animate);
</script>
</body>
</html>
