<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether Flow — Generative Art</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; cursor: crosshair; font-family: 'Courier New', monospace; }
    canvas { display: block; }
    #info {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.5); font-size: 12px; letter-spacing: 2px;
      pointer-events: none; text-align: center; z-index: 10;
      transition: opacity 2s;
    }
    #signature {
      position: fixed; bottom: 20px; right: 30px;
      color: rgba(255,255,255,0.15); font-size: 11px; letter-spacing: 3px;
      pointer-events: none;
    }
    #stats {
      position: fixed; bottom: 20px; left: 30px;
      color: rgba(255,255,255,0.2); font-size: 10px; letter-spacing: 1px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">MOVE YOUR CURSOR TO SCULPT THE FLOW</div>
  <div id="signature">✦ AETHER FLOW ✦</div>
  <div id="stats"></div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const info = document.getElementById('info');
    const stats = document.getElementById('stats');

    let W, H, particles, trails, mouse, frameCount = 0;
    const CONFIG = {
      particleCount: 900,
      trailLength: 28,
      connectionDist: 100,
      mouseRadius: 180,
      baseSpeed: 0.6,
      colorPalettes: [
        ['#ff006e', '#fb5607', '#ffbe0b', '#ff006e'],
        ['#00f5ff', '#00bbf9', '#9b5de5', '#00f5ff'],
        ['#06d6a0', '#118ab2', '#073b4c', '#06d6a0'],
        ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3'],
        ['#e0aaff', '#c77dff', '#9d4edd', '#7b2cbf'],
      ]
    };

    let palette = CONFIG.colorPalettes[Math.floor(Math.random() * CONFIG.colorPalettes.length)];
    mouse = { x: -9999, y: -9999, active: false };

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function lerpColor(a, b, t) {
      const ah = parseInt(a.slice(1), 16), bh = parseInt(b.slice(1), 16);
      const ar = (ah >> 16) & 0xff, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
      const br = (bh >> 16) & 0xff, bg_ = (bh >> 8) & 0xff, bb = bh & 0xff;
      const rr = Math.round(ar + (br - ar) * t);
      const rg = Math.round(ag + (bg_ - ag) * t);
      const rb = Math.round(ab + (bb - ab) * t);
      return `rgb(${rr},${rg},${rb})`;
    }

    function getColor(t) {
      const seg = t * (palette.length - 1);
      const i = Math.floor(seg);
      const f = seg - i;
      return lerpColor(palette[Math.min(i, palette.length - 1)], palette[Math.min(i + 1, palette.length - 1)], f);
    }

    class Particle {
      constructor() { this.reset(true); }
      reset(initial = false) {
        this.x = initial ? Math.random() * W : Math.random() * W;
        this.y = initial ? Math.random() * H : Math.random() * H;
        this.vx = (Math.random() - 0.5) * CONFIG.baseSpeed;
        this.vy = (Math.random() - 0.5) * CONFIG.baseSpeed;
        this.life = initial ? Math.random() * CONFIG.trailLength : CONFIG.trailLength;
        this.maxLife = CONFIG.trailLength;
        this.colorT = Math.random();
        this.size = 0.5 + Math.random() * 1.5;
        this.trail = [];
        this.angle = Math.random() * Math.PI * 2;
        this.angleSpeed = (Math.random() - 0.5) * 0.02;
        this.waveAmp = 0.3 + Math.random() * 0.7;
        this.waveFreq = 0.02 + Math.random() * 0.03;
        this.phase = Math.random() * Math.PI * 2;
      }
      update(t) {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > this.maxLife) this.trail.shift();

        this.angle += this.angleSpeed;
        this.colorT = (this.colorT + 0.001 + Math.sin(t * 0.001 + this.phase) * 0.0005) % 1;

        const waveX = Math.sin(t * this.waveFreq + this.phase) * this.waveAmp;
        const waveY = Math.cos(t * this.waveFreq * 1.3 + this.phase) * this.waveAmp;

        let fx = waveX * 0.15;
        let fy = waveY * 0.15;

        if (mouse.active) {
          const dx = this.x - mouse.x, dy = this.y - mouse.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < CONFIG.mouseRadius) {
            const force = (1 - dist / CONFIG.mouseRadius);
            const angle = Math.atan2(dy, dx);
            fx += Math.cos(angle + Math.PI * 0.5) * force * 2.5;
            fy += Math.sin(angle + Math.PI * 0.5) * force * 2.5;
            this.colorT = (this.colorT + force * 0.05) % 1;
          }
        }

        this.vx += fx * 0.04;
        this.vy += fy * 0.04;
        this.vx *= 0.97;
        this.vy *= 0.97;
        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        const maxSpeed = 3;
        if (speed > maxSpeed) {
          this.vx = (this.vx / speed) * maxSpeed;
          this.vy = (this.vy / speed) * maxSpeed;
        }
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < -20) this.x = W + 20;
        if (this.x > W + 20) this.x = -20;
        if (this.y < -20) this.y = H + 20;
        if (this.y > H + 20) this.y = -20;

        this.life--;
        if (this.life <= 0) this.reset();
      }
      draw() {
        if (this.trail.length < 2) return;
        for (let i = 1; i < this.trail.length; i++) {
          const alpha = (i / this.trail.length) * 0.6;
          const width = (i / this.trail.length) * this.size * 1.5;
          ctx.beginPath();
          ctx.moveTo(this.trail[i - 1].x, this.trail[i - 1].y);
          ctx.lineTo(this.trail[i].x, this.trail[i].y);
          ctx.strokeStyle = getColor(this.colorT + i * 0.008);
          ctx.globalAlpha = alpha;
          ctx.lineWidth = width;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    }

    function init() {
      resize();
      particles = Array.from({ length: CONFIG.particleCount }, () => new Particle());
      trails = [];
    }

    function drawConnections() {
      const step = 4;
      for (let i = 0; i < particles.length; i += step) {
        const p = particles[i];
        const distCheck = 60;
        for (let j = i + step; j < particles.length; j += step) {
          const q = particles[j];
          const dx = p.x - q.x, dy = p.y - q.y;
          const d = dx * dx + dy * dy;
          if (d < distCheck * distCheck) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            const alpha = (1 - Math.sqrt(d) / distCheck) * 0.12;
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = getColor((p.colorT + q.colorT) * 0.5);
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
      ctx.globalAlpha = 1;
    }

    function drawAmbientGlow(t) {
      const cx = W * 0.5 + Math.sin(t * 0.0003) * W * 0.15;
      const cy = H * 0.5 + Math.cos(t * 0.0004) * H * 0.1;
      const r = Math.min(W, H) * 0.35;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      const c1 = palette[0];
      const c2 = palette[2];
      grad.addColorStop(0, c1 + '18');
      grad.addColorStop(0.5, c2 + '08');
      grad.addColorStop(1, 'transparent');
      ctx.globalAlpha = 1;
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }

    function animate(t) {
      frameCount++;
      if (frameCount % 3 === 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.06)';
        ctx.fillRect(0, 0, W, H);
      }

      drawAmbientGlow(t);

      if (frameCount % 2 === 0) drawConnections();

      for (const p of particles) {
        p.update(t);
        p.draw();
      }

      if (mouse.active) {
        const grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, CONFIG.mouseRadius * 0.5);
        grad.addColorStop(0, palette[1] + '30');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.globalAlpha = 0.4;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, CONFIG.mouseRadius * 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      stats.textContent = `PARTICLES ${CONFIG.particleCount}  |  FRAME ${frameCount}`;
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      resize();
      palette = CONFIG.colorPalettes[Math.floor(Math.random() * CONFIG.colorPalettes.length)];
    });

    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
      info.style.opacity = '0';
    });
    window.addEventListener('mouseleave', () => { mouse.active = false; });
    window.addEventListener('touchmove', e => {
      mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true;
      info.style.opacity = '0';
    }, { passive: true });
    window.addEventListener('touchend', () => { mouse.active = false; });
    window.addEventListener('click', () => {
      palette = CONFIG.colorPalettes[Math.floor(Math.random() * CONFIG.colorPalettes.length)];
      for (const p of particles) { p.colorT = Math.random(); }
    });

    init();
    animate(0);
  </script>
</body>
</html>
