<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anchor Forge — Markdown TOC Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent2: #7ee787;
    --warn: #f0883e;
    --h1: #ff7b72;
    --h2: #ffa657;
    --h3: #7ee787;
    --h4: #58a6ff;
    --h5: #d2a8ff;
    --h6: #8b949e;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', monospace;
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .logo {
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 12px;
  }
  .spacer { flex: 1; }
  .btn-group { display: flex; gap: 6px; }
  button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    transition: all 0.15s;
  }
  button:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #1c2330;
  }
  button.primary {
    background: #238636;
    border-color: #238636;
    color: #fff;
    font-weight: 600;
  }
  button.primary:hover {
    background: #2ea043;
  }
  .stats {
    display: flex;
    gap: 14px;
    color: var(--muted);
    font-size: 11px;
  }
  .stat b { color: var(--accent2); }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    overflow: hidden;
  }
  .panel {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 14px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-header .dot {
    width: 8px; height: 8px; border-radius: 50%;
  }
  .dot-input { background: var(--accent); }
  .dot-output { background: var(--accent2); }
  textarea {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: none;
    padding: 14px;
    font-family: 'Fira Code', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.7;
    resize: none;
    outline: none;
    tab-size: 2;
  }
  textarea::placeholder { color: var(--muted); opacity: 0.6; }
  .output-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .toc-render {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
  }
  .toc-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .toc-list { list-style: none; }
  .toc-item {
    padding: 4px 0;
    border-bottom: 1px dotted #1e2430;
  }
  .toc-item:last-child { border-bottom: none; }
  .toc-link {
    color: var(--text);
    text-decoration: none;
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 3px 6px;
    border-radius: 3px;
    transition: background 0.1s;
  }
  .toc-link:hover {
    background: #1c2330;
    color: var(--accent);
  }
  .toc-num {
    color: var(--muted);
    font-size: 10px;
    min-width: 22px;
    text-align: right;
    flex-shrink: 0;
  }
  .toc-text { flex: 1; }
  .toc-h1 { color: var(--h1); font-weight: 700; }
  .toc-h2 { color: var(--h2); }
  .toc-h3 { color: var(--h3); }
  .toc-h4 { color: var(--h4); }
  .toc-h5 { color: var(--h5); }
  .toc-h6 { color: var(--h6); }
  .toc-depth { margin-left: 16px; }
  .toc-depth-2 { margin-left: 24px; }
  .toc-depth-3 { margin-left: 36px; }
  .toc-depth-4 { margin-left: 48px; }
  .toc-depth-5 { margin-left: 60px; }
  .toc-depth-6 { margin-left: 72px; }
  .copy-area {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 10px 14px;
  }
  .copy-area label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }
  .copy-area textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    font-family: 'Fira Code', monospace;
    font-size: 11px;
    color: var(--accent2);
    resize: none;
    height: 70px;
  }
  .copy-area textarea:focus {
    border-color: var(--accent);
    outline: none;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #238636;
    color: #fff;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
  .empty-state {
    color: var(--muted);
    text-align: center;
    padding: 40px 20px;
    font-style: italic;
  }
  .options-bar {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .toggle-label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
  }
  .toggle-label input { accent-color: var(--accent); }
  .depth-select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-family: inherit;
  }
  .format-select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-family: inherit;
  }
  footer {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 6px 20px;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 16px;
  }
  kbd {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
    font-family: inherit;
    font-size: 10px;
    color: var(--text);
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">⚒ Anchor Forge</div>
    <div class="subtitle">Markdown Table of Contents Generator</div>
  </div>
  <div class="spacer"></div>
  <div class="stats" id="stats">
    <div class="stat">Headings: <b id="stat-headings">0</b></div>
    <div class="stat">Sections: <b id="stat-depth">0</b></div>
  </div>
  <div class="options-bar">
    <label class="toggle-label">
      <input type="checkbox" id="opt-numbers" checked> Numbers
    </label>
    <label class="toggle-label">
      <input type="checkbox" id="opt-slug" checked> Slugs
    </label>
    <label class="toggle-label">
      Depth: <select class="depth-select" id="opt-depth">
        <option value="1">H1</option>
        <option value="2">H2</option>
        <option value="3" selected>H3</option>
        <option value="4">H4</option>
        <option value="5">H5</option>
        <option value="6">All</option>
      </select>
    </label>
    <label class="toggle-label">
      Format: <select class="depth-select" id="opt-format">
        <option value="markdown" selected>Markdown</option>
        <option value="html">HTML</option>
        <option value="bbcode">BBCode</option>
        <option value="rst">reStructuredText</option>
      </select>
    </label>
  </div>
  <div class="btn-group">
    <button onclick="loadSample()">📄 Sample</button>
    <button onclick="clearAll()">✕ Clear</button>
    <button class="primary" onclick="copyOutput()">⎘ Copy TOC</button>
  </div>
</header>

<main>
  <div class="panel">
    <div class="panel-header">
      <div class="dot dot-input"></div>
      Markdown Input
    </div>
    <textarea
      id="input"
      placeholder="# Paste your markdown here...

## The tool will:
- Detect all headings (H1–H6)
- Generate a linked table of contents
- Support multiple output formats

Try clicking 'Sample' to load an example!"
      spellcheck="false"
    ></textarea>
  </div>
  <div class="output-panel">
    <div class="panel-header">
      <div class="dot dot-output"></div>
      Table of Contents
    </div>
    <div class="toc-render" id="toc-render">
      <div class="empty-state">Paste markdown on the left to generate a TOC</div>
    </div>
    <div class="copy-area">
      <label>📋 TOC Source — click to select all, then copy</label>
      <textarea id="output" readonly placeholder="TOC will appear here..."></textarea>
    </div>
  </div>
</main>

<footer>
  <span><kbd>Tab</kbd> Indent</span>
  <span><kbd>Ctrl+↵</kbd> Generate</span>
  <span>Auto-generates as you type</span>
</footer>

<div class="toast" id="toast">Copied!</div>

<script>
const input = document.getElementById('input');
const output = document.getElementById('output');
const tocRender = document.getElementById('toc-render');
const optNumbers = document.getElementById('opt-numbers');
const optSlug = document.getElementById('opt-slug');
const optDepth = document.getElementById('opt-depth');
const optFormat = document.getElementById('opt-format');
const statHeadings = document.getElementById('stat-headings');
const statDepth = document.getElementById('stat-depth');

const SAMPLE_MD = `# The Hitchhiker's Guide to APIs

## Introduction
Welcome to this comprehensive guide on building and consuming REST APIs.

### What is an API?
An Application Programming Interface (API) is a set of protocols for building software.

### Why REST?
REST is stateless, scalable, and widely adopted.

## Authentication
Secure your API with proper authentication mechanisms.

### OAuth 2.0 Flow
OAuth 2.0 is the industry standard for authorization.

#### Authorization Code Grant
The most secure flow for server-side applications.

#### Client Credentials Grant
Used for machine-to-machine authentication.

### API Keys
Simple but less secure than OAuth.

## Rate Limiting
Protect your API from abuse and ensure fair usage.

### Token Bucket Algorithm
A classic algorithm for implementing rate limits.

### Exponential Backoff
Clients should back off when rate limited.

## Error Handling
Design consistent error responses.

### Standard Error Format
Use a consistent envelope for all error responses.

### HTTP Status Codes
Choose the right status code for each situation.

## Conclusion
Building great APIs requires attention to security, performance, and developer experience.`;

function loadSample() {
  input.value = SAMPLE_MD;
  generate();
}

function clearAll() {
  input.value = '';
  output.value = '';
  tocRender.innerHTML = '<div class="empty-state">Paste markdown on the left to generate a TOC</div>';
  statHeadings.textContent = '0';
  statDepth.textContent = '0';
}

function slugify(text) {
  return text
    .toLowerCase()
    .replace(/[^\w\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '');
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function parseHeadings(md) {
  const lines = md.split('\n');
  const headings = [];
  let counter = 0;

  for (const line of lines) {
    const match = line.match(/^(#{1,6})\s+(.+)/);
    if (match) {
      const level = match[1].length;
      const text = match[2].replace(/[*_`]/g, '').trim();
      const slug = slugify(text);
      counter++;
      headings.push({ level, text, slug, num: counter });
    }
  }
  return headings;
}

function generateMarkdown(headings, maxDepth) {
  const filtered = headings.filter(h => h.level <= maxDepth);
  let md = '## Table of Contents\n\n';
  for (const h of filtered) {
    const indent = '  '.repeat(h.level - 1);
    const num = optNumbers.checked ? `${h.num}.` : '';
    const slug = optSlug.checked ? `#${h.slug}` : '';
    md += `${indent}- ${num} [${h.text}](${slug})\n`;
  }
  return md;
}

function generateHtml(headings, maxDepth) {
  const filtered = headings.filter(h => h.level <= maxDepth);
  let html = '<nav class="toc">\n<h2>Table of Contents</h2>\n<ul>\n';
  for (const h of filtered) {
    html += `  <li class="toc-h${h.level}"><a href="#${h.slug}">${escapeHtml(h.text)}</a></li>\n`;
  }
  html += '</ul>\n</nav>';
  return html;
}

function generateBbcode(headings, maxDepth) {
  const filtered = headings.filter(h => h.level <= maxDepth);
  let bb = '[size=4]Table of Contents[/size]\n';
  for (const h of filtered) {
    const indent = '  '.repeat(h.level - 1);
    const num = optNumbers.checked ? `${h.num}.` : '';
    bb += `${indent}${num} [url=#${h.slug}]${h.text}[/url]\n`;
  }
  return bb;
}

function generateRst(headings, maxDepth) {
  const filtered = headings.filter(h => h.level <= maxDepth);
  let rst = '.. contents:: Table of Contents\n   :depth: ' + maxDepth + '\n   :local:\n\n';
  for (const h of filtered) {
    const indent = '  '.repeat(h.level - 1);
    const num = optNumbers.checked ? `${h.num}.` : '';
    rst += `${indent}${num} \`${h.text} <#${h.slug}>\`\n`;
  }
  return rst;
}

function renderToc(headings, maxDepth) {
  const filtered = headings.filter(h => h.level <= maxDepth);
  if (filtered.length === 0) {
    tocRender.innerHTML = '<div class="empty-state">No headings detected in this markdown</div>';
    return;
  }
  let html = '<div class="toc-title">📑 Table of Contents</div><ul class="toc-list">';
  for (const h of filtered) {
    const depthClass = h.level > 1 ? ` toc-depth-${h.level - 1}` : '';
    const headingClass = `toc-h${h.level}`;
    const numStr = optNumbers.checked ? `<span class="toc-num">${h.num}.</span>` : '';
    html += `<li class="toc-item${depthClass}">
      <a class="toc-link" href="#${h.slug}" title="${escapeHtml(h.text)}">
        ${numStr}
        <span class="toc-text ${headingClass}">${escapeHtml(h.text)}</span>
      </a>
    </li>`;
  }
  html += '</ul>';
  tocRender.innerHTML = html;

  // Make links functional within the preview
  tocRender.querySelectorAll('.toc-link').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      showToast('⚠ Preview mode — use the output source in your docs');
    });
  });
}

function generate() {
  const md = input.value;
  const maxDepth = parseInt(optDepth.value);
  const format = optFormat.value;

  const headings = parseHeadings(md);

  statHeadings.textContent = headings.length;
  statDepth.textContent = new Set(headings.map(h => h.level)).size;

  if (headings.length === 0) {
    output.value = '';
    tocRender.innerHTML = '<div class="empty-state">No headings detected yet...</div>';
    return;
  }

  let toc = '';
  switch (format) {
    case 'markdown': toc = generateMarkdown(headings, maxDepth); break;
    case 'html': toc = generateHtml(headings, maxDepth); break;
    case 'bbcode': toc = generateBbcode(headings, maxDepth); break;
    case 'rst': toc = generateRst(headings, maxDepth); break;
  }

  output.value = toc;
  renderToc(headings, maxDepth);
}

function copyOutput() {
  if (!output.value) return;
  output.select();
  document.execCommand('copy');
  showToast('✓ TOC copied to clipboard!');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

let debounce;
input.addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(generate, 150);
});

optNumbers.addEventListener('change', generate);
optSlug.addEventListener('change', generate);
optDepth.addEventListener('change', generate);
optFormat.addEventListener('change', generate);

input.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = input.selectionStart;
    const end = input.selectionEnd;
    input.value = input.value.substring(0, start) + '  ' + input.value.substring(end);
    input.selectionStart = input.selectionEnd = start + 2;
  }
});

// Load sample on startup
loadSample();
</script>
</body>
</html>
