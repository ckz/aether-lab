<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Flow — Generative Sky</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; cursor: crosshair; }
  canvas { display: block; }
  #info {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.5); font-size: 12px; letter-spacing: 2px;
    text-transform: uppercase; pointer-events: none; z-index: 10;
    text-shadow: 0 0 10px rgba(100,200,255,0.5);
  }
  #title {
    position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.15); font-size: 14px; letter-spacing: 6px;
    text-transform: uppercase; pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>
<div id="title">AURORA FLOW</div>
<canvas id="canvas"></canvas>
<div id="info">Click to plant lights · Move mouse to paint aurora · Keys 1-5 change palettes · Space to storm mode</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const mouse = { x: W / 2, y: H / 2, active: false };
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
});
canvas.addEventListener('mouseleave', () => mouse.active = false);
canvas.addEventListener('click', e => {
  for (let i = 0; i < 8; i++) {
    auroras.push(createAurora(e.clientX + (Math.random() - 0.5) * 60, e.clientY + (Math.random() - 0.5) * 40, true));
  }
});

const palettes = [
  { name: 'Arctic', colors: ['#00ff88', '#00ddff', '#0088ff', '#aa00ff', '#ff00aa'] },
  { name: 'Ember', colors: ['#ff6600', '#ff9900', '#ffcc00', '#ff3300', '#ff0066'] },
  { name: 'Deep Ocean', colors: ['#0033ff', '#0066ff', '#00ccff', '#00ffcc', '#0066aa'] },
  { name: 'Nebula', colors: ['#ff00ff', '#aa00ff', '#6600ff', '#0066ff', '#ff0066'] },
  { name: 'Forest', colors: ['#00ff44', '#44ff00', '#88ff00', '#00ff88', '#00ffcc'] }
];
let palette = palettes[0];

window.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '5') palette = palettes[parseInt(e.key) - 1];
  if (e.key === ' ') stormMode = !stormMode;
});

let stormMode = false;
const auroras = [];

function createAurora(x, y, burst = false) {
  const color = palette.colors[Math.floor(Math.random() * palette.colors.length)];
  return {
    x: x || Math.random() * W,
    y: y || Math.random() * H,
    vx: (Math.random() - 0.5) * 1.5,
    vy: burst ? (Math.random() - 0.5) * 2 : (Math.random() - 0.5) * 0.5 - 0.3,
    life: 1,
    decay: 0.0008 + Math.random() * 0.002,
    size: 2 + Math.random() * 5,
    color: color,
    hueShift: Math.random() * 60 - 30,
    pulse: Math.random() * Math.PI * 2,
    pulseSpeed: 0.02 + Math.random() * 0.03
  };
}

for (let i = 0; i < 60; i++) {
  auroras.push(createAurora());
}

function drawStars() {
  for (let i = 0; i < 80; i++) {
    const x = (Math.sin(i * 123.456) * 0.5 + 0.5) * W;
    const y = (Math.cos(i * 789.012) * 0.5 + 0.5) * H * 0.6;
    const brightness = 0.2 + Math.sin(Date.now() * 0.001 + i) * 0.15;
    ctx.fillStyle = `rgba(255, 255, 255, ${brightness})`;
    ctx.fillRect(x, y, 1.5, 1.5);
  }
}

function drawMountains() {
  ctx.fillStyle = '#0a0a12';
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) {
    const y = H * 0.75 + Math.sin(x * 0.008) * 30 + Math.sin(x * 0.02) * 15 + Math.cos(x * 0.005) * 20;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.fill();
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function animate() {
  ctx.fillStyle = 'rgba(0, 0, 3, 0.08)';
  ctx.fillRect(0, 0, W, H);

  drawStars();
  drawMountains();

  if (stormMode && Math.random() < 0.3) {
    auroras.push(createAurora(Math.random() * W, Math.random() * H * 0.7));
  }

  if (mouse.active && Math.random() < 0.4) {
    const a = createAurora(mouse.x + (Math.random() - 0.5) * 80, mouse.y + (Math.random() - 0.5) * 40);
    a.vy = (Math.random() - 0.5) * 1;
    auroras.push(a);
  }

  for (let i = auroras.length - 1; i >= 0; i--) {
    const p = auroras[i];
    p.life -= p.decay;
    p.x += p.vx;
    p.y += p.vy;
    p.pulse += p.pulseSpeed;

    if (stormMode) {
      p.vx += (Math.random() - 0.5) * 0.3;
      p.vy += (Math.random() - 0.5) * 0.3;
    }

    if (p.life <= 0 || p.y < -50 || p.y > H + 50 || p.x < -50 || p.x > W + 50) {
      auroras.splice(i, 1);
      continue;
    }

    const rgb = hexToRgb(p.color);
    const pulse = Math.sin(p.pulse) * 0.3 + 0.7;
    const alpha = p.life * pulse * 0.7;

    const size = p.size * (0.8 + pulse * 0.4);

    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 4);
    gradient.addColorStop(0, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alpha})`);
    gradient.addColorStop(0.3, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alpha * 0.4})`);
    gradient.addColorStop(1, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0)`);

    ctx.fillStyle = gradient;
    ctx.fillRect(p.x - size * 4, p.y - size * 4, size * 8, size * 8);

    ctx.fillStyle = `rgba(${Math.min(255, rgb.r + 100)}, ${Math.min(255, rgb.g + 100)}, ${Math.min(255, rgb.b + 100)}, ${alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  while (auroras.length < 50) {
    auroras.push(createAurora());
  }

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
