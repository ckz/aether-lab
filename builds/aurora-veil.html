<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Veil — Interactive Northern Lights</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #020210;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  .overlay {
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    text-align: center;
    pointer-events: none;
  }
  .overlay h1 {
    font-size: 1.4rem;
    font-weight: 300;
    letter-spacing: 8px;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 0 20px rgba(120,220,255,0.4);
    margin-bottom: 6px;
  }
  .overlay p {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.45);
    text-transform: uppercase;
  }
  .controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    pointer-events: all;
  }
  .controls button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.8);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.2s;
  }
  .controls button:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.3);
    color: #fff;
  }
  .controls button.active {
    background: rgba(100,200,255,0.15);
    border-color: rgba(100,200,255,0.4);
    color: #aef0ff;
  }
</style>
</head>
<body>
  <div class="overlay">
    <h1>AURORA VEIL</h1>
    <p>Move your mouse across the sky · Click for bursts · Space to pause</p>
  </div>
  <div class="controls">
    <button id="btnPalette" class="active">Palette: Arctic</button>
    <button id="btnSnow">Snow: ON</button>
    <button id="btnSpeed">Speed: 1x</button>
    <button id="btnClear">Clear Trails</button>
  </div>
  <canvas id="aurora"></canvas>

<script>
(() => {
  const canvas = document.getElementById('aurora');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- State ----
  let paused = false;
  let snowEnabled = true;
  let speedMultiplier = 1;
  let mouseX = W / 2, mouseY = H / 2;
  let mouseInfluence = 0;
  let time = 0;
  let burstParticles = [];

  const palettes = {
    arctic:  { name: 'Arctic',  colors: ['#00ffc8','#00b4ff','#7b2fff','#b967ff','#00ffa3'] },
    ember:   { name: 'Ember',   colors: ['#ff4d00','#ff8c00','#ff1a6c','#ff6eb4','#ffaa00'] },
    ghost:   { name: 'Ghost',   colors: ['#ffffff','#aaccff','#7799cc','#446688','#ddeeff'] },
    aurora:  { name: 'Aurora',  colors: ['#00ff87','#60efff','#ff60ff','#ffd700','#00ffc8'] },
    void:    { name: 'Void',    colors: ['#6a00ff','#b000ff','#ff00d4','#6e5cff','#d4aaff'] }
  };
  let currentPalette = 'arctic';
  let paletteKeys = Object.keys(palettes);
  let paletteIndex = 0;

  // ---- Stars ----
  const stars = [];
  for (let i = 0; i < 180; i++) {
    stars.push({
      x: Math.random() * 2000,
      y: Math.random() * 2000,
      r: Math.random() * 1.2 + 0.3,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005
    });
  }

  // ---- Snow ----
  const snowflakes = [];
  function spawnSnow(count) {
    for (let i = 0; i < count; i++) {
      snowflakes.push({
        x: Math.random() * W,
        y: Math.random() * H - H,
        r: Math.random() * 2 + 0.5,
        vx: (Math.random() - 0.5) * 0.3,
        vy: Math.random() * 0.6 + 0.2,
        opacity: Math.random() * 0.5 + 0.2
      });
    }
  }
  spawnSnow(120);

  // ---- Aurora ribbons ----
  class Ribbon {
    constructor(index) {
      this.index = index;
      this.yBase = H * 0.15 + (index / 6) * H * 0.45;
      this.amplitude = 30 + Math.random() * 50;
      this.frequency = 0.002 + Math.random() * 0.002;
      this.speed = 0.0004 + Math.random() * 0.0004;
      this.phase = Math.random() * Math.PI * 2;
      this.thickness = 40 + Math.random() * 70;
      this.opacity = 0.08 + Math.random() * 0.12;
      this.colorIndex = Math.floor(Math.random() * 5);
      this.drift = Math.random() * 0.0002 - 0.0001;
    }

    draw(t, palette) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const paletteColors = palette.colors;
      const segments = 80;

      for (let layer = 0; layer < 2; layer++) {
        const layerAlpha = layer === 0 ? this.opacity : this.opacity * 0.5;
        const ampMod = layer === 0 ? 1 : 1.4;
        const freqMod = layer === 0 ? 1 : 0.8;

        ctx.beginPath();
        const firstY = this.yBase + Math.sin(t * this.speed + this.phase) * this.amplitude * ampMod;
        ctx.moveTo(0, firstY);

        for (let i = 1; i <= segments; i++) {
          const x = (i / segments) * W;
          const wave1 = Math.sin(x * this.frequency * freqMod + t * this.speed + this.phase) * this.amplitude * ampMod;
          const wave2 = Math.sin(x * this.frequency * 0.5 + t * this.speed * 1.3) * this.amplitude * 0.4;
          const mouseEffect = mouseInfluence * Math.exp(-Math.pow((x - mouseX) / 200, 2)) * 60;
          const y = this.yBase + wave1 + wave2 - mouseEffect;
          ctx.lineTo(x, y);
        }

        // Complete the shape for fill
        ctx.lineTo(W, H);
        ctx.lineTo(0, H);
        ctx.closePath();

        const grad = ctx.createLinearGradient(0, this.yBase - this.thickness, 0, this.yBase + this.thickness * 3);
        const col = paletteColors[(this.colorIndex + Math.floor(t * 0.0001)) % paletteColors.length];
        grad.addColorStop(0, 'transparent');
        grad.addColorStop(0.3, col + Math.round(layerAlpha * 255).toString(16).padStart(2,'0'));
        grad.addColorStop(0.6, col + Math.round(layerAlpha * 1.8 * 255).toString(16).padStart(2,'0'));
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fill();
      }
      ctx.restore();
    }
  }

  const ribbons = [];
  for (let i = 0; i < 6; i++) ribbons.push(new Ribbon(i));

  // ---- Burst particles ----
  function addBurst(x, y, count) {
    const palette = palettes[currentPalette];
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      burstParticles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        life: 1,
        decay: Math.random() * 0.015 + 0.008,
        color: palette.colors[Math.floor(Math.random() * palette.colors.length)],
        r: Math.random() * 2.5 + 0.5
      });
    }
  }

  // ---- Controls ----
  const btnPalette = document.getElementById('btnPalette');
  const btnSnow = document.getElementById('btnSnow');
  const btnSpeed = document.getElementById('btnSpeed');
  const btnClear = document.getElementById('btnClear');

  btnPalette.addEventListener('click', () => {
    paletteIndex = (paletteIndex + 1) % paletteKeys.length;
    currentPalette = paletteKeys[paletteIndex];
    btnPalette.textContent = 'Palette: ' + palettes[currentPalette].name;
  });

  btnSnow.addEventListener('click', () => {
    snowEnabled = !snowEnabled;
    btnSnow.textContent = 'Snow: ' + (snowEnabled ? 'ON' : 'OFF');
    btnSnow.classList.toggle('active', snowEnabled);
    if (!snowEnabled) snowflakes.length = 0;
  });
  btnSnow.classList.add('active');

  const speeds = [0.5, 1, 1.5, 2];
  let speedIdx = 1;
  btnSpeed.addEventListener('click', () => {
    speedIdx = (speedIdx + 1) % speeds.length;
    speedMultiplier = speeds[speedIdx];
    btnSpeed.textContent = 'Speed: ' + speedMultiplier + 'x';
  });

  btnClear.addEventListener('click', () => {
    ctx.fillStyle = '#020210';
    ctx.fillRect(0, 0, W, H);
  });

  // ---- Input ----
  window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    mouseInfluence = Math.min(mouseInfluence + 0.05, 1);
  });
  window.addEventListener('touchmove', (e) => {
    if (e.touches[0]) {
      mouseX = e.touches[0].clientX;
      mouseY = e.touches[0].clientY;
      mouseInfluence = Math.min(mouseInfluence + 0.05, 1);
    }
  });
  window.addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    addBurst(e.clientX, e.clientY, 25);
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      paused = !paused;
    }
  });

  // ---- Main loop ----
  function frame() {
    requestAnimationFrame(frame);
    if (paused) return;

    const dt = speedMultiplier;
    time += dt;

    // Fade trail
    ctx.fillStyle = 'rgba(2, 2, 16, 0.12)';
    ctx.fillRect(0, 0, W, H);

    // Decay mouse influence
    mouseInfluence *= 0.995;

    // Stars
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    stars.forEach(s => {
      s.twinkle += s.speed * dt;
      const alpha = 0.3 + Math.sin(s.twinkle) * 0.3;
      ctx.fillStyle = `rgba(200,220,255,${Math.max(0, alpha)})`;
      ctx.beginPath();
      ctx.arc(s.x % W, s.y % H, s.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();

    // Aurora ribbons
    ribbons.forEach(r => r.draw(time, palettes[currentPalette]));

    // Snow
    if (snowEnabled) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = snowflakes.length - 1; i >= 0; i--) {
        const s = snowflakes[i];
        s.x += s.vx * dt + Math.sin(time * 0.001 + i) * 0.15;
        s.y += s.vy * dt;
        if (s.y > H + 10) { s.y = -10; s.x = Math.random() * W; }
        if (s.x < -10) s.x = W + 10;
        if (s.x > W + 10) s.x = -10;
        ctx.fillStyle = `rgba(200,230,255,${s.opacity})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Burst particles
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = burstParticles.length - 1; i >= 0; i--) {
      const p = burstParticles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 0.02 * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) { burstParticles.splice(i, 1); continue; }
      ctx.fillStyle = p.color + Math.round(p.life * 180).toString(16).padStart(2,'0');
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  frame();
})();
</script>
</body>
</html>
