<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Veil — Recursive Light Curtains</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050510;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #88a;
    cursor: crosshair;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
  }
  .hud {
    position: fixed;
    top: 20px;
    left: 24px;
    z-index: 10;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    pointer-events: none;
    text-shadow: 0 0 6px rgba(100, 180, 255, 0.4);
  }
  .hud h1 {
    font-size: 13px;
    color: #aef;
    margin-bottom: 6px;
    letter-spacing: 3px;
  }
  .hud p {
    color: #557;
    line-height: 1.7;
  }
  .controls {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 10;
    display: flex;
    gap: 8px;
  }
  .controls button {
    background: rgba(20, 30, 50, 0.7);
    border: 1px solid rgba(100, 160, 255, 0.3);
    color: #aef;
    padding: 8px 14px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(4px);
  }
  .controls button:hover {
    background: rgba(40, 70, 120, 0.7);
    border-color: rgba(100, 160, 255, 0.7);
    color: #fff;
  }
  .controls button.active {
    background: rgba(60, 120, 200, 0.5);
    border-color: rgba(100, 180, 255, 0.9);
  }
</style>
</head>
<body>
  <div class="hud">
    <h1>◈ Aurora Veil</h1>
    <p>Move mouse to sculpt light<br>Click to burst<br>Press 1-4 for palettes<br>Space to pause</p>
  </div>
  <div class="controls">
    <button id="btnPalette" onclick="cyclePalette()">Palette: Arctic</button>
    <button id="btnPause" onclick="togglePause()">Pause</button>
    <button onclick="clearRibbons()">Clear</button>
    <button onclick="burst()">Burst</button>
  </div>
  <canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const mouse = { x: W / 2, y: H / 2, active: false };
window.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
});
window.addEventListener('mouseleave', () => mouse.active = false);
window.addEventListener('click', burst);
window.addEventListener('keydown', e => {
  if (e.key === ' ') togglePause();
  if (e.key >= '1' && e.key <= '4') setPalette(parseInt(e.key) - 1);
});

// Palettes — each defines layers of aurora colors
const palettes = [
  { name: 'Arctic',   layers: [[100,220,255],[80,180,255],[140,255,200],[180,240,255],[60,140,220]] },
  { name: 'Nebula',   layers: [[200,100,255],[160,60,255],[255,80,200],[120,80,255],[220,140,255]] },
  { name: 'Ember',    layers: [[255,120,40],[255,180,60],[255,80,30],[255,200,100],[220,60,20]] },
  { name: 'Void',     layers: [[80,255,180],[40,200,255],[100,255,220],[60,180,255],[120,220,255]] },
];
let currentPalette = 0;
function cyclePalette() {
  currentPalette = (currentPalette + 1) % palettes.length;
  document.getElementById('btnPalette').textContent = 'Palette: ' + palettes[currentPalette].name;
}
function setPalette(i) {
  currentPalette = i;
  document.getElementById('btnPalette').textContent = 'Palette: ' + palettes[currentPalette].name;
}

let paused = false;
function togglePause() {
  paused = !paused;
  document.getElementById('btnPause').textContent = paused ? 'Play' : 'Pause';
}

// Simple 2D noise approximation using sine layering
function noise(x, y, t) {
  return (
    Math.sin(x * 0.008 + t * 0.4) * Math.cos(y * 0.006 + t * 0.3) +
    Math.sin((x + y) * 0.005 + t * 0.2) * 0.5 +
    Math.cos(x * 0.012 - t * 0.35) * Math.sin(y * 0.01 + t * 0.25) * 0.7
  ) / 2.2;
}

// Aurora ribbon class
class Ribbon {
  constructor(x, y, burst = false) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.originX = this.x;
    this.originY = this.y;
    this.points = [];
    this.life = 1.0;
    this.decay = burst ? 0.004 + Math.random() * 0.008 : 0.001 + Math.random() * 0.003;
    this.paletteIdx = Math.floor(Math.random() * palettes[currentPalette].layers.length);
    this.segments = 60 + Math.floor(Math.random() * 80);
    this.amplitude = 30 + Math.random() * 100;
    this.frequency = 0.015 + Math.random() * 0.04;
    this.speed = 0.3 + Math.random() * 0.8;
    this.phase = Math.random() * Math.PI * 2;
    this.thickness = 0.8 + Math.random() * 2.5;
    this.driftX = (Math.random() - 0.5) * 0.4;
    this.driftY = -0.2 - Math.random() * 0.6;
    this.mouseInfluence = 0.3 + Math.random() * 0.7;
    this.opacity = 0.15 + Math.random() * 0.45;
    this.width = 80 + Math.random() * 250;
    this.recursive = Math.random() < 0.35; // Some ribbons spawn sub-ribbons
    this.subSpawned = false;
    this.hueShift = (Math.random() - 0.5) * 30;
    for (let i = 0; i < this.segments; i++) {
      this.points.push({ x: this.x, y: this.y + i * 4, age: i * 0.02 });
    }
  }
  update(t) {
    this.life -= this.decay;
    this.x += this.driftX;
    this.y += this.driftY;
    this.phase += this.speed * 0.02;
    
    // Mouse influence — attract/repel ribbon
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 1;
      const force = this.mouseInfluence * 80 / dist;
      this.x += (dx / dist) * force * 0.1;
      this.y += (dy / dist) * force * 0.1;
    }
    
    // Recursive sub-ribbon spawning
    if (this.recursive && !this.subSpawned && this.life > 0.6 && Math.random() < 0.008) {
      this.subSpawned = true;
      for (let i = 0; i < 3; i++) {
        const sub = new Ribbon(this.x + (Math.random() - 0.5) * 60, this.y);
        sub.recursive = false;
        sub.amplitude *= 0.5;
        sub.width *= 0.5;
        sub.opacity *= 0.7;
        ribbons.push(sub);
      }
    }
    
    // Update points along the ribbon
    for (let i = 0; i < this.points.length; i++) {
      const p = this.points[i];
      const localX = this.x + (i / this.segments) * this.width - this.width / 2;
      const localY = this.y + i * 3 + Math.sin(this.phase + i * this.frequency) * this.amplitude;
      const n = noise(localX, localY + t * 30, t);
      p.x = localX + n * 80 + Math.sin(t + i * 0.1) * 20;
      p.y = localY + n * 40;
      p.age += 0.01;
    }
  }
  draw(ctx) {
    if (this.points.length < 2) return;
    const palette = palettes[currentPalette].layers[this.paletteIdx];
    const alpha = this.opacity * this.life;
    
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = this.thickness;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    // Draw ribbon as smooth curve with gradient
    for (let j = 0; j < 3; j++) {
      ctx.beginPath();
      ctx.moveTo(this.points[0].x, this.points[0].y);
      for (let i = 1; i < this.points.length - 2; i++) {
        const xc = (this.points[i].x + this.points[i + 1].x) / 2;
        const yc = (this.points[i].y + this.points[i + 1].y) / 2;
        ctx.quadraticCurveTo(this.points[i].x, this.points[i].y, xc, yc);
      }
      const r = palette[0] + this.hueShift * (j * 0.3);
      const g = palette[1] + this.hueShift * (j * 0.2);
      const b = palette[2];
      const a = alpha * (1 - j * 0.25);
      ctx.strokeStyle = `rgba(${r|0},${g|0},${b|0},${a})`;
      ctx.shadowColor = `rgba(${r|0},${g|0},${b|0},${a * 0.8})`;
      ctx.shadowBlur = 20 + j * 10;
      ctx.stroke();
    }
    
    ctx.restore();
  }
  dead() { return this.life <= 0 || this.y < -200 || this.y > H + 200; }
}

let ribbons = [];
const MAX_RIBBONS = 180;

function spawnRibbon(x, y) {
  if (ribbons.length < MAX_RIBBONS) {
    ribbons.push(new Ribbon(x, y));
  }
}

function burst() {
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 2;
    const dist = 50 + Math.random() * 150;
    spawnRibbon(mouse.x + Math.cos(angle) * dist, mouse.y + Math.sin(angle) * dist);
  }
}

function clearRibbons() {
  ribbons = [];
}

// Auto-spawn ribbons
let lastSpawn = 0;
let t = 0;

function loop(ts) {
  requestAnimationFrame(loop);
  if (paused) return;
  
  t = ts * 0.001;
  
  // Fade background for trail effect
  ctx.fillStyle = 'rgba(5, 5, 16, 0.06)';
  ctx.fillRect(0, 0, W, H);
  
  // Auto-spawn
  if (t - lastSpawn > 0.15) {
    lastSpawn = t;
    if (ribbons.length < MAX_RIBBONS * 0.8) {
      spawnRibbon(Math.random() * W, H + 50);
    }
  }
  
  // Mouse spawn
  if (mouse.active && Math.random() < 0.25) {
    spawnRibbon(mouse.x + (Math.random() - 0.5) * 100, mouse.y + (Math.random() - 0.5) * 60);
  }
  
  // Update & draw
  ctx.save();
  for (let i = ribbons.length - 1; i >= 0; i--) {
    ribbons[i].update(t);
    ribbons[i].draw(ctx);
    if (ribbons[i].dead()) ribbons.splice(i, 1);
  }
  ctx.restore();
}

requestAnimationFrame(loop);
</script>
</body>
</html>
