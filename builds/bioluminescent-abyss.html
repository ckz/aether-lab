<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bioluminescent Abyss</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000810;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: none;
  }
  canvas { display: block; }
  #hud {
    position: fixed;
    top: 20px;
    left: 20px;
    color: rgba(100, 255, 200, 0.6);
    font-size: 11px;
    letter-spacing: 2px;
    pointer-events: none;
    z-index: 10;
    line-height: 1.8;
  }
  #depth {
    position: fixed;
    bottom: 30px;
    right: 30px;
    color: rgba(100, 200, 255, 0.4);
    font-size: 10px;
    letter-spacing: 3px;
    pointer-events: none;
    z-index: 10;
  }
  #species-count {
    position: fixed;
    top: 20px;
    right: 20px;
    color: rgba(200, 255, 150, 0.4);
    font-size: 10px;
    letter-spacing: 2px;
    pointer-events: none;
    z-index: 10;
    text-align: right;
    line-height: 1.8;
  }
  #sonar {
    position: fixed;
    bottom: 30px;
    left: 30px;
    width: 120px;
    height: 120px;
    border: 1px solid rgba(100, 255, 200, 0.15);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10;
  }
  #sonar::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 4px;
    background: rgba(100, 255, 200, 0.8);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div>◆ DEEP SEA OBSERVATORY</div>
  <div id="depth-display">DEPTH: 2,847m</div>
</div>
<div id="depth">▲ SURFACE</div>
<div id="species-count">
  <div id="creature-count">ORGANISMS: 0</div>
  <div id="flash-count">BIOFLASHES: 0</div>
</div>
<div id="sonar"></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Mouse as submersible light
let mouse = { x: W/2, y: H/2, active: false };
window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
window.addEventListener('mouseleave', () => mouse.active = false);

// Deep sea creature types
const SPECIES = [
  { name: 'JELLYFISH', color: [100, 200, 255], size: [8, 25], speed: [0.2, 0.6], pulse: 0.02, flashRate: 0.003, trail: 0.92 },
  { name: 'ANGEL', color: [180, 220, 255], size: [5, 15], speed: [0.3, 0.9], pulse: 0.03, flashRate: 0.005, trail: 0.94 },
  { name: 'SIPHON', color: [100, 255, 200], size: [4, 12], speed: [0.4, 1.0], pulse: 0.04, flashRate: 0.008, trail: 0.90 },
  { name: 'PLANKTON', color: [255, 255, 150], size: [1, 4], speed: [0.1, 0.4], pulse: 0.01, flashRate: 0.015, trail: 0.85 },
  { name: 'VIOLET', color: [200, 150, 255], size: [6, 18], speed: [0.2, 0.7], pulse: 0.025, flashRate: 0.004, trail: 0.93 },
  { name: 'REDGHOST', color: [255, 100, 100], size: [10, 30], speed: [0.1, 0.4], pulse: 0.015, flashRate: 0.002, trail: 0.96 },
  { name: 'GREENFLICKER', color: [150, 255, 100], size: [3, 8], speed: [0.5, 1.2], pulse: 0.05, flashRate: 0.02, trail: 0.88 },
  { name: 'CORALSPARK', color: [255, 180, 120], size: [2, 6], speed: [0.15, 0.5], pulse: 0.03, flashRate: 0.01, trail: 0.91 },
];

class Creature {
  constructor() {
    this.reset();
    this.x = Math.random() * W;
    this.y = Math.random() * H;
  }

  reset() {
    const species = SPECIES[Math.floor(Math.random() * SPECIES.length)];
    this.species = species.name;
    this.r = species.color[0];
    this.g = species.color[1];
    this.b = species.color[2];
    this.size = species.size[0] + Math.random() * (species.size[1] - species.size[0]);
    this.speed = species.speed[0] + Math.random() * (species.speed[1] - species.speed[0]);
    this.pulseRate = species.pulse * (0.5 + Math.random());
    this.flashRate = species.flashRate;
    this.trailFade = species.trail;
    this.angle = Math.random() * Math.PI * 2;
    this.angleSpeed = (Math.random() - 0.5) * 0.02;
    this.phase = Math.random() * Math.PI * 2;
    this.flashTimer = Math.random() * 1000;
    this.brightness = 0;
    this.depthOffset = (Math.random() - 0.5) * 0.5;
    this.wanderAngle = Math.random() * Math.PI * 2;
    this.history = [];
    this.maxHistory = Math.floor(5 + Math.random() * 20);
  }

  update(depth) {
    // Gentle wandering
    this.wanderAngle += (Math.random() - 0.5) * 0.1;
    this.angle += this.angleSpeed + Math.sin(this.wanderAngle) * 0.01;

    // Depth affects speed (slower at depth)
    const depthFactor = 1 - Math.abs(this.depthOffset) * 0.3;
    const vx = Math.cos(this.angle) * this.speed * depthFactor;
    const vy = Math.sin(this.angle) * this.speed * depthFactor;

    this.x += vx;
    this.y += vy;

    // Store trail
    this.history.push({ x: this.x, y: this.y });
    if (this.history.length > this.maxHistory) this.history.shift();

    // Repel from submersible light
    if (mouse.active) {
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 200) {
        const force = (200 - dist) / 200 * 0.5;
        this.x += (dx / dist) * force;
        this.y += (dy / dist) * force;
        this.angle = Math.atan2(dy, dx);
      }
    }

    // Wrap around
    const margin = 50;
    if (this.x < -margin) this.x = W + margin;
    if (this.x > W + margin) this.x = -margin;
    if (this.y < -margin) this.y = H + margin;
    if (this.y > H + margin) this.y = -margin;

    // Pulse
    this.phase += this.pulseRate;
    this.pulse = 0.5 + 0.5 * Math.sin(this.phase);

    // Flash timer
    this.flashTimer--;
    if (this.flashTimer <= 0) {
      this.brightness = 1;
      this.flashTimer = 50 + Math.random() / this.flashRate;
      bioflashCount++;
    }
    this.brightness *= 0.95;

    // Depth-based size modulation
    this.currentSize = this.size * (1 + depth * 0.2) * (0.8 + 0.2 * this.pulse);
  }

  draw(ctx, depth) {
    const alpha = 0.3 + this.pulse * 0.4 + this.brightness * 0.5;
    const flashAlpha = this.brightness * 0.8;

    // Trail
    if (this.history.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.history[0].x, this.history[0].y);
      for (let i = 1; i < this.history.length; i++) {
        ctx.lineTo(this.history[i].x, this.history[i].y);
      }
      ctx.strokeStyle = `rgba(${this.r}, ${this.g}, ${this.b}, ${alpha * 0.2})`;
      ctx.lineWidth = this.currentSize * 0.3;
      ctx.stroke();
    }

    // Body glow
    const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.currentSize * 3);
    glow.addColorStop(0, `rgba(${this.r}, ${this.g}, ${this.b}, ${alpha})`);
    glow.addColorStop(0.3, `rgba(${this.r}, ${this.g}, ${this.b}, ${alpha * 0.4})`);
    glow.addColorStop(1, `rgba(${this.r}, ${this.g}, ${this.b}, 0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.currentSize * 3, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = `rgba(${Math.min(255, this.r + 100)}, ${Math.min(255, this.g + 100)}, ${Math.min(255, this.b + 100)}, ${Math.min(1, alpha + flashAlpha)})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.currentSize * 0.5, 0, Math.PI * 2);
    ctx.fill();

    // Flash burst
    if (this.brightness > 0.3) {
      const flashGlow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.currentSize * 8);
      flashGlow.addColorStop(0, `rgba(${this.r}, ${this.g}, ${this.b}, ${this.brightness * 0.6})`);
      flashGlow.addColorStop(1, `rgba(${this.r}, ${this.g}, ${this.b}, 0)`);
      ctx.fillStyle = flashGlow;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.currentSize * 8, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// Marine snow particles
class MarineSnow {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.size = 0.5 + Math.random() * 1.5;
    this.speed = 0.1 + Math.random() * 0.3;
    this.drift = (Math.random() - 0.5) * 0.2;
    this.alpha = 0.1 + Math.random() * 0.2;
  }

  update() {
    this.y += this.speed;
    this.x += this.drift + Math.sin(Date.now() * 0.001 + this.x) * 0.1;
    if (this.y > H) { this.y = 0; this.x = Math.random() * W; }
    if (this.x < 0) this.x = W;
    if (this.x > W) this.x = 0;
  }

  draw(ctx) {
    ctx.fillStyle = `rgba(200, 220, 255, ${this.alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Vent particles (hydrothermal)
class VentParticle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = -1 - Math.random() * 2;
    this.life = 1;
    this.decay = 0.003 + Math.random() * 0.005;
    this.size = 2 + Math.random() * 4;
    this.color = Math.random() < 0.5 ? [255, 140, 50] : [200, 200, 200];
  }

  update() {
    this.x += this.vx + Math.sin(Date.now() * 0.002 + this.x) * 0.3;
    this.y += this.vy;
    this.life -= this.decay;
    this.size *= 0.998;
  }

  draw(ctx) {
    const alpha = this.life * 0.5;
    ctx.fillStyle = `rgba(${this.color[0]}, ${this.color[1]}, ${this.color[2]}, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Initialize creatures
const creatures = [];
const NUM_CREATURES = 120;
for (let i = 0; i < NUM_CREATURES; i++) {
  creatures.push(new Creature());
}

const marineSnow = [];
for (let i = 0; i < 200; i++) {
  marineSnow.push(new MarineSnow());
}

let ventParticles = [];
let vents = [];
function addVent() {
  vents.push({
    x: Math.random() * W,
    y: H * (0.6 + Math.random() * 0.4),
    rate: 2 + Math.random() * 3
  });
}
addVent();

let bioflashCount = 0;
let frameCount = 0;
let depth = 0;
let depthDirection = 1;

function animate() {
  // Depth cycle (simulates submersible slowly descending)
  depth += 0.0003 * depthDirection;
  if (depth > 1) depthDirection = -1;
  if (depth < 0) depthDirection = 1;

  // Fade with trail effect
  ctx.fillStyle = `rgba(0, 8, 16, 0.12)`;
  ctx.fillRect(0, 0, W, H);

  // Occasional full clear to prevent mud
  if (frameCount % 600 === 0) {
    ctx.fillStyle = 'rgba(0, 8, 16, 0.5)';
    ctx.fillRect(0, 0, W, H);
  }

  // Marine snow
  marineSnow.forEach(s => { s.update(); s.draw(ctx); });

  // Vent particles
  vents.forEach(vent => {
    if (Math.random() < vent.rate * 0.1) {
      ventParticles.push(new VentParticle(vent.x, vent.y));
    }
  });
  ventParticles = ventParticles.filter(p => p.life > 0);
  ventParticles.forEach(p => { p.update(); p.draw(ctx); });

  // Submersible light cone
  if (mouse.active) {
    const lightGrad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 250);
    lightGrad.addColorStop(0, 'rgba(100, 200, 255, 0.03)');
    lightGrad.addColorStop(0.5, 'rgba(100, 200, 255, 0.01)');
    lightGrad.addColorStop(1, 'rgba(100, 200, 255, 0)');
    ctx.fillStyle = lightGrad;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 250, 0, Math.PI * 2);
    ctx.fill();

    // Light cone downward
    ctx.fillStyle = 'rgba(100, 200, 255, 0.008)';
    ctx.beginPath();
    ctx.moveTo(mouse.x, mouse.y);
    ctx.lineTo(mouse.x - 100, mouse.y + 400);
    ctx.lineTo(mouse.x + 100, mouse.y + 400);
    ctx.closePath();
    ctx.fill();
  }

  // Creatures
  const currentDepth = Math.sin(depth * Math.PI) * 0.5 + 0.5;
  creatures.forEach(c => {
    c.update(currentDepth);
    c.draw(ctx, currentDepth);
  });

  // Update HUD
  const depthMeters = Math.floor(2000 + currentDepth * 3000);
  document.getElementById('depth-display').textContent = `DEPTH: ${depthMeters.toLocaleString()}m`;
  document.getElementById('creature-count').textContent = `ORGANISMS: ${creatures.length}`;
  document.getElementById('flash-count').textContent = `BIOFLASHES: ${bioflashCount}`;

  // Depth color shift based on depth
  const depthHue = 200 + currentDepth * 40;
  document.body.style.background = `hsl(${depthHue}, 80%, ${2 + currentDepth * 3}%)`;

  frameCount++;
  requestAnimationFrame(animate);
}

animate();

// Click adds a burst of creatures
window.addEventListener('click', e => {
  for (let i = 0; i < 8; i++) {
    const c = new Creature();
    c.x = e.clientX + (Math.random() - 0.5) * 40;
    c.y = e.clientY + (Math.random() - 0.5) * 40;
    c.brightness = 1;
    creatures.push(c);
  }
  // Keep population in check
  while (creatures.length > 200) {
    creatures.shift();
  }
});

// Space to add vent
window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    addVent();
  }
});
</script>
</body>
</html>
