<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bioluminescent Flow Field</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #02040a;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    top: 20px;
    left: 20px;
    color: rgba(180, 220, 255, 0.8);
    font-size: 12px;
    pointer-events: none;
    z-index: 10;
    text-shadow: 0 0 8px rgba(100, 180, 255, 0.6);
  }
  #ui h1 {
    font-size: 16px;
    margin-bottom: 8px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(200, 230, 255, 0.9);
  }
  #ui .stat { margin: 3px 0; opacity: 0.7; }
  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 10;
  }
  #controls button {
    background: rgba(10, 20, 40, 0.7);
    border: 1px solid rgba(100, 180, 255, 0.3);
    color: rgba(200, 230, 255, 0.9);
    padding: 8px 16px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s;
    backdrop-filter: blur(10px);
  }
  #controls button:hover {
    background: rgba(30, 60, 120, 0.7);
    border-color: rgba(150, 220, 255, 0.6);
    box-shadow: 0 0 20px rgba(100, 180, 255, 0.3);
  }
  #hint {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(150, 200, 255, 0.5);
    font-size: 11px;
    letter-spacing: 2px;
    pointer-events: none;
    z-index: 10;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="ui">
  <h1>✦ Bioluminescent Flow Field ✦</h1>
  <div class="stat">Particles: <span id="count">0</span></div>
  <div class="stat">Mode: <span id="mode">Drift</span></div>
  <div class="stat">FPS: <span id="fps">0</span></div>
</div>
<div id="hint">Move mouse to attract · Click to burst · Press 1-4 for modes</div>
<div id="controls">
  <button onclick="setMode('drift')">Drift</button>
  <button onclick="setMode('vortex')">Vortex</button>
  <button onclick="setMode('pulse')">Pulse</button>
  <button onclick="setMode('storm')">Storm</button>
  <button onclick="resetField()">Reset</button>
</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const mouse = { x: W/2, y: H/2, active: false };
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => mouse.active = false);
canvas.addEventListener('click', e => {
  for (let i = 0; i < 80; i++) {
    particles.push(createParticle(e.clientX, e.clientY, true));
  }
});

let mode = 'drift';
function setMode(m) {
  mode = m;
  document.getElementById('mode').textContent = m.charAt(0).toUpperCase() + m.slice(1);
}
window.addEventListener('keydown', e => {
  const modes = ['drift', 'vortex', 'pulse', 'storm'];
  if (e.key >= '1' && e.key <= '4') setMode(modes[+e.key - 1]);
  if (e.key === 'r') resetField();
});

function resetField() {
  particles = [];
  for (let i = 0; i < 800; i++) particles.push(createParticle());
}

// Color palettes for different modes
const palettes = {
  drift:  [180, 220, 255],   // icy blue
  vortex: [255, 150, 200],   // magenta
  pulse:  [150, 255, 200],   // bioluminescent green
  storm:  [255, 220, 120]    // golden
};

function createParticle(x, y, burst = false) {
  const palette = palettes[mode];
  return {
    x: x ?? Math.random() * W,
    y: y ?? Math.random() * H,
    vx: burst ? (Math.random() - 0.5) * 8 : (Math.random() - 0.5) * 0.5,
    vy: burst ? (Math.random() - 0.5) * 8 : (Math.random() - 0.5) * 0.5,
    life: 1,
    decay: burst ? 0.008 + Math.random() * 0.015 : 0.0003 + Math.random() * 0.0008,
    size: burst ? 1.5 + Math.random() * 2.5 : 0.5 + Math.random() * 1.5,
    hueShift: Math.random() * 40 - 20,
    palette: palette
  };
}

let particles = [];
resetField();

// Simplex-like noise approximation
function noise(x, y, t) {
  return Math.sin(x * 0.008 + t) * Math.cos(y * 0.006 + t * 0.7) +
         Math.sin((x + y) * 0.004 + t * 0.5) * 0.5;
}

let time = 0;
let lastTime = performance.now();
let frameCount = 0;
let fpsTime = 0;

function animate() {
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 16.67, 3);
  lastTime = now;
  time += 0.003 * dt;
  
  frameCount++;
  fpsTime += now - (lastTime - dt * 16.67);
  if (frameCount % 30 === 0) {
    document.getElementById('fps').textContent = Math.round(1000 / ((now - fpsTime) / 30 || 16));
    fpsTime = now;
  }

  // Trail fade
  ctx.fillStyle = 'rgba(2, 4, 10, 0.06)';
  ctx.fillRect(0, 0, W, H);

  const palette = palettes[mode];

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    
    // Flow field
    const n = noise(p.x, p.y, time);
    let angle = n * Math.PI * 2;
    
    // Mode-specific behavior
    if (mode === 'vortex') {
      const cx = W/2, cy = H/2;
      const dx = p.x - cx, dy = p.y - cy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      angle += Math.atan2(dy, dx) + Math.PI/2 + Math.sin(dist * 0.005 - time * 2) * 0.5;
    } else if (mode === 'pulse') {
      angle += Math.sin(time * 3 + p.x * 0.01) * 1.5;
    } else if (mode === 'storm') {
      angle += Math.sin(time * 5 + p.y * 0.02) * 2;
    }

    // Mouse attraction
    if (mouse.active) {
      const dx = mouse.x - p.x, dy = mouse.y - p.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 200) {
        const force = (200 - dist) / 200 * 0.15;
        p.vx += (dx / dist) * force;
        p.vy += (dy / dist) * force;
      }
    }

    p.vx += Math.cos(angle) * 0.15 * dt;
    p.vy += Math.sin(angle) * 0.15 * dt;
    p.vx *= 0.98;
    p.vy *= 0.98;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= p.decay * dt;

    // Wrap
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;
    if (p.y < -10) p.y = H + 10;
    if (p.y > H + 10) p.y = -10;

    if (p.life <= 0) {
      particles[i] = createParticle();
      continue;
    }

    const alpha = p.life * 0.7;
    const [r, g, b] = p.palette;
    const hs = p.hueShift;
    
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r + hs}, ${g + hs * 0.5}, ${b}, ${alpha})`;
    ctx.fill();

    // Glow
    if (p.size > 1 && Math.random() < 0.02) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 4 * p.life, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.08})`;
      ctx.fill();
    }
  }

  // Maintain particle count
  while (particles.length < 800) particles.push(createParticle());
  
  document.getElementById('count').textContent = particles.length;
  
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
