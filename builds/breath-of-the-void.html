<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breath of the Void</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05050a; }
  canvas { display: block; cursor: none; }
  #ui {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
    font-family: 'Courier New', monospace;
  }
  #score {
    position: absolute; top: 24px; left: 28px;
    font-size: .8rem; letter-spacing: .25em; color: rgba(180,200,255,.7);
    text-transform: uppercase;
  }
  #score .val { color: rgba(220,235,255,.95); font-size: 1.3rem; }
  #energy {
    position: absolute; top: 28px; right: 28px;
    width: 120px; height: 6px; border-radius: 3px;
    background: rgba(30,25,60,.6); border: 1px solid rgba(100,90,180,.25);
    overflow: hidden;
  }
  #energy-fill {
    height: 100%; width: 100%; border-radius: 3px;
    background: linear-gradient(90deg, #4af,#a4f,#f4a);
    transition: width .1s;
  }
  #combo {
    position: absolute; top: 46px; right: 28px;
    font-size: .65rem; letter-spacing: .2em; color: rgba(255,200,120,.85);
    opacity: 0; transition: opacity .3s;
  }
  #overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: auto;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 2rem; letter-spacing: .4em; color: rgba(200,220,255,.9);
    margin-bottom: 8px; text-transform: uppercase;
  }
  #overlay .sub {
    font-size: .7rem; letter-spacing: .2em; color: rgba(160,180,255,.5);
    margin-bottom: 40px; text-transform: uppercase;
  }
  #overlay .final {
    font-size: .9rem; color: rgba(200,220,255,.8); letter-spacing: .15em;
    margin-bottom: 30px;
  }
  #overlay button {
    background: transparent; border: 1px solid rgba(140,120,255,.4);
    color: rgba(200,220,255,.85); padding: 14px 36px;
    font-family: 'Courier New', monospace; font-size: .75rem;
    letter-spacing: .25em; text-transform: uppercase; cursor: pointer;
    border-radius: 3px; transition: all .3s;
  }
  #overlay button:hover {
    background: rgba(80,60,180,.2); border-color: rgba(180,150,255,.7);
    box-shadow: 0 0 30px rgba(100,80,220,.2);
  }
  #hint {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-size: .6rem; letter-spacing: .2em; color: rgba(140,160,220,.35);
    text-transform: uppercase;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <div id="score">Score<br><span class="val" id="score-val">0</span></div>
  <div id="energy"><div id="energy-fill"></div></div>
  <div id="combo">COMBO x<span id="combo-val">0</span></div>
  <div id="overlay">
    <h1>Breath of the Void</h1>
    <div class="sub">Move to guide · Click to pulse</div>
    <div class="final" id="final-score"></div>
    <button id="start-btn">Begin</button>
  </div>
  <div id="hint">collect motes · pulse shadows · survive</div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const state = {
  running: false,
  score: 0,
  combo: 0,
  comboTimer: 0,
  energy: 1,
  maxEnergy: 1,
  energyRegen: 0.012,
  pulseCost: 0.25,
  time: 0,
  difficulty: 1,
  mouseX: W/2, mouseY: H/2,
  keys: {},
};

const player = {
  x: W/2, y: H/2, r: 10,
  vx: 0, vy: 0,
  trail: [],
  pulseRings: [],
  glowPhase: 0,
};

let shadows = [];
let motes = [];
let stars = [];
let particles = [];
let comboSparks = 0;

// Init starfield
for (let i = 0; i < 200; i++) {
  stars.push({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.2 + 0.2,
    a: Math.random() * 0.6 + 0.2,
    twinkle: Math.random() * Math.PI * 2,
  });
}

function spawnShadow() {
  // Spawn from edge
  let x, y;
  const side = Math.floor(Math.random() * 4);
  if (side === 0) { x = Math.random() * W; y = -30; }
  else if (side === 1) { x = W + 30; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H + 30; }
  else { x = -30; y = Math.random() * H; }
  const tier = Math.random() < 0.08 + state.difficulty * 0.01 ? 'fast' :
               Math.random() < 0.15 ? 'large' : 'normal';
  const speeds = { normal: 0.8 + Math.random() * 1.2, fast: 2.5 + Math.random() * 2, large: 0.4 + Math.random() * 0.6 };
  const sizes = { normal: 6 + Math.random() * 8, fast: 4 + Math.random() * 5, large: 14 + Math.random() * 12 };
  shadows.push({
    x, y, tier,
    r: sizes[tier],
    speed: speeds[tier],
    hp: tier === 'large' ? 3 : 1,
    phase: Math.random() * Math.PI * 2,
    trail: [],
  });
}

function spawnMote() {
  if (motes.length > 15) return;
  motes.push({
    x: Math.random() * (W - 100) + 50,
    y: Math.random() * (H - 100) + 50,
    r: 4 + Math.random() * 3,
    phase: Math.random() * Math.PI * 2,
    hue: Math.random() < 0.5 ? 200 : 280,
    life: 600 + Math.random() * 400,
  });
}

function emitParticles(x, y, count, color, opts = {}) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (opts.speed || 2) * (0.5 + Math.random() * 0.5);
    particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: (opts.life || 30) * (0.7 + Math.random() * 0.3),
      maxLife: opts.life || 30,
      r: (opts.r || 1.5) * (0.5 + Math.random() * 0.5),
      color,
      gravity: opts.gravity || 0,
    });
  }
}

function pulse() {
  if (state.energy < state.pulseCost || !state.running) return;
  state.energy -= state.pulseCost;
  const pr = { x: player.x, y: player.y, r: 0, maxR: 180, alpha: 0.7, speed: 6 };
  player.pulseRings.push(pr);
  emitParticles(player.x, player.y, 25, `rgba(160,200,255,`, { speed: 4, life: 20, r: 2 });
  // Hit shadows
  let hits = 0;
  shadows.forEach(s => {
    const dx = s.x - player.x, dy = s.y - player.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < pr.maxR && dist > 0) {
      const force = (1 - dist / pr.maxR) * 12;
      s.x += (dx / dist) * force;
      s.y += (dy / dist) * force;
      s.hp--;
      hits++;
      emitParticles(s.x, s.y, 5, `rgba(255,180,100,`, { speed: 2, life: 15 });
      if (s.hp <= 0) {
        emitParticles(s.x, s.y, 15, `rgba(255,150,80,`, { speed: 3, life: 25 });
        state.score += s.tier === 'large' ? 50 : s.tier === 'fast' ? 25 : 10;
        state.combo++;
        state.comboTimer = 120;
        comboSparks = 20;
      }
    }
  });
  if (hits > 0 && state.combo > 1) {
    emitParticles(player.x, player.y, comboSparks, `rgba(255,220,100,`, { speed: 5, life: 20, r: 2 });
  }
}

// Input
document.addEventListener('mousemove', e => {
  state.mouseX = e.clientX; state.mouseY = e.clientY;
});
document.addEventListener('touchmove', e => {
  e.preventDefault();
  state.mouseX = e.touches[0].clientX; state.mouseY = e.touches[0].clientY;
}, { passive: false });
document.addEventListener('mousedown', pulse);
document.addEventListener('touchstart', pulse);

function startGame() {
  state.running = true;
  state.score = 0; state.combo = 0; state.comboTimer = 0;
  state.energy = 1; state.time = 0; state.difficulty = 1;
  player.x = W/2; player.y = H/2; player.vx = 0; player.vy = 0;
  player.trail = []; player.pulseRings = [];
  shadows = []; motes = []; particles = [];
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('score-val').textContent = '0';
  document.getElementById('combo-val').textContent = '0';
  document.getElementById('energy-fill').style.width = '100%';
}

document.getElementById('start-btn').addEventListener('click', startGame);

function gameOver() {
  state.running = false;
  document.getElementById('final-score').textContent = `You survived · Score: ${state.score}`;
  document.getElementById('overlay').classList.remove('hidden');
}

function update() {
  if (!state.running) return;
  state.time++;
  state.difficulty = 1 + Math.floor(state.time / 1200) * 0.4;

  // Player smooth follow
  const dx = state.mouseX - player.x;
  const dy = state.mouseY - player.y;
  player.vx += dx * 0.04;
  player.vy += dy * 0.04;
  player.vx *= 0.88; player.vy *= 0.88;
  player.x += player.vx;
  player.y += player.vy;
  player.glowPhase += 0.05;

  // Trail
  player.trail.push({ x: player.x, y: player.y, life: 25 });
  if (player.trail.length > 30) player.trail.shift();

  // Energy regen
  state.energy = Math.min(1, state.energy + state.energyRegen);

  // Pulse rings
  player.pulseRings.forEach(pr => {
    pr.r += pr.speed;
    pr.alpha -= 0.015;
  });
  player.pulseRings = player.pulseRings.filter(pr => pr.alpha > 0);

  // Combo decay
  if (state.comboTimer > 0) {
    state.comboTimer--;
    if (state.comboTimer === 0) state.combo = 0;
  }

  // Spawn shadows
  const spawnRate = Math.max(40, 120 - state.difficulty * 15);
  if (state.time % Math.floor(spawnRate) === 0) spawnShadow();

  // Spawn motes
  if (state.time % 300 === 0 && motes.length < 10) spawnMote();

  // Update shadows
  shadows.forEach(s => {
    const dx = player.x - s.x, dy = player.y - s.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    // Homing with wobble
    const wobble = Math.sin(state.time * 0.05 + s.phase) * 0.5;
    s.x += (dx / dist) * s.speed + wobble;
    s.y += (dy / dist) * s.speed + Math.cos(state.time * 0.04 + s.phase) * 0.5;
    s.trail.push({ x: s.x, y: s.y, life: 20 });
    if (s.trail.length > 15) s.trail.shift();

    // Collision with player
    if (dist < s.r + player.r) {
      emitParticles(player.x, player.y, 40, `rgba(255,100,80,`, { speed: 4, life: 30, r: 2.5 });
      gameOver();
    }
  });

  // Update motes
  motes.forEach(m => {
    m.phase += 0.03;
    m.life--;
    const dx = player.x - m.x, dy = player.y - m.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < m.r + player.r + 15) {
      // Attract toward player gently
      m.x += (dx / dist) * 1.5;
      m.y += (dy / dist) * 1.5;
    }
    if (dist < m.r + player.r) {
      state.score += 25;
      emitParticles(m.x, m.y, 10, `rgba(150,200,255,`, { speed: 2, life: 15 });
      m.life = 0;
    }
  });
  motes = motes.filter(m => m.life > 0);

  // Update particles
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.96; p.vy *= 0.96;
    p.vy += p.gravity;
    p.life--;
  });
  particles = particles.filter(p => p.life > 0);

  // Ambient particles
  if (Math.random() < 0.3) {
    particles.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
      life: 100 + Math.random() * 200, maxLife: 300,
      r: Math.random() * 0.8, color: 'rgba(80,100,180,', gravity: 0,
    });
  }

  // UI
  document.getElementById('score-val').textContent = state.score;
  document.getElementById('energy-fill').style.width = (state.energy * 100) + '%';
  const comboEl = document.getElementById('combo');
  if (state.combo > 1) {
    comboEl.style.opacity = '1';
    document.getElementById('combo-val').textContent = state.combo;
  } else {
    comboEl.style.opacity = '0';
  }
}

function draw() {
  // Clear with fade for trails
  ctx.fillStyle = 'rgba(5,5,10,0.25)';
  ctx.fillRect(0, 0, W, H);

  // Stars
  stars.forEach(s => {
    s.twinkle += 0.02;
    const a = s.a * (0.6 + 0.4 * Math.sin(s.twinkle));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180,200,255,${a})`;
    ctx.fill();
  });

  // Motés
  motes.forEach(m => {
    const alpha = m.life > 60 ? 1 : m.life / 60;
    const pulse = 1 + 0.2 * Math.sin(m.phase);
    ctx.save();
    ctx.globalAlpha = alpha * 0.9;
    const grad = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 3 * pulse);
    grad.addColorStop(0, `hsla(${m.hue},70%,75%,0.8)`);
    grad.addColorStop(0.5, `hsla(${m.hue},60%,50%,0.3)`);
    grad.addColorStop(1, `hsla(${m.hue},50%,30%,0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r * 3 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // Shadow trails
  shadows.forEach(s => {
    if (s.trail.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(s.trail[0].x, s.trail[0].y);
    for (let i = 1; i < s.trail.length; i++) {
      ctx.lineTo(s.trail[i].x, s.trail[i].y);
    }
    ctx.strokeStyle = `rgba(40,20,50,${0.15})`;
    ctx.lineWidth = s.r * 0.5;
    ctx.lineCap = 'round';
    ctx.stroke();
  });

  // Shadows
  shadows.forEach(s => {
    const wobble = Math.sin(state.time * 0.08 + s.phase) * 0.3;
    ctx.save();
    ctx.globalAlpha = 0.7;
    const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
    grad.addColorStop(0, `rgba(20,10,30,0.95)`);
    grad.addColorStop(0.6, `rgba(30,10,40,0.7)`);
    grad.addColorStop(1, `rgba(20,5,30,0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
    // Inner void
    const inner = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 0.5);
    inner.addColorStop(0, `rgba(5,2,8,0.9)`);
    inner.addColorStop(1, `rgba(10,5,15,0)`);
    ctx.fillStyle = inner;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // Player trail
  if (player.trail.length > 1) {
    ctx.beginPath();
    ctx.moveTo(player.trail[0].x, player.trail[0].y);
    for (let i = 1; i < player.trail.length; i++) {
      ctx.lineTo(player.trail[i].x, player.trail[i].y);
    }
    ctx.strokeStyle = 'rgba(140,180,255,0.15)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // Pulse rings
  player.pulseRings.forEach(pr => {
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, pr.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(160,200,255,${pr.alpha * 0.5})`;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.strokeStyle = `rgba(200,220,255,${pr.alpha * 0.2})`;
    ctx.lineWidth = 8;
    ctx.stroke();
  });

  // Player glow
  const glow = 1 + 0.15 * Math.sin(player.glowPhase);
  const pg = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, player.r * 4 * glow);
  pg.addColorStop(0, 'rgba(200,230,255,0.9)');
  pg.addColorStop(0.3, 'rgba(120,180,255,0.4)');
  pg.addColorStop(0.6, 'rgba(60,100,220,0.1)');
  pg.addColorStop(1, 'rgba(20,40,120,0)');
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r * 4 * glow, 0, Math.PI * 2);
  ctx.fill();

  // Player core
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(230,245,255,0.95)';
  ctx.fill();

  // Particles
  particles.forEach(p => {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.color + alpha + ')';
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Combo sparks
  if (comboSparks > 0) comboSparks--;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
