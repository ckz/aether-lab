<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble Cosmos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at center, #0a0a1a 0%, #000005 100%);
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.7);
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }
  #ui h1 {
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 8px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ff6b9d, #c06bff, #6ba8ff, #6bffd4);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  #ui p {
    font-size: 12px;
    letter-spacing: 3px;
    opacity: 0.5;
  }
  #stats {
    position: fixed;
    bottom: 20px;
    left: 20px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 11px;
    letter-spacing: 2px;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="ui">
  <h1>Bubble Cosmos</h1>
  <p>click & drag to blow bubbles · click bubbles to pop</p>
</div>
<div id="stats"></div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const stats = document.getElementById('stats');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Iridescent color palettes
const palettes = [
  ['#ff6b9d', '#c06bff', '#6ba8ff', '#6bffd4', '#ffd56b'],  // cosmic
  ['#ff9a9e', '#fecfef', '#fad0c4', '#ffecd2', '#fcb69f'],  // sunset
  ['#a1c4fd', '#c2e9fb', '#d4fc79', '#96e6a1', '#84fab0'],  // aurora
  ['#fbc2eb', '#a6c1ee', '#fdcbf1', '#e6dee9', '#cfd9df'],  // pastel
  ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff'],  // neon
  ['#e0c3fc', '#8ec5fc', '#f093fb', '#f5576c', '#4facfe'],  // vapor
];

let bubbles = [];
let particles = [];
let stars = [];
let mouse = { x: W / 2, y: H / 2, down: false, clicking: false };

// Stars background
for (let i = 0; i < 150; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.2 + 0.3,
    twinkleSpeed: Math.random() * 0.02 + 0.005,
    twinkleOffset: Math.random() * Math.PI * 2,
  });
}

class Bubble {
  constructor(x, y, r) {
    this.x = x;
    this.y = y;
    this.r = r || Math.random() * 25 + 10;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = -(Math.random() * 0.8 + 0.3); // float up
    this.life = 1;
    this.maxLife = Math.random() * 600 + 400;
    this.age = 0;
    this.wobbleAmp = Math.random() * 0.03 + 0.01;
    this.wobbleSpeed = Math.random() * 0.05 + 0.02;
    this.wobbleOffset = Math.random() * Math.PI * 2;
    this.palette = palettes[Math.floor(Math.random() * palettes.length)];
    this.colorIndex = Math.floor(Math.random() * this.palette.length);
    this.thickness = Math.random() * 2 + 1.5;
    this.opacity = Math.random() * 0.3 + 0.5;
  }

  update() {
    this.age++;
    this.x += this.vx + Math.sin(this.age * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp * 30;
    this.y += this.vy;
    this.vy *= 0.999;

    // Slight gravity reversal near top
    if (this.y < 100) this.vy += 0.002;

    // Fade near end of life
    if (this.age > this.maxLife * 0.8) {
      this.life = Math.max(0, 1 - (this.age - this.maxLife * 0.8) / (this.maxLife * 0.2));
    }

    return this.age < this.maxLife && this.life > 0 && this.y > -this.r * 2;
  }

  draw() {
    const color = this.palette[this.colorIndex];
    const alpha = this.opacity * this.life;

    // Outer glow
    const glow = ctx.createRadialGradient(this.x, this.y, this.r * 0.5, this.x, this.y, this.r * 1.8);
    glow.addColorStop(0, hexToRGBA(color, alpha * 0.3));
    glow.addColorStop(1, hexToRGBA(color, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * 1.8, 0, Math.PI * 2);
    ctx.fill();

    // Bubble body - iridescent gradient
    const bodyGrad = ctx.createRadialGradient(
      this.x - this.r * 0.3, this.y - this.r * 0.3, this.r * 0.1,
      this.x, this.y, this.r
    );
    bodyGrad.addColorStop(0, hexToRGBA('#ffffff', alpha * 0.4));
    bodyGrad.addColorStop(0.3, hexToRGBA(color, alpha * 0.25));
    bodyGrad.addColorStop(0.7, hexToRGBA(color, alpha * 0.1));
    bodyGrad.addColorStop(1, hexToRGBA(color, alpha * 0.05));

    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();

    // Bubble edge
    ctx.strokeStyle = hexToRGBA(color, alpha * 0.7);
    ctx.lineWidth = this.thickness;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.stroke();

    // Inner highlight
    const highlight = ctx.createRadialGradient(
      this.x - this.r * 0.25, this.y - this.r * 0.3, this.r * 0.05,
      this.x - this.r * 0.2, this.y - this.r * 0.2, this.r * 0.5
    );
    highlight.addColorStop(0, hexToRGBA('#ffffff', alpha * 0.8));
    highlight.addColorStop(1, hexToRGBA('#ffffff', 0));
    ctx.fillStyle = highlight;
    ctx.beginPath();
    ctx.arc(this.x - this.r * 0.2, this.y - this.r * 0.2, this.r * 0.5, 0, Math.PI * 2);
    ctx.fill();

    // Small caustic spot
    ctx.fillStyle = hexToRGBA('#ffffff', alpha * 0.6);
    ctx.beginPath();
    ctx.arc(this.x + this.r * 0.15, this.y + this.r * 0.25, this.r * 0.08, 0, Math.PI * 2);
    ctx.fill();
  }

  contains(px, py) {
    const dx = px - this.x;
    const dy = py - this.y;
    return dx * dx + dy * dy <= this.r * this.r;
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1;
    this.decay = Math.random() * 0.03 + 0.02;
    this.r = Math.random() * 3 + 1;
    this.color = color || '#ffffff';
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.96;
    this.vy *= 0.96;
    this.vy += 0.02; // slight gravity
    this.life -= this.decay;
    return this.life > 0;
  }

  draw() {
    ctx.fillStyle = hexToRGBA(this.color, this.life * 0.8);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * this.life, 0, Math.PI * 2);
    ctx.fill();
  }
}

function hexToRGBA(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function spawnBubble(x, y, r) {
  if (bubbles.length < 80) {
    bubbles.push(new Bubble(x, y, r));
  }
}

function popBubble(bubble) {
  // Spawn particles
  const count = 15;
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(bubble.x, bubble.y, bubble.palette[bubble.colorIndex]));
  }
  bubble.life = 0;
}

function drawStars(time) {
  stars.forEach(star => {
    const twinkle = Math.sin(time * star.twinkleSpeed + star.twinkleOffset) * 0.5 + 0.5;
    ctx.fillStyle = `rgba(255,255,255,${twinkle * 0.6})`;
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

let frameCount = 0;
let spawnCounter = 0;

function animate() {
  frameCount++;

  // Semi-transparent black for trail effect
  ctx.fillStyle = 'rgba(0,0,5,0.15)';
  ctx.fillRect(0, 0, W, H);

  // Redraw background gradient occasionally to prevent accumulation
  if (frameCount % 120 === 0) {
    ctx.fillStyle = 'rgba(0,0,5,0.3)';
    ctx.fillRect(0, 0, W, H);
  }

  drawStars(frameCount);

  // Spawn bubbles on drag
  if (mouse.down && frameCount % 3 === 0) {
    spawnCounter++;
    const r = Math.random() * 20 + 8 + Math.min(spawnCounter * 0.1, 15);
    spawnBubble(mouse.x + (Math.random() - 0.5) * 30, mouse.y + (Math.random() - 0.5) * 30, r);
  }

  // Update and draw bubbles
  bubbles = bubbles.filter(b => {
    const alive = b.update();
    if (alive) b.draw();
    return alive;
  });

  // Update and draw particles
  particles = particles.filter(p => {
    const alive = p.update();
    if (alive) p.draw();
    return alive;
  });

  // Stats
  if (frameCount % 30 === 0) {
    stats.textContent = `bubbles: ${bubbles.length} | particles: ${particles.length}`;
  }

  requestAnimationFrame(animate);
}

// Mouse events
canvas.addEventListener('mousedown', (e) => {
  mouse.down = true;
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  spawnBubble(e.clientX, e.clientY, Math.random() * 30 + 15);
});

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

canvas.addEventListener('mouseup', () => {
  mouse.down = false;
  spawnCounter = 0;
});

canvas.addEventListener('click', (e) => {
  // Pop nearby bubbles
  bubbles.forEach(b => {
    if (b.contains(e.clientX, e.clientY)) {
      popBubble(b);
    }
  });
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  mouse.down = true;
  const touch = e.touches[0];
  mouse.x = touch.clientX;
  mouse.y = touch.clientY;
  spawnBubble(touch.clientX, touch.clientY, Math.random() * 30 + 15);
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  mouse.x = touch.clientX;
  mouse.y = touch.clientY;
});

canvas.addEventListener('touchend', () => {
  mouse.down = false;
  spawnCounter = 0;
});

// Initial bubbles
setTimeout(() => {
  for (let i = 0; i < 8; i++) {
    spawnBubble(
      Math.random() * W,
      Math.random() * H * 0.8 + H * 0.1,
      Math.random() * 25 + 10
    );
  }
}, 500);

animate();
</script>
</body>
</html>
