<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celestial Cartographer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Georgia', serif;
    color: #ccc;
    user-select: none;
  }
  canvas { display: block; cursor: crosshair; }
  #ui {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 14px 18px;
    backdrop-filter: blur(8px);
    min-width: 220px;
  }
  #ui h1 {
    font-size: 15px;
    font-weight: normal;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ffd98e;
    margin-bottom: 10px;
    text-align: center;
  }
  .tool-group {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .tool-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.2);
    color: #ccc;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .tool-btn:hover { background: rgba(255,255,255,0.15); }
  .tool-btn.active {
    background: rgba(255,217,142,0.2);
    border-color: #ffd98e;
    color: #ffd98e;
    box-shadow: 0 0 12px rgba(255,217,142,0.2);
  }
  .palette-group {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .palette-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    cursor: pointer;
    transition: all 0.2s;
  }
  .palette-btn:hover { transform: scale(1.15); }
  .palette-btn.active {
    border-color: #fff;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
  }
  .action-btn {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    color: #aaa;
    padding: 7px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
    letter-spacing: 1px;
    margin-top: 4px;
    transition: all 0.2s;
  }
  .action-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
  #stats {
    text-align: center;
    font-size: 10px;
    color: #666;
    margin-top: 8px;
    letter-spacing: 1px;
  }
  #hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 1px;
    text-align: center;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  #title-overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 5;
    transition: opacity 1.5s;
  }
  #title-overlay h1 {
    font-size: 42px;
    font-weight: normal;
    letter-spacing: 8px;
    color: #ffd98e;
    text-shadow: 0 0 40px rgba(255,217,142,0.5);
    margin-bottom: 10px;
  }
  #title-overlay p {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
  }
</style>
</head>
<body>

<div id="title-overlay">
  <h1>CELESTIAL CARTOGRAPHER</h1>
  <p>click to place stars · drag to connect · right-click to remove</p>
</div>

<div id="ui">
  <h1>⚙ Tools</h1>
  <div class="tool-group">
    <button class="tool-btn active" data-tool="star">✦ Star</button>
    <button class="tool-btn" data-tool="connect">≋ Connect</button>
    <button class="tool-btn" data-tool="nebula">◌ Nebula</button>
    <button class="tool-btn" data-tool="erase">✕ Erase</button>
  </div>
  <div class="palette-group" id="palettes"></div>
  <button class="action-btn" id="btn-clear">Clear Sky</button>
  <button class="action-btn" id="btn-export">Export Map</button>
  <button class="action-btn" id="btn-demo">Load Demo</button>
  <div id="stats">stars: 0 · connections: 0</div>
</div>

<div id="hint">click anywhere to begin · scroll zooms · space pauses</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Palettes ---
const palettes = {
  'Midnight': { bg: [2,2,8], star: [255,217,142], line: [180,160,220], nebula: [80,60,140], accent: [255,200,150] },
  'Deep Ocean': { bg: [1,4,12], star: [180,220,255], line: [60,140,200], nebula: [20,60,120], accent: [120,200,255] },
  'Ember': { bg: [8,2,2], star: [255,180,100], line: [220,100,60], nebula: [140,40,20], accent: [255,220,150] },
  'Emerald': { bg: [2,6,4], star: [200,255,200], line: [80,180,120], nebula: [30,100,60], accent: [150,255,180] },
  'Void': { bg: [0,0,0], star: [255,255,255], line: [100,100,120], nebula: [40,40,60], accent: [200,200,220] }
};
let currentPalette = 'Midnight';

function setupPaletteButtons() {
  const container = document.getElementById('palettes');
  container.innerHTML = '';
  for (const [name, p] of Object.entries(palettes)) {
    const btn = document.createElement('button');
    btn.className = 'palette-btn' + (name === currentPalette ? ' active' : '');
    btn.dataset.palette = name;
    const c = p.star;
    btn.style.background = `rgb(${c[0]},${c[1]},${c[2]})`;
    btn.title = name;
    btn.addEventListener('click', () => {
      currentPalette = name;
      document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
    container.appendChild(btn);
  }
}
setupPaletteButtons();

// --- State ---
let tool = 'star';
let stars = [];
let connections = [];
let nebulae = [];
let mouse = { x: W/2, y: H/2, down: false, rightDown: false };
let connectingFrom = null;
let camera = { x: 0, y: 0, zoom: 1 };
let paused = false;
let shootingStars = [];
let time = 0;
let titleOpacity = 1;

// --- Star class ---
class Star {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.baseX = x; this.baseY = y;
    this.size = 1.5 + Math.random() * 2.5;
    this.brightness = 0.6 + Math.random() * 0.4;
    this.twinkleSpeed = 0.5 + Math.random() * 2;
    this.twinkleOffset = Math.random() * Math.PI * 2;
    this.driftX = (Math.random() - 0.5) * 0.15;
    this.driftY = (Math.random() - 0.5) * 0.15;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.name = generateStarName();
    this.age = 0;
  }
  update(t) {
    this.age += 0.016;
    this.x = this.baseX + Math.sin(t * 0.3 + this.twinkleOffset) * this.driftX * 20;
    this.y = this.baseY + Math.cos(t * 0.4 + this.twinkleOffset) * this.driftY * 20;
  }
  draw(ctx, t, pal) {
    const twinkle = 0.6 + 0.4 * Math.sin(t * this.twinkleSpeed + this.twinkleOffset);
    const pulse = 1 + 0.15 * Math.sin(t * 1.5 + this.pulsePhase);
    const alpha = this.brightness * twinkle;
    const s = this.size * pulse;

    // Glow layers
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, s * 8);
    grad.addColorStop(0, `rgba(${pal.star[0]},${pal.star[1]},${pal.star[2]},${alpha * 0.8})`);
    grad.addColorStop(0.3, `rgba(${pal.star[0]},${pal.star[1]},${pal.star[2]},${alpha * 0.2})`);
    grad.addColorStop(1, `rgba(${pal.star[0]},${pal.star[1]},${pal.star[2]},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, s * 8, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = `rgba(${pal.star[0]},${pal.star[1]},${pal.star[2]},${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, s, 0, Math.PI * 2);
    ctx.fill();

    // Cross spikes
    ctx.strokeStyle = `rgba(${pal.star[0]},${pal.star[1]},${pal.star[2]},${alpha * 0.5})`;
    ctx.lineWidth = 0.5;
    const spikeLen = s * 4 * twinkle;
    ctx.beginPath();
    ctx.moveTo(this.x - spikeLen, this.y);
    ctx.lineTo(this.x + spikeLen, this.y);
    ctx.moveTo(this.x, this.y - spikeLen);
    ctx.lineTo(this.x, this.y + spikeLen);
    ctx.stroke();
  }
}

// --- Connection class ---
class Connection {
  constructor(a, b) {
    this.a = a; this.b = b;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.pulseSpeed = 0.5 + Math.random() * 1.5;
  }
  draw(ctx, t, pal) {
    const dx = this.b.x - this.a.x;
    const dy = this.b.y - this.a.y;
    const dist = Math.hypot(dx, dy);
    const pulse = 0.4 + 0.6 * Math.abs(Math.sin(t * this.pulseSpeed + this.pulsePhase));
    const alpha = 0.3 * pulse;

    // Line
    ctx.strokeStyle = `rgba(${pal.line[0]},${pal.line[1]},${pal.line[2]},${alpha})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(this.a.x, this.a.y);
    ctx.lineTo(this.b.x, this.b.y);
    ctx.stroke();

    // Signal dot traveling along line
    const signalPos = (t * 0.3 + this.pulsePhase) % 1;
    const sx = this.a.x + dx * signalPos;
    const sy = this.a.y + dy * signalPos;
    const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 4);
    sg.addColorStop(0, `rgba(${pal.accent[0]},${pal.accent[1]},${pal.accent[2]},${alpha * 2})`);
    sg.addColorStop(1, `rgba(${pal.accent[0]},${pal.accent[1]},${pal.accent[2]},0)`);
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(sx, sy, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Nebula class ---
class Nebula {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.size = 60 + Math.random() * 120;
    this.phase = Math.random() * Math.PI * 2;
    this.driftX = (Math.random() - 0.5) * 0.2;
    this.driftY = (Math.random() - 0.5) * 0.2;
    this.lifespan = 1;
  }
  update(t) {
    this.x += this.driftX;
    this.y += this.driftY;
    this.lifespan = Math.min(1, this.lifespan + 0.003);
  }
  draw(ctx, t, pal) {
    const alpha = 0.08 * this.lifespan;
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    grad.addColorStop(0, `rgba(${pal.nebula[0]},${pal.nebula[1]},${pal.nebula[2]},${alpha})`);
    grad.addColorStop(0.5, `rgba(${pal.nebula[0]},${pal.nebula[1]},${pal.nebula[2]},${alpha * 0.4})`);
    grad.addColorStop(1, `rgba(${pal.nebula[0]},${pal.nebula[1]},${pal.nebula[2]},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Shooting star ---
class ShootingStar {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H * 0.4;
    const angle = Math.PI * 0.2 + Math.random() * 0.2;
    const speed = 8 + Math.random() * 12;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1;
    this.decay = 0.01 + Math.random() * 0.02;
    this.trail = [];
  }
  update() {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 20) this.trail.shift();
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw(ctx, pal) {
    if (this.trail.length < 2) return;
    for (let i = 0; i < this.trail.length - 1; i++) {
      const alpha = (i / this.trail.length) * this.life * 0.8;
      ctx.strokeStyle = `rgba(${pal.accent[0]},${pal.accent[1]},${pal.accent[2]},${alpha})`;
      ctx.lineWidth = (i / this.trail.length) * 2;
      ctx.beginPath();
      ctx.moveTo(this.trail[i].x, this.trail[i].y);
      ctx.lineTo(this.trail[i+1].x, this.trail[i+1].y);
      ctx.stroke();
    }
  }
}

// --- Helpers ---
function generateStarName() {
  const greek = ['Alp','Bet','Gam','Del','Eps','Zet','Eta','The','Iot','Kap','Lam','Mu','Nu','Xi','Omi','Pi','Rho','Sig','Tau','Ups','Phi','Chi','Psi','Omg'];
  const suffix = ['Ori','Cyg','Lyr','Aql','Dra','Vir','Tau','Gem','CMa','UMa','Sgr','Sco','Boo','Leo','And'];
  const num = Math.floor(Math.random() * 999);
  return greek[Math.floor(Math.random()*greek.length)] + ' ' + suffix[Math.floor(Math.random()*suffix.length)] + ' ' + num;
}

function findStarNear(x, y, threshold = 20) {
  let closest = null, minDist = threshold;
  for (const s of stars) {
    const d = Math.hypot(s.x - x, s.y - y);
    if (d < minDist) { minDist = d; closest = s; }
  }
  return closest;
}

function connectionExists(a, b) {
  return connections.some(c => (c.a === a && c.b === b) || (c.a === b && c.b === a));
}

// --- Input ---
canvas.addEventListener('mousedown', e => {
  if (e.button === 0) {
    mouse.down = true;
    if (tool === 'star') {
      stars.push(new Star(e.clientX, e.clientY));
      titleOpacity = 0;
    } else if (tool === 'connect') {
      const s = findStarNear(e.clientX, e.clientY);
      if (s) {
        if (!connectingFrom) {
          connectingFrom = s;
        } else if (s !== connectingFrom && !connectionExists(connectingFrom, s)) {
          connections.push(new Connection(connectingFrom, s));
          connectingFrom = null;
        }
      }
    } else if (tool === 'nebula') {
      nebulae.push(new Nebula(e.clientX, e.clientY));
      titleOpacity = 0;
    } else if (tool === 'erase') {
      const s = findStarNear(e.clientX, e.clientY, 30);
      if (s) {
        connections = connections.filter(c => c.a !== s && c.b !== s);
        stars = stars.filter(st => st !== s);
      }
    }
  } else if (e.button === 2) {
    mouse.rightDown = true;
    const s = findStarNear(e.clientX, e.clientY, 25);
    if (s) {
      connections = connections.filter(c => c.a !== s && c.b !== s);
      stars = stars.filter(st => st !== s);
    }
  }
});

canvas.addEventListener('mouseup', e => {
  if (e.button === 0) mouse.down = false;
  if (e.button === 2) mouse.rightDown = false;
});

canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (mouse.down && tool === 'nebula') {
    if (Math.random() < 0.1) nebulae.push(new Nebula(e.clientX, e.clientY));
  }
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
  if (e.key === '1') setTool('star');
  if (e.key === '2') setTool('connect');
  if (e.key === '3') setTool('nebula');
  if (e.key === '4') setTool('erase');
});

function setTool(t) {
  tool = t;
  connectingFrom = null;
  document.querySelectorAll('.tool-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tool === t);
  });
}

document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => setTool(btn.dataset.tool));
});

document.getElementById('btn-clear').addEventListener('click', () => {
  stars = []; connections = []; nebulae = [];
});

document.getElementById('btn-export').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'celestial-map.png';
  link.href = canvas.toDataURL();
  link.click();
});

document.getElementById('btn-demo').addEventListener('click', loadDemo);

function loadDemo() {
  stars = []; connections = []; nebulae = [];
  const cx = W/2, cy = H/2;
  // Orion-like belt
  for (let i = 0; i < 5; i++) {
    stars.push(new Star(cx - 200 + i * 100, cy - 50 + Math.sin(i)*30));
  }
  for (let i = 0; i < 4; i++) connections.push(new Connection(stars[i], stars[i+1]));

  // Shoulders
  stars.push(new Star(cx - 280, cy - 150));
  stars.push(new Star(cx + 280, cy - 150));
  connections.push(new Connection(stars[0], stars[5]));
  connections.push(new Connection(stars[4], stars[6]));

  // Knees
  stars.push(new Star(cx - 180, cy + 180));
  stars.push(new Star(cx + 180, cy + 180));
  connections.push(new Connection(stars[1], stars[7]));
  connections.push(new Connection(stars[3], stars[8]));

  // Sword
  stars.push(new Star(cx, cy + 80));
  stars.push(new Star(cx + 15, cy + 130));
  connections.push(new Connection(stars[2], stars[9]));
  connections.push(new Connection(stars[9], stars[10]));

  // Random background stars
  for (let i = 0; i < 60; i++) {
    stars.push(new Star(Math.random()*W, Math.random()*H));
  }

  // Nebulae
  nebulae.push(new Nebula(cx - 150, cy - 100));
  nebulae.push(new Nebula(cx + 200, cy + 50));
  nebulae.push(new Nebula(cx, cy - 200));

  titleOpacity = 0;
}

// --- Render ---
function drawBackground(pal, t) {
  // Deep gradient
  const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
  grad.addColorStop(0, `rgb(${pal.bg[0]+4},${pal.bg[1]+4},${pal.bg[2]+6})`);
  grad.addColorStop(1, `rgb(${pal.bg[0]},${pal.bg[1]},${pal.bg[2]})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Subtle grain
  ctx.fillStyle = `rgba(255,255,255,0.008)`;
  for (let i = 0; i < 80; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    ctx.fillRect(x, y, 1, 1);
  }
}

function render() {
  if (!paused) time += 0.016;
  const pal = palettes[currentPalette];

  drawBackground(pal, time);

  // Nebulae
  for (const n of nebulae) {
    if (!paused) n.update(time);
    n.draw(ctx, time, pal);
  }

  // Connections
  for (const c of connections) c.draw(ctx, time, pal);

  // Stars
  for (const s of stars) {
    if (!paused) s.update(time);
    s.draw(ctx, time, pal);
  }

  // Shooting stars
  if (!paused && Math.random() < 0.003) shootingStars.push(new ShootingStar());
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    if (!paused) shootingStars[i].update();
    shootingStars[i].draw(ctx, pal);
    if (shootingStars[i].life <= 0) shootingStars.splice(i, 1);
  }

  // Connecting preview line
  if (connectingFrom && tool === 'connect') {
    ctx.strokeStyle = `rgba(${pal.line[0]},${pal.line[1]},${pal.line[2]},0.4)`;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(connectingFrom.x, connectingFrom.y);
    ctx.lineTo(mouse.x, mouse.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Title overlay fade
  if (titleOpacity > 0) {
    titleOpacity = Math.max(0, titleOpacity - 0.003);
    document.getElementById('title-overlay').style.opacity = titleOpacity;
  }

  // Stats
  document.getElementById('stats').textContent = `stars: ${stars.length} · connections: ${connections.length}`;

  requestAnimationFrame(render);
}

// Fade hint after 8s
setTimeout(() => {
  document.getElementById('hint').style.opacity = 0;
}, 8000);

// Start with a few ambient stars
for (let i = 0; i < 30; i++) {
  stars.push(new Star(Math.random()*W, Math.random()*H));
}

render();
</script>
</body>
</html>
