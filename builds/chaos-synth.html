<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaos Synth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050510;
    font-family: 'Courier New', monospace;
    color: #aab;
    overflow: hidden;
    height: 100vh;
    cursor: crosshair;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
  }
  #ui {
    position: fixed;
    top: 20px; left: 20px;
    z-index: 10;
    pointer-events: none;
  }
  #title {
    font-size: 1.1rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: #c8c8ff;
    opacity: .7;
    margin-bottom: 4px;
  }
  #subtitle {
    font-size: .65rem;
    letter-spacing: .2em;
    opacity: .4;
    margin-bottom: 18px;
  }
  #controls {
    position: fixed;
    bottom: 20px; left: 20px;
    z-index: 10;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    max-width: 600px;
  }
  .btn {
    background: rgba(20,18,40,.7);
    border: 1px solid rgba(100,90,180,.3);
    color: #aab;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: .7rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    transition: all .3s;
    pointer-events: all;
  }
  .btn:hover {
    border-color: rgba(150,130,255,.5);
    color: #c8c8ff;
    background: rgba(30,25,65,.8);
  }
  .btn.active {
    border-color: rgba(180,160,255,.6);
    color: #fff;
    background: rgba(50,40,100,.6);
    box-shadow: 0 0 15px rgba(100,80,200,.2);
  }
  #info {
    position: fixed;
    bottom: 20px; right: 20px;
    z-index: 10;
    font-size: .6rem;
    opacity: .35;
    letter-spacing: .1em;
    text-align: right;
  }
  #stats {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 10;
    font-size: .65rem;
    opacity: .4;
    letter-spacing: .1em;
    text-align: right;
  }
  #hint {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    font-size: .8rem;
    opacity: .6;
    letter-spacing: .2em;
    text-align: center;
    pointer-events: none;
    transition: opacity 2s;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="ui">
  <div id="title">Chaos Synth</div>
  <div id="subtitle">strange attractors in sound &amp; light</div>
</div>

<div id="controls"></div>

<div id="stats">
  <div id="fps">60 FPS</div>
  <div id="particles">0 particles</div>
</div>

<div id="info">
  <div>SPACE pause</div>
  <div>S save PNG</div>
  <div>1-5 attractors</div>
  <div>scroll zoom</div>
</div>

<div id="hint">click to awaken the chaos</div>

<script>
// ==================== CONFIG ====================
const ATTRACTORS = {
  'Lorenz': {
    params: { sigma: 10, rho: 28, beta: 8/3 },
    dt: 0.004,
    scale: 12,
    color: '#ff6b9d'
  },
  'Rössler': {
    params: { a: 0.2, b: 0.2, c: 5.7 },
    dt: 0.012,
    scale: 10,
    color: '#ff9f43'
  },
  'Aizawa': {
    params: { a: 0.95, b: 0.7, c: 0.6, d: 3.5, e: 0.25, f: 0.1 },
    dt: 0.005,
    scale: 140,
    color: '#00d2ff'
  },
  'Thomas': {
    params: { b: 0.208186 },
    dt: 0.04,
    scale: 50,
    color: '#a29bfe'
  },
  'Halvorsen': {
    params: { a: 1.89 },
    dt: 0.004,
    scale: 12,
    color: '#55efc4'
  }
};

const PALETTES = {
  'Aurora': ['#ff6b9d', '#c44569', '#f8b500', '#ff6b9d', '#00d2ff'],
  'Ember': ['#ff9f43', '#ee5a24', '#f8b500', '#ff6b6b', '#ffa502'],
  'Neon':  ['#00d2ff', '#00ff88', '#ff00ff', '#ffff00', '#00ffff'],
  'Void':  ['#a29bfe', '#6c5ce7', '#fd79a8', '#e84393', '#a29bfe'],
  'Mono':  ['#ffffff', '#cccccc', '#999999', '#666666', '#ffffff']
};

const SCALES = {
  'Pentatonic': [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3, 659.3],
  'Minor':     [261.6, 293.7, 311.1, 349.2, 392.0, 415.3, 466.2, 523.3],
  'Major':     [261.6, 293.7, 329.6, 349.2, 392.0, 440.0, 493.9, 523.3],
  'Dorian':    [261.6, 293.7, 311.1, 349.2, 392.0, 440.0, 466.2, 523.3],
  'Ambient':   [130.8, 196.0, 261.6, 329.6, 392.0, 523.3, 659.3, 783.9]
};

// ==================== STATE ====================
let state = {
  attractor: 'Lorenz',
  palette: 'Aurora',
  scale: 'Pentatonic',
  paused: false,
  particles: [],
  maxParticles: 800,
  spawnRate: 4,
  trailAlpha: 0.03,
  rotationX: 0.4,
  rotationY: 0,
  zoom: 1,
  mouseX: 0,
  mouseY: 0,
  mouseDown: false,
  audioCtx: null,
  audioStarted: false,
  lastNote: 0,
  noteInterval: 80,
  frameCount: 0,
  lastFpsTime: Date.now(),
  fps: 60,
  seed: Math.random() * 1000
};

// ==================== CANVAS ====================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ==================== AUDIO ====================
function initAudio() {
  if (state.audioStarted) return;
  try {
    state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    state.audioStarted = true;
  } catch(e) {
    console.log('Audio not available');
  }
}

function playNote(freq, duration = 0.3) {
  if (!state.audioCtx) return;
  const ctx = state.audioCtx;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(2000, ctx.currentTime);
  
  gain.gain.setValueAtTime(0.08, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + duration);
}

// ==================== ATTRACTOR MATH ====================
function lorenz(x, y, z, dt, p) {
  const dx = (p.sigma * (y - x)) * dt;
  const dy = (x * (p.rho - z) - y) * dt;
  const dz = (x * y - p.beta * z) * dt;
  return [x + dx, y + dy, z + dz];
}

function rossler(x, y, z, dt, p) {
  const dx = (-(y + z)) * dt;
  const dy = (x + p.a * y) * dt;
  const dz = (p.b + z * (x - p.c)) * dt;
  return [x + dx, y + dy, z + dz];
}

function aizawa(x, y, z, dt, p) {
  const dx = ((z - p.b) * x - p.d * y) * dt;
  const dy = (p.d * x + (z - p.b) * y) * dt;
  const dz = (p.c + p.a * z - (z * z * z) / 3 - (x * x + y * y) * (1 + p.e * z) + p.f * z * x * x * x) * dt;
  return [x + dx, y + dy, z + dz];
}

function thomas(x, y, z, dt, p) {
  const dx = (Math.sin(y) - p.b * x) * dt;
  const dy = (Math.sin(z) - p.b * y) * dt;
  const dz = (Math.sin(x) - p.b * z) * dt;
  return [x + dx, y + dy, z + dz];
}

function halvorsen(x, y, z, dt, p) {
  const dx = (-p.a * x - 4 * y - 4 * z - y * y) * dt;
  const dy = (-p.a * y - 4 * z - 4 * x - z * z) * dt;
  const dz = (-p.a * z - 4 * x - 4 * y - x * x) * dt;
  return [x + dx, y + dy, z + dz];
}

const STEP_FUNCS = {
  'Lorenz': lorenz,
  'Rössler': rossler,
  'Aizawa': aizawa,
  'Thomas': thomas,
  'Halvorsen': halvorsen
};

// ==================== PROJECTION ====================
function project(x, y, z) {
  // Rotate around Y
  const cosY = Math.cos(state.rotationY);
  const sinY = Math.sin(state.rotationY);
  let rx = x * cosY - z * sinY;
  let rz = x * sinY + z * cosY;
  
  // Rotate around X
  const cosX = Math.cos(state.rotationX);
  const sinX = Math.sin(state.rotationX);
  let ry = y * cosX - rz * sinX;
  rz = y * sinX + rz * cosX;
  
  const perspective = 600 / (600 + rz);
  return {
    x: W / 2 + rx * state.zoom * perspective * state.attractorScale() * 0.8,
    y: H / 2 + ry * state.zoom * perspective * state.attractorScale() * 0.8,
    z: rz,
    scale: perspective
  };
}

state.attractorScale = function() {
  return ATTRACTORS[state.attractor].scale;
};

// ==================== PARTICLES ====================
function createParticle() {
  const a = ATTRACTORS[state.attractor];
  let x, y, z;
  const s = state.attractorScale();
  
  // Start near the attractor's natural region
  switch(state.attractor) {
    case 'Lorenz':
      x = 0.1 + (Math.random() - 0.5) * 2;
      y = 0.1 + (Math.random() - 0.5) * 2;
      z = 25 + (Math.random() - 0.5) * 5;
      break;
    case 'Rössler':
      x = 1 + (Math.random() - 0.5) * 2;
      y = 1 + (Math.random() - 0.5) * 2;
      z = 0 + (Math.random() - 0.5) * 2;
      break;
    case 'Aizawa':
      x = 0.1 + (Math.random() - 0.5) * 0.3;
      y = 0.1 + (Math.random() - 0.5) * 0.3;
      z = 0 + (Math.random() - 0.5) * 0.3;
      break;
    case 'Thomas':
      x = 1 + (Math.random() - 0.5) * 2;
      y = 1 + (Math.random() - 0.5) * 2;
      z = 1 + (Math.random() - 0.5) * 2;
      break;
    case 'Halvorsen':
      x = -1.5 + (Math.random() - 0.5) * 2;
      y = -1.5 + (Math.random() - 0.5) * 2;
      z = -1.5 + (Math.random() - 0.5) * 2;
      break;
  }
  
  return {
    x, y, z,
    age: 0,
    maxAge: 300 + Math.random() * 400,
    hue: Math.random()
  };
}

function updateParticle(p) {
  const a = ATTRACTORS[state.attractor];
  const step = STEP_FUNCS[state.attractor];
  const result = step(p.x, p.y, p.z, a.dt, a.params);
  p.x = result[0];
  p.y = result[1];
  p.z = result[2];
  p.age++;
  return p.age < p.maxAge;
}

// ==================== RENDERING ====================
function getColor(particle) {
  const palette = PALETTES[state.palette];
  const idx = Math.floor(particle.hue * palette.length) % palette.length;
  return palette[idx];
}

function drawParticle(p) {
  const proj = project(p.x, p.y, p.z);
  if (proj.x < -50 || proj.x > W + 50 || proj.y < -50 || proj.y > H + 50) return;
  
  const alpha = Math.min(1, (1 - p.age / p.maxAge) * proj.scale);
  const color = getColor(p);
  const size = 2.5 * proj.scale * (1 - p.age / p.maxAge * 0.5);
  
  ctx.beginPath();
  ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha * 0.9;
  ctx.fill();
  
  // Glow
  ctx.beginPath();
  ctx.arc(proj.x, proj.y, size * 3, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha * 0.15;
  ctx.fill();
}

function render() {
  // Trail fade
  ctx.globalAlpha = state.trailAlpha;
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  
  // Additive blending for glow
  ctx.globalCompositeOperation = 'lighter';
  
  // Draw particles sorted by z for depth
  state.particles.sort((a, b) => a.z - b.z);
  
  for (const p of state.particles) {
    drawParticle(p);
  }
  
  ctx.globalCompositeOperation = 'source-over';
}

// ==================== AUDIO MAPPING ====================
function maybePlayNote(particle) {
  if (!state.audioCtx || !state.mouseDown) return;
  
  const now = Date.now();
  if (now - state.lastNote < state.noteInterval) return;
  
  const proj = project(particle.x, particle.y, particle.z);
  const scale = SCALES[state.scale];
  const noteIdx = Math.floor((proj.y / H) * scale.length) % scale.length;
  const freq = scale[Math.max(0, Math.min(noteIdx, scale.length - 1))];
  
  playNote(freq, 0.4);
  state.lastNote = now;
}

// ==================== MAIN LOOP ====================
function update() {
  if (!state.paused) {
    // Spawn new particles
    for (let i = 0; i < state.spawnRate; i++) {
      if (state.particles.length < state.maxParticles) {
        state.particles.push(createParticle());
      }
    }
    
    // Update particles
    state.particles = state.particles.filter(p => {
      const alive = updateParticle(p);
      if (alive && state.mouseDown) {
        maybePlayNote(p);
      }
      return alive;
    });
  }
  
  render();
  state.frameCount++;
  
  // FPS counter
  const now = Date.now();
  if (now - state.lastFpsTime > 1000) {
    state.fps = Math.round(state.frameCount * 1000 / (now - state.lastFpsTime));
    state.frameCount = 0;
    state.lastFpsTime = now;
    document.getElementById('fps').textContent = state.fps + ' FPS';
    document.getElementById('particles').textContent = state.particles.length + ' particles';
  }
  
  requestAnimationFrame(update);
}

// ==================== CONTROLS ====================
function buildControls() {
  const controls = document.getElementById('controls');
  
  // Attractor buttons
  Object.keys(ATTRACTORS).forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'btn' + (name === state.attractor ? ' active' : '');
    btn.textContent = name;
    btn.onclick = () => {
      state.attractor = name;
      state.particles = [];
      state.seed = Math.random() * 1000;
      controls.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    controls.appendChild(btn);
  });
  
  // Separator
  const sep = document.createElement('div');
  sep.style.width = '1px';
  sep.style.background = 'rgba(100,90,180,.3)';
  sep.style.margin = '0 5px';
  controls.appendChild(sep);
  
  // Palette buttons
  Object.keys(PALETTES).forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'btn' + (name === state.palette ? ' active' : '');
    btn.textContent = name;
    btn.onclick = () => {
      state.palette = name;
      controls.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    controls.appendChild(btn);
  });
  
  // Separator
  const sep2 = document.createElement('div');
  sep2.style.width = '1px';
  sep2.style.background = 'rgba(100,90,180,.3)';
  sep2.style.margin = '0 5px';
  controls.appendChild(sep2);
  
  // Scale buttons
  Object.keys(SCALES).forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'btn' + (name === state.scale ? ' active' : '');
    btn.textContent = name;
    btn.onclick = () => {
      state.scale = name;
      controls.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    controls.appendChild(btn);
  });
}

// ==================== INPUT ====================
canvas.addEventListener('mousedown', (e) => {
  state.mouseDown = true;
  initAudio();
  if (state.audioCtx && state.audioCtx.state === 'suspended') {
    state.audioCtx.resume();
  }
  document.getElementById('hint').style.opacity = '0';
});

canvas.addEventListener('mouseup', () => state.mouseDown = false);
canvas.addEventListener('mouseleave', () => state.mouseDown = false);

canvas.addEventListener('mousemove', (e) => {
  state.mouseX = e.clientX;
  state.mouseY = e.clientY;
  
  if (state.mouseDown) {
    state.rotationY += e.movementX * 0.005;
    state.rotationX += e.movementY * 0.005;
    state.rotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, state.rotationX));
  }
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  state.zoom *= e.deltaY > 0 ? 0.95 : 1.05;
  state.zoom = Math.max(0.3, Math.min(3, state.zoom));
}, { passive: false });

// Touch support
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  state.mouseDown = true;
  initAudio();
  if (state.audioCtx && state.audioCtx.state === 'suspended') {
    state.audioCtx.resume();
  }
  document.getElementById('hint').style.opacity = '0';
});

canvas.addEventListener('touchend', () => state.mouseDown = false);
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  state.mouseX = touch.clientX;
  state.mouseY = touch.clientY;
  
  state.rotationY += (touch.clientX - (state._lastTouchX || touch.clientX)) * 0.005;
  state.rotationX += (touch.clientY - (state._lastTouchY || touch.clientY)) * 0.005;
  state.rotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, state.rotationX));
  state._lastTouchX = touch.clientX;
  state._lastTouchY = touch.clientY;
});

document.addEventListener('keydown', (e) => {
  switch(e.key) {
    case ' ':
      state.paused = !state.paused;
      e.preventDefault();
      break;
    case 's':
    case 'S':
      const link = document.createElement('a');
      link.download = 'chaos-synth-' + Date.now() + '.png';
      link.href = canvas.toDataURL();
      link.click();
      break;
    case '1': switchAttractor('Lorenz'); break;
    case '2': switchAttractor('Rössler'); break;
    case '3': switchAttractor('Aizawa'); break;
    case '4': switchAttractor('Thomas'); break;
    case '5': switchAttractor('Halvorsen'); break;
  }
});

function switchAttractor(name) {
  state.attractor = name;
  state.particles = [];
  state.seed = Math.random() * 1000;
  document.querySelectorAll('#controls .btn').forEach((btn, i) => {
    if (i < 5) btn.classList.toggle('active', btn.textContent === name);
  });
}

// ==================== INIT ====================
buildControls();
update();
</script>
</body>
</html>
