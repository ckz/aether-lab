<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromatic Breath</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    cursor: crosshair;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
  }
  .ui {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.4);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
  .title {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="title">Chromatic Breath</div>
<div class="ui">Move mouse · Click to pulse · Space to shift palette</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height;
let mouse = { x: 0, y: 0, active: false };
let breathPhase = 0;
let paletteIndex = 0;
let time = 0;

const palettes = [
  { name: 'Aurora', colors: ['#00ff88', '#00ccff', '#ff00ff', '#ffff00', '#00ffff'] },
  { name: 'Sunset', colors: ['#ff6b6b', '#ffa500', '#ff1493', '#ffd700', '#ff4500'] },
  { name: 'Ocean', colors: ['#0077be', '#00bfff', '#1e90ff', '#87ceeb', '#4682b4'] },
  { name: 'Forest', colors: ['#228b22', '#32cd32', '#00ff7f', '#7cfc00', '#556b2f'] },
  { name: 'Cosmic', colors: ['#9400d3', '#8a2be2', '#9932cc', '#ba55d3', '#da70d6'] }
];

let currentPalette = palettes[0];
let ripples = [];
let particles = [];
let breathRings = [];

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
  
  // Spawn particles on mouse move
  if (Math.random() > 0.7) {
    particles.push({
      x: mouse.x,
      y: mouse.y,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      life: 1,
      decay: 0.01 + Math.random() * 0.02,
      size: 2 + Math.random() * 3,
      color: currentPalette.colors[Math.floor(Math.random() * currentPalette.colors.length)]
    });
  }
});

canvas.addEventListener('click', (e) => {
  // Create ripple
  ripples.push({
    x: e.clientX,
    y: e.clientY,
    radius: 0,
    maxRadius: 200 + Math.random() * 100,
    life: 1,
    color: currentPalette.colors[Math.floor(Math.random() * currentPalette.colors.length)]
  });
  
  // Burst of particles
  for (let i = 0; i < 30; i++) {
    const angle = (Math.PI * 2 / 30) * i;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x: e.clientX,
      y: e.clientY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.015 + Math.random() * 0.01,
      size: 2 + Math.random() * 4,
      color: currentPalette.colors[Math.floor(Math.random() * currentPalette.colors.length)]
    });
  }
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    paletteIndex = (paletteIndex + 1) % palettes.length;
    currentPalette = palettes[paletteIndex];
    
    // Visual feedback
    for (let i = 0; i < 20; i++) {
      particles.push({
        x: width / 2,
        y: height / 2,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10,
        life: 1,
        decay: 0.02,
        size: 3 + Math.random() * 5,
        color: currentPalette.colors[Math.floor(Math.random() * currentPalette.colors.length)]
      });
    }
  }
});

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function drawBreathRing(ring) {
  const { x, y, baseRadius, phase, color } = ring;
  const breathScale = 1 + Math.sin(breathPhase + phase) * 0.15;
  const radius = baseRadius * breathScale;
  const alpha = 0.1 + Math.sin(breathPhase + phase) * 0.05;
  
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.strokeStyle = hexToRgba(color, alpha);
  ctx.lineWidth = 1;
  ctx.stroke();
  
  // Inner glow
  const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
  gradient.addColorStop(0, hexToRgba(color, alpha * 0.5));
  gradient.addColorStop(1, hexToRgba(color, 0));
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.fill();
}

function animate() {
  // Fade trail
  ctx.fillStyle = 'rgba(10, 10, 15, 0.1)';
  ctx.fillRect(0, 0, width, height);
  
  time += 0.01;
  breathPhase += 0.02;
  
  // Spawn breath rings
  if (Math.random() > 0.95) {
    breathRings.push({
      x: Math.random() * width,
      y: Math.random() * height,
      baseRadius: 50 + Math.random() * 150,
      phase: Math.random() * Math.PI * 2,
      color: currentPalette.colors[Math.floor(Math.random() * currentPalette.colors.length)]
    });
    
    // Limit rings
    if (breathRings.length > 15) breathRings.shift();
  }
  
  // Draw breath rings
  breathRings.forEach(ring => drawBreathRing(ring));
  
  // Draw and update ripples
  ripples = ripples.filter(ripple => {
    ripple.radius += 3;
    ripple.life -= 0.015;
    
    if (ripple.life <= 0) return false;
    
    ctx.beginPath();
    ctx.arc(ripple.x, ripple.y, ripple.radius, 0, Math.PI * 2);
    ctx.strokeStyle = hexToRgba(ripple.color, ripple.life * 0.5);
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Secondary ripple
    if (ripple.radius > 20) {
      ctx.beginPath();
      ctx.arc(ripple.x, ripple.y, ripple.radius - 20, 0, Math.PI * 2);
      ctx.strokeStyle = hexToRgba(ripple.color, ripple.life * 0.3);
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    
    return true;
  });
  
  // Draw and update particles
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.99;
    p.vy *= 0.99;
    p.life -= p.decay;
    
    if (p.life <= 0) return false;
    
    const alpha = p.life * 0.8;
    const size = p.size * (0.5 + p.life * 0.5);
    
    // Glow
    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 2);
    gradient.addColorStop(0, hexToRgba(p.color, alpha));
    gradient.addColorStop(1, hexToRgba(p.color, 0));
    
    ctx.beginPath();
    ctx.arc(p.x, p.y, size * 2, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
    
    // Core
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fillStyle = hexToRgba(p.color, alpha);
    ctx.fill();
    
    return true;
  });
  
  // Draw central breath core
  const coreBreath = 1 + Math.sin(breathPhase) * 0.2;
  const coreSize = 30 * coreBreath;
  
  const coreGradient = ctx.createRadialGradient(
    width / 2, height / 2, 0,
    width / 2, height / 2, coreSize * 3
  );
  coreGradient.addColorStop(0, hexToRgba(currentPalette.colors[0], 0.3));
  coreGradient.addColorStop(0.5, hexToRgba(currentPalette.colors[1], 0.1));
  coreGradient.addColorStop(1, hexToRgba(currentPalette.colors[2], 0));
  
  ctx.beginPath();
  ctx.arc(width / 2, height / 2, coreSize * 3, 0, Math.PI * 2);
  ctx.fillStyle = coreGradient;
  ctx.fill();
  
  // Core ring
  ctx.beginPath();
  ctx.arc(width / 2, height / 2, coreSize, 0, Math.PI * 2);
  ctx.strokeStyle = hexToRgba(currentPalette.colors[0], 0.2 + Math.sin(breathPhase) * 0.1);
  ctx.lineWidth = 2;
  ctx.stroke();
  
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
