<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromatic Flow Field</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; overflow: hidden; cursor: crosshair; font-family: 'Courier New', monospace; }
  canvas { display: block; }
  #info {
    position: fixed; top: 16px; left: 16px; color: rgba(255,255,255,0.6);
    font-size: 12px; line-height: 1.6; z-index: 10; pointer-events: none;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }
  #info span { color: rgba(255,255,255,0.9); }
  #title {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.15); font-size: 14px; letter-spacing: 4px;
    text-transform: uppercase; z-index: 10; pointer-events: none;
  }
  #controls {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    display: flex; flex-direction: column; gap: 6px;
  }
  #controls button {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.6); padding: 6px 12px; font-size: 11px;
    cursor: pointer; border-radius: 3px; font-family: 'Courier New', monospace;
    transition: all 0.3s;
  }
  #controls button:hover { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.9); }
</style>
</head>
<body>
<div id="info">
  PARTICLES: <span id="pcount">0</span><br>
  FPS: <span id="fps">0</span><br>
  MODE: <span id="mode">flow</span><br>
  MOVE MOUSE TO ATTRACT
</div>
<div id="controls">
  <button onclick="toggleMode()">MODE</button>
  <button onclick="resetField()">RESET</button>
  <button onclick="changePalette()">PALETTE</button>
  <button onclick="toggleTrails()">TRAILS</button>
</div>
<div id="title">Chromatic Flow Field</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Simplex-like noise (hash-based) ---
function hash(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return (h ^ (h >> 16)) / 2147483648;
}

function noise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const n00 = hash(ix, iy), n10 = hash(ix+1, iy);
  const n01 = hash(ix, iy+1), n11 = hash(ix+1, iy+1);
  return (n00*(1-sx) + n10*sx)*(1-sy) + (n01*(1-sx) + n11*sx)*sy;
}

function fbm(x, y, octaves=4) {
  let val = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < octaves; i++) {
    val += amp * noise(x * freq, y * freq);
    amp *= 0.5; freq *= 2.1;
  }
  return val;
}

// --- Color palettes ---
const palettes = [
  // Aurora
  (t) => `hsl(${180 + t*120 + Math.sin(t*6.28)*30}, 85%, ${50 + t*20}%)`,
  // Ember
  (t) => `hsl(${10 + t*40}, 90%, ${40 + t*35}%)`,
  // Ocean
  (t) => `hsl(${200 + t*60}, 80%, ${30 + t*40}%)`,
  // Neon
  (t) => `hsl(${t*360}, 100%, ${45 + t*25}%)`,
  // Monochrome
  (t) => `hsl(0, 0%, ${20 + t*60}%)`,
];
let paletteIdx = 0;

// --- Particle system ---
const MAX_PARTICLES = 3000;
let particles = [];
let mode = 'flow';
let trails = true;
let mouse = { x: W/2, y: H/2, active: false };
let time = 0;

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = 0; this.vy = 0;
    this.life = Math.random() * 300 + 100;
    this.age = 0;
    this.hueOffset = Math.random();
    this.speed = Math.random() * 0.8 + 0.4;
  }
  update() {
    this.age++;
    if (this.age > this.life || this.x < -20 || this.x > W+20 || this.y < -20 || this.y > H+20) {
      this.reset();
      return;
    }

    const scale = 0.003;
    let angle;

    if (mode === 'flow') {
      angle = fbm(this.x * scale + time * 0.0003, this.y * scale, 4) * Math.PI * 4;
    } else if (mode === 'vortex') {
      const dx = this.x - W/2, dy = this.y - H/2;
      const dist = Math.sqrt(dx*dx + dy*dy) + 1;
      angle = Math.atan2(dy, dx) + Math.PI/2 + fbm(dist * 0.01 + time*0.001, 0) * 2;
    } else if (mode === 'attract') {
      const dx = mouse.x - this.x, dy = mouse.y - this.y;
      const dist = Math.sqrt(dx*dx + dy*dy) + 1;
      angle = Math.atan2(dy, dx) + fbm(this.x*0.005, this.y*0.005 + time*0.001) * 1.5;
    }

    const force = mode === 'attract' ? 2.5 : 1.2;
    this.vx += Math.cos(angle) * force * this.speed * 0.15;
    this.vy += Math.sin(angle) * force * this.speed * 0.15;

    // Mouse attraction
    if (mouse.active) {
      const dx = mouse.x - this.x, dy = mouse.y - this.y;
      const dist = Math.sqrt(dx*dx + dy*dy) + 1;
      if (dist < 200) {
        const pull = (200 - dist) / 200 * 0.3;
        this.vx += (dx / dist) * pull;
        this.vy += (dy / dist) * pull;
      }
    }

    this.vx *= 0.92; this.vy *= 0.92;
    this.x += this.vx;
    this.y += this.vy;
  }
  draw() {
    const t = (this.age / this.life);
    const alpha = t < 0.1 ? t * 10 : t > 0.8 ? (1 - t) * 5 : 1;
    const color = palettes[paletteIdx](this.hueOffset + t * 0.5 + time * 0.0001);
    const size = (1 - t) * 1.5 + 0.5;

    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha * 0.7;
    ctx.lineWidth = size;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x - this.vx * 2, this.y - this.vy * 2);
    ctx.stroke();
  }
}

// Initialize
for (let i = 0; i < MAX_PARTICLES; i++) particles.push(new Particle());
document.getElementById('pcount').textContent = MAX_PARTICLES;

// Mouse
canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
});
canvas.addEventListener('mouseleave', () => { mouse.active = false; });
canvas.addEventListener('click', (e) => {
  // Burst on click
  for (let i = 0; i < 200; i++) {
    const p = particles[Math.floor(Math.random() * particles.length)];
    p.x = e.clientX; p.y = e.clientY;
    p.vx = (Math.random() - 0.5) * 8;
    p.vy = (Math.random() - 0.5) * 8;
    p.age = 0; p.life = 100 + Math.random() * 100;
  }
});

// Touch
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
}, { passive: false });
canvas.addEventListener('touchend', () => { mouse.active = false; });

// Controls
function toggleMode() {
  const modes = ['flow', 'vortex', 'attract'];
  mode = modes[(modes.indexOf(mode) + 1) % modes.length];
  document.getElementById('mode').textContent = mode;
}
function resetField() {
  ctx.fillStyle = 'rgba(10,10,15,1)';
  ctx.fillRect(0, 0, W, H);
  particles.forEach(p => p.reset());
}
function changePalette() {
  paletteIdx = (paletteIdx + 1) % palettes.length;
}
function toggleTrails() {
  trails = !trails;
}

// FPS
let frameCount = 0, lastFpsUpdate = performance.now();
function updateFps() {
  frameCount++;
  const now = performance.now();
  if (now - lastFpsUpdate > 500) {
    document.getElementById('fps').textContent = Math.round(frameCount / ((now - lastFpsUpdate) / 1000));
    frameCount = 0; lastFpsUpdate = now;
  }
}

// Main loop
function animate() {
  time++;

  if (trails) {
    ctx.fillStyle = 'rgba(10,10,15,0.04)';
    ctx.fillRect(0, 0, W, H);
  } else {
    ctx.fillStyle = 'rgba(10,10,15,0.15)';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.globalAlpha = 1;
  for (const p of particles) {
    p.update();
    p.draw();
  }
  ctx.globalAlpha = 1;

  updateFps();
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
