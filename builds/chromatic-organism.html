<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromatic Organism — Aether Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050508;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    cursor: none;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0.75rem;
    z-index: 10;
  }
  .hint {
    position: fixed;
    top: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.35);
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 2s;
  }
  .key {
    display: inline-block;
    padding: 0.35rem 0.7rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: rgba(255,255,255,0.55);
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    backdrop-filter: blur(10px);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">move mouse to interact &nbsp;·&nbsp; click to pulse &nbsp;·&nbsp; space to mutate &nbsp;·&nbsp; hold to attract</div>
<div id="ui">
  <span class="key">SPACE mutate</span>
  <span class="key">CLICK pulse</span>
  <span class="key">HOLD attract</span>
  <span class="key">R reset</span>
  <span class="key">S save</span>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// --- Palette System ---
const palettes = [
  { name: 'Abyssal', bg: '#050510', body: [120, 180, 255], organelles: [[100,200,255],[150,100,255],[80,255,200]], tendrils: [140,200,255], particles: [180,220,255] },
  { name: 'Ember', bg: '#0a0505', body: [255, 140, 60], organelles: [[255,100,50],[255,180,50],[255,80,120]], tendrils: [255,160,80], particles: [255,200,100] },
  { name: 'Toxic', bg: '#050a05', body: [100, 255, 120], organelles: [[50,255,100],[150,255,50],[100,255,200]], tendrils: [120,255,140], particles: [180,255,200] },
  { name: 'Void', bg: '#080508', body: [200, 140, 255], organelles: [[180,100,255],[220,80,200],[140,120,255]], tendrils: [200,160,255], particles: [220,180,255] },
  { name: 'Deep', bg: '#030508', body: [255, 100, 140], organelles: [[255,60,100],[255,140,180],[200,80,160]], tendrils: [255,120,160], particles: [255,160,200] },
  { name: 'Aurora', bg: '#050a0a', body: [100, 255, 200], organelles: [[80,255,180],[120,200,255],[180,255,220]], tendrils: [140,255,220], particles: [200,255,240] },
];

let palIdx = 0;
let pal = palettes[0];

function lerpColor(a, b, t) {
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
}
function rgb(c, a=1) { return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`; }

// --- State ---
let mouse = { x: W/2, y: H/2, down: false, active: false };
let time = 0;
let organisms = [];
let particles = [];
let pulses = [];

class Organism {
  constructor(x, y) {
    this.x = x || W/2 + (Math.random()-0.5) * 200;
    this.y = y || H/2 + (Math.random()-0.5) * 200;
    this.radius = 25 + Math.random() * 35;
    this.baseRadius = this.radius;
    this.phase = Math.random() * Math.PI * 2;
    this.breathSpeed = 0.008 + Math.random() * 0.012;
    this.vx = (Math.random()-0.5) * 0.3;
    this.vy = (Math.random()-0.5) * 0.3;
    this.organelles = [];
    this.tendrils = [];
    this.age = 0;
    this.alive = true;
    this.hueShift = Math.random() * 0.3;
    
    // Create organelles (internal glowing bodies)
    const numOrg = 3 + (Math.random() * 5) | 0;
    for (let i = 0; i < numOrg; i++) {
      this.organelles.push({
        angle: Math.random() * Math.PI * 2,
        dist: Math.random() * this.radius * 0.5,
        size: 2 + Math.random() * 5,
        speed: 0.003 + Math.random() * 0.01,
        phase: Math.random() * Math.PI * 2,
        colorIdx: (Math.random() * pal.organelles.length) | 0,
      });
    }
    
    // Create tendrils (external wavy appendages)
    const numTend = 5 + (Math.random() * 8) | 0;
    for (let i = 0; i < numTend; i++) {
      this.tendrils.push({
        angle: (i / numTend) * Math.PI * 2 + (Math.random()-0.5) * 0.3,
        length: this.radius * (1.5 + Math.random() * 3),
        segments: 8 + (Math.random() * 12) | 0,
        waveSpeed: 0.01 + Math.random() * 0.02,
        waveAmp: 0.2 + Math.random() * 0.5,
        phase: Math.random() * Math.PI * 2,
        width: 1 + Math.random() * 2.5,
      });
    }
  }
  
  update(dt) {
    this.age += dt;
    this.phase += this.breathSpeed;
    this.radius = this.baseRadius + Math.sin(this.phase) * this.baseRadius * 0.12;
    
    // Gentle drift
    this.x += this.vx;
    this.y += this.vy;
    
    // Soft boundary bounce
    const margin = 150;
    if (this.x < margin) this.vx += 0.02;
    if (this.x > W - margin) this.vx -= 0.02;
    if (this.y < margin) this.vy += 0.02;
    if (this.y > H - margin) this.vy -= 0.02;
    this.vx *= 0.99;
    this.vy *= 0.99;
    
    // Mouse interaction
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 300) {
        const force = (1 - dist/300) * (mouse.down ? 0.15 : -0.08);
        this.vx += (dx/dist) * force;
        this.vy += (dy/dist) * force;
      }
    }
    
    // Update organelles
    this.organelles.forEach(o => {
      o.phase += o.speed;
      o.angle += 0.002;
    });
    
    // Update tendrils
    this.tendrils.forEach(t => {
      t.phase += t.waveSpeed;
    });
    
    // Emit ambient particles
    if (Math.random() < 0.15) {
      const a = Math.random() * Math.PI * 2;
      const d = this.radius * (0.8 + Math.random() * 0.5);
      particles.push(new Particle(
        this.x + Math.cos(a) * d,
        this.y + Math.sin(a) * d,
        (Math.random()-0.5) * 0.5,
        (Math.random()-0.5) * 0.5,
        40 + Math.random() * 60,
        pal.particles[Math.random() * pal.particles.length | 0],
        1 + Math.random() * 2
      ));
    }
  }
  
  draw() {
    // Draw tendrils (back layer)
    this.tendrils.forEach(t => {
      const baseX = this.x + Math.cos(t.angle) * this.radius * 0.85;
      const baseY = this.y + Math.sin(t.angle) * this.radius * 0.85;
      
      ctx.beginPath();
      ctx.moveTo(baseX, baseY);
      
      let prevX = baseX, prevY = baseY;
      for (let i = 1; i <= t.segments; i++) {
        const frac = i / t.segments;
        const wave = Math.sin(t.phase + frac * 3) * t.waveAmp * frac * 40;
        const perpAngle = t.angle + Math.PI/2;
        const alongDist = (t.length / t.segments) * frac;
        const nx = baseX + Math.cos(t.angle) * alongDist + Math.cos(perpAngle) * wave;
        const ny = baseY + Math.sin(t.angle) * alongDist + Math.sin(perpAngle) * wave;
        
        ctx.lineTo(nx, ny);
        prevX = nx; prevY = ny;
      }
      
      const alpha = 0.15 + Math.sin(this.phase + t.phase) * 0.08;
      ctx.strokeStyle = rgb(pal.tendrils, alpha);
      ctx.lineWidth = t.width * (1 - 0.3 * Math.sin(this.phase));
      ctx.lineCap = 'round';
      ctx.stroke();
    });
    
    // Draw outer membrane glow
    const glowGrad = ctx.createRadialGradient(this.x, this.y, this.radius * 0.5, this.x, this.y, this.radius * 1.8);
    glowGrad.addColorStop(0, rgb(pal.body, 0.08 + Math.sin(this.phase) * 0.03));
    glowGrad.addColorStop(1, rgb(pal.body, 0));
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 1.8, 0, Math.PI * 2);
    ctx.fillStyle = glowGrad;
    ctx.fill();
    
    // Draw main body
    const bodyGrad = ctx.createRadialGradient(
      this.x - this.radius * 0.2, this.y - this.radius * 0.2, this.radius * 0.1,
      this.x, this.y, this.radius
    );
    const bodyColor = pal.body.map(c => c * (0.7 + Math.sin(this.phase) * 0.15));
    bodyGrad.addColorStop(0, rgb(bodyColor, 0.25));
    bodyGrad.addColorStop(0.5, rgb(bodyColor, 0.1));
    bodyGrad.addColorStop(1, rgb(bodyColor, 0.02));
    ctx.beginPath();
    // Slightly organic blob shape
    for (let a = 0; a < Math.PI * 2; a += 0.1) {
      const wobble = Math.sin(a * 3 + this.phase) * this.radius * 0.06 + 
                     Math.sin(a * 5 - this.phase * 0.7) * this.radius * 0.04;
      const r = this.radius + wobble;
      const px = this.x + Math.cos(a) * r;
      const py = this.y + Math.sin(a) * r;
      if (a === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    
    // Membrane ring
    ctx.beginPath();
    for (let a = 0; a < Math.PI * 2; a += 0.08) {
      const wobble = Math.sin(a * 3 + this.phase) * this.radius * 0.06 + 
                     Math.sin(a * 5 - this.phase * 0.7) * this.radius * 0.04;
      const r = this.radius + wobble;
      const px = this.x + Math.cos(a) * r;
      const py = this.y + Math.sin(a) * r;
      if (a === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.strokeStyle = rgb(pal.body, 0.2 + Math.sin(this.phase * 1.3) * 0.1);
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    // Draw organelles
    this.organelles.forEach(o => {
      o.angle += o.speed * 0.5;
      const ox = this.x + Math.cos(o.angle) * o.dist * (0.8 + Math.sin(o.phase) * 0.3);
      const oy = this.y + Math.sin(o.angle) * o.dist * (0.8 + Math.sin(o.phase) * 0.3);
      const orgColor = pal.organelles[o.colorIdx];
      const pulse = 0.6 + Math.sin(o.phase) * 0.4;
      
      const orgGlow = ctx.createRadialGradient(ox, oy, 0, ox, oy, o.size * 4);
      orgGlow.addColorStop(0, rgb(orgColor, 0.4 * pulse));
      orgGlow.addColorStop(1, rgb(orgColor, 0));
      ctx.beginPath();
      ctx.arc(ox, oy, o.size * 4, 0, Math.PI * 2);
      ctx.fillStyle = orgGlow;
      ctx.fill();
      
      ctx.beginPath();
      ctx.arc(ox, oy, o.size * pulse, 0, Math.PI * 2);
      ctx.fillStyle = rgb(orgColor, 0.6 * pulse);
      ctx.fill();
    });
    
    // Core nucleus
    const nucleusPulse = 0.8 + Math.sin(this.phase * 2) * 0.2;
    const nucleusGlow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 0.25);
    nucleusGlow.addColorStop(0, rgb(pal.body, 0.35 * nucleusPulse));
    nucleusGlow.addColorStop(1, rgb(pal.body, 0));
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = nucleusGlow;
    ctx.fill();
  }
  
  pulse() {
    // Emit burst of particles
    const count = 30 + (Math.random() * 20) | 0;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 3;
      particles.push(new Particle(
        this.x + Math.cos(a) * this.radius * 0.5,
        this.y + Math.sin(a) * this.radius * 0.5,
        Math.cos(a) * speed,
        Math.sin(a) * speed,
        60 + Math.random() * 80,
        pal.particles[Math.random() * pal.particles.length | 0],
        1.5 + Math.random() * 3
      ));
    }
    pulses.push(new Pulse(this.x, this.y, this.radius * 2, pal.body));
  }
}

class Particle {
  constructor(x, y, vx, vy, life, color, size) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.life = life;
    this.maxLife = life;
    this.color = color;
    this.size = size;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.98;
    this.vy *= 0.98;
    this.life--;
  }
  draw() {
    const alpha = (this.life / this.maxLife) * 0.6;
    const s = this.size * (this.life / this.maxLife);
    const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, s * 3);
    glow.addColorStop(0, rgb(this.color, alpha));
    glow.addColorStop(1, rgb(this.color, 0));
    ctx.beginPath();
    ctx.arc(this.x, this.y, s * 3, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();
  }
  get dead() { return this.life <= 0; }
}

class Pulse {
  constructor(x, y, maxR, color) {
    this.x = x; this.y = y;
    this.r = 10;
    this.maxR = maxR;
    this.color = color;
    this.life = 1;
  }
  update() {
    this.r += (this.maxR - this.r) * 0.06;
    this.life -= 0.015;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.strokeStyle = rgb(this.color, this.life * 0.3);
    ctx.lineWidth = 2 * this.life;
    ctx.stroke();
  }
  get dead() { return this.life <= 0; }
}

// --- Initialization ---
function init() {
  organisms = [];
  particles = [];
  pulses = [];
  
  // Spawn 3-5 organisms
  const count = 3 + (Math.random() * 3) | 0;
  for (let i = 0; i < count; i++) {
    organisms.push(new Organism(
      W * 0.2 + Math.random() * W * 0.6,
      H * 0.2 + Math.random() * H * 0.6
    ));
  }
}

function mutate() {
  // Change palette
  palIdx = (palIdx + 1) % palettes.length;
  pal = palettes[palIdx];
  document.body.style.background = pal.bg;
  
  // Spawn new organism from click point or center
  const x = mouse.active ? mouse.x : W/2 + (Math.random()-0.5) * 300;
  const y = mouse.active ? mouse.y : H/2 + (Math.random()-0.5) * 300;
  
  const newOrg = new Organism(x, y);
  newOrg.baseRadius = 15 + Math.random() * 25;
  newOrg.radius = newOrg.baseRadius;
  organisms.push(newOrg);
  
  // Burst particles at spawn point
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 2;
    particles.push(new Particle(x, y, Math.cos(a)*speed, Math.sin(a)*speed, 50 + Math.random()*40, pal.particles[Math.random()*pal.particles.length|0], 2 + Math.random()*3));
  }
  
  pulses.push(new Pulse(x, y, 150, pal.body));
  
  // Cap organisms
  if (organisms.length > 8) organisms.shift();
}

// --- Main Loop ---
function drawBackground() {
  // Fade trail
  ctx.fillStyle = pal.bg + '18';
  ctx.fillRect(0, 0, W, H);
  
  // Subtle vignette
  const vig = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.7);
  vig.addColorStop(0, 'transparent');
  vig.addColorStop(1, 'rgba(0,0,0,0.15)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

function drawCursor() {
  if (!mouse.active) return;
  const cursorGlow = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 40);
  cursorGlow.addColorStop(0, rgb(pal.body, mouse.down ? 0.2 : 0.08));
  cursorGlow.addColorStop(1, rgb(pal.body, 0));
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, 40, 0, Math.PI * 2);
  ctx.fillStyle = cursorGlow;
  ctx.fill();
  
  // Cursor dot
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = rgb(pal.body, 0.5);
  ctx.fill();
}

function loop() {
  time++;
  drawBackground();
  
  // Update & draw pulses
  pulses = pulses.filter(p => !p.dead);
  pulses.forEach(p => { p.update(); p.draw(); });
  
  // Update & draw organisms
  organisms.forEach(o => { o.update(1); o.draw(); });
  
  // Update & draw particles
  particles = particles.filter(p => !p.dead);
  particles.forEach(p => { p.update(); p.draw(); });
  
  // Draw cursor
  drawCursor();
  
  // Connection filaments between nearby organisms
  for (let i = 0; i < organisms.length; i++) {
    for (let j = i+1; j < organisms.length; j++) {
      const a = organisms[i], b = organisms[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const maxDist = 300;
      if (dist < maxDist) {
        const alpha = (1 - dist/maxDist) * 0.08;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        
        // Slight curve
        const mx = (a.x + b.x)/2 + Math.sin(time * 0.01 + i) * 20;
        const my = (a.y + b.y)/2 + Math.cos(time * 0.01 + j) * 20;
        ctx.quadraticCurveTo(mx, my, b.x, b.y);
        ctx.strokeStyle = rgb(pal.tendrils, alpha);
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }
  
  requestAnimationFrame(loop);
}

// --- Input ---
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
canvas.addEventListener('mousedown', e => {
  mouse.down = true;
  if (e.button === 0) {
    organisms.forEach(o => o.pulse());
  }
});
canvas.addEventListener('mouseup', () => mouse.down = false);
canvas.addEventListener('mouseleave', () => { mouse.active = false; mouse.down = false; });

// Touch support
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY;
  mouse.active = true; mouse.down = true;
  organisms.forEach(o => o.pulse());
}, {passive: false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY;
}, {passive: false});
canvas.addEventListener('touchend', () => { mouse.down = false; });

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); mutate(); }
  if (e.key === 'r' || e.key === 'R') { init(); }
  if (e.key === 's' || e.key === 'S') {
    const link = document.createElement('a');
    link.download = 'chromatic-organism.png';
    link.href = canvas.toDataURL();
    link.click();
  }
});

// Fade hint after 5s
setTimeout(() => {
  document.getElementById('hint').style.opacity = '0';
}, 5000);

// --- Start ---
document.body.style.background = pal.bg;
init();
loop();
</script>
</body>
</html>
