<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromatic Prism — Kaleidoscope Loom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050508;
    font-family: 'Courier New', monospace;
    color: #ccc;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #canvas {
    flex: 1;
    cursor: crosshair;
    display: block;
  }
  .controls {
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(5,5,10,0.85);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 11px;
    color: #888;
    backdrop-filter: blur(8px);
    z-index: 10;
    min-width: 190px;
    letter-spacing: 1px;
  }
  .controls h2 {
    color: #fff;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .controls label {
    display: block;
    margin: 8px 0 3px;
    color: #777;
  }
  .controls input[type="range"] {
    width: 100%;
    accent-color: #8b7fff;
    background: transparent;
  }
  .controls .btn {
    margin-top: 8px;
    padding: 5px 10px;
    background: rgba(139,127,255,0.1);
    border: 1px solid rgba(139,127,255,0.3);
    color: #aaa;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .controls .btn:hover {
    background: rgba(139,127,255,0.2);
    color: #fff;
    border-color: rgba(139,127,255,0.6);
  }
  .info {
    position: fixed;
    bottom: 16px;
    right: 16px;
    color: #333;
    font-size: 10px;
    letter-spacing: 1px;
    text-align: right;
    z-index: 10;
  }
  .info span { color: #555; }
</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="controls">
    <h2>Prism Loom</h2>
    <label>SECTORS <span id="sectorVal">12</span></label>
    <input type="range" id="sectors" min="4" max="32" value="12" step="2">
    <label>COMPLEXITY <span id="compVal">5</span></label>
    <input type="range" id="complexity" min="2" max="10" value="5">
    <label>SPEED <span id="speedVal">1.0</span></label>
    <input type="range" id="speed" min="1" max="30" value="10">
    <label>HUE SHIFT <span id="hueVal">0</span>°</label>
    <input type="range" id="hue" min="0" max="360" value="0">
    <button class="btn" id="randomize">⟳ Randomize</button>
    <button class="btn" id="save">↓ Save PNG</button>
    <button class="btn" id="toggle">⏯ Pause</button>
  </div>
  <div class="info">
    <span>CLICK</span> reshape · <span>MOVE</span> attract<br>
    <span>SPACE</span> palette · <span>R</span> randomize
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H, cx, cy;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

// State
let sectors = 12;
let complexity = 5;
let speed = 1.0;
let hueOffset = 0;
let mouseX = cx, mouseY = cy;
let mouseActive = false;
let paused = false;
let time = 0;

// Palettes — each is [baseHue, range, saturation]
const palettes = [
  { name: 'Aurora', hue: 160, range: 80, sat: 85 },
  { name: 'Nebula', hue: 260, range: 70, sat: 90 },
  { name: 'Ember', hue: 15, range: 40, sat: 95 },
  { name: 'Void', hue: 280, range: 60, sat: 70 },
  { name: 'Ocean', hue: 200, range: 50, sat: 80 },
  { name: 'Solar', hue: 45, range: 30, sat: 100 },
];
let paletteIdx = 0;
let palette = palettes[0];

// Organic pattern functions using layered sine waves (no Perlin lib)
function noise(x, y, t) {
  const a = Math.sin(x * 0.7 + t) * Math.cos(y * 0.9 - t * 0.7);
  const b = Math.sin((x + y) * 0.5 + t * 1.3);
  const c = Math.cos(x * 1.4 - y * 0.3 + t * 0.6);
  const d = Math.sin(Math.sqrt(x * x + y * y) * 0.3 - t);
  return (a + b + c + d) / 4;
}

function layeredNoise(x, y, t, octaves) {
  let val = 0, amp = 1, freq = 1, max = 0;
  for (let i = 0; i < octaves; i++) {
    val += noise(x * freq, y * freq, t) * amp;
    max += amp;
    amp *= 0.5;
    freq *= 2.1;
  }
  return val / max;
}

function getHue(angle, dist, t) {
  const n = layeredNoise(angle * 2, dist * 0.01, t, complexity);
  const base = palette.hue + hueOffset;
  return (base + n * palette.range + angle * 30) % 360;
}

function getAlpha(angle, dist, t) {
  const n = layeredNoise(angle * 1.5 + 10, dist * 0.008, t * 1.2, Math.max(2, complexity - 1));
  return 0.15 + (n + 1) * 0.35;
}

// Draw one symmetric sector
function drawSector(secIdx, t) {
  const angleStep = (Math.PI * 2) / sectors;
  const baseAngle = secIdx * angleStep;

  // Mouse influence in sector-local coords
  let mx = 0, my = 0;
  if (mouseActive) {
    const dx = mouseX - cx, dy = mouseY - cy;
    const mAngle = Math.atan2(dy, dx);
    const mDist = Math.sqrt(dx * dx + dy * dy);
    const relAngle = ((mAngle - baseAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    if (relAngle < angleStep) {
      mx = Math.cos(relAngle) * mDist;
      my = Math.sin(relAngle) * mDist;
    }
  }

  const maxR = Math.min(W, H) * 0.45;
  const steps = 80;
  const layers = Math.max(2, complexity);

  for (let layer = 0; layer < layers; layer++) {
    const layerFrac = layer / layers;
    const rBase = maxR * (0.3 + layerFrac * 0.7);
    const hue = getHue(baseAngle + layer * 0.3, rBase, t + layer * 0.5);
    const alpha = getAlpha(baseAngle + layer * 0.3, rBase, t + layer * 0.5);

    ctx.beginPath();
    ctx.strokeStyle = `hsla(${hue}, ${palette.sat}%, ${45 + layerFrac * 30}%, ${alpha})`;
    ctx.lineWidth = 1.2 + layerFrac * 0.8;

    let started = false;
    for (let i = 0; i <= steps; i++) {
      const frac = i / steps;
      const angle = frac * angleStep;
      const nv = layeredNoise(angle * 3 + layer, frac * 4, t * speed + layer, complexity);
      const mousePull = mouseActive ? Math.exp(-Math.abs(angle - Math.atan2(my, mx)) * 4) * 0.25 : 0;
      const r = rBase * (0.4 + frac * 0.6) + nv * maxR * 0.2 + mousePull * Math.sqrt(mx * mx + my * my);

      const x = cx + Math.cos(baseAngle + angle) * r;
      const y = cy + Math.sin(baseAngle + angle) * r;

      if (!started) { ctx.moveTo(x, y); started = true; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // Accent dots at nodes
  const dotCount = 6;
  for (let d = 0; d < dotCount; d++) {
    const df = d / dotCount;
    const da = df * angleStep;
    const nv = layeredNoise(da * 2 + layer, df * 3, t * speed * 1.3, complexity);
    const dr = maxR * (0.5 + nv * 0.4);
    const dx = cx + Math.cos(baseAngle + da) * dr;
    const dy = cy + Math.sin(baseAngle + da) * dr;
    const dh = getHue(baseAngle + da, dr, t);
    const size = 1.5 + Math.abs(nv) * 3;

    ctx.beginPath();
    ctx.fillStyle = `hsla(${dh}, ${palette.sat}%, 70%, ${0.5 + Math.abs(nv) * 0.4})`;
    ctx.arc(dx, dy, size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawFrame() {
  if (!paused) time += 0.012 * speed;

  // Fade trail
  ctx.fillStyle = 'rgba(5, 5, 8, 0.12)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(cx, cy);

  // Draw all sectors
  for (let s = 0; s < sectors; s++) {
    ctx.save();
    ctx.rotate(s * (Math.PI * 2) / sectors);
    ctx.translate(-cx, -cy);
    drawSector(s, time);
    ctx.restore();
  }

  ctx.restore();

  // Central glow
  const glowR = 30 + Math.sin(time * 2) * 10;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
  const glowHue = (palette.hue + hueOffset + time * 20) % 360;
  grad.addColorStop(0, `hsla(${glowHue}, ${palette.sat}%, 80%, 0.5)`);
  grad.addColorStop(0.5, `hsla(${glowHue}, ${palette.sat}%, 60%, 0.1)`);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(cx - glowR, cy - glowR, glowR * 2, glowR * 2);

  requestAnimationFrame(drawFrame);
}

// Inputs
document.getElementById('sectors').addEventListener('input', e => {
  sectors = parseInt(e.target.value);
  document.getElementById('sectorVal').textContent = sectors;
});
document.getElementById('complexity').addEventListener('input', e => {
  complexity = parseInt(e.target.value);
  document.getElementById('compVal').textContent = complexity;
});
document.getElementById('speed').addEventListener('input', e => {
  speed = parseInt(e.target.value) / 10;
  document.getElementById('speedVal').textContent = speed.toFixed(1);
});
document.getElementById('hue').addEventListener('input', e => {
  hueOffset = parseInt(e.target.value);
  document.getElementById('hueVal').textContent = hueOffset;
});

document.getElementById('randomize').addEventListener('click', randomize);
document.getElementById('save').addEventListener('click', savePNG);

document.getElementById('toggle').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('toggle').textContent = paused ? '▶ Play' : '⏯ Pause';
});

// Mouse
canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY; mouseActive = true;
});
canvas.addEventListener('mouseleave', () => { mouseActive = false; });
canvas.addEventListener('click', e => {
  // Burst effect — flash the center
  const grad = ctx.createRadialGradient(e.clientX, e.clientY, 0, e.clientX, e.clientY, 80);
  const bh = (palette.hue + hueOffset + time * 40) % 360;
  grad.addColorStop(0, `hsla(${bh}, 100%, 80%, 0.8)`);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(e.clientX - 80, e.clientY - 80, 160, 160);
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    paletteIdx = (paletteIdx + 1) % palettes.length;
    palette = palettes[paletteIdx];
  }
  if (e.key === 'r' || e.key === 'R') randomize();
});

function randomize() {
  sectors = [4, 6, 8, 10, 12, 16, 20, 24][Math.floor(Math.random() * 8)];
  complexity = 2 + Math.floor(Math.random() * 8);
  paletteIdx = Math.floor(Math.random() * palettes.length);
  palette = palettes[paletteIdx];
  document.getElementById('sectors').value = sectors;
  document.getElementById('sectorVal').textContent = sectors;
  document.getElementById('complexity').value = complexity;
  document.getElementById('compVal').textContent = complexity;
  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, W, H);
}

function savePNG() {
  const link = document.createElement('a');
  link.download = `chromatic-prism-${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// Init
ctx.fillStyle = '#050508';
ctx.fillRect(0, 0, W, H);
drawFrame();
</script>
</body>
</html>
