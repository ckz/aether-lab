<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cipherbloom Resonance</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05050a; }
  canvas { display: block; }
  #ui {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; padding: 10px 14px; border-radius: 999px;
    background: rgba(255,255,255,0.04); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.55);
    font: 12px/1.2 system-ui, sans-serif; letter-spacing: 0.4px; user-select: none;
  }
  #ui button {
    background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 999px; padding: 8px 12px;
    cursor: pointer; transition: all 0.2s ease;
  }
  #ui button:hover { background: rgba(255,255,255,0.12); }
  #title {
    position: fixed; top: 22px; left: 28px; color: rgba(255,255,255,0.35);
    font: 11px/1 system-ui, sans-serif; letter-spacing: 3px; text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="title">✦ Cipherbloom Resonance</div>
<canvas id="c"></canvas>
<div id="ui">
  <button id="clearBtn">Clear</button>
  <button id="autoBtn">Auto: ON</button>
  <button id="paletteBtn">Palette</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const palettes = [
  { name: 'Aurora', colors: ['#7df9ff','#ff85a1','#c084fc','#67e8f9','#fcd34d'] },
  { name: 'Ember', colors: ['#ff6b35','#ff9f1c','#ffdc5e','#ff3d00','#ffab76'] },
  { name: 'Void', colors: ['#8b5cf6','#6366f1','#3b82f6','#22d3ee','#a78bfa'] },
  { name: 'Biolum', colors: ['#4ade80','#22d3ee','#a78bfa','#f472b6','#fbbf24'] },
];
let paletteIdx = 0;
let autoMode = true;
let lastAuto = 0;

class Petal {
  constructor(x, y, hueShift = 0) {
    this.x = x; this.y = y;
    const p = palettes[paletteIdx];
    this.color = p.colors[Math.floor(Math.random() * p.colors.length)];
    this.hueShift = hueShift;
    this.angle = Math.random() * Math.PI * 2;
    this.radius = 0;
    this.maxRadius = 18 + Math.random() * 50;
    this.speed = 0.3 + Math.random() * 0.8;
    this.rotSpeed = (Math.random() - 0.5) * 0.04;
    this.life = 1;
    this.decay = 0.004 + Math.random() * 0.012;
    this.petals = 3 + Math.floor(Math.random() * 5);
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.01 + Math.random() * 0.03;
    this.kind = Math.random() > 0.7 ? 'ring' : (Math.random() > 0.5 ? 'spore' : 'bloom');
  }

  update() {
    this.wobble += this.wobbleSpeed;
    this.radius += (this.maxRadius - this.radius) * 0.05 + this.speed;
    this.life -= this.decay;
    this.angle += this.rotSpeed;
    return this.life > 0;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x + Math.sin(this.wobble) * 8, this.y + Math.cos(this.wobble * 1.3) * 8);
    ctx.rotate(this.angle);
    ctx.globalAlpha = Math.max(0, this.life) * 0.9;

    if (this.kind === 'bloom') {
      this.drawBloom();
    } else if (this.kind === 'ring') {
      this.drawRing();
    } else {
      this.drawSpore();
    }

    ctx.restore();
  }

  drawBloom() {
    const petals = this.petals;
    for (let i = 0; i < petals; i++) {
      const a = (i / petals) * Math.PI * 2;
      ctx.save();
      ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(
        this.radius * 0.4, -this.radius * 0.25,
        this.radius * 0.8, -this.radius * 0.15,
        this.radius, 0
      );
      ctx.bezierCurveTo(
        this.radius * 0.8, this.radius * 0.15,
        this.radius * 0.4, this.radius * 0.25,
        0, 0
      );
      ctx.fillStyle = this.color;
      ctx.shadowBlur = 12;
      ctx.shadowColor = this.color;
      ctx.fill();
      ctx.restore();
    }
    // center glow
    const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius * 0.3);
    cg.addColorStop(0, 'rgba(255,255,255,0.8)');
    cg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.3, 0, Math.PI * 2); ctx.fill();
  }

  drawRing() {
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 10;
    ctx.shadowColor = this.color;
    ctx.globalAlpha = Math.max(0, this.life) * 0.5;
    ctx.stroke();
    ctx.globalAlpha = Math.max(0, this.life) * 0.9;
    ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
  }

  drawSpore() {
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + this.wobble;
      const r = this.radius * (0.4 + 0.6 * Math.abs(Math.sin(this.wobble * 2 + i)));
      ctx.beginPath();
      ctx.arc(Math.cos(a) * r, Math.sin(a) * r, 1.5 + Math.random(), 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.shadowBlur = 6;
      ctx.shadowColor = this.color;
      ctx.fill();
    }
  }
}

const blooms = [];
const glyphs = [];

class Glyph {
  constructor(x, y, char) {
    this.x = x; this.y = y;
    this.char = char || String.fromCharCode(0x25A0 + Math.floor(Math.random() * 20));
    this.life = 1; this.decay = 0.006 + Math.random() * 0.01;
    this.vy = -0.2 - Math.random() * 0.5;
    this.size = 10 + Math.random() * 14;
    this.rotation = Math.random() * Math.PI;
    this.color = palettes[paletteIdx].colors[Math.floor(Math.random() * 5)];
  }
  update() {
    this.y += this.vy;
    this.vy *= 0.995;
    this.life -= this.decay;
    this.rotation += 0.01;
    return this.life > 0;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.globalAlpha = Math.max(0, this.life) * 0.7;
    ctx.font = `${this.size}px Georgia, serif`;
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = this.color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.char, 0, 0);
    ctx.restore();
  }
}

function spawn(x, y, count = 1, char = null) {
  for (let i = 0; i < count; i++) {
    blooms.push(new Petal(x + (Math.random() - 0.5) * 20, y + (Math.random() - 0.5) * 20));
    if (Math.random() > 0.5) glyphs.push(new Glyph(x, y - 10, char));
  }
}

window.addEventListener('mousemove', e => {
  if (Math.random() > 0.7) spawn(e.clientX, e.clientY, 1);
});
window.addEventListener('click', e => {
  spawn(e.clientX, e.clientY, 2 + Math.floor(Math.random() * 4));
});
window.addEventListener('keydown', e => {
  spawn(W / 2 + (Math.random() - 0.5) * W * 0.6, H / 2 + (Math.random() - 0.5) * H * 0.4, 1, e.key);
});
window.addEventListener('touchmove', e => {
  const t = e.touches[0];
  spawn(t.clientX, t.clientY, 1);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  blooms.length = 0; glyphs.length = 0;
  ctx.fillStyle = '#05050a'; ctx.fillRect(0, 0, W, H);
});
document.getElementById('autoBtn').addEventListener('click', function() {
  autoMode = !autoMode; this.textContent = 'Auto: ' + (autoMode ? 'ON' : 'OFF');
});
document.getElementById('paletteBtn').addEventListener('click', () => {
  paletteIdx = (paletteIdx + 1) % palettes.length;
});

function bg() {
  ctx.fillStyle = 'rgba(5,5,10,0.12)';
  ctx.fillRect(0, 0, W, H);
}

function loop(ts) {
  bg();
  if (autoMode && ts - lastAuto > 400) {
    lastAuto = ts;
    spawn(Math.random() * W, Math.random() * H, 1);
  }
  for (let i = blooms.length - 1; i >= 0; i--) {
    blooms[i].draw(); if (!blooms[i].update()) blooms.splice(i, 1);
  }
  for (let i = glyphs.length - 1; i >= 0; i--) {
    glyphs[i].draw(); if (!glyphs[i].update()) glyphs.splice(i, 1);
  }
  requestAnimationFrame(loop);
}

ctx.fillStyle = '#05050a'; ctx.fillRect(0, 0, W, H);
requestAnimationFrame(loop);
</script>
</body>
</html>
