<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellation Creator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000010;
    overflow: hidden;
    font-family: 'Georgia', serif;
    cursor: crosshair;
    height: 100vh;
    width: 100vw;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
  }
  .ui {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #8899bb;
    font-size: 14px;
    text-align: center;
    pointer-events: none;
    z-index: 10;
    letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(100, 150, 255, 0.5);
    transition: opacity 3s;
  }
  .title {
    font-size: 22px;
    color: #ccddff;
    margin-bottom: 6px;
    letter-spacing: 3px;
    text-shadow: 0 0 30px rgba(150, 180, 255, 0.7);
  }
  .stats {
    position: fixed;
    bottom: 20px;
    left: 20px;
    color: #445577;
    font-size: 12px;
    pointer-events: none;
    z-index: 10;
    letter-spacing: 1px;
  }
  .hint {
    position: fixed;
    bottom: 20px;
    right: 20px;
    color: #334466;
    font-size: 11px;
    pointer-events: none;
    z-index: 10;
    text-align: right;
    line-height: 1.8;
  }
  .shooting-star {
    position: fixed;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    pointer-events: none;
    z-index: 5;
    box-shadow: 0 0 6px 2px rgba(200, 220, 255, 0.8);
    opacity: 0;
  }
  @keyframes shoot {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="ui" id="ui">
  <div class="title">✦ CONSTELLATION CREATOR ✦</div>
  Click to place stars · Right-click to clear · Drag to connect
</div>
<div class="stats" id="stats">stars: 0</div>
<div class="hint">
  click — place star<br>
  shift+click — connect stars<br>
  right-click — clear all<br>
  space — shooting star
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let stars = [];
let connections = [];
let mouse = { x: W/2, y: H/2 };
let selectedStar = null;
let nebulaOffset = 0;
let shootingStars = [];

// Generate a seeded-ish color from position
function starColor(x, y) {
  const palette = [
    [200, 220, 255],  // blue-white
    [255, 240, 200],  // warm white
    [255, 200, 180],  // pink
    [180, 200, 255],  // blue
    [255, 255, 220],  // yellow
  ];
  const idx = Math.floor((x * 0.01 + y * 0.013) % palette.length);
  return palette[Math.abs(idx) % palette.length];
}

function addStar(x, y) {
  // Don't place too close to existing
  for (const s of stars) {
    if (Math.hypot(s.x - x, s.y - y) < 25) return;
  }
  stars.push({
    x, y,
    radius: 1.5 + Math.random() * 2,
    color: starColor(x, y),
    twinkle: Math.random() * Math.PI * 2,
    twinkleSpeed: 0.02 + Math.random() * 0.03,
    pulsePhase: Math.random() * Math.PI * 2,
    birth: Date.now(),
    label: null,
  });
  updateStats();
}

function updateStats() {
  document.getElementById('stats').textContent = 
    `stars: ${stars.length} · lines: ${connections.length}`;
}

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  
  // Hover effect
  for (const s of stars) {
    const d = Math.hypot(s.x - mouse.x, s.y - mouse.y);
    if (d < 30) s.hovered = true;
    else s.hovered = false;
  }
});

canvas.addEventListener('click', (e) => {
  if (e.shiftKey && stars.length >= 2) {
    // Connect to nearest
    const nearest = [...stars].sort((a, b) => 
      Math.hypot(a.x - e.clientX, a.y - e.clientY) - 
      Math.hypot(b.x - e.clientX, b.y - e.clientY)
    );
    // Find nearest that's not already connected
    for (let i = 1; i < nearest.length; i++) {
      const a = nearest[0];
      const b = nearest[i];
      const exists = connections.some(c => 
        (c.a === a && c.b === b) || (c.a === b && c.b === a)
      );
      if (!exists) {
        connections.push({ a, b, birth: Date.now() });
        break;
      }
    }
  } else {
    addStar(e.clientX, e.clientY);
  }
});

canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  stars = [];
  connections = [];
  updateStats();
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    spawnShootingStar();
  }
});

function spawnShootingStar() {
  const startX = Math.random() * W;
  const startY = Math.random() * H * 0.5;
  const angle = Math.PI / 4 + (Math.random() - 0.5) * 0.5;
  const speed = 8 + Math.random() * 12;
  shootingStars.push({
    x: startX, y: startY,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    life: 1,
    trail: [],
  });
}

// Draw nebula background
function drawNebula() {
  nebulaOffset += 0.0003;
  const gradient = ctx.createRadialGradient(
    W * 0.3 + Math.sin(nebulaOffset) * 100, 
    H * 0.4 + Math.cos(nebulaOffset * 1.3) * 80,
    0,
    W * 0.5, H * 0.5, W * 0.8
  );
  gradient.addColorStop(0, 'rgba(15, 10, 40, 0.15)');
  gradient.addColorStop(0.5, 'rgba(5, 3, 20, 0.1)');
  gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
}

// Draw faint background stars
function drawBackgroundStars() {
  // Use fixed seed positions for background stars
  for (let i = 0; i < 200; i++) {
    const x = ((i * 7919) % W);
    const y = ((i * 6271) % H);
    const brightness = 0.2 + 0.3 * Math.sin(Date.now() * 0.001 + i);
    ctx.fillStyle = `rgba(150, 180, 220, ${brightness * 0.4})`;
    ctx.beginPath();
    ctx.arc(x, y, 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawConnections() {
  const now = Date.now();
  for (const conn of connections) {
    const age = (now - conn.birth) / 1000;
    const alpha = Math.min(1, age * 2) * 0.3;
    
    const grad = ctx.createLinearGradient(
      conn.a.x, conn.a.y, conn.b.x, conn.b.y
    );
    const [r1, g1, b1] = conn.a.color;
    const [r2, g2, b2] = conn.b.color;
    grad.addColorStop(0, `rgba(${r1}, ${g1}, ${b1}, ${alpha})`);
    grad.addColorStop(0.5, `rgba(180, 200, 255, ${alpha * 1.5})`);
    grad.addColorStop(1, `rgba(${r2}, ${g2}, ${b2}, ${alpha})`);
    
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(conn.a.x, conn.a.y);
    ctx.lineTo(conn.b.x, conn.b.y);
    ctx.stroke();
  }
}

function drawStars() {
  const now = Date.now();
  for (const s of stars) {
    const age = Math.min(1, (now - s.birth) / 500);
    const twinkle = 0.5 + 0.5 * Math.sin(s.twinkle);
    const pulse = 1 + 0.2 * Math.sin(s.pulsePhase);
    s.twinkle += s.twinkleSpeed;
    
    const [r, g, b] = s.color;
    const alpha = age * (0.6 + twinkle * 0.4);
    const radius = s.radius * age * pulse * (s.hovered ? 1.8 : 1);
    
    // Glow
    const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, radius * 8);
    glow.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha * 0.6})`);
    glow.addColorStop(0.3, `rgba(${r}, ${g}, ${b}, ${alpha * 0.15})`);
    glow.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(s.x, s.y, radius * 8, 0, Math.PI * 2);
    ctx.fill();
    
    // Core
    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, radius, 0, Math.PI * 2);
    ctx.fill();
    
    // Bright center
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, radius * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawShootingStars() {
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const ss = shootingStars[i];
    ss.trail.push({ x: ss.x, y: ss.y });
    if (ss.trail.length > 20) ss.trail.shift();
    
    ss.x += ss.vx;
    ss.y += ss.vy;
    ss.life -= 0.012;
    
    if (ss.life <= 0 || ss.x < 0 || ss.x > W || ss.y < 0 || ss.y > H) {
      shootingStars.splice(i, 1);
      continue;
    }
    
    // Draw trail
    for (let j = 0; j < ss.trail.length; j++) {
      const t = ss.trail[j];
      const alpha = (j / ss.trail.length) * ss.life * 0.8;
      const size = (j / ss.trail.length) * 2;
      ctx.fillStyle = `rgba(200, 220, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawMouseGlow() {
  const glow = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 80);
  glow.addColorStop(0, 'rgba(100, 150, 255, 0.04)');
  glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, 80, 0, Math.PI * 2);
  ctx.fill();
}

function loop() {
  ctx.fillStyle = 'rgba(0, 0, 10, 0.15)';
  ctx.fillRect(0, 0, W, H);
  
  // Occasionally redraw full background
  if (Math.random() < 0.01) {
    ctx.fillStyle = 'rgba(0, 0, 10, 0.4)';
    ctx.fillRect(0, 0, W, H);
  }
  
  drawNebula();
  drawBackgroundStars();
  drawMouseGlow();
  drawConnections();
  drawStars();
  drawShootingStars();
  
  requestAnimationFrame(loop);
}

// Initialize with a gentle fade
ctx.fillStyle = 'rgb(0, 0, 10)';
ctx.fillRect(0, 0, W, H);

loop();

// Occasional auto shooting star
setInterval(() => {
  if (Math.random() < 0.3) spawnShootingStar();
}, 8000);

// Fade UI after 5s
setTimeout(() => {
  document.getElementById('ui').style.opacity = '0';
}, 8000);
</script>
</body>
</html>
