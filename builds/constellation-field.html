<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellation Field — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #ccc;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
  }
  #info {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    opacity: 0.4;
    pointer-events: none;
    letter-spacing: 2px;
    z-index: 10;
  }
  #title {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    opacity: 0.3;
    pointer-events: none;
    letter-spacing: 6px;
    text-transform: uppercase;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="title">Constellation Field</div>
<canvas id="canvas"></canvas>
<div id="info">move your mouse · click to pulse</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
let mouse = { x: null, y: null, radius: 150 };
let particles = [];
let pulseWaves = [];
let time = 0;

// Color palettes cycling
const palettes = [
  ['#4fc3f7', '#29b6f6', '#03a9f4', '#039be5', '#81d4fa'],  // cyan
  ['#ce93d8', '#ba68c8', '#ab47bc', '#9c27b0', '#e1bee7'],  // violet
  ['#80cbc4', '#4db6ac', '#26a69a', '#009688', '#a7ffeb'],  // teal
  ['#ffcc80', '#ffb74d', '#ffa726', '#ff9800', '#ffe0b2'],  // amber
];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
window.addEventListener('mouseleave', () => {
  mouse.x = null;
  mouse.y = null;
});
window.addEventListener('click', e => {
  pulseWaves.push({
    x: e.clientX,
    y: e.clientY,
    radius: 0,
    maxRadius: 300,
    strength: 1,
    hue: Math.random() * 360
  });
});

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.4;
    this.size = Math.random() * 1.8 + 0.5;
    this.baseAlpha = Math.random() * 0.5 + 0.2;
    this.alpha = this.baseAlpha;
    this.paletteIdx = Math.floor(Math.random() * palettes.length);
    this.colorIdx = Math.floor(Math.random() * 5);
    this.pulsePhase = Math.random() * Math.PI * 2;
  }
  update(t) {
    // Gentle drift
    this.vx += (Math.random() - 0.5) * 0.02;
    this.vy += (Math.random() - 0.5) * 0.02;
    this.vx *= 0.99;
    this.vy *= 0.99;
    this.x += this.vx;
    this.y += this.vy;

    // Mouse interaction
    if (mouse.x !== null) {
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < mouse.radius) {
        const force = (mouse.radius - dist) / mouse.radius;
        const angle = Math.atan2(dy, dx);
        this.vx += Math.cos(angle) * force * 0.3;
        this.vy += Math.sin(angle) * force * 0.3;
        this.alpha = Math.min(1, this.baseAlpha + force * 0.5);
      } else {
        this.alpha += (this.baseAlpha - this.alpha) * 0.05;
      }
    }

    // Pulse waves
    for (let p of pulseWaves) {
      const dx = this.x - p.x;
      const dy = this.y - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const waveFront = p.radius;
      const waveWidth = 60;
      if (Math.abs(dist - waveFront) < waveWidth) {
        const proximity = 1 - Math.abs(dist - waveFront) / waveWidth;
        const angle = Math.atan2(dy, dx);
        this.vx += Math.cos(angle) * proximity * p.strength * 1.5;
        this.vy += Math.sin(angle) * proximity * p.strength * 1.5;
        this.alpha = Math.min(1, this.alpha + proximity * 0.6);
      }
    }

    // Breathing glow
    const breathe = Math.sin(t * 0.02 + this.pulsePhase) * 0.1;
    this.alpha = Math.max(0.05, Math.min(1, this.alpha + breathe));

    // Wrap
    if (this.x < -50) this.x = W + 50;
    if (this.x > W + 50) this.x = -50;
    if (this.y < -50) this.y = H + 50;
    if (this.y > H + 50) this.y = -50;
  }
  draw(t) {
    const palette = palettes[this.paletteIdx];
    const color = palette[this.colorIdx];
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.globalAlpha = this.alpha;
    ctx.fill();

    // Soft glow on bright particles
    if (this.alpha > 0.6) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.globalAlpha = this.alpha * 0.1;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

// Init particles
const NUM_PARTICLES = Math.min(300, Math.floor((W * H) / 6000));
for (let i = 0; i < NUM_PARTICLES; i++) {
  particles.push(new Particle());
}

function drawConnections(t) {
  const connectionDist = 110;
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < connectionDist) {
        const alpha = (1 - dist / connectionDist) * 0.25;
        const p1 = palettes[particles[i].paletteIdx];
        const p2 = palettes[particles[j].paletteIdx];
        const gradient = ctx.createLinearGradient(
          particles[i].x, particles[i].y,
          particles[j].x, particles[j].y
        );
        gradient.addColorStop(0, p1[particles[i].colorIdx]);
        gradient.addColorStop(1, p2[particles[j].colorIdx]);
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = gradient;
        ctx.globalAlpha = alpha;
        ctx.lineWidth = 0.5;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }
}

function animate() {
  time++;
  ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
  ctx.fillRect(0, 0, W, H);

  // Slowly cycle palette
  const cycleSpeed = 0.0003;
  const cycle = time * cycleSpeed;

  for (let p of particles) {
    p.update(time);
    p.draw(time);
  }

  drawConnections(time);

  // Update pulse waves
  for (let i = pulseWaves.length - 1; i >= 0; i--) {
    const pw = pulseWaves[i];
    pw.radius += 4;
    pw.strength *= 0.985;
    // Draw ring
    ctx.beginPath();
    ctx.arc(pw.x, pw.y, pw.radius, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${pw.hue + time * 2}, 70%, 60%, ${pw.strength * 0.3})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    if (pw.radius > pw.maxRadius) {
      pulseWaves.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
