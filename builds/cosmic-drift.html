<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Drift — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #aaa;
    cursor: crosshair;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-size: 12px;
    opacity: 0.6;
    pointer-events: none;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #title {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    letter-spacing: 6px;
    opacity: 0.4;
    pointer-events: none;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="title">⚛ Cosmic Drift</div>
<canvas id="c"></canvas>
<div id="ui">move mouse · click to pulse · space to shift</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, mx = 0, my = 0, frame = 0, hueShift = 0, energy = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
window.addEventListener('mousedown', () => { energy = 1; });
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { hueShift = (hueShift + 30) % 360; energy = 0.6; e.preventDefault(); }
});

// Particle systems
class Orb {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.r = Math.random() * 2 + 0.5;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = (Math.random() - 0.5) * 0.3;
    this.hue = Math.random() * 60 + 200;
    this.life = 1;
    this.decay = Math.random() * 0.001 + 0.0005;
    this.orbit = Math.random() * 80 + 20;
    this.speed = Math.random() * 0.02 + 0.005;
    this.angle = Math.random() * Math.PI * 2;
    this.wobble = Math.random() * 0.5;
  }
  update() {
    // gentle orbital drift
    this.angle += this.speed;
    const cx = W / 2 + Math.cos(this.angle * this.wobble) * this.orbit;
    const cy = H / 2 + Math.sin(this.angle * 1.3) * this.orbit;
    this.x += (cx - this.x) * 0.002 + this.vx;
    this.y += (cy - this.y) * 0.002 + this.vy;
    // mouse attraction
    const dx = mx - this.x, dy = my - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 200) {
      this.x += dx * 0.003;
      this.y += dy * 0.003;
      this.life = Math.min(1, this.life + 0.01);
    }
    // wrap
    if (this.x < -50) this.x = W + 50;
    if (this.x > W + 50) this.x = -50;
    if (this.y < -50) this.y = H + 50;
    if (this.y > H + 50) this.y = -50;
    this.life -= this.decay;
    if (this.life <= 0) this.reset();
  }
  draw() {
    const hue = (this.hue + hueShift) % 360;
    const alpha = this.life * 0.8;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${hue}, 80%, 65%, ${alpha})`;
    ctx.fill();
    // glow
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 8);
    g.addColorStop(0, `hsla(${hue}, 90%, 70%, ${alpha * 0.4})`);
    g.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * 8, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
  }
}

class StreamLine {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = Math.random() * 1.5 + 0.5;
    this.life = 1;
    this.decay = Math.random() * 0.005 + 0.003;
    this.hue = Math.random() * 40 + 260;
    this.width = Math.random() * 1.5 + 0.3;
    this.trail = [];
    this.maxTrail = Math.floor(Math.random() * 30 + 15);
  }
  update() {
    // flow field influenced by mouse
    const dx = mx - this.x, dy = my - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const influence = Math.max(0, 1 - dist / 400);
    const flowAngle = Math.atan2(dy, dx) * influence + this.angle * (1 - influence);
    this.angle += (flowAngle - this.angle) * 0.05;
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.maxTrail) this.trail.shift();
    this.life -= this.decay;
    if (this.life <= 0 || this.x < -50 || this.x > W + 50 || this.y < -50 || this.y > H + 50) this.reset();
  }
  draw() {
    if (this.trail.length < 2) return;
    const hue = (this.hue + hueShift) % 360;
    ctx.beginPath();
    ctx.moveTo(this.trail[0].x, this.trail[0].y);
    for (let i = 1; i < this.trail.length; i++) {
      ctx.lineTo(this.trail[i].x, this.trail[i].y);
    }
    ctx.strokeStyle = `hsla(${hue}, 70%, 60%, ${this.life * 0.4})`;
    ctx.lineWidth = this.width;
    ctx.stroke();
  }
}

class PulseRing {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.r = 0; this.maxR = 300 + Math.random() * 200;
    this.life = 1; this.speed = 3 + Math.random() * 2;
    this.hue = (Math.random() * 60 + 180 + hueShift) % 360;
  }
  update() {
    this.r += this.speed;
    this.life = 1 - this.r / this.maxR;
    return this.life > 0;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${this.hue}, 80%, 65%, ${this.life * 0.5})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

const orbs = Array.from({ length: 150 }, () => new Orb());
const streams = Array.from({ length: 40 }, () => new StreamLine());
let pulses = [];

function animate() {
  // Fade with energy-based persistence
  const fade = 0.04 + energy * 0.08;
  ctx.fillStyle = `rgba(10, 10, 18, ${fade})`;
  ctx.fillRect(0, 0, W, H);

  // Energy burst
  if (energy > 0.1) {
    energy *= 0.95;
    for (let i = 0; i < 3; i++) {
      pulses.push(new PulseRing(
        W / 2 + (Math.random() - 0.5) * 200,
        H / 2 + (Math.random() - 0.5) * 200
      ));
    }
  }

  // Update & draw
  orbs.forEach(o => { o.update(); o.draw(); });
  streams.forEach(s => { s.update(); s.draw(); });
  pulses = pulses.filter(p => { p.draw(); return p.update(); });

  frame++;
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
