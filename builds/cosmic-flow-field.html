<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Flow Field — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #8af;
    height: 100vh;
    width: 100vw;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    z-index: 1;
  }
  #ui {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    background: rgba(10,10,20,0.85);
    border: 1px solid #333;
    border-radius: 12px;
    padding: 16px 20px;
    backdrop-filter: blur(8px);
    min-width: 240px;
    font-size: 13px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  #ui h2 {
    font-size: 15px;
    margin-bottom: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #aef;
    border-bottom: 1px solid #222;
    padding-bottom: 8px;
  }
  .control {
    margin: 8px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .control label {
    color: #8bf;
    font-size: 12px;
    flex-shrink: 0;
  }
  .control input[type="range"] {
    flex: 1;
    accent-color: #6af;
    height: 4px;
  }
  .control .val {
    color: #aaa;
    font-size: 11px;
    min-width: 30px;
    text-align: right;
  }
  #stats {
    margin-top: 10px;
    font-size: 11px;
    color: #666;
    border-top: 1px solid #222;
    padding-top: 8px;
    line-height: 1.6;
  }
  #palette-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .swatch {
    width: 22px; height: 22px;
    border-radius: 4px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.2s, transform 0.15s;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.active { border-color: #fff; }
  #hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 12px;
    color: #555;
    letter-spacing: 1px;
    pointer-events: none;
    transition: opacity 2s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h2>✦ Cosmic Flow Field</h2>
  <div class="control">
    <label>Particles</label>
    <input type="range" id="count" min="200" max="5000" value="1500">
    <span class="val" id="countV">1500</span>
  </div>
  <div class="control">
    <label>Speed</label>
    <input type="range" id="speed" min="1" max="30" value="8">
    <span class="val" id="speedV">0.8</span>
  </div>
  <div class="control">
    <label>Trail</label>
    <input type="range" id="trail" min="1" max="40" value="15">
    <span class="val" id="trailV">0.015</span>
  </div>
  <div class="control">
    <label>Noise Scale</label>
    <input type="range" id="noise" min="10" max="150" value="60">
    <span class="val" id="noiseV">60</span>
  </div>
  <div class="control">
    <label>Palette</label>
    <div id="palette-row"></div>
  </div>
  <div id="stats">
    FPS: <span id="fps">0</span> |
    Particles: <span id="active">0</span><br>
    Click to attract · Scroll to zoom
  </div>
</div>
<div id="hint">move mouse to disturb the field</div>

<script>
// --- Simplex-like noise ---
class Noise {
  constructor() {
    this.p = new Uint8Array(512);
    const perm = new Uint8Array(256);
    for (let i = 0; i < 256; i++) perm[i] = i;
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [perm[i], perm[j]] = [perm[j], perm[i]];
    }
    for (let i = 0; i < 512; i++) this.p[i] = perm[i & 255];
  }
  fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  lerp(a, b, t) { return a + t * (b - a); }
  grad(hash, x, y, z) {
    const h = hash & 15;
    const u = h < 8 ? x : y;
    const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  }
  noise3(x, y, z) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = this.fade(x), v = this.fade(y), w = this.fade(z);
    const p = this.p, A = p[X]+Y, AA = p[A]+Z, AB = p[A+1]+Z,
          B = p[X+1]+Y, BA = p[B]+Z, BB = p[B+1]+Z;
    return this.lerp(
      this.lerp(this.lerp(this.grad(p[AA],x,y,z), this.grad(p[BA],x-1,y,z), u),
                this.lerp(this.grad(p[AB],x,y-1,z), this.grad(p[BB],x-1,y-1,z), u), v),
      this.lerp(this.lerp(this.grad(p[AA+1],x,y,z-1), this.grad(p[BA+1],x-1,y,z-1), u),
                this.lerp(this.grad(p[AB+1],x,y-1,z-1), this.grad(p[BB+1],x-1,y-1,z-1), u), v), w);
  }
}

// --- Setup ---
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const noise = new Noise();
const palettes = [
  { name: 'Aurora', colors: [[120,220,255],[80,255,180],[160,100,255],[255,120,200],[80,180,255]] },
  { name: 'Ember', colors: [[255,80,30],[255,160,20],[255,220,80],[200,40,10],[255,120,40]] },
  { name: 'Ocean', colors: [[20,60,180],[40,140,200],[80,200,220],[10,30,100],[120,180,255]] },
  { name: 'Neon', colors: [[0,255,100],[255,0,200],[0,200,255],[255,255,0],[180,0,255]] },
  { name: 'Pastel', colors: [[255,180,200],[180,200,255],[200,255,180],[255,255,180],[200,180,255]] },
  { name: 'Monochrome', colors: [[220,220,220],[180,180,180],[140,140,140],[100,100,100],[255,255,255]] },
];
let paletteIdx = 0;
let palette = palettes[paletteIdx];

const paletteRow = document.getElementById('palette-row');
palettes.forEach((p, i) => {
  const s = document.createElement('div');
  s.className = 'swatch' + (i === 0 ? ' active' : '');
  const c = p.colors[0];
  s.style.background = `rgb(${c[0]},${c[1]},${c[2]})`;
  s.title = p.name;
  s.onclick = () => {
    paletteIdx = i;
    palette = palettes[i];
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
  };
  paletteRow.appendChild(s);
});

// --- Particles ---
let particles = [];
let count = 1500;
let speedFactor = 0.8;
let trailAlpha = 0.015;
let noiseScale = 60;
let time = 0;
let mouse = { x: W/2, y: H/2, active: false };
let frameCount = 0, lastFpsTime = performance.now(), fpsVal = 0;

function spawnParticles() {
  particles = [];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: 0, vy: 0,
      life: Math.random() * 300 + 100,
      maxLife: 400,
      ci: Math.floor(Math.random() * palette.colors.length),
    });
  }
}
spawnParticles();

// --- Controls ---
const countEl = document.getElementById('count');
const speedEl = document.getElementById('speed');
const trailEl = document.getElementById('trail');
const noiseEl = document.getElementById('noise');
countEl.oninput = () => { count = +countEl.value; document.getElementById('countV').textContent = count; spawnParticles(); };
speedEl.oninput = () => { speedFactor = +speedEl.value / 10; document.getElementById('speedV').textContent = speedFactor.toFixed(1); };
trailEl.oninput = () => { trailAlpha = +trailEl.value / 1000; document.getElementById('trailV').textContent = trailAlpha.toFixed(3); };
noiseEl.oninput = () => { noiseScale = +noiseEl.value; document.getElementById('noiseV').textContent = noiseScale; };

window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
window.addEventListener('mouseleave', () => { mouse.active = false; });
window.addEventListener('click', e => {
  // attract burst
  for (const p of particles) {
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    const d = Math.hypot(dx, dy) + 1;
    if (d < 250) {
      p.vx += (dx / d) * 8;
      p.vy += (dy / d) * 8;
    }
  }
});
window.addEventListener('wheel', e => {
  noiseScale = Math.max(10, Math.min(150, noiseScale - e.deltaY * 0.1));
  noiseEl.value = noiseScale;
  document.getElementById('noiseV').textContent = Math.round(noiseScale);
});

// --- Render loop ---
function frame() {
  // Fade trail
  ctx.fillStyle = `rgba(10,10,18,${trailAlpha})`;
  ctx.fillRect(0, 0, W, H);

  let activeCount = 0;

  for (const p of particles) {
    // Flow field angle from 3D noise
    const nx = p.x / noiseScale;
    const ny = p.y / noiseScale;
    const angle = noise.noise3(nx, ny, time * 0.3) * Math.PI * 4;

    let fx = Math.cos(angle);
    let fy = Math.sin(angle);

    // Mouse influence
    if (mouse.active) {
      const dx = mouse.x - p.x, dy = mouse.y - p.y;
      const d = Math.hypot(dx, dy) + 1;
      if (d < 200) {
        const force = (200 - d) / 200;
        fx += (dx / d) * force * 2;
        fy += (dy / d) * force * 2;
      }
    }

    p.vx += fx * 0.3;
    p.vy += fy * 0.3;
    p.vx *= 0.92;
    p.vy *= 0.92;

    p.x += p.vx * speedFactor;
    p.y += p.vy * speedFactor;
    p.life--;

    // Wrap edges
    if (p.x < 0) p.x += W;
    if (p.x > W) p.x -= W;
    if (p.y < 0) p.y += H;
    if (p.y > H) p.y -= H;

    if (p.life <= 0) {
      p.x = Math.random() * W;
      p.y = Math.random() * H;
      p.vx = 0; p.vy = 0;
      p.life = Math.random() * 300 + 100;
      p.ci = Math.floor(Math.random() * palette.colors.length);
      continue;
    }

    const lifeRatio = p.life / p.maxLife;
    const c = palette.colors[p.ci];
    const alpha = Math.min(1, lifeRatio * 2) * 0.7;
    const speed = Math.hypot(p.vx, p.vy);

    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * speedFactor * 2, p.y - p.vy * speedFactor * 2);
    ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
    ctx.lineWidth = Math.min(2.5, 0.5 + speed * 0.4);
    ctx.stroke();
    activeCount++;
  }

  time += 0.008;
  frameCount++;

  // FPS counter
  const now = performance.now();
  if (now - lastFpsTime > 500) {
    fpsVal = Math.round(frameCount / ((now - lastFpsTime) / 1000));
    frameCount = 0;
    lastFpsTime = now;
    document.getElementById('fps').textContent = fpsVal;
    document.getElementById('active').textContent = activeCount;
  }

  requestAnimationFrame(frame);
}
frame();

// Fade hint
setTimeout(() => { document.getElementById('hint').style.opacity = '0'; }, 4000);
</script>
</body>
</html>
