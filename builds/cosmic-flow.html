<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Flow - Generative Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }
        
        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            z-index: 10;
            pointer-events: none;
        }
        
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 11px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .controls h3 {
            margin-bottom: 10px;
            font-size: 14px;
            color: #fff;
        }
        
        .controls label {
            display: block;
            margin: 8px 0 4px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .controls input[type="range"] {
            width: 150px;
            margin-right: 10px;
        }
        
        .controls button {
            margin-top: 10px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
        }
        
        .controls button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="info">
        Move mouse to influence flow • Click to burst
    </div>
    
    <div class="controls">
        <h3>⚛️ Cosmic Flow</h3>
        <label>Particles: <span id="particleCount">0</span></label>
        <label>Flow Speed</label>
        <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1">
        <label>Trail Length</label>
        <input type="range" id="trail" min="0.01" max="0.1" step="0.01" value="0.03">
        <button id="reset">Reset</button>
        <button id="randomize">Randomize</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let mouse = { x: 0, y: 0, active: false };
        let time = 0;
        
        const config = {
            particleCount: 800,
            baseSpeed: 1,
            trailOpacity: 0.03,
            noiseScale: 0.003,
            colorShift: 0
        };
        
        // Simplex-like noise function
        class NoiseGenerator {
            constructor() {
                this.perm = [];
                for (let i = 0; i < 256; i++) this.perm[i] = i;
                for (let i = 255; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.perm[i], this.perm[j]] = [this.perm[j], this.perm[i]];
                }
                this.perm = this.perm.concat(this.perm);
            }
            
            fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            lerp(a, b, t) { return a + t * (b - a); }
            grad(hash, x, y, z) {
                const h = hash & 15;
                const u = h < 8 ? x : y;
                const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }
            
            noise(x, y, z) {
                const X = Math.floor(x) & 255;
                const Y = Math.floor(y) & 255;
                const Z = Math.floor(z) & 255;
                
                x -= Math.floor(x);
                y -= Math.floor(y);
                z -= Math.floor(z);
                
                const u = this.fade(x);
                const v = this.fade(y);
                const w = this.fade(z);
                
                const A = this.perm[X] + Y, AA = this.perm[A] + Z, AB = this.perm[A + 1] + Z;
                const B = this.perm[X + 1] + Y, BA = this.perm[B] + Z, BB = this.perm[B + 1] + Z;
                
                return this.lerp(
                    this.lerp(
                        this.lerp(this.grad(this.perm[AA], x, y, z), this.grad(this.perm[BA], x - 1, y, z), u),
                        this.lerp(this.grad(this.perm[AB], x, y - 1, z), this.grad(this.perm[BB], x - 1, y - 1, z), u),
                        v
                    ),
                    this.lerp(
                        this.lerp(this.grad(this.perm[AA + 1], x, y, z - 1), this.grad(this.perm[BA + 1], x - 1, y, z - 1), u),
                        this.lerp(this.grad(this.perm[AB + 1], x, y - 1, z - 1), this.grad(this.perm[BB + 1], x - 1, y - 1, z - 1), u),
                        v
                    ),
                    w
                );
            }
        }
        
        const noise = new NoiseGenerator();
        
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = 0;
                this.vy = 0;
                this.life = Math.random() * 200 + 100;
                this.maxLife = this.life;
                this.hue = Math.random() * 60 + config.colorShift;
            }
            
            update() {
                // Get noise-based flow
                const angle = noise.noise(
                    this.x * config.noiseScale,
                    this.y * config.noiseScale,
                    time * 0.0005
                ) * Math.PI * 4;
                
                // Base flow
                this.vx += Math.cos(angle) * 0.2 * config.baseSpeed;
                this.vy += Math.sin(angle) * 0.2 * config.baseSpeed;
                
                // Mouse influence
                if (mouse.active) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 200) {
                        const force = (200 - dist) / 200;
                        const mouseAngle = Math.atan2(dy, dx);
                        this.vx += Math.cos(mouseAngle) * force * 2;
                        this.vy += Math.sin(mouseAngle) * force * 2;
                        this.hue += force * 10;
                    }
                }
                
                // Apply velocity with damping
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.98;
                this.vy *= 0.98;
                
                // Wrap around edges
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
                
                this.life--;
                
                // Reset if dead
                if (this.life <= 0 || Math.random() < 0.001) {
                    this.reset();
                }
            }
            
            draw() {
                const alpha = (this.life / this.maxLife) * 0.8;
                const hue = this.hue % 360;
                
                ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function init() {
            resize();
            particles = [];
            for (let i = 0; i < config.particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        function animate() {
            // Trail effect
            ctx.fillStyle = `rgba(10, 10, 15, ${config.trailOpacity})`;
            ctx.fillRect(0, 0, width, height);
            
            // Update and draw particles
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            // Update color shift over time
            config.colorShift += 0.1;
            
            // Update particle count display
            document.getElementById('particleCount').textContent = particles.length;
            
            time++;
            requestAnimationFrame(animate);
        }
        
        // Event listeners
        window.addEventListener('resize', resize);
        
        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });
        
        canvas.addEventListener('mouseleave', () => {
            mouse.active = false;
        });
        
        canvas.addEventListener('click', (e) => {
            // Burst effect
            for (let i = 0; i < 50; i++) {
                const p = new Particle();
                p.x = e.clientX;
                p.y = e.clientY;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5;
                p.vx = Math.cos(angle) * speed;
                p.vy = Math.sin(angle) * speed;
                particles.push(p);
            }
            
            // Remove excess particles
            while (particles.length > config.particleCount + 200) {
                particles.shift();
            }
        });
        
        // Controls
        document.getElementById('speed').addEventListener('input', (e) => {
            config.baseSpeed = parseFloat(e.target.value);
        });
        
        document.getElementById('trail').addEventListener('input', (e) => {
            config.trailOpacity = parseFloat(e.target.value);
        });
        
        document.getElementById('reset').addEventListener('click', () => {
            config.baseSpeed = 1;
            config.trailOpacity = 0.03;
            config.colorShift = 0;
            document.getElementById('speed').value = 1;
            document.getElementById('trail').value = 0.03;
            init();
        });
        
        document.getElementById('randomize').addEventListener('click', () => {
            config.noiseScale = 0.001 + Math.random() * 0.005;
            config.baseSpeed = 0.5 + Math.random() * 2;
            config.colorShift = Math.random() * 360;
            document.getElementById('speed').value = config.baseSpeed;
            init();
        });
        
        // Start
        init();
        animate();
    </script>
</body>
</html>
