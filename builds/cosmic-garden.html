<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Garden — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000010;
    overflow: hidden;
    cursor: crosshair;
    font-family: 'Courier New', monospace;
  }
  canvas { display: block; }
  #info {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(180, 210, 255, 0.7);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
    text-align: center;
    transition: opacity 3s;
  }
  #stats {
    position: fixed;
    bottom: 20px;
    right: 20px;
    color: rgba(180, 210, 255, 0.4);
    font-size: 11px;
    pointer-events: none;
    z-index: 10;
    text-align: right;
    line-height: 1.6;
  }
  #seed-info {
    position: fixed;
    bottom: 20px;
    left: 20px;
    color: rgba(180, 210, 255, 0.4);
    font-size: 11px;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="info">cosmic garden · move your mouse to tend · click to bloom</div>
<div id="stats"></div>
<div id="seed-info"></div>
<canvas id="canvas"></canvas>

<script>
// --- Configuration ---
const CONFIG = {
  maxFlowers: 60,
  maxParticles: 300,
  maxVines: 15,
  flowerSpawnRate: 0.008,
  particleDecay: 0.992,
  connectionDist: 120,
  vineGrowSpeed: 0.5,
  colors: [
    '#ff6b9d', '#c084fc', '#67e8f9', '#a3e635',
    '#fbbf24', '#f472b6', '#a78bfa', '#34d399',
    '#fb923c', '#60a5fa', '#e879f9', '#2dd4bf'
  ]
};

// --- Seeded Random for reproducibility ---
let seed = Date.now() % 100000;
function seededRandom() {
  seed = (seed * 16807 + 0) % 2147483647;
  return (seed - 1) / 2147483646;
}

// --- Canvas Setup ---
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Mouse ---
const mouse = { x: W / 2, y: H / 2, active: false };
window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
window.addEventListener('mouseleave', () => mouse.active = false);
window.addEventListener('click', e => {
  spawnBloom(e.clientX, e.clientY);
  for (let i = 0; i < 30; i++) spawnParticle(e.clientX, e.clientY, true);
});

// --- Flower Class ---
class Flower {
  constructor(x, y, isBloom = false) {
    this.x = x;
    this.y = y;
    this.petalCount = Math.floor(seededRandom() * 4) + 4;
    this.radius = isBloom ? 25 + seededRandom() * 30 : 10 + seededRandom() * 25;
    this.targetRadius = this.radius;
    this.radius = 0;
    this.rotation = seededRandom() * Math.PI * 2;
    this.rotSpeed = (seededRandom() - 0.5) * 0.005;
    this.color = CONFIG.colors[Math.floor(seededRandom() * CONFIG.colors.length)];
    this.glowColor = this.color + '40';
    this.life = 1;
    this.decay = 0.0003 + seededRandom() * 0.0008;
    this.stem = [];
    this.grown = false;
    this.growProgress = 0;
    this.swayOffset = seededRandom() * Math.PI * 2;
    this.swayAmount = 0.3 + seededRandom() * 0.7;
    this.petalDrift = [];
    for (let i = 0; i < this.petalCount; i++) {
      this.petalDrift.push({
        ox: (seededRandom() - 0.5) * 6,
        oy: (seededRandom() - 0.5) * 6,
        speed: 0.003 + seededRandom() * 0.01,
        phase: seededRandom() * Math.PI * 2
      });
    }
    // Generate stem path
    if (!isBloom) {
      let sx = x, sy = H;
      const steps = 30 + Math.floor(seededRandom() * 50);
      for (let i = 0; i < steps; i++) {
        const t = i / steps;
        sx += (seededRandom() - 0.5) * 15;
        sy += (y - H) / steps + (seededRandom() - 0.5) * 5;
        this.stem.push({ x: sx, y: sy, thickness: (1 - t) * 2.5 + 0.3 });
      }
    }
  }

  update() {
    this.rotation += this.rotSpeed;
    if (this.radius < this.targetRadius) {
      this.radius += (this.targetRadius - this.radius) * 0.04;
    }
    if (!this.grown) {
      this.growProgress += 0.015;
      if (this.growProgress >= 1) this.grown = true;
    }
    if (this.grown) this.life -= this.decay;
    return this.life > 0;
  }

  draw(ctx, time) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);

    const alpha = Math.min(1, this.life * 2);
    const growAlpha = Math.min(alpha, this.growProgress);

    // Glow
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius * 2);
    glow.addColorStop(0, this.color + '30');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 2, 0, Math.PI * 2);
    ctx.fill();

    // Petals
    for (let i = 0; i < this.petalCount; i++) {
      const angle = (i / this.petalCount) * Math.PI * 2;
      const pd = this.petalDrift[i];
      const drift = Math.sin(time * pd.speed + pd.phase) * 3;
      const px = Math.cos(angle) * this.radius * 0.5 + pd.ox + drift;
      const py = Math.sin(angle) * this.radius * 0.5 + pd.oy + drift * 0.5;

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(angle);
      ctx.scale(growAlpha, growAlpha);
      ctx.fillStyle = this.color + Math.floor(alpha * 200).toString(16).padStart(2, '0');
      ctx.beginPath();
      ctx.ellipse(this.radius * 0.35, 0, this.radius * 0.45, this.radius * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Center
    ctx.fillStyle = `rgba(255, 250, 230, ${alpha * 0.9})`;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.15 * growAlpha, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  drawStem(ctx) {
    if (this.stem.length < 2) return;
    const growLen = Math.floor(this.stem.length * Math.min(1, this.growProgress * 1.2));
    if (growLen < 2) return;

    ctx.strokeStyle = `rgba(34, 80, 50, ${Math.min(1, this.growProgress) * 0.6})`;
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(this.stem[0].x, this.stem[0].y);
    for (let i = 1; i < growLen; i++) {
      ctx.lineTo(this.stem[i].x, this.stem[i].y);
    }
    ctx.stroke();
  }
}

// --- Particle Class ---
class Particle {
  constructor(x, y, isBloom = false) {
    this.x = x;
    this.y = y;
    const angle = seededRandom() * Math.PI * 2;
    const speed = isBloom ? 2 + seededRandom() * 6 : 0.5 + seededRandom() * 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    if (!isBloom) this.vy -= 0.5;
    this.life = 1;
    this.decay = 0.003 + seededRandom() * 0.01;
    this.size = 1 + seededRandom() * 2.5;
    this.color = CONFIG.colors[Math.floor(seededRandom() * CONFIG.colors.length)];
    this.trail = [];
  }

  update() {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 8) this.trail.shift();
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.99;
    this.vy *= 0.99;
    this.vy += 0.005;
    this.life -= this.decay;
    return this.life > 0;
  }

  draw(ctx) {
    const alpha = this.life;
    // Trail
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      ctx.fillStyle = this.color + Math.floor((i / this.trail.length) * alpha * 80).toString(16).padStart(2, '0');
      ctx.fillRect(t.x, t.y, this.size * 0.6, this.size * 0.6);
    }
    // Dot
    ctx.fillStyle = this.color + Math.floor(alpha * 200).toString(16).padStart(2, '0');
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Vine Class ---
class Vine {
  constructor() {
    this.reset();
  }

  reset() {
    const side = Math.floor(seededRandom() * 4);
    switch(side) {
      case 0: this.x = seededRandom() * W; this.y = 0; break;
      case 1: this.x = W; this.y = seededRandom() * H; break;
      case 2: this.x = seededRandom() * W; this.y = H; break;
      case 3: this.x = 0; this.y = seededRandom() * H; break;
    }
    this.angle = seededRandom() * Math.PI * 2;
    this.speed = 0.3 + seededRandom() * 0.8;
    this.turnRate = (seededRandom() - 0.5) * 0.04;
    this.life = 1;
    this.decay = 0.001 + seededRandom() * 0.003;
    this.length = 0;
    this.maxLength = 100 + seededRandom() * 300;
    this.thickness = 0.5 + seededRandom() * 1.5;
    this.color = CONFIG.colors[Math.floor(seededRandom() * CONFIG.colors.length)];
    this.points = [{ x: this.x, y: this.y }];
    this.waveOffset = seededRandom() * Math.PI * 2;
    this.waveAmp = 0.02 + seededRandom() * 0.04;
  }

  update() {
    this.angle += this.turnRate + Math.sin(this.length * 0.02 + this.waveOffset) * this.waveAmp;
    this.turnRate += (seededRandom() - 0.5) * 0.005;
    this.turnRate *= 0.999;

    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;

    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) {
      this.life -= 0.02;
    }

    this.length++;
    this.points.push({ x: this.x, y: this.y });

    if (this.length > this.maxLength || this.points.length > 500) {
      this.life -= 0.01;
    }

    return this.life > 0;
  }

  draw(ctx) {
    if (this.points.length < 2) return;
    ctx.strokeStyle = this.color + Math.floor(this.life * 100).toString(16).padStart(2, '0');
    ctx.lineWidth = this.thickness * this.life;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(this.points[0].x, this.points[0].y);
    for (let i = 1; i < this.points.length; i++) {
      ctx.lineTo(this.points[i].x, this.points[i].y);
    }
    ctx.stroke();
  }
}

// --- State ---
let flowers = [];
let particles = [];
let vines = [];
let time = 0;
let totalSpawned = 0;

// --- Actions ---
function spawnFlower(x, y) {
  if (flowers.length >= CONFIG.maxFlowers) {
    flowers.shift();
  }
  flowers.push(new Flower(x, y));
  totalSpawned++;
}

function spawnBloom(x, y) {
  if (flowers.length >= CONFIG.maxFlowers) {
    flowers.shift();
  }
  flowers.push(new Flower(x, y, true));
  totalSpawned++;
}

function spawnParticle(x, y, isBloom = false) {
  if (particles.length >= CONFIG.maxParticles) {
    particles.shift();
  }
  particles.push(new Particle(x, y, isBloom));
}

// --- Background Stars ---
const stars = [];
for (let i = 0; i < 150; i++) {
  stars.push({
    x: seededRandom() * W,
    y: seededRandom() * H,
    size: seededRandom() * 1.5,
    twinkleSpeed: 0.01 + seededRandom() * 0.03,
    phase: seededRandom() * Math.PI * 2
  });
}

// --- Nebula Background ---
function drawBackground(ctx, time) {
  // Deep space gradient
  const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
  bg.addColorStop(0, '#0a0a2e');
  bg.addColorStop(0.5, '#050520');
  bg.addColorStop(1, '#000010');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Subtle nebula clouds
  const nebulaTime = time * 0.0001;
  for (let i = 0; i < 3; i++) {
    const nx = W * (0.3 + 0.4 * Math.sin(nebulaTime + i * 2));
    const ny = H * (0.3 + 0.4 * Math.cos(nebulaTime * 0.7 + i * 1.5));
    const nebula = ctx.createRadialGradient(nx, ny, 0, nx, ny, 200);
    const colors = ['#1a0a3e10', '#0a1a3e10', '#0a2a1e10'];
    nebula.addColorStop(0, colors[i]);
    nebula.addColorStop(1, 'transparent');
    ctx.fillStyle = nebula;
    ctx.fillRect(0, 0, W, H);
  }
}

// --- Connections ---
function drawConnections(ctx, flowers, time) {
  for (let i = 0; i < flowers.length; i++) {
    if (!flowers[i].grown) continue;
    for (let j = i + 1; j < flowers.length; j++) {
      if (!flowers[j].grown) continue;
      const dx = flowers[i].x - flowers[j].x;
      const dy = flowers[i].y - flowers[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < CONFIG.connectionDist) {
        const alpha = (1 - dist / CONFIG.connectionDist) * 0.15 * Math.min(flowers[i].life, flowers[j].life);
        ctx.strokeStyle = `rgba(150, 180, 220, ${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(flowers[i].x, flowers[i].y);
        ctx.lineTo(flowers[j].x, flowers[j].y);
        ctx.stroke();
      }
    }
  }
}

// --- Stats ---
const statsEl = document.getElementById('stats');
const seedEl = document.getElementById('seed-info');

function updateStats() {
  statsEl.innerHTML = `flowers: ${flowers.length} · particles: ${particles.length} · vines: ${vines.length} · spawned: ${totalSpawned}`;
  seedEl.textContent = `seed: ${seed.toString(16).toUpperCase()}`;
}

// --- Auto-spawn ---
let autoSpawnTimer = 0;

function autoSpawn() {
  autoSpawnTimer++;
  if (autoSpawnTimer > 120 && flowers.length < 20 && seededRandom() < CONFIG.flowerSpawnRate) {
    autoSpawnTimer = 0;
    const x = 50 + seededRandom() * (W - 100);
    const y = 80 + seededRandom() * (H - 200);
    spawnFlower(x, y);
    for (let i = 0; i < 10; i++) spawnParticle(x, y);
  }
  if (seededRandom() < 0.02 && vines.length < CONFIG.maxVines) {
    vines.push(new Vine());
  }
}

// --- Mouse attraction ---
function attractParticles() {
  if (!mouse.active) return;
  for (let p of particles) {
    const dx = mouse.x - p.x;
    const dy = mouse.y - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 200 && dist > 0) {
      const force = 0.3 / (dist * 0.05 + 1);
      p.vx += (dx / dist) * force;
      p.vy += (dy / dist) * force;
    }
  }
}

// --- Main Loop ---
function animate() {
  time++;

  // Semi-transparent overlay for trails
  ctx.fillStyle = 'rgba(0, 0, 10, 0.12)';
  ctx.fillRect(0, 0, W, H);

  // Full background redraw every 60 frames to prevent mud buildup
  if (time % 60 === 0) {
    drawBackground(ctx, time);
  }

  // Stars
  for (let s of stars) {
    const twinkle = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(time * s.twinkleSpeed + s.phase));
    ctx.fillStyle = `rgba(180, 200, 255, ${twinkle * 0.5})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // Auto spawn
  autoSpawn();

  // Mouse attraction
  attractParticles();

  // Vines
  vines = vines.filter(v => v.update());
  vines.forEach(v => v.draw(ctx));
  if (vines.length > CONFIG.maxVines) vines.splice(0, vines.length - CONFIG.maxVines);

  // Flowers
  flowers = flowers.filter(f => f.update());
  flowers.forEach(f => f.drawStem(ctx));
  drawConnections(ctx, flowers, time);
  flowers.forEach(f => f.draw(ctx, time));

  // Particles
  particles = particles.filter(p => p.update());
  particles.forEach(p => p.draw(ctx));

  // Fade info after 8s
  if (time > 480) {
    document.getElementById('info').style.opacity = Math.max(0, 1 - (time - 480) / 120);
  }

  // Update stats every 10 frames
  if (time % 10 === 0) updateStats();

  requestAnimationFrame(animate);
}

// --- Init ---
drawBackground(ctx, 0);
// Seed initial flowers
for (let i = 0; i < 8; i++) {
  spawnFlower(80 + seededRandom() * (W - 160), 100 + seededRandom() * (H - 250));
}
animate();
</script>
</body>
</html>
