<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Gravity Sandbox — Aether Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #0ff;
    height: 100vh;
    width: 100vw;
  }
  canvas { display: block; cursor: crosshair; }
  #ui {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    pointer-events: none;
  }
  #ui h1 {
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #0ff;
    text-shadow: 0 0 10px #0ff;
    margin-bottom: 6px;
  }
  #ui p {
    font-size: 11px;
    color: #888;
    line-height: 1.6;
  }
  #stats {
    position: fixed;
    bottom: 16px;
    left: 16px;
    font-size: 11px;
    color: #555;
    z-index: 10;
    pointer-events: none;
  }
  #hint {
    position: fixed;
    bottom: 16px;
    right: 16px;
    font-size: 11px;
    color: #555;
    z-index: 10;
    pointer-events: none;
    text-align: right;
  }
  .key { color: #0ff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>✦ Cosmic Gravity Sandbox</h1>
  <p>
    <span class="key">Click</span> — spawn star &nbsp;|&nbsp;
    <span class="key">Drag</span> — launch comet &nbsp;|&nbsp;
    <span class="key">Right-click</span> — black hole &nbsp;|&nbsp;
    <span class="key">Space</span> — pause &nbsp;|&nbsp;
    <span class="key">C</span> — clear &nbsp;|&nbsp;
    <span class="key">G</span> — toggle grid
  </p>
</div>
<div id="stats"></div>
<div id="hint">Aether Lab • Curiosity Drop</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const bodies = [];
const trails = [];
const MAX_TRAILS = 2000;
let paused = false;
let showGrid = true;
let mouse = { x: 0, y: 0, down: false, startX: 0, startY: 0 };
let frameCount = 0;
let fps = 60;

// Star colors palette
const starColors = [
  '#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff',
  '#ff922b', '#cc5de8', '#20c997', '#ff8787',
  '#74c0fc', '#ffe066', '#a9e34b', '#f783ac'
];

class Body {
  constructor(x, y, vx, vy, mass, color, isBlackHole = false) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.mass = mass;
    this.color = color;
    this.isBlackHole = isBlackHole;
    this.radius = isBlackHole ? 12 : Math.max(2, Math.log(mass) * 1.5);
    this.life = 1;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.trail = [];
    this.maxTrail = isBlackHole ? 0 : Math.floor(30 + mass / 10);
  }

  update(dt) {
    // Gravity from all other bodies
    for (const other of bodies) {
      if (other === this) continue;
      const dx = other.x - this.x;
      const dy = other.y - this.y;
      const distSq = dx * dx + dy * dy;
      const dist = Math.sqrt(distSq) + 0.1;
      const G = 0.5;
      const force = G * other.mass / distSq;
      this.vx += (dx / dist) * force * dt;
      this.vy += (dy / dist) * force * dt;
    }

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    // Screen wrap
    const margin = 100;
    if (this.x < -margin) this.x = W + margin;
    if (this.x > W + margin) this.x = -margin;
    if (this.y < -margin) this.y = H + margin;
    if (this.y > H + margin) this.y = -margin;

    // Trail
    if (this.trail.length > this.maxTrail) this.trail.shift();
    this.trail.push({ x: this.x, y: this.y });

    this.pulsePhase += 0.05;
  }

  draw() {
    // Trail
    if (this.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.strokeStyle = this.color + '33';
      ctx.lineWidth = this.isBlackHole ? 2 : 1;
      ctx.stroke();
    }

    if (this.isBlackHole) {
      // Accretion disk
      const diskSize = this.radius * 3 + Math.sin(this.pulsePhase) * 4;
      const grad = ctx.createRadialGradient(this.x, this.y, this.radius, this.x, this.y, diskSize);
      grad.addColorStop(0, 'rgba(120, 80, 255, 0.9)');
      grad.addColorStop(0.5, 'rgba(180, 100, 255, 0.4)');
      grad.addColorStop(1, 'rgba(120, 80, 255, 0)');
      ctx.beginPath();
      ctx.arc(this.x, this.y, diskSize, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Core
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#000';
      ctx.fill();
      ctx.strokeStyle = '#a78bfa';
      ctx.lineWidth = 2;
      ctx.stroke();
    } else {
      // Glow
      const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 4);
      glow.addColorStop(0, this.color + '66');
      glow.addColorStop(1, this.color + '00');
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius * 4, 0, Math.PI * 2);
      ctx.fillStyle = glow;
      ctx.fill();

      // Core
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.fill();
    }
  }
}

// Initial scene — a small solar system
function initScene() {
  const cx = W / 2, cy = H / 2;
  // Central star
  bodies.push(new Body(cx, cy, 0, 0, 800, '#ffd93d'));
  // Orbiting planets
  for (let i = 0; i < 6; i++) {
    const dist = 80 + i * 50;
    const speed = Math.sqrt(800 / dist) * 0.8;
    const angle = (i / 6) * Math.PI * 2;
    const x = cx + Math.cos(angle) * dist;
    const y = cy + Math.sin(angle) * dist;
    const vx = -Math.sin(angle) * speed;
    const vy = Math.cos(angle) * speed;
    const mass = 5 + Math.random() * 15;
    const color = starColors[i % starColors.length];
    bodies.push(new Body(x, y, vx, vy, mass, color));
  }
}

// Grid
function drawGrid() {
  if (!showGrid) return;
  ctx.strokeStyle = 'rgba(0, 255, 255, 0.03)';
  ctx.lineWidth = 1;
  const spacing = 60;
  for (let x = 0; x < W; x += spacing) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += spacing) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

// Background stars
const bgStars = [];
for (let i = 0; i < 200; i++) {
  bgStars.push({
    x: Math.random() * 3000,
    y: Math.random() * 2000,
    size: Math.random() * 1.5,
    twinkle: Math.random() * Math.PI * 2
  });
}

function drawBgStars() {
  for (const s of bgStars) {
    const alpha = 0.3 + Math.sin(s.twinkle + frameCount * 0.02) * 0.2;
    ctx.beginPath();
    ctx.arc(s.x % W, s.y % H, s.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.fill();
  }
}

// Mouse interaction
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 2) {
    // Right click — black hole
    bodies.push(new Body(e.clientX, e.clientY, 0, 0, 2000, '#a78bfa', true));
  } else {
    mouse.down = true;
    mouse.startX = e.clientX;
    mouse.startY = e.clientY;
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (e.button !== 2 && mouse.down) {
    const vx = (e.clientX - mouse.startX) * 0.05;
    const vy = (e.clientY - mouse.startY) * 0.05;
    const mass = 20 + Math.random() * 60;
    const color = starColors[Math.floor(Math.random() * starColors.length)];
    bodies.push(new Body(mouse.startX, mouse.startY, vx, vy, mass, color));
    mouse.down = false;
  }
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
  if (e.key === 'c' || e.key === 'C') { bodies.length = 0; }
  if (e.key === 'g' || e.key === 'G') { showGrid = !showGrid; }
});

// Stats
const statsEl = document.getElementById('stats');
function updateStats() {
  statsEl.textContent = `bodies: ${bodies.length} | fps: ${fps} | ${paused ? '⏸ PAUSED' : '▶ RUNNING'}`;
}

// Main loop
let lastTime = performance.now();
let fpsCounter = 0;
let fpsTime = lastTime;

function loop(now) {
  const rawDt = (now - lastTime) / 16.67;
  const dt = Math.min(rawDt, 3);
  lastTime = now;

  fpsCounter++;
  if (now - fpsTime > 1000) {
    fps = fpsCounter;
    fpsCounter = 0;
    fpsTime = now;
  }

  if (!paused) {
    for (const b of bodies) b.update(dt);
  }
  frameCount++;

  // Draw
  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.fillRect(0, 0, W, H);

  drawBgStars();
  drawGrid();

  for (const b of bodies) b.draw();

  // Drag line
  if (mouse.down) {
    ctx.beginPath();
    ctx.moveTo(mouse.startX, mouse.startY);
    ctx.lineTo(mouse.x, mouse.y);
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Preview body
    ctx.beginPath();
    ctx.arc(mouse.startX, mouse.startY, 5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
    ctx.fill();
  }

  updateStats();
  requestAnimationFrame(loop);
}

canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

initScene();
requestAnimationFrame(loop);
</script>
</body>
</html>
