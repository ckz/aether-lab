<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Weave — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
  }
  .overlay {
    position: fixed;
    bottom: 20px;
    left: 20px;
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    z-index: 10;
    pointer-events: none;
    letter-spacing: 1px;
  }
  .controls {
    position: fixed;
    top: 20px;
    right: 20px;
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    z-index: 10;
    text-align: right;
    line-height: 1.8;
    pointer-events: none;
  }
  .title {
    position: fixed;
    top: 20px;
    left: 20px;
    color: rgba(255,255,255,0.9);
    font-size: 14px;
    letter-spacing: 3px;
    z-index: 10;
    pointer-events: none;
    text-transform: uppercase;
  }
  .title span { opacity: 0.4; font-size: 10px; display: block; margin-top: 4px; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="title">Cosmic Weave<span>generative particle field</span></div>
<div class="controls">
  [CLICK] — Emit burst<br>
  [MOVE] — Attract field<br>
  [SPACE] — Cycle palette<br>
  [C] — Clear canvas<br>
  [S] — Save snapshot
</div>
<div class="overlay" id="stats"></div>
<canvas id="canvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const stats = document.getElementById('stats');

  let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // --- Palette system ---
  const palettes = [
    { name: 'Nebula',   colors: ['#ff6b9d','#c084fc','#60a5fa','#34d399','#fbbf24'] },
    { name: 'Aurora',   colors: ['#06b6d4','#10b981','#84cc16','#22d3ee','#a3e635'] },
    { name: 'Inferno',  colors: ['#ef4444','#f97316','#fbbf24','#fde68a','#fca5a5'] },
    { name: 'Deep',     colors: ['#3b82f6','#6366f1','#8b5cf6','#a78bfa','#c4b5fd'] },
    { name: 'Monochrome', colors: ['#ffffff','#e5e5e5','#a3a3a3','#737373','#404040'] },
  ];
  let paletteIdx = 0;

  // --- Particle system ---
  const MAX_PARTICLES = 2000;
  const particles = [];
  const connections = [];

  class Particle {
    constructor(x, y, vx, vy) {
      this.x = x ?? Math.random() * W;
      this.y = y ?? Math.random() * H;
      this.vx = vx ?? (Math.random() - 0.5) * 1.5;
      this.vy = vy ?? (Math.random() - 0.5) * 1.5;
      this.life = 1;
      this.decay = 0.0003 + Math.random() * 0.001;
      this.size = 1 + Math.random() * 2.5;
      this.color = this.pickColor();
      this.angle = Math.random() * Math.PI * 2;
      this.spin = (Math.random() - 0.5) * 0.02;
      this.history = [];
      this.maxHistory = 5 + Math.floor(Math.random() * 10);
    }
    pickColor() {
      const p = palettes[paletteIdx].colors;
      return p[Math.floor(Math.random() * p.length)];
    }
    update(mx, my) {
      // Mouse attraction
      if (mx !== undefined) {
        const dx = mx - this.x;
        const dy = my - this.y;
        const dist = Math.hypot(dx, dy) + 1;
        const force = Math.min(50 / dist, 0.8);
        this.vx += (dx / dist) * force * 0.1;
        this.vy += (dy / dist) * force * 0.1;
      }

      // Gentle orbital drift
      this.angle += this.spin;
      this.vx += Math.cos(this.angle) * 0.005;
      this.vy += Math.sin(this.angle) * 0.005;

      // Damping
      this.vx *= 0.995;
      this.vy *= 0.995;

      this.history.push({ x: this.x, y: this.y });
      if (this.history.length > this.maxHistory) this.history.shift();

      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;

      // Wrap
      if (this.x < -20) this.x = W + 20;
      if (this.x > W + 20) this.x = -20;
      if (this.y < -20) this.y = H + 20;
      if (this.y > H + 20) this.y = -20;
    }
    draw() {
      const alpha = this.life * 0.8;
      // Trail
      if (this.history.length > 1) {
        ctx.beginPath();
        ctx.moveTo(this.history[0].x, this.history[0].y);
        for (let i = 1; i < this.history.length; i++) {
          ctx.lineTo(this.history[i].x, this.history[i].y);
        }
        ctx.strokeStyle = this.color + Math.round(alpha * 0.3 * 255).toString(16).padStart(2,'0');
        ctx.lineWidth = this.size * 0.5;
        ctx.stroke();
      }
      // Core
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
      ctx.fillStyle = this.color + Math.round(alpha * 255).toString(16).padStart(2,'0');
      ctx.fill();

      // Glow
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * this.life * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = this.color + Math.round(alpha * 0.15 * 255).toString(16).padStart(2,'0');
      ctx.fill();
    }
  }

  // --- Mouse tracking ---
  let mx = undefined, my = undefined;
  window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
  window.addEventListener('mouseleave', () => { mx = undefined; my = undefined; });

  // --- Emit particles ---
  function emitBurst(x, y, count) {
    for (let i = 0; i < count; i++) {
      if (particles.length < MAX_PARTICLES) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6;
        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed));
      }
    }
  }

  // Ambient emission
  function emitAmbient() {
    if (particles.length < 400) {
      const x = Math.random() * W;
      const y = Math.random() * H;
      particles.push(new Particle(x, y));
    }
  }

  // Click burst
  window.addEventListener('click', e => {
    emitBurst(e.clientX, e.clientY, 80);
  });

  // Keyboard
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      paletteIdx = (paletteIdx + 1) % palettes.length;
      // Recolor existing particles
      particles.forEach(p => p.color = p.pickColor());
    }
    if (e.key === 'c' || e.key === 'C') {
      particles.length = 0;
      ctx.clearRect(0, 0, W, H);
    }
    if (e.key === 's' || e.key === 'S') {
      const link = document.createElement('a');
      link.download = 'cosmic-weave-' + Date.now() + '.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  });

  // --- Background ---
  function drawBackground() {
    ctx.fillStyle = 'rgba(10, 10, 15, 0.08)';
    ctx.fillRect(0, 0, W, H);
  }

  // --- Connection lines ---
  function drawConnections() {
    const maxDist = 100;
    const sample = particles.slice(0, 300); // Limit checks for perf
    ctx.lineWidth = 0.3;
    for (let i = 0; i < sample.length; i++) {
      for (let j = i + 1; j < sample.length; j++) {
        const dx = sample[i].x - sample[j].x;
        const dy = sample[i].y - sample[j].y;
        const dist = Math.hypot(dx, dy);
        if (dist < maxDist) {
          const alpha = (1 - dist / maxDist) * 0.15 * Math.min(sample[i].life, sample[j].life);
          ctx.beginPath();
          ctx.moveTo(sample[i].x, sample[i].y);
          ctx.lineTo(sample[j].x, sample[j].y);
          ctx.strokeStyle = `rgba(180,200,255,${alpha})`;
          ctx.stroke();
        }
      }
    }
  }

  // --- Main loop ---
  let frame = 0;
  function loop() {
    frame++;
    drawBackground();

    if (frame % 3 === 0) emitAmbient();

    drawConnections();

    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update(mx, my);
      particles[i].draw();
      if (particles[i].life <= 0) {
        particles.splice(i, 1);
      }
    }

    // Stats
    if (frame % 30 === 0) {
      stats.textContent = `PARTICLES: ${particles.length} | PALETTE: ${palettes[paletteIdx].name}`;
    }

    requestAnimationFrame(loop);
  }

  // Initial burst
  setTimeout(() => emitBurst(W/2, H/2, 150), 300);
  loop();
})();
</script>
</body>
</html>
