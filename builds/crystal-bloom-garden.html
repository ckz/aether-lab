<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crystal Bloom Garden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050510;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; }
  .ui {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(200, 180, 255, 0.7);
    font-size: 11px;
    text-align: center;
    pointer-events: none;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">click to plant · hold to grow · space to clear</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let crystals = [];
let particles = [];
let hue = 220;
let mouse = { x: W / 2, y: H / 2, down: false };

class Crystal {
  constructor(x, y, angle, length, depth, maxDepth, hue) {
    this.x = x;
    this.y = y;
    this.angle = angle;
    this.length = length;
    this.depth = depth;
    this.maxDepth = maxDepth;
    this.hue = hue;
    this.growProgress = 0;
    this.growSpeed = 0.015 + Math.random() * 0.02;
    this.children = [];
    this.opacity = 1;
    this.sway = Math.random() * Math.PI * 2;
    this.swaySpeed = 0.01 + Math.random() * 0.02;
    this.swayAmount = 0.02 + Math.random() * 0.03;
    this.branchProb = 0.4 + Math.random() * 0.4;
    this.thickness = Math.max(1, (maxDepth - depth) * 1.2);
  }

  update() {
    if (this.growProgress < 1) {
      this.growProgress += this.growSpeed;
      if (this.growProgress > 1) this.growProgress = 1;
    }

    if (this.growProgress >= 1 && this.children.length === 0 && this.depth < this.maxDepth && Math.random() < 0.02) {
      this.branch();
    }

    this.children.forEach(c => c.update());
  }

  branch() {
    const numBranches = 2 + Math.floor(Math.random() * 2);
    const endX = this.x + Math.cos(this.angle) * this.length * this.growProgress;
    const endY = this.y + Math.sin(this.angle) * this.length * this.growProgress;

    for (let i = 0; i < numBranches; i++) {
      const angleOffset = (Math.random() - 0.5) * 1.2;
      const newAngle = this.angle + angleOffset;
      const newLength = this.length * (0.6 + Math.random() * 0.2);
      this.children.push(new Crystal(endX, endY, newAngle, newLength, this.depth + 1, this.maxDepth, this.hue + Math.random() * 20 - 10));
    }
  }

  draw(ctx, time) {
    const sway = Math.sin(time * this.swaySpeed + this.sway) * this.swayAmount;
    const currentAngle = this.angle + sway;
    const currentLength = this.length * this.growProgress;
    const endX = this.x + Math.cos(currentAngle) * currentLength;
    const endY = this.y + Math.sin(currentAngle) * currentLength;

    const gradient = ctx.createLinearGradient(this.x, this.y, endX, endY);
    const alpha = this.opacity * (1 - this.depth / this.maxDepth * 0.3);
    gradient.addColorStop(0, `hsla(${this.hue}, 70%, 60%, ${alpha * 0.8})`);
    gradient.addColorStop(1, `hsla(${this.hue + 30}, 80%, 70%, ${alpha * 0.3})`);

    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(endX, endY);
    ctx.strokeStyle = gradient;
    ctx.lineWidth = this.thickness;
    ctx.lineCap = 'round';
    ctx.stroke();

    // glow
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(endX, endY);
    ctx.strokeStyle = `hsla(${this.hue}, 90%, 70%, ${alpha * 0.2})`;
    ctx.lineWidth = this.thickness + 3;
    ctx.stroke();

    if (this.growProgress >= 1 && Math.random() < 0.3) {
      particles.push(new Particle(endX, endY, this.hue));
    }

    this.children.forEach(c => c.draw(ctx, time));
  }
}

class Particle {
  constructor(x, y, hue) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5;
    this.life = 1;
    this.decay = 0.005 + Math.random() * 0.01;
    this.hue = hue + Math.random() * 20 - 10;
    this.size = 1 + Math.random() * 2;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }

  draw(ctx) {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${this.life * 0.6})`;
    ctx.fill();
  }
}

function plantCrystal(x, y) {
  const numCrystals = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < numCrystals; i++) {
    const angle = (Math.PI * 2 / numCrystals) * i + Math.random() * 0.3;
    const length = 40 + Math.random() * 40;
    const maxDepth = 4 + Math.floor(Math.random() * 3);
    crystals.push(new Crystal(x, y, angle, length, 0, maxDepth, hue));
  }
  hue = (hue + 35) % 360;
}

let time = 0;
let lastPlant = 0;

function animate() {
  time++;
  
  // fade background
  ctx.fillStyle = 'rgba(5, 5, 16, 0.08)';
  ctx.fillRect(0, 0, W, H);

  // mouse glow
  if (mouse.down && time - lastPlant > 10) {
    plantCrystal(mouse.x, mouse.y);
    lastPlant = time;
  }

  crystals.forEach(c => {
    c.update();
    c.draw(ctx, time);
  });

  // particles
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.update();
    p.draw(ctx);
  });

  // limit
  if (crystals.length > 80) {
    crystals = crystals.slice(-80);
  }
  if (particles.length > 500) {
    particles = particles.slice(-500);
  }

  requestAnimationFrame(animate);
}

// initial bloom
setTimeout(() => {
  for (let i = 0; i < 3; i++) {
    plantCrystal(W / 2 + (Math.random() - 0.5) * 200, H / 2 + (Math.random() - 0.5) * 200);
  }
}, 100);

animate();

canvas.addEventListener('mousedown', (e) => {
  mouse.down = true;
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  plantCrystal(e.clientX, e.clientY);
});

canvas.addEventListener('mouseup', () => mouse.down = false);
canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  mouse.down = true;
  const t = e.touches[0];
  mouse.x = t.clientX;
  mouse.y = t.clientY;
  plantCrystal(t.clientX, t.clientY);
});

canvas.addEventListener('touchend', () => mouse.down = false);
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX;
  mouse.y = t.clientY;
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    crystals = [];
    particles = [];
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, W, H);
  }
});
</script>
</body>
</html>
