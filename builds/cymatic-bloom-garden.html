<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cymatic Bloom Garden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #aaa;
  }
  canvas {
    display: block;
    cursor: crosshair;
  }
  .ui {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    background: rgba(10, 10, 18, 0.85);
    padding: 16px 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    max-width: 280px;
  }
  .ui h1 {
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #fff;
    margin-bottom: 4px;
  }
  .ui p {
    font-size: 11px;
    color: #666;
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .control-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
  }
  .control-row label {
    color: #888;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .control-row input[type="range"] {
    width: 140px;
    accent-color: #7b6fff;
  }
  button {
    background: rgba(123, 111, 255, 0.15);
    border: 1px solid rgba(123, 111, 255, 0.3);
    color: #fff;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  button:hover {
    background: rgba(123, 111, 255, 0.3);
    border-color: rgba(123, 111, 255, 0.6);
  }
  .stats {
    margin-top: 10px;
    font-size: 10px;
    color: #555;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="ui">
  <h1>Cymatic Bloom Garden</h1>
  <p>Click to plant cymatic seeds. They grow into resonant flower-like patterns.</p>
  <div class="controls">
    <div class="control-row">
      <label>Symmetry</label>
      <input type="range" id="symmetry" min="3" max="24" value="8">
    </div>
    <div class="control-row">
      <label>Growth</label>
      <input type="range" id="growth" min="1" max="10" value="5">
    </div>
    <div class="control-row">
      <label>Decay</label>
      <input type="range" id="decay" min="1" max="10" value="3">
    </div>
    <button id="clear">Clear Garden</button>
    <button id="auto">Auto-Plant</button>
  </div>
  <div class="stats" id="stats">Blooms: 0</div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const blooms = [];
let autoMode = false;
let autoTimer = null;

const palettes = [
  ['#ff6b9d', '#c06c84', '#f67280', '#c44569', '#ff8a5c'],
  ['#6bffc8', '#4ecdc4', '#44a08d', '#093028', '#7bffb8'],
  ['#a8edea', '#fed6e3', '#ffecd2', '#fcb69f', '#ff9a9e'],
  ['#7b6fff', '#6c5ce7', '#a29bfe', '#fd79a8', '#e84393'],
  ['#ffd700', '#ffaa00', '#ff7700', '#ff4400', '#cc0000'],
  ['#00d2ff', '#3a7bd5', '#7b6fff', '#ff6b9d', '#ffffff']
];

class Bloom {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.symmetry = parseInt(document.getElementById('symmetry').value);
    this.growthRate = parseInt(document.getElementById('growth').value) / 1000;
    this.decayRate = parseInt(document.getElementById('decay').value) / 5000;
    this.age = 0;
    this.maxAge = 600 + Math.random() * 400;
    this.radius = 0;
    this.maxRadius = 80 + Math.random() * 150;
    this.palette = palettes[Math.floor(Math.random() * palettes.length)];
    this.rotationOffset = Math.random() * Math.PI * 2;
    this.frequency = 2 + Math.random() * 6;
    this.amplitude = 0.3 + Math.random() * 0.7;
    this.layers = 2 + Math.floor(Math.random() * 3);
    this.opacity = 1;
  }

  update() {
    this.age++;
    const growthPhase = this.maxRadius * 0.7;
    if (this.radius < growthPhase) {
      this.radius += this.growthRate * growthPhase;
    }
    if (this.age > this.maxAge * 0.6) {
      const decayProgress = (this.age - this.maxAge * 0.6) / (this.maxAge * 0.4);
      this.opacity = Math.max(0, 1 - decayProgress);
    }
    return this.age < this.maxAge;
  }

  draw(ctx) {
    const t = this.age / this.maxRadius;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotationOffset + this.age * 0.005);
    ctx.globalAlpha = this.opacity * 0.8;

    for (let layer = 0; layer < this.layers; layer++) {
      const layerRadius = this.radius * (1 - layer * 0.2);
      const freq = this.frequency + layer * 2;
      const amp = this.amplitude * (1 - layer * 0.15);
      const colorIdx = layer % this.palette.length;

      ctx.beginPath();
      for (let i = 0; i <= 360; i++) {
        const angle = (i / 360) * Math.PI * 2;
        const cymatic = Math.sin(angle * this.symmetry + this.age * 0.02) * amp;
        const wave = Math.sin(angle * freq + this.age * 0.01) * 0.15;
        const r = layerRadius * (1 + cymatic + wave);
        const px = Math.cos(angle) * r;
        const py = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.strokeStyle = this.palette[colorIdx];
      ctx.lineWidth = 1.5 - layer * 0.3;
      ctx.globalAlpha = this.opacity * (0.7 - layer * 0.15);
      ctx.stroke();

      if (layer === 0 && this.opacity > 0.3) {
        ctx.fillStyle = this.palette[(colorIdx + 1) % this.palette.length];
        ctx.globalAlpha = this.opacity * 0.05;
        ctx.fill();
      }
    }

    // Center particle
    if (this.opacity > 0.2) {
      ctx.beginPath();
      ctx.arc(0, 0, 2 + Math.sin(this.age * 0.05) * 1, 0, Math.PI * 2);
      ctx.fillStyle = this.palette[0];
      ctx.globalAlpha = this.opacity;
      ctx.fill();
    }

    ctx.restore();
  }
}

// Background gradient
function drawBackground() {
  const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);
  grad.addColorStop(0, '#0f0f1e');
  grad.addColorStop(1, '#0a0a12');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

// Subtle grid
function drawGrid() {
  ctx.strokeStyle = 'rgba(255,255,255,0.015)';
  ctx.lineWidth = 1;
  const spacing = 60;
  for (let x = 0; x < W; x += spacing) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += spacing) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

canvas.addEventListener('click', (e) => {
  blooms.push(new Bloom(e.clientX, e.clientY));
  updateStats();
});

document.getElementById('clear').addEventListener('click', () => {
  blooms.length = 0;
  updateStats();
});

document.getElementById('auto').addEventListener('click', () => {
  autoMode = !autoMode;
  document.getElementById('auto').textContent = autoMode ? 'Stop Auto' : 'Auto-Plant';
  if (autoMode) {
    autoTimer = setInterval(() => {
      if (blooms.length < 30) {
        const x = Math.random() * W;
        const y = Math.random() * H;
        blooms.push(new Bloom(x, y));
        updateStats();
      }
    }, 800);
  } else {
    clearInterval(autoTimer);
  }
});

function updateStats() {
  document.getElementById('stats').textContent = `Blooms: ${blooms.length}`;
}

function animate() {
  drawBackground();
  drawGrid();

  for (let i = blooms.length - 1; i >= 0; i--) {
    const alive = blooms[i].update();
    if (alive) {
      blooms[i].draw(ctx);
    } else {
      blooms.splice(i, 1);
      updateStats();
    }
  }

  requestAnimationFrame(animate);
}

animate();

// Plant a few initial blooms
setTimeout(() => {
  for (let i = 0; i < 3; i++) {
    blooms.push(new Bloom(
      W * 0.3 + Math.random() * W * 0.4,
      H * 0.3 + Math.random() * H * 0.4
    ));
  }
  updateStats();
}, 100);
</script>
</body>
</html>
