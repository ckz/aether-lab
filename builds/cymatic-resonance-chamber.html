<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cymatic Resonance Chamber</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050508;
    color: #c0c0d0;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    overflow: hidden;
    height: 100vh;
    cursor: crosshair;
  }
  canvas { display: block; }

  #ui {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #666;
    pointer-events: none;
  }
  #ui .title {
    font-size: 14px;
    color: #9a9ac0;
    margin-bottom: 6px;
    letter-spacing: 3px;
  }
  #ui .stat {
    margin: 3px 0;
  }
  #ui .stat span {
    color: #4a9eff;
  }

  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 10;
    background: rgba(5, 5, 8, 0.85);
    padding: 10px 16px;
    border-radius: 30px;
    border: 1px solid #1a1a2e;
    backdrop-filter: blur(8px);
  }
  .mode-btn {
    background: transparent;
    border: 1px solid #2a2a3e;
    color: #888;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .mode-btn:hover {
    border-color: #4a9eff;
    color: #4a9eff;
  }
  .mode-btn.active {
    background: #1a2a4a;
    border-color: #4a9eff;
    color: #fff;
    box-shadow: 0 0 12px rgba(74, 158, 255, 0.25);
  }

  #hint {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: #444;
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 10;
    pointer-events: none;
    text-align: center;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #ui, #controls, #hint {
    animation: fadeIn 1.2s ease-out;
  }
</style>
</head>
<body>
  <div id="ui">
    <div class="title">⟐ CYMATIC RESONANCE CHAMBER</div>
    <div class="stat">NODES: <span id="nodeCount">0</span></div>
    <div class="stat">FREQ: <span id="freqDisplay">0.00</span> Hz</div>
    <div class="stat">MODE: <span id="modeDisplay">ATTRACT</span></div>
  </div>

  <div id="hint">Click to place resonant nodes · Drag to shape · Right-click to remove</div>

  <div id="controls">
    <button class="mode-btn active" data-mode="attract">Attract</button>
    <button class="mode-btn" data-mode="repel">Repel</button>
    <button class="mode-btn" data-mode="vortex">Vortex</button>
    <button class="mode-btn" data-mode="chaos">Chaos</button>
    <button class="mode-btn" data-mode="clear">Clear All</button>
  </div>

  <canvas id="canvas"></canvas>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // State
  let nodes = [];
  let mode = 'attract';
  let mouse = { x: W/2, y: H/2, down: false };
  let dragNode = null;
  let time = 0;
  const MAX_NODES = 12;

  // Palette
  const palette = [
    { r: 74, g: 158, b: 255 },   // blue
    { r: 138, g: 100, b: 255 },  // purple
    { r: 255, g: 100, b: 150 },  // pink
    { r: 100, g: 255, b: 200 },  // cyan
    { r: 255, g: 180, b: 80 },   // gold
  ];

  // Particles
  const particles = [];
  const PARTICLE_COUNT = 3000;

  class Particle {
    constructor() {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.vx = 0;
      this.vy = 0;
      this.life = Math.random() * 200 + 100;
      this.age = Math.random() * this.life;
      this.paletteIndex = Math.floor(Math.random() * palette.length);
    }

    update() {
      this.age++;
      if (this.age > this.life) {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.age = 0;
        this.life = Math.random() * 200 + 100;
        this.paletteIndex = Math.floor(Math.random() * palette.length);
      }

      let fx = 0, fy = 0;

      // Nodal field from placed nodes
      for (const node of nodes) {
        const dx = this.x - node.x;
        const dy = this.y - node.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        const maxDist = 350;

        if (dist < maxDist) {
          const force = (1 - dist/maxDist) * node.strength;
          const angle = Math.atan2(dy, dx);

          // Cymatic wave pattern
          const wavePhase = (dist / 30) - time * 0.03 * node.frequency;
          const wave = Math.sin(wavePhase) * 0.5 + 0.5;

          // Nodal line avoidance (Chladni pattern)
          const nodal = Math.abs(Math.sin(wavePhase * 2));
          const nodalForce = nodal < 0.15 ? -1.5 : 0.3;

          switch (mode) {
            case 'attract':
              fx += Math.cos(angle) * force * 0.4 * wave * nodalForce;
              fy += Math.sin(angle) * force * 0.4 * wave * nodalForce;
              break;
            case 'repel':
              fx -= Math.cos(angle) * force * 0.6 * (1 - wave);
              fy -= Math.sin(angle) * force * 0.6 * (1 - wave);
              break;
            case 'vortex':
              fx += Math.cos(angle + Math.PI/2) * force * 0.5 * wave;
              fy += Math.sin(angle + Math.PI/2) * force * 0.5 * wave;
              break;
            case 'chaos':
              fx += Math.cos(angle * 3 + time * 0.02) * force * 0.3;
              fy += Math.sin(angle * 3 - time * 0.02) * force * 0.3;
              break;
          }
        }
      }

      // Subtle global flow
      fx += Math.sin(this.y * 0.003 + time * 0.005) * 0.08;
      fy += Math.cos(this.x * 0.003 + time * 0.005) * 0.08;

      this.vx = this.vx * 0.92 + fx * 0.3;
      this.vy = this.vy * 0.92 + fy * 0.3;

      // Speed limit
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 3) {
        this.vx = (this.vx / speed) * 3;
        this.vy = (this.vy / speed) * 3;
      }

      this.x += this.vx;
      this.y += this.vy;

      // Wrap
      if (this.x < 0) this.x = W;
      if (this.x > W) this.x = 0;
      if (this.y < 0) this.y = H;
      if (this.y > H) this.y = 0;
    }

    draw() {
      const alpha = Math.sin((this.age / this.life) * Math.PI) * 0.8;
      const c = palette[this.paletteIndex];
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      const bright = Math.min(1, speed / 2);

      ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},${alpha * bright})`;
      ctx.fillRect(this.x, this.y, 1.5, 1.5);
    }
  }

  // Initialize particles
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(new Particle());
  }

  // Nodes
  class ResonantNode {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.strength = 1;
      this.frequency = 0.5 + Math.random() * 1.5;
      this.phase = Math.random() * Math.PI * 2;
      this.paletteIndex = Math.floor(Math.random() * palette.length);
      this.birth = time;
      this.pulsePhase = Math.random() * Math.PI * 2;
    }
  }

  // Mouse
  canvas.addEventListener('mousedown', (e) => {
    if (e.button === 2) {
      // Right click - remove nearest node
      if (nodes.length > 0) {
        let nearest = 0, minDist = Infinity;
        for (let i = 0; i < nodes.length; i++) {
          const dx = nodes[i].x - e.clientX;
          const dy = nodes[i].y - e.clientY;
          const d = dx*dx + dy*dy;
          if (d < minDist) { minDist = d; nearest = i; }
        }
        if (minDist < 2500) nodes.splice(nearest, 1);
      }
      return;
    }
    mouse.down = true;
    // Check if clicking existing node
    for (const node of nodes) {
      const dx = node.x - e.clientX;
      const dy = node.y - e.clientY;
      if (dx*dx + dy*dy < 900) {
        dragNode = node;
        return;
      }
    }
    // Add new node
    if (nodes.length < MAX_NODES) {
      nodes.push(new ResonantNode(e.clientX, e.clientY));
    }
  });

  canvas.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    if (dragNode) {
      dragNode.x = e.clientX;
      dragNode.y = e.clientY;
    }
  });

  canvas.addEventListener('mouseup', () => {
    mouse.down = false;
    dragNode = null;
  });

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // Touch support
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    if (nodes.length < MAX_NODES) {
      nodes.push(new ResonantNode(t.clientX, t.clientY));
    }
  });

  // Controls
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = btn.dataset.mode;
      if (m === 'clear') {
        nodes = [];
        return;
      }
      mode = m;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  // Render loop
  function render() {
    time++;

    // Fade trail
    ctx.fillStyle = 'rgba(5, 5, 8, 0.12)';
    ctx.fillRect(0, 0, W, H);

    // Draw nodal influence lines between nearby nodes
    ctx.strokeStyle = 'rgba(74, 158, 255, 0.04)';
    ctx.lineWidth = 0.5;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const dx = nodes[i].x - nodes[j].x;
        const dy = nodes[i].y - nodes[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 400) {
          const alpha = (1 - dist/400) * 0.08;
          ctx.strokeStyle = `rgba(74, 158, 255, ${alpha})`;
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.stroke();
        }
      }
    }

    // Update and draw particles
    for (const p of particles) {
      p.update();
      p.draw();
    }

    // Draw nodes
    for (const node of nodes) {
      const age = (time - node.birth) / 60;
      const pulse = Math.sin(time * 0.05 + node.pulsePhase) * 0.3 + 0.7;
      const c = palette[node.paletteIndex];
      const radius = (8 + age * 3) * pulse;

      // Glow
      const gradient = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, radius * 4);
      gradient.addColorStop(0, `rgba(${c.r},${c.g},${c.b},0.3)`);
      gradient.addColorStop(0.5, `rgba(${c.r},${c.g},${c.b},0.08)`);
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(node.x, node.y, radius * 4, 0, Math.PI * 2);
      ctx.fill();

      // Core
      ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.8)`;
      ctx.beginPath();
      ctx.arc(node.x, node.y, radius * 0.4, 0, Math.PI * 2);
      ctx.fill();

      // Ring
      ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.2)`;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.arc(node.x, node.y, radius, 0, Math.PI * 2);
      ctx.stroke();

      // Frequency label
      ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.4)`;
      ctx.font = '8px monospace';
      ctx.fillText(`${node.frequency.toFixed(2)}Hz`, node.x + radius + 4, node.y + 3);
    }

    // Update UI
    document.getElementById('nodeCount').textContent = nodes.length;
    const avgFreq = nodes.length > 0
      ? (nodes.reduce((s, n) => s + n.frequency, 0) / nodes.length * 120).toFixed(2)
      : '0.00';
    document.getElementById('freqDisplay').textContent = avgFreq;
    document.getElementById('modeDisplay').textContent = mode.toUpperCase();

    requestAnimationFrame(render);
  }

  // Initial fill
  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, W, H);

  // Seed a few nodes for visual interest
  setTimeout(() => {
    if (nodes.length === 0) {
      nodes.push(new ResonantNode(W * 0.3, H * 0.4));
      nodes.push(new ResonantNode(W * 0.7, H * 0.6));
      nodes.push(new ResonantNode(W * 0.5, H * 0.3));
    }
  }, 800);

  render();
})();
</script>
</body>
</html>
