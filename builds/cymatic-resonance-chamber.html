<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cymatic Resonance Chamber</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050508;
    font-family: 'Courier New', monospace;
    color: #ccc;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  canvas {
    display: block;
    flex: 1;
    cursor: crosshair;
  }
  .hud {
    position: fixed;
    top: 16px;
    left: 16px;
    font-size: 11px;
    opacity: 0.6;
    letter-spacing: 0.15em;
    line-height: 1.8;
    pointer-events: none;
    z-index: 10;
  }
  .controls {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
    background: rgba(10,10,20,0.7);
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid rgba(100,90,180,0.25);
    backdrop-filter: blur(8px);
  }
  .controls button {
    background: rgba(30,25,60,0.8);
    color: #aab;
    border: 1px solid rgba(100,90,180,0.35);
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    transition: all 0.25s;
  }
  .controls button:hover {
    background: rgba(50,40,100,0.9);
    color: #ddf;
    border-color: rgba(150,130,255,0.6);
  }
  .controls button.active {
    background: rgba(80,60,200,0.4);
    color: #fff;
    border-color: rgba(180,160,255,0.8);
    box-shadow: 0 0 20px rgba(100,80,220,0.4);
  }
  .hint {
    position: fixed;
    top: 16px;
    right: 16px;
    font-size: 10px;
    opacity: 0.4;
    letter-spacing: 0.1em;
    text-align: right;
    line-height: 1.7;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud">
  CYMATIC RESONANCE CHAMBER<br>
  <span id="modeLabel">MODE: CONCENTRIC</span><br>
  <span id="freqLabel">FREQ: 1.00 / 2.00</span>
</div>
<div class="hint">
  MOVE — shift frequency<br>
  CLICK — change mode<br>
  SCROLL — grain density<br>
  1-5 — palette<br>
  SPACE — pause
</div>
<div class="controls">
  <button data-mode="0" class="active">Concentric</button>
  <button data-mode="1">Square</button>
  <button data-mode="2">Hexagonal</button>
  <button data-mode="3">Star</button>
  <button data-mode="4">Chaos</button>
  <button data-mode="5">Moiré</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

// State
let mouseX = 0.5, mouseY = 0.5;
let mode = 0;
let paletteIdx = 0;
let paused = false;
let grainDensity = 80000; // total particles
let time = 0;
let freqX = 1.0, freqY = 2.0;
let targetFreqX = 1.0, targetFreqY = 2.0;
let targetMouseX = 0.5, targetMouseY = 0.5;

// Palettes: each is [bg, sand colors array, accent]
const palettes = [
  { name: 'Obsidian', bg: '#050508', colors: ['#f4e4c1','#d4a574','#a67c52','#8b6914','#c9b896'], accent: '#ffe4b5' },
  { name: 'Aurora', bg: '#060a10', colors: ['#7fffd4','#00ced1','#20b2aa','#48d1cc','#7fffd4'], accent: '#e0ffff' },
  { name: 'Ember', bg: '#0a0505', colors: ['#ff6b35','#f7931e','#ff4500','#ff8c00','#ffa07a'], accent: '#ffd700' },
  { name: 'Frost', bg: '#050810', colors: ['#b0e0e6','#87ceeb','#add8e6','#e0f6ff','#ffffff'], accent: '#e6f3ff' },
  { name: 'Nebula', bg: '#080510', colors: ['#ff6b9d','#c44569','#f8a5c2','#ff7979','#e056a0'], accent: '#ffb8d4' },
];

let currentPalette = palettes[0];

// Sand grain positions (precomputed grid)
let grains = [];
let grainImageData = null;

function initGrains() {
  const cols = Math.ceil(Math.sqrt(grainDensity * (W / H)));
  const rows = Math.ceil(grainDensity / cols);
  const spacingX = W / cols;
  const spacingY = H / rows;
  grains = [];
  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      grains.push({
        x: i * spacingX + spacingX * 0.5,
        y: j * spacingY + spacingY * 0.5,
        col: i,
        row: j,
        cols: cols,
        rows: rows,
      });
    }
  }
  grainDensity = grains.length;
}
initGrains();

// Chladni equation: amplitude at (x,y) on a plate
function chladniAmplitude(x, y, fx, fy, mode) {
  const nx = x / W;
  const ny = y / H;
  const pi2 = Math.PI * 2;
  
  switch (mode) {
    case 0: // Concentric rings + radial
      return Math.sin(fx * pi2 * nx) * Math.sin(fy * pi2 * ny) +
             Math.sin(fx * 0.5 * pi2 * (nx * nx + ny * ny)) * 0.5;
    
    case 1: // Square symmetry
      return Math.sin(fx * pi2 * nx) * Math.sin(fy * pi2 * ny) +
             Math.sin(fx * pi2 * ny) * Math.sin(fy * pi2 * nx);
    
    case 2: // Hexagonal
      const hex1 = Math.sin(fx * pi2 * nx) * Math.sin(fy * pi2 * ny);
      const hex2 = Math.sin(fx * pi2 * (nx * 0.5 + ny * 0.866)) * Math.sin(fy * pi2 * (nx * 0.5 - ny * 0.866));
      const hex3 = Math.sin(fx * pi2 * (nx * 0.5 - ny * 0.866)) * Math.sin(fy * pi2 * (nx * 0.5 + ny * 0.866));
      return hex1 + hex2 * 0.7 + hex3 * 0.7;
    
    case 3: // Star / radial
      const dx = nx - 0.5, dy = ny - 0.5;
      const r = Math.sqrt(dx * dx + dy * dy);
      const theta = Math.atan2(dy, dx);
      return Math.sin(fx * r * 8) * Math.cos(fy * theta * 3) +
             Math.sin(fy * r * 6) * 0.5;
    
    case 4: // Chaos - overlapping many modes
      return Math.sin(fx * pi2 * nx + time * 0.3) * Math.sin(fy * pi2 * ny) +
             Math.sin(fx * pi2 * ny + time * 0.2) * Math.sin(fy * pi2 * nx) +
             Math.sin((fx + fy) * pi2 * (nx + ny) * 0.5 + time * 0.15) * 0.6 +
             Math.sin(fx * pi2 * Math.sqrt(nx * nx + ny * ny) + time * 0.1) * 0.4;
    
    case 5: // Moiré
      const a = fx * pi2 * nx;
      const b = fy * pi2 * ny;
      return Math.sin(a + b + time * 0.2) * Math.cos(a - b + time * 0.15) +
             Math.sin(a * 1.5 + time * 0.1) * Math.cos(b * 1.5 + time * 0.12) * 0.5;
    
    default:
      return Math.sin(fx * pi2 * nx) * Math.sin(fy * pi2 * ny);
  }
}

function getAmplitude(g) {
  return chladniAmplitude(g.x, g.y, freqX, freqY, mode);
}

// Smooth noise for dappled light
function smoothNoise(x, y, t) {
  return (Math.sin(x * 0.01 + t) + Math.sin(y * 0.013 + t * 0.7) +
          Math.sin((x + y) * 0.008 + t * 0.5) + Math.sin(Math.sqrt(x * x + y * y) * 0.005 + t * 0.3)) * 0.25;
}

// Render
function render() {
  if (!paused) {
    time += 0.016;
  }
  
  // Smooth mouse-driven frequency
  targetFreqX = 0.5 + mouseX * 3.5;
  targetFreqY = 0.5 + mouseY * 3.5;
  freqX += (targetFreqX - freqX) * 0.03;
  freqY += (targetFreqY - freqY) * 0.03;
  
  // Background with subtle vignette
  const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
  bgGrad.addColorStop(0, currentPalette.bg);
  bgGrad.addColorStop(1, '#000');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  
  // Draw sand grains
  const colors = currentPalette.colors;
  const accent = currentPalette.accent;
  
  for (let i = 0; i < grains.length; i++) {
    const g = grains[i];
    const amp = getAmplitude(g);
    
    // Amplitude near zero = standing wave node = sand collects here
    const nodeStrength = Math.exp(-amp * amp * 8);
    
    if (nodeStrength > 0.15) {
      // Color based on position in the pattern
      const colorIdx = Math.floor((amp + 2) / 4 * colors.length) % colors.length;
      const baseColor = colors[colorIdx];
      
      // Parse color for alpha
      const r = parseInt(baseColor.slice(1, 3), 16);
      const gVal = parseInt(baseColor.slice(3, 5), 16);
      const b = parseInt(baseColor.slice(5, 7), 16);
      
      // Alpha based on node strength
      const alpha = Math.min(1, nodeStrength * 1.2);
      
      // Size varies with node strength
      const size = 0.8 + nodeStrength * 1.8;
      
      // Slight glow on strong nodes
      if (nodeStrength > 0.7) {
        ctx.fillStyle = `rgba(${r},${gVal},${b},${alpha * 0.3})`;
        ctx.beginPath();
        ctx.arc(g.x, g.y, size * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      
      // Sand grain
      ctx.fillStyle = `rgba(${r},${gVal},${b},${alpha})`;
      ctx.beginPath();
      ctx.arc(g.x, g.y, size, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  
  // Dappled light overlay — mouse proximity creates a soft light pool
  const lightX = mouseX * W;
  const lightY = mouseY * H;
  const lightGrad = ctx.createRadialGradient(lightX, lightY, 0, lightX, lightY, 200);
  lightGrad.addColorStop(0, 'rgba(255,255,240,0.04)');
  lightGrad.addColorStop(0.5, 'rgba(255,255,240,0.015)');
  lightGrad.addColorStop(1, 'rgba(255,255,240,0)');
  ctx.fillStyle = lightGrad;
  ctx.fillRect(0, 0, W, H);
  
  // Second, larger ambient light following mouse slowly
  const ambientX = cx + Math.sin(time * 0.2) * 100 + (mouseX - 0.5) * 150;
  const ambientY = cy + Math.cos(time * 0.15) * 80 + (mouseY - 0.5) * 150;
  const ambGrad = ctx.createRadialGradient(ambientX, ambientY, 0, ambientX, ambientY, 350);
  ambGrad.addColorStop(0, `rgba(${parseInt(accent.slice(1,3),16)},${parseInt(accent.slice(3,5),16)},${parseInt(accent.slice(5,7),16)},0.03)`);
  ambGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = ambGrad;
  ctx.fillRect(0, 0, W, H);
  
  // Update HUD
  document.getElementById('modeLabel').textContent = `MODE: ${['CONCENTRIC','SQUARE','HEXAGONAL','STAR','CHAOS','MOIRÉ'][mode]}`;
  document.getElementById('freqLabel').textContent = `FREQ: ${freqX.toFixed(2)} / ${freqY.toFixed(2)}`;
}

// Animation loop
function animate() {
  render();
  requestAnimationFrame(animate);
}

// Input handlers
canvas.addEventListener('mousemove', (e) => {
  targetMouseX = e.clientX / W;
  targetMouseY = e.clientY / H;
  mouseX += (targetMouseX - mouseX) * 0.08;
  mouseY += (targetMouseY - mouseY) * 0.08;
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  targetMouseX = t.clientX / W;
  targetMouseY = t.clientY / H;
  mouseX += (targetMouseX - mouseX) * 0.08;
  mouseY += (targetMouseY - mouseY) * 0.08;
}, { passive: false });

canvas.addEventListener('click', () => {
  mode = (mode + 1) % 6;
  updateButtons();
});

// Scroll to adjust grain density
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  grainDensity = Math.max(10000, Math.min(200000, grainDensity - e.deltaY * 100));
  initGrains();
});

// Buttons
const buttons = document.querySelectorAll('.controls button');
buttons.forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    mode = parseInt(btn.dataset.mode);
    updateButtons();
  });
});

function updateButtons() {
  buttons.forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.mode) === mode);
  });
}

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key >= '1' && e.key <= '5') {
    paletteIdx = parseInt(e.key) - 1;
    currentPalette = palettes[paletteIdx];
  }
  if (e.key === ' ') {
    paused = !paused;
    e.preventDefault();
  }
  if (e.key === 'c' || e.key === 'C') {
    // Cycle mode via keyboard
    mode = (mode + 1) % 6;
    updateButtons();
  }
});

// Start
animate();
</script>
</body>
</html>
