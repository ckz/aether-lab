<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Zen Garden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: none;
  }
  canvas {
    display: block;
  }
  #ui {
    position: fixed;
    top: 20px;
    left: 20px;
    color: rgba(255,255,255,0.4);
    font-size: 11px;
    line-height: 1.8;
    pointer-events: none;
    z-index: 10;
  }
  #title {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.15);
    font-size: 13px;
    letter-spacing: 6px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
  #cursor {
    position: fixed;
    width: 20px;
    height: 20px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    pointer-events: none;
    z-index: 100;
    transform: translate(-50%, -50%);
    transition: width 0.3s, height 0.3s, border-color 0.3s;
  }
  #cursor.active {
    width: 40px;
    height: 40px;
    border-color: rgba(200, 180, 255, 0.6);
  }
</style>
</head>
<body>
<div id="ui">
  CLICK — place stone<br>
  DRAG — rake sand<br>
  SPACE — rain<br>
  R — reset<br>
  C — cycle palette
</div>
<div id="title">Digital Zen Garden</div>
<div id="cursor"></div>
<canvas id="garden"></canvas>

<script>
const canvas = document.getElementById('garden');
const ctx = canvas.getContext('2d');
const cursor = document.getElementById('cursor');

let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// Palette themes
const palettes = [
  { name: 'Midnight', bg: '#0a0a0f', sand: '#1a1a2e', ripple: 'rgba(120,100,200,', stone: '#c4a0ff', petal: '#ffb7c5' },
  { name: 'Ocean', bg: '#050a0f', sand: '#0a1e2e', ripple: 'rgba(80,180,220,', stone: '#7dd3fc', petal: '#e0f2fe' },
  { name: 'Forest', bg: '#0a0f0a', sand: '#1a2e1a', ripple: 'rgba(100,200,120,', stone: '#86efac', petal: '#fef3c7' },
  { name: 'Ember', bg: '#0f0a08', sand: '#2e1a0a', ripple: 'rgba(240,140,60,', stone: '#fdba74', petal: '#fef9c3' },
  { name: 'Frost', bg: '#0a0a10', sand: '#1a1a2e', ripple: 'rgba(180,200,255,', stone: '#e0e7ff', petal: '#fce7f3' },
];
let paletteIndex = 0;
let P = palettes[0];

// State
let mouse = { x: W/2, y: H/2, down: false, prevX: W/2, prevY: H/2 };
let ripples = [];
let stones = [];
let petals = [];
let trails = [];
let rainActive = false;
let time = 0;

// Stone class
class Stone {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.radius = 20 + Math.random() * 30;
    this.opacity = 0;
    this.targetOpacity = 0.5 + Math.random() * 0.3;
    this.rippleTimer = 0;
    this.rippleInterval = 180 + Math.random() * 120;
  }
  update() {
    this.opacity += (this.targetOpacity - this.opacity) * 0.05;
    this.rippleTimer++;
    if (this.rippleTimer >= this.rippleInterval) {
      this.rippleTimer = 0;
      ripples.push(new Ripple(this.x, this.y, 0.3, 40 + Math.random() * 20, P.ripple));
    }
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(1, 0.6);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius);
    grad.addColorStop(0, P.stone + Math.floor(this.opacity * 80).toString(16).padStart(2,'0'));
    grad.addColorStop(0.7, P.stone + Math.floor(this.opacity * 40).toString(16).padStart(2,'0'));
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// Ripple class
class Ripple {
  constructor(x, y, speed, maxRadius, colorBase) {
    this.x = x;
    this.y = y;
    this.radius = 0;
    this.maxRadius = maxRadius;
    this.speed = speed;
    this.opacity = 0.6;
    this.colorBase = colorBase;
  }
  update() {
    this.radius += this.speed;
    this.opacity = 0.6 * (1 - this.radius / this.maxRadius);
    return this.radius < this.maxRadius;
  }
  draw() {
    ctx.strokeStyle = this.colorBase + Math.floor(this.opacity * 255).toString(16).padStart(2,'0') + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// Petal class
class Petal {
  constructor() {
    this.reset();
    this.y = Math.random() * H;
  }
  reset() {
    this.x = Math.random() * W;
    this.y = -10;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = 0.3 + Math.random() * 0.7;
    this.size = 2 + Math.random() * 3;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.02;
    this.wobble = Math.random() * Math.PI * 2;
    this.opacity = 0.3 + Math.random() * 0.4;
  }
  update() {
    this.wobble += 0.02;
    this.x += this.vx + Math.sin(this.wobble) * 0.3;
    this.y += this.vy;
    this.rotation += this.rotSpeed;
    if (this.y > H + 10 || this.x < -10 || this.x > W + 10) {
      this.reset();
    }
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.fillStyle = P.petal + Math.floor(this.opacity * 255).toString(16).padStart(2,'0') + ')';
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// Trail point for sand raking
class TrailPoint {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.opacity = 0.4;
    this.size = 2;
  }
}

// Event handlers
document.addEventListener('mousemove', e => {
  mouse.prevX = mouse.x;
  mouse.prevY = mouse.y;
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
  
  if (mouse.down) {
    const dist = Math.hypot(mouse.x - mouse.prevX, mouse.y - mouse.prevY);
    const steps = Math.max(1, Math.floor(dist / 3));
    for (let i = 0; i < steps; i++) {
      const t = i / steps;
      trails.push(new TrailPoint(
        mouse.prevX + (mouse.x - mouse.prevX) * t,
        mouse.prevY + (mouse.y - mouse.prevY) * t
      ));
    }
    // Occasional ripple while dragging
    if (Math.random() < 0.1) {
      ripples.push(new Ripple(mouse.x, mouse.y, 0.8, 30 + Math.random() * 20, P.ripple));
    }
  }
});

document.addEventListener('mousedown', e => {
  if (e.button === 0) {
    mouse.down = true;
    cursor.classList.add('active');
    stones.push(new Stone(mouse.x, mouse.y));
    // Burst ripple
    for (let i = 0; i < 3; i++) {
      setTimeout(() => {
        ripples.push(new Ripple(mouse.x, mouse.y, 1 + i * 0.5, 50 + i * 30, P.ripple));
      }, i * 100);
    }
  }
});

document.addEventListener('mouseup', () => {
  mouse.down = false;
  cursor.classList.remove('active');
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    rainActive = !rainActive;
  }
  if (e.key === 'r' || e.key === 'R') {
    reset();
  }
  if (e.key === 'c' || e.key === 'C') {
    paletteIndex = (paletteIndex + 1) % palettes.length;
    P = palettes[paletteIndex];
  }
});

function reset() {
  stones = [];
  trails = [];
  ripples = [];
  petals = [];
  for (let i = 0; i < 20; i++) {
    petals.push(new Petal());
  }
}

// Initialize
for (let i = 0; i < 20; i++) {
  petals.push(new Petal());
}

// Background grid (subtle sand texture)
function drawBackground() {
  ctx.fillStyle = P.bg;
  ctx.fillRect(0, 0, W, H);
  
  // Subtle grid pattern
  ctx.strokeStyle = P.sand + '30';
  ctx.lineWidth = 0.5;
  const gridSize = 40;
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

// Draw trails as sand raking
function drawTrails() {
  ctx.fillStyle = P.sand + '40';
  for (const t of trails) {
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2);
    ctx.fill();
  }
  // Limit trail length
  if (trails.length > 2000) {
    trails = trails.slice(-1500);
  }
}

// Animation loop
function animate() {
  time++;
  
  drawBackground();
  drawTrails();
  
  // Update and draw ripples
  ripples = ripples.filter(r => {
    r.draw();
    return r.update();
  });
  
  // Update and draw stones
  stones.forEach(s => {
    s.update();
    s.draw();
  });
  
  // Rain effect
  if (rainActive && time % 3 === 0) {
    const rx = Math.random() * W;
    const ry = 0;
    ripples.push(new Ripple(rx, ry, 2 + Math.random() * 2, 80 + Math.random() * 60, P.ripple));
  }
  
  // Update and draw petals
  petals.forEach(p => {
    p.update();
    p.draw();
  });
  
  // Ambient glow around cursor
  const glow = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 100);
  glow.addColorStop(0, P.ripple + '08)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(mouse.x - 100, mouse.y - 100, 200, 200);
  
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
