<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo Lattice — Generative Art by Aether</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060d; }
  canvas { display: block; cursor: crosshair; }
  #ui {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    font: 11px/1.5 'SF Mono', 'Fira Code', 'Consolas', monospace;
    color: rgba(180,200,220,0.7); pointer-events: none;
    text-align: center; letter-spacing: 0.04em;
    text-shadow: 0 0 8px rgba(100,180,255,0.3);
    transition: opacity 0.6s;
  }
  #ui.fade { opacity: 0.15; }
  #ui .keys { color: rgba(120,200,160,0.7); }
  #palette {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; pointer-events: none;
  }
  #palette .swatch {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 6px currentColor;
    transition: transform 0.3s, opacity 0.3s;
  }
  #palette .swatch.active { transform: scale(1.5); opacity: 1; }
  #palette .swatch:not(.active) { opacity: 0.35; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <span class="keys">CLICK</span> burst &nbsp;·&nbsp;
  <span class="keys">SPACE</span> palette &nbsp;·&nbsp;
  <span class="keys">H</span> hide hints &nbsp;·&nbsp;
  <span class="keys">S</span> save
</div>
<div id="palette"></div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const ui = document.getElementById('ui');
  const paletteEl = document.getElementById('palette');

  let W, H, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Palettes ─────────────────────────────────────────────
  const PALETTES = [
    { name: 'Aurora',   bg: [5,8,18],    colors: ['#4df0c0','#2b7fff','#b44dff','#ff5e9c','#ffe156'] },
    { name: 'Ember',    bg: [18,6,5],    colors: ['#ff6a3d','#ffb347','#ff3d6a','#ffde7a','#ff8c42'] },
    { name: 'Deep',     bg: [4,6,16],    colors: ['#1e90ff','#00e5ff','#7b68ee','#40e0d0','#a0e0ff'] },
    { name: 'Monochrome', bg: [8,8,10],  colors: ['#ffffff','#aaaacc','#888899','#d0d0e8','#666677'] },
    { name: 'Biolum',   bg: [3,10,8],    colors: ['#39ff14','#00ffa3','#7dffb3','#a3ff40','#20e0b0'] },
    { name: 'Rose',     bg: [16,5,12],   colors: ['#ff6b9d','#ff8fab','#ff5e8a','#ffa0c0','#ff3d6a'] },
    { name: 'Solar',    bg: [14,10,4],   colors: ['#ffdd44','#ffaa22','#ff8800','#ffe066','#ffcc00'] },
    { name: 'Arctic',   bg: [6,10,16],   colors: ['#c8eeff','#88ccff','#e0f4ff','#aaddff','#ffffff'] },
  ];
  let palIdx = 0;
  function pal() { return PALETTES[palIdx]; }

  // ── Lattice nodes ────────────────────────────────────────
  const SPACING = 44;
  const INFLUENCE_RADIUS = 180;
  let cols, rows, nodes = [];

  function buildLattice() {
    cols = Math.ceil(W / SPACING) + 2;
    rows = Math.ceil(H / SPACING) + 2;
    nodes = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        nodes.push({
          x: c * SPACING - SPACING / 2,
          y: r * SPACING - SPACING / 2,
          baseX: c * SPACING - SPACING / 2,
          baseY: r * SPACING - SPACING / 2,
          phase: Math.random() * Math.PI * 2,
          energy: 0,
          colorIdx: Math.floor(Math.random() * 5),
        });
      }
    }
  }

  // ── Bursts ───────────────────────────────────────────────
  let bursts = [];
  function addBurst(x, y) {
    bursts.push({ x, y, birth: performance.now(), strength: 1 });
    if (bursts.length > 12) bursts.shift();
  }

  // ── Mouse ────────────────────────────────────────────────
  const mouse = { x: -9999, y: -9999, active: false };
  canvas.addEventListener('mousemove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  });
  canvas.addEventListener('mouseleave', () => { mouse.active = false; });
  canvas.addEventListener('mousedown', e => {
    addBurst(e.clientX, e.clientY);
  });
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    mouse.x = t.clientX; mouse.y = t.clientY; mouse.active = true;
    addBurst(t.clientX, t.clientY);
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    mouse.x = t.clientX; mouse.y = t.clientY;
  }, { passive: false });
  canvas.addEventListener('touchend', () => { mouse.active = false; });

  // ── Keyboard ─────────────────────────────────────────────
  let uiVisible = true;
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); palIdx = (palIdx + 1) % PALETTES.length; buildPaletteUI(); }
    if (e.code === 'KeyH') { uiVisible = !uiVisible; ui.classList.toggle('fade', !uiVisible); }
    if (e.code === 'KeyS') { savePNG(); }
  });

  function savePNG() {
    const link = document.createElement('a');
    link.download = 'echo-lattice-' + Date.now() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  // ── Palette UI ───────────────────────────────────────────
  function buildPaletteUI() {
    paletteEl.innerHTML = '';
    PALETTES.forEach((p, i) => {
      const s = document.createElement('div');
      s.className = 'swatch' + (i === palIdx ? ' active' : '');
      s.style.backgroundColor = p.colors[0];
      s.style.color = p.colors[0];
      paletteEl.appendChild(s);
    });
  }
  buildPaletteUI();

  // ── Render ───────────────────────────────────────────────
  let lastTime = performance.now();
  let frameCount = 0;

  function draw(time) {
    requestAnimationFrame(draw);
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;
    frameCount++;

    const p = pal();
    const bg = p.bg;

    // Fade trail
    ctx.fillStyle = `rgba(${bg[0]},${bg[1]},${bg[2]},0.18)`;
    ctx.fillRect(0, 0, W, H);

    // Age bursts
    bursts = bursts.filter(b => (time - b.birth) < 3000);

    // ── Update nodes ───────────────────────────────────────
    const breathFreq = 0.4; // breathing cycle
    const breathPhase = time * 0.001 * breathFreq;

    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];

      // Breathing displacement
      const breathAmp = 3 + Math.sin(breathPhase + n.phase) * 2.5;
      n.x = n.baseX + Math.cos(breathPhase + n.phase) * breathAmp;
      n.y = n.baseY + Math.sin(breathPhase * 0.7 + n.phase) * breathAmp;

      // Mouse influence
      if (mouse.active) {
        const dx = n.x - mouse.x;
        const dy = n.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < INFLUENCE_RADIUS) {
          const force = (1 - dist / INFLUENCE_RADIUS);
          const angle = Math.atan2(dy, dx);
          n.x += Math.cos(angle) * force * 22;
          n.y += Math.sin(angle) * force * 22;
          n.energy = Math.min(1, n.energy + force * 0.08);
        }
      }

      // Burst waves
      for (let b = 0; b < bursts.length; b++) {
        const burst = bursts[b];
        const age = (time - burst.birth) / 1000;
        const waveRadius = age * 380;
        const waveWidth = 60;
        const dx = n.x - burst.x;
        const dy = n.y - burst.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const diff = Math.abs(dist - waveRadius);
        if (diff < waveWidth) {
          const waveForce = (1 - diff / waveWidth) * burst.strength * (1 - age / 3);
          const angle = Math.atan2(dy, dx);
          n.x += Math.cos(angle) * waveForce * 30;
          n.y += Math.sin(angle) * waveForce * 30;
          n.energy = Math.min(1, n.energy + waveForce * 0.5);
        }
      }

      // Decay energy
      n.energy *= 0.96;
    }

    // ── Draw connections ───────────────────────────────────
    // Right neighbors
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols - 1; c++) {
        const i = r * cols + c;
        const j = r * cols + c + 1;
        const a = nodes[i], b = nodes[j];
        const avgEnergy = (a.energy + b.energy) * 0.5;
        const col = p.colors[a.colorIdx % p.colors.length];

        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);

        if (avgEnergy > 0.02) {
          ctx.strokeStyle = hexToRGBA(col, 0.15 + avgEnergy * 0.7);
          ctx.lineWidth = 0.5 + avgEnergy * 2.5;
          ctx.shadowBlur = avgEnergy * 16;
          ctx.shadowColor = col;
        } else {
          ctx.strokeStyle = hexToRGBA(col, 0.06);
          ctx.lineWidth = 0.4;
          ctx.shadowBlur = 0;
        }
        ctx.stroke();
      }
    }

    // Bottom neighbors
    for (let r = 0; r < rows - 1; r++) {
      for (let c = 0; c < cols; c++) {
        const i = r * cols + c;
        const j = (r + 1) * cols + c;
        const a = nodes[i], b = nodes[j];
        const avgEnergy = (a.energy + b.energy) * 0.5;
        const col = p.colors[a.colorIdx % p.colors.length];

        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);

        if (avgEnergy > 0.02) {
          ctx.strokeStyle = hexToRGBA(col, 0.15 + avgEnergy * 0.7);
          ctx.lineWidth = 0.5 + avgEnergy * 2.5;
          ctx.shadowBlur = avgEnergy * 16;
          ctx.shadowColor = col;
        } else {
          ctx.strokeStyle = hexToRGBA(col, 0.06);
          ctx.lineWidth = 0.4;
          ctx.shadowBlur = 0;
        }
        ctx.stroke();
      }
    }

    // ── Draw nodes ─────────────────────────────────────────
    ctx.shadowBlur = 0;
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      const col = p.colors[n.colorIdx % p.colors.length];
      const baseRadius = 1.2 + Math.sin(breathPhase + n.phase) * 0.8;
      const radius = baseRadius + n.energy * 4.5;
      const alpha = 0.35 + n.energy * 0.65;

      ctx.beginPath();
      ctx.arc(n.x, n.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = hexToRGBA(col, alpha);
      if (n.energy > 0.15) {
        ctx.shadowBlur = n.energy * 18;
        ctx.shadowColor = col;
      } else {
        ctx.shadowBlur = 0;
      }
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // ── Mouse glow ─────────────────────────────────────────
    if (mouse.active) {
      const grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, INFLUENCE_RADIUS);
      grad.addColorStop(0, hexToRGBA(p.colors[0], 0.06));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(mouse.x - INFLUENCE_RADIUS, mouse.y - INFLUENCE_RADIUS, INFLUENCE_RADIUS * 2, INFLUENCE_RADIUS * 2);
    }
  }

  // ── Helpers ─────────────────────────────────────────────
  function hexToRGBA(hex, alpha) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // ── Boot ─────────────────────────────────────────────────
  buildLattice();
  // Initial clear
  const initBg = pal().bg;
  ctx.fillStyle = `rgb(${initBg[0]},${initBg[1]},${initBg[2]})`;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
