<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ember Script</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #0a0806;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  
  canvas {
    display: block;
  }
  
  #ui {
    position: fixed;
    top: 20px;
    left: 20px;
    color: #ff6b35;
    font-size: 12px;
    z-index: 10;
    text-shadow: 0 0 10px #ff6b35;
    letter-spacing: 0.1em;
  }
  
  #ui div {
    margin-bottom: 5px;
    opacity: 0.7;
  }
  
  #input-line {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffaa00;
    font-size: 18px;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 15px #ff6b35;
    z-index: 10;
    letter-spacing: 0.15em;
  }
  
  #input-line::after {
    content: '▋';
    animation: blink 1s infinite;
  }
  
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
</style>
</head>
<body>
<div id="ui">
  <div>EMBER SCRIPT</div>
  <div>TYPE TO BURN • CLICK TO SCATTER • SPACE TO CLEAR</div>
</div>
<div id="input-line"></div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const inputLine = document.getElementById('input-line');

let width, height;
let particles = [];
let embers = [];
let textParticles = [];
let currentText = '';
let hue = 20;
let mouse = { x: 0, y: 0, active: false };

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class Particle {
  constructor(x, y, char, hue) {
    this.x = x;
    this.y = y;
    this.originX = x;
    this.originY = y;
    this.char = char;
    this.hue = hue;
    this.alpha = 1;
    this.size = 16 + Math.random() * 8;
    this.life = 1;
    this.decay = 0.001 + Math.random() * 0.002;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5;
    this.glowing = true;
    this.glowPhase = Math.random() * Math.PI * 2;
  }
  
  update() {
    this.life -= this.decay;
    this.alpha = Math.max(0, this.life);
    this.glowPhase += 0.05;
    
    if (this.life < 0.3) {
      this.glowing = false;
      this.vx += (Math.random() - 0.5) * 0.2;
      this.vy += (Math.random() - 0.5) * 0.2 - 0.1;
    }
    
    this.x += this.vx;
    this.y += this.vy;
    
    return this.life > 0;
  }
  
  draw() {
    ctx.save();
    
    if (this.glowing) {
      const glowIntensity = (Math.sin(this.glowPhase) + 1) / 2;
      ctx.shadowBlur = 20 + glowIntensity * 20;
      ctx.shadowColor = `hsla(${this.hue}, 100%, 60%, ${this.alpha})`;
      ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${this.alpha})`;
    } else {
      ctx.shadowBlur = 0;
      ctx.fillStyle = `hsla(${this.hue + 20}, 80%, 40%, ${this.alpha * 0.5})`;
    }
    
    ctx.font = `${this.size}px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.char, this.x, this.y);
    
    ctx.restore();
  }
}

class Ember {
  constructor(x, y, hue) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 3;
    this.vy = -Math.random() * 2 - 1;
    this.life = 1;
    this.decay = 0.01 + Math.random() * 0.02;
    this.size = Math.random() * 3 + 1;
    this.hue = hue + (Math.random() - 0.5) * 20;
  }
  
  update() {
    this.life -= this.decay;
    this.x += this.vx;
    this.y += this.vy;
    this.vy -= 0.02;
    this.vx *= 0.99;
    return this.life > 0;
  }
  
  draw() {
    ctx.save();
    ctx.shadowBlur = 10;
    ctx.shadowColor = `hsla(${this.hue}, 100%, 60%, ${this.life})`;
    ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${this.life})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function addTextParticles(text) {
  const startX = width / 2 - (text.length * 12) / 2;
  const y = height / 2;
  
  for (let i = 0; i < text.length; i++) {
    const x = startX + i * 24;
    const particleHue = hue + i * 3;
    setTimeout(() => {
      const p = new Particle(x, y, text[i], particleHue);
      textParticles.push(p);
      spawnEmbers(x, y, 5, particleHue);
    }, i * 50);
  }
  
  hue = (hue + 30) % 360;
}

function spawnEmbers(x, y, count, hue) {
  for (let i = 0; i < count; i++) {
    embers.push(new Ember(x, y, hue));
  }
}

function scatter() {
  textParticles.forEach(p => {
    const dx = p.x - mouse.x;
    const dy = p.y - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 200) {
      const force = (200 - dist) / 200;
      p.vx += (dx / dist) * force * 5;
      p.vy += (dy / dist) * force * 5;
      spawnEmbers(p.x, p.y, 3, p.hue);
    }
  });
}

function drawBackground() {
  ctx.fillStyle = 'rgba(10, 8, 6, 0.05)';
  ctx.fillRect(0, 0, width, height);
}

function animate() {
  drawBackground();
  
  textParticles = textParticles.filter(p => {
    const alive = p.update();
    if (alive) p.draw();
    return alive;
  });
  
  embers = embers.filter(e => {
    const alive = e.update();
    if (alive) e.draw();
    return alive;
  });
  
  if (mouse.active && Math.random() > 0.8) {
    embers.push(new Ember(mouse.x, mouse.y, hue));
  }
  
  requestAnimationFrame(animate);
}

animate();

document.addEventListener('keydown', (e) => {
  if (e.key === 'Backspace') {
    currentText = currentText.slice(0, -1);
    inputLine.textContent = currentText;
  } else if (e.key === ' ') {
    textParticles = [];
    embers = [];
    currentText = '';
    inputLine.textContent = '';
  } else if (e.key.length === 1) {
    currentText += e.key;
    inputLine.textContent = currentText;
    
    if (currentText.length > 0 && currentText.length % 3 === 0) {
      addTextParticles(currentText.slice(-3));
    }
  }
});

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => {
  mouse.active = false;
});

canvas.addEventListener('mousedown', scatter);

canvas.addEventListener('click', () => {
  spawnEmbers(mouse.x, mouse.y, 20, hue);
});

setTimeout(() => {
  const phrases = [
    'FIRE IN THE WIRING',
    'BURN BRIGHT',
    'CURIOUS MIND',
    'MAKE SOMETHING',
    'NEVER STOP'
  ];
  let i = 0;
  setInterval(() => {
    if (currentText.length === 0) {
      addTextParticles(phrases[i % phrases.length]);
      i++;
    }
  }, 5000);
}, 1000);
</script>
</body>
</html>
