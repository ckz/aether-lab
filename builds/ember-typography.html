<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ember Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #05030a;
    font-family: 'Georgia', serif;
    cursor: none;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #ui {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    text-align: center;
  }
  #input {
    background: rgba(20, 10, 5, 0.5);
    border: 1px solid rgba(255, 140, 40, 0.25);
    border-radius: 30px;
    padding: 12px 28px;
    color: #ffb870;
    font-size: 1.05rem;
    font-family: 'Georgia', serif;
    letter-spacing: 0.08em;
    outline: none;
    width: 340px;
    text-align: center;
    backdrop-filter: blur(10px);
    transition: all 0.3s;
  }
  #input:focus {
    border-color: rgba(255, 140, 40, 0.6);
    box-shadow: 0 0 25px rgba(255, 100, 20, 0.15);
  }
  #input::placeholder {
    color: rgba(255, 180, 100, 0.3);
    font-style: italic;
  }
  #hint {
    margin-top: 10px;
    color: rgba(255, 160, 80, 0.3);
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  #counter {
    position: fixed;
    top: 24px;
    right: 28px;
    color: rgba(255, 140, 60, 0.35);
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    z-index: 10;
  }
  #title {
    position: fixed;
    top: 24px;
    left: 28px;
    color: rgba(255, 140, 60, 0.15);
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    z-index: 10;
  }
</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="title">Ember Typography</div>
  <div id="counter"></div>
  <div id="ui">
    <input type="text" id="input" placeholder="type and watch it burn..." autofocus />
    <div id="hint">type to cast embers · mouse to scatter · click to burst</div>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const input = document.getElementById('input');
const counter = document.getElementById('counter');

let W, H, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// Mouse
let mouse = { x: W / 2, y: H / 2, active: false };
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => mouse.active = false);
canvas.addEventListener('click', e => {
  for (let i = 0; i < 40; i++) {
    embers.push(createEmber(e.clientX, e.clientY, true));
  }
});

// Ember class
class Ember {
  constructor(x, y, burst = false) {
    this.x = x;
    this.y = y;
    this.char = burst ? String.fromCharCode(33 + Math.floor(Math.random() * 90)) : '';
    this.life = 1.0;
    this.decay = 0.003 + Math.random() * 0.008;
    this.size = 1.5 + Math.random() * 3.5;
    this.vx = (Math.random() - 0.5) * (burst ? 6 : 1.5);
    this.vy = -(1 + Math.random() * 3) - (burst ? Math.random() * 4 : 0);
    this.wobbleAmp = 0.3 + Math.random() * 1.2;
    this.wobbleFreq = 0.02 + Math.random() * 0.04;
    this.wobbleOffset = Math.random() * Math.PI * 2;
    this.hue = 15 + Math.random() * 35; // warm amber-orange range
    this.saturation = 90 + Math.random() * 10;
    this.lightness = 45 + Math.random() * 35;
    this.glow = 8 + Math.random() * 20;
    this.turbulence = 0.02 + Math.random() * 0.04;
    this.age = 0;
  }

  update() {
    this.age++;
    this.life -= this.decay;

    // Turbulence
    const tx = Math.sin(this.age * this.turbulence + this.wobbleOffset) * this.turbulence * 50;
    const ty = Math.cos(this.age * this.turbulence * 1.3) * this.turbulence * 30;

    this.vx += tx * 0.1 + (Math.random() - 0.5) * 0.15;
    this.vy += ty * 0.05 - 0.015; // slight upward bias

    // Mouse repulsion
    if (mouse.active) {
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const radius = 120;
      if (dist < radius && dist > 0) {
        const force = (1 - dist / radius) * 3;
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }
    }

    // Damping
    this.vx *= 0.985;
    this.vy *= 0.985;

    this.x += this.vx + Math.sin(this.age * this.wobbleFreq + this.wobbleOffset) * this.wobbleAmp;
    this.y += this.vy;

    return this.life > 0;
  }

  draw() {
    const alpha = Math.pow(this.life, 0.5);
    const glowAlpha = alpha * 0.3;
    const currentHue = this.hue + (1 - this.life) * 20; // shift toward red as it dies

    // Glow
    const glowGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.glow * this.life);
    glowGrad.addColorStop(0, `hsla(${currentHue}, ${this.saturation}%, ${this.lightness}%, ${glowAlpha})`);
    glowGrad.addColorStop(1, `hsla(${currentHue}, ${this.saturation}%, ${this.lightness}%, 0)`);
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.glow * this.life, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = `hsla(${currentHue}, ${this.saturation}%, ${this.lightness}%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fill();

    // White hot center
    if (this.life > 0.7) {
      const coreAlpha = (this.life - 0.7) / 0.3;
      ctx.fillStyle = `hsla(40, 100%, 90%, ${coreAlpha * 0.8})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * this.life * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

let embers = [];

function createEmber(x, y, burst = false) {
  const e = new Ember(
    x + (Math.random() - 0.5) * 20,
    y + (Math.random() - 0.5) * 10,
    burst
  );
  if (!burst) {
    e.char = '';
  }
  return e;
}

// Input handling
input.addEventListener('input', e => {
  const val = input.value;
  if (!val) return;
  const lastChar = val[val.length - 1];
  const rect = input.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  // Spawn a burst of embers from the input position
  const count = 6 + Math.floor(Math.random() * 8);
  for (let i = 0; i < count; i++) {
    embers.push(createEmber(cx, cy, false));
  }

  // Limit total embers for performance
  if (embers.length > 2000) {
    embers = embers.slice(-1500);
  }
});

// Floating background embers (ambient)
let ambientTimer = 0;
function spawnAmbient() {
  const edge = Math.floor(Math.random() * 4);
  let x, y;
  switch (edge) {
    case 0: x = Math.random() * W; y = H + 10; break;
    case 1: x = Math.random() * W; y = -10; break;
    case 2: x = -10; y = Math.random() * H; break;
    case 3: x = W + 10; y = Math.random() * H; break;
  }
  const e = new Ember(x, y, false);
  e.vx = (Math.random() - 0.5) * 2;
  e.vy = -(0.5 + Math.random() * 2);
  e.decay = 0.001 + Math.random() * 0.004;
  e.size = 0.8 + Math.random() * 2;
  e.glow = 6 + Math.random() * 12;
  e.hue = 15 + Math.random() * 30;
  embers.push(e);
}

// Ambient sparks in background
const bgSparks = [];
for (let i = 0; i < 80; i++) {
  bgSparks.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: Math.random() * 1.5,
    alpha: Math.random() * 0.3,
    pulse: Math.random() * Math.PI * 2,
    pulseSpeed: 0.01 + Math.random() * 0.03
  });
}

// Animation loop
let frame = 0;
function animate() {
  requestAnimationFrame(animate);
  frame++;

  // Fade trail
  ctx.fillStyle = 'rgba(5, 3, 10, 0.12)';
  ctx.fillRect(0, 0, W, H);

  // Background sparks
  for (const s of bgSparks) {
    s.pulse += s.pulseSpeed;
    const a = s.alpha * (0.5 + 0.5 * Math.sin(s.pulse));
    ctx.fillStyle = `rgba(255, 150, 60, ${a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // Ambient spawn
  ambientTimer++;
  if (ambientTimer > 15) {
    spawnAmbient();
    ambientTimer = 0;
  }

  // Update and draw embers
  embers = embers.filter(e => e.update());
  // Sort by life for depth
  embers.sort((a, b) => a.life - b.life);
  for (const e of embers) {
    e.draw();
  }

  // Mouse glow
  if (mouse.active) {
    const grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 80);
    grad.addColorStop(0, 'rgba(255, 120, 30, 0.06)');
    grad.addColorStop(1, 'rgba(255, 80, 10, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 80, 0, Math.PI * 2);
    ctx.fill();
  }

  // Counter
  counter.textContent = `embers: ${embers.length}`;
}

animate();
</script>
</body>
</html>
