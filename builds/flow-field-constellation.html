<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Flow Field</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; }
  #overlay {
    position: fixed;
    top: 24px; left: 24px;
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    letter-spacing: 0.5px;
    pointer-events: none;
    z-index: 10;
    text-shadow: 0 0 10px rgba(0,0,0,0.8);
  }
  #overlay h1 {
    font-size: 18px;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #7eb8ff, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  #overlay p { opacity: 0.5; font-size: 11px; }
  #controls {
    position: fixed;
    bottom: 24px; right: 24px;
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  #controls button {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.7);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    font-family: 'Courier New', monospace;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
  }
  #controls button:hover {
    background: rgba(255,255,255,0.15);
    color: white;
    border-color: rgba(255,255,255,0.3);
  }
  #stats {
    position: fixed;
    bottom: 24px; left: 24px;
    color: rgba(255,255,255,0.3);
    font-size: 11px;
    z-index: 10;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="overlay">
  <h1>✦ Aether Flow Field</h1>
  <p>Move your mouse to shape the flow</p>
  <p>Click to burst particles</p>
</div>
<div id="stats"></div>
<div id="controls">
  <button onclick="togglePalette()">◐ Palette</button>
  <button onclick="resetField()">↻ Reset</button>
  <button onclick="toggleTrails()">≡ Trails</button>
</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Simplex-like noise approximation
class Noise {
  constructor() {
    this.perm = new Uint8Array(512);
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [p[i], p[j]] = [p[j], p[i]];
    }
    for (let i = 0; i < 512; i++) this.perm[i] = p[i & 255];
  }
  fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  lerp(a, b, t) { return a + t * (b - a); }
  grad(hash, x, y, z) {
    const h = hash & 15;
    const u = h < 8 ? x : y;
    const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  }
  noise3(x, y, z) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = this.fade(x), v = this.fade(y), w = this.fade(z);
    const p = this.perm;
    const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z;
    const B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
    return this.lerp(
      this.lerp(this.lerp(this.grad(p[AA], x, y, z), this.grad(p[BA], x-1, y, z), u),
                this.lerp(this.grad(p[AB], x, y-1, z), this.grad(p[BB], x-1, y-1, z), u), v),
      this.lerp(this.lerp(this.grad(p[AA+1], x, y, z-1), this.grad(p[BA+1], x-1, y, z-1), u),
                this.lerp(this.grad(p[AB+1], x, y-1, z-1), this.grad(p[BB+1], x-1, y-1, z-1), u), v), w);
  }
}

const noise = new Noise();

// Palettes
const palettes = [
  { name: 'Aurora',  colors: ['#7eb8ff','#c084fc','#f472b6','#38bdf8','#a78bfa'] },
  { name: 'Ember',   colors: ['#ff6b35','#f7931e','#ffcc02','#ff4444','#ff8a5c'] },
  { name: 'Ocean',   colors: ['#0ea5e9','#06b6d4','#10b981','#3b82f6','#6366f1'] },
  { name: 'Monochrome', colors: ['#ffffff','#aaaaaa','#666666','#cccccc','#888888'] },
  { name: 'Neon',    colors: ['#ff00ff','#00ffff','#ff0080','#80ff00','#ffff00'] },
];
let paletteIdx = 0;

let particles = [];
const PARTICLE_COUNT = 2000;
const NOISE_SCALE = 0.003;
const TIME_SPEED = 0.0003;

let mouse = { x: W / 2, y: H / 2, active: false, radius: 200 };
let time = 0;
let trails = true;
let burstParticles = [];

class Particle {
  constructor(x, y, burst = false) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.prevX = this.x;
    this.prevY = this.y;
    this.speed = burst ? Math.random() * 3 + 2 : Math.random() * 1.5 + 0.5;
    this.life = burst ? 60 + Math.random() * 60 : Infinity;
    this.age = 0;
    this.burst = burst;
    const pal = palettes[paletteIdx].colors;
    this.color = pal[Math.floor(Math.random() * pal.length)];
    this.size = Math.random() * 1.5 + 0.5;
  }
  update() {
    this.prevX = this.x;
    this.prevY = this.y;

    // Base flow from noise
    const n = noise.noise3(this.x * NOISE_SCALE, this.y * NOISE_SCALE, time);
    let angle = n * Math.PI * 4;

    // Mouse influence
    if (mouse.active) {
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < mouse.radius) {
        const force = (1 - dist / mouse.radius);
        const mouseAngle = Math.atan2(dy, dx) + Math.PI * 0.5;
        angle += (mouseAngle - angle) * force * 0.8;
        this.speed += force * 2;
      }
    }

    this.x += Math.cos(angle) * this.speed;
    this.y += Math.sin(angle) * this.speed;
    this.speed *= 0.99;

    // Burst particles age out
    if (this.burst) {
      this.age++;
      this.life--;
      if (this.life < 20) this.size *= 0.95;
    }

    // Wrap around
    if (this.x < 0) this.x = W;
    if (this.x > W) this.x = 0;
    if (this.y < 0) this.y = H;
    if (this.y > H) this.y = 0;

    // Reset if burst particle died
    if (this.burst && this.life <= 0) {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.prevX = this.x;
      this.prevY = this.y;
      this.life = Infinity;
      this.burst = false;
      this.size = Math.random() * 1.5 + 0.5;
    }
  }
  draw() {
    let alpha = this.burst ? Math.min(1, this.life / 60) : 0.6;
    if (this.burst && this.life < 20) alpha *= this.life / 20;
    
    ctx.beginPath();
    ctx.moveTo(this.prevX, this.prevY);
    ctx.lineTo(this.x, this.y);
    ctx.strokeStyle = this.color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = this.size;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

// Initialize particles
for (let i = 0; i < PARTICLE_COUNT; i++) {
  particles.push(new Particle());
}

// Mouse events
canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => { mouse.active = false; });
canvas.addEventListener('click', (e) => {
  for (let i = 0; i < 200; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 2;
    const p = new Particle(e.clientX + Math.cos(angle) * 10, e.clientY + Math.sin(angle) * 10, true);
    p.vx = Math.cos(angle) * speed;
    p.vy = Math.sin(angle) * speed;
    burstParticles.push(p);
  }
});
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
}, { passive: false });
canvas.addEventListener('touchstart', (e) => {
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
});

// Controls
function togglePalette() {
  paletteIdx = (paletteIdx + 1) % palettes.length;
  // Update existing particles
  const pal = palettes[paletteIdx].colors;
  particles.forEach(p => {
    p.color = pal[Math.floor(Math.random() * pal.length)];
  });
  document.getElementById('overlay').querySelector('h1').textContent = 
    '✦ ' + palettes[paletteIdx].name + ' Flow';
}

function resetField() {
  particles.forEach(p => {
    p.x = Math.random() * W;
    p.y = Math.random() * H;
    p.prevX = p.x;
    p.prevY = p.y;
    p.speed = Math.random() * 1.5 + 0.5;
  });
  time = Math.random() * 1000;
}

function toggleTrails() {
  trails = !trails;
}

// Animation loop
let lastFrame = performance.now();
let fps = 60;

function animate(now) {
  const dt = now - lastFrame;
  lastFrame = now;
  fps = fps * 0.95 + (1000 / Math.max(dt, 1)) * 0.05;

  if (trails) {
    ctx.fillStyle = 'rgba(10, 10, 15, 0.04)';
    ctx.fillRect(0, 0, W, H);
  } else {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);
  }

  time += TIME_SPEED * dt;

  // Update and draw particles
  particles.forEach(p => {
    p.update();
    p.draw();
  });

  // Update and draw burst particles
  burstParticles = burstParticles.filter(p => p.life > 0);
  burstParticles.forEach(p => {
    p.x += (p.vx || 0) * 0.95;
    p.y += (p.vy || 0) * 0.95;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.update();
    p.draw();
  });

  document.getElementById('stats').textContent = 
    `${palettes[paletteIdx].name} · ${PARTICLE_COUNT + burstParticles.length} particles · ${Math.round(fps)} fps`;

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
