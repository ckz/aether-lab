<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Flow Fields</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #888;
  }
  canvas {
    display: block;
    cursor: crosshair;
  }
  #info {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    font-size: 12px;
    line-height: 1.8;
    background: rgba(10, 10, 15, 0.85);
    padding: 14px 18px;
    border: 1px solid #1a1a2e;
    border-radius: 6px;
    backdrop-filter: blur(10px);
    max-width: 260px;
  }
  #info h2 {
    color: #7eb8ff;
    font-size: 14px;
    margin-bottom: 8px;
    font-weight: normal;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #info .stat { color: #aaa; }
  #info .val { color: #e0e0e0; }
  #info .hint { color: #555; font-style: italic; margin-top: 6px; }
  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  #controls button {
    background: rgba(30, 30, 50, 0.9);
    color: #7eb8ff;
    border: 1px solid #2a2a4e;
    padding: 8px 16px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  #controls button:hover {
    background: rgba(50, 50, 90, 0.9);
    border-color: #7eb8ff;
  }
  #controls button.active {
    background: rgba(60, 80, 140, 0.9);
    border-color: #7eb8ff;
    color: #fff;
  }
  #title-overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 5;
    pointer-events: none;
    transition: opacity 2s;
  }
  #title-overlay h1 {
    font-size: 48px;
    color: rgba(126, 184, 255, 0.15);
    font-weight: 100;
    letter-spacing: 12px;
    text-transform: uppercase;
  }
  #title-overlay p {
    color: rgba(126, 184, 255, 0.1);
    font-size: 14px;
    letter-spacing: 4px;
    margin-top: 8px;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="title-overlay">
  <h1>Flow</h1>
  <p>generative vector field art</p>
</div>

<div id="info">
  <h2>Flow Field</h2>
  <div class="stat">particles: <span class="val" id="pcount">0</span></div>
  <div class="stat">fps: <span class="val" id="fps">0</span></div>
  <div class="stat">seed: <span class="val" id="seed">0</span></div>
  <div class="hint">click to attract &middot; shift+click to repel</div>
</div>

<div id="controls">
  <button onclick="setMode('flow')" class="active" id="btn-flow">Flow Field</button>
  <button onclick="setMode('orbit')" id="btn-orbit">Orbit</button>
  <button onclick="setMode('noise')" id="btn-noise">Noise</button>
  <button onclick="reset()">Reset</button>
  <button onclick="saveFrame()">Save</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
let particles = [];
let mode = 'flow';
let seed = Math.floor(Math.random() * 999999);
let mouse = { x: -1000, y: -1000, active: false, repel: false };
let frameCount = 0;
let lastFpsTime = performance.now();
let fps = 0;
let flowField = [];
const CELL = 20;
let cols, rows;
const MAX_PARTICLES = 3000;

// Simplex-like noise
class NoiseGen {
  constructor(s) {
    this.seed = s;
    this.perm = new Uint8Array(512);
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    // Fisher-Yates with seed
    let r = s;
    for (let i = 255; i > 0; i--) {
      r = (r * 16807 + 0) % 2147483647;
      const j = r % (i + 1);
      [p[i], p[j]] = [p[j], p[i]];
    }
    for (let i = 0; i < 512; i++) this.perm[i] = p[i & 255];
  }
  fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  lerp(a, b, t) { return a + t * (b - a); }
  grad(hash, x, y) {
    const h = hash & 3;
    const u = h < 2 ? x : y;
    const v = h < 2 ? y : x;
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  }
  noise2D(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const u = this.fade(x), v = this.fade(y);
    const A = this.perm[X] + Y, B = this.perm[X + 1] + Y;
    return this.lerp(
      this.lerp(this.grad(this.perm[A], x, y), this.grad(this.perm[B], x - 1, y), u),
      this.lerp(this.grad(this.perm[A + 1], x, y - 1), this.grad(this.perm[B + 1], x - 1, y - 1), u),
      v
    );
  }
}

let noise = new NoiseGen(seed);

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cols = Math.ceil(W / CELL);
  rows = Math.ceil(H / CELL);
  buildField();
}

function buildField() {
  flowField = new Array(cols * rows);
  const scale = 0.005;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const angle = noise.noise2D(x * CELL * scale, y * CELL * scale) * Math.PI * 4;
      flowField[y * cols + x] = angle;
    }
  }
}

function flowAngle(x, y, t) {
  if (mode === 'flow') {
    const cx = x / W - 0.5, cy = y / H - 0.5;
    const base = flowField[Math.floor(y / CELL) * cols + Math.floor(x / CELL)] || 0;
    return base + Math.sin(t * 0.0003 + cx * 3) * 0.5 + Math.cos(t * 0.0002 + cy * 3) * 0.5;
  } else if (mode === 'orbit') {
    const dx = x - W / 2, dy = y - H / 2;
    const dist = Math.sqrt(dx * dx + dy * dy);
    return Math.atan2(dy, dx) + Math.PI / 2 + Math.sin(dist * 0.008 - t * 0.001) * 1.5;
  } else {
    const s = 0.003;
    return noise.noise2D(x * s + t * 0.0001, y * s + t * 0.00008) * Math.PI * 6;
  }
}

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.prevX = this.x;
    this.prevY = this.y;
    this.life = Math.random() * 200 + 100;
    this.maxLife = this.life;
    this.speed = Math.random() * 1.5 + 0.5;
    this.hue = Math.random();
  }
  update(t) {
    this.prevX = this.x;
    this.prevY = this.y;
    let angle = flowAngle(this.x, this.y, t);

    // Mouse interaction
    if (mouse.active) {
      const dx = mouse.x - this.x, dy = mouse.y - this.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 200) {
        const force = (1 - d / 200) * 2;
        angle += (mouse.repel ? -1 : 1) * force;
      }
    }

    this.x += Math.cos(angle) * this.speed;
    this.y += Math.sin(angle) * this.speed;
    this.life--;

    if (this.life <= 0 || this.x < -10 || this.x > W + 10 || this.y < -10 || this.y > H + 10) {
      this.reset();
    }
  }
  draw() {
    const alpha = (this.life / this.maxLife) * 0.5;
    const hue = (this.hue * 60 + 200 + frameCount * 0.1) % 360;
    ctx.strokeStyle = `hsla(${hue}, 70%, 65%, ${alpha})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(this.prevX, this.prevY);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();
  }
}

function init() {
  resize();
  // Semi-transparent fill for trail effect
  ctx.fillStyle = 'rgba(10, 10, 15, 0.08)';
  ctx.fillRect(0, 0, W, H);

  particles = [];
  for (let i = 0; i < MAX_PARTICLES; i++) {
    particles.push(new Particle());
  }
  document.getElementById('seed').textContent = seed;
}

function reset() {
  seed = Math.floor(Math.random() * 999999);
  noise = new NoiseGen(seed);
  buildField();
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);
  particles.forEach(p => p.reset());
  document.getElementById('seed').textContent = seed;
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + m).classList.add('active');
  // Brief flash
  ctx.fillStyle = 'rgba(10, 10, 15, 0.3)';
  ctx.fillRect(0, 0, W, H);
}

function saveFrame() {
  const link = document.createElement('a');
  link.download = `flow-${seed}-${Date.now()}.png`;
  link.href = canvas.toDataURL();
  link.click();
}

// Mouse
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
});
canvas.addEventListener('mousedown', e => {
  mouse.active = true;
  mouse.repel = e.shiftKey;
});
canvas.addEventListener('mouseup', () => { mouse.active = false; });
canvas.addEventListener('mouseleave', () => { mouse.active = false; });

window.addEventListener('resize', () => {
  // Don't fully reset on resize, just update bounds
  const oldW = W, oldH = H;
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cols = Math.ceil(W / CELL);
  rows = Math.ceil(H / CELL);
  buildField();
});

// Fade title
setTimeout(() => {
  document.getElementById('title-overlay').style.opacity = '0';
}, 4000);

function animate(t) {
  // Slow fade for trails
  ctx.fillStyle = 'rgba(10, 10, 15, 0.03)';
  ctx.fillRect(0, 0, W, H);

  for (const p of particles) {
    p.update(t);
    p.draw();
  }

  frameCount++;
  if (t - lastFpsTime >= 1000) {
    fps = Math.round(frameCount * 1000 / (t - lastFpsTime));
    frameCount = 0;
    lastFpsTime = t;
    document.getElementById('fps').textContent = fps;
  }
  document.getElementById('pcount').textContent = particles.length;

  requestAnimationFrame(animate);
}

init();
requestAnimationFrame(animate);
</script>
</body>
</html>
