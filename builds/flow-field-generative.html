<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Field — Aether Generative</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #a8b8c8;
    height: 100%;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
  }
  .overlay {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 10;
    background: rgba(10, 10, 20, 0.7);
    padding: 12px 16px;
    border-radius: 6px;
    border: 1px solid rgba(100, 140, 180, 0.2);
    font-size: 12px;
    line-height: 1.6;
    pointer-events: none;
    backdrop-filter: blur(6px);
  }
  .overlay strong {
    color: #7ec8e3;
  }
  .controls {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 320px;
  }
  .controls button {
    background: rgba(10, 10, 20, 0.7);
    border: 1px solid rgba(100, 140, 180, 0.3);
    color: #a8b8c8;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    backdrop-filter: blur(6px);
    transition: all 0.2s;
  }
  .controls button:hover {
    border-color: #7ec8e3;
    color: #7ec8e3;
  }
  .palette-indicator {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    display: flex;
    gap: 6px;
  }
  .palette-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    transition: transform 0.3s;
  }
  .palette-dot:hover {
    transform: scale(1.3);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="palette-indicator" id="paletteIndicator"></div>

<div class="controls">
  <button onclick="resetField()">Reset Field</button>
  <button onclick="togglePalette()">Cycle Palette</button>
  <button onclick="toggleMode()">Toggle Mode</button>
  <button onclick="clearTrails()">Clear Trails</button>
  <button onclick="toggleFlow()">Pause Flow</button>
</div>

<div class="overlay">
  <strong>Flow Field</strong> — Aether Generative<br>
  Move mouse to disturb the field<br>
  Click to inject turbulence<br>
  Particles: <span id="pcount">0</span><br>
  Palette: <span id="palName">-</span>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let particles = [];
let mouse = { x: -9999, y: -9999, active: false };
let flowing = true;
let mode = 0; // 0 = flow, 1 = orbit, 2 = vortex
let paletteIndex = 0;

const palettes = [
  {
    name: 'Aurora',
    colors: ['#7ec8e3', '#a8e6cf', '#dcedc1', '#ffd3b6', '#ffaaa5'],
    bg: '#0a0a0f'
  },
  {
    name: 'Ember',
    colors: ['#ff6b6b', '#ffa07a', '#ffd93d', '#ff8c42', '#ff5252'],
    bg: '#120808'
  },
  {
    name: 'Neon',
    colors: ['#00f5ff', '#ff00ff', '#ffff00', '#00ff88', '#ff4444'],
    bg: '#050510'
  },
  {
    name: 'Forest',
    colors: ['#2d5a27', '#5a8a4a', '#8fb339', '#c4d6a6', '#e8f0d8'],
    bg: '#0a0f08'
  },
  {
    name: 'Monochrome',
    colors: ['#ffffff', '#c0c0c0', '#808080', '#404040', '#a0a0a0'],
    bg: '#000000'
  }
];

let currentPalette = palettes[0];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  ctx.fillStyle = currentPalette.bg;
  ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);
resize();

// Simplex-like noise approximation
function noise(x, y, t) {
  const s = Math.sin(x * 0.01 + t) * Math.cos(y * 0.013 - t * 0.7) +
            Math.sin((x + y) * 0.007 + t * 1.3) * 0.5 +
            Math.cos(x * 0.023 - y * 0.019 + t * 0.4) * 0.3;
  return s;
}

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = 0;
    this.vy = 0;
    this.life = 0;
    this.maxLife = 200 + Math.random() * 400;
    this.color = currentPalette.colors[Math.floor(Math.random() * currentPalette.colors.length)];
    this.size = 0.5 + Math.random() * 2;
    this.history = [];
  }
  update(t) {
    const scale = 0.003;
    let angle;

    if (mode === 0) {
      angle = noise(this.x, this.y, t) * Math.PI * 4;
    } else if (mode === 1) {
      const cx = W / 2, cy = H / 2;
      const dx = this.x - cx, dy = this.y - cy;
      const dist = Math.sqrt(dx * dx + dy * dy) + 0.001;
      angle = Math.atan2(dy, dx) + Math.PI / 2 + noise(this.x * 0.5, this.y * 0.5, t) * 1.5;
    } else {
      const cx = W / 2, cy = H / 2;
      const dx = this.x - cx, dy = this.y - cy;
      const dist = Math.sqrt(dx * dx + dy * dy) + 0.001;
      angle = Math.atan2(dy, dx) + noise(this.x * 0.008, this.y * 0.008, t) * 3;
    }

    const speed = 1.2;
    this.vx += Math.cos(angle) * speed * 0.3;
    this.vy += Math.sin(angle) * speed * 0.3;

    // Mouse disturbance
    if (mouse.active) {
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 0.001;
      if (dist < 200) {
        const force = (200 - dist) / 200;
        this.vx += (dx / dist) * force * 3;
        this.vy += (dy / dist) * force * 3;
      }
    }

    this.vx *= 0.92;
    this.vy *= 0.92;
    this.x += this.vx;
    this.y += this.vy;
    this.life++;

    this.history.push({ x: this.x, y: this.y });
    if (this.history.length > 8) this.history.shift();

    // Wrap or reset
    if (this.x < -20 || this.x > W + 20 || this.y < -20 || this.y > H + 20 || this.life > this.maxLife) {
      this.reset();
    }
  }
  draw(ctx) {
    if (this.history.length < 2) return;
    const alpha = Math.min(1, this.life / 30) * Math.min(1, (this.maxLife - this.life) / 50);
    ctx.strokeStyle = this.color;
    ctx.globalAlpha = alpha * 0.5;
    ctx.lineWidth = this.size;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(this.history[0].x, this.history[0].y);
    for (let i = 1; i < this.history.length; i++) {
      ctx.lineTo(this.history[i].x, this.history[i].y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function initParticles(count) {
  particles = [];
  for (let i = 0; i < count; i++) {
    particles.push(new Particle());
  }
  document.getElementById('pcount').textContent = count;
}

initParticles(600);

let time = 0;
function animate() {
  if (flowing) {
    // Semi-transparent overlay for trail effect
    ctx.fillStyle = currentPalette.bg + '0e';
    ctx.globalAlpha = 0.08;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;

    time += 0.008;
    for (const p of particles) {
      p.update(time);
      p.draw(ctx);
    }
  }
  requestAnimationFrame(animate);
}
animate();

// Interaction
canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => { mouse.active = false; });
canvas.addEventListener('click', (e) => {
  // Inject burst
  for (let i = 0; i < 30; i++) {
    const p = new Particle();
    p.x = e.clientX + (Math.random() - 0.5) * 40;
    p.y = e.clientY + (Math.random() - 0.5) * 40;
    const angle = Math.random() * Math.PI * 2;
    p.vx = Math.cos(angle) * 4;
    p.vy = Math.sin(angle) * 4;
    particles.push(p);
  }
  // Trim if too many
  while (particles.length > 1200) particles.shift();
  document.getElementById('pcount').textContent = particles.length;
});

// Controls
function resetField() {
  ctx.fillStyle = currentPalette.bg;
  ctx.fillRect(0, 0, W, H);
  initParticles(600);
}
function togglePalette() {
  paletteIndex = (paletteIndex + 1) % palettes.length;
  currentPalette = palettes[paletteIndex];
  document.getElementById('palName').textContent = currentPalette.name;
  updatePaletteIndicator();
  // Re-color particles gradually
  for (const p of particles) {
    p.color = currentPalette.colors[Math.floor(Math.random() * currentPalette.colors.length)];
  }
}
function toggleMode() {
  mode = (mode + 1) % 3;
  const modes = ['Flow Field', 'Orbital', 'Vortex'];
  document.getElementById('palName').textContent = modes[mode];
}
function clearTrails() {
  ctx.fillStyle = currentPalette.bg;
  ctx.fillRect(0, 0, W, H);
}
function toggleFlow() {
  flowing = !flowing;
}
function updatePaletteIndicator() {
  const container = document.getElementById('paletteIndicator');
  container.innerHTML = '';
  for (const c of currentPalette.colors) {
    const dot = document.createElement('div');
    dot.className = 'palette-dot';
    dot.style.background = c;
    container.appendChild(dot);
  }
}
updatePaletteIndicator();
document.getElementById('palName').textContent = currentPalette.name;
</script>
</body>
</html>
