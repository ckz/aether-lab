<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Field — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #aaa;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
  }
  .controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 10;
    flex-wrap: wrap;
    justify-content: center;
  }
  .controls button {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #ccc;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    letter-spacing: 1px;
    transition: all 0.3s;
    font-family: inherit;
    text-transform: uppercase;
  }
  .controls button:hover {
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.3);
    color: #fff;
  }
  .info {
    position: fixed;
    top: 20px;
    left: 20px;
    font-size: 11px;
    letter-spacing: 1px;
    opacity: 0.5;
    z-index: 10;
    line-height: 1.8;
  }
  .palette-name {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 11px;
    letter-spacing: 1px;
    opacity: 0.5;
    z-index: 10;
    text-align: right;
    line-height: 1.8;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="info">
  FLOW FIELD<br>
  <span id="particle-count">0</span> PARTICLES<br>
  MOVE MOUSE TO DISTURB
</div>
<div class="palette-name" id="palette-name">PALETTE: AURORA</div>

<div class="controls">
  <button onclick="changePalette()">Palette</button>
  <button onclick="resetField()">Reset</button>
  <button onclick="togglePause()">Pause</button>
  <button onclick="saveFrame()">Save</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
let particles = [];
const PARTICLE_COUNT = 3000;
let mouse = { x: -1000, y: -1000, active: false };
let time = 0;
let paused = false;

// Simplex-like noise
function noise(x, y, z) {
  const X = Math.floor(x) & 255;
  const Y = Math.floor(y) & 255;
  const Z = Math.floor(z) & 255;
  x -= Math.floor(x);
  y -= Math.floor(y);
  z -= Math.floor(z);
  const u = x * x * (3 - 2 * x);
  const v = y * y * (3 - 2 * y);
  const w = z * z * (3 - 2 * z);
  const hash = (a, b, c) => {
    let h = (a * 374761393 + b * 668265263 + c * 1274126177) & 0x7fffffff;
    h = ((h >> 16) ^ h) * 0x45d9f3b;
    h = ((h >> 16) ^ h) * 0x45d9f3b;
    h = (h >> 16) ^ h;
    return (h & 0xffff) / 0xffff;
  };
  const n000 = hash(X, Y, Z);
  const n100 = hash(X+1, Y, Z);
  const n010 = hash(X, Y+1, Z);
  const n110 = hash(X+1, Y+1, Z);
  const n001 = hash(X, Y, Z+1);
  const n101 = hash(X+1, Y, Z+1);
  const n011 = hash(X, Y+1, Z+1);
  const n111 = hash(X+1, Y+1, Z+1);
  return lerp(
    lerp(lerp(n000, n100, u), lerp(n010, n110, u), v),
    lerp(lerp(n001, n101, u), lerp(n011, n111, u), v),
    w
  );
}

function lerp(a, b, t) { return a + (b - a) * t; }

// Color palettes
const palettes = [
  {
    name: 'AURORA',
    colors: (t) => {
      const colors = [
        [0, 255, 136], [0, 200, 255], [120, 0, 255],
        [0, 255, 200], [80, 200, 255], [180, 0, 255]
      ];
      const i = Math.floor(t * colors.length) % colors.length;
      const j = (i + 1) % colors.length;
      const f = (t * colors.length) % 1;
      return [
        lerp(colors[i][0], colors[j][0], f),
        lerp(colors[i][1], colors[j][1], f),
        lerp(colors[i][2], colors[j][2], f)
      ];
    }
  },
  {
    name: 'EMBER',
    colors: (t) => {
      const colors = [
        [255, 60, 0], [255, 160, 0], [255, 40, 60],
        [255, 200, 0], [255, 80, 0], [200, 255, 0]
      ];
      const i = Math.floor(t * colors.length) % colors.length;
      const j = (i + 1) % colors.length;
      const f = (t * colors.length) % 1;
      return [
        lerp(colors[i][0], colors[j][0], f),
        lerp(colors[i][1], colors[j][1], f),
        lerp(colors[i][2], colors[j][2], f)
      ];
    }
  },
  {
    name: 'OCEAN',
    colors: (t) => {
      const colors = [
        [0, 50, 120], [0, 150, 200], [0, 30, 80],
        [0, 200, 255], [10, 80, 160], [0, 255, 200]
      ];
      const i = Math.floor(t * colors.length) % colors.length;
      const j = (i + 1) % colors.length;
      const f = (t * colors.length) % 1;
      return [
        lerp(colors[i][0], colors[j][0], f),
        lerp(colors[i][1], colors[j][1], f),
        lerp(colors[i][2], colors[j][2], f)
      ];
    }
  },
  {
    name: 'NEON',
    colors: (t) => {
      const colors = [
        [255, 0, 255], [0, 255, 255], [255, 255, 0],
        [255, 0, 128], [0, 255, 128], [128, 0, 255]
      ];
      const i = Math.floor(t * colors.length) % colors.length;
      const j = (i + 1) % colors.length;
      const f = (t * colors.length) % 1;
      return [
        lerp(colors[i][0], colors[j][0], f),
        lerp(colors[i][1], colors[j][1], f),
        lerp(colors[i][2], colors[j][2], f)
      ];
    }
  },
  {
    name: 'FOREST',
    colors: (t) => {
      const colors = [
        [34, 120, 34], [80, 180, 40], [20, 80, 20],
        [140, 200, 50], [50, 100, 30], [100, 220, 80]
      ];
      const i = Math.floor(t * colors.length) % colors.length;
      const j = (i + 1) % colors.length;
      const f = (t * colors.length) % 1;
      return [
        lerp(colors[i][0], colors[j][0], f),
        lerp(colors[i][1], colors[j][1], f),
        lerp(colors[i][2], colors[j][2], f)
      ];
    }
  },
  {
    name: 'SUNSET',
    colors: (t) => {
      const colors = [
        [255, 100, 50], [200, 50, 100], [255, 150, 80],
        [150, 30, 80], [255, 180, 120], [180, 60, 60]
      ];
      const i = Math.floor(t * colors.length) % colors.length;
      const j = (i + 1) % colors.length;
      const f = (t * colors.length) % 1;
      return [
        lerp(colors[i][0], colors[j][0], f),
        lerp(colors[i][1], colors[j][1], f),
        lerp(colors[i][2], colors[j][2], f)
      ];
    }
  }
];

let currentPalette = 0;
let currentPaletteObj = palettes[0];

function getFlowAngle(x, y, z) {
  const scale = 0.003;
  const n = noise(x * scale, y * scale, z * 0.5);
  const n2 = noise(x * scale + 100, y * scale + 100, z * 0.5);
  return n * Math.PI * 4 + n2 * Math.PI * 2;
}

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.speed = 0.5 + Math.random() * 1.5;
    this.life = 0;
    this.maxLife = 200 + Math.random() * 300;
    this.hueOffset = Math.random();
  }
  update() {
    const angle = getFlowAngle(this.x, this.y, time);
    let dx = Math.cos(angle) * this.speed;
    let dy = Math.sin(angle) * this.speed;

    // Mouse interaction
    if (mouse.active) {
      const mx = this.x - mouse.x;
      const my = this.y - mouse.y;
      const dist = Math.sqrt(mx * mx + my * my);
      if (dist < 150) {
        const force = (150 - dist) / 150;
        const mouseAngle = Math.atan2(my, mx);
        dx += Math.cos(mouseAngle) * force * 4;
        dy += Math.sin(mouseAngle) * force * 4;
      }
    }

    this.x += dx;
    this.y += dy;
    this.life++;

    // Wrap around
    if (this.x < 0) this.x = W;
    if (this.x > W) this.x = 0;
    if (this.y < 0) this.y = H;
    if (this.y > H) this.y = 0;

    if (this.life > this.maxLife) this.reset();
  }
  draw() {
    const lifeFrac = this.life / this.maxLife;
    const alpha = Math.sin(lifeFrac * Math.PI) * 0.4;
    const t = (this.hueOffset + time * 0.05) % 1;
    const [r, g, b] = currentPaletteObj.colors(t);

    ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${alpha})`;
    ctx.fillRect(this.x, this.y, 1.5, 1.5);
  }
}

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function init() {
  resize();
  particles = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(new Particle());
  }
  document.getElementById('particle-count').textContent = PARTICLE_COUNT;
}

function changePalette() {
  currentPalette = (currentPalette + 1) % palettes.length;
  currentPaletteObj = palettes[currentPalette];
  document.getElementById('palette-name').textContent = 'PALETTE: ' + palettes[currentPalette].name;
}

function resetField() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);
  particles.forEach(p => p.reset());
}

function togglePause() {
  paused = !paused;
}

function saveFrame() {
  const link = document.createElement('a');
  link.download = 'flowfield-' + Date.now() + '.png';
  link.href = canvas.toDataURL();
  link.click();
}

// Trail effect - gradually fade
function animate() {
  if (!paused) {
    ctx.fillStyle = 'rgba(10, 10, 15, 0.03)';
    ctx.fillRect(0, 0, W, H);
    time += 0.005;

    particles.forEach(p => {
      p.update();
      p.draw();
    });
  }
  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
  resize();
});

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => {
  mouse.active = false;
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
}, { passive: false });

canvas.addEventListener('touchend', () => {
  mouse.active = false;
});

// Click to burst particles
canvas.addEventListener('click', (e) => {
  for (let i = 0; i < 50; i++) {
    const p = particles[Math.floor(Math.random() * particles.length)];
    p.x = e.clientX + (Math.random() - 0.5) * 100;
    p.y = e.clientY + (Math.random() - 0.5) * 100;
    p.life = 0;
  }
});

init();
animate();
</script>
</body>
</html>
