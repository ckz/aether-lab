<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Field — Generative Art by Aether</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #888;
  }
  canvas { display: block; }
  #controls {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: rgba(10, 10, 20, 0.85);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 12px;
    backdrop-filter: blur(8px);
    user-select: none;
  }
  #controls h2 {
    font-size: 13px;
    color: #c8a0ff;
    margin-bottom: 10px;
    letter-spacing: 1px;
    font-weight: normal;
  }
  #controls label {
    display: block;
    margin: 6px 0 2px;
    color: #999;
    font-size: 11px;
  }
  #controls input[type="range"] {
    width: 140px;
    accent-color: #c8a0ff;
  }
  #controls button {
    margin-top: 10px;
    background: rgba(200,160,255,0.12);
    border: 1px solid rgba(200,160,255,0.3);
    color: #c8a0ff;
    padding: 5px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
    transition: all 0.2s;
  }
  #controls button:hover {
    background: rgba(200,160,255,0.25);
  }
  #info {
    position: fixed;
    bottom: 16px;
    right: 16px;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    text-align: right;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="controls">
  <h2>◆ FLOW FIELD</h2>
  <label>Particles</label>
  <input type="range" id="particleCount" min="200" max="3000" value="1200">
  <label>Speed</label>
  <input type="range" id="speed" min="1" max="80" value="25">
  <label>Noise Scale</label>
  <input type="range" id="noiseScale" min="10" max="300" value="100">
  <label>Trail Fade</label>
  <input type="range" id="trailFade" min="1" max="30" value="5">
  <button onclick="resetField()">↻ New Seed</button>
  <button onclick="downloadArt()">↓ Save PNG</button>
</div>

<div id="info">
  <div id="fps">60 fps</div>
  <div id="stats">1200 particles</div>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); resetField(); });

// Simplex-like noise (hash-based)
function hash(x, y, seed) {
  let h = (x * 374761393 + y * 668265263 + seed * 1274126177) | 0;
  h = ((h ^ (h >> 13)) * 1274126177) | 0;
  return (h ^ (h >> 16)) / 4294967296 + 0.5;
}

function smoothNoise(x, y, seed) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx);
  const sy = fy * fy * (3 - 2 * fy);
  const n00 = hash(ix, iy, seed);
  const n10 = hash(ix+1, iy, seed);
  const n01 = hash(ix, iy+1, seed);
  const n11 = hash(ix+1, iy+1, seed);
  return (n00*(1-sx) + n10*sx) * (1-sy) + (n01*(1-sx) + n11*sx) * sy;
}

function fbm(x, y, seed) {
  let val = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < 4; i++) {
    val += amp * smoothNoise(x * freq, y * freq, seed + i * 100);
    amp *= 0.5;
    freq *= 2;
  }
  return val;
}

let particles = [];
let seed = Math.floor(Math.random() * 100000);
let hueBase = Math.random() * 360;
let mouseX = -1000, mouseY = -1000;
let frameCount = 0, lastTime = performance.now(), fpsVal = 60;

function getFlowAngle(x, y) {
  const scale = document.getElementById('noiseScale').value / 10000;
  const val = fbm(x * scale, y * scale, seed);
  return val * Math.PI * 4;
}

function createParticles() {
  const count = parseInt(document.getElementById('particleCount').value);
  particles = [];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      life: Math.random() * 200,
      maxLife: 150 + Math.random() * 250,
      hueOff: Math.random() * 60 - 30
    });
  }
  document.getElementById('stats').textContent = count + ' particles';
}

function resetField() {
  seed = Math.floor(Math.random() * 100000);
  hueBase = Math.random() * 360;
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);
  createParticles();
}

function downloadArt() {
  const link = document.createElement('a');
  link.download = `flowfield-${seed}-${Date.now()}.png`;
  link.href = canvas.toDataURL();
  link.click();
}

window.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
});
window.addEventListener('mouseleave', () => {
  mouseX = -1000; mouseY = -1000;
});

function animate() {
  const now = performance.now();
  frameCount++;
  if (now - lastTime >= 1000) {
    fpsVal = frameCount;
    frameCount = 0;
    lastTime = now;
    document.getElementById('fps').textContent = fpsVal + ' fps';
  }

  const fadeAlpha = document.getElementById('trailFade').value / 100;
  ctx.fillStyle = `rgba(10, 10, 18, ${fadeAlpha})`;
  ctx.fillRect(0, 0, W, H);

  const speed = document.getElementById('speed').value / 500;
  const count = particles.length;

  for (let i = 0; i < count; i++) {
    const p = particles[i];
    let angle = getFlowAngle(p.x, p.y);

    // Mouse repulsion
    const dx = p.x - mouseX, dy = p.y - mouseY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 150) {
      angle += (1 - dist/150) * Math.PI * 2;
    }

    const vx = Math.cos(angle) * speed;
    const vy = Math.sin(angle) * speed;
    p.x += vx;
    p.y += vy;
    p.life++;

    const lifeRatio = p.life / p.maxLife;
    const alpha = lifeRatio < 0.1 ? lifeRatio * 10 :
                  lifeRatio > 0.8 ? (1 - lifeRatio) * 5 : 1;
    const hue = (hueBase + p.hueOff + lifeRatio * 40) % 360;
    const lightness = 45 + lifeRatio * 25;
    const lineW = 0.5 + lifeRatio * 1.2;

    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - vx * 2, p.y - vy * 2);
    ctx.strokeStyle = `hsla(${hue}, 80%, ${lightness}%, ${alpha * 0.7})`;
    ctx.lineWidth = lineW;
    ctx.stroke();

    if (p.life > p.maxLife || p.x < -20 || p.x > W+20 || p.y < -20 || p.y > H+20) {
      p.x = Math.random() * W;
      p.y = Math.random() * H;
      p.life = 0;
      p.maxLife = 150 + Math.random() * 250;
    }
  }

  requestAnimationFrame(animate);
}

createParticles();
resetField();
animate();
</script>

</body>
</html>
