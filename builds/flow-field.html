<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Field — Aether Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #aaf;
    cursor: crosshair;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 10;
    pointer-events: none;
  }
  #controls {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    background: rgba(10,10,20,0.85);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 12px;
    line-height: 1.8;
    backdrop-filter: blur(8px);
    pointer-events: all;
    min-width: 200px;
  }
  #controls label { display: block; color: #888; }
  #controls input[type=range] { width: 100%; margin: 2px 0 8px; }
  #controls button {
    background: #1a1a2e;
    color: #aaf;
    border: 1px solid #334;
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    margin-top: 4px;
  }
  #controls button:hover { background: #2a2a4e; }
  #title {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    pointer-events: none;
  }
  #title h1 { font-size: 14px; font-weight: normal; color: #667; letter-spacing: 2px; }
  #title p { font-size: 10px; color: #445; margin-top: 4px; }
  .stat { color: #5a5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">
  <h1>FLOW FIELD</h1>
  <p>move mouse · click to burst · space to pause</p>
</div>
<div id="controls">
  <label>Particles: <span id="pCount">2000</span></label>
  <input type="range" id="particleSlider" min="200" max="6000" value="2000" step="100">
  <label>Speed: <span id="spd">1.0</span></label>
  <input type="range" id="speedSlider" min="1" max="30" value="10">
  <label>Trail: <span id="trl">0.03</span></label>
  <input type="range" id="trailSlider" min="1" max="20" value="3">
  <button id="resetBtn">↻ Reset Field</button>
  <button id="colorBtn">⇄ Shift Colors</button>
  <button id="clearBtn">✕ Clear</button>
  <div style="margin-top:8px;"><span class="stat" id="fps">60</span> fps</div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Simplex-like noise (hash-based)
function noise(x, y, t) {
  const n = Math.sin(x * 0.008 + t * 0.3) * Math.cos(y * 0.006 + t * 0.2)
           + Math.sin((x + y) * 0.005 + t * 0.15) * 0.5
           + Math.cos(x * 0.012 - y * 0.01 + t * 0.25) * 0.3;
  return n;
}

let particles = [];
let numParticles = 2000;
let speedMult = 1.0;
let trailAlpha = 0.03;
let time = 0;
let paused = false;
let colorShift = 0;
let mouse = { x: W/2, y: H/2, active: false };

class Particle {
  constructor(x, y, burst) {
    this.x = x !== undefined ? x : Math.random() * W;
    this.y = y !== undefined ? y : Math.random() * H;
    this.life = burst ? 80 + Math.random() * 120 : 200 + Math.random() * 400;
    this.age = 0;
    this.speed = 0.4 + Math.random() * 1.6;
    this.hueOff = Math.random() * 60;
    this.size = 0.5 + Math.random() * 1.5;
  }
  update() {
    const angle = noise(this.x, this.y, time) * Math.PI * 4;
    let sx = Math.cos(angle) * this.speed * speedMult;
    let sy = Math.sin(angle) * this.speed * speedMult;

    // Mouse influence
    if (mouse.active) {
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 180) {
        const force = (1 - dist / 180) * 3;
        sx += (dx / dist) * force;
        sy += (dy / dist) * force;
      }
    }

    this.x += sx;
    this.y += sy;
    this.age++;

    // Wrap
    if (this.x < 0) this.x += W;
    if (this.x > W) this.x -= W;
    if (this.y < 0) this.y += H;
    if (this.y > H) this.y -= H;

    return this.age < this.life;
  }
  draw() {
    const lifeRatio = 1 - this.age / this.life;
    const alpha = lifeRatio * 0.7;
    const hue = (noise(this.x * 0.01, this.y * 0.01, time * 0.5) * 180 + colorShift + this.hueOff) % 360;
    const lightness = 45 + lifeRatio * 25;
    ctx.fillStyle = `hsla(${hue}, 80%, ${lightness}%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * lifeRatio, 0, Math.PI * 2);
    ctx.fill();
  }
}

function initParticles() {
  particles = [];
  for (let i = 0; i < numParticles; i++) {
    particles.push(new Particle());
  }
}
initParticles();

function burst(x, y, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * 40;
    particles.push(new Particle(x + Math.cos(angle)*dist, y + Math.sin(angle)*dist, true));
  }
}

// Mouse
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => mouse.active = false);
canvas.addEventListener('click', e => burst(e.clientX, e.clientY, 60));

// Touch
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX;
  mouse.y = t.clientY;
  mouse.active = true;
}, { passive: false });
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  burst(t.clientX, t.clientY, 60);
});
canvas.addEventListener('touchend', () => mouse.active = false);

// Keyboard
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); paused = !paused; }
});

// Controls
const pSlider = document.getElementById('particleSlider');
const sSlider = document.getElementById('speedSlider');
const tSlider = document.getElementById('trailSlider');
pSlider.addEventListener('input', () => {
  numParticles = +pSlider.value;
  document.getElementById('pCount').textContent = numParticles;
  // Adjust
  while (particles.length < numParticles) particles.push(new Particle());
  if (particles.length > numParticles) particles.splice(numParticles);
});
sSlider.addEventListener('input', () => {
  speedMult = +sSlider.value / 10;
  document.getElementById('spd').textContent = speedMult.toFixed(1);
});
tSlider.addEventListener('input', () => {
  trailAlpha = +tSlider.value / 100;
  document.getElementById('trl').textContent = trailAlpha.toFixed(2);
});
document.getElementById('resetBtn').onclick = initParticles;
document.getElementById('colorBtn').onclick = () => { colorShift = (colorShift + 120) % 360; };
document.getElementById('clearBtn').onclick = () => {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);
};

// FPS
let lastTime = performance.now();
let frameCount = 0;
let fpsDisplay = 60;

function animate() {
  requestAnimationFrame(animate);

  // FPS
  frameCount++;
  const now = performance.now();
  if (now - lastTime >= 500) {
    fpsDisplay = Math.round(frameCount / ((now - lastTime) / 1000));
    document.getElementById('fps').textContent = fpsDisplay;
    frameCount = 0;
    lastTime = now;
  }

  if (paused) return;

  // Trail
  ctx.fillStyle = `rgba(10, 10, 15, ${trailAlpha})`;
  ctx.fillRect(0, 0, W, H);

  time += 0.008;

  particles = particles.filter(p => {
    if (p.update()) { p.draw(); return true; }
    return false;
  });

  // Replenish
  while (particles.length < numParticles) {
    particles.push(new Particle());
  }
}
animate();
</script>
</body>
</html>
