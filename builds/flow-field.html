<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Flow Field</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Courier New', monospace; }
  canvas { display: block; }
  .info {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.6); font-size: 12px; letter-spacing: 2px;
    text-transform: uppercase; pointer-events: none; z-index: 10;
  }
  .controls {
    position: fixed; top: 20px; right: 20px; z-index: 10;
    display: flex; flex-direction: column; gap: 8px;
  }
  .controls button {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 6px 14px; cursor: pointer; font-family: inherit;
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    transition: all 0.3s;
  }
  .controls button:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.4); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="info">Aether Flow Field — Click to attract · Move to repel</div>
<div class="controls">
  <button onclick="reset()">Reset</button>
  <button onclick="togglePause()">Pause</button>
  <button onclick="cyclePalette()">Palette</button>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
let particles = [];
let flowField = [];
let cols, rows;
const resolution = 18;
let time = 0;
let paused = false;
let mouse = { x: -1000, y: -1000, active: false, attract: true };
let paletteIndex = 0;

const palettes = [
  ['#ff6b6b','#ffa07a','#fff44f','#7dff7d','#7dcfff','#b57dff'],
  ['#ff006e','#fb5607','#ffbe0b','#00f5d4','#00bbf9','#9b5de5'],
  ['#f72585','#b5179e','#7209b7','#560bad','#480ca8','#3a0ca3'],
  ['#e0aaff','#c77dff','#9d4edd','#7b2cbf','#5a189a','#3c096c'],
  ['#00fff5','#00d4ff','#0096ff','#0066ff','#3d00ff','#aa00ff'],
  ['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c']
];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cols = Math.floor(W / resolution);
  rows = Math.floor(H / resolution);
  initField();
}

function initField() {
  flowField = new Array(cols * rows);
  for (let i = 0; i < cols * rows; i++) {
    flowField[i] = Math.random() * Math.PI * 2;
  }
}

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = 0; this.vy = 0;
    this.speed = 0.5 + Math.random() * 1.5;
    this.life = 0;
    this.maxLife = 120 + Math.random() * 200;
    this.color = palettes[paletteIndex][Math.floor(Math.random() * palettes[paletteIndex].length)];
    this.size = 0.6 + Math.random() * 1.4;
  }
  update() {
    const col = Math.floor(this.x / resolution);
    const row = Math.floor(this.y / resolution);
    const idx = (row * cols + col) % flowField.length;
    if (idx >= 0 && idx < flowField.length) {
      const angle = flowField[idx];
      this.vx += Math.cos(angle) * 0.15;
      this.vy += Math.sin(angle) * 0.15;
    }
    // mouse interaction
    if (mouse.active) {
      const dx = mouse.x - this.x, dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 180) {
        const force = (180 - dist) / 180 * 0.6;
        const a = Math.atan2(dy, dx) * (mouse.attract ? 1 : -1);
        this.vx += Math.cos(a) * force;
        this.vy += Math.sin(a) * force;
      }
    }
    this.vx *= 0.96; this.vy *= 0.96;
    this.x += this.vx * this.speed;
    this.y += this.vy * this.speed;
    this.life++;
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H || this.life > this.maxLife) this.reset();
  }
  draw() {
    const alpha = Math.min(1, (1 - this.life / this.maxLife) * 1.5);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = this.color + Math.floor(alpha * 200).toString(16).padStart(2, '0');
    ctx.fill();
  }
}

function init() {
  particles = [];
  const count = Math.min(2000, Math.floor((W * H) / 400));
  for (let i = 0; i < count; i++) particles.push(new Particle());
}

function animate() {
  if (!paused) {
    time += 0.004;
    for (let i = 0; i < cols * rows; i++) {
      const x = (i % cols) * resolution;
      const y = Math.floor(i / cols) * resolution;
      flowField[i] = (Math.sin(x * 0.008 + time) + Math.cos(y * 0.008 + time * 0.7) +
                      Math.sin((x + y) * 0.004 + time * 0.5)) * Math.PI;
    }
    ctx.fillStyle = 'rgba(10, 10, 15, 0.04)';
    ctx.fillRect(0, 0, W, H);
    for (const p of particles) { p.update(); p.draw(); }
  }
  requestAnimationFrame(animate);
}

function reset() { ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0, 0, W, H); init(); }
function togglePause() { paused = !paused; }
function cyclePalette() {
  paletteIndex = (paletteIndex + 1) % palettes.length;
  for (const p of particles) p.color = palettes[paletteIndex][Math.floor(Math.random() * palettes[paletteIndex].length)];
}
window.addEventListener('resize', () => { resize(); init(); });
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
canvas.addEventListener('mouseleave', () => { mouse.active = false; });
canvas.addEventListener('mousedown', e => { mouse.attract = true; mouse.active = true; mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mouseup', () => { mouse.active = false; });
canvas.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; mouse.attract = true; mouse.x = t.clientX; mouse.y = t.clientY; mouse.active = true; }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); const t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY; }, { passive: false });
canvas.addEventListener('touchend', () => { mouse.active = false; });

resize(); init();
ctx.fillStyle = '#0a0a0f';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
