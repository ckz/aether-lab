<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Flow Field</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }
#ui {
  position: fixed; top: 20px; left: 20px; color: #e0e0e0;
  font-size: 13px; z-index: 10; opacity: 0.8; pointer-events: none;
}
#controls {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; z-index: 10;
}
button {
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  color: #fff; padding: 8px 16px; border-radius: 20px; cursor: pointer;
  font-size: 12px; transition: all 0.3s; backdrop-filter: blur(10px);
}
button:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<div id="ui">
  <div>🐝 Aether Flow Field</div>
  <div>Particles: <span id="count">0</span></div>
  <div>FPS: <span id="fps">0</span></div>
</div>
<div id="controls">
  <button onclick="resetField()">Reset</button>
  <button onclick="togglePause()">Pause/Play</button>
  <button onclick="changeMode()">Mode</button>
  <button onclick="addBurst()">Burst</button>
</div>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
let particles = [];
let paused = false;
let mode = 0;
const modes = ['flow', 'attract', 'orbit', 'noise'];
let time = 0;
let frameCount = 0;
let lastFpsUpdate = performance.now();

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class Particle {
  constructor(x, y) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.vx = 0;
    this.vy = 0;
    this.life = Math.random() * 200 + 100;
    this.maxLife = this.life;
    this.size = Math.random() * 2 + 0.5;
    this.hue = Math.random() * 60 + 200; // blue to purple
  }
  update() {
    let fx, fy;
    switch(modes[mode]) {
      case 'flow':
        const angle = noise(this.x * 0.003, this.y * 0.003, time * 0.0005) * Math.PI * 4;
        fx = Math.cos(angle);
        fy = Math.sin(angle);
        break;
      case 'attract':
        const cx = W / 2, cy = H / 2;
        const dx = cx - this.x, dy = cy - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy) + 1;
        fx = dx / dist * 0.5 + Math.sin(time * 0.01 + this.y * 0.01) * 0.3;
        fy = dy / dist * 0.5 + Math.cos(time * 0.01 + this.x * 0.01) * 0.3;
        break;
      case 'orbit':
        const ox = W / 2, oy = H / 2;
        const odx = this.x - ox, ody = this.y - oy;
        const odist = Math.sqrt(odx * odx + ody * ody) + 1;
        fx = -ody / odist * 0.8 + odx / odist * 0.2;
        fy = odx / odist * 0.8 + ody / odist * 0.2;
        break;
      case 'noise':
        const n = noise(this.x * 0.005, this.y * 0.005, time * 0.0003);
        fx = Math.cos(n * Math.PI * 2) * 1.5;
        fy = Math.sin(n * Math.PI * 2) * 1.5;
        break;
    }
    this.vx = this.vx * 0.9 + fx * 0.1;
    this.vy = this.vy * 0.9 + fy * 0.1;
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H || this.life <= 0) {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.life = this.maxLife;
    }
  }
  draw() {
    const alpha = (this.life / this.maxLife) * 0.8;
    const hue = (this.hue + time * 0.05) % 360;
    ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function init() {
  particles = [];
  for (let i = 0; i < 2000; i++) {
    particles.push(new Particle());
  }
  document.getElementById('count').textContent = particles.length;
}

function resetField() {
  init();
}

function togglePause() {
  paused = !paused;
}

function changeMode() {
  mode = (mode + 1) % modes.length;
}

function addBurst() {
  for (let i = 0; i < 200; i++) {
    particles.push(new Particle(W / 2, H / 2));
  }
  document.getElementById('count').textContent = particles.length;
}

// Simple 3D noise implementation
function noise(x, y, z) {
  const X = Math.floor(x) & 255;
  const Y = Math.floor(y) & 255;
  const Z = Math.floor(z) & 255;
  x -= Math.floor(x);
  y -= Math.floor(y);
  z -= Math.floor(z);
  const u = fade(x);
  const v = fade(y);
  const w = fade(z);
  const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z;
  const B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
  return lerp(w, lerp(v, lerp(u, grad(p[AA], x, y, z), grad(p[BA], x - 1, y, z)),
    lerp(u, grad(p[AB], x, y - 1, z), grad(p[BB], x - 1, y - 1, z))),
    lerp(v, lerp(u, grad(p[AA + 1], x, y, z - 1), grad(p[BA + 1], x - 1, y, z - 1)),
    lerp(u, grad(p[AB + 1], x, y - 1, z - 1), grad(p[BB + 1], x - 1, y - 1, z - 1))));
}
function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
function lerp(t, a, b) { return a + t * (b - a); }
function grad(hash, x, y, z) {
  const h = hash & 15;
  const u = h < 8 ? x : y;
  const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
  return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
}
const p = new Array(512);
const permutation = [151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
for (let i = 0; i < 256; i++) p[i] = p[i + 256] = permutation[i];

function animate() {
  if (!paused) {
    ctx.fillStyle = 'rgba(10, 10, 15, 0.05)';
    ctx.fillRect(0, 0, W, H);
    particles.forEach(p => {
      p.update();
      p.draw();
    });
    time++;
    frameCount++;
    if (performance.now() - lastFpsUpdate > 1000) {
      document.getElementById('fps').textContent = frameCount;
      frameCount = 0;
      lastFpsUpdate = performance.now();
    }
  }
  requestAnimationFrame(animate);
}

init();
animate();
</script>
</body>
</html>
