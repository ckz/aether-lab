<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Flow — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; }
  #info {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
  #title {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.15);
    font-size: 14px;
    letter-spacing: 6px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="title">AETHER FLOW</div>
<canvas id="c"></canvas>
<div id="info">move mouse to influence · click to burst</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let particles = [];
let mouse = { x: -1000, y: -1000, active: false };
let time = 0;

const PALETTES = [
  ['#ff006e', '#fb5607', '#ffbe0b', '#8338ec', '#3a86ff'],
  ['#00f5d4', '#00bbf9', '#fee440', '#f15bb5', '#9b5de5'],
  ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93'],
  ['#f72585', '#7209b7', '#3a0ca3', '#4361ee', '#4cc9f0'],
];

let palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Particle {
  constructor(x, y, burst = false) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5;
    this.life = burst ? 200 : 500 + Math.random() * 500;
    this.maxLife = this.life;
    this.color = palette[Math.floor(Math.random() * palette.length)];
    this.size = Math.random() * 2 + 0.5;
    this.history = [];
    this.maxHistory = burst ? 20 : 8;
  }

  update() {
    this.history.push({ x: this.x, y: this.y });
    if (this.history.length > this.maxHistory) this.history.shift();

    const angle = this.flowAngle(this.x, this.y);
    const speed = 0.3;
    this.vx += Math.cos(angle) * speed * 0.1;
    this.vy += Math.sin(angle) * speed * 0.1;

    if (mouse.active) {
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 200) {
        const force = (200 - dist) / 200;
        this.vx += (dx / dist) * force * 0.5;
        this.vy += (dy / dist) * force * 0.5;
      }
    }

    this.vx *= 0.98;
    this.vy *= 0.98;
    this.x += this.vx;
    this.y += this.vy;
    this.life--;

    if (this.x < 0 || this.x > W) this.vx *= -1;
    if (this.y < 0 || this.y > H) this.vy *= -1;
  }

  flowAngle(x, y) {
    const scale = 0.003;
    const t = time * 0.0003;
    const angle = 
      Math.sin(x * scale + t) * Math.cos(y * scale * 0.5 + t * 0.7) * Math.PI * 2 +
      Math.cos((x + y) * scale * 0.3 + t * 0.5) * Math.PI;
    return angle;
  }

  draw() {
    const alpha = (this.life / this.maxLife) * 0.6;
    
    if (this.history.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.history[0].x, this.history[0].y);
      for (let i = 1; i < this.history.length; i++) {
        ctx.lineTo(this.history[i].x, this.history[i].y);
      }
      ctx.strokeStyle = this.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
      ctx.lineWidth = this.size * 0.5;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = this.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
    ctx.fill();
  }

  dead() {
    return this.life <= 0;
  }
}

for (let i = 0; i < 300; i++) {
  particles.push(new Particle());
}

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => {
  mouse.active = false;
});

canvas.addEventListener('click', (e) => {
  for (let i = 0; i < 100; i++) {
    const p = new Particle(e.clientX, e.clientY, true);
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5;
    p.vx = Math.cos(angle) * speed;
    p.vy = Math.sin(angle) * speed;
    particles.push(p);
  }
});

function animate() {
  ctx.fillStyle = 'rgba(10, 10, 15, 0.05)';
  ctx.fillRect(0, 0, W, H);

  time++;

  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].dead()) particles.splice(i, 1);
  }

  if (particles.length < 300 && Math.random() < 0.1) {
    particles.push(new Particle());
  }

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
