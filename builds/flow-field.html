<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Field — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; }
  #overlay {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
  #controls {
    position: fixed;
    top: 20px;
    right: 20px;
    color: rgba(255,255,255,0.4);
    font-size: 11px;
    letter-spacing: 1px;
    text-align: right;
    pointer-events: none;
    z-index: 10;
    line-height: 1.8;
  }
  #fade {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #0a0a0f;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    transition: opacity 2s ease;
  }
  #fade.active { opacity: 1; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="overlay">move your mouse to shape the flow</div>
<div id="controls">
  particles: <span id="pCount">0</span><br>
  mode: <span id="mode">attract</span>
</div>
<div id="fade"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fade = document.getElementById('fade');
let W, H, particles, cols, rows, scale = 20;
let mouse = { x: -9999, y: -9999, active: false };
let attractMode = true;
let time = 0;

// Color palettes
const palettes = [
  ['#00f5d4', '#00bbf9', '#9b5de5', '#f15bb5', '#fee440'],
  ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff'],
  ['#2ed573', '#1e90ff', '#ff6348', '#ffa502', '#7bed9f'],
  ['#e056fd', '#be2edd', '#ff7979', '#badc58', '#dff9fb'],
];

let palette = palettes[0];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cols = Math.ceil(W / scale) + 1;
  rows = Math.ceil(H / scale) + 1;
}

function initParticles() {
  const count = Math.min(Math.floor((W * H) / 800), 3000);
  particles = [];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: 0,
      vy: 0,
      color: palette[Math.floor(Math.random() * palette.length)],
      size: Math.random() * 1.5 + 0.5,
      life: Math.random() * 200 + 100,
      age: 0,
      speed: Math.random() * 0.5 + 0.3,
    });
  }
  document.getElementById('pCount').textContent = count;
}

function getFlowAngle(x, y) {
  // Simplex-like noise approximation
  const zoom = 0.008;
  const angle = (
    Math.sin(x * zoom + time * 0.3) * 2 +
    Math.cos(y * zoom * 0.7 + time * 0.2) * 2 +
    Math.sin((x + y) * zoom * 0.5 + time * 0.15) * 1.5 +
    Math.cos(Math.sqrt(x * x + y * y) * zoom * 0.3 - time * 0.1) * 1.5
  );

  // Mouse influence
  if (mouse.active) {
    const dx = mouse.x - x;
    const dy = mouse.y - y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const radius = 200;
    if (dist < radius) {
      const force = (1 - dist / radius) * 3;
      const mouseAngle = Math.atan2(dy, dx);
      if (attractMode) {
        return angle + force * Math.sin(mouseAngle - angle);
      } else {
        return angle + force * Math.sin(mouseAngle + Math.PI - angle);
      }
    }
  }
  return angle;
}

function update() {
  time += 0.005;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const angle = getFlowAngle(p.x, p.y);
    p.vx += Math.cos(angle) * 0.15 * p.speed;
    p.vy += Math.sin(angle) * 0.15 * p.speed;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.x += p.vx;
    p.y += p.vy;
    p.age++;

    // Respawn if dead or out of bounds
    if (p.age > p.life || p.x < -10 || p.x > W + 10 || p.y < -10 || p.y > H + 10) {
      p.x = Math.random() * W;
      p.y = Math.random() * H;
      p.vx = 0;
      p.vy = 0;
      p.age = 0;
      p.life = Math.random() * 200 + 100;
      p.color = palette[Math.floor(Math.random() * palette.length)];
    }
  }
}

function draw() {
  // Fade trail
  ctx.fillStyle = 'rgba(10, 10, 15, 0.03)';
  ctx.fillRect(0, 0, W, H);

  for (const p of particles) {
    const alpha = Math.sin((p.age / p.life) * Math.PI) * 0.8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
    ctx.fill();
  }
}

function animate() {
  update();
  draw();
  requestAnimationFrame(animate);
}

// Events
canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => {
  mouse.active = false;
});

canvas.addEventListener('click', () => {
  attractMode = !attractMode;
  document.getElementById('mode').textContent = attractMode ? 'attract' : 'repel';
  // Fade transition
  fade.classList.add('active');
  setTimeout(() => {
    palette = palettes[Math.floor(Math.random() * palettes.length)];
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);
    fade.classList.remove('active');
  }, 500);
});

window.addEventListener('resize', () => {
  resize();
  initParticles();
});

// Start
resize();
initParticles();
// Clear once
ctx.fillStyle = '#0a0a0f';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
