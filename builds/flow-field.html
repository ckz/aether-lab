<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Field — Aether Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #aaa;
  }
  canvas { display: block; }
  #info {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.5;
    pointer-events: none;
    text-align: center;
  }
  #info span { color: #7bfff0; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="info"><span>Aether Lab</span> — Flow Field &nbsp;|&nbsp; move mouse to attract</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let mouse = { x: W / 2, y: H / 2, active: false };
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
window.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true; });

const PARTICLE_COUNT = 1200;
const TRAIL_ALPHA = 0.025;
let particles = [];

function noise(x, y) {
  const s = Math.sin(x * 0.01 + y * 0.013) * Math.cos(y * 0.011 - x * 0.009);
  return s * Math.PI;
}

function initParticles() {
  particles = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: 0,
      vy: 0,
      hue: 160 + Math.random() * 60,
      life: Math.random() * 200,
      maxLife: 200 + Math.random() * 300,
      size: 0.5 + Math.random() * 1.5
    });
  }
}
initParticles();

function draw() {
  ctx.fillStyle = `rgba(10, 10, 15, ${TRAIL_ALPHA})`;
  ctx.fillRect(0, 0, W, H);

  for (let p of particles) {
    const angle = noise(p.x, p.y) * 2;
    p.vx += Math.cos(angle) * 0.4;
    p.vy += Math.sin(angle) * 0.4;

    if (mouse.active) {
      const dx = mouse.x - p.x;
      const dy = mouse.y - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 250) {
        const force = (250 - dist) / 250 * 0.6;
        p.vx += (dx / dist) * force;
        p.vy += (dy / dist) * force;
      }
    }

    p.vx *= 0.96;
    p.vy *= 0.96;
    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    if (speed > 3) { p.vx = (p.vx / speed) * 3; p.vy = (p.vy / speed) * 3; }

    p.x += p.vx;
    p.y += p.vy;
    p.life++;

    if (p.x < 0) p.x = W;
    if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H;
    if (p.y > H) p.y = 0;
    if (p.life > p.maxLife) {
      p.x = Math.random() * W;
      p.y = Math.random() * H;
      p.vx = 0; p.vy = 0;
      p.life = 0;
      p.maxLife = 200 + Math.random() * 300;
      p.hue = 160 + Math.random() * 60;
    }

    const alpha = Math.min(1, p.life / 30) * Math.min(1, (p.maxLife - p.life) / 30) * 0.7;
    const lightness = 50 + speed * 8;
    ctx.fillStyle = `hsla(${p.hue}, 80%, ${lightness}%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
