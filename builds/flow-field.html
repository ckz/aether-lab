<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Field — Aether Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #aaa;
  }
  canvas { display: block; }
  .info {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.4;
    pointer-events: none;
    text-align: center;
  }
  .title {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 6px;
    text-transform: uppercase;
    opacity: 0.3;
    pointer-events: none;
  }
  .controls {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
  }
  .controls button {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #888;
    padding: 6px 14px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }
  .controls button:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border-color: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
<div class="title">Flow Field — Generative</div>
<canvas id="canvas"></canvas>
<div class="info">move mouse to influence · click to burst</div>
<div class="controls">
  <button onclick="regenerate()">New Seed</button>
  <button onclick="toggleMode()">Mode</button>
  <button onclick="clearTrails()">Clear</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let seed = Math.random() * 10000;
let particles = [];
let mouse = { x: W/2, y: H/2, active: false };
let mode = 0;
const modes = ['flow', 'orbit', 'wave', 'galaxy'];
const modeNames = ['Flow', 'Orbit', 'Wave', 'Galaxy'];

// Seeded random
function seededRandom(s) {
  let x = Math.sin(s) * 10000;
  return x - Math.floor(x);
}

let currentSeed = seed;

function createParticles(count) {
  particles = [];
  for (let i = 0; i < count; i++) {
    particles.push(new Particle());
  }
}

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = 0;
    this.vy = 0;
    this.life = Math.random() * 200 + 100;
    this.maxLife = this.life;
    this.size = Math.random() * 1.5 + 0.5;
    this.hue = (seededRandom(currentSeed + this.x * 0.01 + this.y * 0.01) * 60 + 180) % 360;
  }
  update() {
    const angle = getFieldAngle(this.x, this.y);
    
    if (mode === 0) { // flow
      this.vx += Math.cos(angle) * 0.3;
      this.vy += Math.sin(angle) * 0.3;
    } else if (mode === 1) { // orbit
      const dx = this.x - W/2;
      const dy = this.y - H/2;
      const dist = Math.sqrt(dx*dx + dy*dy) + 0.1;
      this.vx += (-dy/dist * 0.5 + Math.cos(angle) * 0.2);
      this.vy += (dx/dist * 0.5 + Math.sin(angle) * 0.2);
    } else if (mode === 2) { // wave
      this.vx += Math.cos(angle) * 0.2;
      this.vy += Math.sin(this.x * 0.01 + this.y * 0.01) * 0.5;
    } else { // galaxy
      const dx = this.x - W/2;
      const dy = this.y - H/2;
      const dist = Math.sqrt(dx*dx + dy*dy) + 0.1;
      this.vx += (-dy/dist * 0.8) + Math.cos(angle) * 0.1;
      this.vy += (dx/dist * 0.8) + Math.sin(angle) * 0.1;
      this.vx *= 0.99;
      this.vy *= 0.99;
    }
    
    // Mouse influence
    if (mouse.active) {
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy) + 0.1;
      if (dist < 200) {
        const force = (200 - dist) / 200;
        this.vx += (dx/dist) * force * 2;
        this.vy += (dy/dist) * force * 2;
      }
    }
    
    this.vx *= 0.96;
    this.vy *= 0.96;
    
    const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
    const maxSpeed = 4;
    if (speed > maxSpeed) {
      this.vx = (this.vx/speed) * maxSpeed;
      this.vy = (this.vy/speed) * maxSpeed;
    }
    
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H || this.life <= 0) {
      this.reset();
    }
  }
  draw() {
    const alpha = (this.life / this.maxLife) * 0.8;
    const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
    const lightness = 50 + speed * 10;
    ctx.fillStyle = `hsla(${this.hue}, 80%, ${lightness}%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function getFieldAngle(x, y) {
  const scale = 0.003;
  const t = Date.now() * 0.0005;
  return (
    Math.sin(x * scale + t + currentSeed) * 
    Math.cos(y * scale + t * 0.7) * 
    Math.PI * 2
  );
}

function drawBackground() {
  ctx.fillStyle = 'rgba(10, 10, 15, 0.08)';
  ctx.fillRect(0, 0, W, H);
}

function animate() {
  drawBackground();
  particles.forEach(p => {
    p.update();
    p.draw();
  });
  requestAnimationFrame(animate);
}

canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => {
  mouse.active = false;
});

canvas.addEventListener('click', e => {
  for (let i = 0; i < 50; i++) {
    const p = new Particle();
    p.x = e.clientX + (Math.random() - 0.5) * 40;
    p.y = e.clientY + (Math.random() - 0.5) * 40;
    p.vx = (Math.random() - 0.5) * 8;
    p.vy = (Math.random() - 0.5) * 8;
    particles.push(p);
  }
  // Remove excess
  while (particles.length > 1500) particles.shift();
});

function regenerate() {
  currentSeed = Math.random() * 10000;
  ctx.fillStyle = 'rgba(10, 10, 15, 1)';
  ctx.fillRect(0, 0, W, H);
  createParticles(800);
}

function toggleMode() {
  mode = (mode + 1) % modes.length;
}

function clearTrails() {
  ctx.fillStyle = 'rgba(10, 10, 15, 1)';
  ctx.fillRect(0, 0, W, H);
}

createParticles(800);
ctx.fillStyle = 'rgba(10, 10, 15, 1)';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
