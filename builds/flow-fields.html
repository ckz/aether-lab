<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Fields — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; overflow: hidden; font-family: 'Courier New', monospace; }
  canvas { display: block; }
  #info {
    position: fixed; bottom: 20px; left: 20px;
    color: rgba(255,255,255,0.4); font-size: 12px; pointer-events: none;
  }
  #controls {
    position: fixed; top: 20px; right: 20px;
    display: flex; gap: 8px; z-index: 10;
  }
  .btn {
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.1); padding: 6px 14px;
    font-family: 'Courier New', monospace; font-size: 12px;
    cursor: pointer; border-radius: 4px; transition: all 0.3s;
  }
  .btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
  #title {
    position: fixed; top: 20px; left: 20px;
    color: rgba(255,255,255,0.3); font-size: 11px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="title">⟁ FLOW FIELDS ⟁</div>
<div id="controls">
  <button class="btn" onclick="resetField()">RESET</button>
  <button class="btn" onclick="toggleMode()">MODE</button>
  <button class="btn" onclick="saveCanvas()">SAVE</button>
</div>
<canvas id="c"></canvas>
<div id="info">move mouse to attract particles · click to burst</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, particles = [], mouse = { x: -9999, y: -9999, active: false };
let mode = 0;
const modeNames = ['attract', 'repel', 'orbit', 'swirl'];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); initParticles(); });

document.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
});
document.addEventListener('mouseleave', () => { mouse.active = false; });
document.addEventListener('click', e => {
  for (let i = 0; i < 60; i++) {
    const p = new Particle(e.clientX, e.clientY, true);
    p.life = 1.0;
    particles.push(p);
  }
});

function toggleMode() {
  mode = (mode + 1) % modeNames.length;
  document.getElementById('info').textContent = `mode: ${modeNames[mode]} · move mouse to interact · click to burst`;
}

function noise(x, y, t) {
  // simple pseudo-noise using sine combinations
  return Math.sin(x * 0.003 + t) * Math.cos(y * 0.003 - t * 0.7) +
         Math.sin((x + y) * 0.002 + t * 0.5) * 0.5 +
         Math.cos(x * 0.005 - y * 0.004 + t * 0.3) * 0.3;
}

class Particle {
  constructor(x, y, burst = false) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.vx = 0;
    this.vy = 0;
    this.life = 1.0;
    this.decay = 0.0008 + Math.random() * 0.003;
    this.speed = 0.4 + Math.random() * 1.2;
    this.hue = Math.random() * 60; // base hue offset
    this.trail = [];
    this.trailMax = 6 + Math.floor(Math.random() * 10);
    if (burst) {
      const angle = Math.random() * Math.PI * 2;
      const spd = 2 + Math.random() * 6;
      this.vx = Math.cos(angle) * spd;
      this.vy = Math.sin(angle) * spd;
      this.life = 0.6 + Math.random() * 0.4;
      this.decay = 0.008 + Math.random() * 0.01;
    }
  }
  update(t) {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.trailMax) this.trail.shift();

    // flow field angle
    const angle = noise(this.x, this.y, t) * Math.PI * 2;
    let fx = Math.cos(angle) * this.speed * 0.15;
    let fy = Math.sin(angle) * this.speed * 0.15;

    // mouse interaction
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 0.1;
      const force = Math.min(80 / dist, 3);
      const nx = dx / dist, ny = dy / dist;
      if (mode === 0) { fx += nx * force * 0.4; fy += ny * force * 0.4; }
      else if (mode === 1) { fx -= nx * force * 0.6; fy -= ny * force * 0.6; }
      else if (mode === 2) { fx += (-ny * force * 0.5); fy += (nx * force * 0.5); }
      else if (mode === 3) { fx += (-ny + nx) * force * 0.3; fy += (nx + ny) * force * 0.3; }
    }

    this.vx += fx;
    this.vy += fy;
    this.vx *= 0.96;
    this.vy *= 0.96;
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;

    // wrap edges
    if (this.x < 0) this.x = W;
    if (this.x > W) this.x = 0;
    if (this.y < 0) this.y = H;
    if (this.y > H) this.y = 0;
  }
  draw() {
    if (this.life <= 0) return;
    const alpha = this.life * 0.8;
    const hue = (this.hue + performance.now() * 0.02) % 360;
    // Use nice warm-to-cool palette
    const mappedHue = (hue * 0.3 + 180) % 360; // shift to cooler range
    const color = `hsla(${mappedHue}, 70%, 60%, ${alpha})`;

    ctx.beginPath();
    if (this.trail.length > 1) {
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.lineTo(this.x, this.y);
    } else {
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.x - this.vx * 2, this.y - this.vy * 2);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = this.life * 1.5;
    ctx.lineCap = 'round';
    ctx.stroke();
  }
}

function initParticles() {
  particles = [];
  const count = Math.min(Math.floor((W * H) / 4000), 1200);
  for (let i = 0; i < count; i++) particles.push(new Particle());
}

function resetField() {
  ctx.fillStyle = 'rgba(10, 10, 15, 0.95)';
  ctx.fillRect(0, 0, W, H);
  initParticles();
}

function saveCanvas() {
  const link = document.createElement('a');
  link.download = `flowfield-${Date.now()}.png`;
  link.href = canvas.toDataURL();
  link.click();
}

function loop() {
  // fade trail
  ctx.fillStyle = 'rgba(10, 10, 15, 0.04)';
  ctx.fillRect(0, 0, W, H);
  const t = performance.now() * 0.0003;
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) { p.update(t); p.draw(); }
  // Maintain population
  const target = Math.min(Math.floor((W * H) / 4000), 1200);
  while (particles.length < target) particles.push(new Particle());
  requestAnimationFrame(loop);
}

// Start with fade-in
ctx.fillStyle = '#0a0a0f';
ctx.fillRect(0, 0, W, H);
initParticles();
loop();
</script>
</body>
</html>
