<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Garden — Aether Curiosity Build</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050a12;
      overflow: hidden;
      font-family: 'Georgia', 'Times New Roman', serif;
      cursor: crosshair;
    }
    canvas { display: block; }
    #overlay {
      position: fixed;
      top: 24px;
      left: 28px;
      color: rgba(220, 230, 255, 0.85);
      pointer-events: none;
      z-index: 10;
      letter-spacing: 0.04em;
    }
    #overlay h1 {
      font-size: 20px;
      font-weight: normal;
      margin-bottom: 6px;
      text-shadow: 0 0 18px rgba(140,180,255,0.4);
    }
    #overlay p {
      font-size: 12px;
      opacity: 0.55;
    }
    #hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(200,210,240,0.45);
      font-size: 12px;
      letter-spacing: 0.05em;
      pointer-events: none;
      transition: opacity 1.2s;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>✦ Flow Garden</h1>
    <p>generative particles · move mouse to bloom</p>
  </div>
  <div id="hint">click anywhere to reset · move to disturb</div>
  <canvas id="canvas"></canvas>
  <script>
    (() => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const hint = document.getElementById('hint');

      let W, H, dpr;
      let particles = [];
      const MAX_PARTICLES = 1800;
      const TRAIL_ALPHA = 0.045;
      let mouse = { x: -9999, y: -9999, active: false };
      let time = 0;
      let frameCount = 0;

      // Color palettes that shift over time
      const palettes = [
        ['#ff6ec7','#7873f5','#4deeea','#ffe66d','#ff9a76'],
        ['#7ee8fa','#80ecb8','#f6d365','#fda085','#a18cd1'],
        ['#fbc2eb','#a6c1ee','#fdcbf1','#e6dee9','#d4fc79'],
        ['#ff9a9e','#fad0c4','#ffecd2','#fcb69f','#ffecd2'],
        ['#a1c4fd','#c2e9fb','#e0c3fc','#8ec5fc','#4facfe'],
      ];
      let currentPalette = palettes[0];
      let paletteIndex = 0;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        // Soft fade on resize
        ctx.fillStyle = 'rgba(5,10,18,0.9)';
        ctx.fillRect(0, 0, W, H);
      }

      // Simple hash-based noise for flow field
      function noise(x, y, t) {
        const a = Math.sin(x * 0.012 + t * 0.4) * Math.cos(y * 0.018 + t * 0.3);
        const b = Math.sin((x + y) * 0.009 + t * 0.25) * 1.3;
        const c = Math.cos(x * 0.006 - y * 0.015 + t * 0.35) * 0.9;
        return (a + b + c) * Math.PI * 2;
      }

      function getColor(alpha = 0.9) {
        const palette = currentPalette;
        const idx = Math.floor(Math.random() * palette.length);
        const hex = palette[idx];
        // Parse hex to rgba
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);
        return `rgba(${r},${g},${b},${alpha})`;
      }

      class Particle {
        constructor(x, y, burst = false) {
          this.x = x ?? Math.random() * W;
          this.y = y ?? Math.random() * H;
          this.vx = 0;
          this.vy = 0;
          this.life = burst ? Math.random() * 60 + 30 : Math.random() * 300 + 200;
          this.maxLife = this.life;
          this.size = Math.random() * 1.6 + 0.4;
          this.color = getColor(0.8);
          this.burst = burst;
        }

        update() {
          const angle = noise(this.x, this.y, time);
          const speed = 0.8 + Math.sin(time * 0.5) * 0.3;

          this.vx += Math.cos(angle) * speed * 0.15;
          this.vy += Math.sin(angle) * speed * 0.15;

          // Mouse interaction
          if (mouse.active) {
            const dx = this.x - mouse.x;
            const dy = this.y - mouse.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 140) {
              const force = (140 - dist) / 140;
              const pushAngle = Math.atan2(dy, dx) + (Math.sin(time * 3) * 0.5);
              this.vx += Math.cos(pushAngle) * force * 1.2;
              this.vy += Math.sin(pushAngle) * force * 1.2;
            }
          }

          // Damping
          this.vx *= 0.94;
          this.vy *= 0.94;

          this.x += this.vx;
          this.y += this.vy;
          this.life--;

          // Wrap edges
          if (this.x < -10) this.x = W + 10;
          if (this.x > W + 10) this.x = -10;
          if (this.y < -10) this.y = H + 10;
          if (this.y > H + 10) this.y = -10;
        }

        draw() {
          const lifeRatio = this.life / this.maxLife;
          const alpha = lifeRatio * 0.85;
          ctx.strokeStyle = this.color.replace(/[\d.]+\)$/, `${alpha})`);
          ctx.lineWidth = this.size * lifeRatio;
          ctx.beginPath();
          ctx.moveTo(this.x - this.vx * 2, this.y - this.vy * 2);
          ctx.lineTo(this.x, this.y);
          ctx.stroke();
        }

        dead() {
          return this.life <= 0;
        }
      }

      function init() {
        particles = [];
        for (let i = 0; i < MAX_PARTICLES; i++) {
          particles.push(new Particle());
        }
        paletteIndex = Math.floor(Math.random() * palettes.length);
        currentPalette = palettes[paletteIndex];
        // Clear
        ctx.fillStyle = '#050a12';
        ctx.fillRect(0, 0, W, H);
      }

      function burst(x, y, count = 150) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 3 + 1;
          const p = new Particle(x, y, true);
          p.vx = Math.cos(angle) * speed;
          p.vy = Math.sin(angle) * speed;
          p.size = Math.random() * 2 + 0.6;
          particles.push(p);
        }
        // Trim if over limit
        while (particles.length > MAX_PARTICLES + 400) {
          particles.shift();
        }
      }

      function drawConnections() {
        // Draw subtle connections between nearby particles (sparse for performance)
        ctx.lineWidth = 0.3;
        const maxDist = 50;
        const step = 4; // Check every 4th particle
        for (let i = 0; i < particles.length; i += step) {
          const a = particles[i];
          if (a.life < 20) continue;
          for (let j = i + step; j < particles.length; j += step) {
            const b = particles[j];
            if (b.life < 20) continue;
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dist = dx * dx + dy * dy;
            if (dist < maxDist * maxDist) {
              const alpha = (1 - Math.sqrt(dist) / maxDist) * 0.12 * (a.life / a.maxLife);
              ctx.strokeStyle = `rgba(180,200,255,${alpha})`;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }
      }

      function animate() {
        frameCount++;
        time += 0.008;

        // Palette shift every ~15 seconds
        if (frameCount % 900 === 0) {
          paletteIndex = (paletteIndex + 1) % palettes.length;
          currentPalette = palettes[paletteIndex];
        }

        // Soft trail fade
        ctx.fillStyle = `rgba(5,10,18,${TRAIL_ALPHA})`;
        ctx.fillRect(0, 0, W, H);

        // Update & draw particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.update();
          if (p.dead()) {
            particles.splice(i, 1);
            // Respawn
            if (particles.length < MAX_PARTICLES) {
              particles.push(new Particle());
            }
          } else {
            p.draw();
          }
        }

        // Sparse connections every other frame for performance
        if (frameCount % 2 === 0 && particles.length < 1500) {
          drawConnections();
        }

        // Maintain particle count
        while (particles.length < MAX_PARTICLES) {
          particles.push(new Particle());
        }

        requestAnimationFrame(animate);
      }

      // Events
      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;
        // Fade hint on first move
        if (hint.style.opacity !== '0') {
          hint.style.opacity = '0';
        }
      });
      window.addEventListener('mouseleave', () => { mouse.active = false; });
      window.addEventListener('touchmove', e => {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
        mouse.active = true;
        if (hint.style.opacity !== '0') hint.style.opacity = '0';
      }, { passive: true });
      window.addEventListener('touchend', () => { mouse.active = false; });
      window.addEventListener('click', e => {
        burst(e.clientX, e.clientY, 200);
      });

      // Keyboard shortcut: space to burst at center
      window.addEventListener('keydown', e => {
        if (e.code === 'Space') {
          e.preventDefault();
          burst(W / 2, H / 2, 300);
        }
        if (e.code === 'KeyR') {
          init();
        }
      });

      resize();
      init();
      animate();

      // Fade hint after 8 seconds
      setTimeout(() => { hint.style.opacity = '0'; }, 8000);
    })();
  </script>
</body>
</html>
