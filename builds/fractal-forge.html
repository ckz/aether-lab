<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal Forge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #08080f;
    color: #ddd;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    z-index: 1;
  }
  .panel {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 10;
    background: rgba(10, 10, 20, 0.88);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 22px 24px;
    width: 290px;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .panel h2 {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #fff;
    margin-bottom: 4px;
  }
  .panel .tagline {
    font-size: 10px;
    color: #555;
    margin-bottom: 18px;
    letter-spacing: 1px;
  }
  .control {
    margin-bottom: 14px;
  }
  .control label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 6px;
  }
  .control label span { color: #fff; }
  .control input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    outline: none;
  }
  .control input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #7b6fff;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(123,111,255,0.5);
  }
  .control input[type="color"] {
    -webkit-appearance: none;
    width: 100%;
    height: 30px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    padding: 2px;
  }
  .control input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .control input[type="color"]::-webkit-color-swatch { border-radius: 4px; border: none; }
  .row { display: flex; gap: 10px; }
  .row .control { flex: 1; }
  .presets {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 4px;
  }
  .preset {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: #aaa;
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 4px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .preset:hover {
    background: rgba(123,111,255,0.15);
    border-color: rgba(123,111,255,0.4);
    color: #fff;
  }
  .divider {
    border: none;
    border-top: 1px solid rgba(255,255,255,0.06);
    margin: 16px 0;
  }
  .actions { display: flex; gap: 8px; }
  .actions button {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    color: #ccc;
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .actions button:hover {
    background: rgba(123,111,255,0.2);
    border-color: rgba(123,111,255,0.5);
    color: #fff;
  }
  .hint {
    position: fixed;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 10px;
    letter-spacing: 2px;
    color: #333;
    text-transform: uppercase;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="panel">
  <h2>Fractal Forge</h2>
  <div class="tagline">recursive tree generator</div>

  <div class="control">
    <label>Depth <span id="depthVal">10</span></label>
    <input type="range" id="depth" min="1" max="14" value="10" step="1">
  </div>
  <div class="control">
    <label>Branch Angle <span id="angleVal">25°</span></label>
    <input type="range" id="angle" min="5" max="60" value="25" step="1">
  </div>
  <div class="control">
    <label>Length Ratio <span id="ratioVal">0.68</span></label>
    <input type="range" id="ratio" min="0.4" max="0.85" value="0.68" step="0.01">
  </div>
  <div class="control">
    <label>Trunk Width <span id="widthVal">8</span></label>
    <input type="range" id="width" min="2" max="24" value="8" step="1">
  </div>
  <div class="row">
    <div class="control">
      <label>Start Color</label>
      <input type="color" id="color1" value="#7b3fff">
    </div>
    <div class="control">
      <label>End Color</label>
      <input type="color" id="color2" value="#ff6b9d">
    </div>
  </div>
  <div class="control">
    <label>Wind <span id="windVal">0</span></label>
    <input type="range" id="wind" min="-30" max="30" value="0" step="1">
  </div>
  <div class="control">
    <label>Branch Spread <span id="spreadVal">0</span></label>
    <input type="range" id="spread" min="0" max="100" value="0" step="1">
  </div>
  <hr class="divider">
  <div class="control">
    <label>Presets</label>
    <div class="presets">
      <button class="preset" onclick="applyPreset('oak')">Oak</button>
      <button class="preset" onclick="applyPreset('willow')">Willow</button>
      <button class="preset" onclick="applyPreset('birch')">Birch</button>
      <button class="preset" onclick="applyPreset('crystal')">Crystal</button>
      <button class="preset" onclick="applyPreset('bonsai')">Bonsai</button>
      <button class="preset" onclick="applyPreset('chaos')">Chaos</button>
    </div>
  </div>
  <hr class="divider">
  <div class="actions">
    <button onclick="randomize()">🎲 Random</button>
    <button onclick="download()">⬇ Save</button>
  </div>
</div>

<div class="hint">click & drag to interact</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, time = 0, mouseX = 0, mouseY = 0, dragging = false;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); draw(); });

const inputs = {
  depth: document.getElementById('depth'),
  angle: document.getElementById('angle'),
  ratio: document.getElementById('ratio'),
  width: document.getElementById('width'),
  color1: document.getElementById('color1'),
  color2: document.getElementById('color2'),
  wind: document.getElementById('wind'),
  spread: document.getElementById('spread'),
};

function bind(id, suffix, transform) {
  const el = inputs[id];
  const val = document.getElementById(id + 'Val');
  el.addEventListener('input', () => {
    val.textContent = transform ? transform(el.value) : el.value;
    draw();
  });
}
bind('depth', 'depthVal');
bind('angle', 'angleVal', v => v + '°');
bind('ratio', 'ratioVal');
bind('width', 'widthVal');
bind('wind', 'windVal');
bind('spread', 'spreadVal');
['color1', 'color2'].forEach(id => bind(id));

canvas.addEventListener('mousedown', e => { dragging = true; mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; if (dragging) draw(); });
canvas.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('touchstart', e => { dragging = true; mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; });
canvas.addEventListener('touchmove', e => { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; draw(); });
canvas.addEventListener('touchend', () => dragging = false);

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function lerpColor(c1, c2, t) {
  return {
    r: c1.r + (c2.r - c1.r) * t,
    g: c1.g + (c2.g - c1.g) * t,
    b: c1.b + (c2.b - c1.b) * t,
  };
}

function draw() {
  ctx.fillStyle = 'rgba(8, 8, 15, 1)';
  ctx.fillRect(0, 0, W, H);

  const depth = parseInt(inputs.depth.value);
  const angle = parseFloat(inputs.angle.value) * Math.PI / 180;
  const ratio = parseFloat(inputs.ratio.value);
  const baseWidth = parseFloat(inputs.width.value);
  const wind = parseFloat(inputs.wind.value) * 0.015;
  const spread = parseFloat(inputs.spread.value) * 0.01;
  const c1 = hexToRgb(inputs.color1.value);
  const c2 = hexToRgb(inputs.color2.value);

  const trunkLen = Math.min(H * 0.22, 160);
  const originX = W / 2;
  const originY = H * 0.88;

  // Mouse influence
  const dx = dragging ? (mouseX - originX) / W : 0;
  const dy = dragging ? (mouseY - originY) / H : 0;

  function branch(x, y, len, width, a, level) {
    if (level > depth || len < 1.5 || width < 0.3) return;

    const sway = Math.sin(time * 0.02 + level * 0.7 + x * 0.005) * wind * (level / depth);
    const spreadOffset = Math.cos(time * 0.015 + level) * spread * (level / depth);

    const finalAngle = a + sway + spreadOffset;

    const x2 = x + Math.sin(finalAngle) * len;
    const y2 = y - Math.cos(finalAngle) * len;

    const t = level / depth;
    const col = lerpColor(c1, c2, t);
    const alpha = 0.3 + 0.7 * (1 - t);

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = `rgba(${col.r|0},${col.g|0},${col.b|0},${alpha})`;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.stroke();

    // Occasional leaf / glow at tips
    if (level >= depth - 2 && t > 0.5) {
      ctx.beginPath();
      ctx.arc(x2, y2, 1.5 + Math.sin(time * 0.05 + x) * 1.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${col.r|0},${col.g|0},${col.b|0},${0.6 * Math.sin(time * 0.03 + level) + 0.4})`;
      ctx.fill();
    }

    const angleVariation = 0.08 + spread * 0.3;
    const windBias = wind * 0.15 * (depth - level) / depth;

    branch(x2, y2, len * ratio, width * 0.68, finalAngle - angle + windBias - angleVariation * Math.sin(time * 0.03 + level), level + 1);
    branch(x2, y2, len * ratio, width * 0.68, finalAngle + angle + windBias + angleVariation * Math.cos(time * 0.025 + level), level + 1);

    // Occasional middle branch for chaos/bonsai feel
    if (spread > 0.3 && Math.random() < 0.12 && level < depth - 2) {
      branch(x2, y2, len * ratio * 0.7, width * 0.5, finalAngle + (Math.random() - 0.5) * 0.5, level + 2);
    }
  }

  branch(originX, originY, trunkLen, baseWidth, 0, 0);
  time++;
  requestAnimationFrame(draw);
}

function applyPreset(name) {
  const presets = {
    oak: { depth: 10, angle: 25, ratio: 0.68, width: 8, color1: '#5a3e1b', color2: '#4a7c3f', wind: 2, spread: 10 },
    willow: { depth: 11, angle: 32, ratio: 0.72, width: 6, color1: '#6b8e6b', color2: '#c4d4a4', wind: 8, spread: 18 },
    birch: { depth: 12, angle: 22, ratio: 0.65, width: 5, color1: '#4a4a5a', color2: '#e8e8f0', wind: 3, spread: 5 },
    crystal: { depth: 11, angle: 30, ratio: 0.64, width: 4, color1: '#7b3fff', color2: '#00e5ff', wind: 0, spread: 0 },
    bonsai: { depth: 9, angle: 40, ratio: 0.6, width: 10, color1: '#8b5e3c', color2: '#e85d3f', wind: 0, spread: 25 },
    chaos: { depth: 9, angle: 35, ratio: 0.58, width: 4, color1: '#ff2d95', color2: '#ffdd00', wind: 15, spread: 60 },
  };
  const p = presets[name];
  if (!p) return;
  Object.keys(p).forEach(k => { inputs[k].value = p[k]; document.getElementById(k + 'Val').textContent = p[k]; });
  draw();
}

function randomize() {
  inputs.depth.value = 6 + Math.floor(Math.random() * 8);
  inputs.angle.value = 10 + Math.floor(Math.random() * 45);
  inputs.ratio.value = (0.45 + Math.random() * 0.4).toFixed(2);
  inputs.width.value = 3 + Math.floor(Math.random() * 16);
  const randHex = () => '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
  inputs.color1.value = randHex();
  inputs.color2.value = randHex();
  inputs.wind.value = Math.floor(Math.random() * 40) - 20;
  inputs.spread.value = Math.floor(Math.random() * 80);
  document.getElementById('depthVal').textContent = inputs.depth.value;
  document.getElementById('angleVal').textContent = inputs.angle.value + '°';
  document.getElementById('ratioVal').textContent = inputs.ratio.value;
  document.getElementById('widthVal').textContent = inputs.width.value;
  document.getElementById('windVal').textContent = inputs.wind.value;
  document.getElementById('spreadVal').textContent = inputs.spread.value;
  draw();
}

function download() {
  const link = document.createElement('a');
  link.download = 'fractal-forge-' + Date.now() + '.png';
  link.href = canvas.toDataURL();
  link.click();
}

draw();
</script>
</body>
</html>
