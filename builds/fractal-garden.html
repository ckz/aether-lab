<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal Garden — L-System Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #aab;
    cursor: crosshair;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(10, 10, 18, 0.88);
    border: 1px solid rgba(100, 140, 200, 0.2);
    border-radius: 10px;
    padding: 16px 20px;
    font-size: 12px;
    line-height: 1.7;
    backdrop-filter: blur(12px);
    z-index: 10;
    min-width: 220px;
  }
  #ui h2 {
    font-size: 14px;
    color: #8cf;
    margin-bottom: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #ui label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 4px 0;
  }
  #ui input[type="range"] {
    width: 90px;
    accent-color: #8cf;
  }
  #ui select, #ui button {
    width: 100%;
    background: rgba(100, 140, 200, 0.12);
    border: 1px solid rgba(100, 140, 200, 0.3);
    color: #aab;
    padding: 6px 10px;
    border-radius: 5px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    margin-top: 4px;
  }
  #ui button:hover { background: rgba(100, 140, 200, 0.25); color: #fff; }
  #ui .val { color: #8cf; font-size: 11px; min-width: 28px; text-align: right; }
  #info {
    position: fixed;
    bottom: 16px;
    left: 16px;
    font-size: 11px;
    color: rgba(150, 160, 180, 0.5);
    z-index: 10;
  }
  #season-indicator {
    position: fixed;
    top: 16px;
    right: 16px;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #8cf;
    opacity: 0.7;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <h2>🌿 Fractal Garden</h2>
  <label>Species
    <select id="species">
      <option value="tree">Oak</option>
      <option value="fern">Fern</option>
      <option value="bush">Bush</option>
      <option value="snowflake">Snowflake</option>
      <option value="dragon">Dragon</option>
      <option value="island">Island</option>
    </select>
  </label>
  <label>Depth <span class="val" id="depthVal">8</span>
    <input type="range" id="depth" min="3" max="12" value="8">
  </label>
  <label>Angle <span class="val" id="angleVal">25°</span>
    <input type="range" id="angle" min="5" max="60" value="25">
  </label>
  <label>Wind <span class="val" id="windVal">0</span>
    <input type="range" id="wind" min="-50" max="50" value="0">
  </label>
  <label>Season
    <select id="season">
      <option value="spring">Spring</option>
      <option value="summer">summer</option>
      <option value="autumn">Autumn</option>
      <option value="winter">Winter</option>
    </select>
  </label>
  <label>Density <span class="val" id="densityVal">5</span>
    <input type="range" id="density" min="1" max="12" value="5">
  </label>
  <button id="regenerate">⟳ Regenerate</button>
  <button id="saveBtn">💾 Save PNG</button>
</div>

<div id="season-indicator">—</div>
<div id="info">Click to plant · Scroll to zoom · Space to pause</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let time = 0;
let paused = false;
let zoom = 1;
let trees = [];
let particles = [];
let mouse = { x: -1000, y: -1000, active: false };

const SEASONS = {
  spring: { bg1: '#1a1520', bg2: '#0d0f14', leaf: ['#f4a0c0','#f8c8e0','#e8b4d8','#ffb7c5','#dda0dd','#90ee90'], trunk: '#5c4033', flower: ['#fff','#ffe0ec','#fff8dc','#ffe4e1'], glow: 'rgba(255,182,200,0.03)' },
  summer: { bg1: '#0a1a0f', bg2: '#050d08', leaf: ['#228b22','#2e8b57','#32cd32','#006400','#3cb371','#90ee90'], trunk: '#4a3020', flower: ['#fff','#ffffe0'], glow: 'rgba(50,205,50,0.03)' },
  autumn: { bg1: '#1a1008', bg2: '#0d0804', leaf: ['#ff4500','#ff8c00','#ffa500','#daa520','#cd853f','#b22222'], trunk: '#3e2723', flower: ['#ff6347','#ff7f50','#ffd700'], glow: 'rgba(255,140,0,0.03)' },
  winter: { bg1: '#0a0d14', bg2: '#050710', leaf: ['#c0d8f0','#e0e8f0','#f0f4f8','#b0c4de','#d8e8f0','#a0b0c0'], trunk: '#3a3028', flower: ['#fff','#f8f8ff','#e8f0ff','#c0d0e0'], glow: 'rgba(180,200,230,0.04)' }
};

const SPECIES = {
  tree: { axiom: 'F', rules: { F: 'FF+[+F-F-F]-[-F+F+F]' }, angle: 25, initLen: 100, lenDecay: 0.7 },
  fern: { axiom: 'X', rules: { X: 'F+[[X]-X]-F[-FX]+X', F: 'FF' }, angle: 22, initLen: 80, lenDecay: 0.65 },
  bush: { axiom: 'F', rules: { F: 'FF-[-F+F+F]+[+F-F-F]' }, angle: 20, initLen: 60, lenDecay: 0.75 },
  snowflake: { axiom: 'F--F--F', rules: { F: 'F+F--F+F' }, angle: 60, initLen: 120, lenDecay: 0.55 },
  dragon: { axiom: 'FX', rules: { X: 'X+YF+', Y: '-FX-Y' }, angle: 90, initLen: 6, lenDecay: 0.85 },
  island: { axiom: 'F+F+F+F', rules: { F: 'FF+F-F+F+FF' }, angle: 90, initLen: 50, lenDecay: 0.65 }
};

let settings = {
  species: 'tree',
  depth: 8,
  angle: 25,
  wind: 0,
  season: 'spring',
  density: 5
};

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  generateGarden();
}

function lSystem(axiom, rules, depth) {
  let s = axiom;
  for (let i = 0; i < depth; i++) {
    let next = '';
    for (let ch of s) {
      next += rules[ch] || ch;
    }
    s = next;
  }
  return s;
}

function drawBranch(x, y, angle, length, depth, maxDepth, str) {
  if (depth >= maxDepth || length < 0.8) return;

  const windEffect = settings.wind * 0.002 * (depth / maxDepth) * Math.sin(time * 0.8 + depth * 0.5);
  const mouseDist = Math.hypot(x - mouse.x, (y - mouse.y) / zoom);
  const mouseInfluence = mouse.active && mouseDist < 150 ? (1 - mouseDist / 150) * 0.3 : 0;
  const sway = windEffect + mouseInfluence * Math.sin(time * 3 + x * 0.01);

  const endX = x + Math.cos(angle + sway) * length;
  const endY = y + Math.sin(angle + sway) * length;

  const season = SEASONS[settings.season];
  const depthRatio = depth / maxDepth;

  if (depth < 2) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(endX, endY);
    const trunkAlpha = 0.5 + depthRatio * 0.5;
    ctx.strokeStyle = season.trunk + Math.round(trunkAlpha * 255).toString(16).padStart(2, '0');
    ctx.lineWidth = Math.max(0.5, (1 - depthRatio) * 5);
    ctx.stroke();
  } else {
    const alpha = Math.min(1, 0.3 + depthRatio * 0.7);
    const hue = (time * 8 + depth * 20) % 360;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(endX, endY);
    ctx.strokeStyle = `hsla(${hue}, 60%, ${40 + depthRatio * 30}%, ${alpha})`;
    ctx.lineWidth = Math.max(0.3, (1 - depthRatio) * 2.5);
    ctx.stroke();
  }

  // Leaves / flowers at terminal branches
  if (depth >= maxDepth - 2 && length > 3) {
    const colors = depth >= maxDepth - 1 ? season.flower : season.leaf;
    const color = colors[Math.floor((x * 13 + y * 7 + depth) % colors.length)];
    const size = 1.5 + Math.sin(time * 2 + x) * 0.8;

    ctx.beginPath();
    ctx.arc(endX, endY, size, 0, Math.PI * 2);
    ctx.fillStyle = color + '88';
    ctx.fill();

    if (Math.random() < 0.02 && depth >= maxDepth - 1) {
      particles.push({
        x: endX, y: endY,
        vx: (Math.random() - 0.5) * 0.5,
        vy: -Math.random() * 1.2 - 0.3,
        life: 1,
        color: color,
        size: Math.random() * 2 + 1
      });
    }
  }

  let idx = 0;
  const stack = [];
  while (idx < str.length) {
    const ch = str[idx];
    if (ch === 'F') {
      drawBranch(endX, endY, angle + sway, length * (SPECIES[settings.species].lenDecay + Math.random() * 0.05), depth + 1, maxDepth, '');
      idx++;
    } else if (ch === 'X' || ch === 'Y') {
      idx++;
    } else if (ch === '+') {
      stack.push({ angle: angle + sway, x: endX, y: endY, length: length * SPECIES[settings.species].lenDecay, depth });
      angle += (SPECIES[settings.species].angle * Math.PI / 180) + sway;
      idx++;
    } else if (ch === '-') {
      stack.push({ angle: angle + sway, x: endX, y: endY, length: length * SPECIES[settings.species].lenDecay, depth });
      angle -= (SPECIES[settings.species].angle * Math.PI / 180) + sway;
      idx++;
    } else if (ch === '[') {
      idx++;
    } else if (ch === ']') {
      if (stack.length > 0) {
        const s = stack.pop();
        angle = s.angle;
      }
      idx++;
    } else {
      idx++;
    }
  }
}

function generateGarden() {
  trees = [];
  const count = settings.density;
  const cols = Math.ceil(Math.sqrt(count * W / H));
  const rows = Math.ceil(count / cols);
  const spacingX = W / (cols + 1);
  const spacingY = H / (rows + 1);

  const sp = SPECIES[settings.species];
  const str = lSystem(sp.axiom, sp.rules, settings.depth);

  for (let i = 0; i < count; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const jitterX = (Math.random() - 0.5) * spacingX * 0.6;
    const jitterY = (Math.random() - 0.5) * spacingY * 0.4;
    trees.push({
      x: spacingX * (col + 1) + jitterX,
      y: H - 40 - row * spacingY + jitterY,
      str: str,
      maxDepth: settings.depth,
      initLen: sp.initLen * (0.7 + Math.random() * 0.6) * zoom,
      angle: -Math.PI / 2 + (Math.random() - 0.5) * 0.15,
      seed: Math.random() * 100
    });
  }
}

function drawBackground() {
  const season = SEASONS[settings.season];
  const grad = ctx.createRadialGradient(W / 2, H, 50, W / 2, H / 2, H);
  grad.addColorStop(0, season.bg1);
  grad.addColorStop(1, season.bg2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Ground glow
  const groundGrad = ctx.createLinearGradient(0, H - 80, 0, H);
  groundGrad.addColorStop(0, 'transparent');
  groundGrad.addColorStop(1, season.glow);
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, H - 80, W, 80);
}

function drawGround() {
  const season = SEASONS[settings.season];
  ctx.fillStyle = season.trunk + '22';
  ctx.beginPath();
  ctx.ellipse(W / 2, H + 10, W * 0.7, 40, 0, 0, Math.PI * 2);
  ctx.fill();

  // Grass tufts
  for (let i = 0; i < 200; i++) {
    const gx = (i * 137.5 + 50) % W;
    const gy = H - 15 - Math.random() * 25;
    const s = 3 + Math.sin(time * 2 + i) * 1.5;
    ctx.beginPath();
    ctx.moveTo(gx, gy);
    ctx.lineTo(gx + Math.sin(time + i) * 3, gy - s);
    ctx.strokeStyle = season.leaf[i % season.leaf.length] + '44';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
}

function animate() {
  if (!paused) time += 0.016;

  drawBackground();

  // Draw trees (back to front for depth)
  trees.sort((a, b) => a.y - b.y);
  for (const tree of trees) {
    ctx.save();
    const len = tree.initLen;
    drawBranch(tree.x, tree.y, tree.angle, len, 0, tree.maxDepth, tree.str);
    ctx.restore();
  }

  drawGround();

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx + Math.sin(time + i) * 0.2;
    p.y += p.vy;
    p.life -= 0.004;
    if (p.life <= 0 || p.y > H) {
      particles.splice(i, 1);
      continue;
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = p.color + Math.round(p.life * 120).toString(16).padStart(2, '0');
    ctx.fill();
  }

  // Mouse glow
  if (mouse.active) {
    const grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 100);
    grad.addColorStop(0, 'rgba(140,200,255,0.06)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 100, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(animate);
}

// Controls
document.getElementById('species').addEventListener('change', e => {
  settings.species = e.target.value;
  generateGarden();
});
document.getElementById('depth').addEventListener('input', e => {
  settings.depth = parseInt(e.target.value);
  document.getElementById('depthVal').textContent = settings.depth;
  generateGarden();
});
document.getElementById('angle').addEventListener('input', e => {
  settings.angle = parseInt(e.target.value);
  document.getElementById('angleVal').textContent = settings.angle + '°';
  SPECIES[settings.species].angle = settings.angle;
  generateGarden();
});
document.getElementById('wind').addEventListener('input', e => {
  settings.wind = parseInt(e.target.value);
  document.getElementById('windVal').textContent = settings.wind;
});
document.getElementById('season').addEventListener('change', e => {
  settings.season = e.target.value;
  document.getElementById('season-indicator').textContent = settings.season;
  document.body.style.background = SEASONS[settings.season].bg2;
});
document.getElementById('density').addEventListener('input', e => {
  settings.density = parseInt(e.target.value);
  document.getElementById('densityVal').textContent = settings.density;
  generateGarden();
});
document.getElementById('regenerate').addEventListener('click', generateGarden);
document.getElementById('saveBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = `fractal-garden-${Date.now()}.png`;
  link.href = canvas.toDataURL();
  link.click();
});

window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
window.addEventListener('mouseleave', () => { mouse.active = false; });
window.addEventListener('click', e => {
  if (e.target.tagName === 'CANVAS') {
    const sp = SPECIES[settings.species];
    const str = lSystem(sp.axiom, sp.rules, settings.depth);
    trees.push({
      x: e.clientX, y: e.clientY,
      str, maxDepth: settings.depth,
      initLen: sp.initLen * (0.7 + Math.random() * 0.4),
      angle: -Math.PI / 2 + (Math.random() - 0.5) * 0.2,
      seed: Math.random() * 100
    });
  }
});
window.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.max(0.3, Math.min(3, zoom - e.deltaY * 0.001));
  generateGarden();
}, { passive: false });
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); paused = !paused; }
});

resize();
document.getElementById('season-indicator').textContent = settings.season;
animate();
</script>
</body>
</html>
