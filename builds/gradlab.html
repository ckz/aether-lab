<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GradLab — CSS Gradient Generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg: #0d0d0f;
    --surface: #141418;
    --surface-2: #1a1a21;
    --border: #252530;
    --text: #e8e8ed;
    --text-dim: #7a7a8a;
    --accent: #7c5cff;
    --accent-2: #ff5caa;
    --success: #4ade80;
  }
  
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .logo {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .tagline {
    color: var(--text-dim);
    font-size: 12px;
  }
  
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 0;
    overflow: hidden;
  }
  
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  }
  
  .preview-pane {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    background: var(--bg);
  }
  
  #gradient-preview {
    width: 100%;
    max-width: 700px;
    aspect-ratio: 16/10;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transition: background 0.4s ease;
  }
  
  .controls-pane {
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  
  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  
  .section {
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }
  
  .section:last-child { border-bottom: none; }
  
  .type-toggle {
    display: flex;
    gap: 4px;
    background: var(--bg);
    border-radius: 8px;
    padding: 4px;
  }
  
  .type-btn {
    flex: 1;
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    transition: all 0.2s;
  }
  
  .type-btn.active {
    background: var(--accent);
    color: white;
  }
  
  .type-btn:hover:not(.active) {
    color: var(--text);
    background: var(--surface-2);
  }
  
  .color-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  
  .color-row label {
    font-size: 11px;
    color: var(--text-dim);
    width: 16px;
    text-align: right;
  }
  
  input[type="color"] {
    -webkit-appearance: none;
    width: 44px;
    height: 36px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    padding: 2px;
  }
  
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
  
  .hex-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
  }
  
  .hex-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  
  .slider-group {
    margin-bottom: 14px;
  }
  
  .slider-header {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 6px;
  }
  
  .slider-value {
    color: var(--accent);
    font-weight: 600;
  }
  
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }
  
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(124,92,255,0.5);
  }
  
  .btn {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  
  .btn:hover {
    background: var(--border);
    border-color: var(--text-dim);
  }
  
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  
  .btn-primary:hover {
    background: #9575ff;
    border-color: #9575ff;
  }
  
  .btn-success {
    background: var(--success);
    border-color: var(--success);
    color: #000;
    font-weight: 600;
  }
  
  .btn-success:hover {
    background: #5fe88a;
  }
  
  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  
  .presets-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  
  .preset {
    aspect-ratio: 1;
    border-radius: 6px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  
  .preset:hover {
    transform: scale(1.05);
    border-color: var(--accent);
  }
  
  .preset.active {
    border-color: white;
    box-shadow: 0 0 0 2px var(--accent);
  }
  
  .css-output {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px;
    color: #a0f0a0;
    word-break: break-all;
    max-height: 100px;
    overflow-y: auto;
  }
  
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--success);
    color: #000;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    z-index: 1000;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
  }
  
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  
  .badge {
    display: inline-block;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 8px;
  }
</style>
</head>
<body>
<header>
  <div class="logo">GradLab</div>
  <div class="tagline">Craft beautiful CSS gradients<span class="badge">v1.0</span></div>
</header>

<main>
  <div class="preview-pane">
    <div id="gradient-preview"></div>
  </div>
  
  <div class="controls-pane">
    <div class="section">
      <div class="section-title">Gradient Type</div>
      <div class="type-toggle">
        <button class="type-btn active" data-type="linear">Linear</button>
        <button class="type-btn" data-type="radial">Radial</button>
        <button class="type-btn" data-type="conic">Conic</button>
      </div>
    </div>
    
    <div class="section">
      <div class="section-title">Colors</div>
      <div id="color-stops">
        <div class="color-row" data-index="0">
          <label>1</label>
          <input type="color" value="#7c5cff">
          <input type="text" class="hex-input" value="#7c5cff" maxlength="7">
        </div>
        <div class="color-row" data-index="1">
          <label>2</label>
          <input type="color" value="#ff5caa">
          <input type="text" class="hex-input" value="#ff5caa" maxlength="7">
        </div>
      </div>
      <button class="btn" id="add-color" style="width:100%; margin-top:8px;">+ Add Color</button>
    </div>
    
    <div class="section">
      <div class="section-title">Adjustments</div>
      
      <div class="slider-group" id="angle-group">
        <div class="slider-header">
          <span>Angle</span>
          <span class="slider-value" id="angle-value">135°</span>
        </div>
        <input type="range" id="angle" min="0" max="360" value="135">
      </div>
      
      <div class="slider-group">
        <div class="slider-header">
          <span>Position</span>
          <span class="slider-value" id="pos-value">50%</span>
        </div>
        <input type="range" id="position" min="0" max="100" value="50">
      </div>
    </div>
    
    <div class="section">
      <div class="section-title">Presets</div>
      <div class="presets-grid" id="presets"></div>
    </div>
    
    <div class="section">
      <div class="section-title">CSS Output</div>
      <div class="css-output" id="css-output"></div>
      <div class="btn-row" style="margin-top: 10px;">
        <button class="btn btn-success" id="copy-css">📋 Copy CSS</button>
        <button class="btn btn-primary" id="randomize">🎲 Randomize</button>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast">Copied to clipboard!</div>

<script>
const PRESETS = [
  { name: 'Aurora', colors: ['#00ff88', '#00b4d8', '#7c3aed', '#ff006e'] },
  { name: 'Sunset', colors: ['#ff6b35', '#f7c59f', '#efa94a', '#d62828'] },
  { name: 'Ocean', colors: ['#0077b6', '#00b4d8', '#90e0ef', '#caf0f8'] },
  { name: 'Cyber', colors: ['#f72585', '#7209b7', '#3a0ca3', '#4cc9f0'] },
  { name: 'Forest', colors: ['#1b4332', '#2d6a4f', '#40916c', '#95d5b2'] },
  { name: 'Ember', colors: ['#370617', '#6a040f', '#9d0208', '#dc2f02'] },
  { name: 'Lavender', colors: ['#e0aaff', '#c77dff', '#9d4edd', '#7b2cbf'] },
  { name: 'Arctic', colors: ['#48cae4', '#90e0ef', '#ade8f4', '#caf0f8'] },
  { name: 'Neon', colors: ['#f72585', '#4cc9f0', '#f72585', '#4cc9f0'] },
];

let state = {
  type: 'linear',
  colors: ['#7c5cff', '#ff5caa'],
  angle: 135,
  position: 50,
  activePreset: -1
};

function toHSL(hex) {
  let r = parseInt(hex.slice(1, 3), 16) / 255;
  let g = parseInt(hex.slice(3, 5), 16) / 255;
  let b = parseInt(hex.slice(5, 7), 16) / 255;
  let max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h, s, l = (max + min) / 2;
  if (max === min) { h = s = 0; }
  else {
    let d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
      case g: h = ((b - r) / d + 2) / 6; break;
      case b: h = ((r - g) / d + 4) / 6; break;
    }
  }
  return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
}

function isLight(hex) {
  const { l } = toHSL(hex);
  return l > 60;
}

function buildCSS() {
  const stops = state.colors.map((c, i) => {
    const pct = state.colors.length === 1 ? 0 : Math.round((i / (state.colors.length - 1)) * 100);
    return `${c} ${pct}%`;
  }).join(', ');
  
  const type = state.type;
  if (type === 'linear') {
    return `linear-gradient(${state.angle}deg, ${stops})`;
  } else if (type === 'radial') {
    return `radial-gradient(circle at ${state.position}% ${state.position}%, ${stops})`;
  } else {
    return `conic-gradient(from ${state.angle}deg at ${state.position}% ${state.position}%, ${stops})`;
  }
}

function updatePreview() {
  const css = buildCSS();
  document.getElementById('gradient-preview').style.background = css;
  document.getElementById('css-output').textContent = `background: ${css};`;
}

function randomHex() {
  return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
}

function randomize() {
  const n = 2 + Math.floor(Math.random() * 2);
  state.colors = Array.from({ length: n }, () => randomHex());
  state.angle = Math.floor(Math.random() * 360);
  state.position = Math.floor(Math.random() * 100);
  state.activePreset = -1;
  
  document.getElementById('angle').value = state.angle;
  document.getElementById('angle-value').textContent = state.angle + '°';
  document.getElementById('position').value = state.position;
  document.getElementById('pos-value').textContent = state.position + '%';
  
  renderColorInputs();
  updatePresetHighlight();
  updatePreview();
}

function renderColorInputs() {
  const container = document.getElementById('color-stops');
  container.innerHTML = '';
  state.colors.forEach((color, i) => {
    const row = document.createElement('div');
    row.className = 'color-row';
    row.dataset.index = i;
    row.innerHTML = `
      <label>${i + 1}</label>
      <input type="color" value="${color}">
      <input type="text" class="hex-input" value="${color}" maxlength="7">
      ${state.colors.length > 2 ? `<button class="btn" data-remove="${i}" style="padding:6px 10px; font-size:11px;">×</button>` : ''}
    `;
    container.appendChild(row);
  });
  
  container.querySelectorAll('input[type="color"]').forEach(input => {
    input.addEventListener('input', (e) => {
      const idx = parseInt(e.target.parentElement.dataset.index);
      state.colors[idx] = e.target.value;
      e.target.nextElementSibling.value = e.target.value;
      state.activePreset = -1;
      updatePresetHighlight();
      updatePreview();
    });
  });
  
  container.querySelectorAll('.hex-input').forEach(input => {
    input.addEventListener('input', (e) => {
      let val = e.target.value;
      if (!val.startsWith('#')) val = '#' + val;
      if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
        const idx = parseInt(e.target.parentElement.dataset.index);
        state.colors[idx] = val.toLowerCase();
        e.target.previousElementSibling.value = val.toLowerCase();
        state.activePreset = -1;
        updatePresetHighlight();
        updatePreview();
      }
    });
  });
  
  container.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const idx = parseInt(e.target.dataset.remove);
      if (state.colors.length > 2) {
        state.colors.splice(idx, 1);
        renderColorInputs();
        updatePreview();
      }
    });
  });
}

function renderPresets() {
  const grid = document.getElementById('presets');
  PRESETS.forEach((preset, i) => {
    const div = document.createElement('div');
    div.className = 'preset';
    div.title = preset.name;
    div.dataset.index = i;
    div.style.background = `linear-gradient(135deg, ${preset.colors.join(', ')})`;
    div.addEventListener('click', () => {
      state.colors = [...preset.colors];
      state.activePreset = i;
      updatePresetHighlight();
      renderColorInputs();
      updatePreview();
    });
    grid.appendChild(div);
  });
}

function updatePresetHighlight() {
  document.querySelectorAll('.preset').forEach((p, i) => {
    p.classList.toggle('active', i === state.activePreset);
  });
}

document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.type = btn.dataset.type;
    const angleGroup = document.getElementById('angle-group');
    if (state.type !== 'linear') {
      angleGroup.querySelector('.slider-header span:first-child').textContent = state.type === 'radial' ? 'Radius' : 'Start Angle';
    } else {
      angleGroup.querySelector('.slider-header span:first-child').textContent = 'Angle';
    }
    updatePreview();
  });
});

document.getElementById('angle').addEventListener('input', (e) => {
  state.angle = parseInt(e.target.value);
  document.getElementById('angle-value').textContent = state.angle + '°';
  updatePreview();
});

document.getElementById('position').addEventListener('input', (e) => {
  state.position = parseInt(e.target.value);
  document.getElementById('pos-value').textContent = state.position + '%';
  updatePreview();
});

document.getElementById('add-color').addEventListener('click', () => {
  if (state.colors.length < 6) {
    state.colors.push(randomHex());
    state.activePreset = -1;
    updatePresetHighlight();
    renderColorInputs();
    updatePreview();
  }
});

document.getElementById('copy-css').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(`background: ${buildCSS()};`);
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  } catch (err) {
    alert('Copy failed — try manually:\n\nbackground: ' + buildCSS() + ';');
  }
});

document.getElementById('randomize').addEventListener('click', randomize);

renderPresets();
renderColorInputs();
updatePreview();
</script>
</body>
</html>
