<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Playground</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05060f;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    color: #c8d0e0;
    user-select: none;
  }
  canvas { display: block; }
  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(8,10,25,0.85);
    border: 1px solid rgba(120,140,200,0.25);
    border-radius: 10px; padding: 14px 18px;
    backdrop-filter: blur(8px);
    font-size: 12px; line-height: 1.7;
    max-width: 280px;
  }
  #hud h1 {
    font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
    color: #7eb8ff; margin-bottom: 8px;
    border-bottom: 1px solid rgba(120,160,255,0.2); padding-bottom: 6px;
  }
  #hud .row { display: flex; justify-content: space-between; gap: 10px; }
  #hud .label { color: #6070a0; }
  #hud .val { color: #c8d0e0; font-weight: bold; }
  #controls {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    background: rgba(8,10,25,0.85);
    border: 1px solid rgba(120,140,200,0.25);
    border-radius: 10px; padding: 10px 14px;
    backdrop-filter: blur(8px);
  }
  button {
    background: rgba(80,120,200,0.15);
    border: 1px solid rgba(100,140,220,0.4);
    color: #a8c0f0; padding: 6px 14px;
    border-radius: 6px; cursor: pointer;
    font-family: 'Courier New', monospace; font-size: 11px;
    letter-spacing: 1px; transition: all 0.2s;
  }
  button:hover { background: rgba(100,140,220,0.3); color: #fff; }
  button.active { background: rgba(100,160,255,0.35); color: #fff; border-color: rgba(130,180,255,0.7); }
  #hint {
    position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
    color: rgba(150,160,200,0.6); font-size: 11px; letter-spacing: 1px;
    z-index: 10; pointer-events: none;
    transition: opacity 1.5s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>⚛ Gravity Playground</h1>
  <div class="row"><span class="label">Bodies</span><span class="val" id="sBodies">0</span></div>
  <div class="row"><span class="label">FPS</span><span class="val" id="sFps">60</span></div>
  <div class="row"><span class="label">Mass</span><span class="val" id="sMass">--</span></div>
  <div class="row"><span class="label">Trails</span><span class="val" id="sTrails">ON</span></div>
</div>
<div id="hint">CLICK to launch · DRAG for mass · SCROLL to change time scale</div>
<div id="controls">
  <button id="bClear" title="Clear all bodies">Clear</button>
  <button id="bTrails" class="active">Trails</button>
  <button id="bMerge" class="active">Merge</button>
  <button id="bGrid" title="Toggle orbit hint lines">Grid</button>
  <button id="bPause">Pause</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, centerX, centerY;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  centerX = W / 2; centerY = H / 2;
}
resize();
window.addEventListener('resize', resize);

// Physics
const G = 0.15;
const softening = 8;
let bodies = [];
let trails = true;
let mergeOn = true;
let showGrid = false;
let paused = false;
let timeScale = 1;
let dragStart = null;
let dragCurrent = null;
let mouse = { x: centerX, y: centerY };

// Palette
const palette = [
  [255, 140, 80],   // warm orange
  [80, 180, 255],   // sky blue
  [180, 100, 255],  // violet
  [255, 220, 80],   // gold
  [100, 255, 180],  // mint
  [255, 100, 160],  // rose
  [160, 255, 255],  // cyan
  [255, 180, 100],  // peach
];

class Body {
  constructor(x, y, vx, vy, mass, color) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.mass = mass;
    this.radius = Math.max(2, Math.pow(mass, 0.4) * 2.5);
    this.color = color;
    this.trail = [];
    this.maxTrail = 60;
    this.age = 0;
    this.alive = true;
  }
  update(dt) {
    if (paused) return;
    this.age += dt;
    // Gravity from all other bodies
    for (const other of bodies) {
      if (other === this || !other.alive) continue;
      const dx = other.x - this.x;
      const dy = other.y - this.y;
      const distSq = dx * dx + dy * dy + softening * softening;
      const dist = Math.sqrt(distSq);
      const force = G * other.mass * this.mass / distSq;
      this.vx += force * dx / dist / this.mass * dt;
      this.vy += force * dy / dist / this.mass * dt;
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    // Trail
    if (trails && this.age % 1 < 1) {
      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > this.maxTrail) this.trail.shift();
    }
    // Screen bounds - wrap
    if (this.x < -200) this.x = W + 200;
    if (this.x > W + 200) this.x = -200;
    if (this.y < -200) this.y = H + 200;
    if (this.y > H + 200) this.y = -200;
  }
  draw() {
    // Trail
    if (trails && this.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.strokeStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},0.15)`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    // Glow
    const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 4);
    grd.addColorStop(0, `rgba(${this.color[0]},${this.color[1]},${this.color[2]},0.4)`);
    grd.addColorStop(1, `rgba(${this.color[0]},${this.color[1]},${this.color[2]},0)`);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 4, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
    // Core
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgb(${this.color[0]},${this.color[1]},${this.color[2]})`;
    ctx.fill();
    // Bright center
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,0.6)`;
    ctx.fill();
  }
}

function resolveMerges() {
  if (!mergeOn) return;
  const merged = new Set();
  for (let i = 0; i < bodies.length; i++) {
    if (merged.has(i) || !bodies[i].alive) continue;
    for (let j = i + 1; j < bodies.length; j++) {
      if (merged.has(j) || !bodies[j].alive) continue;
      const dx = bodies[j].x - bodies[i].x;
      const dy = bodies[j].y - bodies[i].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = (bodies[i].radius + bodies[j].radius) * 0.6;
      if (dist < minDist) {
        // Merge j into i
        const totalMass = bodies[i].mass + bodies[j].mass;
        bodies[i].vx = (bodies[i].vx * bodies[i].mass + bodies[j].vx * bodies[j].mass) / totalMass;
        bodies[i].vy = (bodies[i].vy * bodies[i].mass + bodies[j].vy * bodies[j].mass) / totalMass;
        bodies[i].x = (bodies[i].x * bodies[i].mass + bodies[j].x * bodies[j].mass) / totalMass;
        bodies[i].y = (bodies[i].y * bodies[i].mass + bodies[j].y * bodies[j].mass) / totalMass;
        bodies[i].mass = totalMass;
        bodies[i].radius = Math.max(2, Math.pow(totalMass, 0.4) * 2.5);
        // Blend colors
        const t = bodies[j].mass / totalMass;
        bodies[i].color = [
          Math.round(bodies[i].color[0] * (1 - t) + bodies[j].color[0] * t),
          Math.round(bodies[i].color[1] * (1 - t) + bodies[j].color[1] * t),
          Math.round(bodies[i].color[2] * (1 - t) + bodies[j].color[2] * t),
        ];
        bodies[j].alive = false;
        merged.add(j);
        // Merge burst effect
        spawnParticles(bodies[i].x, bodies[i].y, bodies[i].color, 8);
      }
    }
  }
  bodies = bodies.filter(b => b.alive);
}

// Particles for merge effect
let particles = [];
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 1, decay: 0.02 + Math.random() * 0.03,
      color, size: Math.random() * 2 + 1
    });
  }
}
function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= p.decay * dt;
  }
  particles = particles.filter(p => p.life > 0);
}
function drawParticles() {
  for (const p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${p.life * 0.8})`;
    ctx.fill();
  }
}

// Input
canvas.addEventListener('mousedown', e => {
  dragStart = { x: e.clientX, y: e.clientY, time: Date.now() };
  dragCurrent = { ...dragStart };
});
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (dragStart) dragCurrent = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('mouseup', e => {
  if (!dragStart) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const mass = Math.max(3, Math.min(80, dist * 0.5 + 5));
  const launchAngle = Math.atan2(dy, dx);
  const launchSpeed = dist * 0.04;
  const color = palette[Math.floor(Math.random() * palette.length)];
  const body = new Body(
    dragStart.x, dragStart.y,
    Math.cos(launchAngle) * launchSpeed,
    Math.sin(launchAngle) * launchSpeed,
    mass, color
  );
  bodies.push(body);
  dragStart = null;
  dragCurrent = null;
  spawnParticles(body.x, body.y, body.color, 12);
  // Hide hint after first body
  document.getElementById('hint').style.opacity = '0';
});
canvas.addEventListener('wheel', e => {
  timeScale = Math.max(0.1, Math.min(3, timeScale - e.deltaY * 0.001));
  document.getElementById('sFps').textContent = timeScale.toFixed(1) + 'x';
});

// Touch
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  dragStart = { x: t.clientX, y: t.clientY, time: Date.now() };
  dragCurrent = { ...dragStart };
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  const t = e.touches[0];
  dragCurrent = { x: t.clientX, y: t.clientY };
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  canvas.dispatchEvent(new MouseEvent('mouseup', {
    clientX: dragCurrent ? dragCurrent.x : dragStart.x,
    clientY: dragCurrent ? dragCurrent.y : dragStart.y
  }));
});

// Buttons
document.getElementById('bClear').onclick = () => {
  bodies = []; particles = [];
};
document.getElementById('bTrails').onclick = function() {
  trails = !trails;
  this.classList.toggle('active', trails);
  document.getElementById('sTrails').textContent = trails ? 'ON' : 'OFF';
};
document.getElementById('bMerge').onclick = function() {
  mergeOn = !mergeOn;
  this.classList.toggle('active', mergeOn);
};
document.getElementById('bGrid').onclick = function() {
  showGrid = !showGrid;
  this.classList.toggle('active', showGrid);
};
document.getElementById('bPause').onclick = function() {
  paused = !paused;
  this.textContent = paused ? 'Resume' : 'Pause';
  this.classList.toggle('active', paused);
};

// Preset: solar system
function spawnSolarSystem() {
  const cx = centerX, cy = centerY;
  // Sun
  bodies.push(new Body(cx, cy, 0, 0, 150, [255, 200, 60]));
  // Planets
  const planets = [
    { dist: 80, mass: 8, speed: 1.3, color: [180, 180, 200] },
    { dist: 130, mass: 14, speed: 0.95, color: [255, 160, 80] },
    { dist: 190, mass: 20, speed: 0.7, color: [80, 180, 255] },
    { dist: 260, mass: 35, speed: 0.5, color: [255, 140, 100] },
  ];
  for (const p of planets) {
    const angle = Math.random() * Math.PI * 2;
    bodies.push(new Body(
      cx + Math.cos(angle) * p.dist, cy + Math.sin(angle) * p.dist,
      -Math.sin(angle) * p.speed, Math.cos(angle) * p.speed,
      p.mass, p.color
    ));
  }
}
setTimeout(spawnSolarSystem, 300);

// Background stars
const stars = [];
for (let i = 0; i < 200; i++) {
  stars.push({
    x: Math.random() * 3000 - 500, y: Math.random() * 2000 - 200,
    size: Math.random() * 1.2, alpha: Math.random() * 0.5 + 0.1
  });
}
function drawStars() {
  for (const s of stars) {
    const sx = s.x % W; const sy = s.y % H;
    ctx.beginPath();
    ctx.arc(sx < 0 ? sx + W : sx, sy < 0 ? sy + H : sy, s.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,210,240,${s.alpha})`;
    ctx.fill();
  }
}
function drawDragLine() {
  if (!dragStart || !dragCurrent) return;
  const dx = dragCurrent.x - dragStart.x;
  const dy = dragCurrent.y - dragStart.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  // Direction arrow
  ctx.beginPath();
  ctx.moveTo(dragStart.x, dragStart.y);
  ctx.lineTo(dragCurrent.x, dragCurrent.y);
  ctx.strokeStyle = 'rgba(160,200,255,0.5)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
  // Mass preview circle
  const previewMass = Math.max(3, Math.min(80, dist * 0.5 + 5));
  const previewR = Math.max(2, Math.pow(previewMass, 0.4) * 2.5);
  ctx.beginPath();
  ctx.arc(dragStart.x, dragStart.y, previewR, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(200,220,255,0.6)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // Launch direction arrow
  if (dist > 10) {
    const angle = Math.atan2(dy, dx);
    const arrowLen = 20;
    const ax = dragCurrent.x + Math.cos(angle) * arrowLen;
    const ay = dragCurrent.y + Math.sin(angle) * arrowLen;
    ctx.beginPath();
    ctx.moveTo(dragCurrent.x, dragCurrent.y);
    ctx.lineTo(ax, ay);
    ctx.strokeStyle = 'rgba(255,200,100,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Arrowhead
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - Math.cos(angle - 0.4) * 8, ay - Math.sin(angle - 0.4) * 8);
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - Math.cos(angle + 0.4) * 8, ay - Math.sin(angle + 0.4) * 8);
    ctx.stroke();
  }
}
function drawGrid() {
  if (!showGrid) return;
  ctx.strokeStyle = 'rgba(60,80,140,0.12)';
  ctx.lineWidth = 1;
  const spacing = 100;
  for (let x = spacing; x < W; x += spacing) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = spacing; y < H; y += spacing) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

// Loop
let lastTime = performance.now();
let frameCount = 0, fpsTime = 0, currentFps = 60;
function loop(now) {
  requestAnimationFrame(loop);
  const rawDt = (now - lastTime) / 16.67;
  lastTime = now;
  const dt = Math.min(rawDt, 3) * timeScale;
  // FPS
  frameCount++;
  fpsTime += rawDt;
  if (fpsTime > 30) {
    currentFps = Math.round(frameCount / fpsTime * 60);
    frameCount = 0; fpsTime = 0;
  }
  // Update
  if (!paused) {
    for (const b of bodies) b.update(dt);
    resolveMerges();
    updateParticles(dt);
  }
  // Draw
  ctx.fillStyle = 'rgba(5,6,15,0.18)';
  ctx.fillRect(0, 0, W, H);
  drawStars();
  drawGrid();
  for (const b of bodies) b.draw();
  drawParticles();
  drawDragLine();
  // HUD
  document.getElementById('sBodies').textContent = bodies.length;
  document.getElementById('sFps').textContent = currentFps;
  if (dragStart && dragCurrent) {
    const dx = dragCurrent.x - dragStart.x;
    const dy = dragCurrent.y - dragStart.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const m = Math.max(3, Math.min(80, dist * 0.5 + 5));
    document.getElementById('sMass').textContent = m.toFixed(0) + ' kg';
  } else {
    document.getElementById('sMass').textContent = '--';
  }
}
requestAnimationFrame(loop);

// Keyboard
window.addEventListener('keydown', e => {
  if (e.key === 'c' || e.key === 'C') { bodies = []; particles = []; }
  if (e.key === ' ') { e.preventDefault(); paused = !paused; document.getElementById('bPause').click(); }
  if (e.key === 't' || e.key === 'T') document.getElementById('bTrails').click();
  if (e.key === 'g' || e.key === 'G') document.getElementById('bGrid').click();
});
</script>
</body>
</html>
