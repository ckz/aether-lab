<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Sandbox</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e0e0e0;
    height: 100vh;
    width: 100vw;
  }
  canvas { display: block; cursor: crosshair; }
  .hud {
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(10, 10, 20, 0.85);
    border: 1px solid rgba(100, 140, 255, 0.3);
    border-radius: 12px;
    padding: 16px 20px;
    backdrop-filter: blur(10px);
    z-index: 10;
    min-width: 220px;
  }
  .hud h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #6e9fff;
    margin-bottom: 10px;
  }
  .hud .stat {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 6px;
    color: #aaa;
  }
  .hud .stat span { color: #fff; font-weight: 600; }
  .hud .controls {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(100, 140, 255, 0.2);
    font-size: 11px;
    color: #777;
    line-height: 1.7;
  }
  .hud .controls kbd {
    background: rgba(100, 140, 255, 0.15);
    border: 1px solid rgba(100, 140, 255, 0.3);
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 10px;
    color: #6e9fff;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 10, 20, 0.9);
    border: 1px solid rgba(100, 140, 255, 0.3);
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 13px;
    color: #6e9fff;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
    z-index: 20;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="sandbox"></canvas>

<div class="hud">
  <h2>🌌 Gravity Sandbox</h2>
  <div class="stat">Bodies: <span id="count">0</span></div>
  <div class="stat">FPS: <span id="fps">0</span></div>
  <div class="stat">Gravity: <span id="gravMode">ON</span></div>
  <div class="controls">
    <kbd>Click</kbd> + drag to launch<br>
    <kbd>Shift</kbd>+click for planet mode<br>
    <kbd>G</kbd> toggle gravity<br>
    <kbd>C</kbd> clear all<br>
    <kbd>Space</kbd> pause/resume<br>
    <kbd>1-3</kbd> change palette
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const canvas = document.getElementById('sandbox');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// State
let bodies = [];
let gravityOn = true;
let paused = false;
let paletteIdx = 0;
let mouse = { x: 0, y: 0, down: false, startX: 0, startY: 0 };
let fps = 0, frameCount = 0, lastFpsTime = performance.now();

const palettes = [
  ['#6e9fff', '#ff6eb4', '#6effc8', '#ffdd6e', '#c06eff', '#ff9f6e'],
  ['#ff4444', '#ff8844', '#ffcc44', '#44ff44', '#4488ff', '#cc44ff'],
  ['#00ffcc', '#00ccff', '#4488ff', '#8844ff', '#cc44ff', '#ff44aa']
];

const G = 0.15;
const TRAIL_LENGTH = 35;
const SOFTENING = 8;

class Body {
  constructor(x, y, vx, vy, mass, isPlanet) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.mass = mass;
    this.radius = isPlanet ? 8 + mass * 0.3 : 2 + Math.sqrt(mass) * 1.2;
    this.isPlanet = isPlanet;
    this.trail = [];
    this.life = 1.0;
    this.hue = Math.random() * 360;
    this.age = 0;
    const pal = palettes[paletteIdx];
    this.color = pal[Math.floor(Math.random() * pal.length)];
    this.glowColor = this.color + '44';
  }

  update(dt) {
    if (!paused) {
      // Gravity
      if (gravityOn) {
        for (let other of bodies) {
          if (other === this) continue;
          let dx = other.x - this.x;
          let dy = other.y - this.y;
          let distSq = dx * dx + dy * dy + SOFTENING;
          let dist = Math.sqrt(distSq);
          let force = G * other.mass / distSq;
          this.vx += force * dx / dist;
          this.vy += force * dy / dist;
        }
      }
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > TRAIL_LENGTH) this.trail.shift();
    }
    this.age++;
  }

  draw(ctx) {
    // Trail
    if (this.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.strokeStyle = this.color + '40';
      ctx.lineWidth = this.radius * 0.5;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // Glow
    const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 3);
    glow.addColorStop(0, this.color + '88');
    glow.addColorStop(1, this.color + '00');
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 3, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    // Core
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();

    // Bright center
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }

  boundsCheck() {
    const margin = 200;
    if (this.x < -margin || this.x > W + margin || this.y < -margin || this.y > H + margin) {
      return false;
    }
    return true;
  }
}

// Background stars
const stars = [];
for (let i = 0; i < 150; i++) {
  stars.push({
    x: Math.random() * 2000,
    y: Math.random() * 2000,
    r: Math.random() * 1.2,
    twinkle: Math.random() * Math.PI * 2,
    speed: 0.01 + Math.random() * 0.03
  });
}

function drawStars() {
  for (let s of stars) {
    s.twinkle += s.speed;
    const alpha = 0.3 + Math.sin(s.twinkle) * 0.3;
    ctx.beginPath();
    ctx.arc(s.x % W, s.y % H, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200, 220, 255, ${alpha})`;
    ctx.fill();
  }
}

// Input
canvas.addEventListener('mousedown', (e) => {
  mouse.down = true;
  mouse.startX = e.clientX;
  mouse.startY = e.clientY;
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

canvas.addEventListener('mouseup', (e) => {
  if (!mouse.down) return;
  mouse.down = false;
  const dx = mouse.startX - e.clientX;
  const dy = mouse.startY - e.clientY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const speed = dist * 0.04;
  const angle = Math.atan2(dy, dx);
  const vx = Math.cos(angle) * speed;
  const vy = Math.sin(angle) * speed;
  const mass = e.shiftKey ? 30 + Math.random() * 50 : 3 + Math.random() * 12;
  const isPlanet = e.shiftKey;
  bodies.push(new Body(mouse.startX, mouse.startY, vx, vy, mass, isPlanet));
  updateCount();
  if (isPlanet) showToast('🪐 Planet launched!');
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.down = true;
  mouse.startX = t.clientX;
  mouse.startY = t.clientY;
  mouse.x = t.clientX;
  mouse.y = t.clientY;
});
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX;
  mouse.y = t.clientY;
});
canvas.addEventListener('touchend', (e) => {
  if (!mouse.down) return;
  mouse.down = false;
  const dx = mouse.startX - mouse.x;
  const dy = mouse.startY - mouse.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const speed = dist * 0.04;
  const angle = Math.atan2(dy, dx);
  bodies.push(new Body(mouse.startX, mouse.startY, Math.cos(angle) * speed, Math.sin(angle) * speed, 3 + Math.random() * 12, false));
  updateCount();
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'g' || e.key === 'G') {
    gravityOn = !gravityOn;
    document.getElementById('gravMode').textContent = gravityOn ? 'ON' : 'OFF';
    showToast(gravityOn ? '🌍 Gravity: ON' : '🚀 Gravity: OFF');
  }
  if (e.key === 'c' || e.key === 'C') {
    bodies = [];
    updateCount();
    showToast('✨ Cleared');
  }
  if (e.key === ' ') {
    e.preventDefault();
    paused = !paused;
    showToast(paused ? '⏸ Paused' : '▶ Running');
  }
  if (e.key >= '1' && e.key <= '3') {
    paletteIdx = parseInt(e.key) - 1;
    bodies.forEach(b => {
      const pal = palettes[paletteIdx];
      b.color = pal[Math.floor(Math.random() * pal.length)];
    });
    showToast('🎨 Palette ' + e.key);
  }
});

function updateCount() {
  document.getElementById('count').textContent = bodies.length;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 1500);
}

// Launch line preview
function drawLaunchLine() {
  if (!mouse.down) return;
  ctx.beginPath();
  ctx.moveTo(mouse.startX, mouse.startY);
  ctx.lineTo(mouse.x, mouse.y);
  ctx.strokeStyle = 'rgba(110, 159, 255, 0.6)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Arrow head
  const dx = mouse.startX - mouse.x;
  const dy = mouse.startY - mouse.y;
  const angle = Math.atan2(dy, dx);
  const arrowSize = 10;
  ctx.beginPath();
  ctx.moveTo(mouse.startX, mouse.startY);
  ctx.lineTo(mouse.startX + Math.cos(angle) * arrowSize, mouse.startY + Math.sin(angle) * arrowSize);
  ctx.strokeStyle = 'rgba(110, 159, 255, 0.8)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Preview dot
  ctx.beginPath();
  ctx.arc(mouse.startX, mouse.startY, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#6e9fff';
  ctx.fill();
}

// Main loop
let lastTime = performance.now();
function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - lastTime) / 16.67, 3);
  lastTime = now;

  // FPS
  frameCount++;
  if (now - lastFpsTime >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastFpsTime = now;
    document.getElementById('fps').textContent = fps;
  }

  // Clear with fade
  ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
  ctx.fillRect(0, 0, W, H);

  drawStars();

  // Update and draw bodies
  bodies = bodies.filter(b => b.boundsCheck());
  for (let b of bodies) {
    b.update(dt);
    b.draw(ctx);
  }

  drawLaunchLine();
  updateCount();
}

// Start with a demo system
function createDemoSystem() {
  const cx = W / 2, cy = H / 2;
  // Central star
  bodies.push(new Body(cx, cy, 0, 0, 200, true));
  bodies[bodies.length - 1].radius = 14;
  bodies[bodies.length - 1].color = '#ffdd6e';

  // Orbiting bodies
  const orbits = [
    { dist: 100, speed: 1.2, mass: 8 },
    { dist: 160, speed: 0.8, mass: 12 },
    { dist: 220, speed: 0.55, mass: 6 },
    { dist: 280, speed: 0.4, mass: 18 }
  ];

  orbits.forEach((o, i) => {
    const angle = (i / orbits.length) * Math.PI * 2;
    const x = cx + Math.cos(angle) * o.dist;
    const y = cy + Math.sin(angle) * o.dist;
    const vx = -Math.sin(angle) * o.speed;
    const vy = Math.cos(angle) * o.speed;
    bodies.push(new Body(x, y, vx, vy, o.mass, false));
  });

  updateCount();
  showToast('🌟 Demo system ready — click to add!');
}

createDemoSystem();
requestAnimationFrame(animate);
</script>
</body>
</html>
