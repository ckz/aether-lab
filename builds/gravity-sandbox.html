<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether's Gravity Sandbox</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  color: #e0e0ff;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  height: 100vh;
}
#canvas {
  display: block;
  cursor: crosshair;
  position: absolute;
  top: 0;
  left: 0;
}
#ui {
  position: absolute;
  top: 16px;
  left: 16px;
  background: rgba(10, 10, 20, 0.85);
  border: 1px solid rgba(100, 140, 255, 0.3);
  border-radius: 8px;
  padding: 14px 18px;
  font-size: 13px;
  z-index: 10;
  backdrop-filter: blur(8px);
  max-width: 280px;
}
#ui h1 {
  font-size: 16px;
  color: #7ab4ff;
  margin-bottom: 8px;
  letter-spacing: 1px;
}
#ui .row {
  margin: 5px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#ui label { color: #aaa; font-size: 12px; }
#ui input[type=range] { width: 120px; accent-color: #7ab4ff; }
#ui button {
  background: rgba(100, 140, 255, 0.2);
  border: 1px solid rgba(100, 140, 255, 0.4);
  color: #7ab4ff;
  padding: 5px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  margin: 2px;
  transition: all 0.2s;
}
#ui button:hover { background: rgba(100, 140, 255, 0.4); }
#ui button.active { background: rgba(100, 140, 255, 0.5); }
#stats {
  position: absolute;
  top: 16px;
  right: 16px;
  background: rgba(10, 10, 20, 0.85);
  border: 1px solid rgba(100, 140, 255, 0.3);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px;
  z-index: 10;
  color: #7ab4ff;
  backdrop-filter: blur(8px);
}
#hint {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(160, 180, 220, 0.6);
  font-size: 12px;
  z-index: 10;
  text-align: center;
  pointer-events: none;
}
.color-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="ui">
  <h1>✦ Aether's Gravity Sandbox ✦</h1>
  <div class="row">
    <label>Gravity</label>
    <input type="range" id="gravity" min="0" max="2" step="0.05" value="0.5">
  </div>
  <div class="row">
    <label>Trail</label>
    <input type="range" id="trail" min="0" max="0.3" step="0.01" value="0.08">
  </div>
  <div class="row">
    <label>Bounce</label>
    <input type="range" id="bounce" min="0.1" max="1.5" step="0.05" value="0.8">
  </div>
  <div class="row" style="margin-top:8px;">
    <label>Mode:</label>
  </div>
  <div class="row">
    <button id="modeAttract" class="active">Attract</button>
    <button id="modeRepel">Repel</button>
    <button id="modeVortex">Vortex</button>
  </div>
  <div class="row" style="margin-top:6px;">
    <button id="clearAll">Clear All</button>
    <button id="spawnBurst">Burst +50</button>
  </div>
</div>

<div id="stats">
  Particles: <span id="particleCount">0</span><br>
  FPS: <span id="fps">0</span>
</div>

<div id="hint">Click & drag to spawn • Right-click to attract • Hold Shift for vortex mode</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const particles = [];
const MAX_PARTICLES = 2000;

// Hue palette cycles through beautiful colors
const palette = [
  { h: 210, s: 80, l: 65 }, // soft blue
  { h: 260, s: 70, l: 60 }, // purple
  { h: 180, s: 75, l: 55 }, // teal
  { h: 320, s: 65, l: 65 }, // pink
  { h: 40, s: 80, l: 60 },   // gold
  { h: 150, s: 70, l: 55 },  // green
];

function createParticle(x, y, vx = 0, vy = 0) {
  if (particles.length >= MAX_PARTICLES) return;
  const color = palette[Math.floor(Math.random() * palette.length)];
  const hueShift = (Math.random() - 0.5) * 30;
  particles.push({
    x, y,
    vx: vx + (Math.random() - 0.5) * 2,
    vy: vy + (Math.random() - 0.5) * 2,
    radius: Math.random() * 2.5 + 1.2,
    life: 1,
    decay: Math.random() * 0.0008 + 0.0002,
    h: color.h + hueShift,
    s: color.s,
    l: color.l,
  });
}

// Mouse state
const mouse = { x: W/2, y: H/2, down: false, right: false, shift: false };
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 0) mouse.down = true;
  if (e.button === 2) mouse.right = true;
});
canvas.addEventListener('mouseup', (e) => {
  if (e.button === 0) mouse.down = false;
  if (e.button === 2) mouse.right = false;
});
canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('keydown', (e) => { if (e.key === 'Shift') mouse.shift = true; });
canvas.addEventListener('keyup', (e) => { if (e.key === 'Shift') mouse.shift = false; });

// Touch support
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  mouse.down = true;
  const t = e.touches[0];
  mouse.x = t.clientX;
  mouse.y = t.clientY;
});
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX;
  mouse.y = t.clientY;
});
canvas.addEventListener('touchend', () => { mouse.down = false; });

// Controls
const controls = {
  gravity: document.getElementById('gravity'),
  trail: document.getElementById('trail'),
  bounce: document.getElementById('bounce'),
};
let mode = 'attract'; // attract | repel | vortex
document.getElementById('modeAttract').onclick = () => setMode('attract');
document.getElementById('modeRepel').onclick = () => setMode('repel');
document.getElementById('modeVortex').onclick = () => setMode('vortex');
function setMode(m) {
  mode = m;
  document.querySelectorAll('#ui button').forEach(b => b.classList.remove('active'));
  document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1)).classList.add('active');
}
document.getElementById('clearAll').onclick = () => particles.length = 0;
document.getElementById('spawnBurst').onclick = () => {
  const cx = W/2 + (Math.random() - 0.5) * 300;
  const cy = H/2 + (Math.random() - 0.5) * 300;
  for (let i = 0; i < 50; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 4 + 1;
    createParticle(cx, cy, Math.cos(a) * s, Math.sin(a) * s);
  }
};

// FPS
let frameCount = 0, lastFpsUpdate = performance.now(), fps = 0;

function animate(time) {
  // FPS
  frameCount++;
  if (time - lastFpsUpdate >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastFpsUpdate = time;
  }

  const gravity = parseFloat(controls.gravity.value);
  const trail = parseFloat(controls.trail.value);
  const bounce = parseFloat(controls.bounce.value);

  // Trail effect
  ctx.fillStyle = `rgba(10, 10, 18, ${trail})`;
  ctx.fillRect(0, 0, W, H);

  // Spawn on drag
  if (mouse.down && particles.length < MAX_PARTICLES) {
    for (let i = 0; i < 3; i++) {
      createParticle(mouse.x, mouse.y);
    }
  }

  // Update & draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    // Mouse interaction
    if (mouse.down || mouse.right) {
      const dx = mouse.x - p.x;
      const dy = mouse.y - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 0.01;
      const force = Math.min(800 / (dist * dist), 3);
      const nx = dx / dist;
      const ny = dy / dist;

      let fx = 0, fy = 0;
      if (mouse.shift || mode === 'vortex') {
        // Perpendicular force (vortex)
        fx = -ny * force * 1.5;
        fy = nx * force * 1.5;
        // Pull in slightly
        fx += nx * force * 0.3;
        fy += ny * force * 0.3;
      } else if (mode === 'attract') {
        fx = nx * force;
        fy = ny * force;
      } else if (mode === 'repel') {
        fx = -nx * force * 1.3;
        fy = -ny * force * 1.3;
      }
      p.vx += fx;
      p.vy += fy;
    }

    // Gravity
    p.vy += gravity * 0.15;

    // Damping
    p.vx *= 0.998;
    p.vy *= 0.998;

    // Move
    p.x += p.vx;
    p.y += p.vy;

    // Bounce off walls
    if (p.x < p.radius) { p.x = p.radius; p.vx *= -bounce; }
    if (p.x > W - p.radius) { p.x = W - p.radius; p.vx *= -bounce; }
    if (p.y < p.radius) { p.y = p.radius; p.vy *= -bounce; }
    if (p.y > H - p.radius) { p.y = H - p.radius; p.vy *= -bounce; }

    // Life decay
    p.life -= p.decay;

    // Draw glow
    const alpha = p.life * 0.9;
    const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 6);
    glow.addColorStop(0, `hsla(${p.h}, ${p.s}%, ${p.l}%, ${alpha})`);
    glow.addColorStop(0.4, `hsla(${p.h}, ${p.s}%, ${p.l}%, ${alpha * 0.4})`);
    glow.addColorStop(1, `hsla(${p.h}, ${p.s}%, ${p.l}%, 0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius * 6, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = `hsla(${p.h}, ${p.s}%, ${Math.min(p.l + 20, 95)}%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();

    // Remove dead
    if (p.life <= 0 || p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) {
      particles.splice(i, 1);
    }
  }

  // Update UI
  document.getElementById('particleCount').textContent = particles.length;
  document.getElementById('fps').textContent = fps;

  requestAnimationFrame(animate);
}

// Initial burst
setTimeout(() => {
  for (let i = 0; i < 80; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H * 0.6;
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 3 + 0.5;
    createParticle(x, y, Math.cos(a) * s, Math.sin(a) * s);
  }
}, 100);

requestAnimationFrame(animate);
</script>
</body>
</html>
