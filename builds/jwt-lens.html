<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JWT LENS — Token Debugger</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent2: #bc8cff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --orange: #db6d28;
    --cyan: #39d353;
    --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
    --font-sans: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(88,166,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(88,166,255,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2.5rem 1rem 1rem;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(88,166,255,0.05), transparent);
  }

  header h1 {
    font-family: var(--font-mono);
    font-size: 2rem;
    letter-spacing: 0.15em;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 0.3rem;
    letter-spacing: 0.05em;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1rem;
  }

  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }

  .input-section label {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.85rem;
    padding: 1rem;
    resize: vertical;
    min-height: 80px;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: var(--accent); }

  .actions {
    display: flex;
    gap: 0.75rem;
    margin-top: 1rem;
    flex-wrap: wrap;
  }

  button {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }

  button:hover {
    border-color: var(--accent);
    background: rgba(88,166,255,0.1);
    transform: translateY(-1px);
  }

  button.primary {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: 600;
  }

  button.primary:hover {
    background: #79b8ff;
    border-color: #79b8ff;
  }

  .examples {
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }

  .examples-title {
    font-size: 0.75rem;
    color: var(--muted);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.5rem;
  }

  .example-chip {
    display: inline-block;
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 0.3rem 0.7rem;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--muted);
    cursor: pointer;
    margin: 0.25rem 0.25rem 0.25rem 0;
    transition: all 0.2s;
  }

  .example-chip:hover {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(188,140,255,0.05);
  }

  /* Status bar */
  .status-bar {
    display: none;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    margin-bottom: 1.5rem;
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }

  .status-bar.valid {
    display: flex;
    background: rgba(63,185,80,0.1);
    border: 1px solid rgba(63,185,80,0.3);
    color: var(--green);
  }

  .status-bar.invalid {
    display: flex;
    background: rgba(248,81,73,0.1);
    border: 1px solid rgba(248,81,73,0.3);
    color: var(--red);
  }

  .status-icon { font-size: 1.2rem; }
  .status-detail { color: var(--muted); font-size: 0.75rem; margin-left: auto; }

  /* Token parts */
  .token-parts {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }

  @media (min-width: 768px) {
    .token-parts { grid-template-columns: 1fr 1fr; }
  }

  .part-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .part-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1rem;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .part-header .part-label { color: var(--accent); }
  .part-header .part-badge {
    background: var(--bg);
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    color: var(--muted);
    font-size: 0.7rem;
  }

  .part-header.signature .part-label { color: var(--accent2); }
  .part-header.payload .part-label { color: var(--green); }

  .copy-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 0.7rem;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s;
  }

  .copy-btn:hover { opacity: 1; color: var(--accent); }

  .part-body {
    padding: 1rem;
    max-height: 500px;
    overflow-y: auto;
  }

  .part-body pre {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-all;
  }

  /* JSON syntax colors */
  .json-key { color: var(--accent); }
  .json-string { color: var(--green); }
  .json-number { color: var(--orange); }
  .json-bool { color: var(--accent2); }
  .json-null { color: var(--muted); }
  .json-bracket { color: var(--muted); }

  .signature-value {
    font-size: 0.75rem;
    color: var(--muted);
    word-break: break-all;
    line-height: 1.6;
  }

  .raw-token {
    color: var(--muted);
    font-size: 0.7rem;
    word-break: break-all;
    line-height: 1.6;
  }

  /* Claims highlight */
  .claim-highlight {
    background: rgba(210,153,34,0.15);
    border-left: 3px solid var(--yellow);
    padding: 0.5rem 0.75rem;
    margin: 0.75rem 0;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.8rem;
  }

  .claim-highlight.expired {
    background: rgba(248,81,73,0.1);
    border-left-color: var(--red);
  }

  .claim-highlight.warning {
    background: rgba(210,153,34,0.1);
    border-left-color: var(--yellow);
  }

  .claim-label {
    color: var(--yellow);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.2rem;
  }

  .expired .claim-label { color: var(--red); }
  .warning .claim-label { color: var(--yellow); }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
  }

  .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }
  .empty-state p { font-size: 0.9rem; }

  .hidden { display: none !important; }

  footer {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-size: 0.75rem;
    font-family: var(--font-mono);
    border-top: 1px solid var(--border);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  .copy-toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--green);
    color: #000;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }

  .copy-toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>⟡ JWT LENS ⟡</h1>
  <p>Token debugger · Decode · Inspect · Understand</p>
</header>

<div class="container">
  <!-- Input Section -->
  <div class="input-section">
    <label>🔑 Paste JWT Token</label>
    <textarea id="jwtInput" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"></textarea>

    <div class="actions">
      <button class="primary" onclick="decodeJWT()">⚡ Decode</button>
      <button onclick="clearAll()">✕ Clear</button>
      <button onclick="fillExample('standard')">📋 Example: Standard</button>
      <button onclick="fillExample('github')">🐙 Example: GitHub</button>
      <button onclick="fillExample('expired')">⏰ Example: Expired</button>
    </div>

    <div class="examples">
      <div class="examples-title">Quick Examples</div>
      <span class="example-chip" onclick="fillExample('standard')">Standard JWT</span>
      <span class="example-chip" onclick="fillExample('github')">GitHub-style</span>
      <span class="example-chip" onclick="fillExample('expired')">Expired Token</span>
      <span class="example-chip" onclick="fillExample('custom')">Custom Claims</span>
    </div>
  </div>

  <!-- Status Bar -->
  <div id="statusBar" class="status-bar">
    <span class="status-icon" id="statusIcon"></span>
    <span id="statusText"></span>
    <span class="status-detail" id="statusDetail"></span>
  </div>

  <!-- Token Parts -->
  <div id="tokenParts" class="token-parts">
    <!-- Empty state -->
    <div class="empty-state" id="emptyState" style="grid-column: 1 / -1;">
      <div class="icon">🔍</div>
      <p>Paste a JWT token and hit <strong>Decode</strong> to inspect it</p>
    </div>
  </div>
</div>

<footer>
  JWT LENS · Works offline · No data leaves your browser
</footer>

<div id="copyToast" class="copy-toast">✓ Copied!</div>

<script>
  // Base64 URL decode
  function base64UrlDecode(str) {
    let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    try {
      return JSON.parse(decodeURIComponent(atob(b64).split('').map(c =>
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join('')));
    } catch (e) {
      return JSON.parse(atob(b64));
    }
  }

  // Syntax highlight JSON
  function highlightJSON(obj, indent = 0) {
    const pad = '  '.repeat(indent);
    const pad2 = '  '.repeat(indent + 1);

    if (obj === null) return '<span class="json-null">null</span>';
    if (typeof obj === 'boolean') return `<span class="json-bool">${obj}</span>`;
    if (typeof obj === 'number') return `<span class="json-number">${obj}</span>`;
    if (typeof obj === 'string') {
      const escaped = obj.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return `<span class="json-string">"${escaped}"</span>`;
    }

    if (Array.isArray(obj)) {
      if (obj.length === 0) return '<span class="json-bracket">[]</span>';
      const items = obj.map(v => pad2 + highlightJSON(v, indent + 1));
      return `<span class="json-bracket">[</span>\n${items.join(',\n')}\n${pad}<span class="json-bracket">]</span>`;
    }

    if (typeof obj === 'object') {
      const keys = Object.keys(obj);
      if (keys.length === 0) return '<span class="json-bracket">{}</span>';
      const entries = keys.map(k => {
        const key = `<span class="json-key">"${k}"</span>`;
        const val = highlightJSON(obj[k], indent + 1);
        return `${pad2}${key}: ${val}`;
      });
      return `<span class="json-bracket">{</span>\n${entries.join(',\n')}\n${pad}<span class="json-bracket">}</span>`;
    }

    return String(obj);
  }

  function formatTimestamp(ts) {
    const d = new Date(ts * 1000);
    return d.toUTCString();
  }

  function timeAgo(ts) {
    const diff = ts - Math.floor(Date.now() / 1000);
    if (diff < 0) return `expired ${timeAgoAbs(Math.abs(diff))} ago`;
    return `expires in ${timeAgoAbs(diff)}`;
  }

  function timeAgoAbs(seconds) {
    if (seconds < 60) return `${seconds}s`;
    if (seconds < 3600) return `${Math.floor(seconds / 60)}m`;
    if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ${Math.floor((seconds % 3600) / 60)}m`;
    return `${Math.floor(seconds / 86400)}d ${Math.floor((seconds % 86400) / 3600)}h`;
  }

  function showToast(msg) {
    const toast = document.getElementById('copyToast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  }

  function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => showToast('✓ Copied!'));
  }

  function decodeJWT() {
    const input = document.getElementById('jwtInput').value.trim();
    const parts = input.split('.');

    if (parts.length !== 3) {
      showStatus('invalid', '❌ Invalid Token', 'A JWT must have 3 parts separated by dots');
      return;
    }

    let header, payload;
    try {
      header = base64UrlDecode(parts[0]);
      payload = base64UrlDecode(parts[1]);
    } catch (e) {
      showStatus('invalid', '❌ Decode Failed', 'Could not parse token parts as JSON');
      return;
    }

    // Validate structure
    if (!header.alg) {
      showStatus('invalid', '⚠️ Missing Algorithm', 'Header has no "alg" claim');
      return;
    }

    // Check expiry
    const now = Math.floor(Date.now() / 1000);
    let expiryStatus = 'valid';
    let expiryDetail = '';

    if (payload.exp) {
      if (payload.exp < now) {
        expiryStatus = 'expired';
        expiryDetail = `Expired ${timeAgoAbs(now - payload.exp)} ago`;
      } else if (payload.exp < now + 3600) {
        expiryStatus = 'warning';
        expiryDetail = `Expires in ${timeAgoAbs(payload.exp - now)}`;
      } else {
        expiryDetail = timeAgo(payload.exp);
      }
    }

    if (payload.nbf && payload.nbf > now) {
      expiryStatus = 'warning';
      expiryDetail += ' · Not yet valid';
    }

    const statusIcon = expiryStatus === 'expired' ? '🔴' : expiryStatus === 'warning' ? '🟡' : '🟢';
    const statusText = expiryStatus === 'expired' ? 'Token Expired' :
                       expiryStatus === 'warning' ? 'Token Expiring Soon' : 'Token Valid';
    const statusDetail = expiryDetail || `Algorithm: ${header.alg}`;

    showStatus(expiryStatus === 'valid' ? 'valid' : 'invalid', `${statusIcon} ${statusText}`, statusDetail);

    // Build parts display
    const partsDiv = document.getElementById('tokenParts');
    partsDiv.innerHTML = '';

    // Header card
    const headerCard = createPartCard('header', 'Header', header.alg || 'alg', parts[0], header);
    partsDiv.appendChild(headerCard);

    // Payload card (full width on mobile, 2-col on desktop)
    const payloadCard = createPayloadCard(payload, parts[1]);
    partsDiv.appendChild(payloadCard);

    // Signature card
    const sigCard = createPartCard('signature', 'Signature', 'HMAC', parts[2], null, true);
    partsDiv.appendChild(sigCard);
  }

  function showStatus(type, text, detail) {
    const bar = document.getElementById('statusBar');
    bar.className = `status-bar ${type}`;
    document.getElementById('statusText').textContent = text;
    document.getElementById('statusDetail').textContent = detail;
  }

  function createPartCard(type, label, badge, rawValue, data, isSignature) {
    const card = document.createElement('div');
    card.className = 'part-card';

    const headerClass = type === 'signature' ? 'part-header signature' :
                        type === 'payload' ? 'part-header payload' : 'part-header';

    let bodyContent = '';
    if (isSignature) {
      bodyContent = `<div class="signature-value">${rawValue}</div>`;
    } else {
      bodyContent = `<pre>${highlightJSON(data)}</pre>`;
    }

    card.innerHTML = `
      <div class="${headerClass}">
        <div>
          <span class="part-label">${label}</span>
          <span class="part-badge">${badge}</span>
        </div>
        <button class="copy-btn" onclick="copyToClipboard(this.dataset.value)" data-value="${isSignature ? rawValue : JSON.stringify(data, null, 2)}">copy</button>
      </div>
      <div class="part-body">${bodyContent}</div>
    `;

    return card;
  }

  function createPayloadCard(payload, rawValue) {
    const card = document.createElement('div');
    card.className = 'part-card payload-card';
    card.style.gridColumn = '1 / -1';

    let claimsHTML = '';

    // Standard claims highlights
    const standardClaims = [];
    if (payload.sub) standardClaims.push({ key: 'sub', label: 'Subject', value: payload.sub });
    if (payload.iss) standardClaims.push({ key: 'iss', label: 'Issuer', value: payload.iss });
    if (payload.aud) standardClaims.push({ key: 'aud', label: 'Audience', value: Array.isArray(payload.aud) ? payload.aud.join(', ') : payload.aud });
    if (payload.iat) standardClaims.push({ key: 'iat', label: 'Issued At', value: formatTimestamp(payload.iat) });
    if (payload.exp) {
      const now = Math.floor(Date.now() / 1000);
      const isExpired = payload.exp < now;
      const isWarning = payload.exp < now + 3600;
      const cssClass = isExpired ? 'expired' : isWarning ? 'warning' : '';
      standardClaims.push({
        key: 'exp', label: 'Expires',
        value: `${formatTimestamp(payload.exp)} (${timeAgo(payload.exp)})`,
        cssClass
      });
    }
    if (payload.nbf) standardClaims.push({ key: 'nbf', label: 'Not Before', value: formatTimestamp(payload.nbf) });
    if (payload.jti) standardClaims.push({ key: 'jti', label: 'Token ID', value: payload.jti });
    if (payload.scope || payload.scp) standardClaims.push({ key: 'scope', label: 'Scope', value: payload.scope || payload.scp });

    if (standardClaims.length > 0) {
      claimsHTML = '<div style="margin-bottom:1rem;">';
      standardClaims.forEach(c => {
        claimsHTML += `
          <div class="claim-highlight ${c.cssClass || ''}">
            <div class="claim-label">${c.label} (${c.key})</div>
            <div>${c.value}</div>
          </div>
        `;
      });
      claimsHTML += '</div>';
    }

    // Custom claims
    const standardKeys = ['sub','iss','aud','iat','exp','nbf','jti','scope','scp'];
    const customKeys = Object.keys(payload).filter(k => !standardKeys.includes(k));
    const customClaims = customKeys.reduce((o, k) => { o[k] = payload[k]; return o; }, {});

    const customHTML = customKeys.length > 0 ?
      `<pre style="margin-top:1rem; padding-top:1rem; border-top:1px solid var(--border);">${highlightJSON(customClaims)}</pre>` : '';

    card.innerHTML = `
      <div class="part-header payload">
        <div>
          <span class="part-label">Payload</span>
          <span class="part-badge">${Object.keys(payload).length} claims</span>
        </div>
        <button class="copy-btn" onclick="copyToClipboard(JSON.stringify(${JSON.stringify(payload).replace(/"/g, '&quot;')}, null, 2))">copy</button>
      </div>
      <div class="part-body">
        ${claimsHTML}
        ${customHTML}
      </div>
    `;

    return card;
  }

  function clearAll() {
    document.getElementById('jwtInput').value = '';
    document.getElementById('statusBar').className = 'status-bar';
    document.getElementById('tokenParts').innerHTML = `
      <div class="empty-state" id="emptyState" style="grid-column: 1 / -1;">
        <div class="icon">🔍</div>
        <p>Paste a JWT token and hit <strong>Decode</strong> to inspect it</p>
      </div>
    `;
  }

  function fillExample(type) {
    let token;
    switch (type) {
      case 'standard':
        token = createStandardJWT();
        break;
      case 'github':
        token = createGitHubJWT();
        break;
      case 'expired':
        token = createExpiredJWT();
        break;
      case 'custom':
        token = createCustomJWT();
        break;
    }
    document.getElementById('jwtInput').value = token;
    decodeJWT();
  }

  function createStandardJWT() {
    const header = btoa(JSON.stringify({alg: 'HS256', typ: 'JWT'})).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
    const now = Math.floor(Date.now() / 1000);
    const payload = btoa(JSON.stringify({
      sub: '1234567890',
      name: 'John Doe',
      email: 'john@example.com',
      role: 'admin',
      iat: now,
      exp: now + 3600
    })).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
    const sig = btoa('signature-placeholder').replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
    return `${header}.${payload}.${sig}`;
  }

  function createGitHubJWT() {
    const header = btoa(JSON.stringify({alg: 'RS256', typ: 'JWT'})).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
    const now = Math.floor(Date.now() / 1000);
    const payload = btoa(JSON.stringify({
