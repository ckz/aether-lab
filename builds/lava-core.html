<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lava Core — Interactive Metaballs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a14;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #aaa;
    height: 100vh;
    width: 100vw;
  }
  canvas { display: block; cursor: crosshair; }
  .ui {
    position: fixed;
    top: 18px;
    left: 20px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .palette-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .btn {
    background: rgba(20,18,40,.65);
    border: 1px solid rgba(140,120,255,.3);
    color: #b8a8ff;
    padding: 5px 12px;
    font-family: 'Courier New', monospace;
    font-size: .65rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: all .25s;
  }
  .btn:hover, .btn.active {
    background: rgba(100,80,220,.2);
    border-color: rgba(180,150,255,.6);
    color: #e8d8ff;
    box-shadow: 0 0 18px rgba(100,70,220,.2);
  }
  .info {
    position: fixed;
    bottom: 14px;
    left: 20px;
    font-size: .6rem;
    opacity: .35;
    letter-spacing: .15em;
    z-index: 10;
  }
  .title {
    position: fixed;
    top: 16px;
    right: 22px;
    font-size: .75rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: #8878bb;
    opacity: .6;
    z-index: 10;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="title">Lava Core</div>

<div class="ui">
  <div class="palette-row" id="palettes"></div>
  <div class="palette-row" id="controls"></div>
</div>

<div class="info">click &amp; drag to attract · scroll to add/remove · space to pause · r to reset</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  
  let W, H;
  const resize = () => {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  };
  resize();
  window.addEventListener('resize', resize);

  // --- Palettes ---
  const palettes = {
    lava:  ['#ff2200','#ff5500','#ff8800','#ffaa00','#cc1100','#ff3300'],
    ocean: ['#0033aa','#0066dd','#0099ff','#00ccff','#0055cc','#0077ee'],
    alien: ['#00ff66','#33ff99','#66ffcc','#00cc44','#22ff88','#00ffaa'],
    neon:  ['#ff00ff','#ff44ff','#ff66ff','#ff88ff','#dd00dd','#ff22ff'],
    mono:  ['#ffffff','#cccccc','#999999','#bbbbbb','#dddddd','#aaaaaa'],
    toxic: ['#aaff00','#ccff22','#ddff44','#88cc00','#bbff00','#eeff33']
  };
  let currentPalette = 'lava';

  const paletteNames = Object.keys(palettes);
  const palRow = document.getElementById('palettes');
  paletteNames.forEach(name => {
    const b = document.createElement('button');
    b.className = 'btn' + (name === currentPalette ? ' active' : '');
    b.textContent = name;
    b.onclick = () => {
      currentPalette = name;
      document.querySelectorAll('#palettes .btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    };
    palRow.appendChild(b);
  });

  // --- Controls ---
  const controls = [
    { label: 'Slow', speed: 0.3 },
    { label: 'Med', speed: 0.7 },
    { label: 'Fast', speed: 1.4 }
  ];
  let simSpeed = 0.7;
  const ctrlRow = document.getElementById('controls');
  controls.forEach(c => {
    const b = document.createElement('button');
    b.className = 'btn' + (c.speed === simSpeed ? ' active' : '');
    b.textContent = c.label;
    b.onclick = () => {
      simSpeed = c.speed;
      document.querySelectorAll('#controls .btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    };
    ctrlRow.appendChild(b);
  });

  // --- Metaballs ---
  const NUM = 28;
  const balls = [];
  for (let i = 0; i < NUM; i++) {
    balls.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 1.6,
      vy: (Math.random() - 0.5) * 1.6,
      r: 40 + Math.random() * 60
    });
  }

  // Mouse state
  const mouse = { x: -9999, y: -9999, down: false };
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mousedown', () => mouse.down = true);
  window.addEventListener('mouseup', () => mouse.down = false);
  window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; mouse.down = false; });
  window.addEventListener('touchmove', e => {
    const t = e.touches[0];
    mouse.x = t.clientX; mouse.y = t.clientY; mouse.down = true;
  }, { passive: true });
  window.addEventListener('touchend', () => mouse.down = false);

  // Scroll to change count
  window.addEventListener('wheel', e => {
    if (e.target === canvas) {
      const delta = e.deltaY > 0 ? -1 : 1;
      const newCount = Math.max(5, Math.min(60, balls.length + delta));
      while (balls.length < newCount) {
        balls.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 1.6,
          vy: (Math.random() - 0.5) * 1.6,
          r: 40 + Math.random() * 60
        });
      }
      while (balls.length > newCount) balls.pop();
    }
  }, { passive: true });

  // Keyboard
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
    if (e.code === 'KeyR') resetBalls();
  });

  let paused = false;

  const resetBalls = () => {
    balls.forEach(b => {
      b.x = Math.random() * W;
      b.y = Math.random() * H;
      b.vx = (Math.random() - 0.5) * 1.6;
      b.vy = (Math.random() - 0.5) * 1.6;
    });
  };

  // --- Pixel-level metaball field ---
  // Render at lower resolution for speed, upscale
  const RENDER_SCALE = 4;
  let fieldCanvas = document.createElement('canvas');
  let fieldCtx = fieldCanvas.getContext('2d');
  let fieldW, fieldH;

  const updateFieldSize = () => {
    fieldW = Math.ceil(W / RENDER_SCALE);
    fieldH = Math.ceil(H / RENDER_SCALE);
    fieldCanvas.width = fieldW;
    fieldCanvas.height = fieldH;
  };
  updateFieldSize();
  window.addEventListener('resize', updateFieldSize);

  // ImageData for thresholding
  let imgData, data;
  const initImgData = () => {
    imgData = fieldCtx.createImageData(fieldW, fieldH);
    data = imgData.data;
  };
  initImgData();

  const blendColor = (hex1, hex2, t) => {
    const r1 = parseInt(hex1.slice(1,3),16), g1 = parseInt(hex1.slice(3,5),16), b1 = parseInt(hex1.slice(5,7),16);
    const r2 = parseInt(hex2.slice(1,3),16), g2 = parseInt(hex2.slice(3,5),16), b2 = parseInt(hex2.slice(5,7),16);
    const r = Math.round(r1 + (r2-r1)*t), g = Math.round(g1 + (g2-g1)*t), b = Math.round(b1 + (b2-b1)*t);
    return [r, g, b];
  };

  const hexToRgb = (hex) => [
    parseInt(hex.slice(1,3),16),
    parseInt(hex.slice(3,5),16),
    parseInt(hex.slice(5,7),16)
  ];

  const animate = () => {
    if (!paused) {
      // Update balls
      balls.forEach(b => {
        if (mouse.x > -999) {
          const dx = mouse.x - b.x, dy = mouse.y - b.y;
          const dist = Math.hypot(dx, dy);
          const force = mouse.down ? 0.9 : 0.15;
          if (dist < 350 && dist > 1) {
            b.vx += (dx / dist) * force;
            b.vy += (dy / dist) * force;
          }
        }
        b.vx *= 0.985;
        b.vy *= 0.985;
        const spd = Math.hypot(b.vx, b.vy);
        const maxSpd = 3.5;
        if (spd > maxSpd) {
          b.vx = (b.vx / spd) * maxSpd;
          b.vy = (b.vy / spd) * maxSpd;
        }
        b.x += b.vx * simSpeed;
        b.y += b.vy * simSpeed;
        // Bounce with margin
        const m = b.r * 0.5;
        if (b.x < -m) { b.x = -m; b.vx = Math.abs(b.vx); }
        if (b.x > W + m) { b.x = W + m; b.vx = -Math.abs(b.vx); }
        if (b.y < -m) { b.y = -m; b.vy = Math.abs(b.vy); }
        if (b.y > H + m) { b.y = H + m; b.vy = -Math.abs(b.vy); }
      });
    }

    // Build field
    const palette = palettes[currentPalette];
    const paletteRgb = palette.map(hexToRgb);
    const threshold = 1.0;

    for (let y = 0; y < fieldH; y++) {
      for (let x = 0; x < fieldW; x++) {
        const wx = x * RENDER_SCALE;
        const wy = y * RENDER_SCALE;
        let sum = 0;
        let minDist = Infinity;
        let closestColor = paletteRgb[0];
        let secondColor = paletteRgb[0];
        let closestDist = Infinity;
        let secondDist = Infinity;

        // Optimized: only check nearby balls with spatial hint
        for (let i = 0; i < balls.length; i++) {
          const b = balls[i];
          const dx = wx - b.x;
          const dy = wy - b.y;
          const d2 = dx*dx + dy*dy;
          const influence = b.r * b.r;
          if (d2 < influence * 16) {
            const d = Math.sqrt(d2);
            sum += influence / (d2 + 1);
            if (d < closestDist) {
              secondDist = closestDist;
              secondColor = closestColor;
              closestDist = d;
              closestColor = paletteRgb[i % palette.length];
            } else if (d < secondDist) {
              secondDist = d;
              secondColor = paletteRgb[i % palette.length];
            }
          }
        }

        const idx = (y * fieldW + x) * 4;
        if (sum > threshold) {
          // Interior — blend based on which balls dominate
          const t = Math.min(1, (sum - threshold) / 1.5);
          const cr = closestColor[0], cg = closestColor[1], cb = closestColor[2];
          const sr = secondColor[0], sg = secondColor[1], sb = secondColor[2];
          // Smooth blend
          const blend = Math.min(1, closestDist / (closestDist + secondDist + 0.1));
          const r = Math.round(cr * blend + sr * (1 - blend));
          const g = Math.round(cg * blend + sg * (1 - blend));
          const b = Math.round(cb * blend + sb * (1 - blend));
          // Brightness boost in the interior
          const bright = Math.min(1.4, 1 + t * 0.4);
          data[idx]     = Math.min(255, r * bright);
          data[idx + 1] = Math.min(255, g * bright);
          data[idx + 2] = Math.min(255, b * bright);
          data[idx + 3] = 255;
        } else if (sum > threshold * 0.5) {
          // Edge glow
          const t = (sum - threshold * 0.5) / (threshold * 0.5);
          const alpha = Math.round(t * 120);
          const cr = closestColor[0], cg = closestColor[1], cb = closestColor[2];
          data[idx]     = cr;
          data[idx + 1] = cg;
          data[idx + 2] = cb;
          data[idx + 3] = alpha;
        } else {
          data[idx] = 10;
          data[idx + 1] = 10;
          data[idx + 2] = 20;
          data[idx + 3] = 255;
        }
      }
    }

    fieldCtx.putImageData(imgData, 0, 0);

    // Draw main canvas: upscale with slight smoothing
    ctx.clearRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(fieldCanvas, 0, 0, W, H);

    // Subtle radial vignette
    const vgrad = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.75);
    vgrad.addColorStop(0, 'rgba(0,0,0,0)');
    vgrad.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = vgrad;
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(animate);
  };

  // Re-init image data on resize
  window.addEventListener('resize', () => {
    initImgData();
  });

  animate();
})();
</script>
</body>
</html>
