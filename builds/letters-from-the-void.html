<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letters from the Void</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
    user-select: none;
  }
  
  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
  }
  
  #ui {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  
  #prompt {
    color: rgba(255,255,255,0.35);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 10px rgba(255,255,255,0.1);
    transition: opacity 0.8s;
  }
  
  #word-count {
    color: rgba(255,255,255,0.2);
    font-size: 11px;
    letter-spacing: 1px;
    font-family: 'Courier New', monospace;
  }
  
  #palette-indicator {
    position: fixed;
    top: 20px;
    right: 24px;
    z-index: 10;
    color: rgba(255,255,255,0.25);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Courier New', monospace;
    transition: color 0.5s;
  }
  
  #title-overlay {
    position: fixed;
    top: 20px;
    left: 24px;
    z-index: 10;
    color: rgba(255,255,255,0.15);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-family: 'Courier New', monospace;
  }
  
  .fade-in { animation: fadeIn 2s ease-in; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="title-overlay">Letters from the Void</div>
<div id="palette-indicator"></div>
<div id="ui">
  <div id="prompt">Type to send letters into the void...</div>
  <div id="word-count"></div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const promptEl = document.getElementById('prompt');
const wordCountEl = document.getElementById('word-count');
const paletteEl = document.getElementById('palette-indicator');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Palettes ---
const palettes = [
  { name: 'Stellar', bg: '#000010', star: [255, 220, 180], line: [120, 160, 255], glow: [80, 120, 255] },
  { name: 'Nebula', bg: '#0a000a', star: [255, 150, 200], line: [200, 100, 255], glow: [180, 80, 255] },
  { name: 'Aurora', bg: '#000a05', star: [180, 255, 220], line: [100, 255, 200], glow: [80, 255, 180] },
  { name: 'Ember', bg: '#0a0500', star: [255, 200, 100], line: [255, 140, 60], glow: [255, 100, 30] },
  { name: 'Void Gold', bg: '#050500', star: [255, 230, 150], line: [200, 170, 80], glow: [180, 150, 50] },
  { name: 'Ice', bg: '#000508', star: [200, 230, 255], line: [100, 200, 255], glow: [60, 180, 255] },
];
let paletteIdx = 0;
let palette = palettes[0];

// --- Vowel/Consonant classification ---
const vowels = new Set('aeiouAEIOU');
const letterCharMap = {};
const letterSpeeds = {};

// Assign each letter a unique hue shift and speed multiplier
const alphabet = 'abcdefghijklmnopqrstuvwxyz';
for (let i = 0; i < alphabet.length; i++) {
  const ch = alphabet[i];
  letterCharMap[ch] = i / alphabet.length;
  letterCharMap[ch.toUpperCase()] = i / alphabet.length;
  letterSpeeds[ch] = 0.3 + (i % 5) * 0.15;
  letterSpeeds[ch.toUpperCase()] = 0.3 + (i % 5) * 0.15;
}

// --- Star system ---
let stars = [];
let connections = [];
const MAX_STARS = 600;
const CONNECTION_DIST = 120;

class Star {
  constructor(x, y, char) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.char = char || String.fromCharCode(0x2022 + Math.floor(Math.random() * 5));
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.4;
    this.birth = performance.now();
    this.life = 1;
    this.decay = 0.00003 + Math.random() * 0.00005;
    this.size = 1 + Math.random() * 2;
    this.twinkleSpeed = 0.001 + Math.random() * 0.002;
    this.twinkleOffset = Math.random() * Math.PI * 2;
    this.isVowel = vowels.has(char);
    this.charCode = letterCharMap[char] !== undefined ? letterCharMap[char] : Math.random();
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.trail = [];
    this.maxTrail = this.isVowel ? 20 : 8;
  }
  
  update(dt) {
    this.pulsePhase += dt * 0.001;
    this.x += this.vx * dt * 0.06;
    this.y += this.vy * dt * 0.06;
    
    // Store trail
    if (this.trail.length > this.maxTrail) this.trail.shift();
    this.trail.push({ x: this.x, y: this.y, life: 1 });
    
    // Age trail
    for (let t of this.trail) t.life -= dt * 0.0008;
    this.trail = this.trail.filter(t => t.life > 0);
    
    // Subtle drift
    this.vx += (Math.random() - 0.5) * 0.01;
    this.vy += (Math.random() - 0.5) * 0.01;
    this.vx *= 0.999;
    this.vy *= 0.999;
    
    // Wrap
    if (this.x < -50) this.x = W + 50;
    if (this.x > W + 50) this.x = -50;
    if (this.y < -50) this.y = H + 50;
    if (this.y > H + 50) this.y = -50;
    
    // Decay
    this.life -= this.decay * dt;
  }
  
  draw(ctx, now) {
    const twinkle = 0.6 + 0.4 * Math.sin(now * this.twinkleSpeed + this.twinkleOffset);
    const alpha = this.life * twinkle;
    if (alpha <= 0) return;
    
    const [r, g, b] = palette.star;
    const [lr, lg, lb] = palette.line;
    const pulse = 1 + 0.3 * Math.sin(this.pulsePhase);
    const s = this.size * pulse;
    
    // Trail
    if (this.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.strokeStyle = `rgba(${lr},${lg},${lb},${alpha * 0.15})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
    
    // Glow
    const glowSize = s * 4 * (this.isVowel ? 1.8 : 1);
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowSize);
    const glowAlpha = alpha * (this.isVowel ? 0.4 : 0.2);
    grad.addColorStop(0, `rgba(${r},${g},${b},${glowAlpha})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
    ctx.fill();
    
    // Core
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, s, 0, Math.PI * 2);
    ctx.fill();
    
    // Character (subtle)
    if (alpha > 0.5 && this.char) {
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha * 0.5})`;
      ctx.font = `${8 + s * 2}px Courier New`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.char, this.x, this.y - s * 4);
    }
  }
}

// --- Ambient background stars (tiny, many, no characters) ---
let bgStars = [];
function initBgStars() {
  bgStars = [];
  for (let i = 0; i < 200; i++) {
    bgStars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 1.2,
      twinkleSpeed: 0.0005 + Math.random() * 0.001,
      offset: Math.random() * Math.PI * 2,
      brightness: 0.1 + Math.random() * 0.3
    });
  }
}
initBgStars();

// --- Burst particles ---
let bursts = [];
class BurstParticle {
  constructor(x, y) {
    this.x = x; this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1;
    this.decay = 0.005 + Math.random() * 0.01;
    this.size = 0.5 + Math.random() * 1.5;
  }
  update(dt) {
    this.x += this.vx * dt * 0.05;
    this.y += this.vy * dt * 0.05;
    this.vx *= 0.98;
    this.vy *= 0.98;
    this.life -= this.decay * dt * 0.06;
  }
  draw(ctx) {
    if (this.life <= 0) return;
    const [r, g, b] = palette.line;
    ctx.fillStyle = `rgba(${r},${g},${b},${this.life * 0.8})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Input ---
let lastKeyTime = 0;
let totalChars = 0;
let lines = [];

window.addEventListener('keydown', (e) => {
  const now = performance.now();
  
  if (e.key === ' ') {
    e.preventDefault();
    paletteIdx = (paletteIdx + 1) % palettes.length;
    palette = palettes[paletteIdx];
    paletteEl.textContent = palette.name;
    paletteEl.style.color = `rgba(${palette.star[0]},${palette.star[1]},${palette.star[2]},0.4)`;
    return;
  }
  
  if (e.key === 'c' && !e.ctrlKey && !e.metaKey) {
    stars = [];
    bursts = [];
    connections = [];
    return;
  }
  
  if (e.key === 'Enter') {
    e.preventDefault();
    // Current stars form a constellation line
    const recent = stars.filter(s => s.life > 0.7).slice(-30);
    for (let i = 0; i < recent.length - 1; i++) {
      connections.push({
        from: recent[i],
        to: recent[i + 1],
        birth: now,
        life: 1,
        decay: 0.0002
      });
    }
    // Burst at center
    for (let i = 0; i < 40; i++) {
      bursts.push(new BurstParticle(W / 2, H / 2));
    }
    return;
  }
  
  // Ignore modifier keys, ctrl combos
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key.length > 1 && e.key !== 'Backspace') return;
  
  e.preventDefault();
  
  // Spawn star from random edge or center
  let sx, sy;
  if (Math.random() < 0.3) {
    // Edge spawn
    const edge = Math.floor(Math.random() * 4);
    if (edge === 0) { sx = Math.random() * W; sy = -10; }
    else if (edge === 1) { sx = W + 10; sy = Math.random() * H; }
    else if (edge === 2) { sx = Math.random() * W; sy = H + 10; }
    else { sx = -10; sy = Math.random() * H; }
  } else {
    sx = W / 2 + (Math.random() - 0.5) * 200;
    sy = H / 2 + (Math.random() - 0.5) * 200;
  }
  
  const ch = e.key === 'Backspace' ? '·' : e.key;
  const star = new Star(sx, sy, ch);
  star.vx = (W / 2 - sx) * 0.0005 + (Math.random() - 0.5) * 0.3;
  star.vy = (H / 2 - sy) * 0.0005 + (Math.random() - 0.5) * 0.3;
  stars.push(star);
  totalChars++;
  
  // Burst on spawn
  for (let i = 0; i < 8; i++) {
    bursts.push(new BurstParticle(sx, sy));
  }
  
  // Cap
  if (stars.length > MAX_STARS) {
    stars = stars.slice(-MAX_STARS + 50);
  }
  
  // UI
  promptEl.style.opacity = Math.max(0.15, promptEl.style.opacity - 0.02);
  wordCountEl.textContent = `${stars.length} letters drifting`;
  
  // Fade prompt back in after silence
  clearTimeout(lastKeyTime);
  lastKeyTime = setTimeout(() => {
    promptEl.style.opacity = '0.35';
  }, 3000);
});

// Click creates a gentle burst of stars
canvas.addEventListener('click', (e) => {
  for (let i = 0; i < 12; i++) {
    const chars = '·∘○◎◉✦☆✧';
    const star = new Star(e.clientX, e.clientY, chars[Math.floor(Math.random() * chars.length)]);
    star.vx = (Math.random() - 0.5) * 2;
    star.vy = (Math.random() - 0.5) * 2;
    stars.push(star);
    bursts.push(new BurstParticle(e.clientX, e.clientY));
  }
  if (stars.length > MAX_STARS) stars = stars.slice(-MAX_STARS);
});

// --- Main loop ---
let lastTime = performance.now();

function draw(now) {
  const dt = Math.min(now - lastTime, 50);
  lastTime = now;
  
  // Fade background
  ctx.fillStyle = palette.bg;
  ctx.globalAlpha = 0.15;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  
  // Background stars
  for (let bs of bgStars) {
    const tw = 0.5 + 0.5 * Math.sin(now * bs.twinkleSpeed + bs.offset);
    ctx.fillStyle = `rgba(255,255,255,${bs.brightness * tw})`;
    ctx.beginPath();
    ctx.arc(bs.x, bs.y, bs.size, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Update & draw stars
  for (let star of stars) {
    star.update(dt);
    star.draw(ctx, now);
  }
  stars = stars.filter(s => s.life > 0);
  
  // Connections
  for (let conn of connections) {
    conn.life -= conn.decay * dt;
    const alpha = conn.life * 0.3;
    if (alpha <= 0) continue;
    const [r, g, b] = palette.line;
    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(conn.from.x, conn.from.y);
    ctx.lineTo(conn.to.x, conn.to.y);
    ctx.stroke();
  }
  connections = connections.filter(c => c.life > 0);
  
  // Connection proximity (gentle, performance-friendly)
  if (stars.length < 200) {
    for (let i = 0; i < stars.length; i++) {
      for (let j = i + 1; j < stars.length; j++) {
        const dx = stars[i].x - stars[j].x;
        const dy = stars[i].y - stars[j].y;
        const dist = dx * dx + dy * dy;
        if (dist < CONNECTION_DIST * CONNECTION_DIST) {
          const alpha = (1 - dist / (CONNECTION_DIST * CONNECTION_DIST)) * 0.12 * Math.min(stars[i].life, stars[j].life);
          const [r, g, b] = palette.line;
          ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
          ctx.lineWidth = 0.3;
          ctx.beginPath();
          ctx.moveTo(stars[i].x, stars[i].y);
          ctx.lineTo(stars[j].x, stars[j].y);
          ctx.stroke();
        }
      }
    }
  }
  
  // Bursts
  for (let bp of bursts) {
    bp.update(dt);
    bp.draw(ctx);
  }
  bursts = bursts.filter(b => b.life > 0);
  
  requestAnimationFrame(draw);
}

// Init palette display
paletteEl.textContent = palette.name;
paletteEl.style.color = `rgba(${palette.star[0]},${palette.star[1]},${palette.star[2]},0.4)`;

// Fill initial void with a few ambient stars
for (let i = 0; i < 50; i++) {
  stars.push(new Star(Math.random() * W, Math.random() * H));
}

requestAnimationFrame(draw);
</script>
</body>
</html>
