<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Constellation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; cursor: crosshair; }

  #ui {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 10; flex-wrap: wrap; justify-content: center;
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
  }
  .btn {
    background: rgba(10, 10, 30, 0.7); border: 1px solid rgba(120, 140, 255, 0.3);
    color: #a0b4ff; padding: 6px 14px; border-radius: 20px; cursor: pointer;
    font-size: 12px; letter-spacing: 0.5px; transition: all 0.25s;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .btn:hover { background: rgba(40, 50, 100, 0.8); border-color: rgba(160, 180, 255, 0.6); color: #fff; }
  .btn.active { background: rgba(80, 100, 200, 0.6); border-color: #8090ff; color: #fff; box-shadow: 0 0 12px rgba(120,140,255,0.4); }

  #info {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: rgba(160,180,255,0.5); font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 11px; letter-spacing: 0.5px; z-index: 10; text-align: center;
    pointer-events: none;
  }

  #palette-name {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
    color: rgba(160,180,255,0.4); font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase; z-index: 10;
    pointer-events: none; transition: opacity 0.8s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <button class="btn active" data-mode="gravity">Attract</button>
  <button class="btn" data-mode="repel">Repel</button>
  <button class="btn" data-mode="orbit">Orbit</button>
  <button class="btn" data-mode="pulse">Pulse</button>
  <button class="btn" data-mode="swarm">Swarm</button>
  <button class="btn" id="palBtn">Palette</button>
  <button class="btn" id="resetBtn">Reset</button>
  <button class="btn" id="burstBtn">Burst</button>
</div>

<div id="palette-name">Aurora</div>
<div id="info">click & drag to interact · scroll to adjust force · space to burst</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ── Palette System ──────────────────────────────────────────
const palettes = [
  { name: 'Aurora',  bg: [2, 4, 14],     colors: ['#00ffc8','#00a8ff','#7b2fff','#ff2d95','#00ffc8'] },
  { name: 'Ember',   bg: [14, 4, 2],     colors: ['#ff6a00','#ff2d00','#ffcc00','#ff4488','#ff8800'] },
  { name: 'Frost',   bg: [4, 8, 20],     colors: ['#88ccff','#ffffff','#44aaff','#aaddff','#66bbff'] },
  { name: 'Void',    bg: [0, 0, 0],      colors: ['#aa00ff','#ff00aa','#5500ff','#ff00ff','#8800cc'] },
  { name: 'Ocean',   bg: [2, 10, 24],    colors: ['#00ccff','#0066ff','#00ffcc','#44aaff','#00ddff'] },
  { name: 'Toxic',   bg: [4, 16, 4],     colors: ['#88ff00','#00ff66','#ccff00','#44ff88','#aaff22'] },
];
let palIdx = 0;

function pal() { return palettes[palIdx]; }

// ── Particle System ─────────────────────────────────────────
const N = 220;
const CONNECTION_DIST = 100;
const particles = [];

function createParticle(x, y, vx, vy) {
  const p = pal();
  return {
    x: x ?? Math.random() * W,
    y: y ?? Math.random() * H,
    vx: vx ?? (Math.random() - 0.5) * 0.6,
    vy: vy ?? (Math.random() - 0.5) * 0.6,
    r: Math.random() * 1.8 + 0.8,
    color: p.colors[Math.floor(Math.random() * p.colors.length)],
    life: 1,
    pulsePhase: Math.random() * Math.PI * 2,
    pulseSpeed: Math.random() * 0.02 + 0.008,
  };
}

function initParticles() {
  particles.length = 0;
  for (let i = 0; i < N; i++) particles.push(createParticle());
}
initParticles();

// ── State ───────────────────────────────────────────────────
let mode = 'gravity';
let mouse = { x: W/2, y: H/2, down: false, active: false };
let forceRadius = 140;
let forceStrength = 0.35;
let time = 0;

// ── Controls ────────────────────────────────────────────────
document.querySelectorAll('.btn[data-mode]').forEach(b => {
  b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('.btn[data-mode]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  });
});

document.getElementById('palBtn').addEventListener('click', () => {
  palIdx = (palIdx + 1) % palettes.length;
  const p = pal();
  document.getElementById('palette-name').textContent = p.name;
  particles.forEach(pt => {
    pt.color = p.colors[Math.floor(Math.random() * p.colors.length)];
  });
  // fade label
  const el = document.getElementById('palette-name');
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0.4', 1200);
});

document.getElementById('resetBtn').addEventListener('click', initParticles);

document.getElementById('burstBtn').addEventListener('click', () => {
  const cx = W/2 + (Math.random()-0.5) * W * 0.4;
  const cy = H/2 + (Math.random()-0.5) * H * 0.4;
  for (let i = 0; i < 60; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = Math.random() * 3 + 1;
    particles.push(createParticle(cx, cy, Math.cos(ang)*spd, Math.sin(ang)*spd));
  }
  // trim if over limit
  while (particles.length > N * 1.6) particles.shift();
});

canvas.addEventListener('mousedown', e => { mouse.down = true; mouse.active = true; mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mouseup', () => mouse.down = false);
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mouseleave', () => { mouse.down = false; mouse.active = false; });

canvas.addEventListener('touchstart', e => {
  e.preventDefault(); mouse.down = true; mouse.active = true;
  mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault(); mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY;
}, { passive: false });
canvas.addEventListener('touchend', () => mouse.down = false);

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); document.getElementById('burstBtn').click(); }
});

canvas.addEventListener('wheel', e => {
  forceRadius = Math.max(40, Math.min(400, forceRadius - e.deltaY * 0.3));
}, { passive: true });

// ── Update ──────────────────────────────────────────────────
function update() {
  time += 0.016;
  const mx = mouse.x, my = mouse.y;
  const active = mouse.active;
  const strength = mouse.down ? forceStrength * 1.8 : forceStrength * 0.6;
  const rad = forceRadius;

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    p.pulsePhase += p.pulseSpeed;

    // Mouse force
    if (active) {
      const dx = mx - p.x, dy = my - p.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      if (dist < rad) {
        const f = (1 - dist/rad) * strength;
        const nx = dx/dist, ny = dy/dist;
        switch (mode) {
          case 'gravity': p.vx += nx * f; p.vy += ny * f; break;
          case 'repel':   p.vx -= nx * f * 1.4; p.vy -= ny * f * 1.4; break;
          case 'orbit':
            p.vx += (-ny * f * 1.2 + nx * f * 0.15);
            p.vy += ( nx * f * 1.2 + ny * f * 0.15);
            break;
          case 'pulse':
            const pulse = Math.sin(time * 4 + p.pulsePhase) * f;
            p.vx += nx * pulse; p.vy += ny * pulse;
            break;
          case 'swarm':
            p.vx += (Math.sin(time*2 + i)*f*0.8);
            p.vy += (Math.cos(time*2 + i*1.3)*f*0.8);
            break;
        }
      }
    }

    // Soft damping
    p.vx *= 0.992; p.vy *= 0.992;

    // Speed cap
    const speed = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
    if (speed > 4) { p.vx = (p.vx/speed)*4; p.vy = (p.vy/speed)*4; }

    p.x += p.vx; p.y += p.vy;

    // Wrap edges with margin
    const m = 20;
    if (p.x < -m) p.x = W + m;
    if (p.x > W + m) p.x = -m;
    if (p.y < -m) p.y = H + m;
    if (p.y > H + m) p.y = -m;
  }
}

// ── Render ──────────────────────────────────────────────────
function hexToRgb(hex) {
  const v = parseInt(hex.slice(1), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}

function draw() {
  const bg = pal().bg;
  // Trail fade
  ctx.fillStyle = `rgba(${bg[0]},${bg[1]},${bg[2]},0.18)`;
  ctx.fillRect(0, 0, W, H);

  // Connections
  ctx.lineWidth = 0.4;
  const maxConn = 90; // limit per frame for perf
  let connCount = 0;
  for (let i = 0; i < particles.length && connCount < maxConn; i++) {
    for (let j = i+1; j < particles.length && connCount < maxConn; j++) {
      const a = particles[i], b = particles[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < CONNECTION_DIST) {
        const alpha = (1 - dist/CONNECTION_DIST) * 0.25;
        const [r,g,bl] = hexToRgb(a.color);
        ctx.strokeStyle = `rgba(${r},${g},${bl},${alpha})`;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        connCount++;
      }
    }
  }

  // Particles
  for (const p of particles) {
    const pulse = 0.7 + Math.sin(p.pulsePhase) * 0.3;
    const [r,g,b] = hexToRgb(p.color);
    const sz = p.r * pulse;

    // Outer glow
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, sz * 4);
    grad.addColorStop(0, `rgba(${r},${g},${b},0.6)`);
    grad.addColorStop(0.4, `rgba(${r},${g},${b},0.15)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz * 4, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = `rgba(${Math.min(255,r+60)},${Math.min(255,g+60)},${Math.min(255,b+60)},${0.9 * pulse})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
    ctx.fill();
  }

  // Mouse cursor glow
  if (mouse.active) {
    const mg = ctx.createRadialGradient(mx, my, 0, mx, my, rad * 0.5);
    const [mr,mg2,mb] = hexToRgb(pal().colors[0]);
    mg.addColorStop(0, `rgba(${mr},${mg2},${mb},0.06)`);
    mg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.arc(mx, my, rad * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── Background stars ────────────────────────────────────────
const stars = Array.from({length: 120}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.2 + 0.2,
  a: Math.random() * 0.5 + 0.1,
  speed: Math.random() * 0.005 + 0.002,
  phase: Math.random() * Math.PI * 2,
}));

function drawStars() {
  const bg = pal().bg;
  for (const s of stars) {
    s.phase += s.speed;
    const alpha = s.a * (0.5 + Math.sin(s.phase) * 0.5);
    ctx.fillStyle = `rgba(200,220,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── Main Loop ───────────────────────────────────────────────
function loop() {
  update();
  drawStars();
  draw();
  requestAnimationFrame(loop);
}

// Initial clear
ctx.fillStyle = '#000';
ctx.fillRect(0, 0, W, H);
loop();
</script>
</body>
</html>
