<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Constellation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    overflow: hidden;
    font-family: 'Georgia', serif;
    cursor: crosshair;
  }
  canvas { display: block; }
  .info {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.5);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    text-shadow: 0 0 10px rgba(100, 180, 255, 0.5);
  }
  .title {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.7);
    font-size: 18px;
    letter-spacing: 6px;
    text-transform: uppercase;
    pointer-events: none;
    text-shadow: 0 0 20px rgba(100, 180, 255, 0.8);
    font-weight: 300;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="title">Living Constellation</div>
<div class="info">Move your mouse to influence the stars</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height;
let particles = [];
let mouse = { x: null, y: null, radius: 150 };
let time = 0;

const config = {
  particleCount: 180,
  connectionDistance: 120,
  mouseInfluence: 200,
  baseSpeed: 0.3,
  colors: [
    { r: 100, g: 180, b: 255 },  // soft blue
    { r: 180, g: 130, b: 255 },  // lavender
    { r: 130, g: 220, b: 255 },  // cyan
    { r: 255, g: 180, b: 220 },  // rose
    { r: 220, g: 255, b: 200 },  // mint
  ]
};

class Particle {
  constructor() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.vx = (Math.random() - 0.5) * config.baseSpeed;
    this.vy = (Math.random() - 0.5) * config.baseSpeed;
    this.radius = Math.random() * 2 + 1;
    this.color = config.colors[Math.floor(Math.random() * config.colors.length)];
    this.pulseOffset = Math.random() * Math.PI * 2;
    this.pulseSpeed = 0.02 + Math.random() * 0.02;
  }

  update() {
    // Organic movement using sine waves
    this.vx += Math.sin(time * 0.001 + this.pulseOffset) * 0.01;
    this.vy += Math.cos(time * 0.001 + this.pulseOffset) * 0.01;

    // Mouse influence
    if (mouse.x !== null && mouse.y !== null) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist < config.mouseInfluence) {
        const force = (config.mouseInfluence - dist) / config.mouseInfluence;
        const angle = Math.atan2(dy, dx);
        this.vx -= Math.cos(angle) * force * 0.05;
        this.vy -= Math.sin(angle) * force * 0.05;
      }
    }

    // Speed limits
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed > config.baseSpeed * 2) {
      this.vx = (this.vx / speed) * config.baseSpeed * 2;
      this.vy = (this.vy / speed) * config.baseSpeed * 2;
    }

    this.x += this.vx;
    this.y += this.vy;

    // Wrap around edges with padding
    const pad = 50;
    if (this.x < -pad) this.x = width + pad;
    if (this.x > width + pad) this.x = -pad;
    if (this.y < -pad) this.y = height + pad;
    if (this.y > height + pad) this.y = -pad;
  }

  draw() {
    const pulse = Math.sin(time * this.pulseSpeed + this.pulseOffset) * 0.5 + 0.5;
    const alpha = 0.4 + pulse * 0.6;
    const r = this.radius * (0.8 + pulse * 0.4);

    // Glow
    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r * 4);
    gradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha})`);
    gradient.addColorStop(0.5, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha * 0.3})`);
    gradient.addColorStop(1, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0)`);

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r * 4, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function init() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  particles = [];
  
  for (let i = 0; i < config.particleCount; i++) {
    particles.push(new Particle());
  }
}

function drawConnections() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < config.connectionDistance) {
        const alpha = (1 - dist / config.connectionDistance) * 0.3;
        
        // Blend colors
        const r = Math.floor((particles[i].color.r + particles[j].color.r) / 2);
        const g = Math.floor((particles[i].color.g + particles[j].color.g) / 2);
        const b = Math.floor((particles[i].color.b + particles[j].color.b) / 2);

        ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }
}

function drawMouseGlow() {
  if (mouse.x === null || mouse.y === null) return;

  const gradient = ctx.createRadialGradient(
    mouse.x, mouse.y, 0,
    mouse.x, mouse.y, config.mouseInfluence
  );
  gradient.addColorStop(0, 'rgba(150, 200, 255, 0.1)');
  gradient.addColorStop(0.5, 'rgba(150, 200, 255, 0.05)');
  gradient.addColorStop(1, 'rgba(150, 200, 255, 0)');

  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, config.mouseInfluence, 0, Math.PI * 2);
  ctx.fill();
}

function animate() {
  time++;
  
  // Fade effect for trails
  ctx.fillStyle = 'rgba(10, 10, 26, 0.15)';
  ctx.fillRect(0, 0, width, height);

  drawMouseGlow();
  drawConnections();

  particles.forEach(p => {
    p.update();
    p.draw();
  });

  requestAnimationFrame(animate);
}

// Event listeners
canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

canvas.addEventListener('mouseleave', () => {
  mouse.x = null;
  mouse.y = null;
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
}, { passive: false });

canvas.addEventListener('touchend', () => {
  mouse.x = null;
  mouse.y = null;
});

window.addEventListener('resize', init);

// Start
init();
animate();
</script>
</body>
</html>
