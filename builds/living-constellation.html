<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Constellation</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; }
  #ui {
    position: fixed;
    top: 16px;
    left: 16px;
    color: rgba(200, 180, 255, 0.8);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    pointer-events: none;
    z-index: 10;
  }
  #ui .title { font-size: 14px; margin-bottom: 4px; color: rgba(220, 200, 255, 0.9); }
  #ui .sub { color: rgba(160, 140, 200, 0.6); margin-bottom: 8px; }
  #stats { position: fixed; bottom: 16px; right: 16px; color: rgba(160, 140, 200, 0.5); font-family: 'Courier New', monospace; font-size: 10px; }
</style>
</head>
<body>
<div id="ui">
  <div class="title">◈ Living Constellation</div>
  <div class="sub">click to birth · move to attract · space to pulse</div>
</div>
<div id="stats"></div>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const stats = document.getElementById('stats');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const mouse = { x: W / 2, y: H / 2, active: false };
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => mouse.active = false);
canvas.addEventListener('click', e => {
  for (let i = 0; i < 15; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 2 + 0.5;
    stars.push(createStar(e.clientX, e.clientY, Math.cos(angle) * speed, Math.sin(angle) * speed));
  }
});
window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    pulseWave();
  }
});

function createStar(x, y, vx, vy) {
  const hue = Math.random() * 60 + 200; // blue to purple range
  return {
    x, y, vx, vy,
    baseRadius: Math.random() * 2 + 1.5,
    radius: Math.random() * 2 + 1.5,
    hue,
    saturation: 60 + Math.random() * 40,
    lightness: 60 + Math.random() * 30,
    alpha: Math.random() * 0.5 + 0.5,
    pulsePhase: Math.random() * Math.PI * 2,
    pulseSpeed: 0.02 + Math.random() * 0.03,
    life: 1,
    decay: 0,
    connections: [],
    birth: Date.now()
  };
}

const stars = [];
const maxStars = 300;
const connectionDist = 150;

// Initial constellation
for (let i = 0; i < 100; i++) {
  stars.push(createStar(
    Math.random() * W,
    Math.random() * H,
    (Math.random() - 0.5) * 0.3,
    (Math.random() - 0.5) * 0.3
  ));
}

let pulseWaves = [];
function pulseWave() {
  pulseWaves.push({ x: mouse.x, y: mouse.y, radius: 0, maxRadius: 400, alpha: 1 });
  stars.forEach(star => {
    const dx = star.x - mouse.x;
    const dy = star.y - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 200 && dist > 0) {
      const force = (200 - dist) / 200 * 3;
      star.vx += (dx / dist) * force;
      star.vy += (dy / dist) * force;
      star.pulsePhase = Math.PI; // bright flash
    }
  });
}

let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time++;

  // Fade trail
  ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
  ctx.fillRect(0, 0, W, H);

  // Update pulse waves
  pulseWaves = pulseWaves.filter(pw => {
    pw.radius += 5;
    pw.alpha = 1 - pw.radius / pw.maxRadius;
    if (pw.alpha > 0) {
      ctx.strokeStyle = `rgba(180, 160, 255, ${pw.alpha * 0.3})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(pw.x, pw.y, pw.radius, 0, Math.PI * 2);
      ctx.stroke();
    }
    return pw.alpha > 0;
  });

  // Mouse attraction
  if (mouse.active) {
    stars.forEach(star => {
      const dx = mouse.x - star.x;
      const dy = mouse.y - star.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 0 && dist < 300) {
        const force = 0.02 * (1 - dist / 300);
        star.vx += (dx / dist) * force;
        star.vy += (dy / dist) * force;
      }
    });
  }

  // Update stars
  stars.forEach((star, i) => {
    // Damping
    star.vx *= 0.99;
    star.vy *= 0.99;

    // Speed limit
    const speed = Math.sqrt(star.vx * star.vx + star.vy * star.vy);
    if (speed > 3) {
      star.vx = (star.vx / speed) * 3;
      star.vy = (star.vy / speed) * 3;
    }

    star.x += star.vx;
    star.y += star.vy;

    // Breathing radius
    star.pulsePhase += star.pulseSpeed;
    star.radius = star.baseRadius + Math.sin(star.pulsePhase) * 0.8;

    // Wrap around
    const margin = 50;
    if (star.x < -margin) star.x = W + margin;
    if (star.x > W + margin) star.x = -margin;
    if (star.y < -margin) star.y = H + margin;
    if (star.y > H + margin) star.y = -margin;

    // Aging
    if (star.decay > 0) {
      star.life -= star.decay;
    }
  });

  // Remove dead stars
  for (let i = stars.length - 1; i >= 0; i--) {
    if (stars[i].life <= 0) stars.splice(i, 1);
  }

  // Spawn new stars occasionally
  if (stars.length < maxStars && Math.random() < 0.05) {
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = Math.random() * W; y = -10; }
    else if (edge === 1) { x = W + 10; y = Math.random() * H; }
    else if (edge === 2) { x = Math.random() * W; y = H + 10; }
    else { x = -10; y = Math.random() * H; }
    const angle = Math.atan2(H / 2 - y, W / 2 - x) + (Math.random() - 0.5) * 1;
    const speed = Math.random() * 0.5 + 0.2;
    const star = createStar(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed);
    star.decay = 0.0005;
    stars.push(star);
  }

  // Draw connections
  ctx.lineWidth = 0.5;
  for (let i = 0; i < stars.length; i++) {
    for (let j = i + 1; j < stars.length; j++) {
      const dx = stars[i].x - stars[j].x;
      const dy = stars[i].y - stars[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < connectionDist) {
        const alpha = (1 - dist / connectionDist) * 0.4 * Math.min(stars[i].life, stars[j].life);
        const avgHue = (stars[i].hue + stars[j].hue) / 2;

        // Color shifts based on connection strength
        if (dist < connectionDist * 0.3) {
          ctx.strokeStyle = `hsla(${avgHue}, 80%, 70%, ${alpha})`;
        } else {
          ctx.strokeStyle = `hsla(${avgHue + 20}, 60%, 50%, ${alpha * 0.6})`;
        }

        ctx.beginPath();
        ctx.moveTo(stars[i].x, stars[i].y);
        ctx.lineTo(stars[j].x, stars[j].y);
        ctx.stroke();
      }
    }
  }

  // Draw stars
  stars.forEach(star => {
    const alpha = star.life * star.alpha;
    const glow = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, star.radius * 4);
    glow.addColorStop(0, `hsla(${star.hue}, ${star.saturation}%, ${star.lightness}%, ${alpha})`);
    glow.addColorStop(0.5, `hsla(${star.hue}, ${star.saturation}%, ${star.lightness}%, ${alpha * 0.3})`);
    glow.addColorStop(1, `hsla(${star.hue}, ${star.saturation}%, ${star.lightness}%, 0)`);

    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.radius * 4, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = `hsla(${star.hue}, ${star.saturation}%, ${star.lightness + 20}%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
    ctx.fill();
  });

  // Stats
  stats.textContent = `stars: ${stars.length} · waves: ${pulseWaves.length}`;
}

animate();
</script>
</body>
</html>
