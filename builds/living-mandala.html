<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aether’s Living Mandala</title>
<style>
  html, body { height: 100%; margin: 0; background: radial-gradient(circle at center, #2a2540 0%, #0c0b14 100%); color: #f3efff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
  header { position: fixed; top: 0; left: 0; right: 0; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; z-index: 10; }
  h1 { font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.9; margin: 0; }
  .hud { font-size: 11px; opacity: 0.6; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hint { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 11px; opacity: 0.5; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Aether’s Living Mandala</h1>
  <div class="hud" id="hud">arms: 6 · depth: 3 · seed: 1337</div>
</header>
<canvas id="c"></canvas>
<div class="hint">click to regenerate · move mouse to drift</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');

  let width, height, dpr;
  function resize() {
    dpr = Math.max(1, window.devicePixelRatio || 1);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const palette = [
    '#ff4d6d', '#ff8fa3', '#ffb3c6', '#fff0f3',
    '#590d22', '#800f2f', '#a4133c', '#c9184a',
    '#ff4d6d', '#ff8fa3'
  ];

  function pick(seed) {
    // Simple mulberry32
    let s = seed | 0;
    return () => {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let mouse = { x: 0.5, y: 0.5 };
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX / width;
    mouse.y = e.clientY / height;
  });
  window.addEventListener('touchmove', e => {
    if (e.touches[0]) {
      mouse.x = e.touches[0].clientX / width;
      mouse.y = e.touches[0].clientY / height;
    }
  }, { passive: true });

  let state = newState(Math.floor(Math.random() * 2 ** 31));
  function newState(seed) {
    const r = pick(seed);
    const arms = 4 + Math.floor(r() * 9); // 4..12
    const layers = 2 + Math.floor(r() * 5); // 2..6
    const hueShift = Math.floor(r() * 360);
    const spinBase = (r() - 0.5) * 0.002;
    const breatheSpeed = 0.0002 + r() * 0.001;
    return { seed, arms, layers, hueShift, spinBase, breatheSpeed, t: 0 };
  }

  window.addEventListener('click', () => {
    state = newState(Math.floor(Math.random() * 2 ** 31));
    hud.textContent = `arms: ${state.arms} · depth: ${state.layers} · seed: ${state.seed}`;
  });

  function hsl(h, s, l, a = 1) {
    return `hsla(${(h + state.hueShift) % 360}, ${s}%, ${l}%, ${a})`;
  }

  function draw(time) {
    state.t = time;
    const cx = width / 2;
    const cy = height / 2;
    const maxR = Math.min(width, height) * 0.45;
    const breathe = 1 + Math.sin(time * state.breatheSpeed) * 0.05 + (mouse.y - 0.5) * 0.1;
    const drift = (mouse.x - 0.5) * 0.15;

    ctx.clearRect(0, 0, width, height);

    // background glow
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR * 1.6);
    bg.addColorStop(0, hsl(260, 60, 18, 0.35));
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    ctx.translate(cx, cy);

    for (let layer = state.layers; layer >= 1; layer--) {
      const layerFraction = layer / state.layers;
      const r = maxR * layerFraction * breathe;
      const twist = drift + state.spinBase * time * (layer % 2 === 0 ? 1 : -1);

      for (let i = 0; i < state.arms; i++) {
        const baseAngle = (Math.PI * 2 * i) / state.arms + twist;
        const petalCount = 3 + Math.floor((state.seed % 5) + layer);
        const petalAngle = (Math.PI * 2) / petalCount;

        ctx.save();
        ctx.rotate(baseAngle);

        for (let p = 0; p < petalCount; p++) {
          ctx.save();
          const pa = p * petalAngle + Math.sin(time * 0.0003 + layer) * 0.2;
          ctx.rotate(pa);

          const grad = ctx.createLinearGradient(0, 0, r, 0);
          const hue = (i * 25 + layer * 40 + time * 0.005) % 360;
          grad.addColorStop(0, hsl(hue, 70, 55, 0));
          grad.addColorStop(0.3, hsl(hue, 75, 60, 0.35));
          grad.addColorStop(0.7, hsl(hue + 20, 80, 45, 0.15));
          grad.addColorStop(1, hsl(hue + 40, 60, 30, 0));

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          const width = 0.08 + layerFraction * 0.06;
          ctx.bezierCurveTo(
            r * 0.35, -r * width,
            r * 0.75, -r * width * 0.6,
            r, 0
          );
          ctx.bezierCurveTo(
            r * 0.75, r * width * 0.6,
            r * 0.35, r * width,
            0, 0
          );
          ctx.fill();

          ctx.restore();
        }

        ctx.restore();
      }
    }

    // center orb
    const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, maxR * 0.12);
    cg.addColorStop(0, hsl(300, 80, 80, 0.9));
    cg.addColorStop(1, hsl(320, 60, 40, 0));
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(0, 0, maxR * 0.12, 0, Math.PI * 2);
    ctx.fill();

    // fine particles around the edge
    const rng = pick(state.seed ^ 0x9e3779b9);
    for (let i = 0; i < 80; i++) {
      const angle = rng() * Math.PI * 2;
      const dist = maxR * (0.7 + rng() * 0.9) * breathe;
      const x = Math.cos(angle + time * 0.0001) * dist;
      const y = Math.sin(angle + time * 0.0001) * dist;
      const alpha = 0.3 + Math.sin(time * 0.001 + i) * 0.25;
      ctx.fillStyle = hsl(rng() * 360, 80, 70, alpha);
      ctx.beginPath();
      ctx.arc(x, y, 1 + rng() * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
