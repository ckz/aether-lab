<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Mandala — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #888;
    cursor: crosshair;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 10;
    background: rgba(10, 10, 15, 0.8);
    padding: 10px 20px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
  }
  #ui button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #aaa;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    transition: all 0.3s;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #ui button:hover {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border-color: rgba(255,255,255,0.25);
  }
  #info {
    position: fixed;
    top: 20px;
    left: 20px;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 10;
    pointer-events: none;
  }
  #palette-name {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 10;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="info">Living Mandala — Move mouse to create · Click to burst · Space to pause</div>
<div id="palette-name"></div>
<div id="ui">
  <button onclick="changePalette()">Palette</button>
  <button onclick="toggleSymmetry()">Symmetry</button>
  <button onclick="clearCanvas()">Clear</button>
  <button onclick="saveFrame()">Save</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

// ---- Palettes ----
const palettes = [
  {
    name: 'Aurora',
    colors: ['#00ffa3', '#00e5ff', '#7b2ff7', '#ff2d95', '#00ffa3'],
    bg: 'rgba(10, 10, 20, 0.03)',
    glow: true
  },
  {
    name: 'Ember',
    colors: ['#ff4500', '#ff6a00', '#ffaa00', '#ff0044', '#ff4500'],
    bg: 'rgba(20, 10, 5, 0.03)',
    glow: true
  },
  {
    name: 'Ocean',
    colors: ['#006994', '#00b4d8', '#90e0ef', '#48cae4', '#006994'],
    bg: 'rgba(5, 10, 20, 0.03)',
    glow: false
  },
  {
    name: 'Void',
    colors: ['#ffffff', '#aaaaff', '#ffaaff', '#aaffff', '#ffffff'],
    bg: 'rgba(5, 5, 10, 0.025)',
    glow: true
  },
  {
    name: 'Forest',
    colors: ['#2d6a4f', '#40916c', '#52b788', '#95d5b2', '#2d6a4f'],
    bg: 'rgba(8, 15, 10, 0.03)',
    glow: false
  },
  {
    name: 'Gold',
    colors: ['#b8860b', '#ffd700', '#ffec8b', '#daa520', '#b8860b'],
    bg: 'rgba(15, 12, 5, 0.025)',
    glow: true
  }
];
let paletteIdx = 0;
let currentPalette = palettes[0];

function changePalette() {
  paletteIdx = (paletteIdx + 1) % palettes.length;
  currentPalette = palettes[paletteIdx];
  document.getElementById('palette-name').textContent = currentPalette.name;
}

// ---- Symmetry modes ----
const symmetryModes = [6, 8, 12, 5, 3];
let symmetryIdx = 2; // start at 12-fold

function toggleSymmetry() {
  symmetryIdx = (symmetryIdx + 1) % symmetryModes.length;
}

function getSymmetry() {
  return symmetryModes[symmetryIdx];
}

// ---- Particles ----
let particles = [];
let mouse = { x: cx, y: cy, active: false, down: false };
let time = 0;
let paused = false;
let autoMode = true;

class Particle {
  constructor(x, y, burst = false) {
    this.x = x;
    this.y = y;
    this.angle = Math.atan2(y - cy, x - cx);
    this.radius = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
    this.life = 1;
    this.decay = 0.003 + Math.random() * 0.008;
    this.size = 1 + Math.random() * 2.5;
    this.colorIdx = Math.floor(Math.random() * currentPalette.colors.length);
    this.speed = burst ? (2 + Math.random() * 4) : (0.2 + Math.random() * 1.2);
    this.rotSpeed = (Math.random() - 0.5) * 0.02;
    this.wobbleAmp = Math.random() * 0.02;
    this.wobbleFreq = 0.02 + Math.random() * 0.03;
    this.phase = Math.random() * Math.PI * 2;
    this.trail = [];
  }

  update() {
    this.life -= this.decay;
    this.radius += this.speed * 0.3;
    this.angle += this.rotSpeed + Math.sin(time * this.wobbleFreq + this.phase) * this.wobbleAmp;
    this.x = cx + Math.cos(this.angle) * this.radius;
    this.y = cy + Math.sin(this.angle) * this.radius;

    this.trail.push({ x: this.x, y: this.y, life: this.life });
    if (this.trail.length > 12) this.trail.shift();

    return this.life > 0;
  }

  draw(ctx, sym) {
    const color = currentPalette.colors[this.colorIdx];
    const alpha = this.life * 0.8;

    for (let i = 0; i < sym; i++) {
      const rot = (Math.PI * 2 / sym) * i;
      const cos = Math.cos(rot);
      const sin = Math.sin(rot);

      // Draw trail
      for (let t = 0; t < this.trail.length; t++) {
        const tp = this.trail[t];
        const tAlpha = (t / this.trail.length) * alpha * 0.3;
        const dx = tp.x - cx;
        const dy = tp.y - cy;
        const rx = dx * cos - dy * sin;
        const ry = dx * sin + dy * cos;

        ctx.beginPath();
        ctx.arc(cx + rx, cy + ry, this.size * (t / this.trail.length) * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = color.replace(')', `, ${tAlpha})`).replace('rgb', 'rgba').replace('#', '');

        // Convert hex to rgba for trail
        const r = parseInt(color.slice(1,3) || color.slice(1,3) === '' ? 'ff' : color.slice(1,3), 16);
        const g = parseInt(color.slice(2,4), 16);
        const b = parseInt(color.slice(4,6), 16);
        ctx.fillStyle = `rgba(${parseInt(color.slice(1,3),16)},${parseInt(color.slice(3,5),16)},${parseInt(color.slice(5,7),16)},${tAlpha})`;
        ctx.fill();
      }

      // Draw particle
      const dx = this.x - cx;
      const dy = this.y - cy;
      const rx = dx * cos - dy * sin;
      const ry = dx * sin + dy * cos;

      ctx.beginPath();
      ctx.arc(cx + rx, cy + ry, this.size * this.life, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${parseInt(color.slice(1,3),16)},${parseInt(color.slice(3,5),16)},${parseInt(color.slice(5,7),16)},${alpha})`;
      ctx.fill();

      if (currentPalette.glow && this.life > 0.5) {
        ctx.beginPath();
        ctx.arc(cx + rx, cy + ry, this.size * this.life * 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${parseInt(color.slice(1,3),16)},${parseInt(color.slice(3,5),16)},${parseInt(color.slice(5,7),16)},${alpha * 0.08})`;
        ctx.fill();
      }
    }
  }
}

// ---- Central mandala ring ----
function drawMandalaCenter() {
  const sym = getSymmetry();
  const t = time * 0.005;

  for (let ring = 0; ring < 3; ring++) {
    const r = 30 + ring * 25 + Math.sin(t + ring) * 10;
    const petalCount = sym * (ring + 1);

    for (let i = 0; i < petalCount; i++) {
      const angle = (Math.PI * 2 / petalCount) * i + t * (ring % 2 === 0 ? 1 : -1) * 0.5;
      const px = cx + Math.cos(angle) * r;
      const py = cy + Math.sin(angle) * r;
      const color = currentPalette.colors[i % currentPalette.colors.length];
      const alpha = 0.15 + Math.sin(t * 2 + i) * 0.1;

      ctx.beginPath();
      ctx.arc(px, py, 2 + Math.sin(t * 3 + i * 0.5) * 1.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${parseInt(color.slice(1,3),16)},${parseInt(color.slice(3,5),16)},${parseInt(color.slice(5,7),16)},${alpha})`;
      ctx.fill();
    }
  }
}

// ---- Auto generation ----
let autoTimer = 0;

function autoGenerate() {
  autoTimer++;
  if (autoTimer % 3 === 0) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 50 + Math.random() * 150;
    const x = cx + Math.cos(angle) * dist;
    const y = cy + Math.sin(angle) * dist;
    particles.push(new Particle(x, y));
  }
  // Slow drift toward mouse in auto mode
  if (autoMode && !mouse.active) {
    mouse.x = cx + Math.cos(time * 0.008) * 200;
    mouse.y = cy + Math.sin(time * 0.011) * 150;
  }
}

// ---- Input ----
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
  autoMode = false;
  if (!paused) {
    for (let i = 0; i < 3; i++) {
      particles.push(new Particle(
        mouse.x + (Math.random() - 0.5) * 20,
        mouse.y + (Math.random() - 0.5) * 20
      ));
    }
  }
});

canvas.addEventListener('mousedown', () => {
  mouse.down = true;
  // Burst
  for (let i = 0; i < 60; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * 40;
    particles.push(new Particle(
      mouse.x + Math.cos(angle) * dist,
      mouse.y + Math.sin(angle) * dist,
      true
    ));
  }
});

canvas.addEventListener('mouseup', () => mouse.down = false);

canvas.addEventListener('mouseleave', () => {
  mouse.active = false;
  autoMode = true;
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const touch = e.touches[0];
  mouse.x = touch.clientX;
  mouse.y = touch.clientY;
  mouse.active = true;
  autoMode = false;
  if (!paused) {
    for (let i = 0; i < 2; i++) {
      particles.push(new Particle(
        mouse.x + (Math.random() - 0.5) * 20,
        mouse.y + (Math.random() - 0.5) * 20
      ));
    }
  }
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    paused = !paused;
  }
});

// ---- Controls ----
function clearCanvas() {
  particles = [];
  ctx.fillStyle = 'rgba(10, 10, 15, 1)';
  ctx.fillRect(0, 0, W, H);
}

function saveFrame() {
  const link = document.createElement('a');
  link.download = `mandala-${Date.now()}.png`;
  link.href = canvas.toDataURL();
  link.click();
}

// ---- Main loop ----
function animate() {
  if (!paused) {
    time++;

    // Fade trail
    ctx.fillStyle = currentPalette.bg;
    ctx.fillRect(0, 0, W, H);

    // Center mandala
    drawMandalaCenter();

    // Auto generation
    if (autoMode) autoGenerate();

    // Continuous emission at mouse
    if (mouse.active && mouse.down) {
      for (let i = 0; i < 8; i++) {
        particles.push(new Particle(
          mouse.x + (Math.random() - 0.5) * 30,
          mouse.y + (Math.random() - 0.5) * 30,
          true
        ));
      }
    }

    // Update & draw particles
    particles = particles.filter(p => {
      const alive = p.update();
      if (alive) p.draw(ctx, getSymmetry());
      return alive;
    });

    // Limit particles
    if (particles.length > 2000) {
      particles = particles.slice(-1500);
    }
  }

  requestAnimationFrame(animate);
}

// Init
ctx.fillStyle = 'rgba(10, 10, 15, 1)';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
