<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Nexus</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050508; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .overlay {
    position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.35); font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.7rem; letter-spacing: 0.1em; pointer-events: none; z-index: 10;
    text-align: center;
  }
  .overlay span { color: rgba(255,255,255,0.6); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="overlay">move mouse to influence the nexus &nbsp;·&nbsp; <span>click to pulse</span></div>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);
  let mouse = { x: -9999, y: -9999, active: false, clickPulse: 0 };
  let nodes = [];
  const NODE_COUNT = 140;
  const CONNECTION_DIST = 140;
  const MOUSE_RADIUS = 200;
  const MOUSE_FORCE = 0.04;

  const palette = [
    [120, 80, 255],   // violet
    [60, 180, 255],   // sky blue
    [255, 100, 180],  // rose
    [100, 255, 200],  // mint
    [255, 180, 80],   // amber
    [180, 100, 255],  // lavender
  ];

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  class Node {
    constructor() {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.vx = (Math.random() - 0.5) * 0.4;
      this.vy = (Math.random() - 0.5) * 0.4;
      this.baseRadius = 1.2 + Math.random() * 2.2;
      this.radius = this.baseRadius;
      this.color = palette[Math.floor(Math.random() * palette.length)];
      this.phase = Math.random() * Math.PI * 2;
      this.pulseSpeed = 0.005 + Math.random() * 0.015;
      this.wanderAngle = Math.random() * Math.PI * 2;
    }

    update(time) {
      // Organic wandering
      this.wanderAngle += (Math.random() - 0.5) * 0.15;
      this.vx += Math.cos(this.wanderAngle) * 0.03;
      this.vy += Math.sin(this.wanderAngle) * 0.03;

      // Mouse influence
      if (mouse.active) {
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < MOUSE_RADIUS && dist > 1) {
          const force = (1 - dist / MOUSE_RADIUS) * MOUSE_FORCE;
          const angle = Math.atan2(dy, dx);
          // Swirl + attract
          this.vx += Math.cos(angle + Math.PI * 0.5) * force * 2;
          this.vy += Math.sin(angle + Math.PI * 0.5) * force * 2;
          this.vx += Math.cos(angle) * force;
          this.vy += Math.sin(angle) * force;
        }
      }

      // Click pulse shockwave
      if (mouse.clickPulse > 0) {
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const pulseRadius = (1 - mouse.clickPulse) * Math.max(W, H) * 0.8;
        const diff = Math.abs(dist - pulseRadius);
        if (diff < 60 && dist > 1) {
          const force = (1 - diff / 60) * mouse.clickPulse * 3;
          this.vx -= (dx / dist) * force;
          this.vy -= (dy / dist) * force;
        }
      }

      // Damping
      this.vx *= 0.97;
      this.vy *= 0.97;

      // Speed cap
      const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      if (speed > 2.5) {
        this.vx = (this.vx / speed) * 2.5;
        this.vy = (this.vy / speed) * 2.5;
      }

      this.x += this.vx;
      this.y += this.vy;

      // Wrap around edges with padding
      const pad = 40;
      if (this.x < -pad) this.x = W + pad;
      if (this.x > W + pad) this.x = -pad;
      if (this.y < -pad) this.y = H + pad;
      if (this.y > H + pad) this.y = -pad;

      // Pulsing radius
      this.radius = this.baseRadius + Math.sin(time * this.pulseSpeed + this.phase) * 0.6;
    }

    draw(ctx) {
      const [r, g, b] = this.color;
      const alpha = 0.7 + Math.sin(this.phase) * 0.2;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.fill();
      // Soft glow
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 4);
      grad.addColorStop(0, `rgba(${r},${g},${b},0.25)`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius * 4, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }
  }

  function init() {
    resize();
    nodes = [];
    for (let i = 0; i < NODE_COUNT; i++) {
      nodes.push(new Node());
    }
  }

  function drawConnections() {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const dx = nodes[i].x - nodes[j].x;
        const dy = nodes[i].y - nodes[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < CONNECTION_DIST) {
          const alpha = (1 - dist / CONNECTION_DIST) * 0.35;
          // Blend colors of connected nodes
          const c1 = nodes[i].color;
          const c2 = nodes[j].color;
          const r = Math.round((c1[0] + c2[0]) / 2);
          const g = Math.round((c1[1] + c2[1]) / 2);
          const b = Math.round((c1[2] + c2[2]) / 2);
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
  }

  let time = 0;
  function animate() {
    time++;
    ctx.fillStyle = 'rgba(5, 5, 8, 0.15)';
    ctx.fillRect(0, 0, W, H);

    // Decay click pulse
    if (mouse.clickPulse > 0) {
      mouse.clickPulse *= 0.94;
      if (mouse.clickPulse < 0.005) mouse.clickPulse = 0;
    }

    // Update & draw nodes
    for (const node of nodes) {
      node.update(time);
    }
    drawConnections();
    for (const node of nodes) {
      node.draw(ctx);
    }

    requestAnimationFrame(animate);
  }

  // Events
  window.addEventListener('resize', () => {
    resize();
  });

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });

  window.addEventListener('mouseleave', () => {
    mouse.active = false;
  });

  window.addEventListener('click', (e) => {
    mouse.clickPulse = 1;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  window.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
      mouse.active = true;
    }
  }, { passive: true });

  window.addEventListener('touchend', () => {
    mouse.active = false;
  });

  init();
  animate();
})();
</script>
</body>
</html>
