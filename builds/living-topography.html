<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Topography — Aether Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #050510;
    color: #eee;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100%;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }
  .controls {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 20;
    pointer-events: all;
  }
  .btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.2);
    color: #ccc;
    padding: 8px 18px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
  }
  .btn:hover {
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.5);
    color: #fff;
  }
  .info {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.4;
    z-index: 20;
    text-align: center;
    pointer-events: none;
  }
  .palette-indicator {
    position: fixed;
    top: 24px;
    right: 24px;
    display: flex;
    gap: 4px;
    z-index: 20;
    pointer-events: none;
  }
  .swatch {
    width: 14px;
    height: 14px;
    border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="info">Move mouse to shape the terrain · Click to bloom · Space to shift palette</div>
<div class="palette-indicator" id="paletteIndicator"></div>
<div class="controls">
  <button class="btn" id="btnBloom">Bloom</button>
  <button class="btn" id="btnShift">Shift</button>
  <button class="btn" id="btnReset">Reset</button>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  const state = {
    mouse: { x: 0.5, y: 0.5, px: 0.5, py: 0.5, active: false },
    time: 0,
    paletteIndex: 0,
    blooms: [],
    contourPhase: 0,
    particlePhase: 0,
  };

  const palettes = [
    { name: 'Aurora',    bg: [5,5,16],     colors: ['#00ffd5','#ff00e5','#0066ff','#ff6600','#aaff00'], glow: '#00ffd5' },
    { name: 'Ember',     bg: [16,5,5],      colors: ['#ff4400','#ffaa00','#ff0066','#ffdd44','#ff3300'], glow: '#ff4400' },
    { name: 'Deep Sea',  bg: [3,8,20],      colors: ['#0033ff','#00ccff','#0066ff','#00ffcc','#0044ff'], glow: '#0066ff' },
    { name: 'Mycelium',  bg: [10,5,16],     colors: ['#ff66cc','#cc33ff','#66ffcc','#ff33cc','#ccff66'], glow: '#cc33ff' },
    { name: 'Mineral',   bg: [12,10,5],     colors: ['#ffd700','#ff8c00','#daa520','#ffaa00','#ffcc66'], glow: '#ffd700' },
  ];

  function currentPalette() { return palettes[state.paletteIndex]; }

  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16)/255;
    const g = parseInt(hex.slice(3,5),16)/255;
    const b = parseInt(hex.slice(5,7),16)/255;
    return [r,g,b];
  }

  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Noise-like functions using layered sines
  function noise2D(x, y, t) {
    return (
      Math.sin(x * 1.3 + t * 0.4) * Math.cos(y * 0.9 + t * 0.3) * 0.5 +
      Math.sin(x * 2.7 - t * 0.6) * Math.cos(y * 2.1 + t * 0.5) * 0.3 +
      Math.sin((x + y) * 1.1 + t * 0.2) * 0.2
    );
  }

  function fbm(x, y, t) {
    let val = 0, amp = 0.5, freq = 1;
    for (let i = 0; i < 4; i++) {
      val += amp * noise2D(x * freq, y * freq, t);
      amp *= 0.5;
      freq *= 2.1;
    }
    return val;
  }

  // Contour lines
  function drawContours(t, mx, my) {
    const step = 18;
    const palette = currentPalette();
    const glow = hexToRgb(palette.glow);

    for (let x = 0; x < W; x += step) {
      for (let y = 0; y < H; y += step) {
        const nx = x / W * 3;
        const ny = y / H * 3;
        const mouseDist = Math.hypot((x/W) - mx, (y/H) - my);
        const mouseInfluence = Math.exp(-mouseDist * 4) * 0.6;

        const n = fbm(nx + state.contourPhase, ny + state.contourPhase * 0.7, t * 0.15);
        const elevation = n + mouseInfluence * Math.sin(t * 2 + mouseDist * 10);

        const isoLevels = [0.15, 0.0, -0.15, -0.3, -0.45];
        for (let i = 0; i < isoLevels.length; i++) {
          const dist = Math.abs(elevation - isoLevels[i]);
          if (dist < 0.06) {
            const alpha = (1 - dist / 0.06) * (0.25 - i * 0.04);
            if (alpha > 0.01) {
              const ci = i % palette.colors.length;
              ctx.strokeStyle = palette.colors[ci];
              ctx.globalAlpha = alpha;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.arc(x + step/2, y + step/2, step * 0.7, 0, Math.PI * 2);
              ctx.stroke();
            }
          }
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // Flowing particles along contour-ish paths
  const particles = [];
  const MAX_PARTICLES = 300;

  function spawnParticle() {
    const palette = currentPalette();
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      age: 0,
      maxAge: 150 + Math.random() * 250,
      size: 0.5 + Math.random() * 2.5,
      speed: 0.3 + Math.random() * 1.5,
      color: palette.colors[Math.floor(Math.random() * palette.colors.length)],
      trail: [],
    };
  }

  function initParticles() {
    particles.length = 0;
    for (let i = 0; i < MAX_PARTICLES; i++) particles.push(spawnParticle());
  }

  function updateParticles(t, mx, my) {
    if (particles.length < MAX_PARTICLES && Math.random() < 0.15) particles.push(spawnParticle());

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age++;
      if (p.age > p.maxAge) { particles[i] = spawnParticle(); continue; }

      const nx = p.x / W * 3;
      const ny = p.y / H * 3;
      const mouseDist = Math.hypot((p.x/W) - mx, (p.y/H) - my);
      const mouseInfluence = Math.exp(-mouseDist * 5) * 2;

      const angle = fbm(nx, ny, t * 0.1) * Math.PI * 4 + mouseInfluence * Math.sin(t * 3);
      const speed = p.speed * (1 + mouseInfluence * 3);

      p.x += Math.cos(angle) * speed;
      p.y += Math.sin(angle) * speed;

      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > 20) p.trail.shift();

      // Wrap
      if (p.x < 0) p.x = W;
      if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H;
      if (p.y > H) p.y = 0;

      // Draw trail
      const life = 1 - p.age / p.maxAge;
      if (p.trail.length > 1) {
        ctx.beginPath();
        ctx.moveTo(p.trail[0].x, p.trail[0].y);
        for (let j = 1; j < p.trail.length; j++) ctx.lineTo(p.trail[j].x, p.trail[j].y);
        ctx.strokeStyle = p.color;
        ctx.globalAlpha = life * 0.4;
        ctx.lineWidth = p.size * 0.6;
        ctx.stroke();
      }

      // Glow dot
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = life * 0.9;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Blooms — organic radial bursts
  function updateBlooms(t) {
    for (let i = state.blooms.length - 1; i >= 0; i--) {
      const b = state.blooms[i];
      b.age++;
      if (b.age > b.maxAge) { state.blooms.splice(i, 1); continue; }

      const life = 1 - b.age / b.maxAge;
      const palette = currentPalette();
      const numPetals = 7 + Math.floor(b.seed % 5);
      const baseRadius = life * 180 * b.scale;

      for (let j = 0; j < numPetals; j++) {
        const angle = (j / numPetals) * Math.PI * 2 + b.seed;
        const wobble = Math.sin(t * 2 + j + b.seed) * 20 * life;
        const px = b.x + Math.cos(angle) * (baseRadius + wobble);
        const py = b.y + Math.sin(angle) * (baseRadius + wobble);
        const ci = (j + Math.floor(b.seed)) % palette.colors.length;

        ctx.beginPath();
        ctx.arc(px, py, 3 + life * 8, 0, Math.PI * 2);
        ctx.fillStyle = palette.colors[ci];
        ctx.globalAlpha = life * 0.8;
        ctx.fill();
      }

      // Center glow
      const glowGrad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, baseRadius * 0.6);
      const gc = hexToRgb(palette.glow);
      glowGrad.addColorStop(0, `rgba(${gc[0]*255|0},${gc[1]*255|0},${gc[2]*255|0},${life * 0.5})`);
      glowGrad.addColorStop(1, `rgba(${gc[0]*255|0},${gc[1]*255|0},${gc[2]*255|0},0)`);
      ctx.beginPath();
      ctx.arc(b.x, b.y, baseRadius * 0.6, 0, Math.PI * 2);
      ctx.fillStyle = glowGrad;
      ctx.globalAlpha = 1;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Background gradient based on mouse
  function drawBackground(t) {
    const palette = currentPalette();
    const bg = palette.bg;
    const mx = state.mouse.x;
    const my = state.mouse.y;

    const grad = ctx.createRadialGradient(
      mx * W, my * H, 0,
      mx * W, my * H, Math.max(W, H) * 0.8
    );
    grad.addColorStop(0, `rgb(${bg[0]+30},${bg[1]+30},${bg[2]+30})`);
    grad.addColorStop(0.5, `rgb(${bg[0]},${bg[1]},${bg[2]})`);
    grad.addColorStop(1, `rgb(${bg[0]-3},${bg[1]-3},${bg[2]-3})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  // Topographic scanlines
  function drawScanlines(t) {
    const palette = currentPalette();
    ctx.globalAlpha = 0.03;
    for (let y = 0; y < H; y += 3) {
      const wave = Math.sin(y * 0.02 + t * 0.5) * 20;
      const hueShift = Math.sin(y * 0.01 + state.contourPhase) * 0.5 + 0.5;
      const ci = Math.floor(hueShift * (palette.colors.length - 1));
      ctx.strokeStyle = palette.colors[ci];
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(0, y + wave);
      ctx.lineTo(W, y - wave);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    const t = state.time * 0.016;
    state.contourPhase += 0.002;
    state.particlePhase += 0.001;

    // Smooth mouse
    state.mouse.x += (state.mouse.px - state.mouse.x) * 0.05;
    state.mouse.y += (state.mouse.py - state.mouse.y) * 0.05;
    const mx = state.mouse.x;
    const my = state.mouse.y;

    drawBackground(t);
    drawScanlines(t);
    drawContours(t, mx, my);
    updateParticles(t, mx, my);
    updateBlooms(t);

    state.time++;
    requestAnimationFrame(render);
  }

  // Events
  window.addEventListener('mousemove', (e) => {
    state.mouse.px = e.clientX / W;
    state.mouse.py = e.clientY / H;
    state.mouse.active = true;
  });

  window.addEventListener('click', (e) => {
    // Don't trigger bloom when clicking buttons
    if (e.target.classList.contains('btn')) return;
    state.blooms.push({
      x: e.clientX,
      y: e.clientY,
      age: 0,
      maxAge: 120,
      scale: 0.6 + Math.random() * 1.4,
      seed: Math.random() * 100,
    });
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); shiftPalette(); }
  });

  document.getElementById('btnBloom').addEventListener('click', (e) => {
    e.stopPropagation();
    state.blooms.push({
      x: W/2 + (Math.random() - 0.5) * W * 0.5,
      y: H/2 + (Math.random() - 0.5) * H * 0.5,
      age: 0, maxAge: 180, scale: 1 + Math.random(), seed: Math.random() * 100,
    });
  });

  document.getElementById('btnShift').addEventListener('click', (e) => {
    e.stopPropagation();
    shiftPalette();
  });

  document.getElementById('btnReset').addEventListener('click', (e) => {
    e.stopPropagation();
    state.blooms = [];
    initParticles();
    state.paletteIndex = 0;
    updatePaletteIndicator();
  });

  function shiftPalette() {
    state.paletteIndex = (state.paletteIndex + 1) % palettes.length;
    updatePaletteIndicator();
  }

  function updatePaletteIndicator() {
    const el = document.getElementById('paletteIndicator');
    const palette = currentPalette();
    el.innerHTML = palette.colors.map(c => `<div class="swatch" style="background:${c}"></div>`).join('');
  }
  updatePaletteIndicator();

  initParticles();
  render();
})();
</script>
</body>
</html>
