<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luminous Drift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05050a; }
  canvas { display: block; cursor: crosshair; }
  .ui {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center;
    background: rgba(10,10,20,.7); backdrop-filter: blur(10px);
    padding: 10px 20px; border-radius: 30px;
    border: 1px solid rgba(120,100,220,.2);
    font: 11px/1 'Courier New', monospace; color: #8899bb;
    z-index: 10; user-select: none;
  }
  .ui button {
    background: rgba(120,100,220,.15); border: 1px solid rgba(120,100,220,.3);
    color: #aab; padding: 5px 14px; border-radius: 14px; cursor: pointer;
    font: inherit; transition: all .2s; letter-spacing: .05em;
  }
  .ui button:hover { background: rgba(120,100,220,.3); color: #dde; }
  .ui .sep { width: 1px; height: 16px; background: rgba(120,100,220,.2); }
  .ui label { display: flex; align-items: center; gap: 6px; }
  .ui input[type=range] {
    width: 70px; accent-color: #8878dd; height: 3px;
  }
  .ui .palette { display: flex; gap: 6px; }
  .ui .dot {
    width: 14px; height: 14px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: all .2s;
  }
  .ui .dot.active { border-color: #fff; transform: scale(1.2); }
  .hint {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    font: 10px/1.4 'Courier New', monospace; color: rgba(140,130,200,.5);
    letter-spacing: .15em; text-transform: uppercase; z-index: 10;
    pointer-events: none; transition: opacity 2s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">move · click · space · 1-5</div>
<div class="ui">
  <button id="burst">✦ Burst</button>
  <div class="sep"></div>
  <label>Trail
    <input type="range" id="trail" min="0.01" max="0.15" step="0.005" value="0.04">
  </label>
  <label>Count
    <input type="range" id="count" min="200" max="2500" step="100" value="1200">
  </label>
  <div class="sep"></div>
  <div class="palette" id="palettes"></div>
  <div class="sep"></div>
  <button id="save">⬇ Save</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize(); window.addEventListener('resize', resize);

// --- Palettes ---
const PALETTES = [
  { name: 'Cosmos',  bg: '#05050a', colors: ['#7b6dff','#4ec9ff','#c084fc','#60a5fa','#a78bfa','#38bdf8'] },
  { name: 'Nebula',  bg: '#0a0510', colors: ['#ff6bcb','#c084fc','#7b6dff','#f472b6','#a78bfa','#e879f9'] },
  { name: 'Aurora',  bg: '#030a08', colors: ['#34d399','#22d3ee','#4ade80','#2dd4bf','#6ee7b7','#67e8f9'] },
  { name: 'Ember',   bg: '#0a0503', colors: ['#ff6b35','#fbbf24','#ff8c42','#f59e0b','#ef4444','#f97316'] },
  { name: 'Void',    bg: '#050508', colors: ['#e2e8f0','#94a3b8','#cbd5e1','#f1f5f9','#a5b4fc','#ddd6fe'] },
];
let paletteIdx = 0;
let trailAlpha = 0.04;
let targetCount = 1200;

// --- Particles ---
const MAX = 3000;
let particles = [];
class Particle {
  constructor(x, y, vx, vy) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.vx = vx || 0;
    this.vy = vy || 0;
    this.life = Math.random() * 300 + 200;
    this.age = 0;
    this.colorIdx = Math.floor(Math.random() * 6);
    this.size = Math.random() * 1.5 + 0.5;
  }
  update(field, mx, my, mouseDown) {
    this.age++;
    const scale = 0.003;
    const angle = field(this.x * scale, this.y * scale, performance.now() * 0.0001) * Math.PI * 4;
    const speed = 0.6;
    this.vx += Math.cos(angle) * speed * 0.15;
    this.vy += Math.sin(angle) * speed * 0.15;
    // mouse interaction
    if (mx !== null) {
      const dx = this.x - mx, dy = this.y - my;
      const dist = Math.sqrt(dx * dx + dy * dy) + 1;
      const force = mouseDown ? 180 : 80;
      if (dist < force) {
        const f = (1 - dist / force) * (mouseDown ? 2.5 : 0.8);
        this.vx += (dx / dist) * f;
        this.vy += (dy / dist) * f;
      }
    }
    this.vx *= 0.94; this.vy *= 0.94;
    this.x += this.vx; this.y += this.vy;
    // wrap
    if (this.x < -20) this.x = W + 20;
    if (this.x > W + 20) this.x = -20;
    if (this.y < -20) this.y = H + 20;
    if (this.y > H + 20) this.y = -20;
    return this.age < this.life;
  }
}

function simplexLike(x, y, z) {
  // Simple procedural noise approximation
  const n = Math.sin(x * 1.2 + z) * Math.cos(y * 0.9 + z * 0.7) +
            Math.sin((x + y) * 0.7 + z * 1.3) * 0.5 +
            Math.cos(x * 2.1 - y * 1.8 + z * 0.5) * 0.3;
  return n;
}
const field = simplexLike;

function initParticles(count) {
  particles = [];
  for (let i = 0; i < count; i++) particles.push(new Particle());
}
initParticles(targetCount);

// --- Interaction ---
let mx = null, my = null, mouseDown = false;
window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
window.addEventListener('mousedown', e => { mouseDown = true; mx = e.clientX; my = e.clientY; });
window.addEventListener('mouseup', () => { mouseDown = false; });
window.addEventListener('mouseleave', () => { mx = null; my = null; mouseDown = false; });
window.addEventListener('touchmove', e => {
  e.preventDefault(); mx = e.touches[0].clientX; my = e.touches[0].clientY;
}, { passive: false });
window.addEventListener('touchstart', e => {
  mouseDown = true; mx = e.touches[0].clientX; my = e.touches[0].clientY;
});
window.addEventListener('touchend', () => { mouseDown = false; });

function burst() {
  const cx = mx ?? W / 2, cy = my ?? H / 2;
  for (let i = 0; i < 80; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 6 + 2;
    if (particles.length < MAX) particles.push(new Particle(cx, cy, Math.cos(a)*s, Math.sin(a)*s));
  }
}
window.addEventListener('click', e => {
  if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
  burst();
});
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); burst(); }
  if (e.key >= '1' && e.key <= '5') { paletteIdx = parseInt(e.key) - 1; buildPaletteUI(); }
});

// --- UI ---
const trailInput = document.getElementById('trail');
const countInput = document.getElementById('count');
trailInput.addEventListener('input', () => { trailAlpha = parseFloat(trailInput.value); });
countInput.addEventListener('input', () => {
  targetCount = parseInt(countInput.value);
  while (particles.length < targetCount) particles.push(new Particle());
});
document.getElementById('burst').addEventListener('click', burst);
document.getElementById('save').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'luminous-drift.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

function buildPaletteUI() {
  const container = document.getElementById('palettes');
  container.innerHTML = '';
  PALETTES.forEach((p, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === paletteIdx ? ' active' : '');
    dot.style.background = p.colors[0];
    dot.title = p.name;
    dot.addEventListener('click', () => { paletteIdx = i; buildPaletteUI(); });
    container.appendChild(dot);
  });
}
buildPaletteUI();

// Hide hint after a few seconds
setTimeout(() => { document.getElementById('hint').style.opacity = '0'; }, 4000);

// --- Render ---
function draw() {
  const pal = PALETTES[paletteIdx];
  // fade trail
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = pal.bg;
  ctx.globalAlpha = trailAlpha;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;

  // additive blending for glow
  ctx.globalCompositeOperation = 'lighter';

  // update & draw
  const t = performance.now() * 0.0001;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (!p.update(field, mx, my, mouseDown)) {
      particles.splice(i, 1);
      continue;
    }
    const ci = (p.colorIdx + Math.floor(t * 2)) % pal.colors.length;
    ctx.globalAlpha = Math.min(1, (1 - p.age / p.life) * 0.7);
    ctx.fillStyle = pal.colors[ci];
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // maintain count
  while (particles.length < targetCount) particles.push(new Particle());

  requestAnimationFrame(draw);
}
// initial fill
ctx.fillStyle = PALETTES[0].bg;
ctx.fillRect(0, 0, W, H);
draw();
</script>
</body>
</html>
