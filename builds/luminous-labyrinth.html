<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luminous Labyrinth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #07060e;
    font-family: 'Courier New', monospace;
    color: #c8c8ff;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #wrap {
    position: relative;
    box-shadow: 0 0 80px rgba(90, 60, 200, .25);
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid rgba(120, 100, 220, .25);
  }
  canvas {
    display: block;
    background: #07060e;
    image-rendering: pixelated;
  }
  #ui {
    position: absolute;
    top: 10px; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 14px;
    font-size: 11px;
    letter-spacing: .15em;
    color: rgba(200, 200, 255, .7);
    pointer-events: none;
    text-shadow: 0 0 8px rgba(120, 100, 220, .6);
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(7, 6, 14, .82);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    transition: opacity .4s;
    z-index: 5;
  }
  #overlay h1 {
    font-size: 18px;
    letter-spacing: .35em;
    color: #d0c8ff;
    text-shadow: 0 0 18px rgba(140, 110, 255, .8);
  }
  #overlay p {
    font-size: 11px;
    opacity: .6;
    letter-spacing: .15em;
    max-width: 320px;
    text-align: center;
    line-height: 1.7;
  }
  #overlay button {
    margin-top: 6px;
    padding: 10px 26px;
    background: transparent;
    border: 1px solid rgba(140, 110, 255, .5);
    color: #c8c8ff;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .25em;
    cursor: pointer;
    border-radius: 3px;
    transition: all .25s;
  }
  #overlay button:hover {
    background: rgba(120, 90, 240, .15);
    border-color: rgba(180, 150, 255, .7);
    box-shadow: 0 0 20px rgba(120, 90, 240, .2);
  }
  #overlay .hidden { opacity: 0; pointer-events: none; }
  .hint {
    margin-top: 14px;
    font-size: 10px;
    opacity: .3;
    letter-spacing: .15em;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="ui">
    <span id="level">LEVEL 1</span>
    <span id="orbs">ORBS 0 / 5</span>
    <span id="time">00:00</span>
  </div>
  <div id="overlay">
    <h1>LUMINOUS LABYRINTH</h1>
    <p>Navigate the shifting maze. Collect all light orbs to open the exit. Use arrow keys or WASD.</p>
    <button id="startBtn">BEGIN</button>
    <p class="hint">The walls breathe. The orbs drift. Find your way.</p>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const levelEl = document.getElementById('level');
  const orbsEl = document.getElementById('orbs');
  const timeEl = document.getElementById('time');

  // Fixed internal resolution scaled to fit
  const W = 480, H = 480;
  const TILE = 32;
  const COLS = W / TILE, ROWS = H / TILE;
  canvas.width = W; canvas.height = H;

  function resize() {
    const maxW = Math.min(window.innerWidth - 24, 600);
    const maxH = Math.min(window.innerHeight - 80, 600);
    const s = Math.min(maxW / W, maxH / H);
    canvas.style.width = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // Maze generation via recursive backtracker
  let maze, player, orbs, exitOpen, level, collected, startTime, running;
  const TRAIL = [];
  const MAX_TRAIL = 30;
  let particles = [];
  let deathTimer = 0;

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function generateMaze() {
    const grid = [];
    for (let y = 0; y < ROWS; y++) {
      grid[y] = [];
      for (let x = 0; x < COLS; x++) {
        grid[y][x] = {
          x, y,
          walls: { N: true, S: true, E: true, W: true },
          visited: false
        };
      }
    }
    const dirs = [
      { name: 'N', dx: 0, dy: -1, opp: 'S' },
      { name: 'S', dx: 0, dy: 1, opp: 'N' },
      { name: 'E', dx: 1, dy: 0, opp: 'W' },
      { name: 'W', dx: -1, dy: 0, opp: 'E' },
    ];
    const stack = [];
    let current = grid[0][0];
    current.visited = true;
    let visitedCount = 1;
    const total = COLS * ROWS;

    while (visitedCount < total) {
      const neighbors = dirs.filter(d => {
        const nx = current.x + d.dx, ny = current.y + d.dy;
        return nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !grid[ny][nx].visited;
      });
      if (neighbors.length) {
        const chosen = neighbors[Math.floor(Math.random() * neighbors.length)];
        stack.push(current);
        const next = grid[current.y + chosen.dy][current.x + chosen.dx];
        current.walls[chosen.name] = false;
        next.walls[chosen.opp] = false;
        next.visited = true;
        visitedCount++;
        current = next;
      } else if (stack.length) {
        current = stack.pop();
      }
    }
    return grid;
  }

  function initLevel(lvl) {
    level = lvl;
    maze = generateMaze();
    collected = 0;
    const needed = Math.min(3 + lvl, 7);
    orbs = [];
    const occupied = new Set();
    occupied.add('0,0');

    for (let i = 0; i < needed; i++) {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (occupied.has(pos.x + ',' + pos.y));
      occupied.add(pos.x + ',' + pos.y);
      orbs.push({
        x: pos.x * TILE + TILE / 2,
        y: pos.y * TILE + TILE / 2,
        phase: Math.random() * Math.PI * 2,
        hue: 200 + Math.random() * 80,
        collected: false
      });
    }

    player = { x: 0, y: 0, px: 0, py: 0, moving: false };
    player.px = player.x * TILE + TILE / 2;
    player.py = player.y * TILE + TILE / 2;
    exitOpen = false;
    particles = [];
    TRAIL.length = 0;
    deathTimer = 0;
    startTime = performance.now();
    updateUI();
  }

  function updateUI() {
    levelEl.textContent = 'LEVEL ' + level;
    orbsEl.textContent = 'ORBS ' + collected + ' / ' + orbs.length;
  }

  function formatTime(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  // Input
  const keys = {};
  let inputQueue = [];
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)) {
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', e => keys[e.key] = false);

  function tryMove() {
    if (!running || player.moving || deathTimer > 0) return;
    let dx = 0, dy = 0;
    if (keys['ArrowUp'] || keys['w']) dy = -1;
    else if (keys['ArrowDown'] || keys['s']) dy = 1;
    else if (keys['ArrowLeft'] || keys['a']) dx = -1;
    else if (keys['ArrowRight'] || keys['d']) dx = 1;
    if (!dx && !dy) return;

    const tile = maze[player.y][player.x];
    if (dx === 1 && tile.walls.E) return;
    if (dx === -1 && tile.walls.W) return;
    if (dy === 1 && tile.walls.S) return;
    if (dy === -1 && tile.walls.N) return;

    const nx = player.x + dx, ny = player.y + dy;
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;

    player.moving = true;
    player.x = nx;
    player.y = ny;
    TRAIL.push({ x: player.px, y: player.py, age: 0 });
    if (TRAIL.length > MAX_TRAIL) TRAIL.shift();

    // Check orbs
    orbs.forEach(orb => {
      if (orb.collected) return;
      const ox = orb.x - (nx * TILE + TILE / 2);
      const oy = orb.y - (ny * TILE + TILE / 2);
      if (Math.hypot(ox, oy) < TILE * 0.55) {
        orb.collected = true;
        collected++;
        exitOpen = collected >= orbs.length;
        for (let i = 0; i < 16; i++) {
          particles.push({
            x: orb.x, y: orb.y,
            vx: (Math.random() - .5) * 3,
            vy: (Math.random() - .5) * 3,
            life: 1,
            hue: orb.hue,
            size: 2 + Math.random() * 2
          });
        }
        updateUI();
      }
    });

    // Exit cell
    if (nx === COLS - 1 && ny === ROWS - 1 && exitOpen) {
      setTimeout(() => {
        running = false;
        overlay.querySelector('h1').textContent = 'LEVEL ' + (level + 1) + ' AWAITS';
        overlay.querySelector('p').textContent = 'Time: ' + formatTime(performance.now() - startTime) + ' — Ready for the next challenge?';
        startBtn.textContent = 'CONTINUE';
        overlay.classList.remove('hidden');
      }, 400);
    }
  }

  // Touch / click to move on mobile
  canvas.addEventListener('click', e => {
    if (!running) return;
    const rect = canvas.getBoundingClientRect();
    const sx = W / rect.width, sy = H / rect.height;
    const mx = (e.clientX - rect.left) * sx;
    const my = (e.clientY - rect.top) * sy;
    const cx = player.x * TILE + TILE / 2;
    const cy = player.y * TILE + TILE / 2;
    const dx = mx - cx, dy = my - cy;
    if (Math.abs(dx) > TILE * 0.5 || Math.abs(dy) > TILE * 0.5) {
      if (Math.abs(dx) > Math.abs(dy)) {
        keys['Arrow' + (dx > 0 ? 'Right' : 'Left')] = true;
        setTimeout(() => keys['Arrow' + (dx > 0 ? 'Right' : 'Left')] = false, 80);
      } else {
        keys['Arrow' + (dy > 0 ? 'Down' : 'Up')] = true;
        setTimeout(() => keys['Arrow' + (dy > 0 ? 'Down' : 'Up')] = false, 80);
      }
    }
  });

  // Particle system for orbs & effects
  function spawnAmbientParticles() {
    if (Math.random() < 0.3) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - .5) * 0.3,
        vy: -0.2 - Math.random() * 0.4,
        life: 0.4 + Math.random() * 0.6,
        hue: 240 + Math.random() * 40,
        size: 1 + Math.random() * 1.5,
        ambient: true
      });
    }
  }

  // Glow pulse based on level
  let globalHue = 240;
  function getPalette() {
    const hues = [240, 280, 200, 320, 180, 260, 300];
    const base = hues[(level - 1) % hues.length];
    globalHue += (base - globalHue) * 0.02;
    return {
      wall: globalHue,
      orb: globalHue + 40,
      exit: globalHue + 80,
      player: globalHue + 160,
      bg1: 'rgba(7, 6, 14, 1)',
      bg2: `hsla(${globalHue}, 40%, 8%, 1)`
    };
  }

  function draw() {
    const pal = getPalette();
    const now = performance.now() / 1000;
    const lerpSpeed = 0.18;

    // BG
    ctx.fillStyle = pal.bg1;
    ctx.fillRect(0, 0, W, H);

    // Maze
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const t = maze[y][x];
        const cx = x * TILE + TILE / 2;
        const cy = y * TILE + TILE / 2;
        const dist = Math.hypot(cx - player.px, cy - player.py);
        const bright = Math.max(0.15, 1 - dist / (W * 0.7));
        const pulse = 1 + Math.sin(now * 1.5 + x * 0.3 + y * 0.2) * 0.15;
        ctx.strokeStyle = `hsla(${pal.wall}, 50%, ${25 * bright * pulse}%, ${0.55 * bright + 0.25})`;
        if (t.walls.N) { ctx.beginPath(); ctx.moveTo(x * TILE, y * TILE + .5); ctx.lineTo((x + 1) * TILE + .5, y * TILE + .5); ctx.stroke(); }
        if (t.walls.S) { ctx.beginPath(); ctx.moveTo(x * TILE, (y + 1) * TILE + .5); ctx.lineTo((x + 1) * TILE + .5, (y + 1) * TILE + .5); ctx.stroke(); }
        if (t.walls.E) { ctx.beginPath(); ctx.moveTo((x + 1) * TILE + .5, y * TILE); ctx.lineTo((x + 1) * TILE + .5, (y + 1) * TILE + .5); ctx.stroke(); }
        if (t.walls.W) { ctx.beginPath(); ctx.moveTo(x * TILE + .5, y * TILE); ctx.lineTo(x * TILE + .5, (y + 1) * TILE + .5); ctx.stroke(); }
      }
    }

    // Exit glow
    const exitX = (COLS - 1) * TILE + TILE / 2;
    const exitY = (ROWS - 1) * TILE + TILE / 2;
    const exitPulse = exitOpen ? 0.6 + Math.sin(now * 4) * 0.4 : 0.15;
    const exitGrad = ctx.createRadialGradient(exitX, exitY, 2, exitX, exitY, TILE * 1.2);
    exitGrad.addColorStop(0, `hsla(${pal.exit}, 80%, 60%, ${exitPulse})`);
    exitGrad.addColorStop(1, `hsla(${pal.exit}, 80%, 60%, 0)`);
    ctx.fillStyle = exitGrad;
    ctx.fillRect(exitX - TILE * 1.2, exitY - TILE * 1.2, TILE * 2.4, TILE * 2.4);

    // Exit marker
    if (exitOpen) {
      ctx.save();
      ctx.translate(exitX, exitY);
      ctx.rotate(now * 2);
      ctx.strokeStyle = `hsla(${pal.exit}, 90%, 70%, ${0.6 + Math.sin(now * 6) * 0.3})`;
      ctx.lineWidth = 1.5;
      const r = TILE * 0.35;
      ctx.beginPath(); ctx.moveTo(r, 0); ctx.lineTo(-r, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, r); ctx.lineTo(0, -r); ctx.stroke();
      ctx.restore();
    }

    // Orbs
    orbs.forEach(orb => {
      if (orb.collected) return;
      orb.phase += 0.03;
      const ox = orb.x + Math.sin(orb.phase) * 3;
      const oy = orb.y + Math.cos(orb.phase * 1.3) * 3;
      orb._x = ox; orb._y = oy;
      const r = TILE * 0.22 + Math.sin(now * 3 + orb.phase) * 2;
      const g = ctx.createRadialGradient(ox, oy, 1, ox, oy, TILE * 0.9);
      g.addColorStop(0, `hsla(${orb.hue}, 90%, 70%, 0.9)`);
      g.addColorStop(0.5, `hsla(${orb.hue}, 80%, 50%, 0.3)`);
      g.addColorStop(1, `hsla(${orb.hue}, 80%, 50%, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(ox, oy, TILE * 0.9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `hsla(${orb.hue}, 100%, 85%, 1)`;
      ctx.beginPath(); ctx.arc(ox, oy, r, 0, Math.PI * 2); ctx.fill();
    });

    // Player trail
    TRAIL.forEach((pt, i) => {
      pt.age += 0.02;
      const a = Math.max(0, 1 - pt.age);
      if (a <= 0) return;
      ctx.fillStyle = `hsla(${pal.player}, 70%, 55%, ${a * 0.4})`;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 3 * a, 0, Math.PI * 2); ctx.fill();
    });

    // Player
    const targetX = player.x * TILE + TILE / 2;
    const targetY = player.y * TILE + TILE / 2;
    player.px += (targetX - player.px) * lerpSpeed;
    player.py += (targetY - player.py) * lerpSpeed;
    const px = player.px, py = player.py;
    const pg = ctx.createRadialGradient(px, py, 1, px, py, TILE * 1.3);
    pg.addColorStop(0, `hsla(${pal.player}, 80%, 60%, 0.5)`);
    pg.addColorStop(1, `hsla(${pal.player}, 80%, 60%, 0)`);
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(px, py, TILE * 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `hsla(${pal.player}, 100%, 75%, 1)`;
    ctx.beginPath(); ctx.arc(px, py, TILE * 0.28, 0, Math.PI * 2); ctx.fill();
    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(px + 2, py - 2, TILE * 0.08, 0, Math.PI * 2); ctx.fill();

    // Particles
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      p.life -= 0.025;
      if (p.ambient) { p.vy -= 0.003; }
      ctx.fillStyle = `hsla(${p.hue}, 70%, 65%, ${Math.max(0, p.life)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
    });
    particles = particles.filter(p => p.life > 0);

    if (deathTimer > 0) {
      deathTimer--;
      ctx.fillStyle = `rgba(7, 6, 14, ${0.08 * deathTimer})`;
      ctx.fillRect(0, 0, W, H);
    }

    // Ambient
    spawnAmbientParticles();

    // Time
    if (running) timeEl.textContent = formatTime(performance.now() - startTime);

    requestAnimationFrame(draw);
  }

  function startGame() {
    overlay.classList.add('hidden');
    initLevel(1);
    running = true;
  }

  startBtn.addEventListener('click', startGame);

  // Game loop for movement
  setInterval(() => {
    if (running) tryMove();
  }, 120);

  // Draw initial frame
  draw();
})();
</script>
</body>
</html>
