<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murmuration — Emergent Flocking</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #aaa;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    font-size: 11px;
    line-height: 1.8;
    pointer-events: none;
    text-shadow: 0 0 6px rgba(0,0,0,0.9);
  }
  #ui .title { color: #ff9; font-size: 13px; margin-bottom: 6px; }
  #ui .key { color: #aaa; }
  #ui .val { color: #fff; }
  #controls {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 10;
    font-size: 10px;
    color: #555;
    line-height: 1.8;
  }
  #controls span { color: #777; }
  #stats {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10;
    font-size: 10px;
    color: #444;
    text-align: right;
    line-height: 1.8;
  }
  #stats .fps { color: #6a6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="title">◈ murmuration ◈</div>
  <div><span class="key">species</span> <span class="val" id="sp">3</span></div>
  <div><span class="key">boids</span> <span class="val" id="bc">0</span></div>
  <div><span class="key">predators</span> <span class="val" id="pc">0</span></div>
  <div><span class="key">flocks</span> <span class="val" id="fc">0</span></div>
</div>
<div id="stats">
  <div class="fps" id="fps">60 fps</div>
  <div id="mem"></div>
</div>
<div id="controls">
  <span>[click]</span> spawn boids &nbsp;
  <span>[shift+click]</span> predator &nbsp;
  <span>[space]</span> scatter &nbsp;
  <span>[1-4]</span> palettes &nbsp;
  <span>[S]</span> save PNG &nbsp;
  <span>[R]</span> reset
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

// ---- palettes ----
const palettes = [
  { name: 'aurora', bg: '#020812', colors: ['#00ffc8','#ff006e','#ffbe0b','#3a86ff','#8338ec'] },
  { name: 'ember',  bg: '#0a0202', colors: ['#ff4500','#ff8c00','#ffd700','#ff6347','#fff44f'] },
  { name: 'frost',  bg: '#02080c', colors: ['#a0e0ff','#c0f0ff','#60c0e0','#e0f8ff','#4090c0'] },
  { name: 'void',   bg: '#020002', colors: ['#bf00ff','#ff00aa','#ff66cc','#cc33ff','#ff0080'] },
];
let palette = palettes[0];

// ---- boid ----
const SPEED = 3.2;
const PERCEPTION = 60;
const SEPARATION = 24;
const PREDATOR_PERCEPTION = 180;
const PREDATOR_FEAR = 8;

class Boid {
  constructor(x, y, species) {
    this.pos = { x: x || Math.random()*W, y: y || Math.random()*H };
    const a = Math.random()*Math.PI*2;
    this.vel = { x: Math.cos(a)*SPEED, y: Math.sin(a)*SPEED };
    this.acc = { x: 0, y: 0 };
    this.species = species || Math.floor(Math.random()*3);
    this.color = palette.colors[this.species % palette.colors.length];
    this.size = 2.2 + Math.random()*0.8;
    this.maxForce = 0.04 + Math.random()*0.02;
    this.trail = [];
    this.maxTrail = 6;
    this.pulse = Math.random()*Math.PI*2;
  }
  edges() {
    const m = 40;
    if (this.pos.x < m) this.acc.x += 0.15;
    if (this.pos.x > W-m) this.acc.x -= 0.15;
    if (this.pos.y < m) this.acc.y += 0.15;
    if (this.pos.y > H-m) this.acc.y -= 0.15;
  }
  flock(boids, predators) {
    let sep={x:0,y:0,count:0}, ali={x:0,y:0,count:0}, coh={x:0,y:0,count:0};
    let flee={x:0,y:0};

    for (const o of boids) {
      if (o===this) continue;
      const dx = o.pos.x-this.pos.x, dy = o.pos.y-this.pos.y;
      const d = Math.sqrt(dx*dx+dy*dy);
      if (d < PERCEPTION && d > 0) {
        if (o.species === this.species) {
          // separation
          if (d < SEPARATION) {
            sep.x -= dx/d; sep.y -= dy/d; sep.count++;
          }
          // alignment
          ali.x += o.vel.x; ali.y += o.vel.y; ali.count++;
          // cohesion
          coh.x += o.pos.x; coh.y += o.pos.y; coh.count++;
        }
      }
    }

    for (const p of predators) {
      const dx = p.pos.x-this.pos.x, dy = p.pos.y-this.pos.y;
      const d = Math.sqrt(dx*dx+dy*dy);
      if (d < PREDATOR_PERCEPTION) {
        const strength = (1 - d/PREDATOR_PERCEPTION) * PREDATOR_FEAR;
        flee.x -= (dx/d)*strength;
        flee.y -= (dy/d)*strength;
      }
    }

    if (sep.count > 0) {
      sep.x /= sep.count; sep.y /= sep.count;
      const mag = Math.sqrt(sep.x*sep.x+sep.y*sep.y);
      if (mag > 0) { sep.x = sep.x/mag*SPEED-sep.x; sep.y = sep.y/mag*SPEED-sep.y; }
      this.acc.x += sep.x*1.5; this.acc.y += sep.y*1.5;
    }
    if (ali.count > 0) {
      ali.x /= ali.count; ali.y /= ali.count;
      const mag = Math.sqrt(ali.x*ali.x+ali.y*ali.y);
      if (mag > 0) { ali.x = ali.x/mag*SPEED-ali.x; ali.y = ali.y/mag*SPEED-ali.y; }
      this.acc.x += ali.x*1.0; this.acc.y += ali.y*1.0;
    }
    if (coh.count > 0) {
      coh.x = coh.x/coh.count-this.pos.x; coh.y = coh.y/coh.count-this.pos.y;
      const mag = Math.sqrt(coh.x*coh.x+coh.y*coh.y);
      if (mag > 0) { coh.x = coh.x/mag*SPEED-coh.x; coh.y = coh.y/mag*SPEED-coh.y; }
      this.acc.x += coh.x*0.8; this.acc.y += coh.y*0.8;
    }
    this.acc.x += flee.x; this.acc.y += flee.y;
  }
  update() {
    const mag = Math.sqrt(this.vel.x*this.vel.x+this.vel.y*this.vel.y);
    if (mag > SPEED*1.4) { this.vel.x = this.vel.x/mag*SPEED*1.4; this.vel.y = this.vel.y/mag*SPEED*1.4; }
    this.vel.x += this.acc.x; this.vel.y += this.acc.y;
    this.acc.x = 0; this.acc.y = 0;
    this.pos.x += this.vel.x; this.pos.y += this.vel.y;
    this.trail.unshift({ x: this.pos.x, y: this.pos.y });
    if (this.trail.length > this.maxTrail) this.trail.pop();
    this.pulse += 0.05;
  }
  draw() {
    // trail
    for (let i=1; i<this.trail.length; i++) {
      const t = this.trail[i];
      const a = (1 - i/this.trail.length)*0.3;
      const s = this.size*(1 - i/this.trail.length);
      ctx.beginPath();
      ctx.arc(t.x, t.y, s, 0, Math.PI*2);
      ctx.fillStyle = this.color + Math.round(a*255).toString(16).padStart(2,'0');
      ctx.fill();
    }
    // body
    const glow = 0.7 + Math.sin(this.pulse)*0.3;
    ctx.beginPath();
    ctx.arc(this.pos.x, this.pos.y, this.size, 0, Math.PI*2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = glow;
    ctx.fill();
    // bright core
    ctx.beginPath();
    ctx.arc(this.pos.x, this.pos.y, this.size*0.4, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = glow*0.8;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Predator {
  constructor() {
    this.pos = { x: Math.random()*W, y: Math.random()*H };
    const a = Math.random()*Math.PI*2;
    this.vel = { x: Math.cos(a)*2.5, y: Math.sin(a)*2.5 };
    this.acc = { x: 0, y: 0 };
    this.maxSpeed = 3.5;
    this.maxForce = 0.03;
    this.size = 6;
    this.trail = [];
    this.maxTrail = 20;
    this.timer = 0;
  }
  update(boids) {
    // hunt nearest boid
    let nearest = null, nd = Infinity;
    for (const b of boids) {
      const dx = b.pos.x-this.pos.x, dy = b.pos.y-this.pos.y;
      const d = Math.sqrt(dx*dx+dy*dy);
      if (d < nd) { nd = d; nearest = b; }
    }
    if (nearest) {
      const dx = nearest.pos.x-this.pos.x, dy = nearest.pos.y-this.pos.y;
      const d = Math.sqrt(dx*dx+dy*dy);
      const desired = { x: dx/d*this.maxSpeed, y: dy/d*this.maxSpeed };
      this.acc.x += desired.x-this.vel.x;
      this.acc.y += desired.y-this.vel.y;
    }
    const mag = Math.sqrt(this.vel.x*this.vel.x+this.vel.y*this.vel.y);
    if (mag > this.maxSpeed) { this.vel.x = this.vel.x/mag*this.maxSpeed; this.vel.y = this.vel.y/mag*this.maxSpeed; }
    this.vel.x += this.acc.x; this.vel.y += this.acc.y;
    this.acc.x = 0; this.acc.y = 0;
    this.pos.x += this.vel.x; this.pos.y += this.vel.y;
    this.trail.unshift({ x: this.pos.x, y: this.pos.y });
    if (this.trail.length > this.maxTrail) this.trail.pop();
    this.timer++;
  }
  draw() {
    // long trail
    for (let i=1; i<this.trail.length; i++) {
      const t = this.trail[i];
      const a = (1 - i/this.trail.length)*0.15;
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.size*(1 - i/this.trail.length*0.7), 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,60,60,${a})`;
      ctx.fill();
    }
    // body
    const a = 0.5 + Math.sin(this.timer*0.2)*0.3;
    ctx.beginPath();
    ctx.arc(this.pos.x, this.pos.y, this.size, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,80,80,${a})`;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(this.pos.x, this.pos.y, this.size*0.5, 0, Math.PI*2);
    ctx.fillStyle = '#ffcccc';
    ctx.globalAlpha = 0.7;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ---- state ----
let boids = [];
let predators = [];
const SPECIES = 3;
const BOID_COUNT = 500;
const PREDATOR_COUNT = 2;

function init() {
  boids = [];
  predators = [];
  for (let i = 0; i < BOID_COUNT; i++) {
    boids.push(new Boid(Math.random()*W, Math.random()*H, i%SPECIES));
  }
  for (let i = 0; i < PREDATOR_COUNT; i++) {
    predators.push(new Predator());
  }
}
init();

// ---- interaction ----
addEventListener('click', e => {
  if (e.shiftKey) {
    predators.push(new Predator());
    predators[predators.length-1].pos = { x: e.clientX, y: e.clientY };
  } else {
    const n = 15 + Math.floor(Math.random()*10);
    const sp = Math.floor(Math.random()*SPECIES);
    for (let i = 0; i < n; i++) {
      boids.push(new Boid(e.clientX + (Math.random()-0.5)*60, e.clientY + (Math.random()-0.5)*60, sp));
    }
  }
});
addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    for (const b of boids) {
      const a = Math.random()*Math.PI*2;
      b.acc.x += Math.cos(a)*8; b.acc.y += Math.sin(a)*8;
    }
  }
  if (e.key >= '1' && e.key <= '4') {
    palette = palettes[parseInt(e.key)-1];
    for (const b of boids) b.color = palette.colors[b.species % palette.colors.length];
  }
  if (e.key.toLowerCase() === 'r') init();
  if (e.key.toLowerCase() === 's') savePNG();
});

function savePNG() {
  const a = document.createElement('a');
  a.download = `murmuration-${Date.now()}.png`;
  a.href = canvas.toDataURL();
  a.click();
}

// ---- count flocks ----
function countFlocks() {
  const visited = new Set();
  let flocks = 0;
  for (const b of boids) {
    if (visited.has(b)) continue;
    flocks++;
    const stack = [b];
    visited.add(b);
    while (stack.length) {
      const cur = stack.pop();
      for (const o of boids) {
        if (visited.has(o)) continue;
        const dx = o.pos.x-cur.pos.x, dy = o.pos.y-cur.pos.y;
        if (Math.sqrt(dx*dx+dy*dy) < PERCEPTION*0.8 && o.species === cur.species) {
          visited.add(o);
          stack.push(o);
        }
      }
    }
  }
  return flocks;
}

// ---- render ----
let lastTime = performance.now();
let frameCount = 0;
let fpsTime = 0;
let currentFps = 60;

function animate(time) {
  requestAnimationFrame(animate);
  const dt = time - lastTime;
  lastTime = time;
  frameCount++;
  fpsTime += dt;
  if (fpsTime > 500) {
    currentFps = Math.round(frameCount*1000/fpsTime);
    frameCount = 0; fpsTime = 0;
    document.getElementById('fps').textContent = currentFps + ' fps';
  }

  // fade trail
  ctx.fillStyle = palette.bg + '18';
  ctx.fillRect(0, 0, W, H);

  // update
  for (const b of boids) { b.edges(); b.flock(boids, predators); b.update(); }
  for (const p of predators) p.update(boids);

  // consume boids near predator
  for (const p of predators) {
    for (let i = boids.length-1; i >= 0; i--) {
      const dx = p.pos.x-boids[i].pos.x, dy = p.pos.y-boids[i].pos.y;
      if (Math.sqrt(dx*dx+dy*dy) < p.size + boids[i].size + 2) {
        boids.splice(i, 1);
      }
    }
  }

  // draw
  for (const b of boids) b.draw();
  for (const p of predators) p.draw();

  // starfield background
  if (Math.random() < 0.02) {
    ctx.beginPath();
    ctx.arc(Math.random()*W, Math.random()*H, 0.5, 0, Math.PI*2);
    ctx.fillStyle = '#fff3';
    ctx.fill();
  }

  // ui
  document.getElementById('bc').textContent = boids.length;
  document.getElementById('pc').textContent = predators.length;
  document.getElementById('fc').textContent = countFlocks();
  document.getElementById('sp').textContent = SPECIES;
}
requestAnimationFrame(animate);
</script>
</body>
</html>
