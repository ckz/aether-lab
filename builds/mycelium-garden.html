<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mycelium Garden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    cursor: crosshair;
  }
  canvas {
    display: block;
  }
  .ui {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    text-align: center;
    transition: opacity 0.5s;
  }
  .ui.fade {
    opacity: 0;
  }
  .stats {
    position: fixed;
    bottom: 20px;
    left: 20px;
    color: #444;
    font-size: 11px;
    letter-spacing: 1px;
    font-family: 'Courier New', monospace;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="ui" id="ui">Click to plant • Space to harvest • H to hide</div>
  <div class="stats" id="stats">nodes: 0</div>
  <canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const stats = document.getElementById('stats');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const nodes = [];
const connections = [];
const spores = [];
const MAX_NODES = 300;
const CONNECTION_DIST = 180;
const GROWTH_RATE = 0.4;
const DECAY_RATE = 0.0003;

const palettes = [
  { node: '#7fff00', glow: 'rgba(127,255,0,0.3)', spore: '#aaffaa' },
  { node: '#ff6b9d', glow: 'rgba(255,107,157,0.3)', spore: '#ffaacc' },
  { node: '#00d4ff', glow: 'rgba(0,212,255,0.3)', spore: '#88eeff' },
  { node: '#ffaa00', glow: 'rgba(255,170,0,0.3)', spore: '#ffcc66' },
  { node: '#bf7fff', glow: 'rgba(191,127,255,0.3)', spore: '#ddaaff' },
];

let palette = palettes[0];
let uiTimeout;
let uiVisible = true;

function showUI() {
  ui.classList.remove('fade');
  uiVisible = true;
  clearTimeout(uiTimeout);
  uiTimeout = setTimeout(() => {
    ui.classList.add('fade');
    uiVisible = false;
  }, 3000);
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

class Node {
  constructor(x, y, palette) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = (Math.random() - 0.5) * 0.3;
    this.size = Math.random() * 3 + 2;
    this.life = 1;
    this.palette = palette || palettes[Math.floor(Math.random() * palettes.length)];
    this.children = [];
    this.growing = true;
    this.growTimer = Math.random() * 200;
    this.pulse = Math.random() * Math.PI * 2;
    this.depth = 0;
  }

  update() {
    this.pulse += 0.02;
    this.life -= DECAY_RATE;

    if (this.growing && this.growTimer > 0) {
      this.growTimer--;
      if (this.growTimer === 0 && nodes.length < MAX_NODES && this.depth < 5) {
        this.spawnChild();
      }
    }

    this.x += this.vx;
    this.y += this.vy;

    // Gentle drift
    this.vx += (Math.random() - 0.5) * 0.01;
    this.vy += (Math.random() - 0.5) * 0.01;
    this.vx *= 0.99;
    this.vy *= 0.99;

    // Boundaries
    if (this.x < 0 || this.x > W) this.vx *= -1;
    if (this.y < 0 || this.y > H) this.vy *= -1;
    this.x = Math.max(0, Math.min(W, this.x));
    this.y = Math.max(0, Math.min(H, this.y));
  }

  spawnChild() {
    const angle = Math.random() * Math.PI * 2;
    const distance = Math.random() * 60 + 40;
    const nx = this.x + Math.cos(angle) * distance;
    const ny = this.y + Math.sin(angle) * distance;

    if (nx > 0 && nx < W && ny > 0 && ny < H) {
      const child = new Node(nx, ny, this.palette);
      child.depth = this.depth + 1;
      child.size = this.size * 0.85;
      child.growTimer = Math.random() * 150 + 50;
      nodes.push(child);
      this.children.push(child);
      connections.push({ from: this, to: child, life: 1 });

      // Emit spores
      for (let i = 0; i < 3; i++) {
        spores.push(new Spore(nx, ny, this.palette));
      }
    }
  }

  draw() {
    if (this.life <= 0) return;

    const pulseSize = this.size * (1 + Math.sin(this.pulse) * 0.2);
    const alpha = Math.min(1, this.life);

    // Glow
    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, pulseSize * 4);
    gradient.addColorStop(0, this.palette.glow);
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(this.x, this.y, pulseSize * 4, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = this.palette.node;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(this.x, this.y, pulseSize, 0, Math.PI * 2);
    ctx.fill();

    // Bright center
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = alpha * 0.6;
    ctx.beginPath();
    ctx.arc(this.x, this.y, pulseSize * 0.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;
  }
}

class Spore {
  constructor(x, y, palette) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 1;
    this.vy = (Math.random() - 0.5) * 1;
    this.life = 1;
    this.palette = palette;
    this.size = Math.random() * 1.5 + 0.5;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx += (Math.random() - 0.5) * 0.05;
    this.vy += (Math.random() - 0.5) * 0.05;
    this.life -= 0.008;
  }

  draw() {
    if (this.life <= 0) return;
    ctx.fillStyle = this.palette.spore;
    ctx.globalAlpha = this.life * 0.6;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// Mouse
let mouse = { x: W / 2, y: H / 2 };
canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

canvas.addEventListener('click', (e) => {
  palette = palettes[Math.floor(Math.random() * palettes.length)];
  const node = new Node(e.clientX, e.clientY, palette);
  nodes.push(node);

  // Spore burst
  for (let i = 0; i < 15; i++) {
    spores.push(new Spore(e.clientX, e.clientY, palette));
  }

  showUI();
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    harvest();
    showUI();
  } else if (e.code === 'KeyH') {
    ui.classList.toggle('fade');
  }
});

function harvest() {
  nodes.length = 0;
  connections.length = 0;
  spores.length = 0;
}

function drawConnections() {
  for (let i = connections.length - 1; i >= 0; i--) {
    const conn = connections[i];
    conn.life -= 0.0002;
    if (conn.life <= 0) {
      connections.splice(i, 1);
      continue;
    }

    const alpha = conn.life * 0.3;
    ctx.strokeStyle = conn.from.palette.node;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(conn.from.x, conn.from.y);

    // Slight curve
    const mx = (conn.from.x + conn.to.x) / 2 + (Math.sin(Date.now() * 0.001 + i) * 5);
    const my = (conn.from.y + conn.to.y) / 2 + (Math.cos(Date.now() * 0.001 + i) * 5);
    ctx.quadraticCurveTo(mx, my, conn.to.x, conn.to.y);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function animate() {
  // Fade trail
  ctx.fillStyle = 'rgba(10,10,15,0.08)';
  ctx.fillRect(0, 0, W, H);

  // Update and draw spores
  for (let i = spores.length - 1; i >= 0; i--) {
    spores[i].update();
    spores[i].draw();
    if (spores[i].life <= 0) spores.splice(i, 1);
  }

  // Draw connections
  drawConnections();

  // Update and draw nodes
  for (let i = nodes.length - 1; i >= 0; i--) {
    nodes[i].update();
    nodes[i].draw();
    if (nodes[i].life <= 0) nodes.splice(i, 1);
  }

  // Mouse attraction
  for (const node of nodes) {
    const d = dist(node, mouse);
    if (d < 200 && d > 0) {
      const force = (200 - d) / 200 * 0.02;
      node.vx += (mouse.x - node.x) / d * force;
      node.vy += (mouse.y - node.y) / d * force;
    }
  }

  // Update stats
  stats.textContent = `nodes: ${nodes.length} • spores: ${spores.length} • connections: ${connections.length}`;

  requestAnimationFrame(animate);
}

// Start
showUI();
animate();
</script>
</body>
</html>
