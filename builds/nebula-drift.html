<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula Drift — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    overflow: hidden;
    font-family: 'Georgia', serif;
    cursor: crosshair;
  }
  canvas { display: block; }
  #info {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 3s;
  }
  #title {
    position: fixed;
    top: 32px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.15);
    font-size: 11px;
    letter-spacing: 6px;
    text-transform: uppercase;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="title">✦ Nebula Drift ✦</div>
<canvas id="c"></canvas>
<div id="info">move your cursor to disturb the field</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, particles = [], mouse = { x: -9999, y: -9999 }, frame = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('touchmove', e => {
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
});

// Color palettes — nebula themes
const palettes = [
  ['#ff6b9d', '#c44569', '#f8b500', '#ff8a5c', '#ffffff'],
  ['#00d2ff', '#3a7bd5', '#7f00ff', '#e100ff', '#ffffff'],
  ['#0cebeb', '#20e3b2', '#29ffc6', '#ffffff', '#f0f0f0'],
  ['#ff9a9e', '#fad0c4', '#ffecd2', '#fcb69f', '#ffffff'],
  ['#a18cd1', '#fbc2eb', '#fdcbf1', '#e6dee9', '#ffffff'],
  ['#ff0844', '#ffb199', '#ff6a00', '#ffea00', '#ffffff'],
];
let palette = palettes[Math.floor(Math.random() * palettes.length)];

class Particle {
  constructor() { this.reset(true); }
  reset(initial = false) {
    this.x = initial ? Math.random() * W : Math.random() * W;
    this.y = initial ? Math.random() * H : Math.random() * H;
    this.baseX = this.x;
    this.baseY = this.y;
    this.size = Math.random() * 2.5 + 0.5;
    this.speedX = (Math.random() - 0.5) * 0.3;
    this.speedY = (Math.random() - 0.5) * 0.3;
    this.color = palette[Math.floor(Math.random() * palette.length)];
    this.alpha = Math.random() * 0.7 + 0.1;
    this.pulse = Math.random() * Math.PI * 2;
    this.pulseSpeed = Math.random() * 0.02 + 0.005;
    this.orbitRadius = Math.random() * 30 + 10;
    this.orbitSpeed = (Math.random() - 0.5) * 0.01;
    this.orbitAngle = Math.random() * Math.PI * 2;
  }
  update() {
    this.pulse += this.pulseSpeed;
    this.orbitAngle += this.orbitSpeed;
    
    // Gentle orbital drift
    this.baseX += this.speedX;
    this.baseY += this.speedY;
    
    // Wrap
    if (this.baseX < -50) this.baseX = W + 50;
    if (this.baseX > W + 50) this.baseX = -50;
    if (this.baseY < -50) this.baseY = H + 50;
    if (this.baseY > H + 50) this.baseY = -50;
    
    // Mouse repulsion
    const dx = this.x - mouse.x;
    const dy = this.y - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const repelRadius = 180;
    
    let offsetX = 0, offsetY = 0;
    if (dist < repelRadius) {
      const force = (1 - dist / repelRadius) * 60;
      offsetX = (dx / dist) * force;
      offsetY = (dy / dist) * force;
    }
    
    // Orbital offset
    const ox = Math.cos(this.orbitAngle) * this.orbitRadius * 0.3;
    const oy = Math.sin(this.orbitAngle) * this.orbitRadius * 0.3;
    
    this.x = this.baseX + offsetX + ox;
    this.y = this.baseY + offsetY + oy;
  }
  draw() {
    const glow = Math.sin(this.pulse) * 0.3 + 0.7;
    const a = this.alpha * glow;
    
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = a;
    ctx.fill();
    
    // Soft glow
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = a * 0.15;
    ctx.fill();
    
    ctx.globalAlpha = 1;
  }
}

// Create particles
const count = Math.min(Math.floor((W * H) / 4000), 400);
for (let i = 0; i < count; i++) {
  particles.push(new Particle());
}

// Connections
function drawConnections() {
  const maxDist = 100;
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < maxDist) {
        const a = (1 - dist / maxDist) * 0.12;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(255,255,255,${a})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

// Background trails — creates the nebula effect
function drawBackground() {
  ctx.fillStyle = 'rgba(10, 10, 18, 0.08)';
  ctx.fillRect(0, 0, W, H);
}

// Fade info after a few seconds
setTimeout(() => {
  document.getElementById('info').style.opacity = '0';
}, 5000);

// Occasionally shift palette
setInterval(() => {
  palette = palettes[Math.floor(Math.random() * palettes.length)];
}, 15000);

function animate() {
  drawBackground();
  drawConnections();
  particles.forEach(p => { p.update(); p.draw(); });
  frame++;
  requestAnimationFrame(animate);
}

// Initial full clear
ctx.fillStyle = '#0a0a12';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
