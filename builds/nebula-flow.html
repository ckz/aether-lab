<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula Flow — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05060f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #a8b8ff;
  }
  canvas { display: block; }
  .ui {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    pointer-events: none;
  }
  .ui h1 {
    font-size: 14px;
    font-weight: normal;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 6px;
  }
  .ui p {
    font-size: 11px;
    opacity: 0.45;
    letter-spacing: 1px;
  }
  .stats {
    position: fixed;
    bottom: 20px;
    right: 20px;
    font-size: 10px;
    opacity: 0.35;
    letter-spacing: 2px;
    text-align: right;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="ui">
  <h1>Nebula Flow</h1>
  <p>move mouse to influence the field</p>
</div>
<div class="stats" id="stats"></div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, particles, mouse = { x: -9999, y: -9999, active: false };
const PARTICLE_COUNT = 1800;
const NOISE_SCALE = 0.004;
const SPEED = 1.2;
const FADE = 0.012;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
window.addEventListener('mouseleave', () => { mouse.active = false; });
window.addEventListener('touchmove', e => {
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
});
window.addEventListener('touchend', () => { mouse.active = false; });

// Simplex-like noise (hash-based)
function hash(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return (h ^ (h >> 16)) / 4294967296 + 0.5;
}
function smoothstep(t) { return t * t * (3 - 2 * t); }
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const v00 = hash(xi, yi);
  const v10 = hash(xi+1, yi);
  const v01 = hash(xi, yi+1);
  const v11 = hash(xi+1, yi+1);
  const u = smoothstep(xf), v = smoothstep(yf);
  return (v00*(1-u) + v10*u)*(1-v) + (v01*(1-u) + v11*u)*v;
}
function fbm(x, y, octaves=4) {
  let val = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < octaves; i++) {
    val += amp * noise(x*freq, y*freq);
    amp *= 0.5;
    freq *= 2.1;
  }
  return val;
}

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.life = Math.random() * 200 + 100;
    this.maxLife = this.life;
    this.hue = 200 + Math.random() * 80; // blue-purple range
  }
  update() {
    const angle = fbm(this.x * NOISE_SCALE, this.y * NOISE_SCALE, 3) * Math.PI * 4;
    let vx = Math.cos(angle) * SPEED;
    let vy = Math.sin(angle) * SPEED;
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.hypot(dx, dy) + 1;
      const force = Math.min(300 / dist, 2.5);
      vx += (dx / dist) * force;
      vy += (dy / dist) * force;
    }
    this.x += vx;
    this.y += vy;
    this.life--;
    if (this.life <= 0 || this.x < -10 || this.x > W+10 || this.y < -10 || this.y > H+10) {
      this.reset();
    }
  }
  draw() {
    const alpha = (this.life / this.maxLife) * 0.7;
    const speed = Math.hypot(
      Math.cos(fbm(this.x * NOISE_SCALE, this.y * NOISE_SCALE, 3) * Math.PI * 4),
      Math.sin(fbm(this.x * NOISE_SCALE, this.y * NOISE_SCALE, 3) * Math.PI * 4)
    );
    const hue = this.hue + speed * 20;
    ctx.fillStyle = `hsla(${hue}, 85%, 65%, ${alpha})`;
    const size = 0.8 + speed * 1.2;
    ctx.fillRect(this.x - size/2, this.y - size/2, size, size);
  }
}

particles = Array.from({ length: PARTICLE_COUNT }, () => new Particle());

let frame = 0;
function loop() {
  ctx.fillStyle = `rgba(5, 6, 15, ${FADE})`;
  ctx.fillRect(0, 0, W, H);
  particles.forEach(p => { p.update(); p.draw(); });
  frame++;
  if (frame % 30 === 0) {
    document.getElementById('stats').textContent =
      `particles ${PARTICLE_COUNT} · field active`;
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
