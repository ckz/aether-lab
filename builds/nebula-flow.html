<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula Flow — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; }
  #info {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
  #stats {
    position: fixed;
    top: 20px;
    right: 20px;
    color: rgba(255,255,255,0.3);
    font-size: 11px;
    text-align: right;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="info">move mouse to influence the flow</div>
<div id="stats"></div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const stats = document.getElementById('stats');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let mouse = { x: W / 2, y: H / 2, active: false };
window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
window.addEventListener('mouseleave', () => mouse.active = false);

// Simplex-like noise using sin
function noise(x, y, t) {
  return Math.sin(x * 0.01 + t) * Math.cos(y * 0.012 - t * 0.7) +
         Math.sin((x + y) * 0.008 + t * 0.5) * 0.5 +
         Math.cos(x * 0.02 - y * 0.01 + t * 0.3) * 0.3;
}

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = 0;
    this.vy = 0;
    this.life = Math.random() * 200 + 100;
    this.age = 0;
    this.hue = Math.random() * 60 + 200; // blue-purple range
    this.size = Math.random() * 1.5 + 0.5;
  }
  update(t) {
    const angle = noise(this.x, this.y, t) * Math.PI * 2;
    this.vx += Math.cos(angle) * 0.3;
    this.vy += Math.sin(angle) * 0.3;

    // Mouse influence
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 200) {
        const force = (200 - dist) / 200;
        this.vx += dx / dist * force * 0.8;
        this.vy += dy / dist * force * 0.8;
      }
    }

    this.vx *= 0.96;
    this.vy *= 0.96;
    this.x += this.vx;
    this.y += this.vy;
    this.age++;

    // Wrap
    if (this.x < 0) this.x = W;
    if (this.x > W) this.x = 0;
    if (this.y < 0) this.y = H;
    if (this.y > H) this.y = 0;

    if (this.age > this.life) this.reset();
  }
  draw(ctx) {
    const alpha = Math.sin((this.age / this.life) * Math.PI) * 0.6;
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    const hue = this.hue + speed * 20;
    ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

const particles = [];
const NUM_PARTICLES = 2000;
for (let i = 0; i < NUM_PARTICLES; i++) {
  particles.push(new Particle());
}

let time = 0;
let lastFrame = performance.now();
let fps = 0;

function animate(now) {
  const dt = (now - lastFrame) / 1000;
  lastFrame = now;
  fps = fps * 0.95 + (1 / Math.max(dt, 0.001)) * 0.05;

  // Fade trail
  ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
  ctx.fillRect(0, 0, W, H);

  time += 0.005;

  for (const p of particles) {
    p.update(time);
    p.draw(ctx);
  }

  // Draw nebula glow at mouse position
  if (mouse.active) {
    const grd = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 150);
    grd.addColorStop(0, 'rgba(100, 140, 255, 0.02)');
    grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grd;
    ctx.fillRect(mouse.x - 150, mouse.y - 150, 300, 300);
  }

  stats.textContent = `particles ${NUM_PARTICLES} · ${Math.round(fps)} fps`;
  requestAnimationFrame(animate);
}

// Initial clear
ctx.fillStyle = '#000';
ctx.fillRect(0, 0, W, H);

requestAnimationFrame(animate);
</script>
</body>
</html>
