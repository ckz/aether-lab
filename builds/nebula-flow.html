<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula Flow — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; }
  #info {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.5);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
  #title {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.7);
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
    text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
  }
</style>
</head>
<body>
<div id="title">✦ Nebula Flow ✦</div>
<div id="info">move your mouse to shape the flow</div>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height;
let particles = [];
let mouse = { x: 0, y: 0, active: false };
let time = 0;

const CONFIG = {
  particleCount: 2000,
  baseSpeed: 1.2,
  trailAlpha: 0.03,
  colorSpeed: 0.0003,
  noiseScale: 0.003,
  mouseRadius: 200,
  mouseForce: 0.8
};

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => {
  mouse.active = false;
});
canvas.addEventListener('touchmove', e => {
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
});
canvas.addEventListener('touchend', () => {
  mouse.active = false;
});

// Simplex-like noise approximation
function noise(x, y, z) {
  const p = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453;
  return (p - Math.floor(p)) * 2 - 1;
}

function flowField(x, y, t) {
  const angle = noise(x * CONFIG.noiseScale, y * CONFIG.noiseScale, t * 0.5) * Math.PI * 4;
  return angle;
}

class Particle {
  constructor() {
    this.reset();
  }

  reset() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.vx = 0;
    this.vy = 0;
    this.life = Math.random() * 300 + 100;
    this.maxLife = this.life;
    this.hueOffset = Math.random() * 60 - 30;
  }

  update(t) {
    const angle = flowField(this.x, this.y, t);
    this.vx += Math.cos(angle) * 0.1;
    this.vy += Math.sin(angle) * 0.1;

    // Mouse influence
    if (mouse.active) {
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < CONFIG.mouseRadius) {
        const force = (1 - dist / CONFIG.mouseRadius) * CONFIG.mouseForce;
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }
    }

    // Speed limit
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    const maxSpeed = CONFIG.baseSpeed * 3;
    if (speed > maxSpeed) {
      this.vx = (this.vx / speed) * maxSpeed;
      this.vy = (this.vy / speed) * maxSpeed;
    }

    this.x += this.vx;
    this.y += this.vy;
    this.life--;

    // Wrap around
    if (this.x < 0) this.x = width;
    if (this.x > width) this.x = 0;
    if (this.y < 0) this.y = height;
    if (this.y > height) this.y = 0;

    if (this.life <= 0) this.reset();
  }

  draw(t) {
    const lifeRatio = this.life / this.maxLife;
    const alpha = Math.sin(lifeRatio * Math.PI) * 0.6;
    const hue = (180 + this.hueOffset + t * 50) % 360;
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    const saturation = 70 + speed * 20;
    const lightness = 50 + speed * 15;

    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x - this.vx * 2, this.y - this.vy * 2);
    ctx.strokeStyle = `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`;
    ctx.lineWidth = 1 + speed * 0.5;
    ctx.stroke();
  }
}

// Initialize particles
for (let i = 0; i < CONFIG.particleCount; i++) {
  particles.push(new Particle());
}

// Initial black fill
ctx.fillStyle = '#000';
ctx.fillRect(0, 0, width, height);

function animate() {
  // Fade effect for trails
  ctx.fillStyle = `rgba(0, 0, 0, ${CONFIG.trailAlpha})`;
  ctx.fillRect(0, 0, width, height);

  time += CONFIG.colorSpeed;

  // Update and draw particles
  for (let particle of particles) {
    particle.update(time);
    particle.draw(time);
  }

  requestAnimationFrame(animate);
}

animate();

// Click to reset with new random seed
canvas.addEventListener('click', () => {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, width, height);
  particles.forEach(p => p.reset());
});
</script>
</body>
</html>
