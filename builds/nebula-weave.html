<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nebula Weave — Generative Art</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at center, #1a0a2e 0%, #050314 60%, #000 100%);
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    overflow: hidden;
  }
  .ui {
    position: fixed;
    inset: auto 0 0 0;
    padding: 14px 18px;
    display: flex;
    gap: 14px;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0));
    pointer-events: none;
  }
  .ui > * { pointer-events: auto; }
  .title {
    text-align: left;
    line-height: 1.2;
  }
  .title h1 {
    font-size: 14px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin: 0 0 2px 0;
    background: linear-gradient(90deg, #c4b5fd, #93c5fd, #fca5a5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .title p {
    margin: 0;
    font-size: 11px;
    opacity: 0.75;
  }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .controls label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    opacity: 0.9;
  }
  .controls input[type=range] {
    accent-color: #a78bfa;
    width: 110px;
  }
  button {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 12px;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  button:hover { background: rgba(255,255,255,0.16); }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="ui">
  <div class="title">
    <h1>Nebula Weave</h1>
    <p>generative particles + flow field</p>
  </div>
  <div class="controls">
    <label>Flow <input id="flow" type="range" min="0" max="100" value="55" /></label>
    <label>Trail <input id="trail" type="range" min="0" max="96" value="88" /></label>
    <button id="burst">Burst</button>
    <button id="save">Save</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize() {
    DPR = Math.max(1, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const palettes = [
    ['#c084fc','#6366f1','#22d3ee','#f472b6'],
    ['#fca5a5','#fdba74','#fde68a','#86efac'],
    ['#93c5fd','#a5b4fc','#c4b5fd','#f0abfc'],
    ['#67e8f9','#a3e635','#facc15','#fb7185'],
  ];
  let palette = palettes[Math.floor(Math.random() * palettes.length)];

  const simplex = (() => {
    // tiny value noise with smooth interpolation
    const perm = new Uint8Array(512);
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [p[i], p[j]] = [p[j], p[i]];
    }
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255];

    const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + t * (b - a);
    const grad = (h, x, y, z) => {
      const g = h & 15;
      const u = g < 8 ? x : y;
      const v = g < 4 ? y : (g === 12 || g === 14 ? x : z);
      return ((g & 1) ? -u : u) + ((g & 2) ? -v : v);
    };
    return (x, y, z = 0) => {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
      const B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;
      return lerp(
        lerp(lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u),
             lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),
        lerp(lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u),
             lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v),
        w);
    };
  })();

  const flow = () => {
    const scale = 0.0018;
    const t = performance.now() * 0.00008;
    return (x, y) => simplex(x * scale, y * scale, t) * Math.PI * 2;
  };

  class Particle {
    constructor(x, y) {
      this.x = x ?? Math.random() * W;
      this.y = y ?? Math.random() * H;
      this.prevX = this.x;
      this.prevY = this.y;
      this.speed = 0.6 + Math.random() * 2.2;
      this.life = 0;
      this.maxLife = 220 + Math.random() * 320;
      this.color = palette[Math.floor(Math.random() * palette.length)];
    }
    step(flowStrength) {
      this.prevX = this.x;
      this.prevY = this.y;
      const a = flow()(this.x, this.y) + (Math.random() - 0.5) * 0.4;
      const mag = (flowStrength / 100) * this.speed;
      this.x += Math.cos(a) * mag;
      this.y += Math.sin(a) * mag;
      this.life++;
      if (this.life > this.maxLife || this.x < -20 || this.x > W + 20 || this.y < -20 || this.y > H + 20) {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.prevX = this.x;
        this.prevY = this.y;
        this.life = 0;
        this.maxLife = 220 + Math.random() * 320;
        this.color = palette[Math.floor(Math.random() * palette.length)];
      }
    }
    draw(ctx) {
      ctx.strokeStyle = this.color;
      ctx.lineWidth = Math.max(0.4, (1 - this.life / this.maxLife) * 1.4);
      ctx.beginPath();
      ctx.moveTo(this.prevX, this.prevY);
      ctx.lineTo(this.x, this.y);
      ctx.stroke();
    }
  }

  const count = Math.min(1400, Math.floor((W * H) / 1200));
  let particles = Array.from({ length: count }, () => new Particle());

  document.getElementById('flow').addEventListener('input', e => {
    // dynamic rerandomize palette for fun
  });
  document.getElementById('trail').addEventListener('input', () => {});
  document.getElementById('burst').addEventListener('click', () => {
    const cx = W / 2 + (Math.random() - 0.5) * 240;
    const cy = H / 2 + (Math.random() - 0.5) * 240;
    for (let i = 0; i < 60; i++) particles.push(new Particle(cx, cy));
  });
  document.getElementById('save').addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = 'nebula-weave.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });

  let flowVal = 55, trailVal = 88;
  function frame() {
    flowVal = +document.getElementById('flow').value;
    trailVal = +document.getElementById('trail').value;
    const alpha = 0.02 + (1 - trailVal / 100) * 0.12;
    ctx.fillStyle = `rgba(5,3,20,${alpha})`;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      p.step(flowVal);
      p.draw(ctx);
    }
    ctx.globalCompositeOperation = 'source-over';

    // drift palette slowly
    if (Math.random() < 0.0015) {
      palette = palettes[Math.floor(Math.random() * palettes.length)];
      for (const p of particles) p.color = palette[Math.floor(Math.random() * palette.length)];
    }
    requestAnimationFrame(frame);
  }
  // clear once to avoid stale white
  ctx.fillStyle = '#050314';
  ctx.fillRect(0, 0, W, H);
  frame();
})();
</script>
</body>
</html>
