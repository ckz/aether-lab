<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula Weave — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #030308;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #aaa;
  }
  canvas { display: block; }
  .ui {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 10, 25, 0.75);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 10px 18px;
    display: flex;
    gap: 14px;
    align-items: center;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    z-index: 10;
  }
  .ui button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #ccc;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .ui button:hover {
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,255,255,0.3);
    color: #fff;
  }
  .ui .stat { color: #667; }
</style>
</head>
<body>
<div class="ui">
  <span class="stat" id="info">NEBULA WEAVE</span>
  <button onclick="regenerate()">Regenerate</button>
  <button onclick="togglePause()">Pause</button>
  <button onclick="saveFrame()">Save Frame</button>
</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;
let time = 0;
let paused = false;
let mouse = { x: -1000, y: -1000 };
let filaments = [];
let stars = [];

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', () => { resize(); init(); });
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('touchmove', e => {
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
}, { passive: true });

function rand(min, max) { return Math.random() * (max - min) + min; }
function lerp(a, b, t) { return a + (b - a) * t; }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

// Simplex-like noise approximation
function noise(x, y, t) {
  return Math.sin(x * 0.8 + t * 0.3) * Math.cos(y * 0.7 - t * 0.2) +
         Math.sin((x + y) * 0.5 + t * 0.4) * 0.5 +
         Math.cos(x * 1.3 - y * 0.9 + t * 0.25) * 0.3;
}

class Filament {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = rand(0, W);
    this.y = rand(0, H);
    this.vx = rand(-0.3, 0.3);
    this.vy = rand(-0.3, 0.3);
    this.life = rand(200, 600);
    this.maxLife = this.life;
    this.hue = rand(180, 320); // cyan through purple to pink
    this.width = rand(0.4, 1.4);
    this.trail = [];
    this.maxTrail = Math.floor(rand(30, 100));
    this.noiseScale = rand(0.002, 0.006);
    this.speed = rand(0.4, 1.2);
  }
  update() {
    const angle = noise(this.x * this.noiseScale, this.y * this.noiseScale, time * 0.15) * Math.PI * 2;
    this.vx += Math.cos(angle) * 0.08 * this.speed;
    this.vy += Math.sin(angle) * 0.08 * this.speed;

    // Mouse attraction
    const d = dist(this.x, this.y, mouse.x, mouse.y);
    if (d < 200 && d > 0) {
      const force = (200 - d) / 200 * 0.4;
      this.vx += (mouse.x - this.x) / d * force;
      this.vy += (mouse.y - this.y) / d * force;
    }

    this.vx *= 0.96;
    this.vy *= 0.96;
    this.x += this.vx;
    this.y += this.vy;
    this.life--;

    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.maxTrail) this.trail.shift();

    if (this.life <= 0 || this.x < -50 || this.x > W + 50 || this.y < -50 || this.y > H + 50) {
      this.reset();
    }
  }
  draw() {
    if (this.trail.length < 2) return;
    const alpha = Math.min(1, this.life / this.maxLife) * 0.6;
    ctx.beginPath();
    ctx.moveTo(this.trail[0].x, this.trail[0].y);
    for (let i = 1; i < this.trail.length; i++) {
      ctx.lineTo(this.trail[i].x, this.trail[i].y);
    }
    ctx.strokeStyle = `hsla(${this.hue}, 80%, 65%, ${alpha})`;
    ctx.lineWidth = this.width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();

    // Glow head
    if (this.trail.length > 0) {
      const head = this.trail[this.trail.length - 1];
      const grad = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 4);
      grad.addColorStop(0, `hsla(${this.hue}, 90%, 80%, ${alpha * 0.9})`);
      grad.addColorStop(1, `hsla(${this.hue}, 90%, 80%, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(head.x, head.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

class Star {
  constructor() {
    this.x = rand(0, W);
    this.y = rand(0, H);
    this.size = rand(0.3, 1.2);
    this.twinkle = rand(0, Math.PI * 2);
    this.twinkleSpeed = rand(0.02, 0.06);
    this.brightness = rand(0.2, 0.7);
  }
  update() {
    this.twinkle += this.twinkleSpeed;
  }
  draw() {
    const alpha = this.brightness * (0.5 + 0.5 * Math.sin(this.twinkle));
    ctx.fillStyle = `rgba(220, 230, 255, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function init() {
  resize();
  filaments = [];
  stars = [];
  const count = Math.floor((W * H) / 4000);
  for (let i = 0; i < Math.min(count, 400); i++) filaments.push(new Filament());
  for (let i = 0; i < Math.min(count * 0.5, 150); i++) stars.push(new Star());
}

function regenerate() {
  init();
}

function togglePause() {
  paused = !paused;
  document.querySelector('.ui .stat').textContent = paused ? 'PAUSED' : 'NEBULA WEAVE';
}

function saveFrame() {
  const link = document.createElement('a');
  link.download = `nebula-weave-${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// Soft nebula clouds
function drawNebulaClouds() {
  const t = time * 0.08;
  for (let i = 0; i < 3; i++) {
    const cx = W * (0.3 + 0.4 * Math.sin(t + i * 2.1));
    const cy = H * (0.3 + 0.4 * Math.cos(t * 0.7 + i * 1.7));
    const r = Math.min(W, H) * 0.35;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    const hue = (200 + i * 60 + time * 2) % 360;
    grad.addColorStop(0, `hsla(${hue}, 70%, 30%, 0.03)`);
    grad.addColorStop(0.5, `hsla(${hue + 30}, 60%, 20%, 0.02)`);
    grad.addColorStop(1, `hsla(${hue}, 50%, 10%, 0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
}

function animate() {
  if (!paused) {
    // Fade trail effect
    ctx.fillStyle = 'rgba(3, 3, 8, 0.12)';
    ctx.fillRect(0, 0, W, H);

    drawNebulaClouds();

    stars.forEach(s => { s.update(); s.draw(); });
    filaments.forEach(f => { f.update(); f.draw(); });

    time++;
  }
  requestAnimationFrame(animate);
}

init();
animate();
</script>
</body>
</html>
