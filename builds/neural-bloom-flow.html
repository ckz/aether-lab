<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Bloom — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #fff;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
  }
  .overlay {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    background: rgba(10, 10, 15, 0.7);
    backdrop-filter: blur(10px);
    padding: 20px 25px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    max-width: 320px;
  }
  .overlay h1 {
    font-size: 18px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #ff6b9d, #c084fc, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .overlay p {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .controls button {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
    transition: all 0.2s;
  }
  .controls button:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.3);
  }
  .stats {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 10;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.3);
    text-align: right;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="overlay">
  <h1>✦ Neural Bloom</h1>
  <p>Generative particle flow field. Move your mouse to guide the bloom. Click to pulse.</p>
  <div class="controls">
    <button onclick="resetField()">Reset</button>
    <button onclick="toggleMode()">Mode</button>
    <button onclick="saveFrame()">Save</button>
    <button onclick="toggleTrails()">Trails</button>
  </div>
</div>
<div class="stats" id="stats"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
let particles = [];
let mouse = { x: -1000, y: -1000, active: false };
let mode = 0;
let trails = true;
let time = 0;
let frameCount = 0;
const modes = ['Flow', 'Bloom', 'Swirl', 'Nebula'];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => { mouse.active = false; });
canvas.addEventListener('click', () => {
  for (let p of particles) {
    p.life = 1;
    p.vx += (Math.random() - 0.5) * 8;
    p.vy += (Math.random() - 0.5) * 8;
  }
});

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = 0;
    this.vy = 0;
    this.life = Math.random();
    this.maxLife = 0.5 + Math.random() * 0.5;
    this.hue = Math.random() * 360;
    this.size = 1 + Math.random() * 2.5;
    this.speed = 0.5 + Math.random() * 1.5;
  }
  update() {
    const scale = 0.003;
    let angle;
    
    switch(mode) {
      case 0: // Flow field
        angle = this.flowAngle(this.x * scale, this.y * scale, time * 0.0005);
        break;
      case 1: // Bloom - radial from center with noise
        const cx = W / 2, cy = H / 2;
        const dx = this.x - cx, dy = this.y - cy;
        const dist = Math.sqrt(dx*dx + dy*dy) + 0.001;
        angle = Math.atan2(dy, dx) + Math.sin(dist * 0.01 - time * 0.002) * 2;
        break;
      case 2: // Swirl - vortex
        angle = Math.atan2(this.y - H/2, this.x - W/2) + Math.PI * 0.5 + 
                Math.sin(time * 0.001 + this.x * 0.005) * 1.5;
        break;
      case 3: // Nebula - layered noise
        angle = this.flowAngle(this.x * scale * 0.5, this.y * scale * 0.5, time * 0.0003) + 
                Math.sin(this.x * 0.01 + time * 0.001) * 1.2;
        break;
    }

    // Mouse influence
    if (mouse.active) {
      const mdx = mouse.x - this.x;
      const mdy = mouse.y - this.y;
      const mdist = Math.sqrt(mdx*mdx + mdy*mdy) + 0.001;
      if (mdist < 200) {
        const force = (200 - mdist) / 200;
        angle += Math.atan2(mdy, mdx) * force * 0.8;
      }
    }

    this.vx += Math.cos(angle) * 0.3;
    this.vy += Math.sin(angle) * 0.3;
    this.vx *= 0.95;
    this.vy *= 0.95;
    this.x += this.vx * this.speed;
    this.y += this.vy * this.speed;
    this.life -= 0.002;
    this.hue += 0.2;

    if (this.life <= 0 || this.x < -50 || this.x > W + 50 || this.y < -50 || this.y > H + 50) {
      this.reset();
    }
  }

  flowAngle(x, y, t) {
    return (Math.sin(x + t) * Math.cos(y + t * 0.7) + 
            Math.sin((x + y) * 0.5 + t * 0.5)) * Math.PI * 2;
  }

  draw() {
    const alpha = this.life * 0.6;
    const hue = (this.hue + time * 0.01) % 360;
    ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fill();
  }
}

function init() {
  particles = [];
  const count = Math.min(Math.floor((W * H) / 3000), 1500);
  for (let i = 0; i < count; i++) {
    particles.push(new Particle());
  }
}
init();
window.addEventListener('resize', init);

function resetField() {
  ctx.fillStyle = 'rgba(10, 10, 15, 1)';
  ctx.fillRect(0, 0, W, H);
  init();
}

function toggleMode() {
  mode = (mode + 1) % modes.length;
  ctx.fillStyle = 'rgba(10, 10, 15, 0.3)';
  ctx.fillRect(0, 0, W, H);
}

function toggleTrails() {
  trails = !trails;
}

function saveFrame() {
  const link = document.createElement('a');
  link.download = `neural-bloom-${Date.now()}.png`;
  link.href = canvas.toDataURL();
  link.click();
}

function animate() {
  if (trails) {
    ctx.fillStyle = 'rgba(10, 10, 15, 0.04)';
    ctx.fillRect(0, 0, W, H);
  } else {
    ctx.fillStyle = 'rgba(10, 10, 15, 1)';
    ctx.fillRect(0, 0, W, H);
  }

  for (let p of particles) {
    p.update();
    p.draw();
  }

  time++;
  frameCount++;
  
  if (frameCount % 30 === 0) {
    document.getElementById('stats').textContent = 
      `particles: ${particles.length} | mode: ${modes[mode]} | trails: ${trails}`;
  }

  requestAnimationFrame(animate);
}

// Initial fade-in
ctx.fillStyle = 'rgba(10, 10, 15, 1)';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
