<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Bloom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #8899aa;
    cursor: crosshair;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    top: 20px; left: 20px;
    z-index: 10;
    font-size: 12px;
    line-height: 1.8;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }
  #ui h1 {
    font-size: 18px;
    color: #aabbcc;
    margin-bottom: 6px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  #ui .controls { margin-top: 10px; pointer-events: auto; }
  #ui button {
    background: rgba(30,40,55,0.6);
    border: 1px solid rgba(120,140,160,0.3);
    color: #8899aa;
    padding: 4px 10px;
    margin: 2px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    border-radius: 3px;
    transition: all 0.2s;
  }
  #ui button:hover {
    background: rgba(50,70,100,0.7);
    border-color: rgba(160,200,255,0.5);
    color: #ccddee;
  }
  #palette-indicator {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: rgba(160,180,200,0.6);
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    text-shadow: 0 0 10px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <h1>✦ Neural Bloom</h1>
  <div>Click to plant seeds</div>
  <div>Move mouse to influence growth</div>
  <div class="controls">
    <button onclick="setPalette(0)">Aurora</button>
    <button onclick="setPalette(1)">Ember</button>
    <button onclick="setPalette(2)">Deep</button>
    <button onclick="setPalette(3)">Neon</button>
    <button onclick="clearAll()">Clear</button>
  </div>
</div>
<div id="palette-indicator">Palette: Aurora</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const palettes = [
  { name: 'Aurora',  bg: '#06080f', colors: ['#00ffa3','#00d4ff','#7b61ff','#ff6b9d','#00ff88'], glow: 'rgba(0,255,163,' },
  { name: 'Ember',   bg: '#0f0806', colors: ['#ff6a00','#ffaa00','#ff3300','#ffcc44','#ff8800'], glow: 'rgba(255,106,0,' },
  { name: 'Deep',    bg: '#060a10', colors: ['#1a8fff','#00ccff','#4488ff','#0066cc','#66aaff'], glow: 'rgba(26,143,255,' },
  { name: 'Neon',    bg: '#0a0a0a', colors: ['#ff00ff','#00ffff','#ffff00','#ff0080','#80ff00'], glow: 'rgba(255,0,255,' },
];
let currentPalette = 0;

function setPalette(i) {
  currentPalette = i;
  document.getElementById('palette-indicator').textContent = 'Palette: ' + palettes[i].name;
}

const seeds = [];
const particles = [];
const connections = [];
let mouse = { x: -9999, y: -9999, active: false };
let time = 0;

class Seed {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.branches = [];
    this.maxDepth = 5 + Math.floor(Math.random() * 5);
    this.growSpeed = 0.4 + Math.random() * 0.6;
    this.alive = true;
    this.age = 0;
    this.maxAge = 800 + Math.random() * 400;
    this.colorIndex = Math.floor(Math.random() * 5);
    this.generateBranches();
  }

  generateBranches() {
    const numBranches = 3 + Math.floor(Math.random() * 5);
    for (let i = 0; i < numBranches; i++) {
      const angle = (Math.PI * 2 / numBranches) * i + (Math.random() - 0.5) * 0.5;
      const len = 30 + Math.random() * 60;
      this.branches.push({
        angle,
        length: len,
        currentLength: 0,
        depth: 1,
        children: [],
        thickness: 3 + Math.random() * 2,
        swayOffset: Math.random() * Math.PI * 2,
        swayAmp: 0.01 + Math.random() * 0.02,
        nodes: [],
        growing: true,
      });
    }
  }

  update(dt) {
    this.age += dt;
    if (this.age > this.maxAge) this.alive = false;

    let anyGrowing = false;
    const grow = (b, depth) => {
      if (!b.growing) return;
      b.currentLength += this.growSpeed * (1 - depth * 0.15);
      if (b.currentLength >= b.length) {
        b.growing = false;
        if (depth < this.maxDepth && b.children.length < 3) {
          const numChildren = 1 + Math.floor(Math.random() * 2);
          for (let i = 0; i < numChildren; i++) {
            const childAngle = b.angle + (Math.random() - 0.5) * 1.2;
            const childLen = b.length * (0.5 + Math.random() * 0.25);
            const child = {
              angle: childAngle,
              length: childLen,
              currentLength: 0,
              depth: depth + 1,
              children: [],
              thickness: b.thickness * 0.65,
              swayOffset: Math.random() * Math.PI * 2,
              swayAmp: 0.01 + Math.random() * 0.03,
              nodes: [],
              growing: true,
            };
            b.children.push(child);
          }
        }
      }
      b.nodes = [];
      const segments = Math.floor(b.currentLength / 4);
      for (let s = 0; s <= segments; s++) {
        const t = s / Math.max(segments, 1);
        const sway = Math.sin(time * 0.8 + b.swayOffset + t * 2) * b.swayAmp * t * 40;
        const mx = mouse.active ? (mouse.x - this.x) * 0.02 * t : 0;
        const my = mouse.active ? (mouse.y - this.y) * 0.02 * t : 0;
        const nx = this.x + Math.cos(b.angle + sway + mx) * b.currentLength * t;
        const ny = this.y + Math.sin(b.angle + sway + my) * b.currentLength * t;
        b.nodes.push({ x: nx, y: ny });
      }
      b.children.forEach(c => grow(c, depth + 1));
      if (b.growing) anyGrowing = true;
    };

    this.branches.forEach(b => grow(b, 1));
  }

  draw(ctx) {
    const drawBranch = (b) => {
      if (b.nodes.length < 2) return;
      const alpha = Math.max(0, 1 - this.age / this.maxAge);
      const col = palettes[currentPalette].colors[this.colorIndex % 5];

      ctx.beginPath();
      ctx.moveTo(b.nodes[0].x, b.nodes[0].y);
      for (let i = 1; i < b.nodes.length - 1; i++) {
        const xc = (b.nodes[i].x + b.nodes[i+1].x) / 2;
        const yc = (b.nodes[i].y + b.nodes[i+1].y) / 2;
        ctx.quadraticCurveTo(b.nodes[i].x, b.nodes[i].y, xc, yc);
      }
      if (b.nodes.length >= 2) {
        const last = b.nodes[b.nodes.length - 1];
        ctx.lineTo(last.x, last.y);
      }
      ctx.strokeStyle = col + Math.floor(alpha * 180).toString(16).padStart(2,'0');
      ctx.lineWidth = b.thickness;
      ctx.lineCap = 'round';
      ctx.stroke();

      // glow
      ctx.strokeStyle = palettes[currentPalette].glow + (alpha * 0.25).toFixed(2) + ')';
      ctx.lineWidth = b.thickness * 3;
      ctx.stroke();

      // endpoint node
      if (!b.growing && b.nodes.length > 0) {
        const end = b.nodes[b.nodes.length - 1];
        const pulse = 0.6 + 0.4 * Math.sin(time * 2 + b.swayOffset);
        ctx.beginPath();
        ctx.arc(end.x, end.y, b.thickness * 1.5 * pulse, 0, Math.PI * 2);
        ctx.fillStyle = palettes[currentPalette].glow + (alpha * 0.5 * pulse).toFixed(2) + ')';
        ctx.fill();
      }

      b.children.forEach(drawBranch);
    };
    this.branches.forEach(drawBranch);

    // seed origin glow
    const pulse = 0.7 + 0.3 * Math.sin(time * 3 + this.x);
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 30);
    grad.addColorStop(0, palettes[currentPalette].glow + (0.5 * pulse).toFixed(2) + ')');
    grad.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(this.x, this.y, 30, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = (Math.random() - 0.5) * 1.5 - 0.5;
    this.life = 1;
    this.decay = 0.004 + Math.random() * 0.01;
    this.size = 1 + Math.random() * 2.5;
    this.color = color;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.005;
    this.life -= this.decay;
    this.vx *= 0.99;
    this.vy *= 0.99;
  }
  draw(ctx) {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fillStyle = this.color + Math.floor(this.life * 120).toString(16).padStart(2,'0');
    ctx.fill();
  }
}

canvas.addEventListener('mousedown', (e) => {
  plantSeed(e.clientX, e.clientY);
});
canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
  if (Math.random() < 0.15) {
    const col = palettes[currentPalette].colors[Math.floor(Math.random() * 5)];
    particles.push(new Particle(mouse.x + (Math.random()-0.5)*20, mouse.y + (Math.random()-0.5)*20, col));
  }
});
canvas.addEventListener('mouseup', () => mouse.active = false);
canvas.addEventListener('mouseleave', () => { mouse.active = false; });

// Touch support
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  plantSeed(t.clientX, t.clientY);
});
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX;
  mouse.y = t.clientY;
  mouse.active = true;
});

function plantSeed(x, y) {
  seeds.push(new Seed(x, y));
  // burst particles
  const col = palettes[currentPalette].colors[Math.floor(Math.random() * 5)];
  for (let i = 0; i < 30; i++) {
    particles.push(new Particle(x, y, col));
  }
  // auto-plant a few neighboring seeds sometimes
  if (Math.random() < 0.35) {
    setTimeout(() => {
      plantSeed(x + (Math.random()-0.5)*120, y + (Math.random()-0.5)*120);
    }, 200 + Math.random() * 300);
  }
}

function clearAll() {
  seeds.length = 0;
  particles.length = 0;
}

function updateConnections() {
  // Draw faint connections between nearby living endpoints
  const endpoints = [];
  seeds.forEach(s => {
    const collect = (b) => {
      if (!b.growing && b.nodes.length > 1) {
        endpoints.push({ x: b.nodes[b.nodes.length-1].x, y: b.nodes[b.nodes.length-1].y, seed: s, branch: b });
      }
      b.children.forEach(collect);
    };
    s.branches.forEach(collect);
  });

  connections.length = 0;
  for (let i = 0; i < endpoints.length; i++) {
    for (let j = i+1; j < endpoints.length; j++) {
      const dx = endpoints[i].x - endpoints[j].x;
      const dy = endpoints[i].y - endpoints[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 150 && Math.random() < 0.02) {
        connections.push({ x1: endpoints[i].x, y1: endpoints[i].y, x2: endpoints[j].x, y2: endpoints[j].y, dist, alpha: 0.15 });
      }
    }
  }
}

function drawConnections(ctx) {
  connections.forEach(c => {
    const pulse = 0.5 + 0.5 * Math.sin(time * 1.5 + c.x1 * 0.01);
    ctx.beginPath();
    ctx.moveTo(c.x1, c.y1);
    ctx.lineTo(c.x2, c.y2);
    ctx.strokeStyle = palettes[currentPalette].glow + (c.alpha * pulse).toFixed(3) + ')';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  });
}

// Background stars
const stars = [];
for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * 3000,
    y: Math.random() * 2000,
    size: Math.random() * 1.5,
    twinkle: Math.random() * Math.PI * 2,
    speed: 0.5 + Math.random() * 2,
  });
}

function drawStars(ctx) {
  stars.forEach(s => {
    const a = 0.3 + 0.4 * Math.sin(time * s.speed + s.twinkle);
    ctx.beginPath();
    ctx.arc(s.x % W, s.y % H, s.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180,200,220,${a})`;
    ctx.fill();
  });
}

function animate() {
  time += 0.016;

  // subtle fade for trails
  ctx.fillStyle = palettes[currentPalette].bg + 'f0';
  ctx.fillRect(0, 0, W, H);

  drawStars(ctx);

  // update seeds
  for (let i = seeds.length - 1; i >= 0; i--) {
    seeds[i].update(0.016);
    if (!seeds[i].alive) seeds.splice(i, 1);
  }
  seeds.forEach(s => s.draw(ctx));

  updateConnections();
  drawConnections(ctx);

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  requestAnimationFrame(animate);
}

// Initial seeds
setTimeout(() => {
  plantSeed(W * 0.3, H * 0.5);
  setTimeout(() => plantSeed(W * 0.7, H * 0.4), 400);
  setTimeout(() => plantSeed(W * 0.5, H * 0.65), 800);
}, 100);

animate();
</script>
</body>
</html>
