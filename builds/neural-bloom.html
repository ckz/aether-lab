<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Bloom — Generative Art</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  cursor: crosshair;
}
canvas { display: block; }
#info {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.4);
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  pointer-events: none;
  z-index: 10;
}
#stats {
  position: fixed;
  top: 20px;
  right: 20px;
  color: rgba(255,255,255,0.3);
  font-size: 11px;
  letter-spacing: 1px;
  pointer-events: none;
  z-index: 10;
  text-align: right;
}
#title {
  position: fixed;
  top: 20px;
  left: 20px;
  color: rgba(255,255,255,0.15);
  font-size: 14px;
  letter-spacing: 4px;
  text-transform: uppercase;
  pointer-events: none;
  z-index: 10;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="title">Neural Bloom</div>
<div id="stats"></div>
<div id="info">click to seed · space to pause · c to clear</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const stats = document.getElementById('stats');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let paused = false;
let time = 0;
let particles = [];
let mouse = { x: W/2, y: H/2, active: false };

const CONFIG = {
  maxParticles: 600,
  baseSpeed: 0.3,
  connectionDist: 120,
  hueBase: 200,
  hueRange: 80,
  trailAlpha: 0.04,
  particleSize: 2,
  neuronChance: 0.002
};

class Particle {
  constructor(x, y, isNeuron = false) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.vx = (Math.random() - 0.5) * CONFIG.baseSpeed * 2;
    this.vy = (Math.random() - 0.5) * CONFIG.baseSpeed * 2;
    this.life = 1;
    this.decay = 0.0003 + Math.random() * 0.0005;
    this.hue = CONFIG.hueBase + Math.random() * CONFIG.hueRange;
    this.size = isNeuron ? CONFIG.particleSize * 3 : CONFIG.particleSize * (0.5 + Math.random());
    this.isNeuron = isNeuron;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.pulseSpeed = 0.01 + Math.random() * 0.02;
  }
  
  update() {
    if (!paused) {
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;
      this.pulsePhase += this.pulseSpeed;
      
      // Gentle attraction to mouse when active
      if (mouse.active) {
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 200) {
          const force = 0.0003;
          this.vx += dx * force;
          this.vy += dy * force;
        }
      }
      
      // Speed limit
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      const maxSpeed = 1.5;
      if (speed > maxSpeed) {
        this.vx = (this.vx / speed) * maxSpeed;
        this.vy = (this.vy / speed) * maxSpeed;
      }
      
      // Wrap edges
      if (this.x < 0) this.x = W;
      if (this.x > W) this.x = 0;
      if (this.y < 0) this.y = H;
      if (this.y > H) this.y = 0;
    }
  }
  
  draw() {
    const pulse = this.isNeuron ? 1 + Math.sin(this.pulsePhase) * 0.5 : 1;
    const alpha = this.life * (this.isNeuron ? 0.9 : 0.6);
    const size = this.size * pulse;
    
    // Glow
    const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, size * 4);
    glow.addColorStop(0, `hsla(${this.hue}, 80%, 60%, ${alpha})`);
    glow.addColorStop(0.5, `hsla(${this.hue}, 70%, 50%, ${alpha * 0.3})`);
    glow.addColorStop(1, `hsla(${this.hue}, 60%, 40%, 0)`);
    
    ctx.beginPath();
    ctx.arc(this.x, this.y, size * 4, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();
    
    // Core
    ctx.beginPath();
    ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 90%, 70%, ${alpha})`;
    ctx.fill();
  }
}

// Initialize with some particles
for (let i = 0; i < 150; i++) {
  particles.push(new Particle());
}

// Draw connections
function drawConnections() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < CONFIG.connectionDist) {
        const alpha = (1 - dist / CONFIG.connectionDist) * 0.15;
        const avgHue = (particles[i].hue + particles[j].hue) / 2;
        
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `hsla(${avgHue}, 60%, 50%, ${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

// Spawn burst at position
function spawnBurst(x, y, count = 20) {
  for (let i = 0; i < count; i++) {
    const p = new Particle(x, y, Math.random() < 0.1);
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 2;
    p.vx = Math.cos(angle) * speed;
    p.vy = Math.sin(angle) * speed;
    particles.push(p);
  }
  // Trim if over limit
  while (particles.length > CONFIG.maxParticles) {
    particles.shift();
  }
}

// Event handlers
canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => {
  mouse.active = false;
});

canvas.addEventListener('click', (e) => {
  spawnBurst(e.clientX, e.clientY, 30);
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  mouse.x = touch.clientX;
  mouse.y = touch.clientY;
  mouse.active = true;
  spawnBurst(touch.clientX, touch.clientY, 30);
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    paused = !paused;
  } else if (e.code === 'KeyC') {
    particles = [];
    ctx.fillStyle = 'rgba(10, 10, 15, 1)';
    ctx.fillRect(0, 0, W, H);
  }
});

// Animation loop
function animate() {
  // Trail effect
  ctx.fillStyle = `rgba(10, 10, 15, ${CONFIG.trailAlpha})`;
  ctx.fillRect(0, 0, W, H);
  
  if (!paused) {
    time++;
    
    // Random neuron spawning
    if (Math.random() < CONFIG.neuronChance && particles.length < CONFIG.maxParticles) {
      particles.push(new Particle(null, null, true));
    }
  }
  
  // Update and draw
  drawConnections();
  
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.update();
    p.draw();
  });
  
  // Stats
  stats.innerHTML = `particles: ${particles.length}<br>time: ${time}`;
  
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
