<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Constellation — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; }
  .overlay {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
  .title {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.15);
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">Neural Constellation</div>
<div class="overlay">move mouse · click to burst · space to reset</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, particles, mouse, bursts;
let hueBase = 0;
let frame = 0;

const CONFIG = {
  particleCount: 140,
  maxSpeed: 0.6,
  connectionDist: 140,
  mouseRadius: 200,
  pulseSpeed: 0.008,
  trailAlpha: 0.06,
  burstCount: 30,
  colorCycleSpeed: 0.15,
};

mouse = { x: -9999, y: -9999, active: false };

class Particle {
  constructor(x, y, burst = false) {
    this.x = x ?? Math.random() * W;
    this.y = y ?? Math.random() * H;
    const angle = Math.random() * Math.PI * 2;
    const speed = burst ? (2 + Math.random() * 4) : (0.2 + Math.random() * CONFIG.maxSpeed);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.radius = burst ? (1.5 + Math.random() * 2.5) : (1 + Math.random() * 2);
    this.life = burst ? 1 : Infinity;
    this.decay = burst ? (0.005 + Math.random() * 0.015) : 0;
    this.hueOffset = Math.random() * 60 - 30;
    this.phase = Math.random() * Math.PI * 2;
    this.pulseAmp = 0.3 + Math.random() * 0.7;
  }

  update() {
    // Gentle wandering
    this.vx += (Math.random() - 0.5) * 0.02;
    this.vy += (Math.random() - 0.5) * 0.02;

    // Speed limit
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed > CONFIG.maxSpeed * (this.life < 1 ? 3 : 1)) {
      this.vx = (this.vx / speed) * CONFIG.maxSpeed;
      this.vy = (this.vy / speed) * CONFIG.maxSpeed;
    }

    this.x += this.vx;
    this.y += this.vy;

    // Wrap
    if (this.x < -20) this.x = W + 20;
    if (this.x > W + 20) this.x = -20;
    if (this.y < -20) this.y = H + 20;
    if (this.y > H + 20) this.y = -20;

    // Mouse attraction/repulsion
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < CONFIG.mouseRadius && dist > 1) {
        const force = (1 - dist / CONFIG.mouseRadius) * 0.03;
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }
    }

    this.life -= this.decay;
    this.phase += CONFIG.pulseSpeed;
  }

  draw() {
    if (this.life <= 0) return;
    const pulse = 1 + Math.sin(this.phase) * this.pulseAmp * 0.3;
    const alpha = this.life < 1 ? this.life : 0.7 + Math.sin(this.phase) * 0.3;
    const hue = (hueBase + this.hueOffset + (this.x / W) * 40) % 360;
    const r = this.radius * pulse;

    // Glow
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r * 4);
    grad.addColorStop(0, `hsla(${hue}, 80%, 65%, ${alpha})`);
    grad.addColorStop(0.5, `hsla(${hue}, 70%, 50%, ${alpha * 0.3})`);
    grad.addColorStop(1, `hsla(${hue}, 60%, 40%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r * 4, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = `hsla(${hue}, 90%, 80%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  get alive() {
    return this.life > 0;
  }
}

class Burst {
  constructor(x, y) {
    this.particles = [];
    for (let i = 0; i < CONFIG.burstCount; i++) {
      this.particles.push(new Particle(x, y, true));
    }
  }
  update() {
    this.particles.forEach(p => p.update());
    this.particles = this.particles.filter(p => p.alive);
  }
  draw() {
    this.particles.forEach(p => p.draw());
  }
  get alive() {
    return this.particles.length > 0;
  }
}

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function init() {
  resize();
  particles = [];
  for (let i = 0; i < CONFIG.particleCount; i++) {
    particles.push(new Particle());
  }
  bursts = [];
}

function drawConnections() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < CONFIG.connectionDist) {
        const alpha = (1 - dist / CONFIG.connectionDist) * 0.25;
        const hue = (hueBase + (particles[i].x / W) * 50) % 360;
        ctx.strokeStyle = `hsla(${hue}, 70%, 55%, ${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }

    // Mouse connections
    if (mouse.active) {
      const dx = particles[i].x - mouse.x;
      const dy = particles[i].y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < CONFIG.mouseRadius) {
        const alpha = (1 - dist / CONFIG.mouseRadius) * 0.4;
        const hue = (hueBase + 60) % 360;
        ctx.strokeStyle = `hsla(${hue}, 90%, 70%, ${alpha})`;
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(mouse.x, mouse.y);
        ctx.stroke();
      }
    }
  }
}

function drawBackground() {
  // Subtle trailing effect
  ctx.fillStyle = `rgba(10, 10, 18, ${CONFIG.trailAlpha})`;
  ctx.fillRect(0, 0, W, H);
}

function animate() {
  frame++;
  hueBase = (hueBase + CONFIG.colorCycleSpeed) % 360;

  drawBackground();

  // Update & draw particles
  particles.forEach(p => p.update());
  drawConnections();
  particles.forEach(p => p.draw());

  // Bursts
  bursts.forEach(b => { b.update(); b.draw(); });
  bursts = bursts.filter(b => b.alive);

  // Remove dead particles and replenish
  const dead = particles.filter(p => !p.alive);
  dead.forEach(() => {}); // shouldn't happen for non-burst
  if (particles.length < CONFIG.particleCount) {
    for (let i = particles.length; i < CONFIG.particleCount; i++) {
      particles.push(new Particle());
    }
  }

  requestAnimationFrame(animate);
}

// Events
window.addEventListener('resize', () => {
  resize();
});

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => {
  mouse.active = false;
});

canvas.addEventListener('click', (e) => {
  bursts.push(new Burst(e.clientX, e.clientY));
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    init();
  }
});

// Touch support
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX;
  mouse.y = t.clientY;
  mouse.active = true;
}, { passive: false });

canvas.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  mouse.x = t.clientX;
  mouse.y = t.clientY;
  mouse.active = true;
  bursts.push(new Burst(t.clientX, t.clientY));
});

canvas.addEventListener('touchend', () => {
  mouse.active = false;
});

// Start
init();
// Fill background initially
ctx.fillStyle = '#0a0a0f';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
