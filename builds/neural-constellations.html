<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Constellations</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #e0e0ff;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
  }
  #info {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    opacity: 0.4;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
  #title {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    opacity: 0.3;
    letter-spacing: 6px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="title">Neural Constellations</div>
<div id="info">move mouse to attract • click to pulse</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height, particles, mouse, attractors;
let frame = 0;

mouse = { x: -1000, y: -1000, active: false };

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

canvas.addEventListener('click', (e) => {
  // Spawn burst
  for (let i = 0; i < 30; i++) {
    const angle = (Math.PI * 2 / 30) * i;
    particles.push({
      x: e.clientX,
      y: e.clientY,
      vx: Math.cos(angle) * (2 + Math.random() * 3),
      vy: Math.sin(angle) * (2 + Math.random() * 3),
      radius: 1 + Math.random() * 2,
      life: 1,
      decay: 0.008 + Math.random() * 0.01,
      hue: Math.random() < 0.5 ? 220 : 280
    });
  }
});

class Particle {
  constructor() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5;
    this.baseRadius = 0.5 + Math.random() * 1.5;
    this.radius = this.baseRadius;
    this.hue = 200 + Math.random() * 100;
    this.pulse = Math.random() * Math.PI * 2;
    this.pulseSpeed = 0.01 + Math.random() * 0.02;
  }

  update() {
    // Mouse attraction
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 250) {
        const force = (250 - dist) / 250 * 0.03;
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }
    }

    // Organic drift
    this.vx += Math.sin(frame * 0.003 + this.pulse) * 0.002;
    this.vy += Math.cos(frame * 0.004 + this.pulse) * 0.002;

    // Damping
    this.vx *= 0.99;
    this.vy *= 0.99;

    this.x += this.vx;
    this.y += this.vy;

    // Wrap edges with soft return
    if (this.x < -50) this.x = width + 50;
    if (this.x > width + 50) this.x = -50;
    if (this.y < -50) this.y = height + 50;
    if (this.y > height + 50) this.y = -50;

    // Pulse
    this.pulse += this.pulseSpeed;
    this.radius = this.baseRadius + Math.sin(this.pulse) * 0.5;
  }

  draw() {
    const alpha = 0.3 + Math.sin(this.pulse) * 0.2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 70%, 60%, ${alpha})`;
    ctx.fill();
  }
}

// Initialize particles
particles = [];
for (let i = 0; i < 180; i++) {
  particles.push(new Particle());
}

function drawConnections() {
  const maxDist = 120;
  ctx.lineWidth = 0.3;

  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < maxDist) {
        const alpha = (1 - dist / maxDist) * 0.15;
        const hue = (particles[i].hue + particles[j].hue) / 2;
        ctx.strokeStyle = `hsla(${hue}, 60%, 50%, ${alpha})`;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }
}

function drawMouseGlow() {
  if (!mouse.active) return;
  const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 200);
  gradient.addColorStop(0, 'rgba(100, 140, 255, 0.05)');
  gradient.addColorStop(1, 'rgba(100, 140, 255, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);
}

function animate() {
  frame++;
  
  // Trailing fade
  ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
  ctx.fillRect(0, 0, width, height);

  // Subtle vignette
  const vignette = ctx.createRadialGradient(width/2, height/2, height * 0.3, width/2, height/2, height * 0.8);
  vignette.addColorStop(0, 'rgba(10, 10, 15, 0)');
  vignette.addColorStop(1, 'rgba(5, 5, 10, 0.3)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, width, height);

  drawMouseGlow();
  
  // Update and draw
  particles = particles.filter(p => p.life > 0 || !p.hasOwnProperty('life'));
  particles.forEach(p => {
    if (p.life !== undefined) {
      p.life -= p.decay;
      p.vx *= 0.98;
      p.vy *= 0.98;
    }
    p.update();
    p.draw();
  });

  drawConnections();

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
