<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Cosmos — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; }
  #info {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(120, 200, 255, 0.7);
    font-size: 12px;
    letter-spacing: 2px;
    pointer-events: none;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(80, 160, 255, 0.5);
  }
  #title {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(180, 220, 255, 0.6);
    font-size: 14px;
    letter-spacing: 6px;
    pointer-events: none;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(100, 180, 255, 0.4);
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="title">Neural Cosmos</div>
<div id="info">move your mouse to influence the field</div>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;
  let mouse = { x: -9999, y: -9999, vx: 0, vy: 0, active: false };
  let particles = [];
  const PARTICLE_COUNT = 140;
  const CONNECTION_DIST = 160;
  const MOUSE_RADIUS = 200;
  const MOUSE_FORCE = 0.04;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  class Particle {
    constructor() {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.vx = (Math.random() - 0.5) * 0.6;
      this.vy = (Math.random() - 0.5) * 0.6;
      this.baseRadius = Math.random() * 2 + 1;
      this.radius = this.baseRadius;
      this.hue = Math.random() * 60 + 200; // blue-cyan range
      this.pulse = Math.random() * Math.PI * 2;
      this.pulseSpeed = Math.random() * 0.02 + 0.005;
    }

    update() {
      // drift
      this.x += this.vx;
      this.y += this.vy;

      // soft boundary wrap
      if (this.x < -50) this.x = W + 50;
      if (this.x > W + 50) this.x = -50;
      if (this.y < -50) this.y = H + 50;
      if (this.y > H + 50) this.y = -50;

      // mouse influence
      if (mouse.active) {
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < MOUSE_RADIUS) {
          const force = (1 - dist / MOUSE_RADIUS) * MOUSE_FORCE;
          this.vx += dx * force;
          this.vy += dy * force;
          this.radius = this.baseRadius + (1 - dist / MOUSE_RADIUS) * 3;
        } else {
          this.radius += (this.baseRadius - this.radius) * 0.05;
        }
      } else {
        this.radius += (this.baseRadius - this.radius) * 0.05;
      }

      // damping
      this.vx *= 0.995;
      this.vy *= 0.995;

      // speed cap
      const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      if (speed > 2.5) {
        this.vx = (this.vx / speed) * 2.5;
        this.vy = (this.vy / speed) * 2.5;
      }

      // pulse
      this.pulse += this.pulseSpeed;
    }

    draw() {
      const glow = 0.6 + Math.sin(this.pulse) * 0.4;
      const alpha = 0.4 + glow * 0.5;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${alpha})`;
      ctx.fill();

      // outer glow
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, 80%, 60%, ${alpha * 0.15})`;
      ctx.fill();
    }
  }

  function init() {
    resize();
    particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(new Particle());
    }
  }

  function drawConnections() {
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < CONNECTION_DIST) {
          const alpha = (1 - dist / CONNECTION_DIST) * 0.25;
          const hue = (particles[i].hue + particles[j].hue) / 2;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `hsla(${hue}, 70%, 65%, ${alpha})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    // mouse connections
    if (mouse.active) {
      for (let i = 0; i < particles.length; i++) {
        const dx = mouse.x - particles[i].x;
        const dy = mouse.y - particles[i].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < MOUSE_RADIUS) {
          const alpha = (1 - dist / MOUSE_RADIUS) * 0.4;
          const hue = particles[i].hue;
          ctx.beginPath();
          ctx.moveTo(mouse.x, mouse.y);
          ctx.lineTo(particles[i].x, particles[i].y);
          ctx.strokeStyle = `hsla(${hue}, 90%, 75%, ${alpha})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }
  }

  let time = 0;
  function animate() {
    time += 0.005;
    
    // fade trail
    ctx.fillStyle = 'rgba(2, 4, 12, 0.15)';
    ctx.fillRect(0, 0, W, H);

    // subtle background nebula shifts
    const grad = ctx.createRadialGradient(
      W * 0.5 + Math.sin(time) * 100, H * 0.5 + Math.cos(time * 0.7) * 80, 0,
      W * 0.5, H * 0.5, Math.max(W, H) * 0.7
    );
    grad.addColorStop(0, 'rgba(20, 40, 80, 0.03)');
    grad.addColorStop(0.5, 'rgba(10, 20, 50, 0.02)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    particles.forEach(p => p.update());
    drawConnections();
    particles.forEach(p => p.draw());

    requestAnimationFrame(animate);
  }

  // events
  window.addEventListener('resize', () => {
    resize();
  });

  window.addEventListener('mousemove', (e) => {
    mouse.vx = e.clientX - mouse.x;
    mouse.vy = e.clientY - mouse.y;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });

  window.addEventListener('mouseleave', () => {
    mouse.active = false;
  });

  window.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    mouse.x = t.clientX;
    mouse.y = t.clientY;
    mouse.active = true;
  }, { passive: false });

  window.addEventListener('touchend', () => {
    mouse.active = false;
  });

  init();
  animate();
})();
</script>
</body>
</html>
