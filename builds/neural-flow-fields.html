<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Flow Fields</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #aab;
    cursor: crosshair;
  }
  canvas { display: block; }
  #controls {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: rgba(10, 10, 20, 0.85);
    border: 1px solid rgba(100, 200, 255, 0.2);
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 12px;
    backdrop-filter: blur(8px);
    user-select: none;
  }
  #controls h2 {
    font-size: 13px;
    color: #6cf;
    margin-bottom: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .ctrl-row {
    display: flex;
    align-items: center;
    margin: 6px 0;
    gap: 8px;
  }
  .ctrl-row label { min-width: 90px; color: #889; font-size: 11px; }
  .ctrl-row input[type=range] { width: 110px; accent-color: #6cf; }
  .ctrl-row .val { min-width: 30px; text-align: right; color: #6cf; font-size: 11px; }
  .palette-row { display: flex; gap: 6px; margin-top: 8px; }
  .palette-btn {
    width: 22px; height: 22px; border-radius: 4px; border: 2px solid transparent;
    cursor: pointer; transition: border-color 0.2s;
  }
  .palette-btn.active { border-color: #fff; }
  .info {
    position: fixed;
    bottom: 16px;
    left: 16px;
    font-size: 11px;
    color: #556;
    z-index: 10;
  }
  #fps { position: fixed; top: 16px; right: 16px; font-size: 11px; color: #445; z-index: 10; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="controls">
  <h2>⚡ Neural Flow</h2>
  <div class="ctrl-row"><label>Speed</label>
    <input type="range" id="speed" min="1" max="30" value="10">
    <span class="val" id="speedVal">1.0</span>
  </div>
  <div class="ctrl-row"><label>Chaos</label>
    <input type="range" id="chaos" min="1" max="20" value="6">
    <span class="val" id="chaosVal">6</span>
  </div>
  <div class="ctrl-row"><label>Trails</label>
    <input type="range" id="trails" min="1" max="40" value="12">
    <span class="val" id="trailsVal">12</span>
  </div>
  <div class="ctrl-row"><label>Particles</label>
    <input type="range" id="count" min="100" max="3000" value="800" step="100">
    <span class="val" id="countVal">800</span>
  </div>
  <div class="palette-row" id="palettes"></div>
</div>
<div class="info">Move mouse to attract · Click to burst · Press H to hide controls</div>
<div id="fps"></div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

// Noise function (simplified Perlin-ish)
function noise(x, y, t) {
  return Math.sin(x * 0.8 + t) * Math.cos(y * 0.6 - t * 0.7) +
         Math.sin((x + y) * 0.4 + t * 1.3) * 0.5 +
         Math.cos(x * 1.2 - y * 0.9 + t * 0.5) * 0.3;
}

const palettes = {
  aurora:  ['#0f0c29', '#302b63', '#24243e', '#00d4ff', '#7b2ff7', '#ff6ec7'],
  ember:   ['#1a0000', '#3d0000', '#ff4500', '#ff8c00', '#ffd700', '#fff5cc'],
  ocean:   ['#001219', '#005f73', '#0a9396', '#94d2bd', '#e9d8a6', '#ee9b00'],
  neon:    ['#0d0221', '#1a0533', '#ff00ff', '#00ff88', '#ffff00', '#00ffff'],
  ghost:   ['#0a0a0f', '#1a1a2e', '#4a4e69', '#9a8c98', '#c9ada7', '#f2e9e4'],
  matrix:  ['#000000', '#0d0208', '#008f11', '#00ff41', '#003b00', '#ccffcc']
};
let currentPalette = 'aurora';

const sliders = {
  speed: document.getElementById('speed'),
  chaos: document.getElementById('chaos'),
  trails: document.getElementById('trails'),
  count: document.getElementById('count')
};

function getVal(id) { return +sliders[id].value; }
Object.keys(sliders).forEach(id => {
  sliders[id].addEventListener('input', () => {
    document.getElementById(id + 'Val').textContent =
      id === 'speed' ? (getVal('speed') / 10).toFixed(1) : getVal(id);
    if (id === 'count') initParticles();
  });
});

// Palette buttons
const palRow = document.getElementById('palettes');
Object.keys(palettes).forEach(name => {
  const btn = document.createElement('div');
  btn.className = 'palette-btn' + (name === currentPalette ? ' active' : '');
  btn.style.background = `linear-gradient(135deg, ${palettes[name][3]}, ${palettes[name][4]})`;
  btn.onclick = () => {
    currentPalette = name;
    document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
  palRow.appendChild(btn);
});

// Particles
let particles = [];
function initParticles() {
  const n = getVal('count');
  particles = [];
  for (let i = 0; i < n; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      px: 0, py: 0,
      color: palettes[currentPalette][3 + Math.floor(Math.random() * 3)],
      life: Math.random() * 200,
      speed: 0.5 + Math.random() * 1.5
    });
  }
}
initParticles();

let mouse = { x: W / 2, y: H / 2, active: false };
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
addEventListener('mouseleave', () => { mouse.active = false; });
addEventListener('click', () => {
  for (let i = 0; i < 60; i++) {
    const p = particles[Math.floor(Math.random() * particles.length)];
    p.x = mouse.x + (Math.random() - 0.5) * 80;
    p.y = mouse.y + (Math.random() - 0.5) * 80;
    p.color = palettes[currentPalette][3 + Math.floor(Math.random() * 3)];
  }
});

addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H') {
    document.getElementById('controls').style.display =
      document.getElementById('controls').style.display === 'none' ? '' : 'none';
  }
});

let time = 0, lastFrame = performance.now(), fps = 60;
const fpsEl = document.getElementById('fps');

function animate() {
  const now = performance.now();
  fps = fps * 0.95 + (1000 / (now - lastFrame)) * 0.05;
  lastFrame = now;
  fpsEl.textContent = `FPS: ${fps.toFixed(0)}`;

  const speed = getVal('speed') / 10;
  const chaos = getVal('chaos');
  const trailAlpha = getVal('trails') / 200;

  ctx.fillStyle = `rgba(10, 10, 18, ${trailAlpha})`;
  ctx.fillRect(0, 0, W, H);

  time += 0.003 * speed;

  for (let p of particles) {
    p.px = p.x; p.py = p.y;
    const angle = noise(p.x * 0.003, p.y * 0.003, time) * Math.PI * chaos;
    let vx = Math.cos(angle) * p.speed * speed;
    let vy = Math.sin(angle) * p.speed * speed;

    if (mouse.active) {
      const dx = mouse.x - p.x, dy = mouse.y - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 1;
      if (dist < 200) {
        const force = (200 - dist) / 200 * 2;
        vx += (dx / dist) * force;
        vy += (dy / dist) * force;
      }
    }

    p.x += vx; p.y += vy;
    p.life--;

    // Wrap edges
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;

    if (p.life <= 0) {
      p.x = Math.random() * W; p.y = Math.random() * H;
      p.color = palettes[currentPalette][3 + Math.floor(Math.random() * 3)];
      p.life = 100 + Math.random() * 300;
    }

    const alpha = Math.min(1, p.life / 40) * 0.7;
    ctx.strokeStyle = p.color + Math.round(alpha * 255).toString(16).padStart(2, '0');
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(p.px, p.py);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
