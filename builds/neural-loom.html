<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Loom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050508; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .ui { position: fixed; top: 20px; left: 20px; z-index: 10; }
  .panel { background: rgba(10,10,18,0.85); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 16px; backdrop-filter: blur(12px); min-width: 220px; }
  h1 { font-size: 14px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.7); margin-bottom: 14px; }
  .mode-btns { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .mode-btns button { flex: 1; min-width: 70px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; letter-spacing: 1px; transition: all 0.2s; }
  .mode-btns button:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.9); }
  .mode-btns button.active { background: rgba(100,180,255,0.15); border-color: rgba(100,180,255,0.4); color: #7ab8ff; }
  .slider-group { margin-bottom: 12px; }
  .slider-group label { display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 4px; letter-spacing: 1px; }
  .slider-group label span { color: rgba(255,255,255,0.7); }
  input[type="range"] { width: 100%; -webkit-appearance: none; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: rgba(150,200,255,0.8); border-radius: 50%; cursor: pointer; }
  .hint { font-size: 10px; color: rgba(255,255,255,0.25); margin-top: 12px; line-height: 1.7; letter-spacing: 0.5px; }
  .stats { position: fixed; bottom: 20px; left: 20px; font-size: 10px; color: rgba(255,255,255,0.2); letter-spacing: 1px; z-index: 10; }
  .btn-row { display: flex; gap: 6px; margin-top: 12px; }
  .btn-row button { flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); padding: 6px; border-radius: 6px; cursor: pointer; font-size: 10px; letter-spacing: 1px; }
  .btn-row button:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.9); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="panel">
    <h1>Neural Loom</h1>
    <div class="mode-btns">
      <button data-mode="0" class="active">Spiral</button>
      <button data-mode="1">Bloom</button>
      <button data-mode="2">Web</button>
      <button data-mode="3">Crystal</button>
    </div>
    <div class="slider-group">
      <label>Symmetry <span id="symVal">8</span></label>
      <input type="range" id="symmetry" min="3" max="24" value="8">
    </div>
    <div class="slider-group">
      <label>Layers <span id="layVal">60</span></label>
      <input type="range" id="layers" min="10" max="200" value="60">
    </div>
    <div class="slider-group">
      <label>Drift <span id="driftVal">0.5</span></label>
      <input type="range" id="drift" min="0" max="100" value="50">
    </div>
    <div class="slider-group">
      <label>Glow <span id="glowVal">0.6</span></label>
      <input type="range" id="glow" min="0" max="100" value="60">
    </div>
    <div class="btn-row">
      <button id="randomize">⟡ Random</button>
      <button id="save">⬇ Save</button>
    </div>
    <div class="hint">
      CLICK to seed · DRAG to warp<br>
      SCROLL to zoom · SPACE to randomize<br>
      M keys 1-4 switch modes
    </div>
  </div>
</div>
<div class="stats" id="stats">fps: 60</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, CX, CY;
let t = 0, time = 0;
let mouse = { x: 0, y: 0, down: false, px: 0, py: 0 };
let zoom = 1, targetZoom = 1;
let offsetX = 0, offsetY = 0, targOX = 0, targOY = 0;
let seed = Math.random() * 10000;
let mode = 0, symmetry = 8, layers = 60, drift = 0.5, glow = 0.6;
let lastFrame = performance.now(), fps = 60;

const palettes = [
  { name: 'Aurora', colors: ['#00ffc8','#7b2fff','#ff2d95','#2d7bff','#00ffc8'], bg: '#050510' },
  { name: 'Ember', colors: ['#ff4400','#ff8800','#ffcc00','#ff2200','#ff6600'], bg: '#0a0505' },
  { name: 'Deep', colors: ['#1a3a5c','#2d6a9f','#4da6ff','#7ac4ff','#b8e0ff'], bg: '#030508' },
  { name: 'Void', colors: ['#8b5cf6','#a78bfa','#c4b5fd','#7c3aed','#6d28d9'], bg: '#060510' },
  { name: 'Forest', colors: ['#00ff87','#60ff9e','#00cc6a','#88ffbb','#00ff44'], bg: '#030a05' },
];
let palette = palettes[Math.floor(Math.random() * palettes.length)];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2; CY = H / 2;
}
window.addEventListener('resize', resize);
resize();

function lerp(a,b,t) { return a + (b-a)*t; }
function dist(x1,y1,x2,y2) { return Math.hypot(x2-x1,y2-y1); }
function rand(min,max) { return min + Math.random() * (max - min); }
function smoothRand(i, seed) {
  const s = Math.sin(i * 127.1 + seed) * 43758.5453;
  return s - Math.floor(s);
}
function colorStr(i, alpha) {
  const c = palette.colors[i % palette.colors.length];
  const a = alpha !== undefined ? alpha : 1;
  if (a < 1) {
    const r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }
  return c;
}

function drawSpiral() {
  const cx = CX + offsetX, cy = CY + offsetY;
  const baseR = Math.min(W,H) * 0.35 * zoom;
  const mx = mouse.x - cx, my = mouse.y - cy;
  const md = Math.hypot(mx, my);

  ctx.globalCompositeOperation = 'lighter';
  for (let l = 0; l < layers; l++) {
    const frac = l / layers;
    const points = [];
    const r = baseR * (0.1 + frac * 0.9);
    const turns = 2 + drift * 4;
    const warp = mouse.down ? Math.hypot(mouse.x - mouse.px, mouse.y - mouse.py) * 0.01 : 0;
    const warpAngle = mouse.down ? Math.atan2(mouse.py - mouse.y, mouse.px - mouse.x) : 0;

    for (let i = 0; i <= 360; i += 3) {
      const angle = (i / 360) * Math.PI * 2 * turns;
      const noise = smoothRand(l * 100 + i, seed) * drift * 40;
      const wave = Math.sin(angle * symmetry * 0.5 + time * 0.8 + l * 0.1) * drift * 15;
      const warpEffect = mouse.down ? Math.sin(angle - warpAngle) * warp * r * 0.3 : 0;
      const px = cx + Math.cos(angle) * (r + noise + wave + warpEffect);
      const py = cy + Math.sin(angle) * (r + noise + wave + warpEffect);
      points.push({ x: px, y: py });
    }

    const ci = (l + Math.floor(time * 0.5)) % palette.colors.length;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length - 1; i++) {
      const xc = (points[i].x + points[i+1].x) / 2;
      const yc = (points[i].y + points[i+1].y) / 2;
      ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
    }
    ctx.strokeStyle = colorStr(ci, 0.15 + frac * 0.35 * glow);
    ctx.lineWidth = 1 + frac * 1.5;
    ctx.stroke();
  }

  // Center core
  for (let i = 0; i < symmetry; i++) {
    const a = (i / symmetry) * Math.PI * 2 + time * 0.3;
    const len = baseR * 0.15 * zoom;
    const pulse = Math.sin(time * 2 + i) * 0.3 + 0.7;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * len * pulse, cy + Math.sin(a) * len * pulse);
    ctx.strokeStyle = colorStr(i, 0.4 * glow);
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function drawBloom() {
  const cx = CX + offsetX, cy = CY + offsetY;
  const baseR = Math.min(W,H) * 0.3 * zoom;
  const warp = mouse.down ? Math.hypot(mouse.x - mouse.px, mouse.y - mouse.py) * 0.02 : 0;

  ctx.globalCompositeOperation = 'lighter';
  for (let l = 0; l < layers; l++) {
    const frac = l / layers;
    const r = baseR * (0.05 + frac * 0.95);
    const petals = symmetry;
    const petalLen = r * (0.3 + drift * 0.7);
    const ci = (l + Math.floor(time)) % palette.colors.length;

    for (let i = 0; i < petals; i++) {
      const a = (i / petals) * Math.PI * 2 + time * 0.2 + smoothRand(l * 7 + i, seed) * 0.5;
      const wobble = Math.sin(time * 1.5 + l * 0.2 + i * 0.5) * drift * 20;
      const wEffect = mouse.down ? Math.sin(a) * warp * r * 0.2 : 0;
      const x1 = cx + Math.cos(a) * r * 0.2;
      const y1 = cy + Math.sin(a) * r * 0.2;
      const x2 = cx + Math.cos(a) * (petalLen + wobble + wEffect);
      const y2 = cy + Math.sin(a) * (petalLen + wobble + wEffect);

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      const cp1x = cx + Math.cos(a + 0.3) * r * 0.6;
      const cp1y = cy + Math.sin(a + 0.3) * r * 0.6;
      const cp2x = cx + Math.cos(a - 0.3) * r * 0.6;
      const cp2y = cy + Math.sin(a - 0.3) * r * 0.6;
      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
      ctx.strokeStyle = colorStr(ci, (0.1 + frac * 0.4) * glow);
      ctx.lineWidth = 1 + frac * 2;
      ctx.stroke();

      // Tip dot
      ctx.beginPath();
      ctx.arc(x2, y2, 1.5 + frac * 2, 0, Math.PI * 2);
      ctx.fillStyle = colorStr(ci, 0.6 * glow);
      ctx.fill();
    }
  }
}

function drawWeb() {
  const cx = CX + offsetX, cy = CY + offsetY;
  const baseR = Math.min(W,H) * 0.35 * zoom;
  const nodes = [];
  const rings = layers;
  const warp = mouse.down ? Math.hypot(mouse.x - mouse.px, mouse.y - mouse.py) * 0.015 : 0;

  for (let ring = 0; ring <= rings; ring++) {
    const r = baseR * (ring / rings);
    const count = Math.floor(symmetry * (1 + ring * 0.3));
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + time * 0.1 * (ring % 2 === 0 ? 1 : -1);
      const wobble = smoothRand(ring * 50 + i, seed) * drift * 20;
      const wEffect = mouse.down ? Math.sin(a + time) * warp * r * 0.3 : 0;
      nodes.push({
        x: cx + Math.cos(a) * (r + wobble + wEffect),
        y: cy + Math.sin(a) * (r + wobble + wEffect),
        ring, i, a
      });
    }
  }

  ctx.globalCompositeOperation = 'lighter';
  // Draw connections
  nodes.forEach((n, idx) => {
    const ci = (n.ring + Math.floor(time * 0.3)) % palette.colors.length;
    // Connect to nearby nodes in adjacent rings
    nodes.forEach((m, jdx) => {
      if (jdx <= idx) return;
      const d = dist(n.x, n.y, m.x, m.y);
      if (d < baseR * 0.15) {
        ctx.beginPath();
        ctx.moveTo(n.x, n.y);
        ctx.lineTo(m.x, m.y);
        ctx.strokeStyle = colorStr(ci, (1 - d / (baseR * 0.15)) * 0.2 * glow);
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    });
    // Node dot
    ctx.beginPath();
    ctx.arc(n.x, n.y, 1.2 + (1 - n.ring / rings) * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = colorStr(ci, (0.3 + (1 - n.ring / rings) * 0.5) * glow);
    ctx.fill();
  });
}

function drawCrystal() {
  const cx = CX + offsetX, cy = CY + offsetY;
  const baseR = Math.min(W,H) * 0.3 * zoom;
  const warp = mouse.down ? Math.hypot(mouse.x - mouse.px, mouse.y - mouse.py) * 0.02 : 0;

  ctx.globalCompositeOperation = 'lighter';
  for (let l = 0; l < layers; l++) {
    const frac = l / layers;
    const r = baseR * (0.05 + frac * 0.95);
    const ci = (l + Math.floor(time * 0.4)) % palette.colors.length;
    const sides = symmetry;
    const rot = time * 0.15 + smoothRand(l * 3, seed) * Math.PI;
    const scale = 1 + Math.sin(time + l * 0.1) * drift * 0.2;
    const wEffect = mouse.down ? warp * 30 : 0;

    ctx.beginPath();
    for (let i = 0; i <= sides; i++) {
      const a = (i / sides) * Math.PI * 2 + rot;
      const wobble = smoothRand(l * 10 + i, seed) * drift * 15 + wEffect;
      const px = cx + Math.cos(a) * (r * scale + wobble);
      const py = cy + Math.sin(a) * (r * scale + wobble);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.strokeStyle = colorStr(ci, (0.1 + frac * 0.35) * glow);
    ctx.lineWidth = 1 + frac;
    ctx.stroke();

    // Inner facet lines
    for (let i = 0; i < sides; i++) {
      const a = (i / sides) * Math.PI * 2 + rot;
      const innerR = r * 0.4 * scale;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * innerR, cy + Math.sin(a) * innerR);
      ctx.strokeStyle = colorStr(ci, 0.08 * glow);
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
  }
}

function draw() {
  const now = performance.now();
  fps = lerp(fps, 1000 / (now - lastFrame), 0.1);
  lastFrame = now;

  time += 0.016;
  zoom = lerp(zoom, targetZoom, 0.08);
  offsetX = lerp(offsetX, targOX, 0.06);
  offsetY = lerp(offsetY, targOY, 0.06);

  // Fade trail
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = palette.bg;
  ctx.globalAlpha = 0.12;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;

  // Switch draw mode
  if (mode === 0) drawSpiral();
  else if (mode === 1) drawBloom();
  else if (mode === 2) drawWeb();
  else if (mode === 3) drawCrystal();

  // Mouse glow
  if (mouse.x && mouse.y) {
    ctx.globalCompositeOperation = 'lighter';
    const grd = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 80);
    grd.addColorStop(0, colorStr(Math.floor(time * 2), 0.05));
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 80, 0, Math.PI * 2);
    ctx.fill();
  }

  document.getElementById('stats').textContent = `fps: ${Math.round(fps)} · seed: ${Math.floor(seed)} · ${palette.name}`;
  requestAnimationFrame(draw);
}

// Events
canvas.addEventListener('mousemove', e => {
  mouse.px = mouse.x; mouse.py = mouse.y;
  mouse.x = e.clientX; mouse.y = e.clientY;
});
canvas.addEventListener('mousedown', () => mouse.down = true);
canvas.addEventListener('mouseup', () => mouse.down = false);
canvas.addEventListener('mouseleave', () => mouse.down = false);
canvas.addEventListener('click', e => {
  seed = Math.random() * 10000;
  palette = palettes[Math.floor(Math.random() * palettes.length)];
});
canvas.addEventListener('wheel', e => {
  targetZoom = Math.max(0.3, Math.min(3, targetZoom - e.deltaY * 0.001));
});

window.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); randomize(); }
  if (e.key === '1') setMode(0);
  if (e.key === '2') setMode(1);
  if (e.key === '3') setMode(2);
  if (e.key === '4') setMode(3);
});

// UI
document.querySelectorAll('.mode-btns button').forEach(btn => {
  btn.addEventListener('click', () => setMode(parseInt(btn.dataset.mode)));
});
document.getElementById('symmetry').addEventListener('input', e => { symmetry = parseInt(e.target.value); document.getElementById('symVal').textContent = symmetry; });
document.getElementById('layers').addEventListener('input', e => { layers = parseInt(e.target.value); document.getElementById('layVal').textContent = layers; });
document.getElementById('drift').addEventListener('input', e => { drift = parseInt(e.target.value) / 100; document.getElementById('driftVal').textContent = drift.toFixed(2); });
document.getElementById('glow').addEventListener('input', e => { glow = parseInt(e.target.value) / 100; document.getElementById('glowVal').textContent = glow.toFixed(2); });
document.getElementById('randomize').addEventListener('click', randomize);
document.getElementById('save').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = `neural-loom-${Date.now()}.png`;
  link.href = canvas.toDataURL();
  link.click();
});

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btns button').forEach(b => b.classList.toggle('active', parseInt(b.dataset.mode) === m));
}
function randomize() {
  seed = Math.random() * 10000;
  symmetry = Math.floor(rand(3, 20));
  layers = Math.floor(rand(20, 150));
  drift = Math.random();
  glow = Math.random() * 0.8 + 0.2;
  palette = palettes[Math.floor(Math.random() * palettes.length)];
  document.getElementById('symmetry').value = symmetry;
  document.getElementById('symVal').textContent = symmetry;
  document.getElementById('layers').value = layers;
  document.getElementById('layVal').textContent = layers;
  document.getElementById('drift').value = Math.floor(drift * 100);
  document.getElementById('driftVal').textContent = drift.toFixed(2);
  document.getElementById('glow').value = Math.floor(glow * 100);
  document.getElementById('glowVal').textContent = glow.toFixed(2);
}

// Clear to bg color initially
ctx.fillStyle = palette.bg;
ctx.fillRect(0, 0, W, H);
draw();
</script>
</body>
</html>
