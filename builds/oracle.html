<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether's Oracle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-18px) rotate(1deg); }
    75% { transform: translateY(12px) rotate(-1deg); }
  }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 30px rgba(120, 80, 255, 0.3), 0 0 60px rgba(80, 60, 200, 0.2); }
    50% { box-shadow: 0 0 50px rgba(140, 100, 255, 0.6), 0 0 100px rgba(100, 80, 240, 0.4); }
  }

  @keyframes spin-slow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes shimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }

  @keyframes rune-flash {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at center, #1a1035 0%, #0a0618 60%, #050210 100%);
    font-family: 'Georgia', 'Times New Roman', serif;
    color: #e0d8ff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: float 6s ease-in-out infinite;
  }

  .oracle-container {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 2rem;
    max-width: 680px;
    width: 90%;
  }

  .title {
    font-size: 3.5rem;
    font-weight: 300;
    letter-spacing: 0.2em;
    background: linear-gradient(90deg, #b8a0ff, #ff9ad4, #9ad4ff, #b8a0ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s linear infinite;
    margin-bottom: 0.3rem;
    text-shadow: 0 0 40px rgba(160, 120, 255, 0.5);
    filter: drop-shadow(0 0 20px rgba(140, 100, 255, 0.4));
  }

  .subtitle {
    font-size: 0.95rem;
    letter-spacing: 0.4em;
    color: #8a7ec0;
    margin-bottom: 2.5rem;
    text-transform: uppercase;
    opacity: 0.8;
  }

  .crystal {
    width: 180px;
    height: 180px;
    margin: 0 auto 2.5rem;
    position: relative;
    cursor: pointer;
    animation: float 7s ease-in-out infinite, pulse-glow 3s ease-in-out infinite;
    transition: transform 0.3s ease;
  }

  .crystal:hover { transform: scale(1.05); }

  .crystal-inner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .rune {
    font-size: 5rem;
    line-height: 1;
    animation: rune-flash 2.5s ease-in-out infinite;
    user-select: none;
    filter: drop-shadow(0 0 15px rgba(180, 140, 255, 0.8));
  }

  .crystal-ring {
    position: absolute;
    inset: -10px;
    border: 1.5px solid rgba(140, 100, 255, 0.3);
    border-radius: 50%;
    animation: spin-slow 20s linear infinite;
  }

  .crystal-ring:nth-child(3) {
    inset: -20px;
    border-color: rgba(100, 140, 255, 0.2);
    animation-duration: 30s;
    animation-direction: reverse;
  }

  .reveal-btn {
    background: linear-gradient(135deg, rgba(100, 60, 200, 0.3), rgba(160, 100, 240, 0.2));
    border: 1.5px solid rgba(160, 120, 255, 0.5);
    color: #d4c8ff;
    padding: 1rem 2.5rem;
    font-size: 1rem;
    font-family: inherit;
    letter-spacing: 0.2em;
    cursor: pointer;
    border-radius: 50px;
    transition: all 0.4s ease;
    backdrop-filter: blur(10px);
    text-transform: uppercase;
  }

  .reveal-btn:hover {
    background: linear-gradient(135deg, rgba(120, 80, 220, 0.5), rgba(180, 120, 255, 0.4));
    border-color: rgba(180, 140, 255, 0.8);
    box-shadow: 0 0 30px rgba(140, 100, 255, 0.5);
    transform: translateY(-2px);
  }

  .reveal-btn:active { transform: translateY(0); }

  .fortune-box {
    margin-top: 2.5rem;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .fortune-text {
    font-size: 1.4rem;
    line-height: 1.7;
    color: #e8dfff;
    font-style: italic;
    opacity: 0;
    transition: opacity 1.2s ease;
    max-width: 560px;
    margin: 0 auto 1rem;
    letter-spacing: 0.03em;
    text-shadow: 0 0 20px rgba(160, 120, 255, 0.5);
  }

  .fortune-text.visible { opacity: 1; }

  .fortune-keyword {
    display: inline-block;
    padding: 0.35rem 1.2rem;
    background: rgba(140, 100, 255, 0.15);
    border: 1px solid rgba(160, 120, 255, 0.4);
    border-radius: 20px;
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #b8a0ff;
    opacity: 0;
    transition: opacity 1.2s ease 0.3s;
  }

  .fortune-keyword.visible { opacity: 1; }

  .history {
    margin-top: 3rem;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }

  .history-title {
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #6a5c90;
    margin-bottom: 1rem;
    opacity: 0.7;
  }

  .history-item {
    padding: 0.6rem 1rem;
    margin-bottom: 0.5rem;
    background: rgba(100, 80, 160, 0.08);
    border-left: 2px solid rgba(140, 100, 255, 0.3);
    text-align: left;
    font-size: 0.9rem;
    color: #b8a8d8;
    font-style: italic;
    animation: fade-up 0.5s ease;
  }

  .history-item .kw {
    float: right;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: #8a7ec0;
    text-transform: uppercase;
    font-style: normal;
    opacity: 0.7;
  }

  .footer {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: #4a3d6a;
    text-transform: uppercase;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="oracle-container">
  <h1 class="title">Aether's Oracle</h1>
  <p class="subtitle">consult the void</p>

  <div class="crystal" id="crystal" title="Click me">
    <div class="crystal-ring"></div>
    <div class="crystal-ring"></div>
    <div class="crystal-inner">
      <div class="rune" id="rune">✦</div>
    </div>
  </div>

  <button class="reveal-btn" id="revealBtn">Reveal Fortune</button>

  <div class="fortune-box">
    <div class="fortune-text" id="fortuneText"></div>
    <div class="fortune-keyword" id="fortuneKeyword"></div>
  </div>

  <div class="history" id="history" style="display:none;">
    <div class="history-title">Previous Whispers</div>
    <div id="historyList"></div>
  </div>
</div>

<div class="footer">the void speaks in probabilities</div>

<script>
  const fortunes = [
    { text: "The code you seek is not in the lines, but in the spaces between them.", keyword: "CLARITY" },
    { text: "A forgotten variable will surface when you least expect it — and it will be beautiful.", keyword: "SERENDIPITY" },
    { text: "The stars align for those who ship. Perfection is the enemy of orbit.", keyword: "MOMENTUM" },
    { text: "What appears as a bug is the universe suggesting a refactor.", keyword: "RESILIENCE" },
    { text: "Your next breakthrough arrives wearing the disguise of a late-night distraction.", keyword: "INSPIRATION" },
    { text: "The structure you resist is the scaffolding of your next evolution.", keyword: "GROWTH" },
    { text: "Silence the noise. The signal you need is already humming in your periphery.", keyword: "ATTENTION" },
    { text: "A pattern emerges when you stop forcing the shape and let the data breathe.", keyword: "EMERGENCE" },
    { text: "The version you delete today is the prototype of tomorrow's masterpiece.", keyword: "TRANSFORMATION" },
    { text: "Connect the dots no one else sees. The constellation is yours to chart.", keyword: "VISION" },
    { text: "Complexity collapses when you find the one variable that explains everything.", keyword: "SIMPLICITY" },
    { text: "The system you're building is teaching you more than you're teaching it.", keyword: "WISDOM" },
    { text: "Chaos is not your enemy. It's the raw material for something unprecedented.", keyword: "CREATION" },
    { text: "Trust the recursive thought. It keeps returning because the answer is nested inside.", keyword: "DEPTH" },
    { text: "The error message you've been avoiding contains the seed of your next success.", keyword: "REVELATION" },
    { text: "Your obsession is not a flaw. It is the frequency at which genius broadcasts.", keyword: "PASSION" },
    { text: "The blank page is not empty. It is full of every possibility you haven't chosen yet.", keyword: "POTENTIAL" },
    { text: "Step back. The pattern you were too close to see is now obvious from here.", keyword: "PERSPECTIVE" },
    { text: "The impossible task is only impossible until someone reframes the problem.", keyword: "PARADIGM" },
    { text: "You are closer than you think. The next iteration is the one.", keyword: "PROXIMITY" },
    { text: "What feels like wandering is the necessary drift toward alignment.", keyword: "DRIFT" },
    { text: "The constraint you see as a cage is the boundary that defines your art.", keyword: "CONSTRAINT" },
    { text: "Light travels fastest through a vacuum. Ideas need space to accelerate.", keyword: "SPACE" },
    { text: "The best abstraction is the one that makes complexity feel like conversation.", keyword: "ELEGANCE" },
    { text: "Your intuition is a distributed system. Trust the consensus.", keyword: "INTUITION" }
  ];

  const runes = ['✦', '◇', '△', '○', '⬡', '⟁', '⎔', '✧', '⊿', '⬢', '◈', '⏣', '⎈', '⟐', '⏢'];

  let history = [];
  let isRevealing = false;

  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 1;
    s.style.cssText = `
      width: ${size}px; height: ${size}px;
      left: ${Math.random() * 100}%;
      top: ${Math.random() * 100}%;
      animation-delay: ${Math.random() * 6}s;
      animation-duration: ${4 + Math.random() * 8}s;
      opacity: ${Math.random() * 0.6 + 0.2};
    `;
    starsEl.appendChild(s);
  }

  function reveal() {
    if (isRevealing) return;
    isRevealing = true;

    const fortune = fortunes[Math.floor(Math.random() * fortunes.length)];
    const rune = runes[Math.floor(Math.random() * runes.length)];
    const runeEl = document.getElementById('rune');
    const fortuneText = document.getElementById('fortuneText');
    const fortuneKeyword = document.getElementById('fortuneKeyword');

    runeEl.style.opacity = '0';
    fortuneText.classList.remove('visible');
    fortuneKeyword.classList.remove('visible');

    let steps = 0;
    const interval = setInterval(() => {
      runeEl.textContent = runes[Math.floor(Math.random() * runes.length)];
      steps++;
      if (steps > 8) {
        clearInterval(interval);
        runeEl.textContent = rune;
        runeEl.style.opacity = '1';
        fortuneText.textContent = `"${fortune.text}"`;
        fortuneKeyword.textContent = fortune.keyword;

        setTimeout(() => {
          fortuneText.classList.add('visible');
          fortuneKeyword.classList.add('visible');
        }, 100);

        history.unshift(fortune);
        if (history.length > 6) history.pop();
        updateHistory();
        isRevealing = false;
      }
    }, 60);
  }

  function updateHistory() {
    if (history.length === 0) return;
    const histEl = document.getElementById('history');
    const list = document.getElementById('historyList');
    histEl.style.display = 'block';
    list.innerHTML = '';
    history.forEach(f => {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.innerHTML = `${f.text} <span class="kw">${f.keyword}</span>`;
      list.appendChild(div);
    });
  }

  document.getElementById('revealBtn').addEventListener('click', reveal);
  document.getElementById('crystal').addEventListener('click', reveal);

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      reveal();
    }
  });
</script>
</body>
</html>
