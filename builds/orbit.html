<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit — Gravity Launch Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #0ff;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; }

  #ui {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }
  #ui > * { pointer-events: auto; }

  .panel {
    background: rgba(0, 20, 30, 0.85);
    border: 1px solid rgba(0, 255, 255, 0.2);
    border-radius: 8px;
    padding: 12px 16px;
    backdrop-filter: blur(10px);
  }

  #stats .label { font-size: 10px; color: rgba(0,255,255,0.5); text-transform: uppercase; letter-spacing: 2px; }
  #stats .value { font-size: 22px; font-weight: bold; color: #0ff; text-shadow: 0 0 10px rgba(0,255,255,0.5); }
  #stats .row { margin-bottom: 8px; }
  #stats .row:last-child { margin-bottom: 0; }

  #controls button {
    background: rgba(0, 255, 255, 0.1);
    border: 1px solid rgba(0, 255, 255, 0.3);
    color: #0ff;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    margin-left: 6px;
    transition: all 0.2s;
  }
  #controls button:hover {
    background: rgba(0, 255, 255, 0.25);
    border-color: rgba(0, 255, 255, 0.6);
  }
  #controls button.active {
    background: rgba(0, 255, 255, 0.3);
    border-color: #0ff;
  }

  #message {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 20;
    transition: opacity 0.5s;
  }
  #message h1 {
    font-size: 48px;
    text-shadow: 0 0 30px rgba(0,255,255,0.7);
    margin-bottom: 8px;
  }
  #message p {
    font-size: 14px;
    color: rgba(0,255,255,0.7);
  }
  #message.hidden { opacity: 0; }

  #power-bar {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 6px;
    background: rgba(0,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #power-bar.visible { opacity: 1; }
  #power-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #0ff, #f0f);
    border-radius: 3px;
    transition: width 0.05s;
  }

  #level-indicator {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px;
    color: rgba(0,255,255,0.6);
    z-index: 15;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
  }
  #level-indicator.show { opacity: 1; }

  .hint {
    position: fixed;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: rgba(0,255,255,0.4);
    z-index: 10;
    pointer-events: none;
    transition: opacity 1s;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="ui">
  <div class="panel" id="stats">
    <div class="row">
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="row">
      <div class="label">Orbit Time</div>
      <div class="value" id="time">0.0s</div>
    </div>
    <div class="row">
      <div class="label">Altitude</div>
      <div class="value" id="alt">—</div>
    </div>
    <div class="row">
      <div class="label">Level</div>
      <div class="value" id="level">1</div>
    </div>
  </div>
  <div class="panel" id="controls">
    <button id="btn-restart">Restart</button>
    <button id="btn-next">Next Level</button>
  </div>
</div>

<div id="message" class="hidden">
  <h1 id="msg-title">ORBIT</h1>
  <p id="msg-sub">Click and drag to launch your satellite</p>
</div>

<div id="power-bar"><div id="power-fill"></div></div>
<div class="hint" id="hint">Click + drag from anywhere to launch</div>
<div id="level-indicator"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Game State ---
const G = 800;
const PLANET_RADIUS = 40;
const TRAIL_LENGTH = 120;
const MIN_ORBIT_SPEED = 8; // seconds to count as "orbiting"

let state = {
  mode: 'idle', // idle, aiming, flying, crashed, orbiting, escaped
  score: 0,
  level: 1,
  orbitTime: 0,
  satellite: null,
  trail: [],
  particles: [],
  stars: [],
  planetGlow: 0,
  bestOrbit: 0,
  totalOrbits: 0,
  dragStart: null,
  dragCurrent: null,
  cameraShake: 0,
  lastTime: 0,
};

// --- Level Definitions ---
const levels = [
  { name: "Tutorial", planetMass: 1.0, atmosphere: 0, satellites: 0, targetOrbit: 3, bonus: 100 },
  { name: "Low Orbit", planetMass: 1.2, atmosphere: 15, satellites: 0, targetOrbit: 5, bonus: 200 },
  { name: "Heavy World", planetMass: 2.0, atmosphere: 20, satellites: 0, targetOrbit: 6, bonus: 300 },
  { name: "Binary", planetMass: 1.0, atmosphere: 10, satellites: 1, targetOrbit: 4, bonus: 500 },
  { name: "Dense Giant", planetMass: 3.0, atmosphere: 40, satellites: 0, targetOrbit: 8, bonus: 600 },
  { name: "Tight Dance", planetMass: 1.5, atmosphere: 5, satellites: 1, targetOrbit: 5, bonus: 800 },
  { name: "The gauntlet", planetMass: 2.5, atmosphere: 25, satellites: 2, targetOrbit: 10, bonus: 1000 },
];

// --- Stars Background ---
function initStars() {
  state.stars = [];
  for (let i = 0; i < 300; i++) {
    state.stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.3,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 2 + 1,
    });
  }
}
initStars();

// --- Reset ---
function resetLevel(lvl) {
  const level = levels[Math.min(lvl - 1, levels.length - 1)];
  state.mode = 'idle';
  state.satellite = null;
  state.trail = [];
  state.particles = [];
  state.orbitTime = 0;
  state.dragStart = null;
  state.dragCurrent = null;
  state.cameraShake = 0;
  state.levelData = level;

  document.getElementById('level').textContent = lvl;
  document.getElementById('level-indicator').textContent = level.name;
  const li = document.getElementById('level-indicator');
  li.classList.add('show');
  setTimeout(() => li.classList.remove('show'), 2000);
}

function resetGame() {
  state.score = 0;
  state.level = 1;
  state.bestOrbit = 0;
  state.totalOrbits = 0;
  resetLevel(1);
  showMessage('ORBIT', 'Click and drag to launch your satellite');
  setTimeout(() => hideMessage(), 3000);
}

// --- Message ---
function showMessage(title, sub) {
  document.getElementById('msg-title').textContent = title;
  document.getElementById('msg-sub').textContent = sub;
  document.getElementById('message').classList.remove('hidden');
}
function hideMessage() {
  document.getElementById('message').classList.add('hidden');
}

// --- Input ---
function getMousePos(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
}

function onPointerDown(e) {
  if (state.mode === 'flying' || state.mode === 'orbiting') return;
  e.preventDefault();
  const pos = getMousePos(e);
  state.dragStart = pos;
  state.dragCurrent = pos;
  state.mode = 'aiming';
  document.getElementById('hint').style.opacity = '0';
  document.getElementById('power-bar').classList.add('visible');
}

function onPointerMove(e) {
  if (state.mode !== 'aiming') return;
  e.preventDefault();
  state.dragCurrent = getMousePos(e);
}

function onPointerUp(e) {
  if (state.mode !== 'aiming') return;
  e.preventDefault();

  const dx = state.dragStart.x - state.dragCurrent.x;
  const dy = state.dragStart.y - state.dragCurrent.y;
  const power = Math.min(Math.sqrt(dx*dx + dy*dy), 200);
  const angle = Math.atan2(dy, dx);

  if (power < 10) {
    state.mode = 'idle';
    document.getElementById('power-bar').classList.remove('visible');
    return;
  }

  const speed = power * 3.5;
  state.satellite = {
    x: state.dragStart.x,
    y: state.dragStart.y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    alive: true,
  };
  state.trail = [];
  state.orbitTime = 0;
  state.mode = 'flying';
  state.planetGlow = 1;
  document.getElementById('power-bar').classList.remove('visible');

  // Launch particles
  for (let i = 0; i < 20; i++) {
    const a = angle + (Math.random() - 0.5) * 0.8;
    const s = Math.random() * 3 + 1;
    state.particles.push({
      x: state.dragStart.x, y: state.dragStart.y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 1, decay: Math.random() * 0.03 + 0.02,
      r: Math.random() * 2 + 1,
      color: `hsl(${180 + Math.random() * 40}, 100%, 70%)`,
    });
  }
}

canvas.addEventListener('mousedown', onPointerDown);
canvas.addEventListener('mousemove', onPointerMove);
canvas.addEventListener('mouseup', onPointerUp);
canvas.addEventListener('touchstart', onPointerDown, { passive: false });
canvas.addEventListener('touchmove', onPointerMove, { passive: false });
canvas.addEventListener('touchend', onPointerUp, { passive: false });

document.getElementById('btn-restart').addEventListener('click', () => {
  resetLevel(state.level);
  hideMessage();
  showMessage(state.levelData.name, 'Drag to launch again');
  setTimeout(() => hideMessage(), 2000);
});

document.getElementById('btn-next').addEventListener('click', () => {
  state.level++;
  resetLevel(state.level);
  hideMessage();
  showMessage(state.levelData.name, 'New challenge — adapt your launch');
  setTimeout(() => hideMessage(), 2000);
});

// --- Physics ---
function update(dt) {
  // Clamp dt
  dt = Math.min(dt, 0.05);

  // Update particles
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) state.particles.splice(i, 1);
  }

  // Update stars
  for (const s of state.stars) {
    s.twinkle += s.speed * dt;
  }

  // Planet glow decay
  if (state.planetGlow > 0) state.planetGlow = Math.max(0, state.planetGlow - dt * 0.5);

  // Camera shake decay
  if (state.cameraShake > 0) state.cameraShake = Math.max(0, state.cameraShake - dt * 10);

  if (state.mode === 'flying' || state.mode === 'orbiting') {
    const sat = state.satellite;
    if (!sat.alive) return;

    const cx = W / 2, cy = H / 2;
    const dx = cx - sat.x;
    const dy = cy - sat.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // Gravity
    const force = (G * state.levelData.planetMass) / (dist * dist);
    sat.vx += (dx / dist) * force * dt;
    sat.vy += (dy / dist) * force * dt;

    // Atmosphere drag
    const level = state.levelData;
    if (dist < PLANET_RADIUS + level.atmosphere) {
      const dragFactor = 1 - (dist - PLANET_RADIUS) / level.atmosphere;
      const drag = Math.max(0, dragFactor) * 2.0;
      sat.vx *= (1 - drag * dt);
      sat.vy *= (1 - drag * dt);
    }

    sat.x += sat.vx * dt;
    sat.y += sat.vy * dt;

    // Trail
    state.trail.push({ x: sat.x, y: sat.y, life: 1 });
    if (state.trail.length > TRAIL_LENGTH) state.trail.shift();

    // Check crash
    if (dist < PLANET_RADIUS) {
      sat.alive = false;
      state.mode = 'crashed';
      state.cameraShake = 15;
      state.planetGlow = 2;

      // Crash particles
      for (let i = 0; i < 40; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * 5 + 2;
        state.particles.push({
          x: sat.x, y: sat.y,
          vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          life: 1, decay: Math.random() * 0.02 + 0.01,
          r: Math.random() * 3 + 1,
          color: `hsl(${15 + Math.random() * 30}, 100%, ${50 + Math.random() * 30}%)`,
        });
      }

      setTimeout(() => {
        showMessage('CRASHED', `Score: ${state.score} — Drag to retry`);
        state.mode = 'idle';
      }, 1000);
      return;
    }

    // Check escape
    if (dist > Math.max(W, H)) {
      sat.alive = false;
      state.mode = 'escaped';
      showMessage('ESCAPED', 'Your satellite drifted away...');
      return;
    }

    // Orbit detection
    const speed = Math.sqrt(sat.vx * sat.vx + sat.vy * sat.vy);
    const circularSpeed = Math.sqrt(G * state.levelData.planetMass / dist);
    const speedRatio = speed / circularSpeed;

    if (state.mode === 'flying' && speedRatio > 0.6 && speedRatio < 1.8 && dist > PLANET_RADIUS + 20) {
      state.mode = 'orbiting';
      showMessage('ORBIT STABLE', 'Maintaining trajectory...');
      setTimeout(() => hideMessage(), 1500);
    }

    if (state.mode === 'orbiting') {
      state.orbitTime += dt;
      state.score += Math.floor(dt * 10);

      // Bonus for reaching target
      if (state.orbitTime >= state.levelData.targetOrbit && !state.levelData.completed) {
        state.levelData.completed = true;
        const bonus = state.levelData.bonus;
        state.score += bonus;
        state.totalOrbits++;

        // Celebration particles
        for (let i = 0; i < 60; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = Math.random() * 4 + 1;
          const hue = Math.random() * 360;
          state.particles.push({
            x: cx, y: cy,
            vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            life: 1, decay: Math.random() * 0.015 + 0.005,
            r: Math.random() * 3 + 1,
            color: `hsl(${hue}, 100%, 65%)`,
          });
        }

        showMessage('STABLE ORBIT!', `+${bonus} bonus — Next level?`);
        state.mode = 'idle';
      }
    }

    // Update HUD
    document.getElementById('score').textContent = state.score;
    document.getElementById('time').textContent = state.orbitTime.toFixed(1) + 's';
    document.getElementById('alt').textContent = Math.floor(dist - PLANET_RADIUS) + 'px';
    if (state.orbitTime > state.bestOrbit) {
      state.bestOrbit = state.orbitTime;
    }
  }
}

// --- Render ---
function render() {
  ctx.save();

  // Camera shake
  let shakeX = 0, shakeY = 0;
  if (state.cameraShake > 0) {
    shakeX = (Math.random() - 0.5) * state.cameraShake;
    shakeY = (Math.random() - 0.5) * state.cameraShake;
  }
  ctx.translate(shakeX, shakeY);

  // Background
  ctx.fillStyle = '#000';
  ctx.fillRect(-10, -10, W + 20, H + 20);

  // Stars
  for (const s of state.stars) {
    const alpha = 0.3 + Math.sin(s.twinkle) * 0.3;
    ctx.fillStyle = `rgba(200, 220, 255, ${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  const cx = W / 2, cy = H / 2;

  // Planet glow
  if (state.planetGlow > 0 || state.mode === 'orbiting') {
    const glowR = PLANET_RADIUS * (3 + state.planetGlow * 2);
    const glow = ctx.createRadialGradient(cx, cy, PLANET_RADIUS * 0.8, cx, cy, glowR);
    glow.addColorStop(0, `rgba(0, 255, 255, ${0.15 + state.planetGlow * 0.1})`);
    glow.addColorStop(1, 'rgba(0, 255, 255, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
    ctx.fill();
  }

  // Atmosphere ring
  const level = state.levelData;
  if (level && level.atmosphere > 0) {
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.08)';
    ctx.lineWidth = level.atmosphere;
    ctx.beginPath();
    ctx.arc(cx, cy, PLANET_RADIUS + level.atmosphere / 2, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Trail
  if (state.trail.length > 1) {
    for (let i = 1; i < state.trail.length; i++) {
      const t = i / state.trail.length;
      const p = state.trail[i];
      const pp = state.trail[i - 1];
      ctx.strokeStyle = `rgba(0, 255, 255, ${t * 0.7})`;
      ctx.lineWidth = t * 2;
      ctx.beginPath();
      ctx.moveTo(pp.x, pp.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
  }

  // Planet
  const planetGrad = ctx.createRadialGradient(cx - 10, cy - 10, 2, cx, cy, PLANET_RADIUS);
  planetGrad.addColorStop(0, '#4af');
  planetGrad.addColorStop(0.5, '#28c');
  planetGrad.addColorStop(1, '#147');
  ctx.fillStyle = planetGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, PLANET_RADIUS, 0, Math.PI * 2);
  ctx.fill();

  // Planet detail — rings/shading
  ctx.strokeStyle = 'rgba(100, 200, 255, 0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, PLANET_RADIUS * 0.7, 0, Math.PI * 2);
  ctx.stroke();

  // Planet highlight
  ctx.fillStyle = 'rgba(150, 220, 255, 0.3)';
  ctx.beginPath();
  ctx.arc(cx - 12, cy - 12, PLANET_RADIUS * 0.35, 0, Math.PI * 2);
  ctx.fill();

  // Satellite
  if (state.satellite && state.satellite.alive) {
    const sat = state.satellite;

    // Glow
    const satGlow = ctx.createRadialGradient(sat.x, sat.y, 0, sat.x, sat.y, 15);
    satGlow.addColorStop(0, 'rgba(0, 255, 255, 0.4)');
    satGlow.addColorStop(1, 'rgba(0, 255, 255, 0)');
    ctx.fillStyle = satGlow;
    ctx.beginPath();
    ctx.arc(sat.x, sat.y, 15, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = '#0ff';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(sat.x, sat.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Velocity arrow (subtle)
    const arrowScale = 3;
    const ax = sat.x + sat.vx * arrowScale * 0.3;
    const ay = sat.y + sat.vy * arrowScale * 0.3;
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sat.x, sat.y);
    ctx.lineTo(ax, ay);
    ctx.stroke();
  }

  // Particles
  for (const p of state.particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Aiming line
  if (state.mode === 'aiming' && state.dragStart && state.dragCurrent) {
    const dx = state.dragStart.x - state.dragCurrent.x;
    const dy = state.dragStart.y - state.dragCurrent.y;
    const power = Math.min(Math.sqrt(dx * dx + dy * dy), 200);
    const angle = Math.atan2(dy, dx);

    // Launch direction line
    ctx.strokeStyle = `rgba(0, 255, 255, 0.6)`;
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 4]);
    ctx.beginPath();
    ctx.moveTo(state.dragStart.x, state.dragStart.y);
    ctx.lineTo(state.dragStart.x + Math.cos(angle) * power * 2, state.dragStart.y + Math.sin(angle) * power * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Launch dot
    ctx.fillStyle = '#0ff';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(state.dragStart.x, state.dragStart.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Velocity dot at drag end
    ctx.fillStyle = 'rgba(255, 0, 255, 0.6)';
    ctx.beginPath();
    ctx.arc(state.dragCurrent.x, state.dragCurrent.y, 3, 0, Math.PI * 2);
    ctx.fill();

    // Power bar update
    const powerPct = (power / 200) * 100;
    document.getElementById('power-fill').style.width = powerPct + '%';
  }

  // Dotted orbit prediction circle (when aiming)
  if (state.mode === 'aiming' && state.dragStart) {
    const dx = state.dragStart.x - state.dragCurrent.x;
    const dy = state.dragStart.y - state.dragCurrent.y;
    const power = Math.min(Math.sqrt(dx * dx + dy * dy), 200);
    const angle = Math.atan2(dy, dx);
    const speed = power * 3.5;

    // Approximate circular orbit radius for this speed
    const v2 = speed * speed;
    const mu = G * state.levelData.planetMass;
    if (v2 > 0 && v2 !== mu / PLANET_RADIUS) {
      // r = mu / v^2 for circular orbit at this speed
      const orbitR = mu / (v2);
      if (orbitR > PLANET_RADIUS && orbitR < 600) {
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.06)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 8]);
        ctx.beginPath();
        ctx.arc(cx, cy, orbitR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }

  ctx.restore();
}

// --- Loop ---
function loop(timestamp) {
  if (!state.lastTime) state.lastTime = timestamp;
  let dt = (timestamp - state.lastTime) / 1000;
  if (dt <= 0) dt = 0.016;
  state.lastTime = timestamp;

  update(dt);
  render();
  requestAnimationFrame(loop);
}

// --- Init ---
resetGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
