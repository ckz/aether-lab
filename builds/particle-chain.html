<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Chain Reaction</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a14;
    font-family: 'Courier New', monospace;
    color: #ccc;
    overflow: hidden;
    height: 100vh;
    cursor: crosshair;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }
  #ui > * { pointer-events: auto; }
  .panel {
    background: rgba(10, 10, 20, 0.85);
    border: 1px solid rgba(100, 100, 180, 0.3);
    border-radius: 6px;
    padding: 14px 20px;
    backdrop-filter: blur(8px);
  }
  #title { font-size: 1.1rem; letter-spacing: .25em; color: #c8c8ff; margin-bottom: 4px; }
  #subtitle { font-size: .65rem; opacity: .4; letter-spacing: .15em; }
  #stats { text-align: right; font-size: .75rem; letter-spacing: .1em; line-height: 1.8; }
  #stats span { color: #9988dd; }
  #controls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 10;
  }
  .btn {
    background: rgba(20, 18, 40, 0.85);
    border: 1px solid rgba(100, 90, 180, 0.35);
    color: #aaa;
    padding: 8px 18px;
    border-radius: 4px;
    font-family: inherit;
    font-size: .7rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .2s;
    backdrop-filter: blur(8px);
  }
  .btn:hover {
    border-color: rgba(150, 130, 255, 0.7);
    color: #d8d8ff;
    background: rgba(30, 25, 65, 0.85);
    box-shadow: 0 0 20px rgba(80, 60, 180, 0.2);
  }
  #message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    transition: opacity .4s;
  }
  #message.show { opacity: 1; pointer-events: auto; }
  #message .big {
    font-size: 2.5rem;
    letter-spacing: .3em;
    color: #fff;
    text-shadow: 0 0 40px rgba(150, 130, 255, 0.8);
    margin-bottom: 12px;
  }
  #message .small {
    font-size: .8rem;
    opacity: .6;
    letter-spacing: .2em;
    margin-bottom: 24px;
  }
  #start-overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 10, 20, 0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 30;
    backdrop-filter: blur(4px);
  }
  #start-overlay h1 {
    font-size: 2.2rem;
    letter-spacing: .35em;
    color: #c8c8ff;
    margin-bottom: 8px;
    text-shadow: 0 0 40px rgba(150, 130, 255, 0.5);
  }
  #start-overlay p {
    font-size: .8rem;
    opacity: .5;
    letter-spacing: .15em;
    margin-bottom: 40px;
    max-width: 420px;
    text-align: center;
    line-height: 1.7;
  }
  #start-btn {
    background: rgba(30, 25, 65, 0.8);
    border: 1px solid rgba(150, 130, 255, 0.5);
    color: #c8c8ff;
    padding: 14px 40px;
    border-radius: 4px;
    font-family: inherit;
    font-size: .85rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .3s;
  }
  #start-btn:hover {
    background: rgba(50, 40, 100, 0.8);
    box-shadow: 0 0 40px rgba(100, 80, 200, 0.3);
    transform: scale(1.04);
  }
  .keys {
    margin-top: 30px;
    font-size: .65rem;
    opacity: .35;
    letter-spacing: .1em;
    line-height: 2;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="ui">
  <div class="panel">
    <div id="title">CHAIN REACTION</div>
    <div id="subtitle">click to trigger</div>
  </div>
  <div class="panel" id="stats">
    Level <span id="level">1</span><br>
    Particles <span id="particles">0</span><br>
    Exploded <span id="exploded">0</span> / <span id="total">0</span><br>
    Score <span id="score">0</span>
  </div>
</div>

<div id="message">
  <div class="big" id="msg-title"></div>
  <div class="small" id="msg-sub"></div>
  <button class="btn" id="next-btn" onclick="startLevel()">Next Level →</button>
</div>

<div id="start-overlay">
  <h1>CHAIN REACTION</h1>
  <p>Click to place an expanding explosion. Trigger chain reactions across floating particles. Get enough of them to explode to advance.</p>
  <button id="start-btn" onclick="beginGame()">BEGIN</button>
  <div class="keys">1-4 switch palettes · Space pause</div>
</div>

<div id="controls">
  <button class="btn" onclick="setPalette(0)">Aurora</button>
  <button class="btn" onclick="setPalette(1)">Ember</button>
  <button class="btn" onclick="setPalette(2)">Frost</button>
  <button class="btn" onclick="setPalette(3)">Neon</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const PALETTES = [
  { name: 'Aurora', bg: '#0a0a14', particles: ['#00ffa3', '#00d4ff', '#7b2fff', '#ff2d95', '#00ffa3'], glow: 'rgba(0,255,163,', explosion: '#00ffa3' },
  { name: 'Ember', bg: '#140a08', particles: ['#ff6a00', '#ffaa00', '#ff2200', '#ffdd44', '#ff6a00'], glow: 'rgba(255,106,0,', explosion: '#ffaa00' },
  { name: 'Frost', bg: '#080e14', particles: ['#88ddff', '#ffffff', '#44aaff', '#aaddff', '#88ddff'], glow: 'rgba(136,221,255,', explosion: '#ffffff' },
  { name: 'Neon', bg: '#0a0a14', particles: ['#ff00ff', '#00ffff', '#ffff00', '#ff0080', '#80ff00'], glow: 'rgba(255,0,255,', explosion: '#ff00ff' },
];

let palette = 0;
let particles = [];
let explosions = [];
let level = 1;
let score = 0;
let totalExploded = 0;
let state = 'waiting'; // waiting | playing | exploding | paused | levelend
let animId;
let paused = false;

const LEVELS = [
  { count: 15, target: 0.40, speed: 1.2, size: 3.5 },
  { count: 22, target: 0.45, speed: 1.5, size: 3.2 },
  { count: 30, target: 0.45, speed: 1.8, size: 3.0 },
  { count: 40, target: 0.50, speed: 2.0, size: 2.8 },
  { count: 52, target: 0.50, speed: 2.3, size: 2.5 },
  { count: 65, target: 0.50, speed: 2.5, size: 2.4 },
  { count: 80, target: 0.55, speed: 2.8, size: 2.2 },
  { count: 100, target: 0.55, speed: 3.0, size: 2.0 },
  { count: 120, target: 0.55, speed: 3.3, size: 1.9 },
  { count: 140, target: 0.60, speed: 3.5, size: 1.8 },
  { count: 160, target: 0.60, speed: 3.8, size: 1.7 },
  { count: 185, target: 0.60, speed: 4.0, size: 1.6 },
  { count: 210, target: 0.65, speed: 4.2, size: 1.5 },
  { count: 240, target: 0.65, speed: 4.5, size: 1.4 },
  { count: 275, target: 0.65, speed: 4.8, size: 1.3 },
];

function rand(a, b) { return Math.random() * (b - a) + a; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function createParticle() {
  const lvl = LEVELS[Math.min(level - 1, LEVELS.length - 1)];
  const colors = PALETTES[palette].particles;
  return {
    x: rand(40, W - 40),
    y: rand(40, H - 40),
    vx: rand(-lvl.speed, lvl.speed),
    vy: rand(-lvl.speed, lvl.speed),
    r: lvl.size + rand(-0.5, 0.5),
    color: colors[Math.floor(rand(0, colors.length))],
    alive: true,
    exploding: false,
    explosionR: 0,
    maxExplosionR: rand(55, 80),
    alpha: 1,
    fadeTimer: 0,
  };
}

function initLevel() {
  const lvl = LEVELS[Math.min(level - 1, LEVELS.length - 1)];
  particles = [];
  explosions = [];
  for (let i = 0; i < lvl.count; i++) particles.push(createParticle());
  state = 'waiting';
  updateStats();
}

function updateStats() {
  document.getElementById('level').textContent = level;
  const alive = particles.filter(p => p.alive).length;
  document.getElementById('particles').textContent = alive;
  document.getElementById('total').textContent = particles.length;
  document.getElementById('exploded').textContent = totalExploded;
  document.getElementById('score').textContent = score;
}

function showMessage(title, sub) {
  document.getElementById('msg-title').textContent = title;
  document.getElementById('msg-sub').textContent = sub;
  document.getElementById('message').classList.add('show');
}

function hideMessage() {
  document.getElementById('message').classList.remove('show');
}

function triggerExplosion(p) {
  p.exploding = true;
  p.explosionR = 0;
  p.vx = 0;
  p.vy = 0;
}

function startLevel() {
  hideMessage();
  initLevel();
}

function beginGame() {
  document.getElementById('start-overlay').style.display = 'none';
  level = 1;
  score = 0;
  totalExploded = 0;
  startLevel();
  loop();
}

canvas.addEventListener('click', (e) => {
  if (state === 'waiting') {
    state = 'playing';
  }
  if (state !== 'playing') return;

  const mx = e.clientX;
  const my = e.clientY;
  // find nearest particle to trigger
  let nearest = null;
  let nearDist = Infinity;
  for (const p of particles) {
    if (!p.alive || p.exploding) continue;
    const d = dist({ x: mx, y: my }, p);
    if (d < nearDist) { nearDist = d; nearest = p; }
  }
  if (nearest && nearDist < 120) {
    triggerExplosion(nearest);
    // spawn a visual burst
    explosions.push({
      x: nearest.x, y: nearest.y,
      r: 0, maxR: nearest.maxExplosionR,
      alpha: 1,
      color: PALETTES[palette].explosion,
    });
  }
});

canvas.addEventListener('mousemove', (e) => {
  // subtle cursor glow
  cursorX = e.clientX;
  cursorY = e.clientY;
});

let cursorX = -100, cursorY = -100;
let mouseOnCanvas = false;
canvas.addEventListener('mouseenter', () => mouseOnCanvas = true);
canvas.addEventListener('mouseleave', () => mouseOnCanvas = false);

document.addEventListener('keydown', (e) => {
  if (e.key === ' ') {
    e.preventDefault();
    if (state === 'playing' || state === 'paused') {
      paused = !paused;
      state = paused ? 'paused' : 'playing';
    }
  }
  if (e.key >= '1' && e.key <= '4') setPalette(parseInt(e.key) - 1);
});

function setPalette(i) {
  palette = ((i % PALETTES.length) + PALETTES.length) % PALETTES.length;
}

function loop() {
  animId = requestAnimationFrame(loop);
  if (state === 'paused') return;

  const pal = PALETTES[palette];
  ctx.fillStyle = pal.bg;
  ctx.fillRect(0, 0, W, H);

  // update particles
  let activeExplosions = 0;
  for (const p of particles) {
    if (!p.alive) continue;
    if (p.exploding) {
      p.explosionR += 4.5;
      activeExplosions++;
      // check collision with other alive particles
      for (const q of particles) {
        if (q === p || !q.alive || q.exploding) continue;
        if (dist(p, q) < p.explosionR + q.r) {
          triggerExplosion(q);
          totalExploded++;
          explosions.push({
            x: q.x, y: q.y,
            r: 0, maxR: q.maxExplosionR,
            alpha: 1,
            color: pal.explosion,
          });
        }
      }
      if (p.explosionR > p.maxExplosionR) {
        p.alive = false;
        p.alpha = 0;
      }
      // draw explosion ring
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.explosionR, 0, Math.PI * 2);
      ctx.strokeStyle = pal.explosion;
      ctx.globalAlpha = Math.max(0, 1 - p.explosionR / p.maxExplosionR) * 0.6;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      // drift
      p.x += p.vx;
      p.y += p.vy;
      // wrap
      if (p.x < -20) p.x = W + 20;
      if (p.x > W + 20) p.x = -20;
      if (p.y < -20) p.y = H + 20;
      if (p.y > H + 20) p.y = -20;
    }
  }

  // update visual explosion rings
  for (let i = explosions.length - 1; i >= 0; i--) {
    const ex = explosions[i];
    ex.r += 3;
    ex.alpha *= 0.96;
    if (ex.alpha < 0.01) explosions.splice(i, 1);
  }

  // draw particles
  for (const p of particles) {
    if (!p.alive) continue;
    const a = p.exploding ? Math.max(0, 1 - p.explosionR / p.maxExplosionR) : 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = a * 0.9;
    ctx.fill();
    // glow
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
    grad.addColorStop(0, pal.glow + (a * 0.4) + ')');
    grad.addColorStop(1, pal.glow + '0)');
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.globalAlpha = a;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // draw explosion rings
  for (const ex of explosions) {
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2);
    ctx.strokeStyle = ex.color;
    ctx.globalAlpha = ex.alpha * 0.5;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // cursor glow
  if (mouseOnCanvas) {
    const cg = ctx.createRadialGradient(cursorX, cursorY, 0, cursorX, cursorY, 60);
    cg.addColorStop(0, pal.glow + '0.15)');
    cg.addColorStop(1, pal.glow + '0)');
    ctx.beginPath();
    ctx.arc(cursorX, cursorY, 60, 0, Math.PI * 2);
    ctx.fillStyle = cg;
    ctx.fill();
  }

  // check level end
  if (state === 'playing' && activeExplosions === 0) {
    const alive = particles.filter(p => p.alive).length;
    const exploded = particles.length - alive;
    const pct = exploded / particles.length;
    const lvl = LEVELS[Math.min(level - 1, LEVELS.length - 1)];
    if (pct >= lvl.target) {
      state = 'levelend';
      const bonus = Math.round((pct - lvl.target) * 500);
      score += 100 + bonus;
      totalExploded += exploded;
      let title = 'CHAIN REACTION!';
      let sub = `${Math.round(pct * 100)}% exploded — +${100 + bonus} pts`;
      if (pct > 0.85) { title = 'PERFECT CHAIN!'; sub = `${Math.round(pct * 100)}% — Masterful! +${100 + bonus} pts`; }
      else if (pct > 0.7) { title = 'EXCELLENT!'; sub = `${Math.round(pct * 100)}% — Beautiful cascades. +${100 + bonus} pts`; }
      showMessage(title, sub);
      if (level >= LEVELS.length) {
        document.getElementById('next-btn').textContent = 'You Win!';
      }
    } else {
      state = 'levelend';
      showMessage('NOT ENOUGH', `${Math.round(pct * 100)}% — need ${Math.round(lvl.target * 100)}%. Click to retry.`);
      document.getElementById('next-btn').textContent = 'Retry';
    }
  }
  updateStats();
}

if (animId) cancelAnimationFrame(animId);
</script>
</body>
</html>
