<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Cosmos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #aaf;
    cursor: crosshair;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    background: rgba(10, 10, 30, 0.85);
    border: 1px solid #335;
    border-radius: 8px;
    padding: 16px 20px;
    backdrop-filter: blur(8px);
    max-width: 280px;
  }
  #ui h1 {
    font-size: 16px;
    margin-bottom: 8px;
    color: #7df;
    letter-spacing: 2px;
  }
  #ui p { font-size: 11px; color: #8899bb; line-height: 1.6; margin-bottom: 6px; }
  #ui .stat { color: #cd9; font-size: 12px; }
  #ui .key { color: #f8a; font-weight: bold; }
  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 10px;
    background: rgba(10, 10, 30, 0.85);
    border: 1px solid #335;
    border-radius: 8px;
    padding: 10px 16px;
    backdrop-filter: blur(8px);
  }
  #controls button {
    background: #1a1a3a;
    border: 1px solid #446;
    color: #aaf;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    transition: all 0.2s;
  }
  #controls button:hover { background: #2a2a5a; border-color: #7df; color: #fff; }
  #controls button.active { background: #3a2a5a; border-color: #f8a; color: #fff; }
  #modeLabel {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    background: rgba(10, 10, 30, 0.85);
    border: 1px solid #335;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 12px;
    color: #cd9;
    backdrop-filter: blur(8px);
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="ui">
  <h1>✦ PARTICLE COSMOS ✦</h1>
  <p><span class="key">Click</span> — spawn particles</p>
  <p><span class="key">Hold</span> — continuous stream</p>
  <p><span class="key">Space</span> — gravity burst</p>
  <p><span class="key">C</span> — clear all</p>
  <p><span class="key">G</span> — toggle gravity</p>
  <p><span class="key">1-4</span> — switch mode</p>
  <p class="stat" id="count">Particles: 0</p>
</div>

<div id="modeLabel" id="modeLabel">Mode: Nebula</div>

<div id="controls">
  <button class="active" data-mode="0">Nebula</button>
  <button data-mode="1">Fireflies</button>
  <button data-mode="2">Vortex</button>
  <button data-mode="3">Rain</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const modeLabel = document.getElementById('modeLabel');
const countDisplay = document.getElementById('count');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const MODES = ['Nebula', 'Fireflies', 'Vortex', 'Rain'];
let mode = 0;
let gravityOn = true;
let mouse = { x: W/2, y: H/2, down: false };
let particles = [];
const MAX = 3000;

// Color palettes per mode
const palettes = [
  ['#ff6b9d', '#c44dff', '#4dc9f6', '#ff6b9d', '#f9ca24'], // nebula
  ['#f9ca24', '#fffa65', '#c4e538', '#ffdd59', '#fff'],     // fireflies
  ['#4dc9f6', '#7df9ff', '#c44dff', '#ff6b9d', '#fff'],     // vortex
  ['#7df9ff', '#c4e538', '#4dc9f6', '#fff', '#fffa65']      // rain
];

class Particle {
  constructor(x, y, m) {
    this.x = x;
    this.y = y;
    this.mode = m;
    const palette = palettes[m];
    this.color = palette[Math.floor(Math.random() * palette.length)];
    this.life = 1;
    this.decay = 0.001 + Math.random() * 0.004;

    if (m === 0) { // nebula
      this.vx = (Math.random() - 0.5) * 3;
      this.vy = (Math.random() - 0.5) * 3;
      this.size = 2 + Math.random() * 4;
    } else if (m === 1) { // fireflies
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.size = 2 + Math.random() * 3;
      this.decay = 0.002 + Math.random() * 0.003;
      this.wobble = Math.random() * Math.PI * 2;
    } else if (m === 2) { // vortex
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 4;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.size = 1.5 + Math.random() * 3;
      this.decay = 0.003 + Math.random() * 0.004;
    } else { // rain
      this.vx = (Math.random() - 0.5) * 0.5;
      this.vy = 3 + Math.random() * 8;
      this.size = 1 + Math.random() * 2;
      this.decay = 0.005 + Math.random() * 0.01;
    }
  }

  update() {
    if (this.mode === 1) { // fireflies wobble
      this.wobble += 0.03;
      this.vx += Math.sin(this.wobble) * 0.05;
      this.vy += Math.cos(this.wobble) * 0.05;
    }

    if (gravityOn) {
      if (this.mode === 0 || this.mode === 2) {
        // gravity towards mouse when down, otherwise slight downward
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        const force = mouse.down ? 0.15 : 0.02;
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      } else if (this.mode === 3) {
        this.vy += 0.05; // rain accelerates
      }
    }

    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;

    // friction
    this.vx *= 0.99;
    this.vy *= 0.99;
  }

  draw(ctx) {
    const alpha = Math.max(0, this.life);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();

    // glow
    if (this.size > 2) {
      ctx.globalAlpha = alpha * 0.3;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function spawn(x, y, count = 5) {
  for (let i = 0; i < count; i++) {
    if (particles.length < MAX) {
      particles.push(new Particle(x, y, mode));
    }
  }
}

function gravityBurst() {
  const cx = W / 2, cy = H / 2;
  for (let i = 0; i < 200; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 50 + Math.random() * 200;
    const x = cx + Math.cos(angle) * dist;
    const y = cy + Math.sin(angle) * dist;
    const p = new Particle(x, y, mode);
    const dx = cx - x, dy = cy - y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    const speed = 3 + Math.random() * 5;
    p.vx = (dx / d) * speed;
    p.vy = (dy / d) * speed;
    p.size = 2 + Math.random() * 5;
    particles.push(p);
  }
}

// Input
canvas.addEventListener('mousedown', (e) => {
  mouse.down = true;
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  spawn(mouse.x, mouse.y, 20);
});
canvas.addEventListener('mouseup', () => mouse.down = false);
canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  if (mouse.down) spawn(mouse.x, mouse.y, 3);
});
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  mouse.down = true;
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  spawn(mouse.x, mouse.y, 20);
});
canvas.addEventListener('touchend', () => mouse.down = false);
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  if (mouse.down) spawn(mouse.x, mouse.y, 3);
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); gravityBurst(); }
  if (e.code === 'KeyC') particles = [];
  if (e.code === 'KeyG') { gravityOn = !gravityOn; }
  if (e.code >= 'Digit1' && e.code <= 'Digit4') {
    mode = parseInt(e.code.slice(-1)) - 1;
    updateModeUI();
  }
});

// Buttons
document.querySelectorAll('#controls button').forEach(btn => {
  btn.addEventListener('click', () => {
    mode = parseInt(btn.dataset.mode);
    updateModeUI();
  });
});

function updateModeUI() {
  document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
  modeLabel.textContent = 'Mode: ' + MODES[mode];
}

// Trail effect
function drawBackground() {
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);
}

// Vortex center attraction
function vortexEffect() {
  if (mode !== 2) return;
  const cx = W / 2, cy = H / 2;
  for (let p of particles) {
    const dx = cx - p.x, dy = cy - p.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    if (dist < 300) {
      const tangentX = -dy / dist;
      const tangentY = dx / dist;
      p.vx += tangentX * 0.08;
      p.vy += tangentY * 0.08;
      // pull inward slightly
      p.vx += (dx / dist) * 0.02;
      p.vy += (dy / dist) * 0.02;
    }
  }
}

// Main loop
function animate() {
  drawBackground();

  if (mouse.down && mode !== 3) {
    spawn(mouse.x, mouse.y, 2);
  }
  if (mode === 3 && Math.random() < 0.3) {
    spawn(Math.random() * W, -10, 1);
  }

  vortexEffect();

  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0 || particles[i].x < -50 || particles[i].x > W+50 || particles[i].y < -50 || particles[i].y > H+50) {
      particles.splice(i, 1);
    }
  }

  countDisplay.textContent = 'Particles: ' + particles.length;
  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
