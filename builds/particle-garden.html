<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Garden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #aaa;
    cursor: crosshair;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    background: rgba(10, 10, 18, 0.85);
    padding: 15px 20px;
    border-radius: 12px;
    border: 1px solid rgba(100, 200, 255, 0.2);
    backdrop-filter: blur(10px);
    max-width: 320px;
  }
  #ui h1 {
    font-size: 16px;
    margin-bottom: 8px;
    color: #7ef;
    letter-spacing: 2px;
  }
  #ui p {
    font-size: 11px;
    line-height: 1.6;
    margin-bottom: 4px;
  }
  #ui .stats {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(100, 200, 255, 0.15);
    font-size: 10px;
    color: #888;
  }
  #ui .stats span {
    color: #7ef;
    font-weight: bold;
  }
  #hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: rgba(150, 200, 255, 0.6);
    letter-spacing: 1px;
    pointer-events: none;
    transition: opacity 2s;
  }
</style>
</head>
<body>
<canvas id="garden"></canvas>
<div id="ui">
  <h1>✦ PARTICLE GARDEN ✦</h1>
  <p>Click to plant seeds. Watch them grow.</p>
  <p>Move mouse to scatter pollen.</p>
  <p>Right-click to remove a plant.</p>
  <p>Press <strong>C</strong> to clear • <strong>S</strong> to save</p>
  <div class="stats">
    Plants: <span id="plantCount">0</span> |
    Pollen: <span id="pollenCount">0</span> |
    Season: <span id="season">spring</span>
  </div>
</div>
<div id="hint">click anywhere to begin</div>
<script>
const canvas = document.getElementById('garden');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const mouse = { x: W/2, y: H/2, active: false };
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => mouse.active = false);

const PALETTES = [
  { name: 'spring',  bg: ['#0a0a12', '#1a1a2e'], plants: ['#ff6b9d', '#c44569', '#f8a5c2', '#ff9ff3'], glow: '#ff6b9d' },
  { name: 'summer',  bg: ['#0a1a0a', '#1a2e1a'], plants: ['#56ab2f', '#a8e063', '#4ecdc4', '#88d8b0'], glow: '#56ab2f' },
  { name: 'autumn',  bg: ['#1a0f0a', '#2e1a0a'], plants: ['#f39c12', '#e74c3c', '#e67e22', '#f1c40f'], glow: '#f39c12' },
  { name: 'winter',  bg: ['#0a0f1a', '#1a1a2e'], plants: ['#74b9ff', '#a29bfe', '#dfe6e9', '#81ecec'], glow: '#74b9ff' },
  { name: 'neon',    bg: ['#0a0012', '#1a002e'], plants: ['#ff00ff', '#00ffff', '#ff0080', '#80ff00'], glow: '#ff00ff' },
  { name: 'midnight',bg: ['#050510', '#0a0a1e'], plants: ['#6c5ce7', '#a29bfe', '#fd79a8', '#e17055'], glow: '#6c5ce7' }
];

let currentPalette = 0;
let palette = PALETTES[0];

const plants = [];
const pollen = [];
const particles = [];
const stars = [];

// Stars background
for (let i = 0; i < 200; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.5,
    twinkle: Math.random() * Math.PI * 2,
    speed: 0.5 + Math.random() * 2
  });
}

class Plant {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.age = 0;
    this.maxAge = 800 + Math.random() * 600;
    this.height = 0;
    this.maxHeight = 80 + Math.random() * 180;
    this.growSpeed = 0.3 + Math.random() * 0.7;
    this.branches = [];
    this.leaves = [];
    this.flowers = [];
    this.swayOffset = Math.random() * Math.PI * 2;
    this.swaySpeed = 0.5 + Math.random() * 1.5;
    this.swayAmount = 5 + Math.random() * 15;
    this.color = palette.plants[Math.floor(Math.random() * palette.plants.length)];
    this.type = Math.floor(Math.random() * 3); // 0: flower, 1: fern, 2: crystal
    this.glowPhase = Math.random() * Math.PI * 2;
    this.alive = true;
    this.decayStart = this.maxAge - 200;
    this.generateStructure();
  }

  generateStructure() {
    if (this.type === 0) this.generateFlower();
    else if (this.type === 1) this.generateFern();
    else this.generateCrystal();
  }

  generateFlower() {
    const segments = Math.floor(this.maxHeight / 15);
    for (let i = 0; i < segments; i++) {
      this.branches.push({
        ratio: i / segments,
        angle: (Math.random() - 0.5) * 0.6,
        length: 12 + Math.random() * 8,
        thickness: Math.max(1, 4 - i * 0.3)
      });
    }
    // Flowers at tips
    for (let i = 2; i < segments; i += 3 + Math.floor(Math.random() * 3)) {
      this.flowers.push({
        ratio: i / segments,
        size: 4 + Math.random() * 6,
        petals: 3 + Math.floor(Math.random() * 4),
        rotation: Math.random() * Math.PI * 2
      });
    }
    // Leaves
    for (let i = 1; i < segments; i += 2) {
      this.leaves.push({
        ratio: i / segments,
        side: Math.random() > 0.5 ? 1 : -1,
        size: 6 + Math.random() * 8,
        angle: 0.4 + Math.random() * 0.8
      });
    }
  }

  generateFern() {
    const fronds = 2 + Math.floor(Math.random() * 3);
    for (let f = 0; f < fronds; f++) {
      const segments = Math.floor(this.maxHeight / 10);
      for (let i = 0; i < segments; i++) {
        this.branches.push({
          ratio: i / segments,
          frond: f,
          angle: (f / fronds - 0.5) * 1.2 + (Math.random() - 0.5) * 0.2,
          length: 8 + Math.random() * 6,
          thickness: Math.max(1, 3 - i * 0.2),
          leafSize: 3 + Math.random() * 4
        });
      }
    }
  }

  generateCrystal() {
    const points = 4 + Math.floor(Math.random() * 5);
    for (let i = 0; i < points; i++) {
      this.branches.push({
        ratio: (i + 1) / (points + 1),
        angle: (i / points) * Math.PI * 2 + (Math.random() - 0.5) * 0.5,
        length: 15 + Math.random() * 25,
        thickness: 2 + Math.random() * 2,
        isCrystal: true
      });
    }
    // Facets
    for (let i = 0; i < points; i++) {
      this.leaves.push({
        ratio: (i + 0.5) / (points + 1),
        side: 1,
        size: 8 + Math.random() * 12,
        angle: Math.PI / 2,
        isFacet: true
      });
    }
  }

  update(time, wind) {
    this.age++;
    if (this.age > this.maxAge) this.alive = false;
    if (this.age > this.decayStart) {
      this.decay = (this.age - this.decayStart) / 200;
    }
    this.glowPhase += 0.05;
  }

  draw(ctx, time, wind) {
    const growth = Math.min(1, this.age / 150);
    const alpha = this.decay ? Math.max(0, 1 - this.decay) : 1;
    const sway = Math.sin(time * this.swaySpeed + this.swayOffset) * this.swayAmount * growth;

    ctx.save();
    ctx.translate(this.x, this.y);

    // Glow at base
    const glowAlpha = 0.3 * alpha * (0.7 + 0.3 * Math.sin(this.glowPhase));
    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 30);
    gradient.addColorStop(0, this.color + '80');
    gradient.addColorStop(1, this.color + '00');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0, Math.PI * 2);
    ctx.fill();

    // Draw stem/main structure
    ctx.strokeStyle = this.color + Math.floor(alpha * 200).toString(16).padStart(2, '0');
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);

    if (this.type === 0 || this.type === 1) {
      // Organic stem with sway
      const stemPoints = 20;
      for (let i = 1; i <= stemPoints; i++) {
        const t = i / stemPoints;
        const y = -t * this.maxHeight * growth;
        const swayX = sway * t * t;
        ctx.lineTo(swayX, y);
      }
      ctx.stroke();
    }

    // Draw branches
    this.branches.forEach(b => {
      if (b.ratio > growth) return;
      const t = b.ratio;
      let bx, by;
      if (this.type === 0 || this.type === 1) {
        const y = -t * this.maxHeight * growth;
        const swayX = sway * t * t;
        bx = swayX;
        by = y;
      } else {
        bx = 0;
        by = -t * this.maxHeight * growth;
      }

      const localSway = Math.sin(time * this.swaySpeed + this.swayOffset + t * 3) * this.swayAmount * 0.3 * growth;
      const ex = bx + Math.cos(b.angle + Math.PI/2) * b.length * growth + localSway;
      const ey = by + Math.sin(b.angle + Math.PI/2) * b.length * growth * 0.5;

      ctx.strokeStyle = this.color + Math.floor(alpha * 180).toString(16).padStart(2, '0');
      ctx.lineWidth = b.thickness;
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(ex, ey);
      ctx.stroke();

      // Crystal facets
      if (b.isCrystal && growth > 0.5) {
        ctx.fillStyle = this.color + Math.floor(alpha * 60).toString(16).padStart(2, '0');
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(ex + 5, ey - 10);
        ctx.lineTo(ex - 5, ey - 5);
        ctx.closePath();
        ctx.fill();
      }
    });

    // Draw leaves
    this.leaves.forEach(l => {
      if (l.ratio > growth) return;
      const t = l.ratio;
      let bx, by;
      if (this.type === 0 || this.type === 1) {
        const y = -t * this.maxHeight * growth;
        const swayX = sway * t * t;
        bx = swayX;
        by = y;
      } else {
        bx = 0;
        by = -t * this.maxHeight * growth;
      }

      ctx.fillStyle = this.color + Math.floor(alpha * 150).toString(16).padStart(2, '0');
      ctx.beginPath();
      if (l.isFacet) {
        // Crystal facet - diamond shape
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + l.size * 0.5, by - l.size);
        ctx.lineTo(bx, by - l.size * 1.5);
        ctx.lineTo(bx - l.size * 0.5, by - l.size);
      } else {
        // Leaf - ellipse
        ctx.ellipse(
          bx + l.side * l.size * 0.5,
          by - l.size * 0.3,
          l.size * 0.5,
          l.size * 0.25,
          l.side * l.angle,
          0, Math.PI * 2
        );
      }
      ctx.fill();
    });

    // Draw flowers
    this.flowers.forEach(f => {
      if (f.ratio > growth) return;
      const t = f.ratio;
      const y = -t * this.maxHeight * growth;
      const swayX = sway * t * t;
      const fx = swayX;
      const fy = y;

      const flowerAlpha = alpha * (0.6 + 0.4 * Math.sin(this.glowPhase + f.rotation));
      ctx.fillStyle = this.color + Math.floor(flowerAlpha * 200).toString(16).padStart(2, '0');
      ctx.strokeStyle = this.color + Math.floor(flowerAlpha * 255).toString(16).padStart(2, '0');
      ctx.lineWidth = 1;

      for (let p = 0; p < f.petals; p++) {
        const angle = (p / f.petals) * Math.PI * 2 + f.rotation;
        const px = fx + Math.cos(angle) * f.size * 0.6;
        const py = fy + Math.sin(angle) * f.size * 0.6;
        ctx.beginPath();
        ctx.arc(px, py, f.size * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // Center
      ctx.fillStyle = '#fff' + Math.floor(flowerAlpha * 200).toString(16).padStart(2, '0');
      ctx.beginPath();
      ctx.arc(fx, fy, f.size * 0.25, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.restore();
  }
}

class Pollen {
  constructor(x, y) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = -0.2 - Math.random() * 0.5;
    this.life = 1;
    this.decay = 0.001 + Math.random() * 0.003;
    this.size = 1 + Math.random() * 2;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.02 + Math.random() * 0.04;
  }

  update() {
    this.wobble += this.wobbleSpeed;
    this.x += this.vx + Math.sin(this.wobble) * 0.3;
    this.y += this.vy;
    this.life -= this.decay;

    // Mouse attraction
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 150) {
        const force = (150 - dist) / 150 * 0.02;
        this.vx += dx / dist * force;
        this.vy += dy / dist * force;
      }
    }

    // Wind
    this.vx += (Math.random() - 0.5) * 0.02;
    this.vy += (Math.random() - 0.5) * 0.01 - 0.005;

    // Damping
    this.vx *= 0.99;
    this.vy *= 0.99;
  }

  draw(ctx) {
    ctx.fillStyle = palette.plants[0] + Math.floor(this.life * 150).toString(16).padStart(2, '0');
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

class BurstParticle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1;
    this.decay = 0.01 + Math.random() * 0.02;
    this.size = 1 + Math.random() * 3;
    this.color = color || palette.plants[Math.floor(Math.random() * palette.plants.length)];
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.98;
    this.vy *= 0.98;
    this.vy += 0.02;
    this.life -= this.decay;
  }

  draw(ctx) {
    ctx.fillStyle = this.color + Math.floor(this.life * 200).toString(16).padStart(2, '0');
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Planting
canvas.addEventListener('click', e => {
  const plant = new Plant(e.clientX, e.clientY);
  plants.push(plant);

  // Burst particles on plant
  for (let i = 0; i < 15; i++) {
    particles.push(new BurstParticle(e.clientX, e.clientY, plant.color));
  }

  // Spawn pollen
  for (let i = 0; i < 8; i++) {
    pollen.push(new Pollen(e.clientX, e.clientY - 20));
  }

  // Fade hint
  const hint = document.getElementById('hint');
  if (hint && plants.length >= 2) hint.style.opacity = '0';
});

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  // Remove nearest plant
  let nearest = null;
  let nearestDist = 50;
  plants.forEach(p => {
    const dist = Math.hypot(p.x - e.clientX, p.y - e.clientY);
    if (dist < nearestDist) {
      nearestDist = dist;
      nearest = p;
    }
  });
  if (nearest) {
    // Burst on removal
    for (let i = 0; i < 20; i++) {
      particles.push(new BurstParticle(nearest.x, nearest.y - nearest.maxHeight * 0.5, nearest.color));
    }
    nearest.alive = false;
  }
});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'c' || e.key === 'C') {
    plants.length = 0;
    pollen.length = 0;
    particles.length = 0;
  }
  if (e.key === 's' || e.key === 'S') {
    const link = document.createElement('a');
    link.download = 'particle-garden.png';
    link.href = canvas.toDataURL();
    link.click();
  }
});

// Season cycling
let seasonTime = 0;
const SEASON_DURATION = 1200; // frames per season

function updateUI() {
  document.getElementById('plantCount').textContent = plants.length;
  document.getElementById('pollenCount').textContent = pollen.length;
  document.getElementById('season').textContent = palette.name;
}

function drawBackground(time) {
  // Gradient sky
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, palette.bg[0]);
  grad.addColorStop(1, palette.bg[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  stars.forEach(s => {
    s.twinkle += 0.02 * s.speed;
    const alpha = 0.3 + 0.4 * Math.sin(s.twinkle);
    ctx.fillStyle = `rgba(200, 220, 255, ${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // Ground glow
  const groundGrad = ctx.createLinearGradient(0, H - 100, 0, H);
  groundGrad.addColorStop(0, 'transparent');
  groundGrad.addColorStop(1, palette.glow + '15');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, H - 100, W, 100);
}

let time = 0;
function animate() {
  time++;
  const wind = Math.sin(time * 0.01) * 0.5 + Math.sin(time * 0.023) * 0.3;

  // Season cycling
  seasonTime++;
  if (seasonTime > SEASON_DURATION) {
    seasonTime = 0;
    currentPalette = (currentPalette + 1) % PALETTES.length;
    palette = PALETTES[currentPalette];
  }

  drawBackground(time);

  // Update and draw plants
  plants.forEach(p => p.update(time, wind));
  plants.forEach(p => p.draw(ctx, time, wind));

  // Remove dead plants
  for (let i = plants.length - 1; i >= 0; i--) {
    if (!plants[i].alive) plants.splice(i, 1);
  }

  // Spawn ambient pollen
  if (Math.random() < 0.1 && pollen.length < 100) {
    pollen.push(new Pollen());
  }

  // Update and draw pollen
  for (let i = pollen.length - 1; i >= 0; i--) {
    pollen[i].update();
    pollen[i].draw(ctx);
    if (pollen[i].life <= 0 || pollen[i].y < -50 || pollen[i].x < -50 || pollen[i].x > W + 50) {
      pollen.splice(i, 1);
    }
  }

  // Update and draw burst particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  updateUI();
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
