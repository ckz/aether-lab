<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Life</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050508;
    overflow: hidden;
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: #c8c8d0;
    user-select: none;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(8, 8, 16, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 18px 20px;
    min-width: 260px;
    z-index: 10;
    font-size: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
    color: #e8e8f0;
  }
  .subtitle {
    font-size: 10px;
    color: #666;
    margin-bottom: 14px;
    letter-spacing: 0.05em;
  }
  .stat {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .stat-label { color: #888; }
  .stat-value { color: #ccc; font-weight: 500; }
  .controls {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  button {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: #bbb;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }
  button:hover {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border-color: rgba(255,255,255,0.2);
  }
  button.active {
    background: rgba(120, 160, 255, 0.15);
    border-color: rgba(120, 160, 255, 0.4);
    color: #a0c0ff;
  }
  .slider-group {
    margin-top: 12px;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 6px 0;
  }
  .slider-row label {
    font-size: 10px;
    color: #777;
    width: 60px;
    flex-shrink: 0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .slider-row input[type="range"] {
    flex: 1;
    accent-color: #7090e0;
    height: 3px;
  }
  .slider-row .val {
    font-size: 10px;
    color: #999;
    width: 28px;
    text-align: right;
  }
  .help {
    margin-top: 12px;
    font-size: 9px;
    color: #555;
    line-height: 1.6;
    letter-spacing: 0.03em;
  }
  .help span { color: #777; }
  .species-grid {
    margin-top: 12px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  .species-dot {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: #888;
  }
  .species-dot .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  #fps {
    position: fixed;
    top: 16px;
    right: 16px;
    font-size: 10px;
    color: #444;
    z-index: 10;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="ui">
  <h1>◈ Particle Life</h1>
  <div class="subtitle">emergent systems simulation</div>

  <div class="stat">
    <span class="stat-label">Particles</span>
    <span class="stat-value" id="particleCount">0</span>
  </div>
  <div class="stat">
    <span class="stat-label">Species</span>
    <span class="stat-value" id="speciesCount">0</span>
  </div>
  <div class="stat">
    <span class="stat-label">FPS</span>
    <span class="stat-value" id="fpsDisplay">0</span>
  </div>

  <div class="species-grid" id="speciesGrid"></div>

  <div class="slider-group">
    <div class="slider-row">
      <label>Count</label>
      <input type="range" id="countSlider" min="200" max="4000" value="1500" step="100">
      <span class="val" id="countVal">1500</span>
    </div>
    <div class="slider-row">
      <label>Speed</label>
      <input type="range" id="speedSlider" min="1" max="100" value="40">
      <span class="val" id="speedVal">40</span>
    </div>
    <div class="slider-row">
      <label>Force</label>
      <input type="range" id="forceSlider" min="1" max="100" value="35">
      <span class="val" id="forceVal">35</span>
    </div>
    <div class="slider-row">
      <label>Friction</label>
      <input type="range" id="frictionSlider" min="1" max="100" value="85">
      <span class="val" id="frictionVal">85</span>
    </div>
    <div class="slider-row">
      <label>Trail</label>
      <input type="range" id="trailSlider" min="0" max="100" value="15">
      <span class="val" id="trailVal">15</span>
    </div>
  </div>

  <div class="controls">
    <button id="btnRandomize" class="active">⟳ Randomize</button>
    <button id="btnScatter">⊘ Scatter</button>
    <button id="btnReset">↻ Reset</button>
    <button id="btnPause">❚❚ Pause</button>
    <button id="btnSave">⬇ Save</button>
  </div>

  <div class="controls" style="margin-top:6px;">
    <button id="btnPreset1">◇ Cells</button>
    <button id="btnPreset2">✦ Chains</button>
    <button id="btnPreset3">◉ Clusters</button>
    <button id="btnPreset4">≋ Chaos</button>
  </div>

  <div class="help">
    <span>Click</span> attract particles &nbsp; <span>Right-click</span> repel<br>
    <span>Space</span> pause &nbsp; <span>R</span> reset &nbsp; <span>S</span> save<br>
    Drag to sculpt. Watch structures emerge from rules.
  </div>
</div>

<div id="fps">-- FPS</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ---- Species ----
const SPECIES_COUNT = 6;
const COLORS = [
  [0.35, 0.65, 1.0],   // cyan-blue
  [1.0, 0.45, 0.35],   // coral
  [0.4, 1.0, 0.5],     // green
  [1.0, 0.85, 0.2],    // gold
  [0.75, 0.4, 1.0],    // violet
  [1.0, 0.55, 0.8],    // pink
];

// ---- Parameters ----
let particleCount = 1500;
let simSpeed = 0.4;
let maxForce = 3.5;
let friction = 0.85;
let trailAlpha = 0.15;
let paused = false;
let mouseDown = false;
let mouseRight = false;
let mouseX = 0, mouseY = 0;

// ---- Interaction matrix ----
let rules = [];
function randomizeRules() {
  rules = [];
  for (let i = 0; i < SPECIES_COUNT; i++) {
    rules[i] = [];
    for (let j = 0; j < SPECIES_COUNT; j++) {
      // attraction: -1 to 1, biased toward interesting values
      rules[i][j] = (Math.random() * 2 - 1);
    }
  }
}
randomizeRules();

// ---- Particles ----
let particles = [];
class Particle {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = 0;
    this.vy = 0;
    this.species = Math.floor(Math.random() * SPECIES_COUNT);
  }
}

function initParticles() {
  particles = [];
  for (let i = 0; i < particleCount; i++) {
    particles.push(new Particle());
  }
}
initParticles();

// ---- Spatial hash for O(n) neighbor queries ----
class SpatialHash {
  constructor(cellSize) {
    this.cellSize = cellSize;
    this.grid = {};
  }
  clear() { this.grid = {}; }
  key(x, y) {
    return ((x / this.cellSize) | 0) + ',' + ((y / this.cellSize) | 0);
  }
  insert(p) {
    const k = this.key(p.x, p.y);
    if (!this.grid[k]) this.grid[k] = [];
    this.grid[k].push(p);
  }
  query(p) {
    const cx = (p.x / this.cellSize) | 0;
    const cy = (p.y / this.cellSize) | 0;
    const results = [];
    for (let dx = -2; dx <= 2; dx++) {
      for (let dy = -2; dy <= 2; dy++) {
        const k = (cx + dx) + ',' + (cy + dy);
        if (this.grid[k]) results.push(...this.grid[k]);
      }
    }
    return results;
  }
}

const hash = new SpatialHash(40);

// ---- Presets ----
function applyPreset(type) {
  rules = [];
  for (let i = 0; i < SPECIES_COUNT; i++) {
    rules[i] = [];
    for (let j = 0; j < SPECIES_COUNT; j++) {
      if (type === 'cells') {
        rules[i][j] = i === j ? 0.5 : (i < j ? 0.3 : -0.4);
      } else if (type === 'chains') {
        rules[i][j] = Math.abs(i - j) === 1 ? 0.6 : (i === j ? -0.2 : -0.1);
      } else if (type === 'clusters') {
        rules[i][j] = i === j ? 0.7 : (Math.random() < 0.2 ? 0.15 : -0.35);
      } else if (type === 'chaos') {
        rules[i][j] = (Math.random() * 2 - 1) * 1.2;
      }
    }
  }
}

// ---- Simulation ----
const INTERACTION_RADIUS = 50;
const MOUSE_RADIUS = 180;

function update() {
  if (paused) return;

  hash.clear();
  for (const p of particles) hash.insert(p);

  for (const p of particles) {
    const neighbors = hash.query(p);
    let fx = 0, fy = 0;

    for (const q of neighbors) {
      if (p === q) continue;
      let dx = q.x - p.x;
      let dy = q.y - p.y;
      let dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 0.1 || dist > INTERACTION_RADIUS) continue;

      const force = rules[p.species][q.species];
      const f = (force * (1 - dist / INTERACTION_RADIUS)) * maxForce * 0.01;

      fx += (dx / dist) * f;
      fy += (dy / dist) * f;
    }

    // Mouse interaction
    if (mouseDown) {
      let mdx = mouseX - p.x;
      let mdy = mouseY - p.y;
      let mdist = Math.sqrt(mdx * mdx + mdy * mdy);
      if (mdist < MOUSE_RADIUS && mdist > 0.1) {
        const mf = (1 - mdist / MOUSE_RADIUS) * 4;
        fx += (mdx / mdist) * mf;
        fy += (mdy / mdist) * mf;
      }
    }
    if (mouseRight) {
      let mdx = p.x - mouseX;
      let mdy = p.y - mouseY;
      let mdist = Math.sqrt(mdx * mdx + mdy * mdy);
      if (mdist < MOUSE_RADIUS && mdist > 0.1) {
        const mf = (1 - mdist / MOUSE_RADIUS) * 5;
        fx += (mdx / mdist) * mf;
        fy += (mdy / mdist) * mf;
      }
    }

    p.vx += fx * simSpeed;
    p.vy += fy * simSpeed;
    p.vx *= friction;
    p.vy *= friction;

    // Speed limit
    const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    if (spd > 6) {
      p.vx = (p.vx / spd) * 6;
      p.vy = (p.vy / spd) * 6;
    }

    p.x += p.vx;
    p.y += p.vy;

    // Wrap
    if (p.x < 0) p.x += W;
    if (p.x > W) p.x -= W;
    if (p.y < 0) p.y += H;
    if (p.y > H) p.y -= H;
  }
}

function draw() {
  // Trail fade
  ctx.fillStyle = `rgba(5, 5, 8, ${trailAlpha})`;
  ctx.fillRect(0, 0, W, H);

  // Additive blending for glow
  ctx.globalCompositeOperation = 'lighter';

  for (const p of particles) {
    const c = COLORS[p.species];
    const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    const alpha = 0.3 + Math.min(spd * 0.1, 0.5);

    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.5 + spd * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${(c[0]*255)|0}, ${(c[1]*255)|0}, ${(c[2]*255)|0}, ${alpha})`;
    ctx.fill();
  }

  // Mouse indicator
  if (mouseDown || mouseRight) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, MOUSE_RADIUS, 0, Math.PI * 2);
    ctx.strokeStyle = mouseDown ? 'rgba(255,255,255,0.06)' : 'rgba(255,100,100,0.06)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, 4, 0, Math.PI * 2);
    ctx.fillStyle = mouseDown ? 'rgba(255,255,255,0.2)' : 'rgba(255,100,100,0.2)';
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
}

// ---- FPS ----
let frameCount = 0;
let lastFpsTime = performance.now();
function updateFps() {
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    document.getElementById('fps').textContent = frameCount + ' FPS';
    document.getElementById('fpsDisplay').textContent = frameCount;
    frameCount = 0;
    lastFpsTime = now;
  }
}

// ---- Loop ----
function loop() {
  update();
  draw();
  updateFps();
  requestAnimationFrame(loop);
}

// ---- UI ----
const countSlider = document.getElementById('countSlider');
const speedSlider = document.getElementById('speedSlider');
const forceSlider = document.getElementById('forceSlider');
const frictionSlider = document.getElementById('frictionSlider');
const trailSlider = document.getElementById('trailSlider');

countSlider.addEventListener('input', () => {
  const val = parseInt(countSlider.value);
  document.getElementById('countVal').textContent = val;
  const diff = val - particles.length;
  if (diff > 0) {
    for (let i = 0; i < diff; i++) particles.push(new Particle());
  } else if (diff < 0) {
    particles.splice(0, -diff);
  }
  particleCount = val;
  document.getElementById('particleCount').textContent = particles.length;
});

speedSlider.addEventListener('input', () => {
  simSpeed = parseInt(speedSlider.value) / 100;
  document.getElementById('speedVal').textContent = speedSlider.value;
});

forceSlider.addEventListener('input', () => {
  maxForce = parseInt(forceSlider.value) / 10;
  document.getElementById('forceVal').textContent = forceSlider.value;
});

frictionSlider.addEventListener('input', () => {
  friction = parseInt(frictionSlider.value) / 100;
  document.getElementById('frictionVal').textContent = frictionSlider.value;
});

trailSlider.addEventListener('input', () => {
  trailAlpha = parseInt(trailSlider.value) / 100;
  document.getElementById('trailVal').textContent = trailSlider.value;
});

document.getElementById('btnRandomize').addEventListener('click', () => {
  randomizeRules();
  scatter();
});

document.getElementById('btnScatter').addEventListener('click', scatter);
function scatter() {
  for (const p of particles) {
    p.x = Math.random() * W;
    p.y = Math.random() * H;
    p.vx += (Math.random() - 0.5) * 10;
    p.vy += (Math.random() - 0.5) * 10;
  }
}

document.getElementById('btnReset').addEventListener('click', () => {
  randomizeRules();
  initParticles();
  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, W, H);
});

document.getElementById('btnPause').addEventListener('click', (e) => {
  paused = !paused;
  e.target.textContent = paused ? '▶ Play' : '❚❚ Pause';
  e.target.classList.toggle('active', paused);
});

document.getElementById('btnSave').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = `particle-life-${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});

document.getElementById('btnPreset1').addEventListener('click', () => { applyPreset('cells'); scatter(); });
document.getElementById('btnPreset2').addEventListener('click', () => { applyPreset('chains'); scatter(); });
document.getElementById('btnPreset3').addEventListener('click', () => { applyPreset('clusters'); scatter(); });
document.getElementById('btnPreset4').addEventListener('click', () => { applyPreset('chaos'); scatter(); });

// Mouse
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 0) mouseDown = true;
  if (e.button === 2) mouseRight = true;
  mouseX = e.clientX;
  mouseY = e.clientY;
});
canvas.addEventListener('mouseup', (e) => {
  if (e.button === 0) mouseDown = false;
  if (e.button === 2) mouseRight = false;
});
canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// Touch
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  mouseDown = true;
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, { passive: false });
canvas.addEventListener('touchend', () => { mouseDown = false; });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, { passive: false });

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    document.getElementById('btnPause').click();
  }
  if (e.key === 'r' || e.key === 'R') {
    document.getElementById('btnReset').click();
  }
  if (e.key === 's' || e.key === 'S') {
    if (!e.ctrlKey && !e.metaKey) document.getElementById('btnSave').click();
  }
});

// Species legend
const grid = document.getElementById('speciesGrid');
for (let i = 0; i < SPECIES_COUNT; i++) {
  const c = COLORS[i];
  const dot = document.createElement('div');
  dot.className = 'species-dot';
  dot.innerHTML = `<div class="dot" style="background:rgb(${(c[0]*255)|0},${(c[1]*255)|0},${(c[2]*255)|0})"></div><span>${i+1}</span>`;
  grid.appendChild(dot);
}

document.getElementById('particleCount').textContent = particles.length;
document.getElementById('speciesCount').textContent = SPECIES_COUNT;

// Initial fill
ctx.fillStyle = '#050508';
ctx.fillRect(0, 0, W, H);

loop();
</script>
</body>
</html>
