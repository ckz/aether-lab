<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Life — Emergent Colony</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #06060c;
  color: #aaa;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  cursor: crosshair;
}
canvas { display: block; }
#ui {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
  z-index: 10;
}
#title {
  font-size: 14px;
  color: #c4a0ff;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
#stats {
  font-size: 11px;
  color: #555;
  letter-spacing: 1px;
}
#controls {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 10;
  flex-wrap: wrap;
  justify-content: center;
}
.btn {
  background: rgba(20, 20, 35, 0.8);
  border: 1px solid rgba(120, 100, 200, 0.3);
  color: #9990cc;
  padding: 6px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  letter-spacing: 1px;
  transition: all 0.2s;
  pointer-events: all;
}
.btn:hover {
  background: rgba(40, 35, 60, 0.9);
  border-color: rgba(160, 140, 240, 0.6);
  color: #c4a0ff;
}
.btn.active {
  background: rgba(60, 50, 100, 0.9);
  border-color: rgba(180, 160, 255, 0.7);
  color: #fff;
}
#legend {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 10;
  pointer-events: none;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
  font-size: 10px;
  color: #666;
}
.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
#hint {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: #444;
  z-index: 10;
  pointer-events: none;
  white-space: nowrap;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <div id="title">◈ Particle Life ◈</div>
  <div id="stats">initializing…</div>
</div>
<div id="legend"></div>
<div id="controls">
  <button class="btn" onclick="setPreset(0)">Cells</button>
  <button class="btn" onclick="setPreset(1)">Chains</button>
  <button class="btn" onclick="setPreset(2)">Colonies</button>
  <button class="btn" onclick="setPreset(3)">Chaos</button>
  <button class="btn" onclick="setPreset(4)">Harmony</button>
  <button class="btn" onclick="randomizeRules()">R — Random</button>
  <button class="btn" onclick="resetSimulation()">Space — Reset</button>
</div>
<div id="hint">Click to place · Drag to attract · 1-5 palettes · R randomize · Space reset</div>

<script>
// ─── Configuration ───
const PARTICLE_COUNT = 2000;
const SPECIES = 5;
const GRID_SIZE = 20;
const FRICTION = 0.92;
const MAX_SPEED = 3;
const MOUSE_RADIUS = 120;
const MOUSE_FORCE = 0.8;

// ─── Palettes ───
const palettes = [
  ['#00e5ff','#ff006e','#8338ec','#ffbe0b','#06d6a0'],
  ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff'],
  ['#e0aaff','#c77dff','#9d4edd','#7b2cbf','#3c096c'],
  ['#f72585','#7209b7','#3a0ca3','#4361ee','#4cc9f0'],
  ['#d4a373','#ccd5ae','#e9edc9','#fefae0','#faedcd'],
];
let currentPalette = 0;

// ─── Rule Presets ───
const presets = [
  // 0: Cells — self-attraction, mutual repulsion between different types
  [
    [ 1,-.5,-.5,-.3,-.3],
    [-.5, 1,-.5,-.3,-.3],
    [-.5,-.5, 1,-.3,-.3],
    [-.3,-.3,-.3, 1,-.2],
    [-.3,-.3,-.3,-.2, 1],
  ],
  // 1: Chains — linear attraction, perpendicular repulsion
  [
    [ 0, .8,-.3, .4,-.4],
    [-.3, 0, .8,-.4, .4],
    [ .4,-.3, 0, .8,-.3],
    [-.4, .4,-.3, 0, .8],
    [ .8,-.4, .4,-.3, 0],
  ],
  // 2: Colonies — cluster formation with neighbors
  [
    [ 1, .5, .1,-.6,-.6],
    [ .5, 1, .1,-.6,-.6],
    [ .1, .1, 1, .2,-.6],
    [-.5,-.5, .3, 1, .2],
    [-.5,-.5, .1, .2, 1],
  ],
  // 3: Chaos — wild random
  [
    [ .2,-.8, .5,-.4, .6],
    [-.4, .2, .7,-.3,-.5],
    [ .6,-.2,-.4, .8,-.1],
    [-.3, .5,-.6, .1, .7],
    [ .7,-.3, .4,-.8, .2],
  ],
  // 4: Harmony — gentle mutual attraction with structure
  [
    [ .4, .3, .3, .2, .2],
    [ .3, .4, .3, .2, .2],
    [ .3, .3, .4, .2, .2],
    [ .2, .2, .2, .4, .3],
    [ .2, .2, .2, .3, .4],
  ],
];

let rules = presets[0];
let particles = [];
let activePreset = 0;

// ─── Canvas Setup ───
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Spatial Grid ───
let grid = {};
function gridKey(x, y) {
  return Math.floor(x / GRID_SIZE) + ',' + Math.floor(y / GRID_SIZE);
}
function rebuildGrid() {
  grid = {};
  for (let p of particles) {
    const k = gridKey(p.x, p.y);
    if (!grid[k]) grid[k] = [];
    grid[k].push(p);
  }
}
function getNeighbors(x, y) {
  const cx = Math.floor(x / GRID_SIZE);
  const cy = Math.floor(y / GRID_SIZE);
  const result = [];
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      const k = (cx+dx) + ',' + (cy+dy);
      if (grid[k]) result.push(...grid[k]);
    }
  }
  return result;
}

// ─── Particles ───
class Particle {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = (Math.random() - 0.5) * 2;
    this.type = type;
    this.trail = [];
    this.maxTrail = 6;
  }
}

function initParticles() {
  particles = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(new Particle(
      Math.random() * W,
      Math.random() * H,
      Math.floor(Math.random() * SPECIES)
    ));
  }
}

// ─── Mouse ───
let mouse = { x: -1000, y: -1000, down: false };
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
canvas.addEventListener('mousedown', e => {
  mouse.down = true;
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  // Spawn burst on click
  for (let i = 0; i < 30; i++) {
    const type = Math.floor(Math.random() * SPECIES);
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    const p = new Particle(e.clientX, e.clientY, type);
    p.vx = Math.cos(angle) * speed;
    p.vy = Math.sin(angle) * speed;
    particles.push(p);
  }
  // Keep particle count bounded
  while (particles.length > PARTICLE_COUNT + 500) {
    particles.shift();
  }
});
canvas.addEventListener('mouseup', () => mouse.down = false);
canvas.addEventListener('mouseleave', () => {
  mouse.x = -1000;
  mouse.y = -1000;
  mouse.down = false;
});
// Touch support
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX;
  mouse.y = t.clientY;
  mouse.down = true;
}, { passive: false });
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  mouse.x = t.clientX;
  mouse.y = t.clientY;
  mouse.down = true;
  for (let i = 0; i < 30; i++) {
    const type = Math.floor(Math.random() * SPECIES);
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    const p = new Particle(t.clientX, t.clientY, type);
    p.vx = Math.cos(angle) * speed;
    p.vy = Math.sin(angle) * speed;
    particles.push(p);
  }
  while (particles.length > PARTICLE_COUNT + 500) particles.shift();
});
canvas.addEventListener('touchend', () => {
  mouse.down = false;
  mouse.x = -1000;
});

// ─── Controls ───
function setPreset(i) {
  activePreset = i;
  rules = presets[i];
  document.querySelectorAll('.btn').forEach((b, idx) => {
    b.classList.toggle('active', idx === i);
  });
}
function randomizeRules() {
  rules = [];
  for (let i = 0; i < SPECIES; i++) {
    rules[i] = [];
    for (let j = 0; j < SPECIES; j++) {
      rules[i][j] = Math.round((Math.random() * 2 - 1) * 10) / 10;
    }
  }
  activePreset = -1;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
}
function resetSimulation() {
  initParticles();
  activePreset = 0;
  setPreset(0);
}
document.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '5') {
    currentPalette = parseInt(e.key) - 1;
  }
  if (e.key === 'r' || e.key === 'R') randomizeRules();
  if (e.key === ' ') {
    e.preventDefault();
    resetSimulation();
  }
});

// ─── Legend ───
function buildLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = '';
  const colors = palettes[currentPalette];
  for (let i = 0; i < SPECIES; i++) {
    el.innerHTML += `<div class="legend-item"><div class="legend-dot" style="background:${colors[i]}"></div>TYPE ${i}</div>`;
  }
}
buildLegend();

// ─── Simulation ───
function update() {
  rebuildGrid();
  const colors = palettes[currentPalette];

  for (let p of particles) {
    // Mouse interaction
    const mdx = mouse.x - p.x;
    const mdy = mouse.y - p.y;
    const mDist = Math.sqrt(mdx * mdx + mdy * mdy);
    if (mDist < MOUSE_RADIUS && mDist > 0) {
      const force = (1 - mDist / MOUSE_RADIUS) * MOUSE_FORCE * (mouse.down ? -1 : 0.5);
      p.vx += (mdx / mDist) * force;
      p.vy += (mdy / mDist) * force;
    }

    // Particle interactions
    const neighbors = getNeighbors(p.x, p.y);
    let fx = 0, fy = 0;
    for (let n of neighbors) {
      if (n === p) continue;
      let dx = n.x - p.x;
      let dy = n.y - p.y;
      let dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 1) dist = 1;
      if (dist > 80) continue;

      const rule = rules[p.type][n.type];
      const f = rule / dist;
      fx += (dx / dist) * f;
      fy += (dy / dist) * f;
    }

    p.vx += fx;
    p.vy += fy;

    // Friction + clamp
    p.vx *= FRICTION;
    p.vy *= FRICTION;
    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    if (speed > MAX_SPEED) {
      p.vx = (p.vx / speed) * MAX_SPEED;
      p.vy = (p.vy / speed) * MAX_SPEED;
    }

    p.x += p.vx;
    p.y += p.vy;

    // Wrap edges with padding
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;
    if (p.y < -10) p.y = H + 10;
    if (p.y > H + 10) p.y = -10;

    // Trail
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > p.maxTrail) p.trail.shift();
  }
}

function render() {
  const colors = palettes[currentPalette];

  // Fade instead of clear
  ctx.fillStyle = 'rgba(6, 6, 12, 0.15)';
  ctx.fillRect(0, 0, W, H);

  // Draw connections between nearby same-type particles (sparse)
  ctx.lineWidth = 0.4;
  for (let p of particles) {
    if (p.trail.length < 2) continue;
    const c = colors[p.type];
    ctx.strokeStyle = c + '18';
    ctx.beginPath();
    ctx.moveTo(p.trail[0].x, p.trail[0].y);
    for (let i = 1; i < p.trail.length; i++) {
      ctx.lineTo(p.trail[i].x, p.trail[i].y);
    }
    ctx.stroke();
  }

  // Draw particles with glow
  for (let p of particles) {
    const c = colors[p.type];
    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    const alpha = 0.5 + speed * 0.3;

    // Outer glow
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = c + '40';
    ctx.fill();

    // Core
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.2, 0, Math.PI * 2);
    ctx.fillStyle = c;
    ctx.globalAlpha = alpha;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function updateStats() {
  const el = document.getElementById('stats');
  el.textContent = `${particles.length} particles · ${SPECIES} types · preset: ${['cells','chains','colonies','chaos','harmony'][activePreset] || 'random'} · palette ${currentPalette + 1}`;
}

// ─── Main Loop ───
function loop() {
  update();
  render();
  updateStats();
  requestAnimationFrame(loop);
}

// ─── Start ───
initParticles();
setPreset(0);
setTimeout(() => {
  // Clear canvas fully at start
  ctx.fillStyle = '#06060c';
  ctx.fillRect(0, 0, W, H);
}, 50);
loop();
</script>
</body>
</html>
