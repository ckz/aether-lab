<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phantom Weave</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05050a;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas {
    display: block;
  }
  .ui {
    position: fixed;
    top: 20px;
    left: 20px;
    color: rgba(180, 160, 255, 0.7);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
  .controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 10;
  }
  .controls button {
    background: rgba(20, 15, 40, 0.8);
    border: 1px solid rgba(140, 120, 255, 0.3);
    color: rgba(180, 160, 255, 0.8);
    padding: 8px 16px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.3s;
  }
  .controls button:hover {
    background: rgba(40, 30, 80, 0.9);
    border-color: rgba(180, 150, 255, 0.6);
    color: #c8c8ff;
  }
  .controls button.active {
    background: rgba(60, 40, 120, 0.9);
    border-color: rgba(200, 180, 255, 0.8);
    color: #fff;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="ui">
  <div>Phantom Weave</div>
  <div style="margin-top: 4px; opacity: 0.5;">Move to attract · Click to burst · 1-6 palettes · C clear · Space pause</div>
</div>
<div class="controls">
  <button id="paletteBtn">Palette</button>
  <button id="clearBtn">Clear</button>
  <button id="pauseBtn">Pause</button>
  <button id="densityBtn">Density</button>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const palettes = [
  { name: 'Void', colors: ['rgba(120,80,220,', 'rgba(80,120,255,', 'rgba(200,100,255,', 'rgba(100,200,255,'] },
  { name: 'Ember', colors: ['rgba(255,120,50,', 'rgba(255,200,50,', 'rgba(255,80,30,', 'rgba(255,160,80,'] },
  { name: 'Frost', colors: ['rgba(150,220,255,', 'rgba(200,240,255,', 'rgba(100,180,220,', 'rgba(220,250,255,'] },
  { name: 'Toxic', colors: ['rgba(120,255,80,', 'rgba(200,255,50,', 'rgba(80,220,100,', 'rgba(150,255,120,'] },
  { name: 'Nebula', colors: ['rgba(255,100,200,', 'rgba(200,80,255,', 'rgba(255,150,220,', 'rgba(180,100,255,'] },
  { name: 'Ghost', colors: ['rgba(200,200,220,', 'rgba(160,160,180,', 'rgba(220,220,240,', 'rgba(140,140,160,'] }
];

let currentPalette = 0;
let paused = false;
let densityLevel = 1; // 0=low, 1=med, 2=high

const densitySettings = [
  { threads: 60, trailLen: 40, particles: 0 },
  { threads: 120, trailLen: 60, particles: 0 },
  { threads: 200, trailLen: 80, particles: 0 }
];

let mouse = { x: W / 2, y: H / 2, active: false };
let threads = [];
let echoes = [];
let burstParticles = [];

class Thread {
  constructor() {
    this.reset();
  }
  
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = (Math.random() - 0.5) * 2;
    this.trail = [];
    this.colorIdx = Math.floor(Math.random() * 4);
    this.life = 1;
    this.maxLife = 300 + Math.random() * 500;
    this.age = 0;
    this.echoTimer = 0;
    this.echoDelay = 200 + Math.random() * 400;
    this.speed = 0.5 + Math.random() * 1.5;
    this.noiseOffsetX = Math.random() * 1000;
    this.noiseOffsetY = Math.random() * 1000;
  }
  
  update() {
    if (paused) return;
    
    this.age++;
    
    // Curl noise approximation
    const scale = 0.003;
    const n1 = Math.sin(this.x * scale + this.noiseOffsetX) * Math.cos(this.y * scale + this.noiseOffsetY);
    const n2 = Math.cos(this.x * scale - this.noiseOffsetX) * Math.sin(this.y * scale - this.noiseOffsetY);
    
    this.vx += n1 * 0.1;
    this.vy += n2 * 0.1;
    
    // Mouse attraction
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 300 && dist > 1) {
        const force = (300 - dist) / 300 * 0.3;
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }
    }
    
    // Damping
    this.vx *= 0.98;
    this.vy *= 0.98;
    
    // Speed limit
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed > this.speed * 2) {
      this.vx = (this.vx / speed) * this.speed * 2;
      this.vy = (this.vy / speed) * this.speed * 2;
    }
    
    this.x += this.vx;
    this.y += this.vy;
    
    // Wrap edges
    if (this.x < 0) this.x = W;
    if (this.x > W) this.x = 0;
    if (this.y < 0) this.y = H;
    if (this.y > H) this.y = 0;
    
    // Trail
    this.trail.push({ x: this.x, y: this.y });
    const maxTrail = densitySettings[densityLevel].trailLen;
    while (this.trail.length > maxTrail) {
      this.trail.shift();
    }
    
    // Echo - occasionally leave a ghost trail
    this.echoTimer++;
    if (this.echoTimer > this.echoDelay && this.trail.length > 20) {
      this.echoTimer = 0;
      echoes.push({
        x: this.x,
        y: this.y,
        trail: [...this.trail],
        life: 1,
        decay: 0.003 + Math.random() * 0.003,
        colorIdx: this.colorIdx
      });
    }
    
    // Respawn
    if (this.age > this.maxLife) {
      this.reset();
    }
  }
  
  draw() {
    const palette = palettes[currentPalette];
    const baseColor = palette.colors[this.colorIdx % 4];
    
    // Draw trail
    for (let i = 1; i < this.trail.length; i++) {
      const t = i / this.trail.length;
      const alpha = t * 0.6;
      const width = t * 2.5;
      
      ctx.beginPath();
      ctx.moveTo(this.trail[i - 1].x, this.trail[i - 1].y);
      ctx.lineTo(this.trail[i].x, this.trail[i].y);
      ctx.strokeStyle = baseColor + alpha + ')';
      ctx.lineWidth = width;
      ctx.stroke();
    }
    
    // Glow at head
    ctx.beginPath();
    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = baseColor + '0.8)';
    ctx.fill();
  }
}

class BurstParticle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1;
    this.decay = 0.01 + Math.random() * 0.02;
    this.colorIdx = Math.floor(Math.random() * 4);
  }
  
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.98;
    this.vy *= 0.98;
    this.life -= this.decay;
  }
  
  draw() {
    const palette = palettes[currentPalette];
    const color = palette.colors[this.colorIdx % 4];
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2 * this.life, 0, Math.PI * 2);
    ctx.fillStyle = color + (this.life * 0.7) + ')';
    ctx.fill();
  }
}

function initThreads() {
  threads = [];
  const count = densitySettings[densityLevel].threads;
  for (let i = 0; i < count; i++) {
    threads.push(new Thread());
  }
}

function burst(x, y) {
  const count = 30 + Math.floor(Math.random() * 20);
  for (let i = 0; i < count; i++) {
    burstParticles.push(new BurstParticle(x, y));
  }
}

function animate() {
  // Fade effect
  ctx.fillStyle = 'rgba(5, 5, 10, 0.08)';
  ctx.fillRect(0, 0, W, H);
  
  if (!paused) {
    // Update threads
    threads.forEach(t => t.update());
    
    // Update echoes
    for (let i = echoes.length - 1; i >= 0; i--) {
      echoes[i].life -= echoes[i].decay;
      if (echoes[i].life <= 0) {
        echoes.splice(i, 1);
      }
    }
    
    // Draw echoes
    echoes.forEach(e => {
      const palette = palettes[currentPalette];
      const baseColor = palette.colors[e.colorIdx % 4];
      for (let i = 1; i < e.trail.length; i++) {
        const t = i / e.trail.length;
        const alpha = t * e.life * 0.3;
        if (alpha < 0.01) continue;
        const width = t * e.life * 2;
        ctx.beginPath();
        ctx.moveTo(e.trail[i - 1].x, e.trail[i - 1].y);
        ctx.lineTo(e.trail[i].x, e.trail[i].y);
        ctx.strokeStyle = baseColor + alpha + ')';
        ctx.lineWidth = width;
        ctx.stroke();
      }
    });
    
    // Update burst particles
    for (let i = burstParticles.length - 1; i >= 0; i--) {
      burstParticles[i].update();
      if (burstParticles[i].life <= 0) {
        burstParticles.splice(i, 1);
      }
    }
  }
  
  // Draw threads
  threads.forEach(t => t.draw());
  
  // Draw burst particles
  burstParticles.forEach(p => p.draw());
  
  requestAnimationFrame(animate);
}

// Event listeners
canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => {
  mouse.active = false;
});

canvas.addEventListener('click', (e) => {
  burst(e.clientX, e.clientY);
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  mouse.x = touch.clientX;
  mouse.y = touch.clientY;
  mouse.active = true;
  burst(touch.clientX, touch.clientY);
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  mouse.x = touch.clientX;
  mouse.y = touch.clientY;
});

canvas.addEventListener('touchend', () => {
  mouse.active = false;
});

document.addEventListener('keydown', (e) => {
  if (e.key >= '1' && e.key <= '6') {
    currentPalette = parseInt(e.key) - 1;
    updateButtons();
  } else if (e.key === 'c' || e.key === 'C') {
    ctx.fillStyle = '#05050a';
    ctx.fillRect(0, 0, W, H);
    echoes = [];
    burstParticles = [];
  } else if (e.key === ' ') {
    e.preventDefault();
    paused = !paused;
    updateButtons();
  }
});

document.getElementById('paletteBtn').addEventListener('click', () => {
  currentPalette = (currentPalette + 1) % palettes.length;
  updateButtons();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  ctx.fillStyle = '#05050a';
  ctx.fillRect(0, 0, W, H);
  echoes = [];
  burstParticles = [];
});

document.getElementById('pauseBtn').addEventListener('click', () => {
  paused = !paused;
  updateButtons();
});

document.getElementById('densityBtn').addEventListener('click', () => {
  densityLevel = (densityLevel + 1) % 3;
  initThreads();
  updateButtons();
});

function updateButtons() {
  document.getElementById('pauseBtn').textContent = paused ? 'Play' : 'Pause';
  document.getElementById('pauseBtn').classList.toggle('active', paused);
  document.getElementById('paletteBtn').textContent = palettes[currentPalette].name;
  document.getElementById('densityBtn').textContent = ['Low', 'Med', 'High'][densityLevel];
}

// Start
initThreads();
updateButtons();
animate();
</script>
</body>
</html>
