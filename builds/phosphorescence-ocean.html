<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phosphorescence Ocean</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000008;
    overflow: hidden;
    cursor: crosshair;
    font-family: 'Courier New', monospace;
  }
  canvas { display: block; }
  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    color: rgba(100, 220, 180, 0.7);
    font-size: 11px;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(100, 220, 180, 0.5);
    line-height: 1.7;
  }
  #title {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(150, 240, 200, 0.08);
    font-size: 28px;
    pointer-events: none;
    letter-spacing: 12px;
    text-transform: uppercase;
  }
  #controls {
    position: fixed;
    bottom: 16px;
    right: 16px;
    color: rgba(100, 220, 180, 0.5);
    font-size: 10px;
    pointer-events: none;
    text-align: right;
    line-height: 1.7;
  }
</style>
</head>
<body>
<canvas id="ocean"></canvas>
<div id="hud"></div>
<div id="title">Phosphorescence</div>
<div id="controls">
  1-4: palettes · SPACE: storm<br>
  CLICK: spawn bloom · HOLD: attract
</div>

<script>
const canvas = document.getElementById('ocean');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ---- Simplex-like noise (fast 2D) ----
function hash(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return (h ^ (h >> 16)) / 4294967296 + 0.5;
}
function smoothNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi+1, yi);
  const c = hash(xi, yi+1), d = hash(xi+1, yi+1);
  return a + (b-a)*sx + (c-a)*sy + (a-b-c+d)*sx*sy;
}
function noise(x, y) {
  return smoothNoise(x, y) * 0.5 +
         smoothNoise(x*2, y*2) * 0.25 +
         smoothNoise(x*4, y*4) * 0.125;
}

// ---- Palettes ----
const palettes = [
  { name: 'Abyss',   glow: [100, 220, 180], bg: [0, 0, 8],   trail: 'rgba(0, 15, 12,' },
  { name: 'Deep Sea', glow: [80, 180, 255],  bg: [0, 0, 20],  trail: 'rgba(0, 5, 30,' },
  { name: 'Lava',    glow: [255, 120, 40],  bg: [15, 0, 0],  trail: 'rgba(30, 5, 0,' },
  { name: 'Void',    glow: [200, 100, 255], bg: [5, 0, 15],  trail: 'rgba(15, 0, 25,' },
];
let palette = 0;

// ---- Particles ----
const N = 1800;
const particles = [];

class Particle {
  constructor(x, y, isBloom = false) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.vx = 0;
    this.vy = 0;
    this.life = isBloom ? 400 + Math.random() * 300 : Infinity;
    this.maxLife = this.life;
    this.size = isBloom ? 1.5 + Math.random() * 2.5 : 0.5 + Math.random() * 1.5;
    this.isBloom = isBloom;
    this.seed = Math.random() * 1000;
  }
  step(t) {
    const scale = 0.0018;
    const n = noise(this.x * scale + t * 0.0003, this.y * scale + t * 0.0002);
    const angle = n * Math.PI * 4;
    const speed = 0.6;

    this.vx += Math.cos(angle) * speed * 0.15;
    this.vy += Math.sin(angle) * speed * 0.15;

    // Mouse interaction
    if (mouse.down) {
      const dx = mouse.x - this.x, dy = mouse.y - this.y;
      const d = Math.sqrt(dx*dx + dy*dy) + 1;
      if (d < 250) {
        const f = (250 - d) / 250 * 0.8;
        this.vx += (dx / d) * f;
        this.vy += (dy / d) * f;
      }
    }

    // Storm
    if (storm) {
      this.vx += (Math.random() - 0.5) * 2;
      this.vy += (Math.random() - 0.5) * 2 - 0.3;
    }

    // Damping
    this.vx *= 0.96;
    this.vy *= 0.96;

    this.x += this.vx;
    this.y += this.vy;

    // Wrap
    if (this.x < 0) this.x = W;
    if (this.x > W) this.x = 0;
    if (this.y < 0) this.y = H;
    if (this.y > H) this.y = 0;

    if (this.isBloom) this.life--;
  }
  draw() {
    const alpha = this.isBloom ? Math.min(1, this.life / this.maxLife) : 0.6;
    const p = palettes[palette];
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.glow[0]}, ${p.glow[1]}, ${p.glow[2]}, ${alpha})`;
    ctx.fill();
  }
}

for (let i = 0; i < N; i++) particles.push(new Particle());

// ---- Mouse ----
const mouse = { x: W/2, y: H/2, down: false };
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e => {
  mouse.down = true;
  for (let i = 0; i < 60; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * 30;
    const p = new Particle(e.clientX + Math.cos(a)*r, e.clientY + Math.sin(a)*r, true);
    p.vx = Math.cos(a) * 2;
    p.vy = Math.sin(a) * 2;
    particles.push(p);
  }
});
canvas.addEventListener('mouseup', () => mouse.down = false);
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY; mouse.down = true;
  for (let i = 0; i < 60; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.random() * 30;
    const p = new Particle(t.clientX + Math.cos(a)*r, t.clientY + Math.sin(a)*r, true);
    p.vx = Math.cos(a)*2; p.vy = Math.sin(a)*2;
    particles.push(p);
  }
}, {passive: false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY;
}, {passive: false});
canvas.addEventListener('touchend', () => mouse.down = false);

// ---- Keyboard ----
let storm = false;
window.addEventListener('keydown', e => {
  if (e.key === ' ') { storm = true; e.preventDefault(); }
  if (e.key >= '1' && e.key <= '4') palette = parseInt(e.key) - 1;
});
window.addEventListener('keyup', e => {
  if (e.key === ' ') storm = false;
});

// ---- Plankton ----
const planktons = [];
for (let i = 0; i < 80; i++) {
  planktons.push({
    x: Math.random() * W,
    y: Math.random() * H,
    phase: Math.random() * Math.PI * 2,
    speed: 0.2 + Math.random() * 0.5,
    size: 20 + Math.random() * 60
  });
}

// ---- Render ----
let t = 0;
function render() {
  t++;
  const p = palettes[palette];

  // Fade
  ctx.fillStyle = p.trail + '0.12)';
  ctx.fillRect(0, 0, W, H);

  // Plankton glow
  planktons.forEach(pl => {
    pl.x += Math.sin(t * 0.003 + pl.phase) * pl.speed * 0.3;
    pl.y += Math.cos(t * 0.002 + pl.phase) * pl.speed * 0.2;
    if (pl.x < -pl.size) pl.x = W + pl.size;
    if (pl.x > W + pl.size) pl.x = -pl.size;
    if (pl.y < -pl.size) pl.y = H + pl.size;
    if (pl.y > H + pl.size) pl.y = -pl.size;
    const pulse = 0.015 + Math.sin(t * 0.02 + pl.phase) * 0.01;
    const grad = ctx.createRadialGradient(pl.x, pl.y, 0, pl.x, pl.y, pl.size);
    grad.addColorStop(0, `rgba(${p.glow[0]}, ${p.glow[1]}, ${p.glow[2]}, ${pulse})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(pl.x - pl.size, pl.y - pl.size, pl.size * 2, pl.size * 2);
  });

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].step(t);
    particles[i].draw();
    if (particles[i].isBloom && particles[i].life <= 0) particles.splice(i, 1);
  }

  // Mouse glow
  if (mouse.down) {
    const grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 120);
    grad.addColorStop(0, `rgba(${p.glow[0]}, ${p.glow[1]}, ${p.glow[2]}, 0.08)`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(mouse.x - 120, mouse.y - 120, 240, 240);
  }

  // HUD
  if (t % 30 === 0) {
    hud.innerHTML = `particles: ${particles.length}<br>palette: ${p.name}${storm ? '<br>⚡ STORM' : ''}`;
  }

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
