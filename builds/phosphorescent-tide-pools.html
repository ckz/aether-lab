<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phosphorescent Tide Pools</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'SF Mono', 'Fira Code', monospace;
    cursor: crosshair;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(180, 220, 255, 0.7);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
    text-align: center;
    text-shadow: 0 0 10px rgba(100, 200, 255, 0.5);
  }
  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .btn {
    background: rgba(20, 40, 60, 0.6);
    border: 1px solid rgba(100, 200, 255, 0.3);
    color: rgba(180, 220, 255, 0.8);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: all 0.3s;
    backdrop-filter: blur(10px);
  }
  .btn:hover {
    background: rgba(40, 80, 120, 0.7);
    border-color: rgba(100, 200, 255, 0.7);
    color: #fff;
  }
  .btn.active {
    background: rgba(60, 140, 200, 0.4);
    border-color: rgba(100, 200, 255, 0.8);
  }
  #stats {
    position: fixed;
    top: 20px;
    right: 20px;
    color: rgba(100, 200, 255, 0.5);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-align: right;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="ui">Phosphorescent Tide Pools — move mouse to guide the light</div>
<div id="stats"></div>
<div id="controls">
  <button class="btn active" data-palette="ocean">Ocean</button>
  <button class="btn" data-palette="ember">Ember</button>
  <button class="btn" data-palette="neon">Neon</button>
  <button class="btn" data-palette="ghost">Ghost</button>
  <button class="btn" data-palette="arctic">Arctic</button>
</div>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const palettes = {
  ocean:  { bg: [2, 8, 18],   colors: [[20, 120, 255], [40, 200, 180], [80, 160, 255], [20, 100, 200], [60, 180, 220]] },
  ember:  { bg: [12, 4, 2],   colors: [[255, 100, 20], [255, 180, 40], [200, 60, 10], [255, 140, 60], [180, 40, 5]] },
  neon:   { bg: [4, 2, 12],   colors: [[255, 0, 200], [0, 255, 200], [200, 0, 255], [0, 200, 255], [255, 100, 255]] },
  ghost:  { bg: [8, 8, 10],   colors: [[180, 200, 220], [140, 160, 180], [200, 220, 240], [120, 140, 160], [160, 180, 200]] },
  arctic: { bg: [4, 10, 18],  colors: [[180, 220, 255], [140, 200, 240], [200, 230, 255], [100, 180, 220], [160, 210, 250]] }
};

let currentPalette = 'ocean';
let palette = palettes.ocean;
let mouse = { x: W/2, y: H/2, active: false };
let creatures = [];
let trails = [];
let ripples = [];

const CREATURE_COUNT = 80;
const TRAIL_LENGTH = 25;

class Creature {
  constructor() {
    this.reset();
    this.y = Math.random() * H;
  }
  reset() {
    this.x = Math.random() * W;
    this.y = H + 50;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = -(Math.random() * 0.6 + 0.3);
    this.size = Math.random() * 3 + 1.5;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.pulseSpeed = Math.random() * 0.02 + 0.01;
    this.trail = [];
    this.colorIdx = Math.floor(Math.random() * 5);
    this.wanderAngle = Math.random() * Math.PI * 2;
    this.wanderSpeed = Math.random() * 0.02 + 0.005;
    this.life = 1;
    this.fadeRate = Math.random() * 0.0003 + 0.0001;
  }
  update() {
    this.pulsePhase += this.pulseSpeed;
    this.wanderAngle += (Math.random() - 0.5) * this.wanderSpeed;
    this.vx += Math.cos(this.wanderAngle) * 0.02;
    this.vy += Math.sin(this.wanderAngle) * 0.02 - 0.005;
    this.vx *= 0.98;
    this.vy *= 0.98;
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 200) {
        const force = (200 - dist) / 200 * 0.08;
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }
    }
    this.trail.push({ x: this.x, y: this.y, size: this.size, life: 1 });
    if (this.trail.length > TRAIL_LENGTH) this.trail.shift();
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.fadeRate;
    if (this.life <= 0 || this.x < -50 || this.x > W + 50 || this.y < -50) {
      this.reset();
      this.y = H + 30;
    }
  }
  draw() {
    if (this.trail.length < 2) return;
    const c = palette.colors[this.colorIdx];
    for (let i = 0; i < this.trail.length - 1; i++) {
      const t = this.trail[i];
      const alpha = (i / this.trail.length) * 0.5 * this.life;
      const width = (i / this.trail.length) * this.size * 1.5;
      ctx.strokeStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${alpha})`;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(t.x, t.y);
      ctx.lineTo(this.trail[i+1].x, this.trail[i+1].y);
      ctx.stroke();
    }
    const pulse = Math.sin(this.pulsePhase) * 0.4 + 0.6;
    const head = this.trail[this.trail.length - 1];
    const glow = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, this.size * 6 * pulse);
    glow.addColorStop(0, `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${0.9 * this.life})`);
    glow.addColorStop(0.3, `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${0.4 * this.life})`);
    glow.addColorStop(1, `rgba(${c[0]}, ${c[1]}, ${c[2]}, 0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(head.x, head.y, this.size * 6 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255, 255, 255, ${0.9 * pulse * this.life})`;
    ctx.beginPath();
    ctx.arc(head.x, head.y, this.size * 0.8, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Ripple {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.radius = 0;
    this.maxRadius = 250;
    this.life = 1;
    this.speed = 4;
    this.colorIdx = Math.floor(Math.random() * 5);
  }
  update() {
    this.radius += this.speed;
    this.life = 1 - this.radius / this.maxRadius;
    return this.life > 0;
  }
  draw() {
    const c = palette.colors[this.colorIdx];
    ctx.strokeStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${this.life * 0.5})`;
    ctx.lineWidth = 2 * this.life;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.stroke();
    for (const cr of creatures) {
      const dx = cr.x - this.x;
      const dy = cr.y - this.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (Math.abs(dist - this.radius) < 30) {
        cr.vx += (dx / dist) * 1.5 * this.life;
        cr.vy += (dy / dist) * 1.5 * this.life;
      }
    }
  }
}

class Jellyfish {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.size = Math.random() * 30 + 20;
    this.vy = -(Math.random() * 0.3 + 0.1);
    this.vx = (Math.random() - 0.5) * 0.2;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.pulseSpeed = Math.random() * 0.015 + 0.008;
    this.tentacles = Math.floor(Math.random() * 5) + 4;
    this.tentacleLen = Math.random() * 60 + 40;
    this.colorIdx = Math.floor(Math.random() * 5);
    this.wobble = Math.random() * Math.PI * 2;
    this.opacity = Math.random() * 0.3 + 0.15;
  }
  update() {
    this.pulsePhase += this.pulseSpeed;
    this.wobble += 0.02;
    this.x += this.vx + Math.sin(this.wobble) * 0.3;
    this.y += this.vy;
    if (this.y < -100) { this.y = H + 100; this.x = Math.random() * W; }
    if (this.x < -50) this.x = W + 50;
    if (this.x > W + 50) this.x = -50;
  }
  draw() {
    const c = palette.colors[this.colorIdx];
    const pulse = Math.sin(this.pulsePhase) * 0.3 + 0.7;
    const bellW = this.size * pulse;
    const bellH = this.size * 0.7;
    for (let i = 0; i < 3; i++) {
      const glow = ctx.createRadialGradient(this.x, this.y - bellH/2, 0, this.x, this.y - bellH/2, bellW * 2);
      glow.addColorStop(0, `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${this.opacity * 0.6})`);
      glow.addColorStop(1, `rgba(${c[0]}, ${c[1]}, ${c[2]}, 0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(this.x, this.y - bellH/2, bellW * 2 + i * 10, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${this.opacity})`;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y - bellH/2, bellW, bellH, 0, Math.PI, 0);
    ctx.fill();
    for (let t = 0; t < this.tentacles; t++) {
      const startX = this.x - bellW + (bellW * 2 / (this.tentacles - 1)) * t;
      ctx.strokeStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${this.opacity * 0.6})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(startX, this.y - bellH/2);
      const waveAmp = 8 * pulse;
      for (let s = 0; s < this.tentacleLen; s += 5) {
        const ty = this.y - bellH/2 + s;
        const tx = startX + Math.sin(this.wobble + s * 0.05 + t) * waveAmp * (s / this.tentacleLen);
        ctx.lineTo(tx, ty);
      }
      ctx.stroke();
    }
  }
}

let jellies = [];
for (let i = 0; i < 6; i++) jellies.push(new Jellyfish());
for (let i = 0; i < CREATURE_COUNT; i++) creatures.push(new Creature());

window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
window.addEventListener('mouseout', () => mouse.active = false);
window.addEventListener('click', e => ripples.push(new Ripple(e.clientX, e.clientY)));
window.addEventListener('touchmove', e => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
}, { passive: false });
window.addEventListener('touchstart', e => {
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
  ripples.push(new Ripple(mouse.x, mouse.y));
});

document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPalette = btn.dataset.palette;
    palette = palettes[currentPalette];
  });
});

let frameCount = 0;
let lastTime = performance.now();
let fps = 60;

function animate() {
  const now = performance.now();
  fps = fps * 0.95 + (1000 / (now - lastTime)) * 0.05;
  lastTime = now;
  frameCount++;

  const bg = palette.bg;
  ctx.fillStyle = `rgba(${bg[0]}, ${bg[1]}, ${bg[2]}, 0.08)`;
  ctx.fillRect(0, 0, W, H);

  for (const j of jellies) { j.update(); j.draw(); }
  for (const c of creatures) { c.update(); c.draw(); }
  ripples = ripples.filter(r => { r.draw(); return r.update(); });

  if (frameCount % 30 === 0) {
    document.getElementById('stats').textContent = `${Math.round(fps)} fps · ${creatures.length} organisms`;
  }

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
