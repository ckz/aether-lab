<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phyllotaxis Loom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030f; }
  canvas { display: block; cursor: crosshair; }
  #hud {
    position: fixed; top: 16px; left: 20px;
    color: rgba(255,255,255,0.55); font: 11px/1.7 'Courier New', monospace;
    pointer-events: none; user-select: none;
  }
  #title {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.08); font: bold 52px Georgia, serif;
    pointer-events: none; user-select: none; white-space: nowrap;
  }
  #controls {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    pointer-events: all;
  }
  .btn {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.55); padding: 5px 13px; border-radius: 20px;
    font: 11px 'Courier New', monospace; cursor: pointer;
    transition: all 0.2s; backdrop-filter: blur(8px);
  }
  .btn:hover { background: rgba(255,255,255,0.14); color: rgba(255,255,255,0.9); }
  #msg {
    position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.5); font: 11px 'Courier New', monospace;
    pointer-events: none; opacity: 0; transition: opacity 0.6s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Phyllotaxis</div>
<div id="hud"></div>
<div id="msg"></div>
<div id="controls">
  <button class="btn" onclick="doBloom()">✦ Bloom</button>
  <button class="btn" onclick="clearAll()">Clear</button>
  <button class="btn" onclick="toggleAuto()">Auto: ON</button>
  <button class="btn" onclick="nextPalette()">Palette →</button>
  <button class="btn" onclick="randPalette()">Random</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const msgEl = document.getElementById('msg');

let W, H, cx, cy;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
}
resize();
window.addEventListener('resize', () => { resize(); clearAll(); });

// ── Color palettes ──────────────────────────────────────────────────────────
const palettes = [
  { name: 'Aurora',  colors: [[0,220,255],[120,0,255],[0,255,180],[180,100,255],[0,180,255]], bg: [5,3,15] },
  { name: 'Ember',   colors: [[255,120,0],[255,200,0],[255,60,20],[255,160,40],[200,40,0]],   bg: [15,5,2]  },
  { name: 'Frost',   colors: [[180,220,255],[100,180,255],[220,240,255],[140,200,255],[200,230,255]], bg: [3,5,15] },
  { name: 'Biolum',  colors: [[0,255,100],[0,200,80],[120,255,0],[0,255,160],[80,255,120]],    bg: [2,10,5]  },
  { name: 'Void',    colors: [[200,0,255],[255,0,200],[150,0,255],[255,0,150],[220,50,255]],    bg: [10,2,15] },
  { name: 'Solar',   colors: [[255,220,0],[255,160,0],[255,255,100],[255,130,20],[200,255,0]],  bg: [15,10,2] },
];
let palIdx = 0;
let pal = palettes[0];

// ── Golden angle ────────────────────────────────────────────────────────────
const GA = Math.PI * (3 - Math.sqrt(5));  // ≈ 2.39996 rad
const GA_DEG = GA * 180 / Math.PI;        // ≈ 137.508°

// ── Particles ───────────────────────────────────────────────────────────────
let particles = [];
let blooms = 0;
let autoOn = true;
let autoTimer = 0;
const AUTO_INT = 220;

class Petal {
  constructor(ox, oy, idx, total, pCols, rotOff = 0) {
    this.ox = ox; this.oy = oy;
    // Phyllotactic spiral position
    const r     = Math.sqrt(idx) * 3.8;
    const theta = idx * GA + rotOff;
    this.x = ox + r * Math.cos(theta);
    this.y = oy + r * Math.sin(theta);
    const t = idx / total;
    this.maxLife  = 160 + Math.random() * 120;
    this.life     = this.maxLife;
    this.maxR     = 3.5 + Math.random() * 9;
    this.color    = pCols[Math.floor(Math.random() * pCols.length)];
    this.drift    = (Math.random() - 0.5) * 0.25;
    this.angle    = theta + Math.PI / 2 + (Math.random() - 0.5) * 0.6;
    this.aspect   = 0.35 + Math.random() * 0.55;
    this.wobPhase = Math.random() * Math.PI * 2;
    this.wobSpd   = 0.03 + Math.random() * 0.05;
  }

  update() {
    this.life--;
    this.x += Math.cos(this.angle) * this.drift;
    this.y += Math.sin(this.angle) * this.drift;
    this.wobPhase += this.wobSpd;
  }

  draw(ctx, rot) {
    const p = this.life / this.maxLife;
    // Life curve: rise fast, hold, fade
    const a = p < 0.1 ? p / 0.1
            : p > 0.55 ? (1 - p) / 0.45
            : 1;
    if (a <= 0.01) return;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle + rot + Math.sin(this.wobPhase) * 0.35);
    const r = this.maxR * (0.4 + 0.6 * Math.sin(p * Math.PI));

    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.5);
    const [cr, cg, cb] = this.color;
    g.addColorStop(0,   `rgba(${cr},${cg},${cb},${a * 0.95})`);
    g.addColorStop(0.35,`rgba(${cr},${cg},${cb},${a * 0.55})`);
    g.addColorStop(0.7, `rgba(${cr},${cg},${cb},${a * 0.1})`);
    g.addColorStop(1,   `rgba(${cr},${cg},${cb},0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 2.5, r * this.aspect, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  dead() { return this.life <= 0; }
}

// ── Blooom ──────────────────────────────────────────────────────────────────
function doBloom(ox, oy) {
  ox = ox ?? cx + (Math.random() - 0.5) * W * 0.7;
  oy = oy ?? cy + (Math.random() - 0.5) * H * 0.7;
  const count = 180 + Math.floor(Math.random() * 180);
  const rotOff = Math.random() * Math.PI * 2;
  for (let i = 0; i < count; i++) {
    const stagger = (i / count) * 70;
    setTimeout(() => {
      particles.push(new Petal(ox, oy, i, count, pal.colors, rotOff));
    }, stagger);
  }
  blooms++;
}

function clearAll() {
  particles = [];
  blooms = 0;
  const [r, g, b] = pal.bg;
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(0, 0, W, H);
}

// ── Animation ───────────────────────────────────────────────────────────────
let rot = 0;
let breathT = 0;
let lastT = 0;
let fps = 60;

function frame(ts) {
  const dt = ts - lastT; lastT = ts;
  fps += (1000 / (dt || 16) - fps) * 0.04;

  // Trail fade — dim the existing canvas
  const [br, bg, bb] = pal.bg;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgba(${br},${bg},${bb},0.045)`;
  ctx.fillRect(0, 0, W, H);

  // Breathing rotation
  breathT += 0.004;
  rot = Math.sin(breathT) * 0.18;

  // Additive glow pass
  ctx.globalCompositeOperation = 'lighter';

  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx, rot);
    if (particles[i].dead()) particles.splice(i, 1);
  }

  // HUD
  hud.textContent =
    `palette: ${pal.name}  ·  ${GA_DEG.toFixed(3)}° golden angle\n` +
    `petals: ${particles.length}  ·  blooms: ${blooms}  ·  ${fps.toFixed(0)} fps`;

  requestAnimationFrame(frame);
}

// ── Auto-cycle ──────────────────────────────────────────────────────────────
setInterval(() => {
  if (!autoOn) return;
  autoTimer++;
  if (autoTimer >= AUTO_INT) {
    autoTimer = 0;
    nextPalette();
    const ox = cx + (Math.random() - 0.5) * W * 0.55;
    const oy = cy + (Math.random() - 0.5) * H * 0.55;
    doBloom(ox, oy);
  }
}, 1000 / 60);

// ── Controls ────────────────────────────────────────────────────────────────
function nextPalette() {
  palIdx = (palIdx + 1) % palettes.length;
  pal = palettes[palIdx];
  flash(`◈ palette → ${pal.name}`);
}

function randPalette() {
  palIdx = Math.floor(Math.random() * palettes.length);
  pal = palettes[palIdx];
  flash(`◈ palette → ${pal.name} (random)`);
}

function toggleAuto() {
  autoOn = !autoOn;
  document.querySelectorAll('.btn')[2].textContent = `Auto: ${autoOn ? 'ON' : 'OFF'}`;
  flash(`◈ auto ${autoOn ? 'ON' : 'OFF'}`);
}

function flash(text) {
  msgEl.textContent = text;
  msgEl.style.opacity = '1';
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { msgEl.style.opacity = '0'; }, 1800);
}

// ── Input ───────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.code === 'Space')   { e.preventDefault(); doBloom(); }
  if (e.code === 'KeyC')    clearAll();
  if (e.code === 'KeyP')    nextPalette();
  if (e.code === 'KeyR')    randPalette();
  if (e.code === 'KeyA')    toggleAuto();
  if (e.code === 'KeyS') {
    const link = document.createElement('a');
    link.download = `phyllotaxis-${Date.now()}.png`;
    link.href = canvas.toDataURL();
    link.click();
    flash('✦ saved PNG');
  }
});

let mDown = false;
canvas.addEventListener('mousedown', () => { mDown = true;  doBloom(); });
canvas.addEventListener('mouseup',   () => { mDown = false; });
canvas.addEventListener('mousemove', e => {
  if (mDown) {
    for (let i = 0; i < 3; i++) {
      particles.push(new Petal(
        e.clientX + (Math.random() - 0.5) * 30,
        e.clientY + (Math.random() - 0.5) * 30,
        Math.floor(Math.random() * 80),
        80, pal.colors, Math.random() * Math.PI * 2
      ));
    }
  }
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  doBloom(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  for (let i = 0; i < 3; i++) {
    particles.push(new Petal(
      t.clientX + (Math.random() - 0.5) * 30,
      t.clientY + (Math.random() - 0.5) * 30,
      Math.floor(Math.random() * 80), 80, pal.colors, Math.random() * Math.PI * 2
    ));
  }
}, { passive: false });

// ── Init ────────────────────────────────────────────────────────────────────
clearAll();
// Seed with 3 ambient blooms
setTimeout(() => doBloom(cx * 0.5, cy * 0.6),  300);
setTimeout(() => doBloom(cx * 1.5, cy * 0.5),  700);
setTimeout(() => doBloom(cx,       cy * 1.4), 1100);
requestAnimationFrame(frame);
</script>
</body>
</html>
