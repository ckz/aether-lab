<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physarum Weaver</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #d4d4e8;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: rgba(10, 10, 20, 0.95);
    border-bottom: 1px solid rgba(100, 100, 180, 0.2);
    z-index: 10;
    flex-shrink: 0;
    flex-wrap: wrap;
    gap: 6px;
  }
  h1 {
    font-size: 14px;
    font-weight: normal;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #a0a0d0;
    margin-right: 12px;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: #8888aa;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .control-group input[type="range"] {
    width: 60px;
    accent-color: #8866cc;
  }
  .control-group input[type="color"] {
    width: 24px;
    height: 20px;
    border: 1px solid #333;
    background: none;
    cursor: pointer;
    padding: 0;
  }
  select, button {
    background: rgba(60, 60, 100, 0.3);
    color: #c0c0e8;
    border: 1px solid rgba(100, 100, 180, 0.3);
    padding: 3px 8px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  button:hover, select:hover {
    background: rgba(80, 80, 140, 0.5);
    border-color: rgba(140, 140, 220, 0.5);
  }
  button.active {
    background: rgba(100, 60, 180, 0.5);
    border-color: #8866cc;
  }
  #stats {
    font-size: 10px;
    color: #6666aa;
    letter-spacing: 1px;
  }
  #canvas-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #trail-canvas { z-index: 1; }
  #agent-canvas { z-index: 2; }
  #hint {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: rgba(100, 100, 180, 0.6);
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="header">
  <h1>⬡ Physarum Weaver</h1>
  <div class="controls">
    <div class="control-group">
      <span>Agents</span>
      <input type="range" id="agentCount" min="500" max="8000" value="2500" step="500">
      <span id="agentVal">2500</span>
    </div>
    <div class="control-group">
      <span>Speed</span>
      <input type="range" id="speed" min="1" max="8" value="3" step="0.5">
    </div>
    <div class="control-group">
      <span>Turn</span>
      <input type="range" id="turnAngle" min="10" max="90" value="35" step="5">
    </div>
    <div class="control-group">
      <span>Sensor</span>
      <input type="range" id="sensorDist" min="5" max="40" value="18" step="1">
    </div>
    <div class="control-group">
      <span>Trail</span>
      <input type="range" id="trailWeight" min="0.1" max="2" value="0.5" step="0.1">
    </div>
    <div class="control-group">
      <span>Fade</span>
      <input type="range" id="fadeRate" min="0.9" max="0.995" value="0.97" step="0.005">
    </div>
    <div class="control-group">
      <span>Color</span>
      <input type="color" id="color1" value="#6644cc">
      <input type="color" id="color2" value="#44ccaa">
    </div>
    <select id="palette">
      <option value="custom">Custom</option>
      <option value="mycelium" selected>Mycelium</option>
      <option value="aurora">Aurora</option>
      <option value="ember">Ember</option>
      <option value="ocean">Ocean</option>
      <option value="neon">Neon</option>
      <option value="ghost">Ghost</option>
    </select>
    <button id="resetBtn">Reset</button>
    <button id="pauseBtn">Pause</button>
    <button id="clearBtn">Clear</button>
    <span id="stats"></span>
  </div>
</div>
<div id="canvas-container">
  <canvas id="trail-canvas"></canvas>
  <canvas id="agent-canvas"></canvas>
  <div id="hint">Click to place food · Right-click to place obstacles · Space to pause</div>
</div>

<script>
(() => {
  'use strict';

  const trailCanvas = document.getElementById('trail-canvas');
  const agentCanvas = document.getElementById('agent-canvas');
  const trailCtx = trailCanvas.getContext('2d');
  const agentCtx = agentCanvas.getContext('2d');
  const container = document.getElementById('canvas-container');

  let W, H;
  let trailMap, diffused;
  let agents = [];
  let paused = false;
  let mouseX = -1000, mouseY = -1000;
  let mouseActive = false;
  let frameCount = 0;
  let lastFpsTime = performance.now();
  let fps = 0;

  // Parameters
  const params = {
    agentCount: 2500,
    moveSpeed: 3,
    turnAngle: 35 * Math.PI / 180,
    sensorDist: 18,
    sensorAngle: 35 * Math.PI / 180,
    trailWeight: 0.5,
    fadeRate: 0.97,
    diffuseRate: 0.2,
    color1: [102, 68, 204],
    color2: [68, 204, 170],
  };

  const palettes = {
    mycelium:  ['#6644cc', '#44ccaa', '#8855dd', '#33bb99'],
    aurora:    ['#00ff88', '#00ccff', '#88ffcc', '#44ddaa'],
    ember:     ['#ff4422', '#ffaa22', '#ff6644', '#ffcc44'],
    ocean:     ['#2266cc', '#22cccc', '#4488ff', '#44dddd'],
    neon:      ['#ff00ff', '#00ffff', '#ff44ff', '#44ffff'],
    ghost:     ['#aaaacc', '#8888bb', '#ccccdd', '#6666aa'],
  };

  function lerpColor(c1, c2, t) {
    return [
      Math.round(c1[0] + (c2[0] - c1[0]) * t),
      Math.round(c1[1] + (c2[1] - c1[1]) * t),
      Math.round(c1[2] + (c2[2] - c1[2]) * t),
    ];
  }

  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return [r, g, b];
  }

  function rgbStr(c, a = 1) {
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  }

  function resize() {
    W = container.clientWidth;
    H = container.clientHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    trailCanvas.width = W * dpr;
    trailCanvas.height = H * dpr;
    agentCanvas.width = W * dpr;
    agentCanvas.height = H * dpr;
    trailCtx.scale(dpr, dpr);
    agentCtx.scale(dpr, dpr);
    initTrailMap();
  }

  function initTrailMap() {
    trailMap = new Float32Array(W * H);
    diffused = new Float32Array(W * H);
  }

  function idx(x, y) {
    return Math.floor(y) * W + Math.floor(x);
  }

  function inBounds(x, y) {
    return x >= 0 && x < W && y >= 0 && y < H;
  }

  function getTrail(x, y) {
    if (!inBounds(x, y)) return 0;
    return trailMap[idx(x, y)];
  }

  function addTrail(x, y, amount) {
    if (!inBounds(x, y)) return;
    trailMap[idx(x, y)] = Math.min(1, trailMap[idx(x, y)] + amount);
  }

  function diffuseTrails() {
    const dr = params.diffuseRate;
    const w = W, h = H;
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const i = y * w + x;
        diffused[i] = trailMap[i] * (1 - dr * 4) +
          dr * (trailMap[i - 1] + trailMap[i + 1] + trailMap[i - w] + trailMap[i + w]);
      }
    }
    const tmp = trailMap;
    trailMap = diffused;
    diffused = tmp;
  }

  function fadeTrails() {
    const rate = params.fadeRate;
    for (let i = 0, len = trailMap.length; i < len; i++) {
      trailMap[i] *= rate;
      if (trailMap[i] < 0.001) trailMap[i] = 0;
    }
  }

  function sense(agent, angleOffset) {
    const angle = agent.angle + angleOffset;
    const sx = Math.floor(agent.x + Math.cos(angle) * params.sensorDist);
    const sy = Math.floor(agent.y + Math.sin(angle) * params.sensorDist);
    return getTrail(sx, sy);
  }

  function createAgent(x, y) {
    return {
      x: x != null ? x : Math.random() * W,
      y: y != null ? y : Math.random() * H,
      angle: Math.random() * Math.PI * 2,
      colorT: Math.random(),
    };
  }

  function initAgents() {
    agents = [];
    for (let i = 0; i < params.agentCount; i++) {
      agents.push(createAgent());
    }
  }

  function reset() {
    initTrailMap();
    initAgents();
    trailCtx.fillStyle = '#0a0a0f';
    trailCtx.fillRect(0, 0, W, H);
  }

  function updateAgents() {
    const { moveSpeed, turnAngle, trailWeight, sensorDist } = params;
    const angleL = -turnAngle;
    const angleR = turnAngle;

    for (let i = 0, len = agents.length; i < len; i++) {
      const agent = agents[i];
      const front = sense(agent, 0);
      const left = sense(agent, angleL);
      const right = sense(agent, angleR);

      if (front > left && front > right) {
        // Continue straight
      } else if (front < left && front < right) {
        agent.angle += (Math.random() - 0.5) * 2 * turnAngle;
      } else if (left < right) {
        agent.angle += turnAngle * (0.5 + Math.random() * 0.5);
      } else if (right < left) {
        agent.angle -= turnAngle * (0.5 + Math.random() * 0.5);
      }

      // Random wiggle
      agent.angle += (Math.random() - 0.5) * 0.1;

      agent.x += Math.cos(agent.angle) * moveSpeed;
      agent.y += Math.sin(agent.angle) * moveSpeed;

      // Wrap around
      if (agent.x < 0) agent.x += W;
      if (agent.x >= W) agent.x -= W;
      if (agent.y < 0) agent.y += H;
      if (agent.y >= H) agent.y -= H;

      // Leave trail
      addTrail(agent.x, agent.y, trailWeight);

      // Mouse food influence
      if (mouseActive) {
        const dx = agent.x - mouseX;
        const dy = agent.y - mouseY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 80) {
          const attraction = (80 - dist) / 80;
          agent.angle += attraction * 0.3 * Math.sin(performance.now() * 0.003 + i);
        }
      }
    }
  }

  function renderTrails() {
    const imageData = trailCtx.createImageData(W, H);
    const data = imageData.data;
    const [c1r, c1g, c1b] = params.color1;
    const [c2r, c2g, c2b] = params.color2;

    for (let i = 0, len = trailMap.length; i < len; i++) {
      const v = trailMap[i];
      if (v > 0.005) {
        const t = Math.min(1, v);
        const r = Math.round(c1r + (c2r - c1r) * t);
        const g = Math.round(c1g + (c2g - c1g) * t);
        const b = Math.round(c1b + (c2b - c1b) * t);
        const alpha = Math.min(255, Math.round(v * 600));
        const idx4 = i * 4;
        data[idx4] = r;
        data[idx4 + 1] = g;
        data[idx4 + 2] = b;
        data[idx4 + 3] = alpha;
      }
    }

    trailCtx.putImageData(imageData, 0, 0);
  }

  function renderAgents() {
    agentCtx.clearRect(0, 0, W, H);
    const pal = palettes[document.getElementById('palette').value] || palettes.mycelium;
    
    for (let i = 0, len = agents.length; i < len; i++) {
      const a = agents[i];
      const col = hexToRgb(pal[Math.floor(a.colorT * (pal.length - 1))]);
      agentCtx.fillStyle = rgbStr(col, 0.6);
      agentCtx.fillRect(a.x, a.y, 1, 1);
    }
  }

  function animate() {
    if (!paused) {
      updateAgents();
      if (frameCount % 3 === 0) {
        diffuseTrails();
      }
      if (frameCount % 10 === 0) {
        fadeTrails();
      }
      if (frameCount % 2 === 0) {
        renderTrails();
      }
    }
    renderAgents();

    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime > 1000) {
      fps = Math.round(frameCount / ((now - lastFpsTime) / 1000));
      frameCount = 0;
      lastFpsTime = now;
      document.getElementById('stats').textContent = `${fps} fps | ${agents.length} agents`;
    }

    requestAnimationFrame(animate);
  }

  // Event listeners
  document.getElementById('agentCount').addEventListener('input', (e) => {
    params.agentCount = parseInt(e.target.value);
    document.getElementById('agentVal').textContent = params.agentCount;
    // Adjust agent array
    while (agents.length < params.agentCount) {
      agents.push(createAgent());
    }
    while (agents.length > params.agentCount) {
      agents.pop();
    }
  });

  document.getElementById('speed').addEventListener('input', (e) => {
    params.moveSpeed = parseFloat(e.target.value);
  });

  document.getElementById('turnAngle').addEventListener('input', (e) => {
    params.turnAngle = parseInt(e.target.value) * Math.PI / 180;
  });

  document.getElementById('sensorDist').addEventListener('input', (e) => {
    params.sensorDist = parseInt(e.target.value);
  });

  document.getElementById('trailWeight').addEventListener('input', (e) => {
    params.trailWeight = parseFloat(e.target.value);
  });

  document.getElementById('fadeRate').addEventListener('input', (e) => {
    params.fadeRate = parseFloat(e.target.value);
  });

  document.getElementById('color1').addEventListener('input', (e) => {
    params.color1 = hexToRgb(e.target.value);
  });

  document.getElementById('color2').addEventListener('input', (e) => {
    params.color2 = hexToRgb(e.target.value);
  });

  document.getElementById('palette').addEventListener('change', (e) => {
    if (e.target.value !== 'custom') {
      const p = palettes[e.target.value];
      params.color1 = hexToRgb(p[0]);
      params.color2 = hexToRgb(p[1]);
      document.getElementById('color1').value = p[0];
      document.getElementById('color2').value = p[Math.floor(p.length / 2)];
    }
  });

  document.getElementById('resetBtn').addEventListener('click', reset);

  document.getElementById('pauseBtn').addEventListener('click', () => {
    paused = !paused;
    document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
    document.getElementById('pauseBtn').classList.toggle('active', paused);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    initTrailMap();
    trailCtx.fillStyle = '#0a0a0f';
    trailCtx.fillRect(0, 0, W, H);
  });

  // Mouse interaction — place food
  agentCanvas.addEventListener('mousedown', (e) => {
    const rect = agentCanvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
    mouseActive = true;
    
    // Add trail at mouse position to attract agents
    const radius = 30;
    for (let dy = -radius; dy <= radius; dy++) {
      for (let dx = -radius; dx <= radius; dx++) {
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < radius) {
          const px = Math.floor(mouseX + dx);
          const py = Math.floor(mouseY + dy);
          if (inBounds(px, py)) {
            trailMap[idx(px, py)] = Math.min(1, trailMap[idx(px, py)] + 0.8 * (1 - dist / radius));
          }
        }
      }
    }
  });

  agentCanvas.addEventListener('mousemove', (e) => {
    const rect = agentCanvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
  });

  window.addEventListener('mouseup', () => {
    mouseActive = false;
  });

  // Right click — obstacles (zero trail area)
  agentCanvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    const rect = agentCanvas.getBoundingClientRect();
    const mx = Math.floor(e.clientX - rect.left);
    const my = Math.floor(e.clientY - rect.top);
    const radius = 25;
    for (let dy = -radius; dy <= radius; dy++) {
      for (let dx = -radius; dx <= radius; dx++) {
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < radius) {
          const px = mx + dx;
          const py = my + dy;
          if (inBounds(px, py)) {
            trailMap[idx(px, py)] = 0;
          }
        }
      }
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      paused = !paused;
      document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
      document.getElementById('pauseBtn').classList.toggle('active', paused);
    }
    if (e.code === 'KeyR') {
      reset();
    }
    if (e.code === 'KeyC') {
      initTrailMap();
      trailCtx.fillStyle = '#0a0a0f';
      trailCtx.fillRect(0, 0, W, H);
    }
  });

  window.addEventListener('resize', () => {
    resize();
    reset();
  });

  // Init
  resize();
  reset();
  animate();
})();
</script>
</body>
</html>
