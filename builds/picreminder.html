<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PicReminder — Photo reminders for your future self</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top left, #1f1c2c, #0f0d12);
    color: #e6e6e6;
    min-height: 100vh;
  }
  .container {
    max-width: 980px;
    margin: 0 auto;
    padding: 24px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  h1 {
    margin: 0;
    font-size: 1.6rem;
    letter-spacing: 0.2px;
  }
  .subtitle {
    opacity: 0.7;
    font-size: 0.9rem;
  }
  .card {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 18px;
    backdrop-filter: blur(6px);
  }
  .row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  label {
    display: block;
    font-size: 0.78rem;
    opacity: 0.75;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(0, 0, 0, 0.25);
    color: #f5f5f5;
    outline: none;
    font-size: 0.95rem;
  }
  input:focus, textarea:focus {
    border-color: rgba(255, 255, 255, 0.35);
  }
  textarea {
    resize: vertical;
    min-height: 76px;
  }
  .file {
    position: relative;
    overflow: hidden;
    display: inline-block;
    width: 100%;
  }
  .file input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }
  .file-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px;
    border-radius: 10px;
    border: 1px dashed rgba(255, 255, 255, 0.25);
    color: #f5f5f5;
    background: rgba(255, 255, 255, 0.04);
    cursor: pointer;
    font-size: 0.9rem;
  }
  .preview {
    margin-top: 12px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .preview img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  button.primary {
    padding: 10px 14px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #ff8a65, #ff5e62);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button.ghost {
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.05);
    color: #f5f5f5;
    cursor: pointer;
  }
  .reminders {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .reminder {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    overflow: hidden;
  }
  .reminder img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
  }
  .reminder-body {
    padding: 12px;
  }
  .reminder-title {
    font-weight: 600;
    margin-bottom: 6px;
  }
  .reminder-meta {
    font-size: 0.82rem;
    opacity: 0.7;
  }
  .empty {
    opacity: 0.6;
    text-align: center;
    padding: 18px;
  }
  .toast {
    position: fixed;
    top: 16px;
    right: 16px;
    background: #1f1c2c;
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #f5f5f5;
    padding: 12px 14px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    max-width: 320px;
  }
  .muted {
    opacity: 0.65;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>PicReminder</h1>
        <div class="subtitle">Photo reminders for your future self</div>
      </div>
      <button class="ghost" id="notifyBtn">Enable notifications</button>
    </header>

    <section class="card">
      <div class="row">
        <div>
          <label>Photo</label>
          <div class="file">
            <div class="file-btn" id="fileLabel">Choose photo...</div>
            <input type="file" id="photo" accept="image/*" />
          </div>
          <div class="preview" id="preview"></div>
        </div>
        <div>
          <label>Reminder</label>
          <textarea id="note" placeholder="What should future-you remember?"></textarea>
        </div>
        <div>
          <label>When</label>
          <input type="datetime-local" id="when" />
          <div class="actions">
            <button class="primary" id="add">Add reminder</button>
            <button class="ghost" id="clearDone">Clear done</button>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <div>
          <strong>Upcoming</strong>
          <div class="muted">Active reminders stored locally in this browser.</div>
        </div>
        <div class="muted" id="count"></div>
      </div>
      <div class="reminders" id="reminders" style="margin-top:14px;"></div>
    </section>
  </div>

  <div class="toast" id="toast" style="display:none;"></div>

  <script>
    const STORAGE_KEY = 'picreminder.v1';
    const state = { reminders: [], selectedPhoto: null };

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) state.reminders = JSON.parse(raw);
      } catch {}
      render();
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.reminders));
      render();
    }

    function uid() {
      return `${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    }

    function toast(text) {
      const el = document.getElementById('toast');
      el.textContent = text;
      el.style.display = 'block';
      setTimeout(() => (el.style.display = 'none'), 2200);
    }

    async function requestNotificationPermission() {
      if (!('Notification' in window)) {
        toast('Notifications not supported in this browser');
        return;
      }
      const perm = await Notification.requestPermission();
      toast(perm === 'granted' ? 'Notifications enabled' : 'Notification permission denied');
      document.getElementById('notifyBtn').textContent =
        perm === 'granted' ? 'Notifications on' : 'Enable notifications';
    }

    function notify(title, body, image) {
      if (!('Notification' in window)) return;
      if (Notification.permission !== 'granted') return;
      try {
        new Notification(title, { body, icon: image || undefined, badge: image || undefined });
      } catch {
        toast(body);
      }
    }

    function addReminder() {
      const when = document.getElementById('when').value;
      const note = document.getElementById('note').value.trim();
      if (!when) return toast('Pick a date and time');
      if (!state.selectedPhoto) return toast('Choose a photo first');

      const reminder = {
        id: uid(),
        when,
        note: note || 'Remember this',
        photo: state.selectedPhoto,
        done: false,
        notified: false,
      };
      state.reminders.push(reminder);
      document.getElementById('note').value = '';
      save();
      toast('Reminder saved');
    }

    function toggleDone(id) {
      const r = state.reminders.find(x => x.id === id);
      if (r) r.done = !r.done;
      save();
    }

    function removeReminder(id) {
      state.reminders = state.reminders.filter(x => x.id !== id);
      save();
    }

    function clearDone() {
      state.reminders = state.reminders.filter(x => !x.done);
      save();
      toast('Cleared completed reminders');
    }

    function render() {
      const container = document.getElementById('reminders');
      const list = [...state.reminders].sort((a, b) => new Date(a.when) - new Date(b.when));
      document.getElementById('count').textContent = `${list.filter(x => !x.done).length} active`;

      if (!list.length) {
        container.innerHTML = '<div class="empty">No reminders yet. Add your first one above.</div>';
        return;
      }

      container.innerHTML = list
        .map(r => {
          const due = new Date(r.when);
          const overdue = !r.done && due < new Date();
          return `
            <div class="reminder" style="border-color:${r.done ? 'rgba(255,255,255,0.18)' : overdue ? 'rgba(255,94,98,0.45)' : 'rgba(255,255,255,0.08)'}">
              <img src="${r.photo}" alt="reminder" />
              <div class="reminder-body">
                <div class="reminder-title">${escapeHtml(r.note)}</div>
                <div class="reminder-meta">${formatDate(r.when)}${overdue ? ' • overdue' : ''}</div>
                <div class="actions" style="margin-top:10px;">
                  <button class="primary" onclick="window.__picReminder.toggle('${r.id}')">${r.done ? 'Undo' : 'Done'}</button>
                  <button class="ghost" onclick="window.__picReminder.remove('${r.id}')">Delete</button>
                </div>
              </div>
            </div>
          `;
        })
        .join('');
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function tick() {
      const now = new Date();
      let changed = false;
      for (const r of state.reminders) {
        if (r.done || r.notified) continue;
        const due = new Date(r.when);
        if (Number.isNaN(due.getTime())) continue;
        if (due <= now) {
          r.notified = true;
          changed = true;
          notify('PicReminder', r.note, r.photo);
        }
      }
      if (changed) save();
    }

    document.getElementById('photo').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        state.selectedPhoto = ev.target.result;
        document.getElementById('preview').innerHTML = `<img src="${state.selectedPhoto}" alt="chosen" />`;
        document.getElementById('fileLabel').textContent = file.name;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('add').addEventListener('click', addReminder);
    document.getElementById('clearDone').addEventListener('click', clearDone);
    document.getElementById('notifyBtn').addEventListener('click', requestNotificationPermission);

    window.__picReminder = {
      toggle: toggleDone,
      remove: removeReminder,
    };

    const defaultWhen = new Date();
    defaultWhen.setMinutes(defaultWhen.getMinutes() - defaultWhen.getTimezoneOffset() + 60);
    document.getElementById('when').value = defaultWhen.toISOString().slice(0, 16);

    load();
    setInterval(tick, 30000);
    tick();
  </script>
</body>
</html>
