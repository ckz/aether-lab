<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plasma Globe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    cursor: none;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }
  #ui {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 10;
    background: rgba(10, 10, 15, 0.8);
    padding: 10px 20px;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
  }
  .btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #aaa;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    transition: all 0.3s;
    letter-spacing: 1px;
  }
  .btn:hover {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border-color: rgba(255, 255, 255, 0.4);
  }
  .btn.active {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
    border-color: rgba(255, 255, 255, 0.6);
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
  }
  #info {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.4);
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 10;
    pointer-events: none;
  }
  #stats {
    position: fixed;
    top: 20px;
    right: 20px;
    color: rgba(255, 255, 255, 0.3);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    text-align: right;
    z-index: 10;
    pointer-events: none;
    line-height: 1.6;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="info">Plasma Globe</div>
<div id="stats"></div>
<div id="ui">
  <button class="btn active" data-palette="neon">Neon</button>
  <button class="btn" data-palette="aurora">Aurora</button>
  <button class="btn" data-palette="solar">Solar</button>
  <button class="btn" data-palette="toxic">Toxic</button>
  <button class="btn" data-palette="void">Void</button>
  <button class="btn" data-palette="gold">Gold</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const stats = document.getElementById('stats');

let W, H, cx, cy;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

// Palette definitions
const palettes = {
  neon: {
    colors: ['#ff00ff', '#ff44ff', '#ff88ff', '#ff00cc', '#ff66cc', '#cc00ff', '#ff33ff', '#ff99ff'],
    core: '#ffffff',
    glow: '#ff00ff',
    ambient: 'rgba(255, 0, 255, 0.03)'
  },
  aurora: {
    colors: ['#00ff88', '#00ffcc', '#00ffaa', '#00ccff', '#44ffaa', '#00ff66', '#66ffcc', '#00ffdd'],
    core: '#ffffff',
    glow: '#00ff88',
    ambient: 'rgba(0, 255, 136, 0.03)'
  },
  solar: {
    colors: ['#ff6600', '#ff8800', '#ffaa00', '#ff4400', '#ffcc00', '#ff5500', '#ff9900', '#ffbb00'],
    core: '#ffffcc',
    glow: '#ff8800',
    ambient: 'rgba(255, 136, 0, 0.03)'
  },
  toxic: {
    colors: ['#00ff00', '#00cc00', '#00ff44', '#00ff66', '#44ff00', '#00ff88', '#00aa00', '#33ff33'],
    core: '#ccffcc',
    glow: '#00ff00',
    ambient: 'rgba(0, 255, 0, 0.03)'
  },
  void: {
    colors: ['#8844ff', '#aa66ff', '#6622ff', '#cc88ff', '#9944ff', '#bb77ff', '#7733ff', '#dd99ff'],
    core: '#eeeeff',
    glow: '#8844ff',
    ambient: 'rgba(136, 68, 255, 0.03)'
  },
  gold: {
    colors: ['#ffaa00', '#ffcc00', '#ff8800', '#ffdd44', '#ffbb33', '#ffee66', '#ff9900', '#ffd700'],
    core: '#ffffcc',
    glow: '#ffaa00',
    ambient: 'rgba(255, 170, 0, 0.03)'
  }
};

let currentPalette = palettes.neon;
let paletteName = 'neon';

// Mouse state
let mouse = { x: cx, y: cy, active: false, down: false };
let target = { x: cx, y: cy };
let smoothTarget = { x: cx, y: cy };

// Filaments
const filaments = [];
const particles = [];
const MAX_FILAMENTS = 12;
const MAX_PARTICLES = 100;

// Electrode
const electrode = { x: 0, y: 0, radius: 20, pulse: 0 };

// Branching lightning generator
function generateBranch(startX, startY, endX, endY, depth, maxDepth, branchProb) {
  if (depth > maxDepth) return [];
  
  const dx = endX - startX;
  const dy = endY - startY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  
  if (dist < 5) return [];
  
  const segments = Math.floor(dist / 8);
  const points = [{ x: startX, y: startY }];
  
  let x = startX, y = startY;
  for (let i = 1; i <= segments; i++) {
    const t = i / segments;
    const baseX = startX + dx * t;
    const baseY = startY + dy * t;
    
    // Jitter perpendicular to direction
    const perpX = -dy / dist;
    const perpY = dx / dist;
    const jitter = (Math.random() - 0.5) * 30 * (1 - t * 0.5);
    
    x = baseX + perpX * jitter;
    y = baseY + perpY * jitter;
    
    points.push({ x, y });
    
    // Branch
    if (depth < maxDepth && Math.random() < branchProb * (1 - t * 0.7)) {
      const branchAngle = (Math.random() - 0.5) * Math.PI * 0.8;
      const branchLen = dist * (0.2 + Math.random() * 0.3) * (1 - depth / maxDepth);
      const dirX = dx / dist;
      const dirY = dy / dist;
      
      const bx = x + Math.cos(branchAngle) * branchLen * 0.5 + dirX * branchLen * 0.5;
      const by = y + Math.sin(branchAngle) * branchLen * 0.5 + dirY * branchLen * 0.5;
      
      const branches = generateBranch(x, y, bx, by, depth + 1, maxDepth, branchProb * 0.7);
      points.push(...branches);
    }
  }
  
  points.push({ x: endX, y: endY });
  return points;
}

function createFilament(targetX, targetY) {
  const dx = targetX - cx;
  const dy = targetY - cy;
  const dist = Math.sqrt(dx * dx + dy * dy);
  
  if (dist < 30) return;
  
  const maxDepth = 3 + Math.floor(Math.random() * 2);
  const branchProb = 0.15 + Math.random() * 0.2;
  
  const points = generateBranch(cx, cy, targetX, targetY, 0, maxDepth, branchProb);
  
  const palette = currentPalette;
  const color = palette.colors[Math.floor(Math.random() * palette.colors.length)];
  
  filaments.push({
    points,
    color,
    alpha: 1,
    life: 1,
    decay: 0.015 + Math.random() * 0.02,
    width: 1.5 + Math.random() * 1.5,
    endX: targetX,
    endY: targetY
  });
  
  // Spawn particles at end point
  for (let i = 0; i < 5; i++) {
    particles.push({
      x: targetX + (Math.random() - 0.5) * 20,
      y: targetY + (Math.random() - 0.5) * 20,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      life: 1,
      decay: 0.03 + Math.random() * 0.03,
      color: palette.colors[Math.floor(Math.random() * palette.colors.length)],
      size: 1 + Math.random() * 2
    });
  }
  
  // Spawn particles at center
  for (let i = 0; i < 3; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = Math.random() * 15;
    particles.push({
      x: cx + Math.cos(angle) * r,
      y: cy + Math.sin(angle) * r,
      vx: Math.cos(angle) * 1.5,
      vy: Math.sin(angle) * 1.5,
      life: 1,
      decay: 0.04 + Math.random() * 0.03,
      color: palette.core,
      size: 1 + Math.random() * 1.5
    });
  }
  
  // Limit filaments
  while (filaments.length > MAX_FILAMENTS) {
    filaments.shift();
  }
}

// Draw functions
function drawElectrode() {
  const pulse = Math.sin(electrode.pulse) * 0.3 + 0.7;
  const glowRadius = electrode.radius * (2 + pulse);
  
  // Outer glow
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowRadius * 3);
  glow.addColorStop(0, currentPalette.glow + '40');
  glow.addColorStop(0.3, currentPalette.glow + '20');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, glowRadius * 3, 0, Math.PI * 2);
  ctx.fill();
  
  // Core
  const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, electrode.radius);
  core.addColorStop(0, currentPalette.core);
  core.addColorStop(0.3, currentPalette.glow + 'aa');
  core.addColorStop(1, currentPalette.glow + '00');
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(cx, cy, electrode.radius, 0, Math.PI * 2);
  ctx.fill();
  
  // Bright center
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(cx, cy, electrode.radius * 0.3, 0, Math.PI * 2);
  ctx.fill();
}

function drawFilament(f) {
  if (f.points.length < 2) return;
  
  ctx.globalAlpha = f.alpha * f.life;
  ctx.strokeStyle = f.color;
  ctx.lineWidth = f.width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  
  // Glow
  ctx.shadowBlur = 15;
  ctx.shadowColor = f.color;
  
  ctx.beginPath();
  ctx.moveTo(f.points[0].x, f.points[0].y);
  for (let i = 1; i < f.points.length; i++) {
    ctx.lineTo(f.points[i].x, f.points[i].y);
  }
  ctx.stroke();
  
  // Thinner bright core
  ctx.shadowBlur = 5;
  ctx.lineWidth = f.width * 0.4;
  ctx.strokeStyle = '#ffffff';
  ctx.globalAlpha = f.alpha * f.life * 0.6;
  ctx.stroke();
  
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

function drawParticles() {
  particles.forEach(p => {
    if (p.life <= 0) return;
    ctx.globalAlpha = p.life * 0.8;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

function drawAmbientGlow() {
  // Mouse position ambient glow
  if (mouse.active) {
    const glow = ctx.createRadialGradient(smoothTarget.x, smoothTarget.y, 0, smoothTarget.x, smoothTarget.y, 150);
    glow.addColorStop(0, currentPalette.ambient);
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(smoothTarget.x, smoothTarget.y, 150, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
  ctx.lineWidth = 1;
  const gridSize = 50;
  
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

// Event handlers
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
  target.x = e.clientX;
  target.y = e.clientY;
});

canvas.addEventListener('mousedown', () => {
  mouse.down = true;
});

canvas.addEventListener('mouseup', () => {
  mouse.down = false;
});

canvas.addEventListener('mouseleave', () => {
  mouse.active = false;
});

canvas.addEventListener('mouseenter', e => {
  mouse.active = true;
  target.x = e.clientX;
  target.y = e.clientY;
});

// Touch support
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const touch = e.touches[0];
  mouse.x = touch.clientX;
  mouse.y = touch.clientY;
  mouse.active = true;
  mouse.down = true;
  target.x = touch.clientX;
  target.y = touch.clientY;
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const touch = e.touches[0];
  mouse.x = touch.clientX;
  mouse.y = touch.clientY;
  target.x = touch.clientX;
  target.y = touch.clientY;
});

canvas.addEventListener('touchend', e => {
  mouse.down = false;
  mouse.active = false;
});

// Palette buttons
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    paletteName = btn.dataset.palette;
    currentPalette = palettes[paletteName];
  });
});

// Auto ambient filaments
let autoTimer = 0;
function autoFilament() {
  if (!mouse.active && Math.random() < 0.03) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 150;
    const tx = cx + Math.cos(angle) * dist;
    const ty = cy + Math.sin(angle) * dist;
    createFilament(tx, ty);
  }
}

// Main loop
let lastTime = Date.now();
let frameCount = 0;
let fps = 0;
let fpsTimer = Date.now();

function update() {
  const now = Date.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  
  // FPS
  frameCount++;
  if (now - fpsTimer > 1000) {
    fps = frameCount;
    frameCount = 0;
    fpsTimer = now;
    stats.textContent = `FPS: ${fps}\nFilaments: ${filaments.length}\nParticles: ${particles.filter(p => p.life > 0).length}`;
  }
  
  // Smooth target
  smoothTarget.x += (target.x - smoothTarget.x) * 0.1;
  smoothTarget.y += (target.y - smoothTarget.y) * 0.1;
  
  // Pulse electrode
  electrode.pulse += 0.05;
  
  // Create filaments when mouse is active
  if (mouse.active && (mouse.down || Math.random() < 0.1)) {
    const dx = smoothTarget.x - cx;
    const dy = smoothTarget.y - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist > 30) {
      const jitterX = (Math.random() - 0.5) * 40;
      const jitterY = (Math.random() - 0.5) * 40;
      createFilament(smoothTarget.x + jitterX, smoothTarget.y + jitterY);
    }
  }
  
  // Auto filaments
  autoFilament();
  
  // Update filaments
  for (let i = filaments.length - 1; i >= 0; i--) {
    const f = filaments[i];
    f.life -= f.decay;
    if (f.life <= 0) {
      filaments.splice(i, 1);
    }
  }
  
  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.98;
    p.vy *= 0.98;
    p.life -= p.decay;
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
  
  // Limit particles
  while (particles.length > MAX_PARTICLES) {
    particles.shift();
  }
}

function draw() {
  // Semi-transparent overlay for trail effect
  ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
  ctx.fillRect(0, 0, W, H);
  
  drawAmbientGlow();
  drawGrid();
  
  // Draw filaments
  filaments.forEach(drawFilament);
  
  // Draw particles
  drawParticles();
  
  // Draw electrode on top
  drawElectrode();
  
  // Draw cursor
  if (mouse.active) {
    ctx.strokeStyle = currentPalette.glow + '60';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(smoothTarget.x, smoothTarget.y, 10, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Initialize with a few filaments
setTimeout(() => {
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2;
    const dist = 100 + Math.random() * 50;
    createFilament(cx + Math.cos(angle) * dist, cy + Math.sin(angle) * dist);
  }
}, 500);

loop();

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  const keys = Object.keys(palettes);
  const num = parseInt(e.key);
  if (num >= 1 && num <= keys.length) {
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-palette="${keys[num - 1]}"]`).classList.add('active');
    paletteName = keys[num - 1];
    currentPalette = palettes[paletteName];
  }
  if (e.key === 'c' || e.key === 'C') {
    ctx.fillStyle = 'rgba(10, 10, 15, 1)';
    ctx.fillRect(0, 0, W, H);
  }
});
</script>
</body>
</html>
