<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prismatic Tides</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050510;
    font-family: 'Segoe UI', system-ui, sans-serif;
    cursor: crosshair;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .overlay {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    text-align: center;
    text-shadow: 0 0 10px rgba(100, 150, 255, 0.5);
  }
  .palette-name {
    position: fixed;
    bottom: 20px;
    right: 20px;
    color: rgba(255,255,255,0.4);
    font-size: 10px;
    letter-spacing: 1px;
    pointer-events: none;
    text-transform: uppercase;
  }
  .controls {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 8px;
  }
  .controls button {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.6);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .controls button:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border-color: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="overlay">✦ Prismatic Tides — Move mouse to sculpt light ✦</div>
  <div class="palette-name" id="paletteName">Aurora</div>
  <div class="controls">
    <button id="paletteBtn">Palette</button>
    <button id="pauseBtn">Pause</button>
    <button id="saveBtn">Save PNG</button>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height, dpr;
let time = 0;
let paused = false;
let mouse = { x: 0.5, y: 0.5, active: false };
let currentPalette = 0;

const palettes = [
  { name: 'Aurora', colors: ['#00ff87', '#00d4ff', '#7b2ff7', '#ff2d95', '#00ff87'] },
  { name: 'Ember', colors: ['#ff4500', '#ff8c00', '#ffd700', '#ff6b6b', '#ff4500'] },
  { name: 'Ocean', colors: ['#0077b6', '#00b4d8', '#90e0ef', '#48cae4', '#0077b6'] },
  { name: 'Neon', colors: ['#ff00ff', '#00ffff', '#ff0080', '#80ff00', '#ff00ff'] },
  { name: 'Void', colors: ['#1a1a2e', '#16213e', '#0f3460', '#e94560', '#1a1a2e'] },
];

function resize() {
  dpr = window.devicePixelRatio || 1;
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  ctx.scale(dpr, dpr);
}

window.addEventListener('resize', resize);
resize();

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX / width;
  mouse.y = e.clientY / height;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => {
  mouse.active = false;
});

canvas.addEventListener('click', (e) => {
  // Burst of energy on click
  burst(e.clientX, e.clientY);
});

document.getElementById('paletteBtn').addEventListener('click', () => {
  currentPalette = (currentPalette + 1) % palettes.length;
  document.getElementById('paletteName').textContent = palettes[currentPalette].name;
});

document.getElementById('pauseBtn').addEventListener('click', function() {
  paused = !paused;
  this.textContent = paused ? 'Play' : 'Pause';
});

document.getElementById('saveBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'prismatic-tides.png';
  link.href = canvas.toDataURL();
  link.click();
});

let bursts = [];

function burst(x, y) {
  for (let i = 0; i < 30; i++) {
    bursts.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      life: 1,
      decay: 0.01 + Math.random() * 0.02,
      size: 1 + Math.random() * 2
    });
  }
}

// Simplex-like noise approximation
function noise(x, y, z) {
  const X = Math.floor(x) & 255;
  const Y = Math.floor(y) & 255;
  const Z = Math.floor(z) & 255;
  x -= Math.floor(x);
  y -= Math.floor(y);
  z -= Math.floor(z);
  const u = x * x * (3 - 2 * x);
  const v = y * y * (3 - 2 * y);
  const w = z * z * (3 - 2 * z);
  const a = (X + Y * 57 + Z * 131) * 0.0001;
  const b = (X + 1 + Y * 57 + Z * 131) * 0.0001;
  const c = (X + (Y + 1) * 57 + Z * 131) * 0.0001;
  const d = (X + 1 + (Y + 1) * 57 + Z * 131) * 0.0001;
  const e = (X + Y * 57 + (Z + 1) * 131) * 0.0001;
  const f = (X + 1 + Y * 57 + (Z + 1) * 131) * 0.0001;
  const g = (X + (Y + 1) * 57 + (Z + 1) * 131) * 0.0001;
  const h = (X + 1 + (Y + 1) * 57 + (Z + 1) * 131) * 0.0001;
  const k = Math.sin;
  return Math.sin(k(a + u * (b - a)) * 6.28) * (1 - w) +
         Math.sin(k(e + u * (f - e)) * 6.28) * w;
}

function getWaveHeight(x, y, t, palette) {
  const scale = 0.003;
  const n1 = noise(x * scale, y * scale, t * 0.3);
  const n2 = noise(x * scale * 2 + 100, y * scale * 2 + 100, t * 0.5) * 0.5;
  const n3 = noise(x * scale * 0.5 + 200, y * scale * 0.5 + 200, t * 0.2) * 0.3;
  
  // Mouse influence
  let mouseInfluence = 0;
  if (mouse.active) {
    const dx = x / width - mouse.x;
    const dy = y / height - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    mouseInfluence = Math.max(0, 1 - dist * 3) * 0.5;
  }
  
  return (n1 + n2 + n3) * 0.5 + mouseInfluence * Math.sin(t * 2 + dist * 10);
}

function getColor(value, t, palette) {
  const colors = palette.colors;
  const t2 = (Math.sin(t * 0.1) + 1) * 0.5;
  const idx = ((value + 1) * 0.5 + t2) % 1;
  const i = Math.floor(idx * (colors.length - 1));
  const f = (idx * (colors.length - 1)) % 1;
  
  const c1 = hexToRgb(colors[i]);
  const c2 = hexToRgb(colors[Math.min(i + 1, colors.length - 1)]);
  
  return {
    r: c1.r + (c2.r - c1.r) * f,
    g: c1.g + (c2.g - c1.g) * f,
    b: c1.b + (c2.b - c1.b) * f
  };
}

function hexToRgb(hex) {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? {
    r: parseInt(result[1], 16),
    g: parseInt(result[2], 16),
    b: parseInt(result[3], 16)
  } : { r: 0, g: 0, b: 0 };
}

function draw() {
  if (!paused) {
    time += 0.016;
  }
  
  const palette = palettes[currentPalette];
  
  // Semi-transparent background for trails
  ctx.fillStyle = 'rgba(5, 5, 16, 0.15)';
  ctx.fillRect(0, 0, width, height);
  
  const gridSize = 20;
  const cols = Math.ceil(width / gridSize) + 1;
  const rows = Math.ceil(height / gridSize) + 1;
  
  // Draw wave mesh
  ctx.lineWidth = 1;
  
  for (let i = 0; i < cols - 1; i++) {
    for (let j = 0; j < rows - 1; j++) {
      const x = i * gridSize;
      const y = j * gridSize;
      
      const h1 = getWaveHeight(x, y, time, palette);
      const h2 = getWaveHeight(x + gridSize, y, time, palette);
      const h3 = getWaveHeight(x, y + gridSize, time, palette);
      
      const alpha = Math.max(0, Math.min(1, (h1 + 1) * 0.3));
      const color = getColor(h1, time, palette);
      
      ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha * 0.5})`;
      ctx.beginPath();
      ctx.moveTo(x, y + h1 * 15);
      ctx.lineTo(x + gridSize, y + h2 * 15);
      ctx.stroke();
      
      ctx.beginPath();
      ctx.moveTo(x, y + h1 * 15);
      ctx.lineTo(x, y + gridSize + h3 * 15);
      ctx.stroke();
    }
  }
  
  // Draw particles
  const numParticles = 50;
  for (let i = 0; i < numParticles; i++) {
    const seed = i * 137.508;
    const px = (Math.sin(seed + time * 0.2) * 0.5 + 0.5) * width;
    const py = (Math.cos(seed * 1.3 + time * 0.3) * 0.5 + 0.5) * height;
    const h = getWaveHeight(px, py, time, palette);
    const color = getColor(h, time, palette);
    const size = 1 + Math.abs(h) * 2;
    
    ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, 0.6)`;
    ctx.beginPath();
    ctx.arc(px, py + h * 15, size, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Draw bursts
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    b.x += b.vx;
    b.y += b.vy;
    b.life -= b.decay;
    
    if (b.life <= 0) {
      bursts.splice(i, 1);
      continue;
    }
    
    const color = getColor(b.life, time, palette);
    ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${b.life})`;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size * b.life, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Mouse glow
  if (mouse.active) {
    const gradient = ctx.createRadialGradient(
      mouse.x * width, mouse.y * height, 0,
      mouse.x * width, mouse.y * height, 150
    );
    const color = getColor(Math.sin(time), time, palette);
    gradient.addColorStop(0, `rgba(${color.r}, ${color.g}, ${color.b}, 0.15)`);
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
  }
  
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
