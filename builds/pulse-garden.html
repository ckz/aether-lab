<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Garden — Aether Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #020208;
    overflow: hidden;
    height: 100%;
    font-family: 'Courier New', monospace;
    color: #aab;
  }
  canvas { display: block; cursor: crosshair; }
  .ui {
    position: fixed;
    top: 20px;
    left: 24px;
    z-index: 10;
    pointer-events: none;
  }
  .ui h1 {
    font-size: 0.85rem;
    font-weight: normal;
    letter-spacing: 0.3em;
    color: #88aacc;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .ui p {
    font-size: 0.65rem;
    opacity: 0.5;
    letter-spacing: 0.15em;
    line-height: 1.6;
  }
  .stats {
    position: fixed;
    bottom: 20px;
    right: 24px;
    font-size: 0.6rem;
    opacity: 0.4;
    letter-spacing: 0.1em;
    text-align: right;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="ui">
  <h1>Pulse Garden</h1>
  <p>Move to guide the wind<br>Click to plant seeds<br>Hold to accelerate bloom</p>
</div>
<div class="stats" id="stats"></div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const mouse = { x: W / 2, y: H / 2, down: false, active: false };
window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
window.addEventListener('mousedown', () => { mouse.down = true; });
window.addEventListener('mouseup', () => { mouse.down = false; });
window.addEventListener('mouseleave', () => { mouse.active = false; });
window.addEventListener('touchmove', e => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
  mouse.down = true;
}, { passive: false });
window.addEventListener('touchstart', e => {
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
  mouse.down = true;
});
window.addEventListener('touchend', () => { mouse.down = false; });

const PALETTES = [
  { name: 'biolum', bg: [2, 2, 12], hues: [140, 180, 220, 280, 320] },
  { name: 'autumn', bg: [12, 8, 4], hues: [20, 35, 45, 55, 15] },
  { name: 'arctic', bg: [4, 8, 14], hues: [190, 210, 230, 250, 200] },
  { name: 'sakura', bg: [14, 6, 10], hues: [330, 340, 350, 320, 310] },
  { name: 'amber', bg: [10, 7, 2], hues: [35, 42, 48, 28, 55] },
  { name: 'void', bg: [2, 2, 8], hues: [260, 280, 300, 240, 320] }
];

let currentPalette = 0;
let flowers = [];
let pollinators = [];
let spores = [];

class Flower {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.petals = Math.floor(6 + Math.random() * 8);
    this.radius = 0;
    this.maxRadius = 20 + Math.random() * 50;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.005;
    this.hue = PALETTES[currentPalette].hues[Math.floor(Math.random() * 5)];
    this.phase = Math.random() * Math.PI * 2;
    this.life = 0;
    this.maxLife = 600 + Math.random() * 400;
    this.growSpeed = 0.3 + Math.random() * 0.7;
    this.pulseSpeed = 0.02 + Math.random() * 0.03;
    this.depth = 0.3 + Math.random() * 0.7;
    this.innerPetals = Math.random() > 0.5 ? Math.floor(3 + Math.random() * 4) : 0;
    this.centerR = 0;
    this.stemHeight = 0;
    this.stemMax = 30 + Math.random() * 80;
    this.born = performance.now();
  }

  update(windX, windY) {
    this.life++;
    this.rotation += this.rotSpeed;
    this.phase += this.pulseSpeed;

    if (this.life < 120) {
      this.radius += (this.maxRadius - this.radius) * 0.03 * this.growSpeed;
      this.stemHeight += (this.stemMax - this.stemHeight) * 0.02;
    }

    if (mouse.down && mouse.active) {
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 200) {
        const force = (200 - dist) / 200;
        this.radius += force * 2 * this.growSpeed;
        this.phase += force * 0.1;
      }
    }

    const age = this.life / this.maxLife;
    if (age > 0.8) {
      this.radius *= 0.995;
    }
    return this.life < this.maxLife && this.radius > 0.5;
  }

  draw(ctx, time) {
    const alpha = Math.min(1, this.life / 60) * Math.min(1, (this.maxLife - this.life) / 60);
    const pulse = 1 + Math.sin(this.phase) * 0.08;
    const r = this.radius * pulse;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.globalAlpha = alpha * 0.6;

    // Stem
    if (this.stemHeight > 0) {
      ctx.strokeStyle = `hsla(${this.hue - 20}, 30%, 25%, ${alpha * 0.4})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(
        -5, -this.stemHeight * 0.3,
        5, -this.stemHeight * 0.7,
        0, -this.stemHeight
      );
      ctx.stroke();
    }

    ctx.translate(0, -this.stemHeight);

    // Outer petals
    for (let i = 0; i < this.petals; i++) {
      const angle = (i / this.petals) * Math.PI * 2;
      ctx.save();
      ctx.rotate(angle);
      const grad = ctx.createRadialGradient(r * 0.6, 0, 0, r * 0.6, 0, r);
      grad.addColorStop(0, `hsla(${this.hue}, 70%, 70%, ${alpha * 0.5})`);
      grad.addColorStop(0.5, `hsla(${this.hue + 20}, 60%, 55%, ${alpha * 0.3})`);
      grad.addColorStop(1, `hsla(${this.hue}, 50%, 40%, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(r * 0.6, 0, r * 0.9, r * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Inner petals
    if (this.innerPetals > 0) {
      for (let i = 0; i < this.innerPetals; i++) {
        const angle = (i / this.innerPetals) * Math.PI * 2 + Math.PI / this.innerPetals;
        ctx.save();
        ctx.rotate(angle);
        const grad = ctx.createRadialGradient(r * 0.25, 0, 0, r * 0.25, 0, r * 0.55);
        grad.addColorStop(0, `hsla(${this.hue + 40}, 80%, 80%, ${alpha * 0.6})`);
        grad.addColorStop(1, `hsla(${this.hue}, 70%, 60%, 0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(r * 0.25, 0, r * 0.55, r * 0.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Center
    const cGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.2);
    cGrad.addColorStop(0, `hsla(${this.hue + 60}, 90%, 90%, ${alpha * 0.9})`);
    cGrad.addColorStop(1, `hsla(${this.hue}, 80%, 60%, 0)`);
    ctx.fillStyle = cGrad;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

class Pollinator {
  constructor(x, y) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = (Math.random() - 0.5) * 1.5;
    this.life = 300 + Math.random() * 500;
    this.age = 0;
    this.size = 1.5 + Math.random() * 2;
    this.hue = PALETTES[currentPalette].hues[Math.floor(Math.random() * 5)];
    this.wander = 0;
  }

  update() {
    this.age++;

    // Wind from mouse
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 5) {
        const force = Math.min(0.3, 50 / (dist + 1));
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }
    }

    // Wander
    this.wander += 0.02;
    this.vx += Math.sin(this.wander) * 0.05;
    this.vy += Math.cos(this.wander * 1.3) * 0.05;

    // Damping
    this.vx *= 0.99;
    this.vy *= 0.99;

    // Speed limit
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed > 3) {
      this.vx = (this.vx / speed) * 3;
      this.vy = (this.vy / speed) * 3;
    }

    this.x += this.vx;
    this.y += this.vy;

    // Wrap
    if (this.x < -20) this.x = W + 20;
    if (this.x > W + 20) this.x = -20;
    if (this.y < -20) this.y = H + 20;
    if (this.y > H + 20) this.y = -20;

    return this.age < this.life;
  }

  draw(ctx) {
    const alpha = Math.sin((this.age / this.life) * Math.PI) * 0.8;
    const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
    glow.addColorStop(0, `hsla(${this.hue}, 80%, 70%, ${alpha})`);
    glow.addColorStop(1, `hsla(${this.hue}, 80%, 50%, 0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `hsla(${this.hue}, 90%, 85%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Spore {
  constructor(x, y, hue) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = -0.3 - Math.random() * 0.8;
    this.life = 200 + Math.random() * 300;
    this.age = 0;
    this.size = 0.8 + Math.random() * 1.5;
    this.hue = hue || PALETTES[currentPalette].hues[Math.floor(Math.random() * 5)];
    this.drift = Math.random() * Math.PI * 2;
  }

  update() {
    this.age++;
    this.drift += 0.03;
    this.vx += Math.sin(this.drift) * 0.02;
    this.vy += Math.cos(this.drift * 0.7) * 0.01;
    this.vx *= 0.99;
    this.vy *= 0.99;
    this.x += this.vx;
    this.y += this.vy;
    if (this.y < -20) this.y = H + 20;
    if (this.x < -20) this.x = W + 20;
    if (this.x > W + 20) this.x = -20;
    return this.age < this.life;
  }

  draw(ctx) {
    const alpha = Math.sin((this.age / this.life) * Math.PI) * 0.6;
    ctx.fillStyle = `hsla(${this.hue}, 70%, 70%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Seed initial garden
for (let i = 0; i < 8; i++) {
  flowers.push(new Flower(
    100 + Math.random() * (W - 200),
    100 + Math.random() * (H - 200)
  ));
}
for (let i = 0; i < 30; i++) {
  pollinators.push(new Pollinator());
}

let lastSpawn = 0;
let frameCount = 0;
let lastTime = performance.now();
const statsEl = document.getElementById('stats');

function loop(time) {
  const dt = Math.min(32, time - lastTime);
  lastTime = time;
  frameCount++;

  const windX = mouse.active ? (mouse.x - W / 2) * 0.0003 : 0;
  const windY = mouse.active ? (mouse.y - H / 2) * 0.0003 : 0;

  // Click to plant
  if (mouse.down && mouse.active && frameCount % 8 === 0) {
    flowers.push(new Flower(mouse.x + (Math.random() - 0.5) * 30, mouse.y + (Math.random() - 0.5) * 30));
    for (let i = 0; i < 5; i++) {
      spores.push(new Spore(mouse.x, mouse.y, PALETTES[currentPalette].hues[Math.floor(Math.random() * 5)]));
    }
  }

  // Spawn pollinators
  if (time - lastSpawn > 2000 && pollinators.length < 60) {
    pollinators.push(new Pollinator());
    lastSpawn = time;
  }

  // Spawn ambient spores near flowers
  if (frameCount % 30 === 0 && flowers.length > 0 && spores.length < 150) {
    const f = flowers[Math.floor(Math.random() * flowers.length)];
    spores.push(new Spore(f.x + (Math.random() - 0.5) * 40, f.y - f.stemHeight + (Math.random() - 0.5) * 40, f.hue));
  }

  // Draw background with fade
  const bg = PALETTES[currentPalette].bg;
  ctx.fillStyle = `rgb(${bg[0]}, ${bg[1]}, ${bg[2]})`;
  ctx.fillRect(0, 0, W, H);

  // Update & draw spores
  spores = spores.filter(s => {
    const alive = s.update();
    if (alive) s.draw(ctx);
    return alive;
  });

  // Update & draw flowers (sorted by depth for pseudo-3d)
  flowers = flowers.filter(f => {
    const alive = f.update(windX, windY);
    if (alive) return true;
    // Spawn spores on death
    for (let i = 0; i < 10; i++) {
      spores.push(new Spore(f.x, f.y - f.stemHeight, f.hue));
    }
    return false;
  });
  flowers.sort((a, b) => a.depth - b.depth);
  flowers.forEach(f => f.draw(ctx, time));

  // Update & draw pollinators
  pollinators = pollinators.filter(p => {
    const alive = p.update();
    if (alive) p.draw(ctx);
    return alive;
  });

  // Stats
  if (frameCount % 30 === 0) {
    statsEl.textContent = `${flowers.length} flowers · ${pollinators.length} pollinators · ${spores.length} spores`;
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Switch palette with keys 1-6
window.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '6') {
    currentPalette = parseInt(e.key) - 1;
  }
});
</script>
</body>
</html>
