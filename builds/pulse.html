<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse — A Timing Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #05050a;
    color: #e0e0e0;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  #canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    z-index: 1;
  }

  #ui {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    padding: 1.5rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 10;
    pointer-events: none;
  }

  #ui > * { pointer-events: auto; }

  .hud {
    background: rgba(10, 10, 20, 0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    min-width: 140px;
  }

  .hud-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #666;
    margin-bottom: 0.25rem;
  }

  .hud-value {
    font-size: 1.8rem;
    font-weight: 300;
    color: #fff;
    line-height: 1;
  }

  .hud-value.combo {
    color: #ffcc00;
  }

  .center-message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 20;
    pointer-events: none;
  }

  .center-message h1 {
    font-size: 3.5rem;
    font-weight: 200;
    letter-spacing: 0.3em;
    color: #fff;
    margin-bottom: 0.5rem;
    text-transform: uppercase;
  }

  .center-message p {
    font-size: 0.9rem;
    color: #666;
    letter-spacing: 0.1em;
  }

  .start-btn {
    margin-top: 2rem;
    padding: 1rem 3rem;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    color: #fff;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    pointer-events: auto;
    transition: all 0.3s ease;
  }

  .start-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.4);
    transform: scale(1.05);
  }

  .feedback {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    z-index: 15;
    pointer-events: none;
    text-shadow: 0 0 30px currentColor;
    transition: transform 0.1s ease-out, opacity 0.4s ease;
  }

  .feedback.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  .feedback.fade {
    transform: translate(-50%, -80%) scale(1.2);
    opacity: 0;
  }

  .footer-hint {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    color: #333;
    letter-spacing: 0.1em;
    z-index: 10;
    text-align: center;
  }

  .hidden { display: none !important; }

  .game-over-stats {
    margin-top: 1.5rem;
    display: grid;
    gap: 0.75rem;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    gap: 2rem;
    font-size: 0.85rem;
    color: #888;
  }

  .stat-row span:last-child {
    color: #fff;
    font-weight: 500;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="startScreen" class="center-message">
  <h1>Pulse</h1>
  <p>Timing is everything. Click the ring when it meets the zone.</p>
  <button class="start-btn" onclick="startGame()">Begin</button>
  <div class="game-over-stats hidden" id="startStats"></div>
</div>

<div id="gameOverScreen" class="center-message hidden">
  <h1>Pulse</h1>
  <p id="gameOverText">Session complete</p>
  <div class="game-over-stats" id="finalStats"></div>
  <button class="start-btn" onclick="startGame()" style="margin-top: 1.5rem;">Again</button>
</div>

<div id="ui" class="hidden">
  <div class="hud">
    <div class="hud-label">Score</div>
    <div class="hud-value" id="scoreDisplay">0</div>
  </div>
  <div class="hud">
    <div class="hud-label">Combo</div>
    <div class="hud-value combo" id="comboDisplay">×1</div>
  </div>
  <div class="hud">
    <div class="hud-label">Round</div>
    <div class="hud-value" id="roundDisplay">1</div>
  </div>
  <div class="hud">
    <div class="hud-label">Lives</div>
    <div class="hud-value" id="livesDisplay">❤️❤️❤️</div>
  </div>
</div>

<div class="feedback" id="feedback"></div>
<div class="footer-hint hidden" id="footerHint">Click or tap the shrinking ring when it meets the target zone</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Game state
let state = 'menu'; // menu, playing, gameover
let score = 0;
let combo = 1;
let maxCombo = 1;
let round = 1;
let lives = 3;
let rings = [];
let particles = [];
let targetZone;
let ringIdCounter = 0;
let spawnTimer = 0;
let spawnInterval = 120; // frames
let shakeAmount = 0;
let bestScore = parseInt(localStorage.getItem('pulse-best') || '0');

// Difficulty curve
function getDifficulty() {
  return {
    shrinkSpeed: 0.008 + round * 0.0015,
    spawnInterval: Math.max(50, 120 - round * 8),
    zoneSize: Math.max(8, 18 - round * 0.8),
    ringStartSize: Math.min(Math.max(120, 200 - round * 5), 300)
  };
}

class Ring {
  constructor() {
    this.id = ringIdCounter++;
    this.x = 80 + Math.random() * (W - 160);
    this.y = 80 + Math.random() * (H - 160);
    this.radius = getDifficulty().ringStartSize;
    this.targetRadius = getDifficulty().zoneSize;
    this.shrinkSpeed = getDifficulty().shrinkSpeed * (0.8 + Math.random() * 0.4);
    this.alive = true;
    this.hue = (this.id * 47 + round * 30) % 360;
    this.pulsePhase = 0;
    this.clicked = false;
    this.missed = false;
  }

  update() {
    if (this.clicked) return;
    this.radius -= this.shrinkSpeed * 60;
    this.pulsePhase += 0.05;

    if (this.radius <= this.targetRadius && !this.missed) {
      this.missed = true;
      missRing(this);
    }

    if (this.radius <= 0) {
      this.alive = false;
    }
  }

  draw() {
    if (!this.alive) return;

    const dist = Math.abs(this.radius - this.targetRadius);
    const inZone = dist < this.targetRadius * 0.6;
    const pulse = 1 + Math.sin(this.pulsePhase) * 0.05;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(pulse, pulse);

    // Zone glow
    if (inZone && !this.clicked) {
      const zoneGrad = ctx.createRadialGradient(0, 0, this.targetRadius * 0.5, 0, 0, this.targetRadius * 2);
      zoneGrad.addColorStop(0, `hsla(${this.hue}, 80%, 60%, 0.15)`);
      zoneGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = zoneGrad;
      ctx.beginPath();
      ctx.arc(0, 0, this.targetRadius * 2, 0, Math.PI * 2);
      ctx.fill();
    }

    // Zone indicator
    ctx.strokeStyle = inZone 
      ? `hsla(${this.hue}, 80%, 70%, 0.4)` 
      : `hsla(${this.hue}, 40%, 50%, 0.15)`;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.arc(0, 0, this.targetRadius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Main ring
    const alpha = this.clicked ? 0 : (0.7 + (1 - this.radius / 300) * 0.3);
    const width = inZone ? 3 : 2;
    ctx.strokeStyle = `hsla(${this.hue}, 75%, 65%, ${alpha})`;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    // Glow
    if (inZone) {
      ctx.shadowBlur = 20;
      ctx.shadowColor = `hsla(${this.hue}, 80%, 60%, 0.6)`;
      ctx.strokeStyle = `hsla(${this.hue}, 80%, 70%, 0.5)`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }

  hitTest(px, py) {
    const dx = px - this.x;
    const dy = py - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    return Math.abs(dist - this.radius) < 25;
  }
}

class Particle {
  constructor(x, y, hue) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 8;
    this.vy = (Math.random() - 0.5) * 8;
    this.life = 1;
    this.decay = 0.015 + Math.random() * 0.02;
    this.size = 1.5 + Math.random() * 3;
    this.hue = hue + (Math.random() - 0.5) * 30;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.98;
    this.vy *= 0.98;
    this.life -= this.decay;
  }

  draw() {
    ctx.fillStyle = `hsla(${this.hue}, 80%, 65%, ${this.life})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fill();
  }
}

function spawnParticles(x, y, hue, count) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, hue));
  }
}

function missRing(ring) {
  if (ring.clicked) return;
  ring.clicked = true;
  lives--;
  combo = 1;
  shakeAmount = 15;
  showFeedback('✕', `hsla(0, 70%, 55%, 0.9)`);
  updateHUD();

  if (lives <= 0) {
    setTimeout(endGame, 600);
  }
}

function showFeedback(text, color) {
  const el = document.getElementById('feedback');
  el.textContent = text;
  el.style.color = color;
  el.classList.remove('fade');
  el.classList.add('show');
  setTimeout(() => {
    el.classList.remove('show');
    el.classList.add('fade');
  }, 300);
}

function scoreRing(ring) {
  if (ring.clicked) return;
  ring.clicked = true;

  const dist = Math.abs(ring.radius - ring.targetRadius);
  let points, label, color;

  if (dist < 2) {
    points = 100;
    label = 'PERFECT';
    color = `hsla(${ring.hue}, 80%, 65%, 0.9)`;
  } else if (dist < 5) {
    points = 75;
    label = 'GREAT';
    color = `hsla(${ring.hue}, 70%, 60%, 0.9)`;
  } else if (dist < 10) {
    points = 50;
    label = 'GOOD';
    color = `hsla(${ring.hue}, 60%, 55%, 0.9)`;
  } else if (dist < 18) {
    points = 25;
    label = 'OK';
    color = `hsla(${ring.hue}, 50%, 50%, 0.9)`;
  } else {
    points = 10;
    label = 'LATE';
    color = `hsla(${ring.hue}, 40%, 45%, 0.9)`;
  }

  combo++;
  maxCombo = Math.max(maxCombo, combo);
  const multiplier = Math.min(combo, 10);
  const totalPoints = points * multiplier;
  score += totalPoints;

  spawnParticles(ring.x, ring.y, ring.hue, dist < 5 ? 30 : 15);
  showFeedback(`${label} +${totalPoints}`, color);
  updateHUD();

  // Round progression
  if (score > round * 500) {
    round++;
    showFeedback(`ROUND ${round}`, '#fff');
    spawnInterval = getDifficulty().spawnInterval;
  }
}

function updateHUD() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('comboDisplay').textContent = `×${Math.min(combo, 10)}`;
  document.getElementById('roundDisplay').textContent = round;
  document.getElementById('livesDisplay').textContent = '❤️'.repeat(Math.max(0, lives));
}

function endGame() {
  state = 'gameover';
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('pulse-best', bestScore);
  }

  const stats = document.getElementById('finalStats');
  stats.innerHTML = `
    <div class="stat-row"><span>Final Score</span><span>${score}</span></div>
    <div class="stat-row"><span>Best Combo</span><span>×${maxCombo}</span></div>
    <div class="stat-row"><span>Round Reached</span><span>${round}</span></div>
    <div class="stat-row"><span>Best Score</span><span>${bestScore} ${score >= bestScore && score > 0 ? '🏆' : ''}</span></div>
  `;

  document.getElementById('gameOverScreen').classList.remove('hidden');
  document.getElementById('ui').classList.add('hidden');
  document.getElementById('footerHint').classList.add('hidden');
}

function startGame() {
  state = 'playing';
  score = 0;
  combo = 1;
  maxCombo = 1;
  round = 1;
  lives = 3;
  rings = [];
  particles = [];
  spawnTimer = 0;
  spawnInterval = getDifficulty().spawnInterval;
  shakeAmount = 0;

  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('ui').classList.remove('hidden');
  document.getElementById('footerHint').classList.remove('hidden');

  updateHUD();
}

// Background stars
const stars = [];
for (let i = 0; i < 80; i++) {
  stars.push({
    x: Math.random(),
    y: Math.random(),
    size: Math.random() * 1.2,
    twinkle: Math.random() * Math.PI * 2,
    speed: 0.01 + Math.random() * 0.03
  });
}

let time = 0;

function draw() {
  time += 0.016;

  // Background
  ctx.fillStyle = '#05050a';
  ctx.fillRect(0, 0, W, H);

  // Stars
  stars.forEach(s => {
    s.twinkle += s.speed;
    const alpha = 0.2 + Math.sin(s.twinkle) * 0.15;
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI * 2);
    ctx.fill();
  });

  if (state === 'playing') {
    // Spawn
    spawnTimer++;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      rings.push(new Ring());
    }

    // Update rings
    rings.forEach(r => r.update());
    rings = rings.filter(r => r.alive);

    // Update particles
    particles.forEach(p => p.update());
    particles = particles.filter(p => p.life > 0);

    // Combo decay
    if (spawnTimer % 180 === 0 && combo > 1) {
      combo--;
      updateHUD();
    }
  }

  // Draw particles
  particles.forEach(p => p.draw());

  // Draw rings
  rings.forEach(r => r.draw());

  // Screen shake
  if (shakeAmount > 0) {
    ctx.restore();
    shakeAmount *= 0.9;
    if (shakeAmount < 0.5) shakeAmount = 0;
  }

  requestAnimationFrame(draw);
}

// Apply shake via transform on canvas
function shakeLoop() {
  if (shakeAmount > 0.5) {
    const dx = (Math.random() - 0.5) * shakeAmount;
    const dy = (Math.random() - 0.5) * shakeAmount;
    canvas.style.transform = `translate(${dx}px, ${dy}px)`;
  } else {
    canvas.style.transform = '';
    shakeAmount = 0;
  }
  requestAnimationFrame(shakeLoop);
}

// Input
function handleClick(e) {
  if (state !== 'playing') return;

  const rect = canvas.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

  // Find closest ring in zone
  let bestRing = null;
  let bestScore = Infinity;

  rings.forEach(ring => {
    if (ring.clicked || !ring.alive) return;
    const dist = Math.abs(ring.radius - ring.targetRadius);
    if (dist < bestScore && ring.hitTest(x, y)) {
      bestScore = dist;
      bestRing = ring;
    }
  });

  if (bestRing) {
    scoreRing(bestRing);
  }
}

canvas.addEventListener('mousedown', handleClick);
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  handleClick(e);
}, { passive: false });

// Space to start
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (state === 'menu' || state === 'gameover') {
      startGame();
    }
  }
});

draw();
shakeLoop();
</script>
</body>
</html>
