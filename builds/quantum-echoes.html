<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Echoes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    top: 20px;
    left: 20px;
    color: #0ff;
    font-size: 12px;
    text-shadow: 0 0 10px #0ff;
    z-index: 10;
    pointer-events: none;
  }
  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
    z-index: 10;
  }
  .btn {
    background: rgba(0, 255, 255, 0.1);
    border: 1px solid #0ff;
    color: #0ff;
    padding: 8px 16px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.3s;
    text-shadow: 0 0 5px #0ff;
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
  }
  .btn:hover {
    background: rgba(0, 255, 255, 0.3);
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
  }
  .btn.active {
    background: rgba(0, 255, 255, 0.4);
  }
  #info {
    position: fixed;
    top: 20px;
    right: 20px;
    color: #f0f;
    font-size: 11px;
    text-shadow: 0 0 10px #f0f;
    z-index: 10;
    text-align: right;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <div>QUANTUM ECHOES v1.0</div>
  <div id="stats">SOURCES: 0 | PARTICLES: 0 | FPS: 60</div>
</div>
<div id="info">
  <div>CLICK: Create quantum source</div>
  <div>HOLD: Observe / collapse</div>
  <div>SPACE: Pause / Resume</div>
  <div>C: Clear all</div>
  <div>1-4: Change mode</div>
</div>
<div id="controls">
  <button class="btn active" data-mode="0">SUPERPOSITION</button>
  <button class="btn" data-mode="1">ENTANGLE</button>
  <button class="btn" data-mode="2">DECOHERE</button>
  <button class="btn" data-mode="3">PULSE</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height;
let sources = [];
let particles = [];
let ripples = [];
let paused = false;
let mode = 0;
let mouse = { x: 0, y: 0, down: false };
let frameCount = 0;
let fps = 60;
let lastTime = performance.now();

const palettes = [
  { name: 'Aurora', colors: ['#00ffff', '#ff00ff', '#00ff88', '#ffff00'] },
  { name: 'Ember', colors: ['#ff4400', '#ff8800', '#ffcc00', '#ff0044'] },
  { name: 'Frost', colors: ['#0088ff', '#00ccff', '#88ffff', '#ffffff'] },
  { name: 'Void', colors: ['#8800ff', '#ff00ff', '#4400ff', '#aa00ff'] }
];
let currentPalette = 0;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Source {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.energy = 1;
    this.decay = 0.002 + Math.random() * 0.003;
    this.phase = Math.random() * Math.PI * 2;
    this.frequency = 0.02 + Math.random() * 0.03;
    this.particles = [];
    this.maxParticles = 60;
    this.spawnRate = 2;
    this.observed = false;
    this.observationRadius = 120;
    this.hue = Math.random() * 360;
  }

  update() {
    this.phase += this.frequency;
    this.energy = Math.max(0, this.energy - this.decay);

    if (!this.observed && Math.random() < 0.3) {
      for (let i = 0; i < this.spawnRate; i++) {
        if (particles.length < 3000) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.5 + Math.random() * 2;
          particles.push(new Particle(
            this.x,
            this.y,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed,
            this.hue
          ));
        }
      }
    }

    if (this.observed) {
      this.particles = particles.filter(p => {
        const dx = p.x - this.x;
        const dy = p.y - this.y;
        return Math.sqrt(dx*dx + dy*dy) < this.observationRadius;
      });
    }
  }

  draw() {
    const alpha = this.energy * (this.observed ? 0.8 : 0.4);
    const radius = 20 + Math.sin(this.phase) * 5;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowBlur = 30;
    ctx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
    ctx.strokeStyle = `hsl(${this.hue}, 100%, 70%)`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(this.x, this.y, radius * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${this.hue}, 100%, 70%)`;
    ctx.fill();

    if (this.observed) {
      ctx.globalAlpha = 0.2;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.observationRadius, 0, Math.PI * 2);
      ctx.strokeStyle = `hsl(${this.hue}, 100%, 50%)`;
      ctx.setLineDash([5, 10]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }
}

class Particle {
  constructor(x, y, vx, vy, hue) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.hue = hue;
    this.life = 1;
    this.decay = 0.003 + Math.random() * 0.005;
    this.size = 1 + Math.random() * 2;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;

    if (mode === 2) {
      this.vx *= 0.99;
      this.vy *= 0.99;
      this.vx += (Math.random() - 0.5) * 0.1;
      this.vy += (Math.random() - 0.5) * 0.1;
    }

    if (mode === 3) {
      this.vx *= 0.98;
      this.vy *= 0.98;
      const pulse = Math.sin(frameCount * 0.05 + this.x * 0.01) * 0.05;
      this.vx += pulse;
      this.vy += pulse;
    }

    this.life -= this.decay;
  }

  draw() {
    const alpha = this.life * 0.8;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowBlur = 10;
    ctx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
    ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class Ripple {
  constructor(x, y, hue) {
    this.x = x;
    this.y = y;
    this.radius = 0;
    this.maxRadius = 150;
    this.hue = hue;
    this.life = 1;
  }

  update() {
    this.radius += 3;
    this.life = 1 - (this.radius / this.maxRadius);
  }

  draw() {
    ctx.save();
    ctx.globalAlpha = this.life * 0.5;
    ctx.strokeStyle = `hsl(${this.hue}, 100%, 60%)`;
    ctx.lineWidth = 2;
    ctx.shadowBlur = 15;
    ctx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawConnections() {
  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.strokeStyle = `hsl(${frameCount * 0.5 % 360}, 100%, 50%)`;
  ctx.lineWidth = 0.5;
  ctx.shadowBlur = 5;
  ctx.shadowColor = ctx.strokeStyle;

  for (let i = 0; i < sources.length; i++) {
    for (let j = i + 1; j < sources.length; j++) {
      const dx = sources[i].x - sources[j].x;
      const dy = sources[i].y - sources[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < 300 && mode === 1) {
        ctx.globalAlpha = (1 - dist/300) * 0.3;
        ctx.beginPath();
        ctx.moveTo(sources[i].x, sources[i].y);
        ctx.lineTo(sources[j].x, sources[j].y);
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}

function update() {
  if (paused) return;

  frameCount++;

  if (mouse.down) {
    const hue = (frameCount * 2 + currentPalette * 90) % 360;
    sources.push(new Source(mouse.x, mouse.y));
    ripples.push(new Ripple(mouse.x, mouse.y, hue));
  }

  sources.forEach(s => s.update());
  sources = sources.filter(s => s.energy > 0);

  particles.forEach(p => p.update());
  particles = particles.filter(p => p.life > 0 && p.x > 0 && p.x < width && p.y > 0 && p.y < height);

  if (frameCount % 60 === 0) {
    const totalParticles = particles.length;
    const fps = Math.round(1000 / (performance.now() - lastTime));
    document.getElementById('stats').textContent = 
      `SOURCES: ${sources.length} | PARTICLES: ${totalParticles} | FPS: ${fps}`;
    lastTime = performance.now();
  }
}

function draw() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
  ctx.fillRect(0, 0, width, height);

  drawConnections();

  ripples.forEach(r => {
    r.update();
    r.draw();
  });
  ripples = ripples.filter(r => r.life > 0);

  particles.forEach(p => p.draw());

  sources.forEach(s => s.draw());
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

canvas.addEventListener('mousedown', (e) => {
  mouse.down = true;
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

canvas.addEventListener('mouseup', () => {
  mouse.down = false;
});

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  mouse.down = true;
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
});

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  mouse.down = false;
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    paused = !paused;
  }
  if (e.code === 'KeyC') {
    sources = [];
    particles = [];
    ripples = [];
  }
  if (e.key >= '1' && e.key <= '4') {
    mode = parseInt(e.key) - 1;
    document.querySelectorAll('.btn').forEach((btn, i) => {
      btn.classList.toggle('active', i === mode);
    });
  }
});

document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', () => {
    mode = parseInt(btn.dataset.mode);
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

setInterval(() => {
  if (sources.length > 30) {
    sources.shift();
  }
}, 5000);

loop();
</script>
</body>
</html>
