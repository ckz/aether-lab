<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Foam — Aether Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; }
  .ui {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 10;
  }
  .btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.7);
    padding: 8px 16px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.3s;
  }
  .btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.35);
    color: #fff;
  }
  .info {
    position: fixed;
    top: 20px;
    left: 20px;
    color: rgba(255,255,255,0.3);
    font-size: 11px;
    letter-spacing: 1px;
    line-height: 1.8;
    z-index: 10;
  }
  .title-overlay {
    position: fixed;
    top: 20px;
    right: 20px;
    text-align: right;
    z-index: 10;
  }
  .title-overlay h1 {
    font-size: 18px;
    letter-spacing: 6px;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
  }
  .title-overlay p {
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.25);
    margin-top: 4px;
  }
</style>
</head>
<body>

<div class="info" id="info">
  PARTICLES: <span id="count">0</span><br>
  ENTANGLED: <span id="entangled">0</span><br>
  PALETTE: <span id="paletteName">—</span>
</div>

<div class="title-overlay">
  <h1>Quantum Foam</h1>
  <p>SPACETIME SIMULATION</p>
</div>

<div class="ui">
  <button class="btn" onclick="togglePause()">⏯ Pause</button>
  <button class="btn" onclick="switchPalette()">◈ Palette</button>
  <button class="btn" onclick="toggleEntanglement()">∞ Entangle</button>
  <button class="btn" onclick="resetField()">↻ Reset</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Palettes ───
const palettes = [
  {
    name: 'Cosmic Dawn',
    colors: ['#ff6b6b', '#ffa07a', '#ffd700', '#ff69b4', '#da70d6', '#7b68ee'],
    bg: [5, 2, 15],
    glow: 'rgba(255, 107, 107, 0.03)'
  },
  {
    name: 'Deep Ocean',
    colors: ['#00ffff', '#00bfff', '#1e90ff', '#7b68ee', '#9370db', '#48d1cc'],
    bg: [2, 5, 15],
    glow: 'rgba(0, 191, 255, 0.03)'
  },
  {
    name: 'Aurora',
    colors: ['#00ff87', '#00e5ff', '#7c4dff', '#e040fb', '#69f0ae', '#40c4ff'],
    bg: [2, 10, 8],
    glow: 'rgba(0, 255, 135, 0.03)'
  },
  {
    name: 'Solar Flare',
    colors: ['#ff4500', '#ff6347', '#ff8c00', '#ffd700', '#fff44f', '#ffaa00'],
    bg: [15, 5, 2],
    glow: 'rgba(255, 140, 0, 0.03)'
  },
  {
    name: 'Nebula',
    colors: ['#e040fb', '#7c4dff', '#536dfe', '#40c4ff', '#18ffff', '#e1bee7'],
    bg: [8, 2, 15],
    glow: 'rgba(124, 77, 255, 0.03)'
  },
  {
    name: 'Monochrome',
    colors: ['#ffffff', '#cccccc', '#999999', '#666666', '#ccccff', '#ffffff'],
    bg: [5, 5, 5],
    glow: 'rgba(255, 255, 255, 0.02)'
  }
];

let palette = palettes[0];
let entanglementEnabled = true;
let paused = false;

function switchPalette() {
  palette = palettes[(palettes.indexOf(palette) + 1) % palettes.length];
  document.getElementById('paletteName').textContent = palette.name.toUpperCase();
}

function togglePause() { paused = !paused; }
function toggleEntanglement() { entanglementEnabled = !entanglementEnabled; }

// ─── Particles ───
const NUM_PARTICLES = 300;
const particles = [];

class Particle {
  constructor(x, y) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = (Math.random() - 0.5) * 0.8;
    this.radius = Math.random() * 2 + 0.5;
    this.baseRadius = this.radius;
    this.color = palette.colors[Math.floor(Math.random() * palette.colors.length)];
    this.phase = Math.random() * Math.PI * 2;
    this.freq = 0.01 + Math.random() * 0.03;
    this.life = 1;
    this.collapsing = false;
    this.collapseTimer = 0;
    this.opacity = 0.3 + Math.random() * 0.7;
    this.trail = [];
    this.maxTrail = 5 + Math.floor(Math.random() * 10);
  }

  update(time) {
    // Quantum fluctuation — occasional random velocity changes
    if (Math.random() < 0.005) {
      this.vx += (Math.random() - 0.5) * 0.5;
      this.vy += (Math.random() - 0.5) * 0.5;
    }

    // Wave-like motion
    const wave = Math.sin(time * this.freq + this.phase);
    this.vx += Math.cos(time * 0.001 + this.phase) * 0.01;
    this.vy += Math.sin(time * 0.0013 + this.phase) * 0.01;

    // Damping
    this.vx *= 0.998;
    this.vy *= 0.998;

    // Speed limit
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed > 2) {
      this.vx = (this.vx / speed) * 2;
      this.vy = (this.vy / speed) * 2;
    }

    this.x += this.vx;
    this.y += this.vy;

    // Wrap around
    if (this.x < -20) this.x = W + 20;
    if (this.x > W + 20) this.x = -20;
    if (this.y < -20) this.y = H + 20;
    if (this.y > H + 20) this.y = -20;

    // Pulsing radius
    this.radius = this.baseRadius + Math.sin(time * 0.003 + this.phase) * 0.8;

    // Trail
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.maxTrail) this.trail.shift();

    // Collapse animation (quantum measurement)
    if (this.collapsing) {
      this.collapseTimer--;
      this.radius = this.baseRadius * (1 + this.collapseTimer * 0.3);
      this.opacity = Math.max(0, this.collapseTimer / 30);
      if (this.collapseTimer <= 0) {
        this.collapsing = false;
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
        this.color = palette.colors[Math.floor(Math.random() * palette.colors.length)];
      }
    } else {
      this.opacity = 0.3 + Math.abs(wave) * 0.5;
    }
  }

  draw() {
    if (this.opacity < 0.02) return;

    // Trail
    if (this.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.strokeStyle = this.color + Math.floor(this.opacity * 40).toString(16).padStart(2, '0');
      ctx.lineWidth = this.radius * 0.5;
      ctx.stroke();
    }

    // Glow
    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 6);
    gradient.addColorStop(0, this.color + Math.floor(this.opacity * 80).toString(16).padStart(2, '0'));
    gradient.addColorStop(1, this.color + '00');
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 6, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();

    // Core
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = this.color + Math.floor(this.opacity * 200).toString(16).padStart(2, '0');
    ctx.fill();
  }

  collapse() {
    if (!this.collapsing) {
      this.collapsing = true;
      this.collapseTimer = 30;
    }
  }
}

// ─── Init ───
for (let i = 0; i < NUM_PARTICLES; i++) {
  particles.push(new Particle());
}

// ─── Entanglement lines ───
function drawEntanglements() {
  if (!entanglementEnabled) return;
  let count = 0;
  const maxDist = 120;
  const maxDistSq = maxDist * maxDist;

  for (let i = 0; i < particles.length; i++) {
    if (particles[i].collapsing) continue;
    for (let j = i + 1; j < particles.length; j++) {
      if (particles[j].collapsing) continue;
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const distSq = dx * dx + dy * dy;
      if (distSq < maxDistSq) {
        const dist = Math.sqrt(distSq);
        const alpha = (1 - dist / maxDist) * 0.15 * particles[i].opacity * particles[j].opacity;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        
        // Blend colors
        const gradient = ctx.createLinearGradient(
          particles[i].x, particles[i].y,
          particles[j].x, particles[j].y
        );
        gradient.addColorStop(0, particles[i].color + Math.floor(alpha * 255).toString(16).padStart(2, '0'));
        gradient.addColorStop(1, particles[j].color + Math.floor(alpha * 255).toString(16).padStart(2, '0'));
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 0.5;
        ctx.stroke();
        count++;
      }
    }
  }
  document.getElementById('entangled').textContent = count;
}

// ─── Mouse interaction ───
let mouse = { x: W / 2, y: H / 2, active: false };

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => { mouse.active = false; });

canvas.addEventListener('click', (e) => {
  // Wave function collapse burst
  const cx = e.clientX;
  const cy = e.clientY;
  const burstRadius = 200;

  particles.forEach(p => {
    const dx = p.x - cx;
    const dy = p.y - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < burstRadius) {
      const force = (1 - dist / burstRadius) * 3;
      const angle = Math.atan2(dy, dx);
      p.vx += Math.cos(angle) * force;
      p.vy += Math.sin(angle) * force;
      if (dist < 60) {
        p.collapse();
      }
    }
  });

  // Ripple effect
  ripples.push({ x: cx, y: cy, radius: 0, maxRadius: 300, opacity: 0.5 });
});

// ─── Ripples ───
let ripples = [];

function drawRipples() {
  ripples = ripples.filter(r => r.opacity > 0.01);
  ripples.forEach(r => {
    r.radius += 4;
    r.opacity *= 0.96;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 255, 255, ${r.opacity * 0.3})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  });
}

// ─── Background ───
function drawBackground(time) {
  // Fade trail
  ctx.fillStyle = `rgba(${palette.bg[0]}, ${palette.bg[1]}, ${palette.bg[2]}, 0.12)`;
  ctx.fillRect(0, 0, W, H);

  // Subtle noise texture via random dots
  if (Math.random() < 0.3) {
    const nx = Math.random() * W;
    const ny = Math.random() * H;
    ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.02})`;
    ctx.fillRect(nx, ny, 1, 1);
  }
}

// ─── Mouse attraction ───
function applyMouseForce() {
  if (!mouse.active) return;
  particles.forEach(p => {
    const dx = mouse.x - p.x;
    const dy = mouse.y - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 200 && dist > 1) {
      const force = 0.03 * (1 - dist / 200);
      p.vx += (dx / dist) * force;
      p.vy += (dy / dist) * force;
    }
  });
}

// ─── Keyboard ───
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    switchPalette();
  }
  if (e.key === 'r') resetField();
  if (e.key === 'e') toggleEntanglement();
});

function resetField() {
  particles.length = 0;
  for (let i = 0; i < NUM_PARTICLES; i++) {
    particles.push(new Particle());
  }
  ripples = [];
  ctx.fillStyle = `rgb(${palette.bg[0]}, ${palette.bg[1]}, ${palette.bg[2]})`;
  ctx.fillRect(0, 0, W, H);
}

// ─── Animation loop ───
let time = 0;
function animate() {
  if (!paused) {
    time++;
    drawBackground(time);
    applyMouseForce();
    
    particles.forEach(p => p.update(time));
    drawEntanglements();
    particles.forEach(p => p.draw());
    drawRipples();
  }

  document.getElementById('count').textContent = particles.length;
  document.getElementById('paletteName').textContent = palette.name.toUpperCase();
  requestAnimationFrame(animate);
}

// Init background
ctx.fillStyle = `rgb(${palette.bg[0]}, ${palette.bg[1]}, ${palette.bg[2]})`;
ctx.fillRect(0, 0, W, H);

animate();
</script>
</body>
</html>
