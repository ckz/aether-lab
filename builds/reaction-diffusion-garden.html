<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reaction Diffusion Garden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #080810;
    font-family: 'Courier New', monospace;
    color: #ccc;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    min-height: 100vh;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: normal;
    letter-spacing: .3em;
    color: #aab;
    margin-bottom: 4px;
  }
  .sub {
    font-size: .7rem;
    opacity: .4;
    letter-spacing: .2em;
    margin-bottom: 16px;
  }
  canvas {
    border: 1px solid rgba(100,90,180,.2);
    border-radius: 4px;
    cursor: crosshair;
    max-width: 100%;
  }
  .controls {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 800px;
  }
  .btn {
    background: rgba(20,18,40,.8);
    border: 1px solid rgba(100,90,180,.3);
    color: #9988dd;
    padding: 6px 14px;
    border-radius: 3px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: .7rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    transition: all .2s;
  }
  .btn:hover {
    background: rgba(40,30,80,.9);
    border-color: rgba(150,130,255,.5);
    color: #c8c8ff;
  }
  .btn.active {
    background: rgba(80,60,180,.3);
    border-color: rgba(150,130,255,.6);
    color: #fff;
  }
  .info {
    margin-top: 12px;
    font-size: .65rem;
    opacity: .4;
    letter-spacing: .1em;
    text-align: center;
  }
</style>
</head>
<body>
<h1>Reaction Diffusion Garden</h1>
<p class="sub">Gray-Scott model · click to paint chemicals</p>
<canvas id="c"></canvas>
<div class="controls">
  <button class="btn active" data-preset="coral">Coral</button>
  <button class="btn" data-preset="spots">Spots</button>
  <button class="btn" data-preset="stripes">Stripes</button>
  <button class="btn" data-preset="worms">Worms</button>
  <button class="btn" data-preset="chaos">Chaos</button>
  <button class="btn" data-preset="mitosis">Mitosis</button>
  <button class="btn" id="clearBtn">Clear</button>
  <button class="btn" id="resetBtn">Reset</button>
</div>
<div class="info">
  Click/drag to paint · Right-click to erase · Scroll to change brush size
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 600;
const H = 400;
const SCALE = 2; // simulation runs at half res for speed
const SW = Math.floor(W / SCALE);
const SH = Math.floor(H / SCALE);

canvas.width = W;
canvas.height = H;

let A = new Float32Array(SW * SH);
let B = new Float32Array(SW * SH);
let nextA = new Float32Array(SW * SH);
let nextB = new Float32Array(SW * SH);

// Image buffer for display
const imgData = ctx.createImageData(W, H);
const pixels = imgData.data;

let running = true;
let brushSize = 4;
let mouseDown = false;
let mouseErase = false;
let mouseX = 0, mouseY = 0;

const presets = {
  coral:    { f: 0.055, k: 0.062, color: [0, 180, 220] },
  spots:    { f: 0.035, k: 0.060, color: [255, 180, 80] },
  stripes:  { f: 0.014, k: 0.054, color: [200, 120, 255] },
  worms:    { f: 0.078, k: 0.061, color: [255, 100, 120] },
  chaos:    { f: 0.026, k: 0.061, color: [150, 255, 150] },
  mitosis:  { f: 0.036, k: 0.065, color: [255, 220, 100] },
};

let currentPreset = presets.coral;

function laplacian(arr, x, y) {
  return (
    arr[(x-1) + y * SW] * 0.2 +
    arr[(x+1) + y * SW] * 0.2 +
    arr[x + (y-1) * SW] * 0.2 +
    arr[x + (y+1) * SW] * 0.2 +
    arr[(x-1) + (y-1) * SW] * 0.05 +
    arr[(x+1) + (y-1) * SW] * 0.05 +
    arr[(x-1) + (y+1) * SW] * 0.05 +
    arr[(x+1) + (y+1) * SW] * 0.05 -
    arr[x + y * SW]
  );
}

function init() {
  for (let i = 0; i < SW * SH; i++) {
    A[i] = 1.0;
    B[i] = 0.0;
  }
  // Seed center with chemical B
  const cx = Math.floor(SW / 2);
  const cy = Math.floor(SH / 2);
  for (let dy = -20; dy <= 20; dy++) {
    for (let dx = -20; dx <= 20; dx++) {
      if (dx*dx + dy*dy < 400) {
        const x = (cx + dx + SW) % SW;
        const y = (cy + dy + SH) % SH;
        B[x + y * SW] = 1.0;
        A[x + y * SW] = 0.0;
      }
    }
  }
}

function step() {
  const { f, k } = currentPreset;
  const dA = 1.0;
  const dB = 0.5;

  for (let y = 1; y < SH - 1; y++) {
    for (let x = 1; x < SW - 1; x++) {
      const i = x + y * SW;
      const a = A[i];
      const b = B[i];
      const abb = a * b * b;
      
      nextA[i] = a + (dA * laplacian(A, x, y) - abb + f * (1.0 - a));
      nextB[i] = b + (dB * laplacian(B, x, y) + abb - (k + f) * b);
    }
  }

  // Swap buffers
  [A, nextA] = [nextA, A];
  [B, nextB] = [nextB, B];
}

function render() {
  const [cr, cg, cb] = currentPreset.color;
  
  for (let y = 0; y < SH; y++) {
    for (let x = 0; x < SW; x++) {
      const i = x + y * SW;
      const b = B[i];
      // Concentration maps to brightness
      const v = Math.min(1, b * 2.5);
      
      // Find pixel position in image buffer
      for (let py = 0; py < SCALE; py++) {
        for (let px = 0; px < SCALE; px++) {
          const pi = ((y * SCALE + py) * W + (x * SCALE + px)) * 4;
          pixels[pi]     = cr * v;
          pixels[pi + 1] = cg * v;
          pixels[pi + 2] = cb * v;
          pixels[pi + 3] = 255;
        }
      }
    }
  }
  
  ctx.putImageData(imgData, 0, 0);
}

let frameCount = 0;
function loop() {
  if (running) {
    // Run multiple sim steps per frame for speed
    for (let s = 0; s < 8; s++) step();
    frameCount++;
    if (frameCount % 2 === 0) render();
  }
  requestAnimationFrame(loop);
}

function paintAt(sx, sy) {
  const simX = Math.floor(sx / SCALE);
  const simY = Math.floor(sy / SCALE);
  
  for (let dy = -brushSize; dy <= brushSize; dy++) {
    for (let dx = -brushSize; dx <= brushSize; dx++) {
      if (dx*dx + dy*dy > brushSize*brushSize) continue;
      const x = (simX + dx + SW) % SW;
      const y = (simY + dy + SH) % SH;
      const i = x + y * SW;
      
      if (mouseErase) {
        B[i] = 0.001;
        A[i] = 1.0;
      } else {
        B[i] = 1.0;
        A[i] = 0.0;
      }
    }
  }
  if (frameCount % 2 === 0) render();
}

canvas.addEventListener('mousedown', (e) => {
  mouseDown = true;
  mouseErase = e.button === 2;
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
  mouseY = (e.clientY - rect.top) * (H / rect.height);
  paintAt(mouseX, mouseY);
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
  mouseY = (e.clientY - rect.top) * (H / rect.height);
  if (mouseDown) paintAt(mouseX, mouseY);
});

canvas.addEventListener('mouseup', () => mouseDown = false);
canvas.addEventListener('mouseleave', () => mouseDown = false);

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  brushSize = Math.max(1, Math.min(20, brushSize - Math.sign(e.deltaY)));
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  mouseDown = true;
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  mouseX = (t.clientX - rect.left) * (W / rect.width);
  mouseY = (t.clientY - rect.top) * (H / rect.height);
  paintAt(mouseX, mouseY);
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  mouseX = (t.clientX - rect.left) * (W / rect.width);
  mouseY = (t.clientY - rect.top) * (H / rect.height);
  if (mouseDown) paintAt(mouseX, mouseY);
});

canvas.addEventListener('touchend', () => mouseDown = false);

// Preset buttons
document.querySelectorAll('[data-preset]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-preset]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPreset = presets[btn.dataset.preset];
    init();
  });
});

document.getElementById('clearBtn').addEventListener('click', () => {
  for (let i = 0; i < SW * SH; i++) {
    A[i] = 1.0;
    B[i] = 0.0;
  }
  render();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  init();
  render();
});

// Start
init();
render();
loop();
</script>
</body>
</html>
