<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resonance — Harmonic Strings</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #889;
    cursor: crosshair;
  }
  canvas { display: block; }
  .hint {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: .3em;
    text-transform: uppercase;
    opacity: .35;
    pointer-events: none;
    transition: opacity 2s;
  }
  .controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 18px;
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    opacity: .5;
  }
  .controls button {
    background: rgba(20, 20, 40, .7);
    border: 1px solid rgba(120, 100, 255, .3);
    color: #9988dd;
    padding: 6px 14px;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: .15em;
    transition: all .3s;
  }
  .controls button:hover {
    background: rgba(40, 35, 80, .8);
    border-color: rgba(150, 130, 255, .6);
    color: #c8c8ff;
  }
  .controls button.active {
    background: rgba(60, 50, 120, .7);
    border-color: rgba(180, 160, 255, .7);
    color: #fff;
  }
</style>
</head>
<body>
<div class="hint" id="hint">click or drag across the strings</div>
<div class="controls">
  <button id="btn-pentatonic" class="active">Pentatonic</button>
  <button id="btn-chromatic">Chromatic</button>
  <button id="btn-drones">Drones</button>
  <button id="btn-reset">Reset</button>
</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  initStrings();
}
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, velocity = 0.6) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  // Rich harmonic tone
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, now);

  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(2000 + velocity * 3000, now);
  filter.Q.setValueAtTime(1, now);

  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(velocity * 0.25, now + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + 3);
}

// Scales
const SCALES = {
  pentatonic: [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3, 659.3, 784.0, 880.0],
  chromatic: [261.6, 277.2, 293.7, 311.1, 329.6, 349.2, 370.0, 392.0, 415.3, 440.0, 466.2, 493.9, 523.3],
  drones: [130.8, 196.0, 261.6, 329.6, 392.0, 440.0, 523.3, 659.3]
};
let currentScale = 'pentatonic';

// Strings
const strings = [];
let stringCount = 24;

function initStrings() {
  const spacing = H / (stringCount + 1);
  strings.length = 0;
  const scale = SCALES[currentScale];
  for (let i = 0; i < stringCount; i++) {
    const y = spacing * (i + 1);
    const noteIndex = Math.floor((i / stringCount) * scale.length) % scale.length;
    strings.push({
      y,
      baseY: y,
      amplitude: 0,
      velocity: 0,
      damping: 0.985 + Math.random() * 0.01,
      freq: scale[noteIndex],
      hue: (i / stringCount) * 280 + 200,
      thickness: 1.2 + (1 - i / stringCount) * 1.5,
      glowWidth: 8 + (1 - i / stringCount) * 20,
      lastPluck: 0
    });
  }
}

// Interaction
let mouse = { x: -1000, y: -1000, prevX: -1000, prevY: -1000, down: false, dragging: false };
let interacted = false;

function pluckString(s, velocity) {
  const dx = mouse.x - (s.x || W / 2);
  const dist = Math.abs(mouse.y - s.y);
  const influence = Math.max(0, 1 - dist / 60);
  if (influence > 0) {
    const speed = Math.sqrt(
      Math.pow(mouse.x - mouse.prevX, 2) + Math.pow(mouse.y - mouse.prevY, 2)
    );
    const pluckForce = velocity * influence * Math.min(speed * 0.15, 1.5);
    s.velocity += pluckForce * (mouse.x > (s.x || W/2) ? 1 : -1);
    s.amplitude = Math.min(Math.abs(s.velocity) * 80, 120);
    const now = performance.now();
    if (now - s.lastPluck > 80) {
      playTone(s.freq, Math.min(pluckForce * 1.2, 1));
      s.lastPluck = now;
    }
  }
}

canvas.addEventListener('mousedown', (e) => {
  mouse.down = true;
  mouse.dragging = true;
  mouse.x = mouse.prevX = e.clientX;
  mouse.y = mouse.prevY = e.clientY;
  initAudio();
  if (!interacted) { interacted = true; document.getElementById('hint').style.opacity = '0'; }
  strings.forEach(s => pluckString(s, 0.8));
});

canvas.addEventListener('mousemove', (e) => {
  mouse.prevX = mouse.x;
  mouse.prevY = mouse.y;
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  if (mouse.down) {
    strings.forEach(s => pluckString(s, 0.5));
  }
});

canvas.addEventListener('mouseup', () => { mouse.down = false; mouse.dragging = false; });
canvas.addEventListener('mouseleave', () => { mouse.down = false; mouse.dragging = false; });

// Touch
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.down = true; mouse.dragging = true;
  mouse.x = mouse.prevX = t.clientX;
  mouse.y = mouse.prevY = t.clientY;
  initAudio();
  if (!interacted) { interacted = true; document.getElementById('hint').style.opacity = '0'; }
  strings.forEach(s => pluckString(s, 0.8));
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.prevX = mouse.x; mouse.prevY = mouse.y;
  mouse.x = t.clientX; mouse.y = t.clientY;
  strings.forEach(s => pluckString(s, 0.5));
}, { passive: false });

canvas.addEventListener('touchend', () => { mouse.down = false; mouse.dragging = false; });

// Controls
document.getElementById('btn-pentatonic').onclick = () => setScale('pentatonic');
document.getElementById('btn-chromatic').onclick = () => setScale('chromatic');
document.getElementById('btn-drones').onclick = () => setScale('drones');
document.getElementById('btn-reset').onclick = () => initStrings();

function setScale(name) {
  currentScale = name;
  stringCount = name === 'chromatic' ? 18 : name === 'drones' ? 16 : 24;
  document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + name).classList.add('active');
  initStrings();
}

// Animate
let time = 0;
function draw() {
  time += 0.016;
  // Fade trail
  ctx.fillStyle = 'rgba(10, 10, 18, 0.18)';
  ctx.fillRect(0, 0, W, H);

  // Ambient glow from mouse
  if (mouse.down) {
    const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 200);
    g.addColorStop(0, 'rgba(100, 80, 220, 0.06)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // Update and draw strings
  strings.forEach(s => {
    // Spring physics
    const spring = -s.amplitude * 0.03;
    s.velocity += spring;
    s.velocity *= s.damping;
    s.amplitude += s.velocity;

    // Gentle ambient sway
    const ambient = Math.sin(time * s.freq * 0.02 + s.y * 0.01) * 0.15;

    const x1 = 0;
    const y1 = s.baseY + (s.amplitude + ambient) * Math.sin(s.freq * 0.03);
    const x2 = W;
    const y2 = s.baseY + (s.amplitude + ambient) * Math.sin(s.freq * 0.03 + 1.5);

    // Glow
    const glow = Math.abs(s.amplitude) / 100;
    const alpha = 0.15 + glow * 0.6;

    ctx.shadowBlur = s.glowWidth * (0.3 + glow * 2);
    ctx.shadowColor = `hsla(${s.hue}, 70%, 60%, ${glow})`;
    ctx.strokeStyle = `hsla(${s.hue}, 65%, 65%, ${alpha})`;
    ctx.lineWidth = s.thickness * (0.8 + glow * 1.5);

    ctx.beginPath();
    ctx.moveTo(x1, y1);

    // Bezier for organic curve
    const cp1x = W * 0.33;
    const cp1y = s.baseY + (s.amplitude + ambient) * Math.sin(s.freq * 0.03 + 0.8) * 1.3;
    const cp2x = W * 0.66;
    const cp2y = s.baseY + (s.amplitude + ambient) * Math.sin(s.freq * 0.03 + 2.1) * 1.3;
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
    ctx.stroke();

    ctx.shadowBlur = 0;
  });

  requestAnimationFrame(draw);
}

resize();
draw();
</script>
</body>
</html>
