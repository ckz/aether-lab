<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resonant Topology</title>
<style>
  * { margin: 0; padding: 0; }
  body {
    background: #0a0a14;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #a0a0c0;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
  }
  .ui {
    position: absolute;
    top: 20px; left: 24px;
    z-index: 10;
    background: rgba(10, 10, 20, 0.85);
    border: 1px solid rgba(140, 120, 220, 0.3);
    border-radius: 8px;
    padding: 18px 22px;
    backdrop-filter: blur(10px);
    max-width: 320px;
  }
  .title {
    font-size: 18px;
    color: #c4a0ff;
    margin-bottom: 6px;
    letter-spacing: 2px;
  }
  .sub {
    font-size: 10px;
    color: #777;
    margin-bottom: 14px;
    line-height: 1.4;
  }
  .stat {
    font-size: 11px;
    color: #999;
    margin: 4px 0;
  }
  .stat span {
    color: #c4a0ff;
  }
  .hint {
    margin-top: 10px;
    font-size: 10px;
    color: #666;
    line-height: 1.5;
    border-top: 1px solid rgba(140, 120, 220, 0.15);
    padding-top: 10px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="title">◈ RESONANT TOPOLOGY ◈</div>
  <div class="sub">Wave interference on a deformable mesh</div>
  <div class="stat">nodes: <span id="nodes">—</span></div>
  <div class="stat">sources: <span id="sources">—</span></div>
  <div class="stat">fps: <span id="fps">—</span></div>
  <div class="hint">
    move mouse — create resonance<br>
    click — place permanent source<br>
    space — clear sources<br>
    r — reset field
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const COLS = 70;
const ROWS = 50;
const SPACING = 18;
let nodes = [];
let sources = [{x: W/2, y: H/2, phase: 0, amp: 1, life: Infinity}];
let mouse = {x: W/2, y: H/2, active: false};

// color palette
const palette = [
  [20, 10, 40],      // deep void
  [40, 20, 80],      // indigo
  [80, 40, 140],     // violet
  [140, 60, 180],    // magenta
  [200, 100, 160],   // rose
  [255, 180, 120],   // amber
  [255, 240, 220],   // warm white
];

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return [r, g, b];
}

function lerpColor(c1, c2, t) {
  return [
    c1[0] + (c2[0] - c1[0]) * t,
    c1[1] + (c2[1] - c1[1]) * t,
    c1[2] + (c2[2] - c1[2]) * t,
  ];
}

function colorFromValue(v, min, max) {
  const t = (v - min) / (max - min);
  const idx = t * (palette.length - 1);
  const i = Math.floor(idx);
  const f = idx - i;
  const c1 = palette[Math.min(i, palette.length - 1)];
  const c2 = palette[Math.min(i + 1, palette.length - 1)];
  return lerpColor(c1, c2, f);
}

// create nodes
function initNodes() {
  nodes = [];
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      nodes.push({
        bx: x * SPACING + (W - COLS * SPACING) / 2,
        by: y * SPACING + (H - ROWS * SPACING) / 2,
        x: 0, y: 0,
        vx: 0, vy: 0,
        val: 0,
      });
    }
  }
}
initNodes();

// interaction
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => mouse.active = false);
canvas.addEventListener('click', e => {
  sources.push({
    x: e.clientX, y: e.clientY,
    phase: Math.random() * Math.PI * 2,
    amp: 0.8 + Math.random() * 0.4,
    life: Infinity,
  });
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    sources = [{x: W/2, y: H/2, phase: 0, amp: 1, life: Infinity}];
  }
  if (e.code === 'KeyR') initNodes();
});

let lastTime = performance.now();
let frameCount = 0;
let fpsVal = 60;

function animate(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;
  frameCount++;
  if (frameCount % 30 === 0) fpsVal = Math.round(1 / dt);

  ctx.fillStyle = 'rgba(10, 10, 20, 0.15)';
  ctx.fillRect(0, 0, W, H);

  // update sources
  if (mouse.active) {
    sources[0].x += (mouse.x - sources[0].x) * 0.1;
    sources[0].y += (mouse.y - sources[0].y) * 0.1;
    sources[0].phase += dt * 1.5;
  }

  const t = time * 0.001;
  let minVal = Infinity, maxVal = -Infinity;

  // update nodes
  for (const node of nodes) {
    let val = 0;
    for (const src of sources) {
      const dx = node.bx - src.x;
      const dy = node.by - src.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 1;
      const freq = 0.04 + (src.life !== Infinity ? 0.02 : 0);
      val += src.amp * Math.sin(dist * freq - src.phase - t * 2) / (1 + dist * 0.015);
    }

    // gentle deformation
    const fx = val * 8 * Math.cos(t + node.by * 0.01);
    const fy = val * 8 * Math.sin(t + node.bx * 0.01);
    node.vx += (fx - (node.x || 0)) * 0.02;
    node.vy += (fy - (node.y || 0)) * 0.02;
    node.vx *= 0.92;
    node.vy *= 0.92;
    node.x = (node.x || 0) + node.vx;
    node.y = (node.y || 0) + node.vy;

    node.val = val;
    minVal = Math.min(minVal, val);
    maxVal = Math.max(maxVal, val);
  }

  // draw edges
  ctx.lineWidth = 0.6;
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const i = y * COLS + x;
      const node = nodes[i];
      const px = node.bx + node.x;
      const py = node.by + node.y;

      if (x < COLS - 1) {
        const j = y * COLS + (x + 1);
        const n2 = nodes[j];
        const avg = (node.val + n2.val) / 2;
        const alpha = 0.15 + 0.6 * ((avg - minVal) / (maxVal - minVal + 0.001));
        const col = colorFromValue(avg, minVal, maxVal);
        ctx.strokeStyle = `rgba(${col[0]|0}, ${col[1]|0}, ${col[2]|0}, ${alpha.toFixed(2)})`;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(n2.bx + n2.x, n2.by + n2.y);
        ctx.stroke();
      }
      if (y < ROWS - 1) {
        const j = (y + 1) * COLS + x;
        const n2 = nodes[j];
        const avg = (node.val + n2.val) / 2;
        const alpha = 0.15 + 0.6 * ((avg - minVal) / (maxVal - minVal + 0.001));
        const col = colorFromValue(avg, minVal, maxVal);
        ctx.strokeStyle = `rgba(${col[0]|0}, ${col[1]|0}, ${col[2]|0}, ${alpha.toFixed(2)})`;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(n2.bx + n2.x, n2.by + n2.y);
        ctx.stroke();
      }

      // node highlight at peaks
      const norm = (node.val - minVal) / (maxVal - minVal + 0.001);
      if (norm > 0.75) {
        const intensity = (norm - 0.75) / 0.25;
        const col = colorFromValue(node.val, minVal, maxVal);
        const size = 1.5 + intensity * 2.5;
        ctx.fillStyle = `rgba(${col[0]|0}, ${col[1]|0}, ${col[2]|0}, ${(intensity * 0.9).toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(px, py, size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // glow around mouse/source
  for (const src of sources) {
    if (src.life === Infinity || src.life > 0) {
      const grad = ctx.createRadialGradient(src.x, src.y, 0, src.x, src.y, 80);
      grad.addColorStop(0, 'rgba(180, 140, 240, 0.12)');
      grad.addColorStop(1, 'rgba(180, 140, 240, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(src.x, src.y, 80, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ui updates
  if (frameCount % 10 === 0) {
    document.getElementById('nodes').textContent = nodes.length;
    document.getElementById('sources').textContent = sources.length;
    document.getElementById('fps').textContent = fpsVal;
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
