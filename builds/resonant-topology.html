<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resonant Topology</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #06060c;
    overflow: hidden;
    height: 100%;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; }
  .hud {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
    text-align: center;
    transition: opacity 0.8s;
  }
  .hud.fade { opacity: 0.08; }
  .controls {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 10;
  }
  .controls button {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.5);
    padding: 6px 14px;
    border-radius: 20px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .controls button:hover {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.9);
    border-color: rgba(123,111,255,0.4);
  }
  .controls button.active {
    background: rgba(123,111,255,0.15);
    border-color: rgba(123,111,255,0.5);
    color: rgba(180,170,255,0.9);
  }
</style>
</head>
<body>
<div class="hud" id="hud">Resonant Topology — Cymatic Field</div>
<canvas id="c"></canvas>
<div class="controls">
  <button id="btn-mode" class="active">Mode: Wave</button>
  <button id="btn-sym">Symmetry: 6</button>
  <button id="btn-clear">Clear Sources</button>
  <button id="btn-save">Save</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');

  let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);
  let mode = 0; // 0=wave, 1=cymatic, 2=topology
  let symmetry = 6;
  let sources = [];
  let particles = [];
  let mouse = { x: -9999, y: -9999, active: false };
  let time = 0;
  let frameCount = 0;

  const MODES = ['Wave', 'Cymatic', 'Topology'];
  const SYMS = [3, 4, 5, 6, 8, 12];

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initParticles();
  }

  function initParticles() {
    const spacing = 18;
    const cols = Math.ceil(W / spacing) + 1;
    const rows = Math.ceil(H / spacing) + 1;
    particles = [];
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        particles.push({
          x: i * spacing,
          y: j * spacing,
          baseX: i * spacing,
          baseY: j * spacing,
          vx: 0,
          vy: 0,
          col: i,
          row: j
        });
      }
    }
  }

  // Add a wave source
  function addSource(x, y, strength = 1) {
    sources.push({
      x, y,
      strength,
      birth: time,
      freq: 0.015 + Math.random() * 0.02,
      phase: Math.random() * Math.PI * 2,
      decay: 0.0003 + Math.random() * 0.0005
    });
    if (sources.length > 20) sources.shift();
  }

  function getField(x, y, t) {
    let val = 0;
    const cx = W / 2, cy = H / 2;

    // Symmetric sources
    for (let s = 0; s < symmetry; s++) {
      const angle = (s / symmetry) * Math.PI * 2;
      const sx = cx + Math.cos(angle) * Math.sqrt((x-cx)**2 + (y-cy)**2);
      const sy = cy + Math.sin(angle) * Math.sqrt((x-cx)**2 + (y-cy)**2);

      for (const src of sources) {
        const dx = x - src.x;
        const dy = y - src.y;
        const dist = Math.sqrt(dx*dx + dy*dy) + 1;
        const age = t - src.birth;
        const amp = src.strength * Math.exp(-age * src.decay);
        val += amp * Math.sin(dist * src.freq - t * 0.03 + src.phase) / Math.sqrt(dist * 0.5 + 1);
      }
    }

    // Ambient field
    val += 0.3 * Math.sin(x * 0.008 + t * 0.008) * Math.cos(y * 0.006 - t * 0.006);
    val += 0.2 * Math.sin((x + y) * 0.005 + t * 0.005);

    // Mouse proximity
    if (mouse.active) {
      const dx = x - mouse.x;
      const dy = y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy) + 1;
      val += 2.5 * Math.sin(dist * 0.04 - t * 0.06) / Math.sqrt(dist * 0.3 + 1);
    }

    return val;
  }

  function getColor(val, maxVal) {
    const norm = val / (maxVal + 0.001);
    const absNorm = Math.abs(norm);

    // Cymatic palette: deep indigo -> cyan -> white hot
    let r, g, b;
    if (absNorm < 0.3) {
      const t2 = absNorm / 0.3;
      r = lerp(8, 30, t2);
      g = lerp(6, 20, t2);
      b = lerp(18, 60, t2);
    } else if (absNorm < 0.6) {
      const t2 = (absNorm - 0.3) / 0.3;
      r = lerp(30, 60, t2);
      g = lerp(20, 100, t2);
      b = lerp(60, 180, t2);
    } else {
      const t2 = Math.min((absNorm - 0.6) / 0.4, 1);
      r = lerp(60, 220, t2);
      g = lerp(100, 240, t2);
      b = lerp(180, 255, t2);
    }

    // Sign-based tint
    if (norm < -0.1) {
      r = lerp(r, 80, Math.min(Math.abs(norm) * 0.5, 1));
      g = lerp(g, 40, Math.min(Math.abs(norm) * 0.5, 1));
      b = lerp(b, 140, Math.min(Math.abs(norm) * 0.5, 1));
    }

    return { r: Math.floor(r), g: Math.floor(g), b: Math.floor(b) };
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function draw() {
    time++;
    frameCount++;

    // Trail fade
    ctx.fillStyle = 'rgba(6, 6, 12, 0.12)';
    ctx.fillRect(0, 0, W, H);

    const maxVal = 4;

    for (const p of particles) {
      const val = getField(p.x, p.y, time);
      const col = getColor(val, maxVal);

      // Displacement
      const gradX = getField(p.x + 1, p.y, time) - getField(p.x - 1, p.y, time);
      const gradY = getField(p.x, p.y + 1, time) - getField(p.x, p.y - 1, time);

      if (mode === 1) { // Cymatic: particles move
        p.vx += gradX * 0.15;
        p.vy += gradY * 0.15;
        p.vx *= 0.92;
        p.vy *= 0.92;
        p.x += p.vx;
        p.y += p.vy;
        // gentle return
        p.x += (p.baseX - p.x) * 0.01;
        p.y += (p.baseY - p.y) * 0.01;
      }

      const size = mode === 2 ? 1.5 + Math.abs(val) * 1.2 : 1.2 + Math.abs(val) * 0.8;
      const alpha = 0.4 + Math.min(Math.abs(val) / maxVal, 1) * 0.6;

      ctx.beginPath();
      if (mode === 2) {
        // Connect nearby high-energy particles
        if (Math.abs(val) > 1.5) {
          ctx.fillStyle = `rgba(${col.r},${col.g},${col.b},${alpha})`;
          ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        } else {
          ctx.fillStyle = `rgba(${col.r},${col.g},${col.b},${alpha * 0.3})`;
          ctx.arc(p.x, p.y, size * 0.6, 0, Math.PI * 2);
        }
      } else {
        ctx.fillStyle = `rgba(${col.r},${col.g},${col.b},${alpha})`;
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      }
      ctx.fill();
    }

    // Draw connection lines in topology mode for high-energy regions
    if (mode === 2 && frameCount % 3 === 0) {
      ctx.strokeStyle = 'rgba(100, 140, 255, 0.04)';
      ctx.lineWidth = 0.5;
      for (let i = 0; i < particles.length; i += 20) {
        const p = particles[i];
        const val = getField(p.x, p.y, time);
        if (Math.abs(val) > 1.8) {
          // Find nearest high-energy neighbor
          for (let j = i + 20; j < particles.length; j += 20) {
            const q = particles[j];
            const dx = p.x - q.x;
            const dy = p.y - q.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 50) {
              const qval = getField(q.x, q.y, time);
              if (Math.abs(qval) > 1.8) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(q.x, q.y);
                ctx.stroke();
              }
            }
          }
        }
      }
    }

    // Source markers
    for (const src of sources) {
      const age = time - src.birth;
      const alpha = Math.max(0, 1 - age * src.decay * 0.5);
      const pulse = 3 + Math.sin(time * 0.1 + src.phase) * 1.5;
      ctx.beginPath();
      ctx.strokeStyle = `rgba(180, 160, 255, ${alpha * 0.3})`;
      ctx.lineWidth = 1;
      ctx.arc(src.x, src.y, pulse + 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.fillStyle = `rgba(200, 180, 255, ${alpha * 0.6})`;
      ctx.arc(src.x, src.y, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  // Events
  canvas.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
    hud.classList.add('fade');
  });

  canvas.addEventListener('mouseleave', () => {
    mouse.active = false;
    hud.classList.remove('fade');
  });

  canvas.addEventListener('click', e => {
    addSource(e.clientX, e.clientY, 1.5);
    // Burst of nearby sources
    for (let i = 0; i < 3; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 20 + Math.random() * 40;
      addSource(
        e.clientX + Math.cos(angle) * dist,
        e.clientY + Math.sin(angle) * dist,
        0.6 + Math.random() * 0.8
      );
    }
  });

  // Auto-generate sources periodically
  setInterval(() => {
    if (sources.length < 8 && Math.random() < 0.5) {
      addSource(
        100 + Math.random() * (W - 200),
        100 + Math.random() * (H - 200),
        0.8 + Math.random() * 0.6
      );
    }
  }, 3000);

  // Controls
  document.getElementById('btn-mode').addEventListener('click', function() {
    mode = (mode + 1) % MODES.length;
    this.textContent = 'Mode: ' + MODES[mode];
    // Reset particles for mode switch
    if (mode !== 1) initParticles();
  });

  document.getElementById('btn-sym').addEventListener('click', function() {
    const idx = SYMS.indexOf(symmetry);
    symmetry = SYMS[(idx + 1) % SYMS.length];
    this.textContent = 'Symmetry: ' + symmetry;
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    sources = [];
  });

  document.getElementById('btn-save').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'resonant-topology-' + Date.now() + '.png';
    link.href = canvas.toDataURL();
    link.click();
  });

  window.addEventListener('resize', resize);
  resize();

  // Initial sources
  setTimeout(() => addSource(W * 0.3, H * 0.4, 1.2), 500);
  setTimeout(() => addSource(W * 0.7, H * 0.6, 1.0), 1200);
  setTimeout(() => addSource(W * 0.5, H * 0.3, 0.9), 1800);

  draw();
})();
</script>
</body>
</html>
