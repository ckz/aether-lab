<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resonant Topology — Cymatic Field Generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #e0e0e8; font-family: 'Courier New', monospace; overflow: hidden; }
  canvas { display: block; }
  #controls {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(10, 10, 20, 0.85); border: 1px solid #2a2a3a;
    padding: 14px 18px; border-radius: 10px; font-size: 12px;
    backdrop-filter: blur(8px); min-width: 220px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #controls h3 { font-size: 13px; margin-bottom: 10px; color: #7af; letter-spacing: 1px; text-transform: uppercase; }
  #controls label { display: block; margin: 6px 0 2px; color: #999; font-size: 11px; }
  #controls input[type="range"] { width: 100%; accent-color: #7af; margin-bottom: 4px; }
  #controls button {
    background: #1a1a2e; color: #7af; border: 1px solid #3a3a5a;
    padding: 5px 12px; cursor: pointer; border-radius: 4px; margin: 3px 3px 3px 0;
    font-family: inherit; font-size: 11px; transition: 0.2s;
  }
  #controls button:hover { background: #2a2a4e; border-color: #7af; }
  #controls select {
    width: 100%; background: #1a1a2e; color: #7af;
    border: 1px solid #3a3a5a; padding: 5px; border-radius: 4px;
    font-family: inherit; font-size: 11px;
  }
  #info {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: #555; font-size: 11px; text-align: center;
    pointer-events: none;
  }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row button { flex: 1; }
  #value-display { color: #7af; font-size: 11px; text-align: right; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="controls">
  <h3>⬡ Resonant Topology</h3>
  <label>Harmonics: <span id="v-harmonics">5</span></label>
  <input type="range" id="harmonics" min="1" max="12" value="5" step="1">
  <label>Damping: <span id="v-damping">0.985</span></label>
  <input type="range" id="damping" min="0.95" max="0.999" value="0.985" step="0.001">
  <label>Amplitude: <span id="v-amp">0.5</span></label>
  <input type="range" id="amp" min="0.05" max="1.5" value="0.5" step="0.05">
  <label>Resolution: <span id="v-res">8</span>px</label>
  <input type="range" id="res" min="3" max="16" value="8" step="1">
  <label>Palette</label>
  <select id="palette">
    <option value="cyan">Cyan Depths</option>
    <option value="nebula">Nebula</option>
    <option value="ember">Ember</option>
    <option value="void">Void</option>
    <option value="aurora">Aurora</option>
    <option value="mono">Mono</option>
  </select>
  <label style="margin-top:8px;">Mode</label>
  <select id="mode">
    <option value="standing">Standing Waves</option>
    <option value="radial">Radial Burst</option>
    <option value="interference">Interference</option>
    <option value="lissajous">Lissajous Field</option>
  </select>
  <div class="row" style="margin-top:8px;">
    <button id="btn-clear">Clear</button>
    <button id="btn-pause">Pause</button>
  </div>
  <button id="btn-save" style="margin-top:4px; width:100%;">Save PNG</button>
  <div style="margin-top:8px; color:#555; font-size:10px;">Click + drag to sculpt resonance. Shift+click for high-energy bursts.</div>
</div>
<div id="info">Click and drag to inject resonance energy into the field</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// State
let paused = false;
let mouseDown = false;
let shiftKey = false;
let mouseX = 0, mouseY = 0;
let prevMX = 0, prevMY = 0;
let sources = []; // active resonance sources {x, y, strength, life, maxLife, hOffset}
let field = null;
let frame = 0;

// Settings
const settings = {
  harmonics: 5, damping: 0.985, amp: 0.5, res: 8, palette: 'cyan', mode: 'standing'
};

// Palettes
const palettes = {
  cyan:  [[10,10,25], [0,200,220], [0,255,255], [100,180,255], [200,240,255]],
  nebula: [[15,5,25], [80,0,160], [200,50,255], [255,100,200], [255,200,220]],
  ember:  [[20,10,5], [180,60,0], [255,120,0], [255,200,50], [255,240,180]],
  void:   [[5,5,10], [30,0,60], [80,0,120], [150,0,180], [200,100,255]],
  aurora: [[5,15,10], [0,180,80], [0,220,180], [100,255,200], [200,255,230]],
  mono:   [[10,10,15], [60,60,80], [130,130,150], [200,200,210], [240,240,245]]
};

function getColor(t) {
  // t: 0..1
  const pal = palettes[settings.palette];
  t = Math.max(0, Math.min(1, t));
  const idx = t * (pal.length - 1);
  const i = Math.floor(idx);
  const f = idx - i;
  if (i >= pal.length - 1) return pal[pal.length - 1];
  return [
    pal[i][0] + (pal[i+1][0] - pal[i][0]) * f,
    pal[i][1] + (pal[i+1][1] - pal[i][1]) * f,
    pal[i][2] + (pal[i+1][2] - pal[i][2]) * f
  ];
}

function initField() {
  const cols = Math.ceil(W / settings.res) + 1;
  const rows = Math.ceil(H / settings.res) + 1;
  // We store wave amplitude and velocity per cell
  field = {
    amp: new Float32Array(cols * rows),
    vel: new Float32Array(cols * rows),
    cols, rows
  };
}

function addSource(x, y, strength, maxLife, hOff) {
  sources.push({
    x, y, strength, life: maxLife, maxLife, hOff: hOff || Math.random() * Math.PI * 2
  });
}

function injectEnergy(sx, sy, radius, strength) {
  if (!field) return;
  const col = Math.floor(sx / settings.res);
  const row = Math.floor(sy / settings.res);
  const rCells = Math.ceil(radius / settings.res);
  for (let dr = -rCells; dr <= rCells; dr++) {
    for (let dc = -rCells; dc <= rCells; dc++) {
      const c = col + dc, r = row + dr;
      if (c < 0 || r < 0 || c >= field.cols || r >= field.rows) continue;
      const px = c * settings.res, py = r * settings.res;
      const dx = px - sx, dy = py - sy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > radius) continue;
      const falloff = 1 - dist / radius;
      const idx = r * field.cols + c;
      field.amp[idx] += strength * falloff * falloff;
      field.vel[idx] += strength * falloff * 0.5;
    }
  }
}

function updateField() {
  if (!field) return;
  const { amp, vel, cols, rows } = field;
  const damp = settings.damping;
  const waveSpeed = 0.3;

  // Simple wave equation: accel = c² * laplacian - damping
  // Use a new array for the updated velocities
  const newVel = new Float32Array(vel.length);

  for (let r = 1; r < rows - 1; r++) {
    for (let c = 1; c < cols - 1; c++) {
      const idx = r * cols + c;
      // 5-point Laplacian
      const lap = amp[idx - 1] + amp[idx + 1] + amp[idx - cols] + amp[idx + cols] - 4 * amp[idx];
      newVel[idx] = damp * (vel[idx] + waveSpeed * waveSpeed * lap * 0.5);
    }
  }

  // Apply new velocities
  for (let i = 0; i < amp.length; i++) {
    vel[i] = newVel[i];
    amp[i] += vel[i];
    // Clamp
    if (amp[i] > 3) amp[i] = 3;
    if (amp[i] < -3) amp[i] = -3;
  }

  // Absorb at edges
  for (let r = 0; r < rows; r++) {
    amp[r] *= 0.5; amp[(rows-1)*cols + r] *= 0.5;
  }
  for (let c = 0; c < cols; c++) {
    amp[c*cols] *= 0.5; amp[c*cols + cols-1] *= 0.5;
  }
}

function render() {
  if (!field) return;
  const res = settings.res;
  const cols = field.cols, rows = field.rows;
  const imageData = ctx.createImageData(W, H);
  const data = imageData.data;

  // Precompute harmonics for mode-based coloring
  const harmonics = settings.harmonics;
  const mode = settings.mode;
  const t = frame * 0.01;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const c = Math.floor(x / res);
      const r = Math.floor(y / res);
      if (c < 0 || r < 0 || c >= cols || r >= rows) continue;

      let val = field.amp[r * cols + c];

      // Apply mode transforms
      if (mode === 'standing') {
        // Pure standing wave visualization
        val = val * settings.amp;
      } else if (mode === 'radial') {
        // Radial: emphasize outward propagating components
        const cx = c * res - W/2, cy = r * res - H/2;
        const dist = Math.sqrt(cx*cx + cy*cy);
        const radial = Math.sin(dist * 0.02 - frame * 0.05 * settings.amp) * 0.5;
        val = val * settings.amp + radial * 0.3;
      } else if (mode === 'interference') {
        // Dual-frequency interference
        const p1 = Math.sin(c * 0.3 + frame * 0.03) * Math.cos(r * 0.3 - frame * 0.02);
        const p2 = Math.cos(c * 0.15 - frame * 0.025) * Math.sin(r * 0.15 + frame * 0.035);
        val = val * settings.amp + (p1 + p2) * 0.2;
      } else if (mode === 'lissajous') {
        const p1 = Math.sin(c * 0.25 * settings.amp + frame * 0.02);
        const p2 = Math.sin(r * 0.25 * settings.amp + frame * 0.025);
        val = val * settings.amp + p1 * p2 * 0.4;
      }

      // Map to color: val is roughly -3..3
      const norm = (val + 3) / 6; // 0..1
      const intensity = Math.pow(Math.max(0, Math.min(1, norm)), 0.8);
      const [cr, cg, cb] = getColor(intensity);

      // Harmonic color modulation
      const harmonicMod = Math.sin(val * harmonics * 0.5) * 0.15;
      const finalR = Math.max(0, Math.min(255, cr + harmonicMod * 50));
      const finalG = Math.max(0, Math.min(255, cg + harmonicMod * 30));
      const finalB = Math.max(0, Math.min(255, cb));

      const idx = (y * W + x) * 4;
      data[idx]     = finalR;
      data[idx + 1] = finalG;
      data[idx + 2] = finalB;
      data[idx + 3] = 255;
    }
  }
  ctx.putImageData(imageData, 0, 0);

  // Draw subtle glow at mouse when pressing
  if (mouseDown) {
    const gradient = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 60);
    gradient.addColorStop(0, 'rgba(255,255,255,0.15)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(mouseX - 60, mouseY - 60, 120, 120);
  }
}

function animate() {
  if (!paused) {
    frame++;
    // Continuous subtle energy injection for auto-life
    if (frame % 8 === 0 && sources.length < 30) {
      const sx = Math.random() * W;
      const sy = Math.random() * H;
      addSource(sx, sy, 0.3 + Math.random() * 0.4, 60 + Math.random() * 120, Math.random() * Math.PI * 2);
    }

    // Update sources
    for (let i = sources.length - 1; i >= 0; i--) {
      const s = sources[i];
      const life = s.life / s.maxLife;
      if (life < 0.3) {
        injectEnergy(s.x, s.y, 40 * life, s.strength * life * 0.05);
      }
      s.life--;
      if (s.life <= 0) sources.splice(i, 1);
    }

    // Mouse drag injects energy
    if (mouseDown) {
      const dx = mouseX - prevMX, dy = mouseY - prevMY;
      const speed = Math.sqrt(dx*dx + dy*dy);
      const strength = shiftKey ? 1.5 : 0.4 + speed * 0.02;
      const radius = shiftKey ? 80 : 30 + speed * 0.5;
      injectEnergy(mouseX, mouseY, radius, strength);
      prevMX = mouseX; prevMY = mouseY;
    }

    updateField();
    render();
  }
  requestAnimationFrame(animate);
}

// Event handlers
canvas.addEventListener('mousedown', e => {
  mouseDown = true;
  prevMX = mouseX = e.clientX;
  prevMY = mouseY = e.clientY;
  if (e.shiftKey) {
    addSource(mouseX, mouseY, 2.0, 200, Math.random() * Math.PI * 2);
    // Immediate burst
    injectEnergy(mouseX, mouseY, 120, 3.0);
  } else {
    addSource(mouseX, mouseY, 1.0, 100, Math.random() * Math.PI * 2);
  }
});
canvas.addEventListener('mousemove', e => {
  prevMX = mouseX; prevMY = mouseY;
  mouseX = e.clientX;
  mouseY = e.clientY;
  if (!mouseDown) {
    // Gentle trail energy
    injectEnergy(mouseX, mouseY, 20, 0.08);
  }
});
canvas.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('mouseleave', () => { mouseDown = false; });
canvas.addEventListener('keydown', e => { shiftKey = e.shiftKey; });
canvas.addEventListener('keyup', e => { shiftKey = e.shiftKey; });

// Controls
function bind(id, key, suffix) {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    const v = parseFloat(el.value);
    settings[key] = v;
    if (id === 'res') initField();
    if (suffix) document.getElementById('v-' + key).textContent = v.toFixed(suffix);
    else document.getElementById('v-' + key).textContent = v;
  });
  // Initial display
  if (suffix) document.getElementById('v-' + key).textContent = parseFloat(el.value).toFixed(suffix);
  else document.getElementById('v-' + key).textContent = el.value;
}
bind('harmonics', 'harmonics', 0);
bind('damping', 'damping', 3);
bind('amp', 'amp', 2);
bind('res', 'res', 0);

document.getElementById('palette').addEventListener('change', e => {
  settings.palette = e.target.value;
});
document.getElementById('mode').addEventListener('change', e => {
  settings.mode = e.target.value;
});
document.getElementById('btn-clear').addEventListener('click', () => {
  initField();
  sources = [];
});
document.getElementById('btn-pause').addEventListener('click', e => {
  paused = !paused;
  e.target.textContent = paused ? 'Resume' : 'Pause';
});
document.getElementById('btn-save').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'resonant-topology.png';
  link.href = canvas.toDataURL();
  link.click();
});

// Prevent context menu on canvas for cleaner interaction
canvas.addEventListener('contextmenu', e => e.preventDefault());

// Init and go
initField();
// Seed with a few initial pulses so it's not empty
for (let i = 0; i < 5; i++) {
  addSource(W * (0.2 + Math.random() * 0.6), H * (0.2 + Math.random() * 0.6), 1.5, 150, Math.random() * Math.PI * 2);
}
animate();
</script>
</body>
</html>
