<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ripple Synth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
    user-select: none;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 10;
  }
  .btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.6);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-family: 'Courier New', monospace;
    cursor: pointer;
    transition: all 0.3s;
    backdrop-filter: blur(10px);
  }
  .btn:hover {
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.9);
    border-color: rgba(255,255,255,0.3);
  }
  .btn.active {
    background: rgba(120,200,255,0.15);
    border-color: rgba(120,200,255,0.4);
    color: rgba(120,200,255,0.9);
  }
  #hint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.3);
    font-size: 14px;
    font-family: 'Courier New', monospace;
    text-align: center;
    pointer-events: none;
    transition: opacity 2s;
  }
  #hint.fade { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">click anywhere to send ripples<br>hold & drag for continuous sound</div>
<div id="ui">
  <button class="btn active" onclick="setPalette(0)">Aurora</button>
  <button class="btn" onclick="setPalette(1)">Crimson</button>
  <button class="btn" onclick="setPalette(2)">Golden</button>
  <button class="btn" onclick="setPalette(3)">Violet</button>
  <button class="btn" onclick="setPalette(4)">Abyss</button>
  <button class="btn" onclick="toggleReflection()">Mirror: ON</button>
  <button class="btn" onclick="clearRipples()">Clear</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Audio ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
const PENTATONIC = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3, 659.3, 784.0, 880.0];

function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(x, y) {
  ensureAudio();
  const idx = Math.floor((x / W) * PENTATONIC.length);
  const freq = PENTATONIC[Math.min(idx, PENTATONIC.length - 1)];
  
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(2000 + (y / H) * 3000, audioCtx.currentTime);
  
  gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
  
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  
  osc.start();
  osc.stop(audioCtx.currentTime + 1.5);
}

function playAmbientChord() {
  ensureAudio();
  const notes = [PENTATONIC[0], PENTATONIC[2], PENTATONIC[4]];
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq / 2, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + i * 0.3);
    osc.stop(audioCtx.currentTime + 4);
  });
}

// --- Ripple Simulation ---
const SCALE = 4;
const COLS = () => Math.ceil(W / SCALE);
const ROWS = () => Math.ceil(H / SCALE);

let buf1, buf2, damp;
function initBuffers() {
  const size = COLS() * ROWS();
  buf1 = new Float32Array(size);
  buf2 = new Float32Array(size);
  damp = 0.97;
}
initBuffers();

function addRipple(cx, cy, strength = 512) {
  const col = Math.floor(cx / SCALE);
  const row = Math.floor(cy / SCALE);
  const r = 3;
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      const x = col + dx, y = row + dy;
      if (x > 0 && x < COLS()-1 && y > 0 && y < ROWS()-1) {
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < r) {
          buf1[y * COLS() + x] += strength * (1 - dist/r);
        }
      }
    }
  }
}

function stepRipples() {
  for (let y = 1; y < ROWS()-1; y++) {
    for (let x = 1; x < COLS()-1; x++) {
      const i = y * COLS() + x;
      buf2[i] = (
        buf1[i - 1] + buf1[i + 1] +
        buf1[i - COLS()] + buf1[i + COLS()]
      ) / 2 - buf2[i];
      buf2[i] *= damp;
    }
  }
  [buf1, buf2] = [buf2, buf1];
}

// --- Particles ---
const particles = [];
class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5 - 0.3;
    this.life = 1;
    this.decay = 0.003 + Math.random() * 0.008;
    this.size = 1 + Math.random() * 2;
    this.color = color;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy -= 0.003;
    this.life -= this.decay;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life * 0.6;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Palettes ---
const palettes = [
  { name: 'Aurora', bg: [8, 10, 20], colors: ['#64ffda', '#48bfe3', '#5390d9', '#7400b8', '#c77dff'] },
  { name: 'Crimson', bg: [20, 8, 8], colors: ['#ff6b6b', '#ee5a24', '#ff3838', '#ff9ff3', '#f368e0'] },
  { name: 'Golden', bg: [20, 16, 6], colors: ['#ffd32a', '#ffb142', '#eccc68', '#ffda79', '#f6e58d'] },
  { name: 'Violet', bg: [12, 6, 22], colors: ['#a29bfe', '#6c5ce7', '#fd79a8', '#e84393', '#d980fa'] },
  { name: 'Abyss', bg: [4, 6, 14], colors: ['#0abde3', '#48dbfb', '#00d2d3', '#01a3a4', '#54a0ff'] },
];
let currentPalette = 0;
let showReflection = true;

function setPalette(i) {
  currentPalette = i;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}
function toggleReflection() {
  showReflection = !showReflection;
  event.target.textContent = `Mirror: ${showReflection ? 'ON' : 'OFF'}`;
  event.target.classList.toggle('active', showReflection);
}
function clearRipples() {
  buf1.fill(0); buf2.fill(0);
  particles.length = 0;
}

// --- Interaction ---
let mouseDown = false, lastSpawn = 0;
canvas.addEventListener('mousedown', e => {
  mouseDown = true;
  spawnRipple(e.clientX, e.clientY);
});
canvas.addEventListener('mouseup', () => mouseDown = false);
canvas.addEventListener('mouseleave', () => mouseDown = false);
canvas.addEventListener('mousemove', e => {
  if (mouseDown && Date.now() - lastSpawn > 80) {
    spawnRipple(e.clientX, e.clientY);
    lastSpawn = Date.now();
  }
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  spawnRipple(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (Date.now() - lastSpawn > 80) {
    const t = e.touches[0];
    spawnRipple(t.clientX, t.clientY);
    lastSpawn = Date.now();
  }
}, { passive: false });

function spawnRipple(x, y) {
  addRipple(x, y, 400 + Math.random() * 300);
  playTone(x, y);
  const pal = palettes[currentPalette].colors;
  const col = pal[Math.floor(Math.random() * pal.length)];
  for (let i = 0; i < 8; i++) {
    particles.push(new Particle(x, y, col));
  }
}

// Fade hint on first click
let hintFaded = false;
canvas.addEventListener('click', () => {
  if (!hintFaded) {
    document.getElementById('hint').classList.add('fade');
    hintFaded = true;
    setTimeout(() => playAmbientChord(), 500);
  }
});

// --- Stars ---
const stars = [];
for (let i = 0; i < 200; i++) {
  stars.push({
    x: Math.random(),
    y: Math.random() * (showReflection ? 0.5 : 1),
    size: Math.random() * 1.5,
    twinkle: Math.random() * Math.PI * 2,
    speed: 0.01 + Math.random() * 0.03
  });
}

// --- Render ---
let frame = 0;
function render() {
  frame++;
  const pal = palettes[currentPalette];
  const [br, bg, bb] = pal.bg;
  
  // Background
  ctx.fillStyle = `rgb(${br},${bg},${bb})`;
  ctx.fillRect(0, 0, W, H);
  
  // Stars
  stars.forEach(s => {
    s.twinkle += s.speed;
    const alpha = 0.3 + 0.4 * Math.sin(s.twinkle);
    const sy = showReflection ? s.y * H * 2 : s.y * H;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x * W, sy, s.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  
  // Ripple shadows for depth
  const imgData = ctx.createImageData(W, H);
  const data = imgData.data;
  
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const bx = Math.floor(x / SCALE);
      const by = Math.floor(y / SCALE);
      if (bx >= COLS() || by >= ROWS()) continue;
      
      const val = buf1[by * COLS() + bx];
      const idx = (y * W + x) * 4;
      
      if (val > 0.5) {
        const intensity = Math.min(val / 400, 1);
        const ci = Math.floor((x / W) * pal.colors.length) % pal.colors.length;
        const hex = pal.colors[ci];
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);
        data[idx] = r * intensity;
        data[idx+1] = g * intensity;
        data[idx+2] = b * intensity;
        data[idx+3] = intensity * 180;
      } else if (val < -0.5) {
        const intensity = Math.min(-val / 400, 1);
        data[idx] = br * 0.5 * intensity;
        data[idx+1] = bg * 0.5 * intensity;
        data[idx+2] = bb * 0.5 * intensity;
        data[idx+3] = intensity * 80;
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
  
  // Reflection
  if (showReflection) {
    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.translate(0, H);
    ctx.scale(1, -1);
    ctx.drawImage(canvas, 0, 0);
    ctx.restore();
    
    // Gradient fade for reflection
    const grad = ctx.createLinearGradient(0, H/2, 0, H);
    grad.addColorStop(0, `rgba(${br},${bg},${bb},0)`);
    grad.addColorStop(1, `rgba(${br},${bg},${bb},1)`);
    ctx.globalAlpha = 1;
    ctx.fillStyle = grad;
    ctx.fillRect(0, H/2, W, H/2);
    
    // Horizon glow
    const hGlow = ctx.createLinearGradient(0, H/2 - 40, 0, H/2 + 40);
    hGlow.addColorStop(0, 'rgba(255,255,255,0)');
    hGlow.addColorStop(0.5, 'rgba(255,255,255,0.03)');
    hGlow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hGlow;
    ctx.fillRect(0, H/2 - 40, W, 80);
  }
  
  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;
  
  // Ambient floating particles
  if (frame % 30 === 0) {
    const ax = Math.random() * W;
    const ay = showReflection ? H * 0.3 + Math.random() * H * 0.5 : Math.random() * H;
    particles.push(new Particle(ax, ay, pal.colors[Math.floor(Math.random() * pal.colors.length)]));
  }
  
  // Step physics
  stepRipples();
  
  // Auto-decay: add tiny ambient ripples
  if (frame % 120 === 0 && buf1.every(v => Math.abs(v) < 2)) {
    const ax = Math.random() * W;
    const ay = showReflection ? H * 0.4 + Math.random() * H * 0.3 : Math.random() * H;
    addRipple(ax, ay, 30);
  }
  
  requestAnimationFrame(render);
}

render();

// Resize handler
window.addEventListener('resize', () => {
  resize();
  initBuffers();
});
</script>
</body>
</html>
