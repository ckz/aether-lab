<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ripple Tank — Aether Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #06060e;
    font-family: 'Courier New', monospace;
    color: #aab;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
    min-height: 100vh;
  }
  h1 {
    font-size: 1.2rem;
    font-weight: normal;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: #8899cc;
    margin-bottom: 4px;
  }
  .sub {
    font-size: .65rem;
    opacity: .4;
    letter-spacing: .25em;
    margin-bottom: 20px;
  }
  canvas {
    border: 1px solid rgba(80,70,160,.25);
    border-radius: 4px;
    cursor: crosshair;
    display: block;
    max-width: 100%;
  }
  .controls {
    margin-top: 18px;
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: .65rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: #7788aa;
  }
  .controls label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .controls input[type=range] {
    width: 90px;
    accent-color: #6677bb;
  }
  .hint {
    margin-top: 14px;
    font-size: .6rem;
    opacity: .3;
    letter-spacing: .2em;
  }
</style>
</head>
<body>
<h1>Ripple Tank</h1>
<p class="sub">2D wave equation · interference patterns</p>
<canvas id="c"></canvas>
<div class="controls">
  <label>Damping <input id="damp" type="range" min="0.96" max="0.999" step="0.001" value="0.985"></label>
  <label>Speed <input id="speed" type="range" min="0.3" max="1.5" step="0.05" value="0.5"></label>
  <label>Radius <input id="radius" type="range" min="1" max="8" step="1" value="3"></label>
  <label>Palette
    <select id="palette">
      <option value="ocean">Ocean</option>
      <option value="thermal">Thermal</option>
      <option value="neon">Neon</option>
      <option value="mono">Mono</option>
      <option value="aurora">Aurora</option>
    </select>
  </label>
  <label><input id="rain" type="checkbox"> Rain</label>
  <button id="clear" style="background:none;border:1px solid rgba(100,90,180,.3);color:#7788aa;padding:4px 12px;border-radius:3px;cursor:pointer;font-family:inherit;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;">Clear</button>
</div>
<p class="hint">Click or drag to disturb the surface</p>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = Math.min(700, window.innerWidth - 40);
const H = Math.min(500, window.innerHeight - 260);
canvas.width = W;
canvas.height = H;

const cols = W;
const rows = H;

let current = new Float32Array(cols * rows);
let previous = new Float32Array(cols * rows);

const dampSlider = document.getElementById('damp');
const speedSlider = document.getElementById('speed');
const radiusSlider = document.getElementById('radius');
const paletteSelect = document.getElementById('palette');
const rainCheckbox = document.getElementById('rain');
const clearBtn = document.getElementById('clear');

let painting = false;
let mouseX = 0, mouseY = 0;
let imgData = ctx.createImageData(W, H);
let buf = new Uint32Array(imgData.data.buffer);

const palettes = {
  ocean: (v) => {
    const r = Math.max(0, Math.min(255, (v + 0.5) * 180));
    const g = Math.max(0, Math.min(255, (v + 0.3) * 200 + 30));
    const b = Math.max(0, Math.min(255, (v + 0.6) * 255 + 80));
    return (255 << 24) | (b << 16) | (g << 8) | r;
  },
  thermal: (v) => {
    const n = Math.max(0, Math.min(1, (v + 0.5) * 0.7 + 0.2));
    const r = Math.min(255, n * 400);
    const g = Math.min(255, Math.max(0, (n - 0.3) * 300));
    const b = Math.min(255, Math.max(0, (n - 0.7) * 500));
    return (255 << 24) | (b << 16) | (g << 8) | Math.min(255, r);
  },
  neon: (v) => {
    const n = (v + 0.5) * 0.5 + 0.5;
    const r = Math.sin(n * 6.28) > 0 ? Math.min(255, (Math.sin(n * 6.28) * 255)) : 0;
    const g = Math.sin(n * 6.28 + 2.09) > 0 ? Math.min(255, (Math.sin(n * 6.28 + 2.09) * 255)) : 0;
    const b = Math.sin(n * 6.28 + 4.18) > 0 ? Math.min(255, (Math.sin(n * 6.28 + 4.18) * 255)) : 0;
    return (255 << 24) | (b << 16) | (g << 8) | r;
  },
  mono: (v) => {
    const n = Math.max(0, Math.min(255, (v + 0.5) * 255 + 80));
    return (255 << 24) | (n << 16) | (n << 8) | n;
  },
  aurora: (v) => {
    const n = (v + 0.5) * 0.6 + 0.3;
    const r = Math.sin(n * 3.14) * 60 + 30;
    const g = Math.sin(n * 3.14 + 1.2) * 180 + 100;
    const b = Math.sin(n * 3.14 + 2.5) * 200 + 120;
    return (255 << 24) | (Math.min(255,b) << 16) | (Math.min(255,g) << 8) | Math.min(255, r);
  }
};

let colorFn = palettes.ocean;
let rainTimer = 0;

function disturb(x, y, strength) {
  const r = parseInt(radiusSlider.value);
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist <= r) {
        const nx = Math.floor(x + dx);
        const ny = Math.floor(y + dy);
        if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
          const falloff = 1 - dist / r;
          current[ny * cols + nx] += strength * falloff;
        }
      }
    }
  }
}

function step() {
  const speed = parseFloat(speedSlider.value);
  const damp = parseFloat(dampSlider.value);
  const next = new Float32Array(cols * rows);

  for (let y = 1; y < rows - 1; y++) {
    for (let x = 1; x < cols - 1; x++) {
      const i = y * cols + x;
      next[i] = (
        current[i - 1] +
        current[i + 1] +
        current[i - cols] +
        current[i + cols]
      ) / 2 - previous[i];
      next[i] *= damp;
    }
  }

  previous = current;
  current = next;
}

function render() {
  colorFn = palettes[paletteSelect.value] || palettes.ocean;

  for (let i = 0; i < cols * rows; i++) {
    const v = Math.max(-1, Math.min(1, current[i]));
    buf[i] = colorFn(v);
  }

  ctx.putImageData(imgData, 0, 0);
}

function loop() {
  if (painting) {
    disturb(mouseX, mouseY, 256);
  }

  if (rainCheckbox.checked) {
    rainTimer++;
    if (rainTimer % 6 === 0) {
      const rx = Math.random() * cols;
      const ry = Math.random() * rows;
      disturb(rx, ry, 80 + Math.random() * 150);
    }
  }

  step();
  render();
  requestAnimationFrame(loop);
}

canvas.addEventListener('mousedown', (e) => {
  painting = true;
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
  mouseY = (e.clientY - rect.top) * (H / rect.height);
  disturb(mouseX, mouseY, 300);
});
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
  mouseY = (e.clientY - rect.top) * (H / rect.height);
});
canvas.addEventListener('mouseup', () => painting = false);
canvas.addEventListener('mouseleave', () => painting = false);

// Touch support
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  painting = true;
  const rect = canvas.getBoundingClientRect();
  const t = e.touches[0];
  mouseX = (t.clientX - rect.left) * (W / rect.width);
  mouseY = (t.clientY - rect.top) * (H / rect.height);
  disturb(mouseX, mouseY, 300);
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const t = e.touches[0];
  mouseX = (t.clientX - rect.left) * (W / rect.width);
  mouseY = (t.clientY - rect.top) * (H / rect.height);
}, { passive: false });
canvas.addEventListener('touchend', () => painting = false);

clearBtn.addEventListener('click', () => {
  current.fill(0);
  previous.fill(0);
});

loop();
</script>
</body>
</html>
