<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ripple Tank — Interactive Wave Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    background: linear-gradient(180deg, #111118 0%, transparent 100%);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    border-bottom: 1px solid #1a1a2e;
  }
  h1 {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #6ec6f8;
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    color: #ccc;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .btn:hover { background: #2a2a4a; color: #fff; border-color: #6ec6f8; }
  .btn.active { background: #6ec6f8; color: #0a0a0f; border-color: #6ec6f8; }
  canvas {
    flex: 1;
    cursor: crosshair;
    display: block;
  }
  .info {
    position: fixed;
    bottom: 16px;
    left: 16px;
    font-size: 11px;
    color: #555;
    z-index: 10;
    line-height: 1.6;
  }
  .info kbd {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    padding: 1px 6px;
    border-radius: 3px;
    color: #888;
    font-family: inherit;
    font-size: 10px;
  }
  .palette-indicator {
    position: fixed;
    top: 60px;
    right: 16px;
    font-size: 10px;
    color: #666;
    z-index: 10;
    text-align: right;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .slider-group {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  input[type="range"] {
    width: 80px;
    accent-color: #6ec6f8;
  }
</style>
</head>
<body>
<header>
  <h1>◈ Ripple Tank</h1>
  <div class="controls">
    <div class="slider-group">
      <span>Damping</span>
      <input type="range" id="damping" min="0.90" max="0.999" step="0.001" value="0.995">
    </div>
    <div class="slider-group">
      <span>Speed</span>
      <input type="range" id="speed" min="0.1" max="2.0" step="0.1" value="1.0">
    </div>
    <button class="btn active" id="modeClick">Click</button>
    <button class="btn" id="modeRain">Rain</button>
    <button class="btn" id="modePulse">Pulse</button>
    <button class="btn" id="clearBtn">Clear</button>
    <button class="btn" id="paletteBtn">Palette</button>
  </div>
</header>
<canvas id="canvas"></canvas>
<div class="palette-indicator" id="paletteIndicator">Aurora</div>
<div class="info">
  <kbd>Click</kbd> create ripple · <kbd>Drag</kbd> continuous source · <kbd>Space</kbd> pause · <kbd>C</kbd> clear · <kbd>P</kbd> palette
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
const SCALE = 4; // simulation runs at 1/4 resolution
let cols, rows;
let current, previous;

let mode = 'click'; // click, rain, pulse
let paused = false;
let mouseDown = false;
let mouseX = 0, mouseY = 0;
let damping = 0.995;
let speed = 1.0;
let frameCount = 0;

const PALETTES = {
  'Aurora':  { bg: [8, 8, 20],    stops: [[10, 30, 80], [20, 100, 160], [80, 200, 220], [180, 240, 255]] },
  'Ember':   { bg: [20, 8, 5],    stops: [[80, 20, 5], [180, 50, 10], [240, 140, 40], [255, 230, 180]] },
  'Frost':   { bg: [5, 10, 20],   stops: [[15, 30, 60], [40, 80, 140], [100, 170, 220], [200, 240, 255]] },
  'Void':    { bg: [10, 0, 20],   stops: [[30, 0, 60], [80, 20, 120], [160, 60, 200], [240, 180, 255]] },
  'Ocean':   { bg: [5, 10, 15],   stops: [[10, 40, 60], [20, 80, 120], [40, 140, 180], [100, 210, 240]] },
  'Toxic':   { bg: [5, 15, 5],    stops: [[20, 60, 20], [60, 140, 30], [140, 220, 50], [220, 255, 140]] }
};
let paletteKeys = Object.keys(PALETTES);
let currentPalette = 0;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight - 50;
  canvas.width = W;
  canvas.height = H;
  cols = Math.floor(W / SCALE);
  rows = Math.floor(H / SCALE);
  current = new Float32Array(cols * rows);
  previous = new Float32Array(cols * rows);
}

function idx(x, y) {
  return y * cols + x;
}

function setWave(x, y, strength) {
  const sx = Math.floor(x / SCALE);
  const sy = Math.floor(y / SCALE);
  if (sx > 1 && sx < cols - 2 && sy > 1 && sy < rows - 2) {
    const r = 2;
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist <= r) {
          const falloff = 1 - dist / r;
          current[idx(sx + dx, sy + dy)] += strength * falloff * falloff;
        }
      }
    }
  }
}

function step() {
  const next = new Float32Array(cols * rows);
  for (let y = 1; y < rows - 1; y++) {
    for (let x = 1; x < cols - 1; x++) {
      const i = idx(x, y);
      next[i] = (
        2 * current[i] - previous[i] +
        0.25 * (current[idx(x-1,y)] + current[idx(x+1,y)] +
                current[idx(x,y-1)] + current[idx(x,y+1)] - 4 * current[i])
      ) * damping;
    }
  }
  previous = current;
  current = next;
}

function getColor(val) {
  const p = PALETTES[paletteKeys[currentPalette]];
  const abs = Math.min(Math.abs(val), 1);
  const stops = p.stops;
  const n = stops.length - 1;
  const t = abs * n;
  const i = Math.min(Math.floor(t), n - 1);
  const f = t - i;
  
  const c1 = stops[i];
  const c2 = stops[i + 1];
  const r = Math.round(c1[0] + (c2[0] - c1[0]) * f);
  const g = Math.round(c1[1] + (c2[1] - c1[1]) * f);
  const b = Math.round(c1[2] + (c2[2] - c1[2]) * f);
  
  // Mix with background based on distance from zero
  const bg = p.bg;
  const mix = abs * abs;
  return [
    Math.round(bg[0] + (r - bg[0]) * mix),
    Math.round(bg[1] + (g - bg[1]) * mix),
    Math.round(bg[2] + (b - bg[2]) * mix)
  ];
}

function render() {
  const imageData = ctx.createImageData(W, H);
  const data = imageData.data;
  
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const sx = Math.floor(x / SCALE);
      const sy = Math.floor(y / SCALE);
      const val = current[idx(sx, sy)];
      const [r, g, b] = getColor(val);
      
      const i = (y * W + x) * 4;
      data[i] = r;
      data[i + 1] = g;
      data[i + 2] = b;
      data[i + 3] = 255;
    }
  }
  
  ctx.putImageData(imageData, 0, 0);
}

let imageDataCache = null;

function renderOptimized() {
  // Downsample: render at simulation resolution then scale up
  const sw = cols;
  const sh = rows;
  
  if (!imageDataCache || imageDataCache.width !== sw || imageDataCache.height !== sh) {
    imageDataCache = ctx.createImageData(sw, sh);
  }
  
  const data = imageDataCache.data;
  
  for (let y = 0; y < sh; y++) {
    for (let x = 0; x < sw; x++) {
      const val = current[idx(x, y)];
      const [r, g, b] = getColor(val);
      const i = (y * sw + x) * 4;
      data[i] = r;
      data[i + 1] = g;
      data[i + 2] = b;
      data[i + 3] = 255;
    }
  }
  
  // Create temp canvas for scaling
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = sw;
  tempCanvas.height = sh;
  tempCanvas.getContext('2d').putImageData(imageDataCache, 0, 0);
  
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(tempCanvas, 0, 0, W, H);
}

function loop() {
  if (!paused) {
    for (let s = 0; s < speed; s++) {
      step();
    }
    frameCount++;
    
    if (mode === 'rain' && frameCount % 3 === 0) {
      const rx = Math.random() * W;
      const ry = Math.random() * H;
      const strength = 0.3 + Math.random() * 0.7;
      setWave(rx, ry, strength);
    }
    
    if (mode === 'pulse' && frameCount % 40 === 0) {
      const cx = W / 2 + Math.cos(frameCount * 0.02) * W * 0.25;
      const cy = H / 2 + Math.sin(frameCount * 0.03) * H * 0.2;
      const strength = 0.8 + Math.sin(frameCount * 0.05) * 0.4;
      setWave(cx, cy, strength);
    }
    
    if (mouseDown) {
      setWave(mouseX, mouseY, 0.6);
    }
    
    renderOptimized();
  }
  
  requestAnimationFrame(loop);
}

// Seed initial waves
function seed() {
  for (let i = 0; i < 5; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    setWave(x, y, 0.5 + Math.random() * 0.5);
  }
}

// Events
canvas.addEventListener('mousedown', (e) => {
  mouseDown = true;
  mouseX = e.clientX;
  mouseY = e.clientY;
  if (mode === 'click') setWave(mouseX, mouseY, 1.0);
});

canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

canvas.addEventListener('mouseup', () => mouseDown = false);
canvas.addEventListener('mouseleave', () => mouseDown = false);

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  mouseDown = true;
  const t = e.touches[0];
  mouseX = t.clientX;
  mouseY = t.clientY;
  if (mode === 'click') setWave(mouseX, mouseY, 1.0);
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  mouseX = t.clientX;
  mouseY = t.clientY;
}, { passive: false });

canvas.addEventListener('touchend', () => mouseDown = false);

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
  if (e.code === 'KeyC') { current.fill(0); previous.fill(0); }
  if (e.code === 'KeyP') { cyclePalette(); }
});

document.getElementById('damping').addEventListener('input', (e) => {
  damping = parseFloat(e.target.value);
});

document.getElementById('speed').addEventListener('input', (e) => {
  speed = parseFloat(e.target.value);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  current.fill(0);
  previous.fill(0);
});

document.getElementById('paletteBtn').addEventListener('click', cyclePalette);

function cyclePalette() {
  currentPalette = (currentPalette + 1) % paletteKeys.length;
  document.getElementById('paletteIndicator').textContent = paletteKeys[currentPalette];
}

function setMode(m) {
  mode = m;
  document.getElementById('modeClick').classList.toggle('active', m === 'click');
  document.getElementById('modeRain').classList.toggle('active', m === 'rain');
  document.getElementById('modePulse').classList.toggle('active', m === 'pulse');
}

document.getElementById('modeClick').addEventListener('click', () => setMode('click'));
document.getElementById('modeRain').addEventListener('click', () => setMode('rain'));
document.getElementById('modePulse').addEventListener('click', () => setMode('pulse'));

window.addEventListener('resize', () => {
  const oldCurrent = current;
  const oldPrevious = previous;
  resize();
  // Copy old data
  for (let y = 0; y < Math.min(rows, oldCurrent.length ? Math.sqrt(oldCurrent.length) : 0); y++) {
    for (let x = 0; x < Math.min(cols, oldCurrent.length ? Math.sqrt(oldCurrent.length) : 0); x++) {
      // approximate copy
    }
  }
  seed();
});

// Init
resize();
seed();
loop();
</script>
</body>
</html>
