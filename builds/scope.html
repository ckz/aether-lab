<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scope — Project Context Switcher</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent2: #7c3aed;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --orange: #db6d28;
    --radius: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    min-height: 100vh;
    font-size: 13px;
    line-height: 1.6;
  }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }
  .logo span { font-weight: 300; opacity: 0.6; -webkit-text-fill-color: var(--muted); }
  .search-box {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px 6px 32px;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 12px;
    transition: border-color 0.2s;
  }
  .search-box input:focus { outline: none; border-color: var(--accent); }
  .search-box::before {
    content: '🔍';
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    opacity: 0.5;
  }
  .header-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* Buttons */
  button, .btn {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  button:hover, .btn:hover { background: var(--border); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { background: #79b8ff; }
  button.danger { background: transparent; color: var(--red); border-color: var(--red); }
  button.danger:hover { background: rgba(248,81,73,0.1); }
  button.small { padding: 4px 10px; font-size: 11px; }
  button.icon { padding: 6px 10px; }

  /* Main layout */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
  }

  /* Stats bar */
  .stats {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 16px;
    flex: 1;
    min-width: 120px;
  }
  .stat-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .stat-value { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .stat-value.accent { color: var(--accent); }
  .stat-value.green { color: var(--green); }
  .stat-value.yellow { color: var(--yellow); }

  /* Filter pills */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-label { color: var(--muted); font-size: 11px; }
  .pill {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 11px;
    transition: all 0.15s;
    user-select: none;
  }
  .pill:hover { background: var(--surface2); }
  .pill.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .pill .count {
    opacity: 0.6;
    margin-left: 4px;
    font-size: 10px;
  }

  /* Cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    transition: all 0.2s;
    position: relative;
    cursor: pointer;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
  }
  .card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    word-break: break-word;
  }
  .card-path {
    color: var(--accent);
    font-size: 11px;
    opacity: 0.85;
    word-break: break-all;
    margin-bottom: 6px;
  }
  .card-meta {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .card-meta span { display: flex; align-items: center; gap: 4px; }
  .card-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 10px;
    color: var(--muted);
  }
  .card-notes {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .card-actions button { flex: 1; min-width: 60px; }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty h2 { font-size: 16px; margin-bottom: 8px; color: var(--text); }
  .empty p { max-width: 400px; margin: 0 auto; line-height: 1.6; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 90%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow);
  }
  .modal h2 {
    margin-bottom: 16px;
    font-size: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    padding: 0;
    width: 28px;
    height: 28px;
    border-radius: 4px;
  }
  .modal-close:hover { background: var(--surface2); color: var(--text); }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    margin-bottom: 4px;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 12px;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .form-hint {
    color: var(--muted);
    font-size: 10px;
    margin-top: 3px;
    font-style: italic;
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 20px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--green);
    padding: 10px 16px;
    border-radius: var(--radius);
    font-size: 12px;
    box-shadow: var(--shadow);
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s;
    z-index: 200;
    max-width: 320px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.warn { border-left-color: var(--yellow); }
  .toast.error { border-left-color: var(--red); }

  /* Keyboard shortcuts bar */
  .shortcuts {
    position: fixed;
    bottom: 12px;
    left: 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 10px;
    color: var(--muted);
    opacity: 0.6;
  }
  kbd {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 3px;
    font-family: inherit;
    font-size: 10px;
  }

  /* Import area */
  .import-area {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 24px;
    text-align: center;
    color: var(--muted);
    margin-bottom: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .import-area:hover, .import-area.dragover {
    border-color: var(--accent);
    background: rgba(88,166,255,0.05);
  }
  .import-area input { display: none; }

  @media (max-width: 600px) {
    .cards { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    header { padding: 12px; }
    main { padding: 12px; }
    .shortcuts { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">◈ scope<span>.sh</span></div>
  <div class="search-box">
    <input type="text" id="search" placeholder="Search projects..." autocomplete="off">
  </div>
  <div class="header-actions">
    <button class="primary" onclick="openModal()">＋ New Context</button>
    <button onclick="exportAll()">⬇ Export</button>
    <button onclick="document.getElementById('importFile').click()">⬆ Import</button>
    <button onclick="clearAll()" class="danger">Clear</button>
  </div>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importAll(event)">
</header>

<main>
  <div class="stats" id="stats"></div>

  <div class="filter-bar" id="filterBar">
    <span class="filter-label">Filter:</span>
    <span class="pill active" data-filter="all" onclick="setFilter('all')">All <span class="count" id="countAll">0</span></span>
    <span class="pill" data-filter="recent" onclick="setFilter('recent')">Recent <span class="count" id="countRecent">0</span></span>
  </div>

  <div class="cards" id="cards"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="empty-icon">📂</div>
    <h2>No projects yet</h2>
    <p>Hit <kbd>N</kbd> or the <strong>+ New Context</strong> button to save your first project workspace.</p>
  </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>
      <span id="modalTitle">New Context</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </h2>
    <form id="ctxForm" onsubmit="saveContext(event)">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>Project Name *</label>
        <input type="text" id="fname" placeholder="my-awesome-project" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Working Directory</label>
          <input type="text" id="fpath" placeholder="/home/user/projects/foo">
        </div>
        <div class="form-group">
          <label>Git Branch</label>
          <input type="text" id="fbranch" placeholder="main">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Last Commit</label>
          <input type="text" id="fcommit" placeholder="abc1234 feat: add thing">
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="fcategory">
            <option value="">— none —</option>
            <option value="work">💼 Work</option>
            <option value="side">🛸 Side Project</option>
            <option value="oss">🌍 Open Source</option>
            <option value="client">🤝 Client</option>
            <option value="personal">🏠 Personal</option>
            <option value="learning">📚 Learning</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Tags</label>
        <input type="text" id="ftags" placeholder="react, api, urgent (comma-separated)">
        <div class="form-hint">Press comma or Enter to add a tag</div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="fnotes" placeholder="What's this project about? Any gotchas?"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" onclick="closeModal()">Cancel</button>
        <button type="submit" class="primary">Save Context</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="shortcuts">
  <span><kbd>N</kbd> New</span>
  <span><kbd>/</kbd> Search</span>
  <span><kbd>Esc</kbd> Close</span>
  <span><kbd>Ctrl+E</kbd> Export</span>
</div>

<script>
// ─── Data Layer ──────────────────────────────────────────────────────────────
const STORAGE_KEY = 'scope_contexts_v1';
let contexts = [];
let currentFilter = 'all';
let searchQuery = '';

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    contexts = raw ? JSON.parse(raw) : [];
  } catch { contexts = []; }
  // migrate if needed
  contexts = contexts.map(c => ({
    id: c.id || genId(),
    name: c.name || 'Untitled',
    path: c.path || '',
    branch: c.branch || '',
    commit: c.commit || '',
    category: c.category || '',
    tags: Array.isArray(c.tags) ? c.tags : [],
    notes: c.notes || '',
    createdAt: c.createdAt || Date.now(),
    lastSwitched: c.lastSwitched || Date.now(),
    switchCount: c.switchCount || 0
  }));
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(contexts));
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// ─── CRUD ────────────────────────────────────────────────────────────────────
function saveContext(e) {
  e.preventDefault();
  const editId = document.getElementById('editId').value;
  const data = {
    name: document.getElementById('fname').value.trim(),
    path: document.getElementById('fpath').value.trim(),
    branch: document.getElementById('fbranch').value.trim(),
    commit: document.getElementById('fcommit').value.trim(),
    category: document.getElementById('fcategory').value,
    tags: document.getElementById('ftags').value.split(',').map(t => t.trim()).filter(Boolean),
    notes: document.getElementById('fnotes').value.trim()
  };
  if (!data.name) return;

  if (editId) {
    const idx = contexts.findIndex(c => c.id === editId);
    if (idx !== -1) { contexts[idx] = { ...contexts[idx], ...data }; }
  } else {
    contexts.unshift({
      id: genId(), ...data,
      createdAt: Date.now(),
      lastSwitched: Date.now(),
      switchCount: 0
    });
  }
  save();
  closeModal();
  render();
  toast(editId ? '✓ Context updated' : '✓ Context saved');
}

function deleteContext(id) {
  if (!confirm('Delete this context?')) return;
  contexts = contexts.filter(c => c.id !== id);
  save();
  render();
  toast('🗑 Context deleted', 'warn');
}

function switchContext(id) {
  const ctx = contexts.find(c => c.id === id);
  if (!ctx) return;
  const text = ctx.path ? `cd ${ctx.path}` : '';
  if (ctx.branch) {
    const branchCmd = ctx.path ? ` && git checkout ${ctx.branch}` : `git checkout ${ctx.branch}`;
    navigator.clipboard.writeText(text + branchCmd).then(() => {
      toast(`📋 Copied: cd ${ctx.path}${text ? '' : ''}${ctx.branch ? ' && git checkout ' + ctx.branch : ''}`);
    }).catch(() => {
      toast(`📍 ${ctx.name}\n${text}${branchCmd}`);
    });
  } else if (ctx.path) {
    navigator.clipboard.writeText(text).then(() => {
      toast(`📋 Copied: cd ${ctx.path}`);
    }).catch(() => {
      toast(`📍 ${ctx.name}\n${text}`);
    });
  } else {
    toast(`📍 ${ctx.name} — no path set`);
  }
  ctx.lastSwitched = Date.now();
  ctx.switchCount = (ctx.switchCount || 0) + 1;
  save();
  render();
}

function editContext(id) {
  const ctx = contexts.find(c => c.id === id);
  if (!ctx) return;
  document.getElementById('editId').value = ctx.id;
  document.getElementById('fname').value = ctx.name;
  document.getElementById('fpath').value = ctx.path;
  document.getElementById('fbranch').value = ctx.branch;
  document.getElementById('fcommit').value = ctx.commit;
  document.getElementById('fcategory').value = ctx.category;
  document.getElementById('ftags').value = ctx.tags.join(', ');
  document.getElementById('fnotes').value = ctx.notes;
  document.getElementById('modalTitle').textContent = 'Edit Context';
  document.getElementById('modal').classList.add('show');
}

// ─── Modal ───────────────────────────────────────────────────────────────────
function openModal() {
  document.getElementById('ctxForm').reset();
  document.getElementById('editId').value = '';
  document.getElementById('modalTitle').textContent = 'New Context';
  document.getElementById('modal').classList.add('show');
  setTimeout(() => document.getElementById('fname').focus(), 100);
}
function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

// ─── Filter & Search ─────────────────────────────────────────────────────────
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.pill').forEach(p => {
    p.classList.toggle('active', p.dataset.filter === f);
  });
  render();
}

function render() {
  let list = [...contexts];

  // filter
  if (currentFilter === 'recent') {
    const week = 7 * 24 * 3600 * 1000;
    list = list.filter(c => Date.now() - c.lastSwitched < week);
  }

  // search
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(c =>
      c.name.toLowerCase().includes(q) ||
      c.path.toLowerCase().includes(q) ||
      c.branch.toLowerCase().includes(q) ||
      c.tags.some(t => t.toLowerCase().includes(q)) ||
      c.notes.toLowerCase().includes(q)
    );
  }

  // sort by last switched
  list.sort((a, b) => b.lastSwitched - a.lastSwitched);

  // stats
  const total = contexts.length;
  const cats = {};
  contexts.forEach(c => { if (c.category) cats[c.category] = (cats[c.category]||0) + 1; });
  const topCat = Object.entries(cats).sort((a,b) => b[1] - a[1])[0];
  const totalSwitches = contexts.reduce((s, c) => s + (c.switchCount || 0), 0);
  const recentCount = contexts.filter(c => Date.now() - c.lastSwitched < 7*24*3600*1000).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">Projects</div><div class="stat-value accent">${total}</div></div>
    <div class="stat"><div class="stat-label">Switches</div><div class="stat-value green">${totalSwitches}</div></div>
    <div class="stat"><div class="stat-label">Active This Week</div><div class="stat-value yellow">${recentCount}</div></div>
    <div class="stat"><div class="stat-label">Top Category</div><div class="stat-value">${topCat ? topCat[0] : '—'}</div></div>
  `;

  // filter counts
  document.getElementById('countAll').textContent = total;
  document.getElementById('countRecent').textContent = recentCount;

  // cards
  const container = document.getElementById('cards');
  const empty = document.getElementById('empty');
  if (list.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    container.innerHTML = list.map(ctx => {
      const timeAgo = formatTimeAgo(ctx.lastSwitched);
      const catEmoji = { work:'💼', side:'🛸', oss:'🌍', client:'🤝', personal:'🏠', learning:'📚' }[ctx.category] || '📁';
      const branchHtml = ctx.branch ? `<span>⎇ ${ctx.branch}</span>` : '';
      const commitHtml = ctx.commit ? `<span title="${ctx.commit}">⌥ ${ctx.commit.slice(0, 40)}</span>` : '';
      const pathHtml = ctx.path ? `<div class="card-path">${esc(ctx.path)}</div>` : '';
      return `
        <div class="card">
          <div class="card-header">
            <div style="flex:1;min-width:0">
              <div class="card-title">${catEmoji} ${esc(ctx.name)}</div>
              ${pathHtml}
            </div>
            <div style="font-size:10px;color:var(--muted);white-space:nowrap">${timeAgo}</div>
          </div>
          <div class="card-meta">
            ${branchHtml}
            ${commitHtml}
            <span>↩ ${ctx.switchCount || 0}</span>
          </div>
          ${ctx.tags.length ? `<div class="card-tags">${ctx.tags.slice(0, 6).map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>` : ''}
          ${ctx.notes ? `<div class="card-notes">${esc(ctx.notes)}</div>` : ''}
          <div class="card-actions">
            <button class="primary small" onclick="switchContext('${ctx.id}')">⎘ Switch</button>
            <button class="small" onclick="event.stopPropagation();editContext('${ctx.id}')">✎ Edit</button>
            <button class="danger small" onclick="event.stopPropagation();deleteContext('${ctx.id}')">✕</button>
          </div>
        </div>
      `;
    }).join('');
  }
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function formatTimeAgo(ts) {
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 7) return `${days}d ago`;
  return new Date(ts).toLocaleDateString();
}

// ─── Import / Export ─────────────────────────────────────────────────────────
function exportAll() {
  const data = JSON.stringify(contexts, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `scope-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('✓ Exported all contexts');
}

function importAll(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!Array.isArray(imported)) throw new Error('Invalid format');
      let added = 0;
      imported.forEach(c => {
        if (c.name && !contexts.find(x => x.id === c.id)) {
          contexts.push({ ...c, id: genId() });
          added++;
        }
      });
      save();
      render();
      toast(`✓ Imported ${added} contexts`);
    } catch {
      toast('✗ Invalid file format', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function clearAll() {
  if (!contexts.length) return;
  if (!confirm('Delete ALL contexts? This cannot be undone.')) return;
  if (!confirm('Are you sure? Everything will be wiped.')) return;
  contexts = [];
  save();
  render();
  toast('🗑 All contexts cleared', 'warn');
}

// ─── Toast ───────────────────────────────────────────────────────────────────
let toastTimeout;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + type + ' show';
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove('show'), 3000);
}

// ─── Keyboard shortcuts ──────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  // Don't trigger when typing in inputs
  const inInput = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);

  if (e.key === 'n' && !inInput && !e.metaKey && !e.ctrlKey) {
    e.preventDefault(); openModal();
  }
  if (e.key === '/' && !inInput && !e.metaKey && !e.ctrlKey) {
    e.preventDefault(); document.getElementById('search').focus();
  }
  if (e.key === 'Escape') {
    closeModal();
    document.getElementById('search').blur();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'e') {
    e.preventDefault(); exportAll();
  }
});

document.getElementById('search').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  render();
});

// close modal on overlay click
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal')) closeModal();
});

// ─── Init ────────────────────────────────────────────────────────────────────
load();
render();
</script>
