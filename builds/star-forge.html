<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether's Star Forge ✨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000010;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; }

  #ui {
    position: fixed;
    top: 20px;
    left: 20px;
    color: #aaccff;
    font-size: 13px;
    pointer-events: none;
    text-shadow: 0 0 10px #4488ff88;
    line-height: 1.8;
    z-index: 10;
  }
  #ui h1 {
    font-size: 22px;
    color: #ffffff;
    text-shadow: 0 0 20px #6688ff;
    margin-bottom: 8px;
  }
  #ui .subtitle {
    font-size: 11px;
    color: #6688aa;
    margin-bottom: 12px;
  }
  #stats {
    position: fixed;
    top: 20px;
    right: 20px;
    color: #6688aa;
    font-size: 11px;
    text-align: right;
    pointer-events: none;
    z-index: 10;
  }

  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 10;
  }
  #controls button {
    background: rgba(30, 50, 100, 0.5);
    border: 1px solid rgba(100, 140, 255, 0.4);
    color: #aaccff;
    padding: 8px 18px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    transition: all 0.3s;
    backdrop-filter: blur(10px);
  }
  #controls button:hover {
    background: rgba(50, 80, 160, 0.6);
    border-color: rgba(150, 180, 255, 0.8);
    text-shadow: 0 0 10px #88aaff;
    box-shadow: 0 0 20px rgba(80, 120, 255, 0.3);
  }
  #controls button.active {
    background: rgba(60, 100, 200, 0.5);
    border-color: rgba(150, 180, 255, 0.9);
  }

  #tooltip {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    color: #5577aa;
    font-size: 11px;
    text-align: center;
    pointer-events: none;
    opacity: 0.7;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="ui">
  <h1>✨ Star Forge</h1>
  <div class="subtitle">Aether's interactive universe</div>
  Click anywhere to spawn a star<br>
  Drag to fling stars into orbit<br>
  Right-click to supernova 💥<br>
  Scroll to change brush size<br>
  Space to pause/resume
</div>

<div id="stats">
  Stars: <span id="starCount">0</span><br>
  Particles: <span id="particleCount">0</span>
</div>

<div id="tooltip">Click · Drag · Right-click · Scroll · Space</div>

<div id="controls">
  <button id="btnAttract" class="active" onclick="setMode('attract')">🌀 Attract</button>
  <button id="btnRepel" onclick="setMode('repel')">💥 Repel</button>
  <button id="btnNebula" onclick="setMode('nebula')">🌌 Nebula</button>
  <button onclick="supernovaAll()">💫 Supernova All</button>
  <button onclick="clearAll()">🧹 Clear</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- State ---
let mode = 'attract';
let stars = [];
let particles = [];
let nebulaClouds = [];
let mouse = { x: W/2, y: H/2, down: false, right: false };
let brushSize = 60;
let paused = false;
let time = 0;

const STAR_COLORS = [
  { h: 220, s: 80, l: 80 },  // blue
  { h: 260, s: 60, l: 75 },  // violet
  { h: 30,  s: 90, l: 75 },  // orange
  { h: 0,   s: 70, l: 70 },  // red
  { h: 180, s: 70, l: 80 },  // cyan
  { h: 50,  s: 90, l: 85 },  // yellow
  { h: 300, s: 50, l: 80 },  // pink
  { h: 150, s: 60, l: 75 },  // green
];

// --- Star class ---
class Star {
  constructor(x, y, vx = 0, vy = 0) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    const color = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];
    this.hue = color.h + (Math.random() - 0.5) * 20;
    this.sat = color.s;
    this.lit = color.l;
    this.mass = 0.5 + Math.random() * 2;
    this.radius = 2 + this.mass * 2;
    this.life = 1;
    this.maxLife = 500 + Math.random() * 1000;
    this.age = 0;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.pulseSpeed = 0.02 + Math.random() * 0.03;
    this.orbiters = [];
    this.glowRadius = 30 + this.mass * 30;
    this.trail = [];
  }

  update() {
    this.age++;
    this.life = Math.max(0, 1 - this.age / this.maxLife);
    this.pulsePhase += this.pulseSpeed;

    // Gravity between stars
    for (let other of stars) {
      if (other === this) continue;
      let dx = other.x - this.x;
      let dy = other.y - this.y;
      let dist = Math.sqrt(dx*dx + dy*dy) + 0.1;
      let force = (other.mass * 0.02) / (dist * dist);
      this.vx += (dx / dist) * force;
      this.vy += (dy / dist) * force;
    }

    // Mouse interaction
    if (mouse.down) {
      let dx = mouse.x - this.x;
      let dy = mouse.y - this.y;
      let dist = Math.sqrt(dx*dx + dy*dy) + 0.1;
      let force = brushSize * 0.01 / (dist + 10);
      let dir = mode === 'attract' ? 1 : -1;
      this.vx += (dx / dist) * force * dir;
      this.vy += (dy / dist) * force * dir;
    }

    // Soft boundary
    let margin = 100;
    if (this.x < margin) this.vx += 0.05;
    if (this.x > W - margin) this.vx -= 0.05;
    if (this.y < margin) this.vy += 0.05;
    if (this.y > H - margin) this.vy -= 0.05;

    // Damping
    this.vx *= 0.999;
    this.vy *= 0.999;

    this.x += this.vx;
    this.y += this.vy;

    // Trail
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 15) this.trail.shift();
  }

  draw() {
    const pulse = 1 + Math.sin(this.pulsePhase) * 0.3;
    const alpha = this.life * 0.9;
    const r = this.radius * pulse;

    // Trail
    if (this.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.strokeStyle = `hsla(${this.hue}, ${this.sat}%, ${this.lit}%, ${alpha * 0.15})`;
      ctx.lineWidth = r * 0.5;
      ctx.stroke();
    }

    // Glow layers
    const layers = 5;
    for (let i = layers; i >= 0; i--) {
      const gr = r + (this.glowRadius / layers) * i;
      const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, gr);
      const a = alpha * (i === 0 ? 1 : 0.04);
      gradient.addColorStop(0, `hsla(${this.hue}, ${this.sat}%, ${this.lit}%, ${a})`);
      gradient.addColorStop(1, `hsla(${this.hue}, ${this.sat}%, ${this.lit}%, 0)`);
      ctx.beginPath();
      ctx.arc(this.x, this.y, gr, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
    }

    // Core
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, ${this.sat}%, ${Math.min(this.lit + 20, 100)}%, ${alpha})`;
    ctx.fill();

    // White hot center
    ctx.beginPath();
    ctx.arc(this.x, this.y, r * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
    ctx.fill();
  }

  supernova() {
    const count = 40 + Math.floor(this.mass * 20);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 5;
      const p = new Particle(
        this.x, this.y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        this.hue + (Math.random() - 0.5) * 40,
        this.sat,
        60 + Math.random() * 30
      );
      p.big = true;
      particles.push(p);
    }
    // Shockwave ring
    shockwaves.push(new Shockwave(this.x, this.y, this.hue));
    this.life = 0;
  }
}

// --- Particle class ---
class Particle {
  constructor(x, y, vx, vy, hue, sat, lit) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.hue = hue + (Math.random() - 0.5) * 20;
    this.sat = sat;
    this.lit = lit;
    this.life = 1;
    this.decay = 0.003 + Math.random() * 0.015;
    this.size = 0.5 + Math.random() * 2.5;
    this.big = false;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.99;
    this.vy *= 0.99;
    this.life -= this.decay;
    return this.life > 0;
  }

  draw() {
    const a = this.life;
    const r = this.size * a;
    const gr = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r * 3);
    gr.addColorStop(0, `hsla(${this.hue}, ${this.sat}%, ${this.lit}%, ${a})`);
    gr.addColorStop(1, `hsla(${this.hue}, ${this.sat}%, ${this.lit}%, 0)`);
    ctx.beginPath();
    ctx.arc(this.x, this.y, r * 3, 0, Math.PI * 2);
    ctx.fillStyle = gr;
    ctx.fill();
  }
}

// --- Shockwave ---
class Shockwave {
  constructor(x, y, hue) {
    this.x = x; this.y = y;
    this.hue = hue;
    this.radius = 0;
    this.maxRadius = 200 + Math.random() * 100;
    this.life = 1;
    this.speed = 4;
  }
  update() {
    this.radius += this.speed;
    this.speed *= 0.97;
    this.life = 1 - this.radius / this.maxRadius;
    return this.life > 0;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${this.hue}, 70%, 70%, ${this.life * 0.5})`;
    ctx.lineWidth = 3 * this.life;
    ctx.stroke();
  }
}

let shockwaves = [];

// --- Nebula clouds (for nebula mode) ---
class NebulaCloud {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.hue = Math.random() * 360;
    this.size = 50 + Math.random() * 100;
    this.life = 1;
    this.decay = 0.001 + Math.random() * 0.003;
    this.driftX = (Math.random() - 0.5) * 0.3;
    this.driftY = (Math.random() - 0.5) * 0.3;
  }
  update() {
    this.x += this.driftX;
    this.y += this.driftY;
    this.life -= this.decay;
    return this.life > 0;
  }
  draw() {
    const gr = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    gr.addColorStop(0, `hsla(${this.hue}, 70%, 50%, ${this.life * 0.15})`);
    gr.addColorStop(0.5, `hsla(${this.hue + 30}, 60%, 40%, ${this.life * 0.06})`);
    gr.addColorStop(1, `hsla(${this.hue}, 50%, 30%, 0)`);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = gr;
    ctx.fill();
  }
}

// --- Background stars ---
let bgStars = [];
function initBgStars() {
  bgStars = [];
  for (let i = 0; i < 200; i++) {
    bgStars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 1.5,
      twinkle: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.01 + Math.random() * 0.04,
    });
  }
}
initBgStars();

// --- Input ---
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 0) mouse.down = true;
  if (e.button === 2) {
    // Right click - supernova nearest star
    let nearest = null, minDist = 80;
    for (let s of stars) {
      let d = Math.hypot(s.x - e.clientX, s.y - e.clientY);
      if (d < minDist) { minDist = d; nearest = s; }
    }
    if (nearest) {
      nearest.supernova();
    } else {
      // Spawn a star on right click too
      spawnStar(e.clientX, e.clientY, (Math.random()-0.5)*3, (Math.random()-0.5)*3, true);
    }
  }
});

canvas.addEventListener('mouseup', () => { mouse.down = false; });
canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  if (mouse.down && mode === 'nebula') {
    nebulaClouds.push(new NebulaCloud(e.clientX, e.clientY));
  }
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

canvas.addEventListener('wheel', (e) => {
  brushSize = Math.max(10, Math.min(200, brushSize - e.deltaY * 0.1));
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    paused = !paused;
  }
});

// --- Functions ---
function spawnStar(x, y, vx, vy, super = false) {
  stars.push(new Star(x, y, vx, vy));
  if (super) {
    shockwaves.push(new Shockwave(x, y, 50));
    for (let i = 0; i < 15; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 2;
      particles.push(new Particle(x, y, Math.cos(angle)*speed, Math.sin(angle)*speed, 50, 80, 70));
    }
  }
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
  if (m === 'attract') document.getElementById('btnAttract').classList.add('active');
  if (m === 'repel') document.getElementById('btnRepel').classList.add('active');
  if (m === 'nebula') document.getElementById('btnNebula').classList.add('active');
}

function supernovaAll() {
  for (let s of [...stars]) s.supernova();
  stars = [];
}

function clearAll() {
  stars = [];
  particles = [];
  nebulaClouds = [];
  shockwaves = [];
}

// --- Main loop ---
function loop() {
  requestAnimationFrame(loop);
  if (paused) return;
  time++;

  // Fade background for trails
  ctx.fillStyle = 'rgba(0, 1, 16, 0.18)';
  ctx.fillRect(0, 0, W, H);

  // Background stars
  for (let s of bgStars) {
    s.twinkle += s.twinkleSpeed;
    const a = 0.3 + Math.sin(s.twinkle) * 0.3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200, 220, 255, ${a})`;
    ctx.fill();
  }

  // Nebula clouds
  nebulaClouds = nebulaClouds.filter(n => {
    const alive = n.update();
    if (alive) n.draw();
    return alive;
  });

  // Stars
  stars = stars.filter(s => {
    const alive = s.life > 0;
    if (alive) {
      s.update();
      s.draw();
    }
    return alive;
  });

  // Spawn orbit particles around stars
  if (time % 3 === 0) {
    for (let s of stars) {
      if (Math.random() < 0.3 && s.life > 0.1) {
        const angle = Math.random() * Math.PI * 2;
        const dist = s.radius + 3 + Math.random() * 10;
        const p = new Particle(
          s.x + Math.cos(angle) * dist,
          s.y + Math.sin(angle) * dist,
          -Math.sin(angle) * 0.3 + s.vx * 0.1,
          Math.cos(angle) * 0.3 + s.vy * 0.1,
          s.hue,
          s.sat,
          s.lit
        );
        p.decay = 0.005 + Math.random() * 0.01;
        p.size = 0.3 + Math.random() * 1;
        particles.push(p);
      }
    }
  }

  // Particles
  particles = particles.filter(p => {
    const alive = p.update();
    if (alive) p.draw();
    return alive;
  });

  // Shockwaves
  shockwaves = shockwaves.filter(sw => {
    const alive = sw.update();
    if (alive) sw.draw();
    return alive;
  });

  // Mouse cursor glow
  if (mouse.down) {
    const gr = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, brushSize);
    const hue = mode === 'attract' ? 220 : mode === 'repel' ? 0 : 280;
    gr.addColorStop(0, `hsla(${hue}, 70%, 60%, 0.15)`);
    gr.addColorStop(1, `hsla(${hue}, 70%, 60%, 0)`);
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, brushSize, 0, Math.PI * 2);
    ctx.fillStyle = gr;
    ctx.fill();
  }

  // Spawn stars when clicking
  if (mouse.down && mode !== 'nebula' && time % 8 === 0) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * brushSize * 0.5;
    spawnStar(
      mouse.x + Math.cos(angle) * dist,
      mouse.y + Math.sin(angle) * dist,
      (Math.random() - 0.5) * 2,
      (Math.random() - 0.5) * 2
    );
  }

  // Update stats
  document.getElementById('starCount').textContent = stars.length;
  document.getElementById('particleCount').textContent = particles.length;
}

// Seed a few initial stars
setTimeout(() => {
  for (let i = 0; i < 5; i++) {
    spawnStar(
      200 + Math.random() * (W - 400),
      200 + Math.random() * (H - 400),
      (Math.random() - 0.5) * 1.5,
      (Math.random() - 0.5) * 1.5
    );
  }
}, 100);

loop();
</script>
</body>
</html>
