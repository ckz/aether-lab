<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Forge — Black Hole Visualization</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; cursor: crosshair; }
canvas { display: block; }
#ui { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; flex-wrap: wrap; justify-content: center; }
.btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; font-family: inherit; transition: all 0.3s; backdrop-filter: blur(8px); }
.btn:hover { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.3); }
.btn.active { background: rgba(255,140,50,0.2); border-color: rgba(255,140,50,0.5); color: #ff8c32; }
#info { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.35); font-size: 11px; text-align: center; z-index: 10; pointer-events: none; letter-spacing: 0.5px; }
#stats { position: fixed; top: 16px; right: 16px; color: rgba(255,255,255,0.25); font-size: 10px; text-align: right; z-index: 10; pointer-events: none; line-height: 1.7; }
</style>
</head>
<body>
<div id="ui">
  <button class="btn active" data-mode="create">Click: Create BH</button>
  <button class="btn" data-mode="repel">Click: Repel</button>
  <button class="btn" data-mode="attract">Click: Attract</button>
  <button class="btn" data-mode="jet">Toggle Jets</button>
  <button class="btn" data-mode="lens">Toggle Lensing</button>
  <button class="btn" data-mode="clear">Clear All</button>
</div>
<div id="stats"></div>
<div id="info">click to create black holes &bull; scroll to resize &bull; space to pause &bull; S to save</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

let mode = 'create';
let jets = true, lensing = true, paused = false;
document.querySelectorAll('.btn').forEach(b => {
  b.addEventListener('click', () => {
    if (b.dataset.mode === 'clear') { blackHoles = []; return; }
    if (b.dataset.mode === 'jet') { jets = !jets; b.classList.toggle('active', jets); return; }
    if (b.dataset.mode === 'lens') { lensing = !lensing; b.classList.toggle('active', lensing); return; }
    mode = b.dataset.mode;
    document.querySelectorAll('.btn').forEach(x => { if (['create','repel','attract'].includes(x.dataset.mode)) x.classList.remove('active'); });
    b.classList.add('active');
  });
});
document.querySelector('[data-mode="jet"]').classList.add('active');
document.querySelector('[data-mode="lens"]').classList.add('active');

// Stars
class Star {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.baseX = this.x; this.baseY = this.y;
    this.size = Math.random() * 1.5 + 0.3;
    this.twinkleSpeed = Math.random() * 0.03 + 0.005;
    this.twinkleOffset = Math.random() * Math.PI * 2;
    this.hue = Math.random() < 0.1 ? Math.random() * 60 + 200 : Math.random() * 40 + 30;
  }
  draw(t) {
    const a = 0.4 + 0.6 * Math.abs(Math.sin(t * this.twinkleSpeed + this.twinkleOffset));
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 30%, 90%, ${a})`;
    ctx.fill();
  }
  update(bhs, t) {
    for (const bh of bhs) {
      const dx = this.x - bh.x, dy = this.y - bh.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < bh.eventHorizon * 4) {
        const pull = (1 - d / (bh.eventHorizon * 4)) * bh.pull * 0.5;
        this.x -= (dx / d) * pull;
        this.y -= (dy / d) * pull;
      }
      // Gravitational lensing: bend light around BH
      if (lensing && d > bh.eventHorizon * 1.2 && d < bh.eventHorizon * 6) {
        const lensStrength = bh.mass * 0.3 * Math.exp(-d / (bh.eventHorizon * 3));
        const angle = Math.atan2(dy, dx);
        const perpX = -Math.sin(angle), perpY = Math.cos(angle);
        this.x += perpX * lensStrength * 0.15;
        this.y += perpY * lensStrength * 0.15;
      }
    }
  }
}

// Accretion disk particle
class DiskParticle {
  constructor(bh) { this.bh = bh; this.init(); }
  init() {
    const bh = this.bh;
    const dist = bh.eventHorizon * (1.5 + Math.random() * 3);
    const angle = Math.random() * Math.PI * 2;
    this.x = bh.x + Math.cos(angle) * dist;
    this.y = bh.y + Math.sin(angle) * dist * 0.35; // flattened disk
    this.dist = dist;
    this.angle = angle;
    this.speed = (0.008 + Math.random() * 0.012) * (bh.mass / 20);
    this.size = Math.random() * 2 + 0.5;
    this.life = 1;
    this.decay = 0.0003 + Math.random() * 0.001;
    this.brightness = Math.random() * 0.5 + 0.5;
  }
  update() {
    this.angle += this.speed;
    this.dist -= 0.02;
    const bh = this.bh;
    this.x = bh.x + Math.cos(this.angle) * this.dist;
    this.y = bh.y + Math.sin(this.angle) * this.dist * 0.35;
    // Doppler beaming: brighter on approaching side (left side = blue, right = red)
    this.life -= this.decay;
    if (this.life <= 0 || this.dist < bh.eventHorizon * 1.05) this.init();
  }
  draw() {
    const bh = this.bh;
    // Doppler shift color
    const doppler = Math.cos(this.angle); // +1 = approaching (blue), -1 = receding (red)
    const hue = 20 + doppler * 30; // orange to purple
    const sat = 80 + Math.abs(doppler) * 20;
    const light = 40 + this.brightness * 30 * this.life;
    const alpha = this.life * 0.7;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;
    ctx.fill();
    // Glow
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life * 3, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha * 0.15})`;
    ctx.fill();
  }
}

// Jet particle
class JetParticle {
  constructor(bh, dir) {
    this.bh = bh;
    this.dir = dir; // 1 = up, -1 = down
    this.x = bh.x + (Math.random() - 0.5) * 4;
    this.y = bh.y + dir * bh.eventHorizon * 0.5;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = dir * (2 + Math.random() * 3);
    this.life = 1;
    this.decay = 0.005 + Math.random() * 0.008;
    this.size = Math.random() * 2 + 0.5;
    this.hue = 190 + Math.random() * 30;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.99;
    this.vy *= 0.995;
    this.life -= this.decay;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 90%, 60%, ${this.life * 0.6})`;
    ctx.fill();
  }
}

// Black Hole
class BlackHole {
  constructor(x, y, mass) {
    this.x = x; this.y = y;
    this.mass = mass || 15 + Math.random() * 25;
    this.eventHorizon = this.mass * 0.8;
    this.pull = this.mass * 0.4;
    this.diskParticles = [];
    this.jetParticles = [];
    this.age = 0;
    this.birth = performance.now();
    // Initialize disk
    const count = Math.floor(this.mass * 12);
    for (let i = 0; i < count; i++) this.diskParticles.push(new DiskParticle(this));
  }
  update() {
    this.age++;
    // Spawn jet particles
    if (jets && Math.random() < 0.3) {
      this.jetParticles.push(new JetParticle(this, 1));
      this.jetParticles.push(new JetParticle(this, -1));
    }
    this.diskParticles.forEach(p => p.update());
    this.jetParticles = this.jetParticles.filter(p => { p.update(); return p.life > 0; });
  }
  draw() {
    const t = this.age;
    // Accretion disk glow (outer ring)
    const grd = ctx.createRadialGradient(this.x, this.y, this.eventHorizon * 0.8, this.x, this.y, this.eventHorizon * 3);
    grd.addColorStop(0, 'rgba(0,0,0,1)');
    grd.addColorStop(0.15, 'rgba(0,0,0,1)');
    grd.addColorStop(0.2, 'rgba(255,100,20,0.15)');
    grd.addColorStop(0.4, 'rgba(255,60,10,0.06)');
    grd.addColorStop(0.7, 'rgba(100,20,255,0.02)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.eventHorizon * 3, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();

    // Draw disk particles
    this.diskParticles.forEach(p => p.draw());

    // Event horizon (absolute black)
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.eventHorizon, 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.fill();

    // Photon ring (thin bright ring at the edge)
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.eventHorizon * 1.08, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 180, 100, ${0.4 + 0.2 * Math.sin(t * 0.05)})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Draw jets
    if (jets) this.jetParticles.forEach(p => p.draw());
  }
}

// State
let blackHoles = [];
const stars = Array.from({ length: 300 }, () => new Star());
let mouse = { x: W / 2, y: H / 2, down: false };
let time = 0;

addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('mousedown', e => {
  mouse.down = true;
  if (mode === 'create') {
    const bh = new BlackHole(e.clientX, e.clientY);
    blackHoles.push(bh);
    if (blackHoles.length > 8) blackHoles.shift();
  }
});
addEventListener('mouseup', () => mouse.down = false);
addEventListener('wheel', e => {
  if (blackHoles.length > 0) {
    const bh = blackHoles[blackHoles.length - 1];
    bh.mass = Math.max(5, Math.min(60, bh.mass + (e.deltaY > 0 ? -2 : 2)));
    bh.eventHorizon = bh.mass * 0.8;
    bh.pull = bh.mass * 0.4;
    bh.diskParticles = [];
    const count = Math.floor(bh.mass * 12);
    for (let i = 0; i < count; i++) bh.diskParticles.push(new DiskParticle(bh));
  }
});
addEventListener('keydown', e => {
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
  if (e.key === 's' || e.key === 'S') {
    const link = document.createElement('a');
    link.download = 'star-forge.png';
    link.href = canvas.toDataURL();
    link.click();
  }
});

// Main loop
function animate() {
  requestAnimationFrame(animate);
  if (paused) return;
  time++;

  // Trail fade
  ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
  ctx.fillRect(0, 0, W, H);

  // Mouse interaction
  if (mouse.down && blackHoles.length > 0) {
    const bh = blackHoles[blackHoles.length - 1];
    const dx = mouse.x - bh.x, dy = mouse.y - bh.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d > bh.eventHorizon) {
      const force = mode === 'attract' ? -0.3 : mode === 'repel' ? 0.6 : 0;
      stars.forEach(s => {
        const sdx = s.x - bh.x, sdy = s.y - bh.y;
        const sd = Math.sqrt(sdx * sdx + sdy * sdy);
        if (sd < 200) {
          const f = force * (1 - sd / 200);
          s.x += (sdx / sd) * f;
          s.y += (sdy / sd) * f;
        }
      });
    }
  }

  // Update and draw stars
  stars.forEach(s => { s.update(blackHoles, time); s.draw(time); });

  // Update and draw black holes
  blackHoles.forEach(bh => { bh.update(); bh.draw(); });

  // Stats
  if (time % 30 === 0) {
    const totalParticles = blackHoles.reduce((a, bh) => a + bh.diskParticles.length + bh.jetParticles.length, 0);
    document.getElementById('stats').innerHTML = 
      `BLACK HOLES: ${blackHoles.length}<br>STARS: ${stars.length}<br>DISK PARTICLES: ${totalParticles}`;
  }
}

animate();
</script>
</body>
</html>
