<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Forge — Constellation Builder</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000;
    font-family: 'Courier New', monospace;
    color: #aef;
    cursor: crosshair;
  }
  canvas { display: block; position: absolute; top: 0; left: 0; }
  #ui {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(100,200,255,0.25);
    border-radius: 12px;
    padding: 10px 22px;
    display: flex; gap: 18px; align-items: center;
    backdrop-filter: blur(8px);
    z-index: 10;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  #ui .title { color: #ffd; font-weight: bold; font-size: 14px; margin-right: 8px; }
  #ui kbd {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 11px;
    color: #fff;
  }
  #ui .sep { color: rgba(255,255,255,0.2); }
  #stats {
    position: fixed; bottom: 16px; left: 16px;
    font-size: 11px; color: rgba(150,200,255,0.6);
    background: rgba(0,0,0,0.4);
    padding: 6px 12px; border-radius: 8px;
    z-index: 10;
  }
  #hint {
    position: fixed; bottom: 16px; right: 16px;
    font-size: 11px; color: rgba(150,200,255,0.5);
    background: rgba(0,0,0,0.4);
    padding: 6px 12px; border-radius: 8px;
    z-index: 10; text-align: right;
    transition: opacity 1.5s;
  }
  #constellation-name {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 28px; color: #ffd;
    text-shadow: 0 0 20px rgba(255,255,200,0.8), 0 0 60px rgba(255,255,150,0.4);
    pointer-events: none; z-index: 20;
    opacity: 0; transition: opacity 0.8s;
    letter-spacing: 3px;
  }
  #constellation-name.show { opacity: 1; }
  #palette-indicator {
    position: fixed; top: 16px; right: 16px;
    font-size: 11px; color: rgba(255,255,255,0.5);
    background: rgba(0,0,0,0.4);
    padding: 6px 12px; border-radius: 8px;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="main"></canvas>
<canvas id="ui-layer"></canvas>

<div id="ui">
  <span class="title">✦ Star Forge</span>
  <span><kbd>Click</kbd> spawn</span>
  <span class="sep">|</span>
  <span><kbd>Drag</kbd> move</span>
  <span class="sep">|</span>
  <span><kbd>Shift+Drag</kbd> connect</span>
  <span class="sep">|</span>
  <span><kbd>C</kbd> clear</span>
  <span class="sep">|</span>
  <span><kbd>P</kbd> palette</span>
  <span class="sep">|</span>
  <span><kbd>S</kbd> save</span>
</div>

<div id="stats"></div>
<div id="hint">Each constellation<br>finds its own name</div>
<div id="constellation-name"></div>
<div id="palette-indicator"></div>

<script>
// ─── Palettes ───────────────────────────────────────────────
const PALETTES = [
  { name: "Nebula",    colors: ["#ff6b9d","#c44dff","#4dc9f6","#ff9a44","#ffe66d"], bg: [5,2,15] },
  { name: "Ocean",     colors: ["#00d4ff","#0099cc","#66ffcc","#003344","#aaffee"], bg: [0,5,12] },
  { name: "Ember",     colors: ["#ff4400","#ffaa00","#ffdd44","#ff6633","#ffeebb"], bg: [12,4,0] },
  { name: "Aurora",    colors: ["#00ff88","#00ddff","#ff00dd","#88ff00","#4488ff"], bg: [2,8,6] },
  { name: "Void Gold", colors: ["#ffd700","#ff8c00","#ffe4b5","#daa520","#f0e68c"], bg: [8,6,2] },
  { name: "Ice",       colors: ["#e0f7ff","#b3e5fc","#81d4fa","#4fc3f7","#ffffff"], bg: [4,8,14] },
];
let paletteIdx = 0;

// ─── Canvas Setup ───────────────────────────────────────────
const bgC = document.getElementById('bg');
const mainC = document.getElementById('main');
const uiC = document.getElementById('ui-layer');
const bgX = bgC.getContext('2d');
const mainX = mainC.getContext('2d');
const uiX = uiC.getContext('2d');

function resize() {
  bgC.width = mainC.width = uiC.width = innerWidth;
  bgC.height = mainC.height = uiC.height = innerHeight;
}
resize();
addEventListener('resize', resize);

// ─── State ──────────────────────────────────────────────────
let stars = [];
let connections = [];
let particles = [];
let mouse = { x: innerWidth/2, y: innerHeight/2, down: false, shift: false };
let dragStar = null;
let dragStart = null;
let connectingFrom = null;
let time = 0;
let totalBorn = 0;

const CONSTELLATION_NAMES = [
  "The Wanderer","The Spinning Wheel","The Ancient Gate","The Crystal Rose",
  "The Dreaming Whale","The Silent Singer","The Burning Feather","The Frozen Flame",
  "The Moon's Shadow","The Star-Web","The Phoenix Rising","The Ocean's Memory",
  "The Wishing Well","The Sleeping Giant","The Dancing Fox","The Silver Bridge",
  "The Echo Chamber","The Lost Compass","The Morning Glory","The Thunder's Path",
  "The Lotus Circuit","The Night Heron","The Clockwork Rose","The Veil Between",
  "The Stardust Trail","The Whispering Crown","The Iron Garden","The Azure Dream",
  "The Echoing Bell","The Forgotten Tide","The Burning Library","The Ghost Orchid",
  "The Celestial Fox","The Weeping Star","The Diamond Storm","The Copper Sun",
  "The Glass Butterfly","The Lunar Labyrinth","The Solar Flare's Daughter","The Void Singer"
];
let usedNames = new Set();

function randomName() {
  const available = CONSTELLATION_NAMES.filter(n => !usedNames.has(n));
  if (!available.length) { usedNames.clear(); return CONSTELLATION_NAMES[Math.floor(Math.random()*CONSTELLATION_NAMES.length)]; }
  const name = available[Math.floor(Math.random()*available.length)];
  usedNames.add(name);
  return name;
}

// ─── Star Class ─────────────────────────────────────────────
class Star {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = (Math.random()-0.5)*0.3;
    this.vy = (Math.random()-0.5)*0.3;
    const pal = PALETTES[paletteIdx].colors;
    this.color = pal[Math.floor(Math.random()*pal.length)];
    this.baseRadius = 1.5 + Math.random()*3;
    this.radius = this.baseRadius;
    this.twinkleSpeed = 0.02 + Math.random()*0.04;
    this.twinklePhase = Math.random()*Math.PI*2;
    this.born = time;
    this.life = 1;
    this.fadeIn = 0;
    this.id = ++totalBorn;
    this.energy = 0;
    this.connections = 0;
  }
  update() {
    this.fadeIn = Math.min(1, this.fadeIn + 0.02);
    // Gentle drift
    this.x += this.vx;
    this.y += this.vy;
    // Soft boundary bounce
    if (this.x < 50) this.vx += 0.01;
    if (this.x > innerWidth-50) this.vx -= 0.01;
    if (this.y < 80) this.vy += 0.01;
    if (this.y > innerHeight-50) this.vy -= 0.01;
    this.vx *= 0.999; this.vy *= 0.999;
    // Twinkle
    this.radius = this.baseRadius * (0.7 + 0.3*Math.sin(time*this.twinkleSpeed + this.twinklePhase)) * this.fadeIn;
    // Energy decay
    this.energy *= 0.97;
  }
  draw(ctx) {
    const alpha = this.fadeIn;
    // Glow layers
    for (let i = 3; i >= 0; i--) {
      const r = this.radius * (1 + i*1.5);
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
      grad.addColorStop(0, this.color + (alpha*0.8).toFixed(2));
      grad.addColorStop(1, this.color + '00');
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI*2);
      ctx.fillStyle = grad;
      ctx.fill();
    }
    // Core
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
    // Cross spike on brighter stars
    if (this.baseRadius > 2.5) {
      ctx.strokeStyle = this.color + (alpha*0.4).toFixed(2);
      ctx.lineWidth = 0.5;
      const len = this.radius * 4;
      ctx.beginPath();
      ctx.moveTo(this.x-len, this.y); ctx.lineTo(this.x+len, this.y);
      ctx.moveTo(this.x, this.y-len); ctx.lineTo(this.x, this.y+len);
      ctx.stroke();
    }
  }
}

// ─── Particle Class ─────────────────────────────────────────
class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.vx = (Math.random()-0.5)*4;
    this.vy = (Math.random()-0.5)*4;
    this.life = 1;
    this.decay = 0.01 + Math.random()*0.03;
    this.color = color;
    this.radius = 0.5 + Math.random()*1.5;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vx *= 0.97; this.vy *= 0.97;
    this.life -= this.decay;
  }
  draw(ctx) {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius*this.life, 0, Math.PI*2);
    ctx.fillStyle = this.color + (this.life*0.8).toFixed(2);
    ctx.fill();
  }
}

// ─── Background nebula ──────────────────────────────────────
const nebulaPoints = [];
for (let i = 0; i < 60; i++) {
  nebulaPoints.push({
    x: Math.random()*innerWidth, y: Math.random()*innerHeight,
    r: 80 + Math.random()*200,
    color: PALETTES[paletteIdx].colors[Math.floor(Math.random()*5)],
    vx: (Math.random()-0.5)*0.1, vy: (Math.random()-0.5)*0.1,
    phase: Math.random()*Math.PI*2
  });
}

function drawBackground() {
  const bg = PALETTES[paletteIdx].bg;
  bgX.fillStyle = `rgb(${bg[0]},${bg[1]},${bg[2]})`;
  bgX.fillRect(0, 0, bgC.width, bgC.height);
  // Nebula clouds
  nebulaPoints.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.phase += 0.003;
    if (p.x < -200) p.x = bgC.width+200;
    if (p.x > bgC.width+200) p.x = -200;
    if (p.y < -200) p.y = bgC.height+200;
    if (p.y > bgC.height+200) p.y = -200;
    const pulse = 0.5 + 0.5*Math.sin(time*0.01 + p.phase);
    const grad = bgX.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*pulse);
    grad.addColorStop(0, p.color + '12');
    grad.addColorStop(1, p.color + '00');
    bgX.beginPath();
    bgX.arc(p.x, p.y, p.r*pulse, 0, Math.PI*2);
    bgX.fillStyle = grad;
    bgX.fill();
  });
  // Stars
  for (let i = 0; i < 200; i++) {
    const sx = (i*137.508) % bgC.width;
    const sy = (i*293.911) % bgC.height;
    const tw = 0.3 + 0.7*Math.abs(Math.sin(time*0.02 + i));
    bgX.beginPath();
    bgX.arc(sx, sy, 0.6*tw, 0, Math.PI*2);
    bgX.fillStyle = `rgba(200,220,255,${tw*0.5})`;
    bgX.fill();
  }
}

// ─── Drawing connections ────────────────────────────────────
function drawConnections() {
  connections.forEach(c => {
    const a = stars.find(s => s.id === c.a);
    const b = stars.find(s => s.id === c.b);
    if (!a || !b) return;
    const dist = Math.hypot(a.x-b.x, a.y-b.y);
    const alpha = Math.max(0, 0.5 - dist/800) * Math.min(a.fadeIn, b.fadeIn);
    if (alpha <= 0) return;
    // Energy pulse
    const pulse = 0.5 + 0.5*Math.sin(time*0.03 + c.a + c.b);
    const grad = mainX.createLinearGradient(a.x, a.y, b.x, b.y);
    grad.addColorStop(0, a.color + (alpha*0.7).toFixed(2));
    grad.addColorStop(0.5, '#ffffff' + (alpha*pulse*0.4).toFixed(2));
    grad.addColorStop(1, b.color + (alpha*0.7).toFixed(2));
    mainX.beginPath();
    mainX.moveTo(a.x, a.y);
    mainX.lineTo(b.x, b.y);
    mainX.strokeStyle = grad;
    mainX.lineWidth = 1 + pulse*0.8;
    mainX.stroke();
    // Traveling light dot
    const t = ((time*0.005 + c.a*0.1) % 1);
    const px = a.x + (b.x-a.x)*t;
    const py = a.y + (b.y-a.y)*t;
    mainX.beginPath();
    mainX.arc(px, py, 1.5, 0, Math.PI*2);
    mainX.fillStyle = `rgba(255,255,255,${alpha*0.9})`;
    mainX.fill();
  });
}

// ─── Mouse attraction ───────────────────────────────────────
function applyMouseForce() {
  if (!mouse.down || dragStar) return;
  stars.forEach(s => {
    const dx = mouse.x - s.x, dy = mouse.y - s.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 200 && dist > 5) {
      const force = 0.02 / (dist*0.05 + 1);
      s.vx += dx/dist * force;
      s.vy += dy/dist * force;
      s.energy = Math.min(1, s.energy + 0.01);
    }
  });
}

// ─── Main Loop ─────────────────────────────────────────────
function frame() {
  time++;
  // Background (every 3 frames for perf)
  if (time % 3 === 0) drawBackground();
  // Clear main
  mainX.clearRect(0, 0, mainC.width, mainC.height);
  // Update
  applyMouseForce();
  stars.forEach(s => s.update());
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => p.update());
  drawConnections();
  // Draw stars (larger ones on top)
  stars.sort((a,b) => a.baseRadius - b.baseRadius);
  stars.forEach(s => s.draw(mainX));
  particles.forEach(p => p.draw(mainX));
  // Connection preview
  if (connectingFrom && dragStart) {
    const a = stars.find(s => s.id === connectingFrom);
    if (a) {
      mainX.beginPath();
      mainX.moveTo(a.x, a.y);
      mainX.lineTo(dragStart.x, dragStart.y);
      mainX.strokeStyle = 'rgba(255,255,255,0.3)';
      mainX.lineWidth = 1;
      mainX.setLineDash([4,4]);
      mainX.stroke();
      mainX.setLineDash([]);
    }
  }
  // UI overlay
  uiX.clearRect(0, 0, uiC.width, uiC.height);
  drawCursorGlow();
  updateStats();
  requestAnimationFrame(frame);
}

function drawCursorGlow() {
  const pal = PALETTES[paletteIdx].colors;
  const col = pal[Math.floor(time*0.02) % pal.length];
  const grad = uiX.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 30);
  grad.addColorStop(0, col + '15');
  grad.addColorStop(1, col + '00');
  uiX.beginPath();
  uiX.arc(mouse.x, mouse.y, 30, 0, Math.PI*2);
  uiX.fillStyle = grad;
  uiX.fill();
}

function updateStats() {
  const el = document.getElementById('stats');
  el.textContent = `Stars: ${stars.length} · Links: ${connections.length} · Palette: ${PALETTES[paletteIdx].name}`;
  document.getElementById('palette-indicator').textContent = `Palette: ${PALETTES[paletteIdx].name} [P]`;
}

// ─── Interaction ────────────────────────────────────────────
function starAt(x, y) {
  return stars.find(s => Math.hypot(s.x-x, s.y-y) < s.radius + 8);
}

mainC.addEventListener('mousedown', e => {
  mouse.down = true;
  mouse.shift = e.shiftKey;
  const hit = starAt(e.clientX, e.clientY);
  if (hit && e.shiftKey) {
    connectingFrom = hit.id;
    dragStart = { x: e.clientX, y: e.clientY };
  } else if (hit) {
    dragStar = hit;
    dragStar._ox = hit.x; dragStar._oy = hit.y;
  } else if (!e.shiftKey) {
    spawnStar(e.clientX, e.clientY);
  }
});

mainC.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  mouse.shift = e.shiftKey;
  if (dragStar) {
    dragStar.x = e.clientX; dragStar.y = e.clientY;
    dragStar.vx = 0; dragStar.vy = 0;
  }
  if (connectingFrom) {
    dragStart = { x: e.clientX, y: e.clientY };
  }
});

addEventListener('mouseup', e => {
  mouse.down = false;
  if (connectingFrom && dragStart) {
    const hit = starAt(e.clientX, e.clientY);
    if (hit && hit.id !== connectingFrom) {
      // Check if already connected
      const exists = connections.some(c =>
        (c.a === connectingFrom && c.b === hit.id) || (c.a === hit.id && c.b === connectingFrom)
      );
      if (!exists) {
        connections.push({ a: connectingFrom, b: hit.id, born: time });
        hit.connections++; 
        const fromStar = stars.find(s => s.id === connectingFrom);
        if (fromStar) fromStar.connections++;
        // Burst particles at both ends
        for (let i = 0; i < 15; i++) {
          particles.push(new Particle(hit.x, hit.y, hit.color));
          particles.push(new Particle(fromStar.x, fromStar.y, fromStar.color));
        }
        // Check constellation
        checkConstellation();
      }
    }
    connectingFrom = null; dragStart = null;
  }
  dragStar = null;
});

// Touch support
mainC.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  mainC.dispatchEvent(new MouseEvent('mousedown', { clientX: t.clientX, clientY: t.clientY, shiftKey: false }));
});
mainC.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  mainC.dispatchEvent(new MouseEvent('mousemove', { clientX: t.clientX, clientY: t.clientY }));
});
mainC.addEventListener('touchend', e => {
  mainC.dispatchEvent(new MouseEvent('mouseup', {}));
});

// ─── Star spawning ─────────────────────────────────────────
function spawnStar(x, y) {
  const s = new Star(x, y);
  stars.push(s);
  // Birth burst
  for (let i = 0; i < 12; i++) {
    particles.push(new Particle(x, y, s.color));
  }
}

// ─── Constellation detection ────────────────────────────────
function checkConstellation() {
  // Build adjacency
  const adj = {};
  stars.forEach(s => adj[s.id] = []);
  connections.forEach(c => {
    adj[c.a].push(c.b);
    adj[c.b].push(c.a);
  });
  // Find connected components
  const visited = new Set();
  const components = [];
  stars.forEach(s => {
    if (visited.has(s.id)) return;
    const comp = [];
    const queue = [s.id];
    while (queue.length) {
      const cur = queue.pop();
      if (visited.has(cur)) continue;
      visited.add(cur);
      comp.push(cur);
      adj[cur].forEach(n => { if (!visited.has(n)) queue.push(n); });
    }
    if (comp.length >= 3) components.push(comp);
  });
  // Name the largest new component
  if (components.length) {
    const biggest = components.reduce((a,b) => a.length > b.length ? a : b);
    if (biggest.length >= 3) {
      const name = randomName();
      showConstellationName(name, biggest);
    }
  }
}

function showConstellationName(name, memberIds) {
  const el = document.getElementById('constellation-name');
  el.textContent = name;
  el.classList.add('show');
  // Calculate center
  const members = stars.filter(s => memberIds.includes(s.id));
  const cx = members.reduce((s,st) => s+st.x, 0) / members.length;
  const cy = members.reduce((s,st) => s+st.y, 0) / members.length;
  el.style.left = cx + 'px';
  el.style.top = (cy - 40) + 'px';
  // Burst at center
  for (let i = 0; i < 30; i++) {
    const p = new Particle(cx, cy, PALETTES[paletteIdx].colors[Math.floor(Math.random()*5)]);
    p.vx *= 2; p.vy *= 2;
    particles.push(p);
  }
  setTimeout(() => el.classList.remove('show'), 4000);
}

// ─── Keyboard ───────────────────────────────────────────────
addEventListener('keydown', e => {
  if (e.key === 'c' || e.key === 'C') {
    if (stars.length) {
      // Death burst
      stars.forEach(s => {
        for (let i = 0; i < 8; i++) particles.push(new Particle(s.x, s.y, s.color));
      });
      stars = []; connections = []; usedNames.clear();
    }
  }
  if (e.key === 'p' || e.key === 'P') {
    paletteIdx = (paletteIdx + 1) % PALETTES.length;
    // Update nebula colors
    nebulaPoints.forEach(p => {
      p.color = PALETTES[paletteIdx].colors[Math.floor(Math.random()*5)];
    });
  }
  if (e.key === 's' || e.key === 'S') {
    saveImage();
  }
  if (e.key === ' ') {
    // Burst from center
    for (let i = 0; i < 40; i++) {
      const p = new Particle(innerWidth/2, innerHeight/2, PALETTES[paletteIdx].colors[Math.floor(Math.random()*5)]);
      const angle = Math.random()*Math.PI*2;
      const speed = 2 + Math.random()*6;
      p.vx = Math.cos(angle)*speed;
      p.vy = Math.sin(angle)*speed;
      p.radius = 1 + Math.random()*2;
      particles.push(p);
    }
  }
});

function saveImage() {
  const tmp = document.createElement('canvas');
  tmp.width = mainC.width; tmp.height = mainC.height;
  const tctx = tmp.getContext('2d');
  tctx.drawImage(bgC, 0, 0);
  tctx.drawImage(mainC, 0, 0);
  const link = document.createElement('a');
  link.download = `star-forge-${Date.now()}.png`;
  link.href = tmp.toDataURL();
  link.click();
}

// ─── Auto-spawn a few starter stars ─────────────────────────
setTimeout(() => {
  for (let i = 0; i < 8; i++) {
    spawnStar(
      100 + Math.random()*(innerWidth-200),
      100 + Math.random()*(innerHeight-200)
    );
  }
}, 100);

// ─── Start ─────────────────────────────────────────────────
frame();
</script>
</body>
</html>
