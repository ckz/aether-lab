<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Nursery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas {
    display: block;
  }
  .ui {
    position: fixed;
    top: 20px;
    left: 20px;
    color: rgba(200, 200, 255, 0.7);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
  .ui h1 {
    font-size: 14px;
    font-weight: normal;
    letter-spacing: 0.3em;
    margin-bottom: 8px;
    color: rgba(220, 220, 255, 0.9);
  }
  .ui p {
    opacity: 0.5;
    line-height: 1.6;
  }
  .stats {
    position: fixed;
    top: 20px;
    right: 20px;
    color: rgba(200, 200, 255, 0.5);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-align: right;
    pointer-events: none;
    z-index: 10;
  }
  .controls {
    position: fixed;
    bottom: 20px;
    left: 20px;
    color: rgba(200, 200, 255, 0.5);
    font-size: 10px;
    letter-spacing: 0.1em;
    pointer-events: none;
    z-index: 10;
  }
  .controls span {
    display: inline-block;
    margin-right: 15px;
  }
  .controls .key {
    color: rgba(180, 180, 255, 0.7);
    border: 1px solid rgba(140, 120, 255, 0.3);
    padding: 2px 6px;
    border-radius: 2px;
    margin-right: 4px;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="ui">
  <h1>✦ Star Nursery</h1>
  <p>Click to plant stars<br>Hold to attract<br>Press C to clear</p>
</div>
<div class="stats" id="stats"></div>
<div class="controls">
  <span><span class="key">CLICK</span> plant</span>
  <span><span class="key">HOLD</span> attract</span>
  <span><span class="key">C</span> clear</span>
  <span><span class="key">R</span> rainbow</span>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const stars = [];
const MAX_STARS = 300;
const CONNECTION_DIST = 120;
const MOUSE_INFLUENCE = 200;

let mouse = { x: W / 2, y: H / 2, down: false, active: false };
let rainbowMode = false;
let hueShift = 0;

class Star {
  constructor(x, y, vx, vy) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.vx = vx || (Math.random() - 0.5) * 0.5;
    this.vy = vy || (Math.random() - 0.5) * 0.5;
    this.radius = Math.random() * 2 + 0.5;
    this.baseRadius = this.radius;
    this.hue = Math.random() * 60 + 200; // blues and purples
    this.brightness = Math.random() * 0.5 + 0.5;
    this.twinkleSpeed = Math.random() * 0.02 + 0.01;
    this.twinklePhase = Math.random() * Math.PI * 2;
    this.life = 1;
    this.decay = 0;
  }

  update() {
    // Gentle drift
    this.vx += (Math.random() - 0.5) * 0.02;
    this.vy += (Math.random() - 0.5) * 0.02;

    // Mouse attraction
    if (mouse.down) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < MOUSE_INFLUENCE && dist > 0) {
        const force = (MOUSE_INFLUENCE - dist) / MOUSE_INFLUENCE * 0.3;
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }
    }

    // Damping
    this.vx *= 0.99;
    this.vy *= 0.99;

    this.x += this.vx;
    this.y += this.vy;

    // Wrap around edges
    if (this.x < -50) this.x = W + 50;
    if (this.x > W + 50) this.x = -50;
    if (this.y < -50) this.y = H + 50;
    if (this.y > H + 50) this.y = -50;

    // Twinkle
    this.twinklePhase += this.twinkleSpeed;
    this.radius = this.baseRadius * (0.8 + 0.2 * Math.sin(this.twinklePhase));

    // Decay
    if (this.decay > 0) {
      this.life -= this.decay;
    }
  }

  draw() {
    const alpha = this.life * this.brightness;
    const hue = rainbowMode ? (this.hue + hueShift) % 360 : this.hue;
    
    // Glow
    const gradient = ctx.createRadialGradient(
      this.x, this.y, 0,
      this.x, this.y, this.radius * 4
    );
    gradient.addColorStop(0, `hsla(${hue}, 80%, 80%, ${alpha})`);
    gradient.addColorStop(0.5, `hsla(${hue}, 80%, 60%, ${alpha * 0.3})`);
    gradient.addColorStop(1, `hsla(${hue}, 80%, 50%, 0)`);
    
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 4, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = `hsla(${hue}, 60%, 95%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Spawn initial stars
for (let i = 0; i < 80; i++) {
  stars.push(new Star());
}

// Mouse events
canvas.addEventListener('mousedown', (e) => {
  mouse.down = true;
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
  
  // Burst of stars on click
  for (let i = 0; i < 8; i++) {
    if (stars.length < MAX_STARS) {
      const angle = (Math.PI * 2 / 8) * i;
      const speed = Math.random() * 2 + 1;
      stars.push(new Star(
        e.clientX, e.clientY,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed
      ));
    }
  }
});

canvas.addEventListener('mouseup', () => {
  mouse.down = false;
});

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => {
  mouse.active = false;
  mouse.down = false;
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  mouse.down = true;
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
  
  for (let i = 0; i < 8; i++) {
    if (stars.length < MAX_STARS) {
      const angle = (Math.PI * 2 / 8) * i;
      const speed = Math.random() * 2 + 1;
      stars.push(new Star(
        mouse.x, mouse.y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed
      ));
    }
  }
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
});

canvas.addEventListener('touchend', () => {
  mouse.down = false;
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'c' || e.key === 'C') {
    // Fade out all stars
    stars.forEach(s => s.decay = 0.02);
  }
  if (e.key === 'r' || e.key === 'R') {
    rainbowMode = !rainbowMode;
  }
});

// Draw connections
function drawConnections() {
  for (let i = 0; i < stars.length; i++) {
    for (let j = i + 1; j < stars.length; j++) {
      const dx = stars[i].x - stars[j].x;
      const dy = stars[i].y - stars[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < CONNECTION_DIST) {
        const alpha = (1 - dist / CONNECTION_DIST) * 0.3 * Math.min(stars[i].life, stars[j].life);
        const hue = rainbowMode ? (stars[i].hue + hueShift) % 360 : stars[i].hue;
        ctx.strokeStyle = `hsla(${hue}, 60%, 70%, ${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(stars[i].x, stars[i].y);
        ctx.lineTo(stars[j].x, stars[j].y);
        ctx.stroke();
      }
    }
  }
}

// Main loop
function animate() {
  // Semi-transparent overlay for trails
  ctx.fillStyle = 'rgba(0, 0, 5, 0.15)';
  ctx.fillRect(0, 0, W, H);

  // Update hue shift for rainbow mode
  if (rainbowMode) {
    hueShift += 0.5;
  }

  // Update and draw
  drawConnections();

  for (let i = stars.length - 1; i >= 0; i--) {
    stars[i].update();
    stars[i].draw();

    // Remove dead stars
    if (stars[i].life <= 0) {
      stars.splice(i, 1);
    }
  }

  // Spawn ambient stars occasionally
  if (stars.length < 80 && Math.random() < 0.02) {
    stars.push(new Star());
  }

  // Stats
  const stats = document.getElementById('stats');
  if (stats) {
    stats.innerHTML = `stars: ${stars.length}<br>rainbow: ${rainbowMode ? 'ON' : 'OFF'}`;
  }

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
