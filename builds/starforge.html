<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Starforge — Click to Create Worlds</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
canvas { display: block; cursor: crosshair; }
#info {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.6); font-size: 13px; pointer-events: none;
  text-align: center; letter-spacing: 0.5px;
  background: rgba(0,0,0,0.4); padding: 8px 20px; border-radius: 20px;
  backdrop-filter: blur(10px);
}
#stats {
  position: fixed; top: 20px; right: 20px; color: rgba(255,255,255,0.5);
  font-size: 12px; text-align: right; pointer-events: none;
  background: rgba(0,0,0,0.4); padding: 10px 16px; border-radius: 12px;
  backdrop-filter: blur(10px);
}
#title {
  position: fixed; top: 20px; left: 20px; color: rgba(255,255,255,0.8);
  font-size: 18px; font-weight: 300; pointer-events: none;
  background: rgba(0,0,0,0.4); padding: 10px 16px; border-radius: 12px;
  backdrop-filter: blur(10px);
}
#title span { font-weight: 600; background: linear-gradient(135deg, #ff6b9d, #c084fc, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.controls {
  position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; z-index: 10;
}
.controls button {
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.8); padding: 6px 16px; border-radius: 20px;
  cursor: pointer; font-size: 12px; transition: all 0.3s;
  backdrop-filter: blur(10px);
}
.controls button:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); }
.controls button.active { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="title"><span>Starforge</span> — Click to Create Worlds</div>
<div id="stats"></div>
<div class="controls">
  <button id="modeStar" class="active">⭐ Star</button>
  <button id="modeNebula">🌌 Nebula</button>
  <button id="modeComet">☄️ Comet</button>
  <button id="clearAll">🗑️ Clear</button>
</div>
<div id="info">Click anywhere to create. Hold & drag for streams. Right-click for supernova.</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, DPR = window.devicePixelRatio || 1;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

let mode = 'star';
let bodies = [];
let particles = [];
let nebulae = [];
let stars_bg = [];

// Background stars
for (let i = 0; i < 200; i++) {
  stars_bg.push({ x: Math.random() * 4000 - 2000, y: Math.random() * 4000 - 2000, r: Math.random() * 1.2, a: Math.random(), speed: 0.002 + Math.random() * 0.008 });
}

const palette = [
  { h: 340, s: 80, l: 65 }, // pink
  { h: 270, s: 70, l: 70 }, // purple
  { h: 210, s: 80, l: 70 }, // blue
  { h: 30, s: 90, l: 65 },  // orange
  { h: 160, s: 70, l: 60 }, // teal
  { h: 50, s: 90, l: 70 },  // gold
  { h: 190, s: 80, l: 70 }, // cyan
];

class Body {
  constructor(x, y, color, mass) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = (Math.random() - 0.5) * 0.3;
    this.color = color; this.mass = mass || 1;
    this.r = Math.sqrt(mass || 1) * 3;
    this.trail = []; this.age = 0;
    this.glow = 15 + Math.random() * 20;
  }
  update() {
    this.age++;
    // subtle gravity between bodies
    for (let b of bodies) {
      if (b === this) continue;
      let dx = b.x - this.x, dy = b.y - this.y;
      let d = Math.sqrt(dx*dx + dy*dy) + 1;
      let f = 0.02 * b.mass / (d * d);
      this.vx += dx / d * f;
      this.vy += dy / d * f;
    }
    this.x += this.vx; this.y += this.vy;
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 40) this.trail.shift();
    // dampen
    this.vx *= 0.999; this.vy *= 0.999;
  }
  draw() {
    let alpha = Math.min(1, this.age / 30);
    // trail
    if (this.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.strokeStyle = `hsla(${this.color.h}, ${this.color.s}%, ${this.color.l}%, ${alpha * 0.3})`;
      ctx.lineWidth = this.r * 0.5;
      ctx.stroke();
    }
    // glow
    let grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.glow);
    grad.addColorStop(0, `hsla(${this.color.h}, ${this.color.s}%, ${this.color.l + 20}%, ${alpha * 0.9})`);
    grad.addColorStop(0.4, `hsla(${this.color.h}, ${this.color.s}%, ${this.color.l}%, ${alpha * 0.4})`);
    grad.addColorStop(1, `hsla(${this.color.h}, ${this.color.s}%, ${this.color.l}%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.glow, 0, Math.PI * 2);
    ctx.fill();
    // core
    ctx.fillStyle = `hsla(${this.color.h}, 40, 95, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    let angle = Math.random() * Math.PI * 2;
    let speed = 1 + Math.random() * 4;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.color = color; this.life = 1;
    this.decay = 0.008 + Math.random() * 0.02;
    this.r = 0.5 + Math.random() * 2;
  }
  update() { this.x += this.vx; this.y += this.vy; this.vx *= 0.98; this.vy *= 0.98; this.life -= this.decay; }
  draw() {
    ctx.fillStyle = `hsla(${this.color.h}, ${this.color.s}%, ${this.color.l}%, ${this.life})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * this.life, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Nebula {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color; this.life = 1;
    this.decay = 0.002;
    this.particles = [];
    this.r = 60 + Math.random() * 120;
    for (let i = 0; i < 150; i++) {
      let a = Math.random() * Math.PI * 2;
      let d = Math.random() * this.r;
      let offsetX = Math.cos(a) * d;
      let offsetY = Math.sin(a) * d;
      this.particles.push({ ox: offsetX, oy: offsetY, r: 2 + Math.random() * 6, a: 0.3 + Math.random() * 0.7, drift: Math.random() * 0.3 });
    }
  }
  update() { this.life -= this.decay; }
  draw() {
    let c = this.color;
    for (let p of this.particles) {
      let px = this.x + p.ox + Math.sin(Date.now() * 0.001 + p.ox) * p.drift * 10;
      let py = this.y + p.oy + Math.cos(Date.now() * 0.001 + p.oy) * p.drift * 10;
      let grad = ctx.createRadialGradient(px, py, 0, px, py, p.r);
      grad.addColorStop(0, `hsla(${c.h + Math.random() * 20 - 10}, ${c.s}%, ${c.l}%, ${p.a * this.life * 0.4})`);
      grad.addColorStop(1, `hsla(${c.h}, ${c.s}%, ${c.l}%, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(px, py, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

class Comet {
  constructor(x, y) {
    this.x = x; this.y = y;
    let angle = Math.random() * Math.PI * 2;
    let speed = 3 + Math.random() * 5;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.trail = []; this.life = 1;
    this.color = palette[Math.floor(Math.random() * palette.length)];
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 50) this.trail.shift();
    this.life -= 0.004;
    // spawn particles along trail
    if (Math.random() < 0.5) {
      particles.push(new Particle(this.x + (Math.random()-0.5)*4, this.y + (Math.random()-0.5)*4, this.color));
    }
  }
  draw() {
    let c = this.color;
    for (let i = 0; i < this.trail.length; i++) {
      let t = this.trail[i];
      let a = (i / this.trail.length) * this.life * 0.6;
      let r = (i / this.trail.length) * 3;
      ctx.fillStyle = `hsla(${c.h}, ${c.s}%, ${c.l}%, ${a})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    // head
    let grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 12);
    grad.addColorStop(0, `hsla(${c.h}, 40%, 95%, ${this.life})`);
    grad.addColorStop(0.5, `hsla(${c.h}, ${c.s}%, ${c.l}%, ${this.life * 0.6})`);
    grad.addColorStop(1, `hsla(${c.h}, ${c.s}%, ${c.l}%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 12, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Supernova {
  constructor(x, y) {
    this.x = x; this.y = y; this.life = 1;
    this.rings = []; this.flash = 1;
    for (let i = 0; i < 3; i++) {
      this.rings.push({ r: 0, maxR: 100 + i * 80, speed: 3 + i * 1.5, width: 3 - i * 0.8 });
    }
    // spawn many particles
    for (let i = 0; i < 200; i++) {
      let a = Math.random() * Math.PI * 2;
      let speed = 1 + Math.random() * 8;
      particles.push(new Particle(x, y, palette[Math.floor(Math.random() * palette.length)]));
      particles[particles.length-1].vx = Math.cos(a) * speed;
      particles[particles.length-1].vy = Math.sin(a) * speed;
      particles[particles.length-1].r = 1 + Math.random() * 3;
    }
  }
  update() {
    this.life -= 0.008; this.flash = Math.max(0, this.flash - 0.03);
    for (let ring of this.rings) ring.r += ring.speed;
  }
  draw() {
    for (let ring of this.rings) {
      ctx.strokeStyle = `hsla(40, 100%, 85%, ${this.life * 0.5})`;
      ctx.lineWidth = ring.width * this.life;
      ctx.beginPath();
      ctx.arc(this.x, this.y, ring.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (this.flash > 0) {
      let grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 200);
      grad.addColorStop(0, `rgba(255, 255, 240, ${this.flash * 0.8})`);
      grad.addColorStop(1, 'rgba(255, 200, 100, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 200, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

let mouseDown = false, mouseX = 0, mouseY = 0, spawnTimer = 0;
let supernovas = [];
let camX = 0, camY = 0;

canvas.addEventListener('mousedown', e => {
  if (e.button === 2) { supernovas.push(new Supernova(e.clientX, e.clientY)); return; }
  mouseDown = true; mouseX = e.clientX; mouseY = e.clientY;
  spawn(e.clientX, e.clientY);
});
canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  if (mouseDown) { spawnTimer++; if (spawnTimer % 2 === 0) spawn(e.clientX, e.clientY); }
});
canvas.addEventListener('mouseup', () => { mouseDown = false; spawnTimer = 0; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('touchstart', e => {
  let t = e.touches[0]; mouseDown = true; mouseX = t.clientX; mouseY = t.clientY;
  spawn(t.clientX, t.clientY);
});
canvas.addEventListener('touchmove', e => {
  let t = e.touches[0]; spawnTimer++;
  if (spawnTimer % 2 === 0) spawn(t.clientX, t.clientY);
});
canvas.addEventListener('touchend', () => { mouseDown = false; spawnTimer = 0; });

document.getElementById('modeStar').onclick = () => setMode('star');
document.getElementById('modeNebula').onclick = () => setMode('nebula');
document.getElementById('modeComet').onclick = () => setMode('comet');
document.getElementById('clearAll').onclick = () => { bodies = []; particles = []; nebulae = []; supernovas = []; };

function setMode(m) {
  mode = m;
  document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
  document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1)).classList.add('active');
}

function spawn(x, y) {
  let c = palette[Math.floor(Math.random() * palette.length)];
  if (mode === 'star') bodies.push(new Body(x, y, c, 1 + Math.random() * 4));
  else if (mode === 'nebula') nebulae.push(new Nebula(x, y, c));
  else if (mode === 'comet') {
    let comet = new Comet(x, y);
    bodies.push(comet);
  }
}

function drawBackground() {
  // deep space gradient
  let grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.7);
  grad.addColorStop(0, '#0a0a1a');
  grad.addColorStop(0.5, '#050510');
  grad.addColorStop(1, '#000005');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  // bg stars
  for (let s of stars_bg) {
    let sx = ((s.x - camX * 0.1) % (W + 400) + W + 400) % (W + 400) - 200;
    let sy = ((s.y - camY * 0.1) % (H + 400) + H + 400) % (H + 400) - 200;
    s.a += s.speed;
    let flicker = 0.4 + 0.6 * Math.sin(s.a) ** 2;
    ctx.fillStyle = `rgba(200, 220, 255, ${flicker * 0.7})`;
    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

let lastTime = Date.now();
function loop() {
  let now = Date.now(), dt = Math.min(32, now - lastTime); lastTime = now;

  // fade for trails
  ctx.fillStyle = 'rgba(0, 0, 5, 0.15)';
  ctx.fillRect(0, 0, W, H);
  if (now % 60 < dt) drawBackground();

  // camera drift
  if (bodies.length > 0) {
    let cx = 0, cy = 0;
    for (let b of bodies) { cx += b.x; cy += b.y; }
    cx /= bodies.length; cy /= bodies.length;
    camX += (cx - W/2 - camX) * 0.01;
    camY += (cy - H/2 - camY) * 0.01;
  }

  // nebulae
  for (let i = nebulae.length - 1; i >= 0; i--) {
    nebulae[i].update(); nebulae[i].draw();
    if (nebulae[i].life <= 0) nebulae.splice(i, 1);
  }

  // bodies
  for (let b of bodies) { b.update(); b.draw(); }

  // supernovas
  for (let i = supernovas.length - 1; i >= 0; i--) {
    supernovas[i].update(); supernovas[i].draw();
    if (supernovas[i].life <= 0) supernovas.splice(i, 1);
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(); particles[i].draw();
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // stats
  document.getElementById('stats').innerHTML = `
    Stars: ${bodies.length}<br>
    Particles: ${particles.length}<br>
    Nebulae: ${nebulae.length}
  `;

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
