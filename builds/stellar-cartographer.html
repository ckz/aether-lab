<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar Cartographer — Chart the Infinite</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #020209;
    color: #c8d0e0;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    cursor: crosshair;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }
  #hud {
    position: absolute;
    top: 12px;
    left: 16px;
    z-index: 10;
    pointer-events: none;
    font-size: 12px;
    line-height: 1.6;
    text-shadow: 0 0 6px #000;
    letter-spacing: 0.05em;
  }
  #hud .title {
    font-size: 16px;
    color: #7ef0ff;
    text-shadow: 0 0 12px #0af;
    margin-bottom: 4px;
  }
  #hud .label { color: #6688aa; }
  #hud .value { color: #c8e8ff; }
  #tooltip {
    position: absolute;
    z-index: 20;
    background: rgba(5, 10, 25, 0.95);
    border: 1px solid #1a4a6a;
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 12px;
    pointer-events: none;
    display: none;
    max-width: 220px;
    box-shadow: 0 0 20px rgba(20, 100, 180, 0.5);
    letter-spacing: 0.03em;
  }
  #tooltip .sys-name {
    color: #ffd060;
    font-size: 13px;
    margin-bottom: 3px;
    text-shadow: 0 0 8px rgba(255, 200, 60, 0.6);
  }
  #tooltip .sys-detail { color: #99aabb; margin: 1px 0; }
  #tooltip .sys-hint { color: #5588aa; font-style: italic; margin-top: 4px; }
  #instructions {
    position: absolute;
    bottom: 14px;
    right: 16px;
    z-index: 10;
    font-size: 11px;
    color: #445566;
    text-align: right;
    line-height: 1.6;
    letter-spacing: 0.04em;
    pointer-events: none;
    text-shadow: 0 0 4px #000;
  }
  #discovery-flash {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
    font-size: 22px;
    color: #ffd060;
    text-shadow: 0 0 20px #fa0, 0 0 40px #f80;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s ease;
    letter-spacing: 0.1em;
    text-align: center;
  }
  #discovery-flash.show { opacity: 1; }
  #discovery-flash .sub {
    font-size: 12px;
    color: #99aabb;
    text-shadow: none;
    margin-top: 6px;
    letter-spacing: 0.05em;
  }
  #minimap {
    position: absolute;
    bottom: 14px;
    left: 16px;
    z-index: 10;
    border: 1px solid #1a3a55;
    border-radius: 3px;
    background: rgba(5, 10, 25, 0.85);
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="space"></canvas>

<div id="hud">
  <div class="title">✦ STELLAR CARTOGRAPHER ✦</div>
  <div><span class="label">SECTOR </span><span class="value" id="sector">α</span></div>
  <div><span class="label">DISCOVERED </span><span class="value" id="discovered">0</span><span class="label"> / </span><span class="value" id="total">0</span></div>
  <div><span class="label">COORDINATES </span><span class="value" id="coords">0, 0</span></div>
  <div><span class="label">MODE </span><span class="value" id="mode-display">NAVIGATE</span></div>
</div>

<div id="tooltip"></div>
<div id="instructions">
  MOUSE: explore &nbsp;|&nbsp; CLICK: inspect system<br>
  HOLD DRAG: pan &nbsp;|&nbsp; SCROLL: zoom<br>
  M: map mode &nbsp;|&nbsp; C: clear routes &nbsp;|&nbsp; R: reset
</div>

<div id="discovery-flash">
  <div id="flash-name"></div>
  <div class="sub" id="flash-detail"></div>
</div>

<canvas id="minimap" width="140" height="100"></canvas>

<script>
const canvas = document.getElementById('space');
const ctx = canvas.getContext('2d');
const mini = document.getElementById('minimap');
const mctx = mini.getContext('2d');
const tooltip = document.getElementById('tooltip');
const flash = document.getElementById('discovery-flash');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ---- WORLD ----
const WORLD_W = 6000, WORLD_H = 6000;
const STAR_COUNT = 900;
const SYSTEM_COUNT = 55;

// Palette families for star colors
const STAR_TYPES = [
  { name: 'M', color: '#ff9944', glow: 'rgba(255,150,70,0.4)', size: [1, 2.2] },
  { name: 'K', color: '#ffcc66', glow: 'rgba(255,200,100,0.4)', size: [1.5, 2.8] },
  { name: 'G', color: '#fff4cc', glow: 'rgba(255,240,200,0.5)', size: [1.8, 3.2] },
  { name: 'F', color: '#ffffff', glow: 'rgba(220,230,255,0.5)', size: [2, 3.5] },
  { name: 'A', color: '#ccddff', glow: 'rgba(180,200,255,0.4)', size: [2.2, 3.8] },
  { name: 'B', color: '#99bbff', glow: 'rgba(140,170,255,0.4)', size: [2.5, 4] },
  { name: 'O', color: '#8899ff', glow: 'rgba(120,140,255,0.5)', size: [3, 5] },
];

// Generate poetic system names
const prefixes = ['Alpha','Beta','Gamma','Delta','Epsilon','Zeta','Eta','Theta','Iota','Kappa',
  'Lambda','Mu','Nu','Xi','Omicron','Pi','Rho','Sigma','Tau','Upsilon',
  'Phi','Chi','Psi','Omega','Proxima','Nova','Sol','Luna','Astra','Celestia',
  'Eos','Aurora','Nyx','Hyperion','Prometheus','Janus','Vesper','Corvus','Aquila','Lyra'];
const suffixes = ['Majoris','Minoris','Australis','Borealis','Occultus','Luminus','Umbra',
  'Caeli','Nebulae','Profundus','Eternus','Transiens','Vigilis','Sidus','Ignis',
  'Undae','Aeternum','Serenus','Vagus','Perpetuus'];

function systemName(i) {
  return `${prefixes[i % prefixes.length]} ${suffixes[Math.floor(i / prefixes.length) % suffixes.length]}`;
}

function seededRand(seed) {
  let s = seed;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}

const rand = seededRand(42);

const bgStars = [];
for (let i = 0; i < STAR_COUNT; i++) {
  bgStars.push({
    x: rand() * WORLD_W,
    y: rand() * WORLD_H,
    brightness: 0.3 + rand() * 0.7,
    twinkleSpeed: 0.5 + rand() * 3,
    twinkleOffset: rand() * Math.PI * 2,
    size: 0.5 + rand() * 1.5,
  });
}

const systems = [];
for (let i = 0; i < SYSTEM_COUNT; i++) {
  const typeIdx = Math.floor(rand() * STAR_TYPES.length);
  const t = STAR_TYPES[typeIdx];
  systems.push({
    id: i,
    name: systemName(i),
    x: 300 + rand() * (WORLD_W - 600),
    y: 300 + rand() * (WORLD_H - 600),
    type: t.name,
    color: t.color,
    glow: t.glow,
    size: t.size[0] + rand() * (t.size[1] - t.size[0]),
    planets: 1 + Math.floor(rand() * 7),
    discovered: false,
    note: [
      'Binary companion detected','Unusual emission signature','Dyson swarm candidate',
      'Ice worlds in outer orbit','Volcanic moon system','Rings of silicate dust',
      'Rogue planet detected','Ancient stellar nursery remnant','Strong magnetosphere',
      'Carbon-rich atmosphere','Tidally locked worlds','Asteroid belt anomaly',
      'Possible artificial signal','Water absorption lines','Nocturnal luminescence',
      'Crystalline formation','Gaseous giant with rings','Multiple habitable zones',
      'Dark matter lensing','Quasi-stellar radio source'
    ][Math.floor(rand() * 20)],
  });
}

// ---- VIEW ----
let cam = { x: WORLD_W / 2, y: WORLD_H / 2, zoom: 0.7 };
let targetCam = { ...cam };
let mouse = { x: W/2, y: H/2, worldX: cam.x, worldY: cam.y, down: false, dragStart: null };
let mapMode = false;
let routes = []; // [ {from, to} ] user-plotted
let hoveredSystem = null;
let selectedSystem = null;
let discoveredCount = 0;

// ---- INPUT ----
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.worldX = (e.clientX - W/2) / cam.zoom + cam.x;
  mouse.worldY = (e.clientY - H/2) / cam.zoom + cam.y;

  if (mouse.down && mouse.dragStart) {
    const dx = (mouse.dragStart.x - e.clientX) / cam.zoom;
    const dy = (mouse.dragStart.y - e.clientY) / cam.zoom;
    targetCam.x = mouse.dragStart.camX + dx;
    targetCam.y = mouse.dragStart.camY + dy;
  }
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) {
    mouse.down = true;
    mouse.dragStart = { x: e.clientX, y: e.clientY, camX: targetCam.x, camY: targetCam.y };
  }
});

canvas.addEventListener('mouseup', e => {
  if (e.button === 0 && mouse.dragStart) {
    const dist = Math.hypot(e.clientX - mouse.dragStart.x, e.clientY - mouse.dragStart.y);
    if (dist < 4) {
      // Click - inspect system
      handleClick(mouse.worldX, mouse.worldY);
    }
    mouse.down = false;
    mouse.dragStart = null;
  }
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.92 : 1.08;
  targetCam.zoom = Math.max(0.15, Math.min(3.5, targetCam.zoom * factor));
}, { passive: false });

document.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') mapMode = !mapMode;
  if (e.key === 'c' || e.key === 'C') routes = [];
  if (e.key === 'r' || e.key === 'R') {
    targetCam = { x: WORLD_W / 2, y: WORLD_H / 2, zoom: 0.7 };
    routes = [];
  }
});

function handleClick(wx, wy) {
  // Find closest system
  let best = null, bestDist = 25 / cam.zoom;
  for (const s of systems) {
    const d = Math.hypot(s.x - wx, s.y - wy);
    if (d < bestDist) { bestDist = d; best = s; }
  }
  if (best) {
    selectedSystem = best;
    if (!best.discovered) {
      best.discovered = true;
      discoveredCount++;
      document.getElementById('discovered').textContent = discoveredCount;
      showDiscovery(best);
    }
    // If a system already selected and we click another, plot route
    if (selectedSystem && selectedSystem !== best) {
      routes.push({ from: selectedSystem, to: best });
      selectedSystem = best;
    }
  }
}

function showDiscovery(sys) {
  document.getElementById('flash-name').textContent = `✦ NEW SYSTEM: ${sys.name} ✦`;
  document.getElementById('flash-detail').textContent = `${sys.type}-type · ${sys.planets} planets · ${sys.note}`;
  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 3000);
}

// ---- RENDER ----
const sectorLabels = [
  'α Andromedae','β Cassiopeiae','γ Persei','δ Aurigae','ε Lyrae',
  'ζ Orionis','η Geminorum','θ Cancri','ι Leonis','κ Draconis'
];

function worldToScreen(wx, wy) {
  return {
    x: (wx - cam.x) * cam.zoom + W/2,
    y: (wy - cam.y) * cam.zoom + H/2,
  };
}

function render(time) {
  const t = time / 1000;

  // Smooth camera
  cam.x += (targetCam.x - cam.x) * 0.08;
  cam.y += (targetCam.y - cam.y) * 0.08;
  cam.zoom += (targetCam.zoom - cam.zoom) * 0.08;

  // Background
  ctx.fillStyle = '#020209';
  ctx.fillRect(0, 0, W, H);

  // Deep space nebula tint (two orbs)
  const n1 = worldToScreen(WORLD_W * 0.3, WORLD_H * 0.3);
  const ng1 = ctx.createRadialGradient(n1.x, n1.y, 0, n1.x, n1.y, W * 0.7);
  ng1.addColorStop(0, 'rgba(20, 10, 50, 0.4)');
  ng1.addColorStop(1, 'rgba(2, 2, 9, 0)');
  ctx.fillStyle = ng1;
  ctx.fillRect(0, 0, W, H);

  const n2 = worldToScreen(WORLD_W * 0.7, WORLD_H * 0.7);
  const ng2 = ctx.createRadialGradient(n2.x, n2.y, 0, n2.x, n2.y, W * 0.6);
  ng2.addColorStop(0, 'rgba(10, 30, 50, 0.35)');
  ng2.addColorStop(1, 'rgba(2, 2, 9, 0)');
  ctx.fillStyle = ng2;
  ctx.fillRect(0, 0, W, H);

  // Grid lines (subtle)
  ctx.strokeStyle = 'rgba(20, 40, 60, 0.25)';
  ctx.lineWidth = 0.5;
  const gridSpacing = 200;
  const startX = Math.floor((cam.x - W/2/cam.zoom) / gridSpacing) * gridSpacing;
  const startY = Math.floor((cam.y - H/2/cam.zoom) / gridSpacing) * gridSpacing;
  for (let x = startX; x < cam.x + W/2/cam.zoom + gridSpacing; x += gridSpacing) {
    const s = worldToScreen(x, 0);
    ctx.beginPath(); ctx.moveTo(s.x, 0); ctx.lineTo(s.x, H); ctx.stroke();
  }
  for (let y = startY; y < cam.y + H/2/cam.zoom + gridSpacing; y += gridSpacing) {
    const s = worldToScreen(0, y);
    ctx.beginPath(); ctx.moveTo(0, s.y); ctx.lineTo(W, s.y); ctx.stroke();
  }

  // Background stars
  for (const s of bgStars) {
    const p = worldToScreen(s.x, s.y);
    if (p.x < -10 || p.x > W+10 || p.y < -10 || p.y > H+10) continue;
    const twinkle = 0.5 + 0.5 * Math.sin(t * s.twinkleSpeed + s.twinkleOffset);
    const alpha = s.brightness * twinkle;
    ctx.fillStyle = `rgba(180,200,255,${alpha})`;
    ctx.fillRect(p.x, p.y, s.size * cam.zoom * 0.6, s.size * cam.zoom * 0.6);
  }

  // Routes
  ctx.lineWidth = 1;
  for (const r of routes) {
    const a = worldToScreen(r.from.x, r.from.y);
    const b = worldToScreen(r.to.x, r.to.y);
    const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
    grad.addColorStop(0, r.from.color + '66');
    grad.addColorStop(1, r.to.color + '66');
    ctx.strokeStyle = grad;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();

    // Traveling dot
    const progress = ((t * 0.3 + r.from.x * 0.01) % 1);
    const dx = a.x + (b.x - a.x) * progress;
    const dy = a.y + (b.y - a.y) * progress;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(dx, dy, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Systems
  hoveredSystem = null;
  let minD = 20 / cam.zoom;
  for (const sys of systems) {
    const p = worldToScreen(sys.x, sys.y);
    if (p.x < -60 || p.x > W+60 || p.y < -60 || p.y > H+60) continue;

    // Hover test
    const d = Math.hypot(sys.x - mouse.worldX, sys.y - mouse.worldY);
    if (d < minD) { minD = d; hoveredSystem = sys; }

    const pulse = 1 + 0.08 * Math.sin(t * 1.5 + sys.x * 0.01);
    const r = sys.size * cam.zoom * pulse;

    // Glow
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 8);
    g.addColorStop(0, sys.glow);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 8, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = sys.discovered ? sys.color : '#445566';
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();

    // Cross highlight on hover
    if (hoveredSystem === sys) {
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(p.x - r * 4, p.y); ctx.lineTo(p.x + r * 4, p.y);
      ctx.moveTo(p.x, p.y - r * 4); ctx.lineTo(p.x, p.y + r * 4);
      ctx.stroke();

      // Name label
      ctx.fillStyle = '#ffd060';
      ctx.font = `${11}px "Courier New"`;
      ctx.textAlign = 'center';
      ctx.fillText(sys.name, p.x, p.y - r * 3.5);

      if (sys.discovered) {
        ctx.fillStyle = '#99aabb';
        ctx.font = `${10}px "Courier New"`;
        ctx.fillText(`${sys.type}-type · ${sys.planets} planets`, p.x, p.y - r * 5.2);
      }

      // Tooltip
      tooltip.style.display = 'block';
      tooltip.style.left = (p.x + 20) + 'px';
      tooltip.style.top = (p.y - 20) + 'px';
      tooltip.innerHTML = sys.discovered ? `
        <div class="sys-name">${sys.name}</div>
        <div class="sys-detail">${sys.type}-type star · ${sys.planets} planets</div>
        <div class="sys-detail">${sys.note}</div>
        <div class="sys-hint">Click to ${selectedSystem === sys ? 'plot route' : 'select'}</div>
      ` : `
        <div class="sys-name">${sys.name}</div>
        <div class="sys-detail">Unexplored</div>
        <div class="sys-hint">Click to chart</div>
      `;
    }
  }

  if (!hoveredSystem) tooltip.style.display = 'none';

  // HUD
  document.getElementById('coords').textContent =
    `${Math.floor(cam.x).toString().padStart(5,'0')}, ${Math.floor(cam.y).toString().padStart(5,'0')}`;
  document.getElementById('sector').textContent =
    sectorLabels[Math.floor(cam.x / 600) % sectorLabels.length];
  document.getElementById('total').textContent = systems.length;
  document.getElementById('mode-display').textContent = mapMode ? 'MAP' : 'NAVIGATE';

  // Minimap
  mctx.fillStyle = 'rgba(5, 10, 25, 0.9)';
  mctx.fillRect(0, 0, 140, 100);
  for (const sys of systems) {
    const mx = (sys.x / WORLD_W) * 140;
    const my = (sys.y / WORLD_H) * 100;
    mctx.fillStyle = sys.discovered ? sys.color : '#334455';
    mctx.fillRect(mx, my, 2, 2);
  }
  // Viewport rect
  const vx = ((cam.x - W/2/cam.zoom) / WORLD_W) * 140;
  const vy = ((cam.y - H/2/cam.zoom) / WORLD_H) * 100;
  const vw = (W / cam.zoom / WORLD_W) * 140;
  const vh = (H / cam.zoom / WORLD_H) * 100;
  mctx.strokeStyle = 'rgba(100,180,255,0.5)';
  mctx.lineWidth = 1;
  mctx.strokeRect(vx, vy, vw, vh);

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
