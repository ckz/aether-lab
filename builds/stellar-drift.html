<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar Drift — Generative Particle Cosmos</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #050510;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  cursor: none;
}
canvas { display: block; }
#ui {
  position: fixed;
  top: 20px;
  left: 20px;
  color: rgba(255,255,255,0.5);
  font-size: 12px;
  pointer-events: none;
  z-index: 10;
}
#title {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.08);
  font-size: 48px;
  font-weight: bold;
  letter-spacing: 0.3em;
  pointer-events: none;
  z-index: 10;
  text-transform: uppercase;
}
#hint {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.3);
  font-size: 11px;
  pointer-events: none;
  z-index: 10;
  letter-spacing: 0.1em;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div>PARTICLES: <span id="pcount">0</span></div>
  <div>CONNECTIONS: <span id="ccount">0</span></div>
  <div>FPS: <span id="fps">0</span></div>
</div>
<div id="title">Stellar Drift</div>
<div id="hint">Move mouse to attract · Click to burst · Scroll to warp</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const pcountEl = document.getElementById('pcount');
const ccountEl = document.getElementById('ccount');
const fpsEl = document.getElementById('fps');

let W, H, particles = [], mouse = { x: -9999, y: -9999, active: false }, warp = 1, connections = 0;
let lastTime = performance.now(), frameCount = 0, fps = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Color palettes for different "constellations"
const palettes = [
  ['#FF6B9D', '#FFA07A', '#FFD93D', '#FF8C94'],  // Sunset
  ['#667EEA', '#764BA2', '#F093FB', '#F5576C'],  // Nebula
  ['#00D9FF', '#00F5D4', '#00BBF9', '#9B5DE5'],  // Aurora
  ['#F72585', '#B5179E', '#7209B7', '#560BAD'],  // Deep Space
  ['#FFD700', '#FFA500', '#FF6347', '#FF4500'],  // Solar
];

let currentPalette = palettes[0];
let paletteBlend = 0;

class Particle {
  constructor(x, y, burst = false) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.vx = (Math.random() - 0.5) * (burst ? 8 : 0.5);
    this.vy = (Math.random() - 0.5) * (burst ? 8 : 0.5);
    this.size = Math.random() * 2 + 0.5;
    this.life = 1;
    this.decay = burst ? 0.015 : 0;
    this.color = currentPalette[Math.floor(Math.random() * currentPalette.length)];
    this.phase = Math.random() * Math.PI * 2;
    this.pulseSpeed = 0.02 + Math.random() * 0.03;
    this.orbitRadius = Math.random() * 50 + 20;
    this.orbitSpeed = (Math.random() - 0.5) * 0.02;
    this.orbitAngle = Math.random() * Math.PI * 2;
    this.trail = [];
    this.trailLength = Math.floor(Math.random() * 15) + 5;
  }

  update() {
    // Gentle ambient motion
    this.phase += this.pulseSpeed;
    const ambientX = Math.cos(this.phase) * 0.3;
    const ambientY = Math.sin(this.phase * 0.7) * 0.3;

    // Mouse attraction
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 250) {
        const force = (250 - dist) / 250 * 0.08 * warp;
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }
    }

    // Apply velocity with damping
    this.vx = (this.vx + ambientX) * 0.99;
    this.vy = (this.vy + ambientY) * 0.99;
    this.x += this.vx * warp;
    this.y += this.vy * warp;

    // Store trail
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.trailLength) this.trail.shift();

    // Wrap around edges
    if (this.x < 0) this.x = W;
    if (this.x > W) this.x = 0;
    if (this.y < 0) this.y = H;
    if (this.y > H) this.y = 0;

    // Decay for burst particles
    if (this.decay > 0) {
      this.life -= this.decay;
    }

    return this.life > 0;
  }

  draw() {
    // Draw trail
    if (this.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.strokeStyle = this.color + Math.floor(this.life * 40).toString(16).padStart(2, '0');
      ctx.lineWidth = this.size * 0.5;
      ctx.stroke();
    }

    // Draw particle
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * (0.8 + Math.sin(this.phase * 2) * 0.2), 0, Math.PI * 2);
    ctx.fillStyle = this.color + Math.floor(this.life * 60).toString(16).padStart(2, '0');
    ctx.fill();

    // Glow
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
    const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
    glow.addColorStop(0, this.color + '40');
    glow.addColorStop(1, this.color + '00');
    ctx.fillStyle = glow;
    ctx.fill();
  }
}

// Initialize particles
for (let i = 0; i < 200; i++) {
  particles.push(new Particle());
}

// Event listeners
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => {
  mouse.active = false;
});

canvas.addEventListener('click', e => {
  const burstCount = 30;
  for (let i = 0; i < burstCount; i++) {
    particles.push(new Particle(e.clientX, e.clientY, true));
  }
  // Cycle palette on click
  currentPalette = palettes[Math.floor(Math.random() * palettes.length)];
});

canvas.addEventListener('wheel', e => {
  warp = Math.max(0.1, Math.min(3, warp + (e.deltaY > 0 ? 0.1 : -0.1)));
});

// Touch support
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
}, { passive: false });

canvas.addEventListener('touchend', () => {
  mouse.active = false;
});

// Draw connections
function drawConnections() {
  connections = 0;
  const maxDist = 120;
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < maxDist) {
        const alpha = (1 - dist / maxDist) * 0.3 * particles[i].life * particles[j].life;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
        connections++;
      }
    }
  }
}

// Animation loop
function animate() {
  // FPS counter
  frameCount++;
  const now = performance.now();
  if (now - lastTime >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastTime = now;
    fpsEl.textContent = fps;
  }

  // Semi-transparent clear for motion blur effect
  ctx.fillStyle = 'rgba(5, 5, 16, 0.15)';
  ctx.fillRect(0, 0, W, H);

  // Update and draw particles
  particles = particles.filter(p => p.update());
  drawConnections();
  particles.forEach(p => p.draw());

  // Maintain particle count
  while (particles.length < 200) {
    particles.push(new Particle());
  }

  // Update UI
  pcountEl.textContent = particles.length;
  ccountEl.textContent = connections;

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
