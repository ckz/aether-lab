<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar Drift — Generative Cosmos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; }
  #info {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
  #title {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.15);
    font-size: 14px;
    letter-spacing: 6px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="title">Stellar Drift</div>
<canvas id="canvas"></canvas>
<div id="info">move mouse to attract · click to burst</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Mouse
const mouse = { x: W/2, y: H/2, active: false };
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => mouse.active = false);
canvas.addEventListener('click', e => {
  for (let i = 0; i < 30; i++) {
    particles.push(new Particle(e.clientX, e.clientY, true));
  }
});

// Stars background
const stars = [];
for (let i = 0; i < 200; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.2,
    a: Math.random(),
    speed: 0.003 + Math.random() * 0.01
  });
}

// Particles
class Particle {
  constructor(x, y, burst = false) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.vx = burst ? (Math.random() - 0.5) * 6 : (Math.random() - 0.5) * 0.5;
    this.vy = burst ? (Math.random() - 0.5) * 6 : (Math.random() - 0.5) * 0.5;
    this.life = burst ? 60 + Math.random() * 60 : Infinity;
    this.maxLife = this.life;
    this.radius = burst ? 2 + Math.random() * 3 : 1.5 + Math.random() * 2;
    // Color from cosmic palette
    const hues = [200, 220, 260, 280, 320, 180, 40];
    this.hue = hues[Math.floor(Math.random() * hues.length)];
    this.sat = 60 + Math.random() * 40;
    this.light = 50 + Math.random() * 30;
  }

  update() {
    // Gentle drift
    this.vx += (Math.random() - 0.5) * 0.02;
    this.vy += (Math.random() - 0.5) * 0.02;

    // Mouse attraction
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 250) {
        const force = (250 - dist) / 250 * 0.03;
        this.vx += dx / dist * force;
        this.vy += dy / dist * force;
      }
    }

    // Damping
    this.vx *= 0.999;
    this.vy *= 0.999;

    // Speed cap
    const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
    if (speed > 2) {
      this.vx = this.vx / speed * 2;
      this.vy = this.vy / speed * 2;
    }

    this.x += this.vx;
    this.y += this.vy;

    // Wrap
    if (this.x < -50) this.x = W + 50;
    if (this.x > W + 50) this.x = -50;
    if (this.y < -50) this.y = H + 50;
    if (this.y > H + 50) this.y = -50;

    if (this.life !== Infinity) this.life--;
  }

  draw() {
    const alpha = this.life === Infinity ? 0.8 : (this.life / this.maxLife) * 0.8;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, ${this.sat}%, ${this.light}%, ${alpha})`;
    ctx.fill();

    // Glow
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 3, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, ${this.sat}%, ${this.light}%, ${alpha * 0.1})`;
    ctx.fill();
  }

  get dead() { return this.life <= 0; }
}

const particles = [];
for (let i = 0; i < 120; i++) {
  particles.push(new Particle());
}

// Nebula blobs
const nebulae = [];
for (let i = 0; i < 3; i++) {
  nebulae.push({
    x: Math.random() * W,
    y: Math.random() * H,
    radius: 150 + Math.random() * 200,
    hue: [200, 280, 320][i],
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3
  });
}

let frame = 0;

function animate() {
  frame++;

  // Trail fade
  ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
  ctx.fillRect(0, 0, W, H);

  // Nebulae (very subtle)
  nebulae.forEach(n => {
    n.x += n.vx;
    n.y += n.vy;
    if (n.x < -200 || n.x > W + 200) n.vx *= -1;
    if (n.y < -200 || n.y > H + 200) n.vy *= -1;

    const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.radius);
    grad.addColorStop(0, `hsla(${n.hue}, 80%, 40%, 0.015)`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(n.x - n.radius, n.y - n.radius, n.radius * 2, n.radius * 2);
  });

  // Stars twinkle
  stars.forEach(s => {
    s.a += s.speed;
    const alpha = (Math.sin(s.a) + 1) / 2 * 0.6;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200, 210, 255, ${alpha})`;
    ctx.fill();
  });

  // Update & draw particles
  particles.forEach(p => p.update());

  // Connections
  const maxDist = 120;
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < maxDist) {
        const alpha = (1 - dist / maxDist) * 0.25;
        const hue = (particles[i].hue + particles[j].hue) / 2;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `hsla(${hue}, 70%, 60%, ${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  particles.forEach(p => p.draw());

  // Remove dead, replenish
  for (let i = particles.length - 1; i >= 0; i--) {
    if (particles[i].dead) particles.splice(i, 1);
  }
  while (particles.length < 120) {
    particles.push(new Particle(
      Math.random() < 0.5 ? -10 : W + 10,
      Math.random() * H
    ));
  }

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
