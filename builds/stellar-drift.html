<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar Drift — Generative Flow Field</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #aaa;
    overflow: hidden;
  }
  canvas {
    border-radius: 8px;
    box-shadow: 0 0 60px rgba(100, 140, 255, 0.15);
    cursor: crosshair;
  }
  .controls {
    margin-top: 20px;
    display: flex;
    gap: 20px;
    align-items: center;
    font-size: 13px;
    z-index: 10;
  }
  .controls label {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .controls input[type="range"] {
    width: 100px;
    accent-color: #7b9fff;
  }
  .controls button {
    background: rgba(100, 140, 255, 0.15);
    border: 1px solid rgba(100, 140, 255, 0.3);
    color: #aaccff;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    transition: all 0.2s;
  }
  .controls button:hover {
    background: rgba(100, 140, 255, 0.3);
    color: #fff;
  }
  .title {
    margin-bottom: 16px;
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(140, 170, 255, 0.7);
  }
  .stats {
    margin-top: 8px;
    font-size: 11px;
    color: rgba(140, 170, 255, 0.4);
  }
</style>
</head>
<body>
  <div class="title">✦ Stellar Drift ✦</div>
  <canvas id="canvas"></canvas>
  <div class="controls">
    <label>Speed <input type="range" id="speed" min="1" max="10" value="3"></label>
    <label>Trails <input type="range" id="trails" min="1" max="30" value="10"></label>
    <label>Density <input type="range" id="density" min="500" max="8000" value="2500" step="500"></label>
    <label>Chaos <input type="range" id="chaos" min="1" max="100" value="40"></label>
    <button id="reset">↻ Reset</button>
    <button id="colorShift">◈ Shift Hue</button>
  </div>
  <div class="stats" id="stats">particles: 2500 | FPS: --</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  const s = Math.min(window.innerWidth - 40, window.innerHeight - 140, 900);
  canvas.width = s;
  canvas.height = s * 0.75;
}
resize();
window.addEventListener('resize', () => { resize(); init(); });

// Simplex-like noise using sin-based pseudo-random field
function noise(x, y, t) {
  return (
    Math.sin(x * 0.02 + t * 0.3) * Math.cos(y * 0.02 - t * 0.2) +
    Math.sin((x + y) * 0.015 + t * 0.15) * 0.7 +
    Math.sin(x * 0.005 - t * 0.1) * Math.cos(y * 0.005 + t * 0.08) * 1.5
  );
}

let particles = [];
let W, H;
let hueBase = 210; // blue base
let hueRange = 60;
let t = 0;
let mouse = { x: -1000, y: -1000, active: false };

function getParticleColor(life, maxLife) {
  const ratio = life / maxLife;
  const h = (hueBase + (1 - ratio) * hueRange) % 360;
  const s = 70 + ratio * 30;
  const l = 30 + ratio * 50;
  const a = 0.1 + ratio * 0.6;
  return `hsla(${h}, ${s}%, ${l}%, ${a})`;
}

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.life = 0;
    this.maxLife = 150 + Math.random() * 350;
    this.speed = 0.5 + Math.random() * 1.5;
  }
  update(speedMult, chaosMult) {
    const angle = noise(this.x, this.y, t) * Math.PI * 2 * (chaosMult / 50);
    let vx = Math.cos(angle) * this.speed * speedMult;
    let vy = Math.sin(angle) * this.speed * speedMult;

    // Mouse attraction
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 200 && dist > 1) {
        const force = (200 - dist) / 200 * 0.8;
        vx += (dx / dist) * force;
        vy += (dy / dist) * force;
      }
    }

    this.x += vx;
    this.y += vy;
    this.life++;

    if (this.x < -20 || this.x > W + 20 || this.y < -20 || this.y > H + 20 || this.life > this.maxLife) {
      this.reset();
    }
  }
  draw(ctx) {
    ctx.beginPath();
    ctx.arc(this.x, this.y, 1.2, 0, Math.PI * 2);
    ctx.fillStyle = getParticleColor(this.life, this.maxLife);
    ctx.fill();
  }
}

function init() {
  W = canvas.width;
  H = canvas.height;
  const count = parseInt(document.getElementById('density').value);
  particles = [];
  for (let i = 0; i < count; i++) particles.push(new Particle());
  // Fade to black on init
  ctx.fillStyle = 'rgba(10, 10, 15, 1)';
  ctx.fillRect(0, 0, W, H);
}

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => { mouse.active = false; });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.touches[0].clientX - rect.left;
  mouse.y = e.touches[0].clientY - rect.top;
  mouse.active = true;
}, { passive: false });
canvas.addEventListener('touchend', () => { mouse.active = false; });

document.getElementById('reset').addEventListener('click', () => {
  t = 0;
  hueBase = Math.random() * 360;
  init();
});
document.getElementById('colorShift').addEventListener('click', () => {
  hueBase = (hueBase + 60 + Math.random() * 60) % 360;
});

let lastFrame = performance.now();
let fps = 0;
let frameCount = 0;
let fpsTime = 0;

function animate() {
  const now = performance.now();
  const dt = (now - lastFrame) / 1000;
  lastFrame = now;
  t += dt;

  const speedMult = parseFloat(document.getElementById('speed').value) * 0.5;
  const trailAlpha = parseFloat(document.getElementById('trails').value) / 255;
  const chaosMult = parseFloat(document.getElementById('chaos').value);

  // Trail fade
  ctx.fillStyle = `rgba(10, 10, 15, ${trailAlpha})`;
  ctx.fillRect(0, 0, W, H);

  // Draw connections between nearby particles (sparse, for performance)
  ctx.lineWidth = 0.3;
  for (let i = 0; i < particles.length; i += 3) {
    const p = particles[i];
    p.update(speedMult, chaosMult);
    p.draw(ctx);

    // Only check connections for a subset
    if (i % 6 === 0) {
      for (let j = i + 1; j < Math.min(i + 30, particles.length); j += 3) {
        const q = particles[j];
        const dx = p.x - q.x;
        const dy = p.y - q.y;
        const d = dx * dx + dy * dy;
        if (d < 1800) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          const alpha = (1 - d / 1800) * 0.15;
          ctx.strokeStyle = `hsla(${hueBase}, 60%, 50%, ${alpha})`;
          ctx.stroke();
        }
      }
    }
  }

  // FPS counter
  frameCount++;
  fpsTime += dt;
  if (fpsTime >= 1) {
    fps = Math.round(frameCount / fpsTime);
    frameCount = 0;
    fpsTime = 0;
  }
  document.getElementById('stats').textContent =
    `particles: ${particles.length} | FPS: ${fps} | hue: ${Math.round(hueBase)}°`;

  requestAnimationFrame(animate);
}

init();
animate();
</script>
</body>
</html>
