<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar Drift — Generative Flow Field</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #ccc;
    cursor: crosshair;
  }
  canvas { display: block; }
  #info {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    text-align: center;
    pointer-events: none;
    letter-spacing: 1px;
  }
  #stats {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    text-align: right;
    pointer-events: none;
    line-height: 1.6;
  }
  #controls {
    position: fixed;
    top: 20px;
    left: 20px;
    pointer-events: all;
  }
  .btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.5);
    padding: 6px 12px;
    margin: 2px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
    transition: all 0.3s;
  }
  .btn:hover {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.8);
    border-color: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="controls">
  <button class="btn" onclick="resetField()">RESET</button>
  <button class="btn" onclick="toggleMode()">MODE</button>
  <button class="btn" onclick="changePalette()">PALETTE</button>
</div>
<div id="stats">
  particles: <span id="pcount">0</span><br>
  mode: <span id="pmode">flow</span><br>
  palette: <span id="ppal">nebula</span>
</div>
<div id="info">move mouse to influence the field · click to burst</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── State ──────────────────────────────────────────────
const PALETTES = {
  nebula:  ['#ff6b9d', '#c44dff', '#4d7dff', '#00d4ff', '#ff6b9d'],
  aurora:  ['#00ff88', '#00ccaa', '#4488ff', '#8844ff', '#00ff88'],
  ember:   ['#ff4400', '#ff8800', '#ffcc00', '#ff4400', '#ff4400'],
  ocean:   ['#0044ff', '#0088ff', '#00ccff', '#0044ff', '#0044ff'],
  ghost:   ['#ffffff', '#aaaaff', '#ffffff', '#ffaaff', '#ffffff'],
  mono:    ['#ffffff', '#aaaaaa', '#555555', '#aaaaaa', '#ffffff']
};
const PAL_NAMES = Object.keys(PALETTES);
let palette = 0;
let mode = 0; // 0=flow, 1=orbit, 2=wave

const mouse = { x: W/2, y: H/2, active: false, click: 0 };

canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
});
canvas.addEventListener('click', e => {
  mouse.click = 30;
  for (let i = 0; i < 40; i++) {
    particles.push(new Particle(e.clientX, e.clientY, true));
  }
});
canvas.addEventListener('mouseleave', () => { mouse.active = false; });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true;
}, { passive: false });

// ─── Noise (simple value noise) ─────────────────────────
const NOISE_SIZE = 256;
const noiseGrid = new Float32Array(NOISE_SIZE * NOISE_SIZE);
function initNoise() {
  for (let i = 0; i < noiseGrid.length; i++) {
    noiseGrid[i] = Math.random();
  }
}
function smoothNoise(x, y) {
  const ix = Math.floor(x) & (NOISE_SIZE - 1);
  const iy = Math.floor(y) & (NOISE_SIZE - 1);
  const fx = x - Math.floor(x);
  const fy = y - Math.floor(y);
  const sx = fx * fx * (3 - 2 * fx);
  const sy = fy * fy * (3 - 2 * fy);
  const ix1 = (ix + 1) & (NOISE_SIZE - 1);
  const iy1 = (iy + 1) & (NOISE_SIZE - 1);
  const a = noiseGrid[iy * NOISE_SIZE + ix];
  const b = noiseGrid[iy * NOISE_SIZE + ix1];
  const c = noiseGrid[iy1 * NOISE_SIZE + ix];
  const d = noiseGrid[iy1 * NOISE_SIZE + ix1];
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}
let noiseTime = 0;

// ─── Particles ──────────────────────────────────────────
class Particle {
  constructor(x, y, burst) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.vx = 0;
    this.vy = 0;
    this.life = burst ? 60 + Math.random() * 60 : Infinity;
    this.maxLife = this.life;
    this.speed = 0.5 + Math.random() * 1.5;
    this.size = 0.5 + Math.random() * 1.5;
    this.hueOffset = Math.random();
    this.trail = [];
    this.maxTrail = 8 + Math.floor(Math.random() * 12);
  }
  update() {
    if (this.life !== Infinity) this.life--;
    const colors = PALETTES[PAL_NAMES[palette]];
    const col = colors[Math.floor(this.hueOffset * (colors.length - 1))];
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.maxTrail) this.trail.shift();

    const scale = 0.003;
    let angle;
    if (mode === 0) { // flow
      const n = smoothNoise(this.x * scale + noiseTime, this.y * scale + noiseTime * 0.7) * Math.PI * 4;
      angle = n;
    } else if (mode === 1) { // orbit
      const cx = W / 2, cy = H / 2;
      const dx = this.x - cx, dy = this.y - cy;
      const dist = Math.sqrt(dx * dx + dy * dy) + 0.001;
      angle = Math.atan2(dy, dx) + Math.PI * 0.5 + Math.sin(dist * 0.01 - noiseTime * 2) * 0.5;
    } else { // wave
      angle = Math.sin(this.x * 0.01 + noiseTime * 3) * Math.PI;
      angle += Math.cos(this.y * 0.01 + noiseTime * 2) * Math.PI * 0.5;
    }

    let fx = Math.cos(angle) * this.speed;
    let fy = Math.sin(angle) * this.speed;

    // mouse influence
    if (mouse.active) {
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 1;
      if (dist < 200) {
        const force = (1 - dist / 200) * 2;
        fx += (dx / dist) * force;
        fy += (dy / dist) * force;
      }
    }

    // click burst
    if (mouse.click > 0) {
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 1;
      if (dist < 300) {
        const force = (1 - dist / 300) * mouse.click * 0.3;
        fx += (dx / dist) * force;
        fy += (dy / dist) * force;
      }
    }

    this.vx += (fx - this.vx) * 0.1;
    this.vy += (fy - this.vy) * 0.1;
    this.x += this.vx;
    this.y += this.vy;

    // wrap
    if (this.x < 0) this.x += W;
    if (this.x > W) this.x -= W;
    if (this.y < 0) this.y += H;
    if (this.y > H) this.y -= H;

    return this.life > 0;
  }
  draw() {
    const colors = PALETTES[PAL_NAMES[palette]];
    const col = colors[Math.floor(this.hueOffset * (colors.length - 1))];
    const alpha = this.life === Infinity ? 0.6 : 0.6 * (this.life / this.maxLife);

    // draw trail
    if (this.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.strokeStyle = col;
      ctx.globalAlpha = alpha * 0.3;
      ctx.lineWidth = this.size * 0.5;
      ctx.stroke();
    }

    // draw head
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.globalAlpha = alpha;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

const MAX_PARTICLES = 2000;
let particles = [];
function initParticles() {
  particles = [];
  for (let i = 0; i < 1500; i++) {
    particles.push(new Particle());
  }
}

// ─── Background fade ────────────────────────────────────
let bgAlpha = 0.05;

// ─── Main loop ──────────────────────────────────────────
let lastTime = performance.now();
function loop() {
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  noiseTime += dt * 0.3;

  // fade
  ctx.fillStyle = `rgba(10, 10, 15, ${bgAlpha})`;
  ctx.fillRect(0, 0, W, H);

  // update
  particles = particles.filter(p => p.update());

  // maintain count
  while (particles.length < 1500) {
    particles.push(new Particle());
  }
  if (particles.length > MAX_PARTICLES) {
    particles = particles.slice(0, MAX_PARTICLES);
  }

  // draw
  for (const p of particles) p.draw();

  // click decay
  if (mouse.click > 0) mouse.click -= dt * 3;

  // stats
  document.getElementById('pcount').textContent = particles.length;
  const MODES = ['flow', 'orbit', 'wave'];
  document.getElementById('pmode').textContent = MODES[mode];
  document.getElementById('ppal').textContent = PAL_NAMES[palette];

  requestAnimationFrame(loop);
}

// ─── Controls ───────────────────────────────────────────
function resetField() {
  initNoise();
  initParticles();
  ctx.fillStyle = 'rgba(10, 10, 15, 1)';
  ctx.fillRect(0, 0, W, H);
}
function toggleMode() {
  mode = (mode + 1) % 3;
  const MODES = ['flow', 'orbit', 'wave'];
  document.getElementById('pmode').textContent = MODES[mode];
  // clear for visual feedback
  ctx.fillStyle = 'rgba(10, 10, 15, 0.3)';
  ctx.fillRect(0, 0, W, H);
}
function changePalette() {
  palette = (palette + 1) % PAL_NAMES.length;
  document.getElementById('ppal').textContent = PAL_NAMES[palette];
  ctx.fillStyle = 'rgba(10, 10, 15, 0.3)';
  ctx.fillRect(0, 0, W, H);
}

// ─── Init ───────────────────────────────────────────────
initNoise();
initParticles();
ctx.fillStyle = 'rgba(10, 10, 15, 1)';
ctx.fillRect(0, 0, W, H);
loop();
</script>
</body>
</html>
