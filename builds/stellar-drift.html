<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar Drift — Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #888;
    height: 100vh;
    cursor: crosshair;
  }
  canvas { display: block; }
  #info {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.6;
  }
  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 10;
  }
  #controls button {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    color: #aaa;
    padding: 8px 18px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.3s;
    border-radius: 2px;
  }
  #controls button:hover {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border-color: rgba(255,255,255,0.4);
  }
  #palette-info {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 11px;
    letter-spacing: 1px;
    opacity: 0.4;
    text-align: right;
  }
</style>
</head>
<body>
<div id="info">STELLAR DRIFT — move your cursor · click to warp · space to pause</div>
<div id="palette-info"></div>
<div id="controls">
  <button onclick="changePalette()">◈ PALETTE</button>
  <button onclick="resetCanvas()">↺ RESET</button>
  <button onclick="toggleMode()">✦ MODE</button>
</div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let particles = [];
let paused = false;
let mouse = { x: -1000, y: -1000, active: false };
let frame = 0;
let flowMode = 0;

const PALETTES = [
  { name: 'Nebula', colors: ['#ff6b9d', '#c44dff', '#4d7dff', '#1a0533', '#ff2d95', '#7b2fff'], bg: '#0a0014' },
  { name: 'Aurora', colors: ['#00ffc8', '#00a8ff', '#7b2fff', '#00ff88', '#0088ff', '#1a2a3a'], bg: '#020a0f' },
  { name: 'Ember', colors: ['#ff4400', '#ff8800', '#ffcc00', '#ff2200', '#ff6600', '#1a0500'], bg: '#0f0800' },
  { name: 'Ocean', colors: ['#0077be', '#00a8e8', '#00e5ff', '#0055aa', '#40c8f0', '#000a1a'], bg: '#00050f' },
  { name: 'Forest', colors: ['#00cc66', '#22ff88', '#55cc44', '#008833', '#88ffaa', '#001a05'], bg: '#000f05' },
  { name: 'Void', colors: ['#ffffff', '#aaaacc', '#666688', '#ccccdd', '#444466', '#111122'], bg: '#050508' },
  { name: 'Sunset', colors: ['#ff6b35', '#f7c59f', '#efefd0', '#ff006e', '#fb5607', '#1a0a02'], bg: '#0f0502' },
];

let palette = PALETTES[0];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', () => { resize(); resetCanvas(); });
resize();

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = 0;
    this.vy = 0;
    this.life = Math.random() * 300 + 100;
    this.maxLife = this.life;
    this.color = palette.colors[Math.floor(Math.random() * palette.colors.length)];
    this.size = Math.random() * 2.5 + 0.5;
    this.baseSpeed = Math.random() * 1.5 + 0.5;
  }
  update() {
    const t = frame * 0.003;
    
    // Multi-octave noise-like flow field
    let fx = Math.sin(this.x * 0.003 + t) * Math.cos(this.y * 0.005 + t * 0.7);
    let fy = Math.cos(this.x * 0.004 - t * 0.8) * Math.sin(this.y * 0.003 + t * 0.5);
    
    if (flowMode === 1) {
      fx += Math.sin(this.y * 0.01 + t * 2) * 0.5;
      fy += Math.cos(this.x * 0.01 - t * 1.5) * 0.5;
    } else if (flowMode === 2) {
      const dx = this.x - W / 2;
      const dy = this.y - H / 2;
      const d = Math.sqrt(dx * dx + dy * dy) + 1;
      fx += (dy / d) * Math.sin(d * 0.01 - t * 3);
      fy += (-dx / d) * Math.cos(d * 0.01 - t * 3);
    }
    
    // Mouse interaction
    if (mouse.active) {
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 1;
      const force = Math.min(200 / dist, 3);
      fx += (dx / dist) * force * 0.05;
      fy += (dy / dist) * force * 0.05;
    }
    
    this.vx += fx * 0.15;
    this.vy += fy * 0.15;
    this.vx *= 0.96;
    this.vy *= 0.96;
    
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    const maxSpeed = this.baseSpeed * 4;
    if (speed > maxSpeed) {
      this.vx = (this.vx / speed) * maxSpeed;
      this.vy = (this.vy / speed) * maxSpeed;
    }
    
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    
    // Wrap
    if (this.x < 0) this.x = W;
    if (this.x > W) this.x = 0;
    if (this.y < 0) this.y = H;
    if (this.y > H) this.y = 0;
    
    if (this.life <= 0 || speed < 0.01) this.reset();
  }
  draw() {
    const alpha = (this.life / this.maxLife) * 0.8;
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    const len = Math.min(speed * 6, 20);
    const angle = Math.atan2(this.vy, this.vx);
    
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(angle);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.size;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-len * 0.5, 0);
    ctx.lineTo(len * 0.5, 0);
    ctx.stroke();
    
    // Glow
    if (speed > 1.5) {
      ctx.globalAlpha = alpha * 0.3;
      ctx.lineWidth = this.size * 3;
      ctx.beginPath();
      ctx.moveTo(-len * 0.5, 0);
      ctx.lineTo(len * 0.5, 0);
      ctx.stroke();
    }
    
    ctx.restore();
  }
}

function initParticles(count = 1500) {
  particles = [];
  for (let i = 0; i < count; i++) {
    particles.push(new Particle());
  }
}

function drawBackground() {
  ctx.fillStyle = palette.bg;
  ctx.globalAlpha = 0.08;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
}

let warpActive = false;
let warpFrames = 0;

function warp() {
  warpActive = true;
  warpFrames = 30;
  particles.forEach(p => {
    const dx = p.x - W / 2;
    const dy = p.y - H / 2;
    const d = Math.sqrt(dx * dx + dy * dy) + 1;
    p.vx += (dx / d) * 8;
    p.vy += (dy / d) * 8;
    p.color = palette.colors[Math.floor(Math.random() * palette.colors.length)];
  });
}

function animate() {
  if (!paused) {
    if (warpActive) {
      warpFrames--;
      if (warpFrames <= 0) warpActive = false;
    }
    
    drawBackground();
    particles.forEach(p => { p.update(); p.draw(); });
    frame++;
  }
  requestAnimationFrame(animate);
}

// Input
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => { mouse.active = false; });
canvas.addEventListener('click', warp);
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
}, { passive: false });
canvas.addEventListener('touchend', () => { mouse.active = false; });
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); paused = !paused; }
  if (e.key >= '1' && key <= '7') { palette = PALETTES[parseInt(e.key) - 1]; updatePaletteInfo(); }
});

// Controls
function changePalette() {
  const idx = PALETTES.indexOf(palette);
  palette = PALETTES[(idx + 1) % PALETTES.length];
  particles.forEach(p => {
    if (Math.random() < 0.3) p.color = palette.colors[Math.floor(Math.random() * palette.colors.length)];
  });
  updatePaletteInfo();
}
function resetCanvas() {
  ctx.fillStyle = palette.bg;
  ctx.globalAlpha = 1;
  ctx.fillRect(0, 0, W, H);
  initParticles(1500);
}
function toggleMode() {
  flowMode = (flowMode + 1) % 3;
  const modes = ['Flow', 'Turbulence', 'Vortex'];
  document.getElementById('info').textContent = `STELLAR DRIFT — ${modes[flowMode]} · move cursor · click to warp · space to pause`;
}
function updatePaletteInfo() {
  document.getElementById('palette-info').innerHTML = `◈ ${palette.name}<br><span style="display:inline-block;width:8px;height:8px;background:${palette.colors[0]};margin:0 1px"></span>${palette.colors.map(c => `<span style="display:inline-block;width:8px;height:8px;background:${c};margin:0 1px"></span>`).join('')}`;
}

// Init
ctx.fillStyle = palette.bg;
ctx.fillRect(0, 0, W, H);
initParticles(1500);
updatePaletteInfo();
animate();
</script>
</body>
</html>
