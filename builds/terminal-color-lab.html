<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Color Lab</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg: #1a1a2e;
    --surface: #222240;
    --surface2: #2a2a4a;
    --text: #e0e0e0;
    --muted: #8888aa;
    --accent: #7c5cfc;
    --accent2: #5cfc8a;
    --border: #333355;
    --radius: 8px;
  }
  
  body {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }
  
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 4px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .subtitle {
    color: var(--muted);
    font-size: 0.8rem;
    margin-bottom: 20px;
  }
  
  .container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  
  @media (max-width: 900px) {
    .container { grid-template-columns: 1fr; }
  }
  
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  
  .panel-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 12px;
    font-weight: 600;
  }
  
  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  
  .preset-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.72rem;
    font-family: inherit;
    transition: all 0.15s;
  }
  
  .preset-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  
  .preset-btn.active {
    border-color: var(--accent);
    background: rgba(124, 92, 252, 0.15);
    color: var(--accent);
  }
  
  .color-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  
  .color-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px;
    border-radius: 4px;
    background: var(--surface2);
  }
  
  .color-row label {
    font-size: 0.7rem;
    color: var(--muted);
    width: 50px;
    flex-shrink: 0;
  }
  
  .color-row input[type="color"] {
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    padding: 0;
    background: none;
    flex-shrink: 0;
  }
  
  .color-row input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.72rem;
    width: 80px;
    flex-shrink: 0;
  }
  
  .color-row .hex-display {
    font-size: 0.7rem;
    color: var(--muted);
    width: 60px;
    flex-shrink: 0;
  }
  
  /* Terminal Preview */
  .terminal {
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  
  .terminal-bar {
    background: #111;
    padding: 8px 12px;
    display: flex;
    gap: 6px;
    align-items: center;
    border-bottom: 1px solid #333;
  }
  
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.red { background: #ff5f57; }
  .dot.yellow { background: #febc2e; }
  .dot.green { background: #28c840; }
  
  .terminal-title {
    flex: 1;
    text-align: center;
    font-size: 0.7rem;
    color: #666;
  }
  
  .terminal-body {
    padding: 14px;
    font-size: 0.78rem;
    line-height: 1.7;
    min-height: 380px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  
  .prompt { font-weight: 600; }
  
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  
  .action-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.72rem;
    font-family: inherit;
    transition: all 0.15s;
  }
  
  .action-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  
  .action-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  
  .action-btn.primary:hover {
    background: #9168ff;
  }
  
  .action-btn.success {
    background: var(--accent2);
    border-color: var(--accent2);
    color: #000;
    font-weight: 600;
  }
  
  .action-btn.success:hover {
    background: #7dff9a;
  }
  
  .section {
    margin-bottom: 16px;
  }
  
  .section-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
  }
  
  .saved-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 120px;
    overflow-y: auto;
  }
  
  .saved-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 0.72rem;
  }
  
  .saved-item button {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    padding: 0 4px;
  }
  
  .saved-item button:hover { color: #ff5f57; }
  
  .export-area {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    font-size: 0.65rem;
    color: var(--muted);
    font-family: inherit;
    width: 100%;
    resize: vertical;
    min-height: 60px;
  }
  
  .copy-msg {
    color: var(--accent2);
    font-size: 0.7rem;
    margin-top: 4px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  
  .copy-msg.show { opacity: 1; }
  
  .name-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.72rem;
    width: 100%;
    margin-bottom: 6px;
  }
  
  .name-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  
  .stats {
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 6px;
  }
</style>
</head>
<body>
  <h1>◈ Terminal Color Lab</h1>
  <p class="subtitle">Design ANSI terminal color schemes — live preview, presets, save & export</p>
  
  <div class="container">
    <div class="left-col">
      <!-- Presets -->
      <div class="panel">
        <div class="panel-title">Presets</div>
        <div class="presets" id="presets"></div>
      </div>
      
      <!-- Base Colors -->
      <div class="panel">
        <div class="panel-title">Base Colors</div>
        <div class="color-grid" id="baseColors"></div>
      </div>
      
      <!-- ANSI Colors -->
      <div class="panel">
        <div class="panel-title">ANSI Colors (Normal + Bright)</div>
        <div class="color-grid" id="ansiColors"></div>
      </div>
      
      <!-- Save / Load -->
      <div class="panel">
        <div class="panel-title">Save / Load</div>
        <input type="text" class="name-input" id="schemeName" placeholder="Scheme name...">
        <div class="actions">
          <button class="action-btn success" onclick="saveScheme()">Save</button>
          <button class="action-btn" onclick="exportScheme()">Export JSON</button>
          <button class="action-btn" onclick="document.getElementById('importFile').click()">Import</button>
          <input type="file" id="importFile" accept=".json" style="display:none" onchange="importScheme(event)">
        </div>
        <div class="saved-list" id="savedList" style="margin-top:10px"></div>
      </div>
    </div>
    
    <div class="right-col">
      <!-- Terminal Preview -->
      <div class="panel">
        <div class="panel-title">Preview</div>
        <div class="terminal">
          <div class="terminal-bar">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <div class="terminal-title">guest@devbox: ~</div>
          </div>
          <div class="terminal-body" id="terminal"></div>
        </div>
      </div>
      
      <!-- Export -->
      <div class="panel" style="margin-top:16px">
        <div class="panel-title">Export as CSS</div>
        <textarea class="export-area" id="cssExport" readonly></textarea>
        <button class="action-btn" style="margin-top:6px" onclick="copyCSS()">Copy CSS</button>
        <div class="copy-msg" id="copyMsg">Copied!</div>
        <div class="stats" id="contrastStats"></div>
      </div>
    </div>
  </div>

<script>
// ─── Data ───────────────────────────────────────────────────────────
const PRESETS = {
  'Dracula': {
    bg: '#282a36', fg: '#f8f8f2',
    ansi: ['#44475a','#ff5555','#50fa7b','#f1fa8c','#6272a4','#bd93f9','#8be9fd','#f8f8f2',
           '#6272a4','#ff6e6e','#69ff94','#ffffa5','#8aa9f1','#c792ea','#9ee9ff','#ffffff']
  },
  'Monokai': {
    bg: '#272822', fg: '#f8f8f2',
    ansi: ['#3e3d32','#f92672','#a6e22e','#e6db74','#66d9ef','#ae81ff','#66d9ef','#f8f8f2',
           '#75715e','#fd971f','#a6e22e','#e6db74','#66d9ef','#ae81ff','#66d9ef','#f9f8f5']
  },
  'Nord': {
    bg: '#2e3440', fg: '#d8dee9',
    ansi: ['#3b4252','#bf616a','#a3be8c','#ebcb8b','#5e81ac','#b48ead','#88c0d0','#eceff4',
           '#4c566a','#bf616a','#a3be8c','#ebcb8b','#5e81ac','#b48ead','#8fbcbb','#eceff4']
  },
  'Solarized Dark': {
    bg: '#002b36', fg: '#839496',
    ansi: ['#073642','#dc322f','#859900','#b58900','#268bd2','#d33682','#2aa198','#eee8d5',
           '#586e75','#cb4b16','#859900','#b58900','#268bd2','#d33682','#2aa198','#fdf6e3']
  },
  'One Dark': {
    bg: '#282c34', fg: '#abb2bf',
    ansi: ['#3e4451','#e06c75','#98c379','#e5c07b','#61afef','#c678dd','#56b6c2','#abb2bf',
           '#4f5666','#e06c75','#98c379','#e5c07b','#61afef','#c678dd','#56b6c2','#ffffff']
  },
  'Tokyo Night': {
    bg: '#1a1b26', fg: '#c0caf5',
    ansi: ['#414868','#f7768e','#9ece6a','#e0af68','#7aa2f7','#bb9af7','#7dcfff','#c0caf5',
           '#565f89','#ff9e64','#9ece6a','#e0af68','#7aa2f7','#bb9af7','#7dcfff','#c9cbff']
  },
  'Catppuccin': {
    bg: '#1e1e2e', fg: '#cdd6f4',
    ansi: ['#45475a','#f38ba8','#a6e3a1','#f9e2af','#89b4fa','#cba6f7','#94e2d5','#bac2de',
           '#585b70','#fab387','#a6e3a1','#f9e2af','#89b4fa','#cba6f7','#94e2d5','#a6adc8']
  },
  'Gruvbox': {
    bg: '#282828', fg: '#ebdbb2',
    ansi: ['#282828','#fb4934','#b8bb26','#fabd2f','#83a598','#d3869b','#8ec07c','#ebdbb2',
           '#928374','#fb4934','#b8bb26','#fabd2f','#83a598','#d3869b','#8ec07c','#fbf1c7']
  }
};

const BASE_LABELS = ['Background', 'Foreground'];
const ANSI_LABELS = ['Black', 'Red', 'Green', 'Yellow', 'Blue', 'Magenta', 'Cyan', 'White',
                     'Bright Black', 'Bright Red', 'Bright Green', 'Bright Yellow',
                     'Bright Blue', 'Bright Magenta', 'Bright Cyan', 'Bright White'];

let current = JSON.parse(JSON.stringify(PRESETS['Dracula']));
let savedSchemes = JSON.parse(localStorage.getItem('termLabSchemes') || '[]');
let activePreset = 'Dracula';

// ─── Helpers ────────────────────────────────────────────────────────
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function luminance(hex) {
  const {r,g,b} = hexToRgb(hex);
  return (0.299*r + 0.587*g + 0.114*b) / 255;
}

function contrastRatio(hex1, hex2) {
  const l1 = luminance(hex1);
  const l2 = luminance(hex2);
  const lighter = Math.max(l1, l2);
  const darker = Math.min(l1, l2);
  return (lighter + 0.05) / (darker + 0.05);
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── Build UI ───────────────────────────────────────────────────────
function buildPresets() {
  const el = document.getElementById('presets');
  el.innerHTML = '';
  for (const name of Object.keys(PRESETS)) {
    const btn = document.createElement('button');
    btn.className = 'preset-btn' + (name === activePreset ? ' active' : '');
    btn.textContent = name;
    btn.onclick = () => loadPreset(name);
    el.appendChild(btn);
  }
}

function buildBaseColors() {
  const el = document.getElementById('baseColors');
  el.innerHTML = '';
  BASE_LABELS.forEach((label, i) => {
    const key = i === 0 ? 'bg' : 'fg';
    const row = document.createElement('div');
    row.className = 'color-row';
    row.innerHTML = `
      <label>${label}</label>
      <input type="color" value="${current[key]}" data-key="${key}" data-idx="${i}">
      <input type="text" value="${current[key]}" data-key="${key}" data-idx="${i}" maxlength="7">
      <span class="hex-display"></span>
    `;
    el.appendChild(row);
  });
  
  el.querySelectorAll('input[type="color"]').forEach(inp => {
    inp.addEventListener('input', e => {
      const key = e.target.dataset.key;
      const idx = parseInt(e.target.dataset.idx);
      current[key] = e.target.value;
      syncRow(key, idx);
      update();
    });
  });
  
  el.querySelectorAll('input[type="text"]').forEach(inp => {
    inp.addEventListener('change', e => {
      const key = e.target.dataset.key;
      let val = e.target.value.trim();
      if (!val.startsWith('#')) val = '#' + val;
      if (/^#[0-9a-fA-F]{6}$/.test(val)) {
        current[key] = val.toLowerCase();
        syncRow(key, parseInt(e.target.dataset.idx));
        update();
      } else {
        e.target.value = current[key];
      }
    });
  });
}

function buildAnsiColors() {
  const el = document.getElementById('ansiColors');
  el.innerHTML = '';
  ANSI_LABELS.forEach((label, i) => {
    const row = document.createElement('div');
    row.className = 'color-row';
    row.innerHTML = `
      <label>${label}</label>
      <input type="color" value="${current.ansi[i]}" data-key="ansi" data-idx="${i}">
      <input type="text" value="${current.ansi[i]}" data-key="ansi" data-idx="${i}" maxlength="7">
      <span class="hex-display"></span>
    `;
    el.appendChild(row);
  });
  
  el.querySelectorAll('input[type="color"]').forEach(inp => {
    inp.addEventListener('input', e => {
      const idx = parseInt(e.target.dataset.idx);
      current.ansi[idx] = e.target.value;
      syncRow('ansi', idx);
      update();
    });
  });
  
  el.querySelectorAll('input[type="text"]').forEach(inp => {
    inp.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx);
      let val = e.target.value.trim();
      if (!val.startsWith('#')) val = '#' + val;
      if (/^#[0-9a-fA-F]{6}$/.test(val)) {
        current.ansi[idx] = val.toLowerCase();
        syncRow('ansi', idx);
        update();
      } else {
        e.target.value = current.ansi[idx];
      }
    });
  });
}

function syncRow(key, idx) {
  const val = key === 'ansi' ? current.ansi[idx] : current[key];
  const container = key === 'ansi' ? document.getElementById('ansiColors') : document.getElementById('baseColors');
  const rows = container.querySelectorAll('.color-row');
  const row = rows[idx];
  if (!row) return;
  row.querySelector('input[type="color"]').value = val;
  row.querySelector('input[type="text"]').value = val;
  row.querySelector('.hex-display').textContent = val.toUpperCase();
}

// ─── Preview ────────────────────────────────────────────────────────
const PREVIEW_LINES = [
  { text: '$ ssh devbox', prompt: true },
  { text: 'Welcome to Ubuntu 22.04 LTS (GNU/Linux 5.15.0-91-generic x86_64)', style: 'muted' },
  { text: '', prompt: false },
  { text: '$ ls -la /var/log', prompt: true },
  { text: 'drwxr-xr-x  2 root root  4096 Aug 10 12:00 .', style: 'normal' },
  { text: 'drwxr-xr-x 94 root root 4096 Aug 10 12:00 ..', style: 'dim' },
  { text: '-rw-r--r--  1 root root 284K Aug 10 syslog', style: 'normal' },
  { text: '-rw-r--r--  1 root root  12K Aug 10 auth.log', style: 'cyan' },
  { text: '-rw-r--r--  1 root root 4.1K Aug 10 dmesg', style: 'cyan' },
  { text: '', prompt: false },
  { text: '$ cat app.js | head -5', prompt: true },
  { text: '  const express = require("express");', style: 'magenta' },
  { text: '  const app = express();', style: 'magenta' },
  { text: '  const PORT = process.env.PORT || 3000;', style: 'green' },
  { text: '', prompt: false },
  { text: '$ npm start', prompt: true },
  { text: '  > server starting on http://localhost:3000', style: 'yellow' },
  { text: '  ✓ database connected', style: 'green' },
  { text: '  ✓ redis cache ready', style: 'green' },
  { text: '  ✓ listening for requests', style: 'green' },
  { text: '', prompt: false },
  { text: '$ curl -s http://localhost:3000/api/status', prompt: true },
  { text: '  {"status":"ok","uptime":"4d 12h","memory":"128MB"}', style: 'cyan' },
  { text: '', prompt: false },
  { text: '$ echo "build complete ✓"', prompt: true },
  { text: '  build complete ✓', style: 'bold-green' },
];

function ansiToHtml(text, ansiIdx) {
  if (ansiIdx === null || ansiIdx === undefined) return escapeHtml(text);
  const color = current.ansi[ansiIdx] || current.fg;
  return `<span style="color:${color}">${escapeHtml(text)}</span>`;
}

function renderPreview() {
  const el = document.getElementById('terminal');
  el.style.background = current.bg;
  el.style.color = current.fg;
  
  const bgR = parseInt(current.bg.slice(1,3),16);
  const bgG = parseInt(current.bg.slice(3,5),16);
  const bgB = parseInt(current.bg.slice(5,7),16);
  const bgLum = (0.299*bgR + 0.587*bgG + 0.114*bgB) / 255;
  
  let html = '';
  PREVIEW_LINES.forEach(line => {
    let rendered = '';
    if (line.style === 'muted') {
      rendered = `<span style="color:${current.ansi[8]};opacity:0.8">${ansiToHtml(line.text)}</span>`;
    } else if (line.style === 'dim') {
      rendered = ansiToHtml(line.text, 8);
    } else if (line.style === 'cyan') {
      rendered = ansiToHtml(line.text, 14);
    } else if (line.style === 'magenta') {
      rendered = ansiToHtml(line.text, 13);
    } else if (line.style === 'green') {
      rendered = ansiToHtml(line.text, 10);
    } else if (line.style === 'yellow') {
      rendered = ansiToHtml(line.text, 11);
    } else if (line.style === 'bold-green') {
      rendered = `<span style="color:${current.ansi[10]};font-weight:700">${ansiToHtml(line.text)}</span>`;
    } else if (line.style === 'normal') {
      rendered = ansiToHtml(line.text, 7);
    } else {
      rendered = ansiToHtml(line.text, null);
    }
    
    if (line.prompt) {
      const promptColor = current.ansi[10] || '#50fa7b';
      rendered = `<span style="color:${promptColor};font-weight:700">$ </span>` + rendered;
    }
    
    html += rendered + '\n';
  });
  
  el.innerHTML = html;
}

// ─── CSS Export ─────────────────────────────────────────────────────
function updateCSSExport() {
  const el = document.getElementById('cssExport');
  let css = `:root {\n  --term-bg: ${current.bg};\n  --term-fg: ${current.fg};\n`;
  ANSI_LABELS.forEach((label, i) => {
    const slug = label.toLowerCase().replace(/\s+/g, '-');
    css += `  --term-${slug}: ${current.ansi[i]};\n`;
  });
  css += `}`;
  el.value = css;
}

function updateContrastStats() {
  const ratio = contrastRatio(current.fg, current.bg);
  const wcagAA = ratio >= 4.5 ? '✓ AA' : '✗ AA';
  const wcagAAA = ratio >= 7 ? '✓ AAA' : '✗ AAA';
  document.getElementById('contrastStats').textContent = 
    `Contrast ratio: ${ratio.toFixed(2)}:1  WCAG AA: ${wcagAA}  WCAG AAA: ${wcagAAA}`;
}

// ─── Presets ────────────────────────────────────────────────────────
function loadPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  current.bg = p.bg;
  current.fg = p.fg;
  current.ansi = [...p.ansi];
  activePreset = name;
  syncAll();
  update();
}

// ─── Save / Load / Export / Import ──────────────────────────────────
function saveScheme() {
  const name = document.getElementById('schemeName').value.trim() || `Scheme ${savedSchemes.length + 1}`;
  savedSchemes.push({
    name,
    data: JSON.parse(JSON.stringify(current)),
    date: new Date().toISOString().split('T')[0]
  });
  localStorage.setItem('termLabSchemes', JSON.stringify(savedSchemes));
  document.getElementById('schemeName').value = '';
  renderSaved();
}

function loadSavedScheme(idx) {
  const scheme = savedSchemes[idx];
  current.bg = scheme.data.bg;
  current.fg = scheme.data.fg;
  current.ansi = [...scheme.data.ansi];
  activePreset = null;
  syncAll();
  update();
}

function deleteSavedScheme(idx) {
  savedSchemes.splice(idx, 1);
  localStorage.setItem('termLabSchemes', JSON.stringify(savedSchemes));
  renderSaved();
}

function renderSaved() {
  const el = document.getElementById('savedList');
  if (savedSchemes.length === 0) {
    el.innerHTML = '<div style="font-size:0.7rem;color:var(--muted);padding:4px">No saved schemes yet</div>';
    return;
  }
  el.innerHTML = savedSchemes.map((s, i) => `
    <div class="saved-item">
      <span>${escapeHtml(s.name)} <span style="color:var(--muted);font-size:0.65rem">(${s.date})</span></span>
      <span>
        <button onclick="loadSavedScheme(${i})" title="Load">◉</button>
        <button onclick="deleteSavedScheme(${i})" title="Delete">×</button>
      </span>
    </div>
  `).join('');
}

function exportScheme() {
  const data = JSON.stringify({ name: activePreset || 'custom', ...current }, null, 2);
  navigator.clipboard.writeText(data).then(() => {
    showCopyMsg();
  });
}

function importScheme(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.bg && data.fg && data.ansi) {
        current.bg = data.bg;
        current.fg = data.fg;
        current.ansi = [...data.ansi];
        activePreset = data.name || 'imported';
        syncAll();
        update();
      }
    } catch (err) {
      alert('Invalid scheme file');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function copyCSS() {
  const el = document.getElementById('cssExport');
  navigator.clipboard.writeText(el.value).then(() => showCopyMsg());
}

function showCopyMsg() {
  const msg = document.getElementById('copyMsg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 1500);
}

// ─── Main update ────────────────────────────────────────────────────
function syncAll() {
  buildPresets();
  buildBaseColors();
  buildAnsiColors();
}

function update() {
  renderPreview();
  updateCSSExport();
  updateContrastStats();
}

// ─── Init ───────────────────────────────────────────────────────────
buildPresets();
buildBaseColors();
buildAnsiColors();
renderSaved();
update();
</script>
</body>
</html>
