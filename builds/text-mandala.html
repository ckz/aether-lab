<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Mandala — Linguistic Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #0a0a0f;
    font-family: 'Courier New', 'Consolas', monospace;
    color: #ccc;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  .header {
    padding: 20px 30px;
    border-bottom: 1px solid rgba(123, 111, 255, 0.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  
  .title-group h1 {
    color: #fff;
    font-size: 18px;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: normal;
  }
  
  .title-group .subtitle {
    color: #555;
    font-size: 11px;
    letter-spacing: 2px;
    margin-top: 4px;
  }
  
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  
  .btn {
    background: rgba(123, 111, 255, 0.1);
    border: 1px solid rgba(123, 111, 255, 0.3);
    color: #aaf;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  
  .btn:hover {
    background: rgba(123, 111, 255, 0.25);
    border-color: rgba(123, 111, 255, 0.6);
    color: #fff;
  }
  
  .btn.active {
    background: rgba(123, 111, 255, 0.3);
    border-color: #7b6fff;
    color: #fff;
  }
  
  .btn-row {
    display: flex;
    gap: 4px;
  }
  
  .btn-sm {
    padding: 4px 10px;
    font-size: 10px;
  }
  
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    min-height: 0;
  }
  
  .panel {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  
  .panel-left {
    border-right: 1px solid rgba(123, 111, 255, 0.1);
  }
  
  .panel-label {
    color: #555;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  
  textarea {
    flex: 1;
    background: rgba(15, 15, 25, 0.6);
    border: 1px solid rgba(123, 111, 255, 0.15);
    border-radius: 8px;
    color: #aaf;
    padding: 14px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.7;
    resize: none;
    outline: none;
    min-height: 300px;
  }
  
  textarea:focus {
    border-color: rgba(123, 111, 255, 0.4);
  }
  
  textarea::placeholder {
    color: #333;
  }
  
  .canvas-wrap {
    flex: 1;
    background: rgba(15, 15, 25, 0.6);
    border: 1px solid rgba(123, 111, 255, 0.15);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    min-height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
  }
  
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 8px;
  }
  
  .stat {
    background: rgba(15, 15, 25, 0.6);
    border: 1px solid rgba(123, 111, 255, 0.1);
    border-radius: 6px;
    padding: 10px;
    text-align: center;
  }
  
  .stat-value {
    color: #7b6fff;
    font-size: 18px;
    font-weight: bold;
  }
  
  .stat-label {
    color: #555;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .slider-row label {
    color: #777;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    min-width: 80px;
  }
  
  .slider-row input[type="range"] {
    flex: 1;
    accent-color: #7b6fff;
    height: 4px;
  }
  
  .slider-row .val {
    color: #7b6fff;
    font-size: 11px;
    min-width: 30px;
    text-align: right;
  }
  
  .palette-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  
  .palette-swatch {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s;
  }
  
  .palette-swatch:hover, .palette-swatch.active {
    border-color: #fff;
    transform: scale(1.1);
  }
  
  .mode-label {
    color: #555;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  
  @media (max-width: 768px) {
    .main {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .panel-left {
      border-right: none;
      border-bottom: 1px solid rgba(123, 111, 255, 0.1);
    }
  }
</style>
</head>
<body>

<div class="header">
  <div class="title-group">
    <h1>✦ Text Mandala</h1>
    <div class="subtitle">Linguistic Generative Art</div>
  </div>
  <div class="controls">
    <div class="btn-row">
      <button class="btn active" data-mode="radial" onclick="setMode('radial')">Radial</button>
      <button class="btn" data-mode="spiral" onclick="setMode('spiral')">Spiral</button>
      <button class="btn" data-mode="wave" onclick="setMode('wave')">Wave</button>
      <button class="btn" data-mode="constellation" onclick="setMode('constellation')">Stars</button>
    </div>
    <button class="btn" onclick="savePNG()">⬇ Save PNG</button>
    <button class="btn" onclick="randomText()">⟳ Sample</button>
  </div>
</div>

<div class="main">
  <div class="panel panel-left">
    <div>
      <div class="panel-label">Input Text</div>
      <textarea id="textInput" placeholder="Type or paste any text here... poetry, code, prose, anything. The mandala will bloom from your words." spellcheck="false">In the beginning was the Word, and the Word was with God, and the Word was God. The same was in the beginning with God. All things were made by him; and without him was not any thing made that was made. In him was life; and the life was the light of men. And the light shineth in darkness; and the darkness comprehended it not.

There was a man sent from God, whose name was John. The same came for a witness, to bear witness of the Light, that all men through him might believe. He was not that Light, but was sent to bear witness of that Light.

That was the true Light, which lighteth every man that cometh into the world. He was in the world, and the world was made by him, and the world knew him not. He came unto his own, and his own received him not. But as many as received him, to them gave he power to become the sons of God, even to them that believe on his name.</textarea>
    </div>
    
    <div>
      <div class="panel-label">Statistics</div>
      <div class="stats">
        <div class="stat"><div class="stat-value" id="statChars">0</div><div class="stat-label">Chars</div></div>
        <div class="stat"><div class="stat-value" id="statWords">0</div><div class="stat-label">Words</div></div>
        <div class="stat"><div class="stat-value" id="statLines">0</div><div class="stat-label">Lines</div></div>
        <div class="stat"><div class="stat-value" id="statUnique">0</div><div class="stat-label">Unique</div></div>
        <div class="stat"><div class="stat-value" id="statEntropy">0</div><div class="stat-label">Entropy</div></div>
      </div>
    </div>
    
    <div>
      <div class="mode-label">Complexity</div>
      <div class="slider-row">
        <label>Density</label>
        <input type="range" id="density" min="1" max="10" value="5" oninput="updateVal('density')">
        <span class="val" id="densityVal">5</span>
      </div>
      <div class="slider-row">
        <label>Scale</label>
        <input type="range" id="scale" min="1" max="20" value="8" oninput="updateVal('scale')">
        <span class="val" id="scaleVal">8</span>
      </div>
      <div class="slider-row">
        <label>Symmetry</label>
        <input type="range" id="symmetry" min="2" max="24" value="8" oninput="updateVal('symmetry')">
        <span class="val" id="symmetryVal">8</span>
      </div>
    </div>
    
    <div>
      <div class="mode-label">Palette</div>
      <div class="palette-row" id="paletteRow"></div>
    </div>
  </div>
  
  <div class="panel">
    <div>
      <div class="panel-label">Mandala</div>
      <div class="canvas-wrap">
        <canvas id="canvas" width="800" height="800"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
// ─── State ───
let mode = 'radial';
let paletteIdx = 0;
let animId = null;
let time = 0;

const PALETTES = [
  { name: 'Cosmic', colors: ['#7b6fff', '#ff6b9d', '#c084fc', '#60a5fa', '#f472b6', '#a78bfa'] },
  { name: 'Aurora', colors: ['#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', '#14b8a6', '#6366f1'] },
  { name: 'Ember', colors: ['#ef4444', '#f97316', '#fbbf24', '#f59e0b', '#dc2626', '#ea580c'] },
  { name: 'Ocean', colors: ['#0ea5e9', '#06b6d4', '#14b8a6', '#3b82f6', '#6366f1', '#22d3ee'] },
  { name: 'Mono', colors: ['#fff', '#aaa', '#888', '#ccc', '#666', '#ddd'] },
  { name: 'Candy', colors: ['#ff6b9d', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6b9d', '#ffa8a8'] },
  { name: 'Void', colors: ['#1e1b4b', '#312e81', '#4338ca', '#6366f1', '#818cf8', '#a5b4fc'] },
  { name: 'Forest', colors: ['#166534', '#15803d', '#22c55e', '#4ade80', '#86efac', '#bbf7d0'] },
];

const SAMPLES = [
  "The rose is red, the violet's blue, the sugar's sweet and so are you.",
  "π = 3.14159265358979323846264338327950288419716939937510...",
  "function fibonacci(n) { return n < 1 ? 0 : n <= 2 ? 1 : fibonacci(n-1) + fibonacci(n-2); }",
  "To be or not to be, that is the question. Whether 'tis nobler in the mind to suffer the slings and arrows of outrageous fortune.",
  "All code is guilty until proven innocent. All tests are innocent until proven guilty.",
  "import random; print(''.join(random.choice('01') for _ in range(64)))",
  "In the middle of difficulty lies opportunity. — Albert Einstein",
  "git commit -m 'fix: everything is on fire' && git push --force-with-lease",
  "The best way to predict the future is to invent it. — Alan Kay",
  "console.log('Hello, World!'); // the traditional first breath",
];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const textInput = document.getElementById('textInput');

// ─── Palette ───
function buildPaletteRow() {
  const row = document.getElementById('paletteRow');
  row.innerHTML = '';
  PALETTES.forEach((p, i) => {
    const sw = document.createElement('div');
    sw.className = 'palette-swatch' + (i === paletteIdx ? ' active' : '');
    sw.style.background = `linear-gradient(135deg, ${p.colors[0]}, ${p.colors[2]}, ${p.colors[4]})`;
    sw.title = p.name;
    sw.onclick = () => { paletteIdx = i; buildPaletteRow(); };
    row.appendChild(sw);
  });
}

// ─── Helpers ───
function updateVal(id) {
  document.getElementById(id + 'Val').textContent = document.getElementById(id).value;
  draw();
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.btn-row .btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  draw();
}

function getText() {
  return textInput.value || 'Text Mandala';
}

function getCharValue(ch) {
  return ch.charCodeAt(0) / 255;
}

function getPalette() {
  return PALETTES[paletteIdx].colors;
}

function getColor(t, alpha = 1) {
  const colors = getPalette();
  const idx = Math.floor(((t % 1) + 1) % 1 * colors.length);
  const c = colors[idx % colors.length];
  // Parse hex to rgba
  const r = parseInt(c.slice(1, 3), 16);
  const g = parseInt(c.slice(3, 5), 16);
  const b = parseInt(c.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ─── Stats ───
function updateStats() {
  const text = getText();
  const chars = text.length;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const lines = text.split('\n').filter(l => l.trim()).length || 1;
  const unique = new Set(text.replace(/\s/g, '')).size;
  
  // Shannon entropy
  const freq = {};
  for (const ch of text.replace(/\s/g, '')) freq[ch] = (freq[ch] || 0) + 1;
  const total = Object.values(freq).reduce((a, b) => a + b, 0);
  let entropy = 0;
  for (const f of Object.values(freq)) {
    const p = f / total;
    entropy -= p * Math.log2(p);
  }
  
  document.getElementById('statChars').textContent = chars;
  document.getElementById('statWords').textContent = words;
  document.getElementById('statLines').textContent = lines;
  document.getElementById('statUnique').textContent = unique;
  document.getElementById('statEntropy').textContent = entropy.toFixed(2);
}

// ─── Drawing ───
function draw() {
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;
  const text = getText();
  const chars = text.replace(/\s/g, '').split('');
  const density = parseInt(document.getElementById('density').value);
  const scale = parseInt(document.getElementById('scale').value);
  const symmetry = parseInt(document.getElementById('symmetry').value);
  
  // Clear with fade
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, w, h);
  
  // Subtle radial vignette
  const vg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.7);
  vg.addColorStop(0, 'rgba(20,20,40,0.3)');
  vg.addColorStop(1, 'rgba(0,0,0,0.8)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, w, h);
  
  const baseRadius = Math.min(w, h) * 0.35;
  const t = time * 0.0005;
  
  if (mode === 'radial') {
    drawRadial(chars, cx, cy, baseRadius, density, scale, symmetry, t);
  } else if (mode === 'spiral') {
    drawSpiral(chars, cx, cy, baseRadius, density, scale, symmetry, t);
  } else if (mode === 'wave') {
    drawWave(chars, cx, cy, baseRadius, density, scale, t);
  } else if (mode === 'constellation') {
    drawConstellation(chars, cx, cy, baseRadius, density, scale, symmetry, t);
  }
}

function drawRadial(chars, cx, cy, baseRadius, density, scale, symmetry, t) {
  const step = Math.max(1, Math.floor(chars.length / (density * 20)));
  
  for (let ring = 0; ring < density * 3; ring++) {
    const r = baseRadius * (0.15 + (ring / (density * 3)) * 0.85);
    const count = symmetry * (2 + ring);
    
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2 + t * (ring % 2 === 0 ? 0.3 : -0.2);
      const charIdx = (ring * count + i) % chars.length;
      const ch = chars[charIdx] || '·';
      const val = getCharValue(ch);
      
      // Organic wobble
      const wobble = Math.sin(angle * 3 + t * 2 + ring) * 15;
      const x = cx + Math.cos(angle) * (r + wobble);
      const y = cy + Math.sin(angle) * (r + wobble);
      
      const size = 3 + val * scale * 1.5 + Math.sin(t + ring) * 1;
      const alpha = 0.4 + val * 0.5 + Math.sin(angle * 2 + t) * 0.15;
      
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle + Math.PI / 2);
      
      // Glow
      ctx.shadowBlur = size * 3;
      ctx.shadowColor = getColor(val, 0.6);
      ctx.fillStyle = getColor(val, Math.max(0.2, alpha));
      ctx.font = `${size.toFixed(1)}px 'Courier New', monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(ch, 0, 0);
      
      ctx.restore();
    }
  }
  
  // Center symbol
  const centerCh = chars[0] || '✦';
  ctx.save();
  ctx.shadowBlur = 30;
  ctx.shadowColor = getColor(0.5, 0.8);
  ctx.fillStyle = getColor(0.5, 0.9);
  ctx.font = `bold ${scale * 3}px 'Courier New', monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(centerCh, cx, cy);
  ctx.restore();
}

function drawSpiral(chars, cx, cy, baseRadius, density, scale, symmetry, t) {
  const totalPoints = chars.length * density;
  
  for (let i = 0; i < totalPoints; i++) {
    const progress = i / totalPoints;
    const angle = progress * Math.PI * 2 * symmetry + t;
    const r = baseRadius * 0.1 + progress * baseRadius * 0.9;
    
    // Spiral wobble
    const wobble = Math.sin(progress * 20 + t * 3) * 20 * (1 - progress * 0.5);
    const x = cx + Math.cos(angle) * (r + wobble);
    const y = cy + Math.sin(angle) * (r + wobble);
    
    const ch = chars[i % chars.length] || '·';
    const val = getCharValue(ch);
    const size = 2 + val * scale * 1.2;
    const alpha = 0.3 + progress * 0.5 + val * 0.2;
    
    ctx.save();
    ctx.shadowBlur = size * 2;
    ctx.shadowColor = getColor(val, 0.5);
    ctx.fillStyle = getColor(val, Math.max(0.2, alpha));
    ctx.font = `${size.toFixed(1)}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.translate(x, y);
    ctx.rotate(angle + Math.PI / 2);
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  }
  
  // Connection lines for nearby points
  ctx.strokeStyle = getColor(0.3, 0.08);
  ctx.lineWidth = 0.5;
  for (let i = 0; i < totalPoints; i += Math.floor(totalPoints / 60)) {
    const progress = i / totalPoints;
    const angle = progress * Math.PI * 2 * symmetry + t;
    const r = baseRadius * 0.1 + progress * baseRadius * 0.9;
    const wobble = Math.sin(progress * 20 + t * 3) * 20 * (1 - progress * 0.5);
    const x = cx + Math.cos(angle) * (r + wobble);
    const y = cy + Math.sin(angle) * (r + wobble);
    
    const nextProgress = (i + 1) / totalPoints;
    const nextAngle = nextProgress * Math.PI * 2 * symmetry + t;
    const nextR = baseRadius * 0.1 + nextProgress * baseRadius * 0.9;
    const nextWobble = Math.sin(nextProgress * 20 + t * 3) * 20 * (1 - nextProgress * 0.5);
    const nx = cx + Math.cos(nextAngle) * (nextR + nextWobble);
    const ny = cy + Math.sin(nextAngle) * (nextR + nextWobble);
    
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(nx, ny);
    ctx.stroke();
  }
}

function drawWave(chars, cx, cy, baseRadius, density, scale, symmetry, t) {
  const cols = symmetry * 3;
  const rows = density * 4;
  const spacingX = (baseRadius * 1.8) / cols;
  const spacingY = (baseRadius * 1.8) / rows;
  
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const idx = row * cols + col;
      const ch = chars[idx % chars.length] || '·';
      const val = getCharValue(ch);
      
      const baseX = cx - baseRadius * 0.9 + col * spacingX;
      const baseY = cy - baseRadius * 0.9 + row * spacingY;
      
      // Multi-octave wave displacement
      const wave1 = Math.sin(col * 0.4 + t * 2 + row * 0.2) * 15;
      const wave2 = Math.cos(row * 0.3 + t * 1.5) * 10;
      const wave3 = Math.sin((col + row) * 0.2 + t) * 8;
      
      const x = baseX + wave1 + wave3;
      const y = baseY + wave2 + wave3;
      
      const size = 2 + val * scale * 0.8;
      const alpha = 0.25 + val * 0.45 + Math.sin(col * 0.5 + t) * 0.1;
      
      // Connect to neighbors
      if (col > 0) {
        const prevVal = getCharValue(chars[(idx - 1) % chars.length] || '·');
        ctx.strokeStyle = getColor((val + prevVal) / 2, 0.06);
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        const prevX = cx - baseRadius * 0.9 + (col - 1) * spacingX + Math.sin((col-1) * 0.4 + t * 2 + row * 0.2) * 15 + Math.sin(((col-1) + row) * 0.2 + t) * 8;
        const prevY = cy - baseRadius * 0.9 + row * spacingY + Math.cos(row * 0.3 + t * 1.5) * 10 + Math.sin(((col-1) + row) * 0.2 + t) * 8;
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(x, y);
        ctx.stroke();
      }
      
      ctx.save();
      ctx.shadowBlur = size * 2;
      ctx.shadowColor = getColor(val, 0.4);
      ctx.fillStyle = getColor(val, Math.max(0.15, alpha));
      ctx.font = `${size.toFixed(1)}px 'Courier New', monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(ch, x, y);
      ctx.restore();
    }
  }
}

function drawConstellation(chars, cx, cy, baseRadius, density, scale, symmetry, t) {
  // Generate star positions based on text
  const starCount = Math.min(chars.length * density, 600);
  const stars = [];
  
  for (let i = 0; i < starCount; i++) {
    const ch = chars[i % chars.length];
    const val = getCharValue(ch);
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * baseRadius * 0.9;
    
    stars.push({
      x: cx + Math.cos(angle) * dist,
      y: cy + Math.sin(angle) * dist,
      ch: ch,
      val: val,
      size: 1 + val * scale * 0.8,
      twinkle: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.5 + Math.random() * 2,
    });
  }
  
  // Draw constellation lines between nearby stars
  const connectionDist = baseRadius * 0.25;
  ctx.lineWidth = 0.5;
  for (let i = 0; i < stars.length; i++) {
    for (let j = i + 1; j < stars.length; j++) {
      const dx = stars[i].x - stars[j].x;
      const dy = stars[i].y - stars[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < connectionDist) {
        const alpha = (1 - dist / connectionDist) * 0.15;
        ctx.strokeStyle = getColor((stars[i].val + stars[j].val) / 2, alpha);
        ctx.beginPath();
        ctx.moveTo(stars[i].x, stars[i].y);
        ctx.lineTo(stars[j].x, stars[j].y);
        ctx.stroke();
      }
    }
  }
  
  // Draw stars
  for (const star of stars) {
    const twinkle = 0.5 + 0.5 * Math.sin(t * star.twinkleSpeed + star.twinkle);
    const alpha = 0.3 + star.val * 0.5 + twinkle * 0.2;
    const size = star.size * (0.8 + twinkle * 0.4);
    
    ctx.save();
    ctx.shadowBlur = size * 4;
    ctx.shadowColor = getColor(star.val, 0.6);
    ctx.fillStyle = getColor(star.val, Math.max(0.2, alpha));
    ctx.font = `${size.toFixed(1)}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(star.ch, star.x, star.y);
    ctx.restore();
  }
  
  // Center hub
  ctx.save();
  ctx.shadowBlur = 25;
  ctx.shadowColor = getColor(0.5, 0.7);
  ctx.strokeStyle = getColor(0.5, 0.3);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, baseRadius * 0.08, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = getColor(0.5, 0.8);
  ctx.font = `bold ${scale * 2.5}px 'Courier New', monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('✦', cx, cy);
  ctx.restore();
}

// ─── Animation ───
function animate() {
  time++;
  draw();
  animId = requestAnimationFrame(animate);
}

// ─── Actions ───
function randomText() {
  const sample = SAMPLES[Math.floor(Math.random() * SAMPLES.length)];
  textInput.value = sample;
  updateStats();
  draw();
}

function savePNG() {
  const link = document.createElement('a');
  link.download = 'text-mandala-' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// ─── Init ───
textInput.addEventListener('input', () => { updateStats(); });
buildPaletteRow();
updateStats();
animate();
</script>
