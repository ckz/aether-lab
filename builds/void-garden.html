<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Garden — a meditation in clicks</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0a0f;
    font-family: 'Georgia', 'Times New Roman', serif;
    cursor: crosshair;
    user-select: none;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; z-index: 10;
  }
  #title {
    color: rgba(255,255,255,0.85); font-size: 2.4rem; letter-spacing: 0.15em;
    text-shadow: 0 0 30px rgba(180,140,255,0.6), 0 0 60px rgba(140,100,255,0.3);
    margin-bottom: 0.5rem; text-align: center;
    animation: fadeIn 3s ease-out;
  }
  #subtitle {
    color: rgba(200,200,220,0.6); font-size: 1rem; letter-spacing: 0.2em;
    font-style: italic; text-align: center;
    animation: fadeIn 4s ease-out;
  }
  #counter {
    position: fixed; bottom: 24px; right: 28px; z-index: 10;
    color: rgba(255,255,255,0.5); font-size: 0.85rem; letter-spacing: 0.1em;
    font-family: 'Georgia', serif;
  }
  #hint {
    position: fixed; bottom: 24px; left: 28px; z-index: 10;
    color: rgba(255,255,255,0.35); font-size: 0.75rem; letter-spacing: 0.08em;
    font-style: italic; animation: pulse 4s ease-in-out infinite;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.7; } }
</style>
</head>
<body>
<canvas id="void"></canvas>
<div id="overlay">
  <div id="title">✦ VOID GARDEN ✦</div>
  <div id="subtitle">click anywhere to plant</div>
</div>
<div id="counter">flowers: 0</div>
<div id="hint">double-click to clear · watch them sway</div>

<script>
const canvas = document.getElementById('void');
const ctx = canvas.getContext('2d');
let W, H;
const flowers = [];
const stars = [];
const particles = [];
let time = 0;
let mouseX = 0, mouseY = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Generate starfield
for (let i = 0; i < 200; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.2,
    twinkleSpeed: 0.5 + Math.random() * 2,
    phase: Math.random() * Math.PI * 2
  });
}

// Color palettes for flowers
const palettes = [
  ['#ff6b9d', '#ffa3c4', '#ff4d8d', '#ffd1e8'], // rose
  ['#7bff8e', '#4dff6b', '#a3ffb8', '#d1ffe0'], // mint
  ['#ffb86b', '#ff9f4d', '#ffd1a3', '#ffe8d1'], // amber
  ['#6bb5ff', '#4d8eff', '#a3c9ff', '#d1e8ff'], // sky
  ['#d4a0ff', '#b86bff', '#e0c4ff', '#f0d8ff'], // violet
  ['#ffffff', '#e8e8ff', '#c8d0ff', '#f5f5ff'], // moon
  ['#ff6b6b', '#ff9f43', '#ffdd59', '#ff6b9d'], // sunset
  ['#00d2ff', '#3a7bd5', '#7fdbff', '#a0e0ff'], // ocean
  ['#ff9a9e', '#fecfef', '#ffecd2', '#fcb69f'], // peach
  ['#a8edea', '#fed6e3', '#d4fcff', '#ffecd2'], // aurora
];

function randomPalette() {
  return palettes[Math.floor(Math.random() * palettes.length)];
}

class Flower {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.palette = randomPalette();
    this.petalCount = 5 + Math.floor(Math.random() * 5); // 5-9 petals
    this.size = 0;
    this.targetSize = 18 + Math.random() * 22;
    this.growSpeed = 0.3 + Math.random() * 0.5;
    this.swayOffset = Math.random() * Math.PI * 2;
    this.swaySpeed = 0.3 + Math.random() * 0.4;
    this.swayAmount = 3 + Math.random() * 6;
    this.rotation = Math.random() * Math.PI * 2;
    this.life = 1;
    this.centerColor = this.palette[2];
    this.stemHeight = 0;
    this.stemTarget = 30 + Math.random() * 50;
    this.bloomed = false;
    this.born = time;
  }

  update() {
    if (this.stemHeight < this.stemTarget) {
      this.stemHeight += (this.stemTarget - this.stemHeight) * 0.05;
    } else if (this.size < this.targetSize) {
      this.size += (this.targetSize - this.size) * this.growSpeed * 0.05;
    } else {
      this.bloomed = true;
    }
  }

  draw(ctx, t) {
    const sway = Math.sin(t * this.swaySpeed + this.swayOffset) * this.swayAmount;
    const topX = this.x + sway;
    const topY = this.y - this.stemHeight;

    // Stem
    ctx.strokeStyle = 'rgba(80, 160, 100, 0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    // Curved stem
    const cpx = this.x + sway * 0.5;
    const cpy = this.y - this.stemHeight * 0.6;
    ctx.quadraticCurveTo(cpx, cpy, topX, topY);
    ctx.stroke();

    if (!this.bloomed) return;

    // Petals
    ctx.save();
    ctx.translate(topX, topY);
    ctx.rotate(this.rotation + t * 0.1);

    const petalSize = this.size;
    for (let i = 0; i < this.petalCount; i++) {
      const angle = (i / this.petalCount) * Math.PI * 2;
      ctx.save();
      ctx.rotate(angle);
      ctx.fillStyle = this.palette[i % this.palette.length];
      ctx.shadowColor = this.palette[2];
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.ellipse(0, -petalSize * 0.7, petalSize * 0.35, petalSize * 0.75, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Center
    ctx.shadowColor = this.centerColor;
    ctx.shadowBlur = 20;
    ctx.fillStyle = this.centerColor;
    ctx.beginPath();
    ctx.arc(0, 0, petalSize * 0.28, 0, Math.PI * 2);
    ctx.fill();

    // Inner glow
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(0, 0, petalSize * 0.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = -Math.random() * 2 - 0.5;
    this.life = 1;
    this.decay = 0.005 + Math.random() * 0.015;
    this.color = color;
    this.size = 1 + Math.random() * 2;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy -= 0.005; // slight upward drift
    this.life -= this.decay;
  }
  draw(ctx) {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }
}

function plantFlower(x, y) {
  const f = new Flower(x, y);
  flowers.push(f);
  // Burst particles
  const pal = f.palette;
  for (let i = 0; i < 20; i++) {
    particles.push(new Particle(x, y - f.stemTarget, pal[Math.floor(Math.random() * pal.length)]));
  }
  document.getElementById('counter').textContent = 'flowers: ' + flowers.length;
}

canvas.addEventListener('click', (e) => {
  plantFlower(e.clientX, e.clientY);
});

canvas.addEventListener('dblclick', (e) => {
  if (flowers.length === 0) return;
  // Release all flowers as particles
  flowers.forEach(f => {
    for (let i = 0; i < 15; i++) {
      particles.push(new Particle(f.x, f.y - f.stemHeight, f.palette[Math.floor(Math.random() * f.palette.length)]));
    }
  });
  flowers.length = 0;
  document.getElementById('counter').textContent = 'flowers: 0';
});

canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for (let touch of e.changedTouches) {
    plantFlower(touch.clientX, touch.clientY);
  }
}, { passive: false });

function drawStars(t) {
  stars.forEach(s => {
    const alpha = 0.3 + 0.4 * Math.sin(t * s.twinkleSpeed + s.phase);
    ctx.fillStyle = `rgba(200,210,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

function animate() {
  time += 0.016;

  // Fade trail
  ctx.fillStyle = 'rgba(10, 10, 18, 0.25)';
  ctx.fillRect(0, 0, W, H);

  drawStars(time);

  // Update and draw flowers
  flowers.forEach(f => {
    f.update();
    f.draw(ctx, time);
  });

  // Update and draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Subtle mouse glow
  const glow = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 120);
  glow.addColorStop(0, 'rgba(140,120,220,0.04)');
  glow.addColorStop(1, 'rgba(140,120,220,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(mouseX, mouseY, 120, 0, Math.PI * 2);
  ctx.fill();

  requestAnimationFrame(animate);
}

animate();

// Plant a welcome flower after a beat
setTimeout(() => plantFlower(W / 2, H / 2 + 40), 1500);
</script>
</body>
</html>
