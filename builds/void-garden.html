<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Garden</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #020208; }
canvas { display: block; cursor: crosshair; }
#ui {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: linear-gradient(to top, rgba(2,2,8,0.95), rgba(2,2,8,0.7), transparent);
  padding: 30px 20px 18px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  pointer-events: none;
}
#ui > * { pointer-events: all; }
#title {
  font-family: 'Courier New', monospace; font-size: 10px;
  letter-spacing: 6px; color: rgba(255,255,255,0.25);
  text-transform: uppercase;
}
#row {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center;
}
.btn {
  font-family: 'Courier New', monospace; font-size: 11px;
  letter-spacing: 2px; text-transform: uppercase;
  background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6);
  border: 1px solid rgba(255,255,255,0.12); border-radius: 3px;
  padding: 7px 14px; cursor: pointer;
  transition: all 0.2s;
}
.btn:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.9); }
.btn.active {
  background: rgba(100,180,255,0.15);
  border-color: rgba(100,180,255,0.4);
  color: rgba(140,210,255,0.95);
}
#hint {
  font-family: 'Courier New', monospace; font-size: 10px;
  letter-spacing: 2px; color: rgba(255,255,255,0.2);
}
#count {
  font-family: 'Courier New', monospace; font-size: 10px;
  letter-spacing: 2px; color: rgba(255,255,255,0.2);
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="title">✦ Void Garden</div>
  <div id="row">
    <button class="btn active" data-palette="nebula">Nebula</button>
    <button class="btn" data-palette="aurora">Aurora</button>
    <button class="btn" data-palette="ember">Ember</button>
    <button class="btn" data-palette="deep">Deep</button>
    <button class="btn" data-palette="mono">Mono</button>
    <button class="btn" data-palette="candy">Candy</button>
    <button class="btn" id="clearBtn">✕ Clear</button>
  </div>
  <div id="hint">click = plant · drag = paint · dblclick = clear all</div>
  <div id="count"></div>
</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

function resize() {
  cv.width = window.innerWidth;
  cv.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Palettes ──────────────────────────────────────────────
const P = {
  nebula:  [[130,80,255],[80,140,255],[200,100,255],[100,200,255],[180,80,255]],
  aurora:  [[0,255,140],[0,200,255],[80,255,180],[0,255,200],[100,255,100]],
  ember:   [[255,100,20],[255,180,20],[255,60,60],[255,200,50],[255,80,20]],
  deep:    [[0,60,180],[0,120,255],[40,180,220],[0,80,200],[80,160,255]],
  mono:    [[200,200,200],[160,160,160],[220,220,220],[180,180,180],[140,140,160]],
  candy:   [[255,80,180],[80,255,200],[255,200,80],[180,80,255],[255,130,130]],
};

let palKey = 'nebula';
function pal() { return P[palKey]; }
function rc() { const c = pal(); return c[Math.floor(Math.random()*c.length)]; }

// ── Stars ─────────────────────────────────────────────────
const stars = [];
for (let i = 0; i < 350; i++) {
  stars.push({
    x: Math.random()*cv.width, y: Math.random()*cv.height,
    r: Math.random()*1.2+0.1,
    phase: Math.random()*Math.PI*2,
    speed: Math.random()*1.5+0.5
  });
}
function drawStars(t) {
  for (const s of stars) {
    const a = 0.2 + Math.sin(t*0.001*s.speed + s.phase)*0.2;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.fill();
  }
}

// ── Floating spores ───────────────────────────────────────
const spores = Array.from({length: 60}, () => ({
  x: Math.random()*cv.width, y: Math.random()*cv.height,
  vx: (Math.random()-0.5)*0.15, vy: -Math.random()*0.3-0.1,
  r: Math.random()*1.8+0.4,
  phase: Math.random()*Math.PI*2,
  c: rc()
}));
function drawSpores(t) {
  for (const s of spores) {
    s.x += s.vx + Math.sin(t*0.0008+s.phase)*0.2;
    s.y += s.vy;
    if (s.y < -10) { s.y = cv.height+10; s.x = Math.random()*cv.width; }
    if (s.x < -10) s.x = cv.width+10;
    if (s.x > cv.width+10) s.x = -10;
    const a = 0.25 + Math.sin(t*0.002+s.phase)*0.2;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${s.c[0]},${s.c[1]},${s.c[2]},${a})`;
    ctx.fill();
  }
}

// ── Crystal class ─────────────────────────────────────────
const crystals = [];
const MAX_CRYSTALS = 80;
const CONNECT_DIST = 140;

class Crystal {
  constructor(x, y, c) {
    this.x = x; this.y = y;
    this.c = c || rc();
    this.maxR = Math.random()*30 + 20;
    this.r = 0;
    this.growSpeed = Math.random()*0.4 + 0.3;
    this.branches = Math.floor(Math.random()*4) + 3;
    this.rot = Math.random()*Math.PI*2;
    this.rotSpeed = (Math.random()-0.5)*0.004;
    this.pulsePhase = Math.random()*Math.PI*2;
    this.type = Math.floor(Math.random()*4); // 0=spire 1=bloom 2=star 3=ring
    this.alive = true;
    this.alpha = 0;
    this.maxAlpha = Math.random()*0.4 + 0.6;
    this.fadeIn = true;
  }

  update(t, dt) {
    if (this.r < this.maxR) {
      this.r += this.growSpeed * (dt/16);
      if (this.r > this.maxR) this.r = this.maxR;
    }
    this.rot += this.rotSpeed * (dt/16);
    const pulse = Math.sin(t*0.002 + this.pulsePhase) * 0.5 + 0.5;
    this.alpha = this.fadeIn
      ? Math.min(this.maxAlpha, this.alpha + 0.02*(dt/16))
      : this.maxAlpha * (0.7 + pulse*0.3);
  }

  draw(t) {
    const a = this.alpha;
    const [r,g,b] = this.c;
    const pulse = Math.sin(t*0.002 + this.pulsePhase)*0.5+0.5;
    const rad = this.r;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.globalAlpha = a;

    // ambient glow
    const grd = ctx.createRadialGradient(0,0,0, 0,0,rad*3);
    grd.addColorStop(0, `rgba(${r},${g},${b},${0.08+pulse*0.06})`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.arc(0,0,rad*3,0,Math.PI*2);
    ctx.fillStyle = grd; ctx.fill();

    ctx.strokeStyle = `rgba(${r},${g},${b},${0.6+pulse*0.4})`;
    ctx.fillStyle = `rgba(${r},${g},${b},${0.08+pulse*0.06})`;
    ctx.lineWidth = 1.2;
    ctx.shadowBlur = 8; ctx.shadowColor = `rgb(${r},${g},${b})`;

    if (this.type === 0) this._spire(rad, r, g, b);
    else if (this.type === 1) this._bloom(rad, r, g, b);
    else if (this.type === 2) this._star(rad, r, g, b);
    else this._ring(rad, r, g, b);

    // center bright dot
    ctx.beginPath();
    ctx.arc(0, 0, 1.5+pulse*1.5, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${Math.min(255,r+80)},${Math.min(255,g+80)},${Math.min(255,b+80)},${0.9})`;
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.restore();
  }

  _spire(rad, r, g, b) {
    for (let i = 0; i < this.branches; i++) {
      const ang = (i/this.branches)*Math.PI*2;
      const len = rad * (0.7 + Math.sin(i*2.3)*0.3);
      const ex = Math.cos(ang)*len, ey = Math.sin(ang)*len;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(ex,ey); ctx.stroke();
      // tip dot
      ctx.beginPath(); ctx.arc(ex,ey,2,0,Math.PI*2);
      ctx.fillStyle = `rgba(${r},${g},${b},0.8)`; ctx.fill();
      // side spike
      const sa = ang + 0.4, sl = len*0.4;
      ctx.beginPath(); ctx.moveTo(ex*0.5,ey*0.5);
      ctx.lineTo(ex*0.5+Math.cos(sa)*sl, ey*0.5+Math.sin(sa)*sl);
      ctx.strokeStyle = `rgba(${r},${g},${b},0.3)`; ctx.stroke();
      ctx.strokeStyle = `rgba(${r},${g},${b},${0.6})`;
    }
  }

  _bloom(rad, r, g, b) {
    const petals = this.branches + 2;
    for (let i = 0; i < petals; i++) {
      const ang = (i/petals)*Math.PI*2;
      const len = rad * (0.6 + Math.sin(i*1.7)*0.4);
      ctx.save(); ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.bezierCurveTo(len*0.3,-len*0.25, len*0.7,-len*0.15, len,0);
      ctx.bezierCurveTo(len*0.7,len*0.15, len*0.3,len*0.25, 0,0);
      ctx.strokeStyle = `rgba(${r},${g},${b},0.65)`;
      ctx.stroke();
      ctx.fillStyle = `rgba(${r},${g},${b},0.05)`;
      ctx.fill();
      ctx.restore();
    }
    // center ring
    ctx.beginPath(); ctx.arc(0,0,rad*0.15,0,Math.PI*2);
    ctx.strokeStyle = `rgba(${r},${g},${b},0.4)`; ctx.stroke();
  }

  _star(rad, r, g, b) {
    const pts = this.branches + 2;
    for (let i = 0; i < pts; i++) {
      const ang = (i/pts)*Math.PI*2;
      const len = i%2===0 ? rad : rad*0.45;
      const ex = Math.cos(ang)*len, ey = Math.sin(ang)*len;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.beginPath(); ctx.arc(ex,ey,1.5,0,Math.PI*2);
      ctx.fillStyle = `rgba(${r},${g},${b},0.7)`; ctx.fill();
    }
    // inner star
    ctx.beginPath();
    for (let i = 0; i < pts*2; i++) {
      const ang = (i/(pts*2))*Math.PI*2;
      const len = i%2===0 ? rad*0.7 : rad*0.3;
      const x = Math.cos(ang)*len, y = Math.sin(ang)*len;
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = `rgba(${r},${g},${b},0.25)`; ctx.stroke();
  }

  _ring(rad, r, g, b) {
    for (let i = 0; i < this.branches; i++) {
      const ang = (i/this.branches)*Math.PI*2;
      const x1 = Math.cos(ang)*rad*0.3, y1 = Math.sin(ang)*rad*0.3;
      const x2 = Math.cos(ang)*rad,     y2 = Math.sin(ang)*rad;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x2,y2,2.5,0,Math.PI*2);
      ctx.fillStyle = `rgba(${r},${g},${b},0.7)`; ctx.fill();
    }
    // concentric circles
    for (let j = 1; j <= 2; j++) {
      ctx.beginPath(); ctx.arc(0,0,rad*(0.2+j*0.22),0,Math.PI*2);
      ctx.strokeStyle = `rgba(${r},${g},${b},${0.15+j*0.05})`; ctx.stroke();
    }
  }
}

// ── Connections ───────────────────────────────────────────
function drawConnections() {
  for (let i = 0; i < crystals.length; i++) {
    for (let j = i+1; j < crystals.length; j++) {
      const a = crystals[i], b = crystals[j];
      const dx = a.x-b.x, dy = a.y-b.y;
      const d = Math.sqrt(dx*dx+dy*dy);
      if (d < CONNECT_DIST) {
        const al = (1 - d/CONNECT_DIST) * 0.2 * Math.min(a.alpha, b.alpha);
        const [r,g,bl] = a.c;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
        ctx.strokeStyle = `rgba(${r},${g},${bl},${al})`;
        ctx.lineWidth = 0.6;
        ctx.stroke();
      }
    }
  }
}

// ── Spawn burst particles ─────────────────────────────────
const bursts = [];
function spawnBurst(x, y, c, n=18) {
  for (let i = 0; i < n; i++) {
    const ang = Math.random()*Math.PI*2;
    const spd = Math.random()*2.5+0.5;
    bursts.push({
      x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
      life: 1, decay: Math.random()*0.015+0.01,
      r: c[0], g: c[1], b: c[2],
      size: Math.random()*2+0.5
    });
  }
}
function updateBursts(dt) {
  for (let i = bursts.length-1; i >= 0; i--) {
    const p = bursts[i];
    p.x += p.vx*(dt/16); p.y += p.vy*(dt/16);
    p.vx *= 0.98; p.vy *= 0.98;
    p.life -= p.decay*(dt/16);
    if (p.life <= 0) bursts.splice(i,1);
  }
}
function drawBursts() {
  for (const p of bursts) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${p.life*0.8})`;
    ctx.shadowBlur = 6; ctx.shadowColor = `rgb(${p.r},${p.g},${p.b})`;
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

// ── Ripple effect ─────────────────────────────────────────
const ripples = [];
function spawnRipple(x, y, c) {
  ripples.push({ x, y, r: 0, maxR: 60+Math.random()*40, life: 1, c });
}
function updateRipples(dt) {
  for (let i = ripples.length-1; i >= 0; i--) {
    const rp = ripples[i];
    rp.r += 1.2*(dt/16);
    rp.life = 1 - rp.r/rp.maxR;
    if (rp.life <= 0) ripples.splice(i,1);
  }
}
function drawRipples() {
  for (const rp of ripples) {
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(${rp.c[0]},${rp.c[1]},${rp.c[2]},${rp.life*0.3})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

// ── Main loop ─────────────────────────────────────────────
let lastT = 0;
let lastPlant = 0;
let dragging = false;

function loop(t) {
  const dt = Math.min(t - lastT, 50); lastT = t;

  // fade trail
  ctx.fillStyle = 'rgba(2,2,8,0.18)';
  ctx.fillRect(0, 0, cv.width, cv.height);

  drawStars(t);
  drawSpores(t);
  drawConnections();

  for (const c of crystals) { c.update(t, dt); c.draw(t); }

  updateBursts(dt); drawBursts();
  updateRipples(dt); drawRipples();

  // count
  document.getElementById('count').textContent =
    crystals.length > 0 ? `${crystals.length} crystal${crystals.length>1?'s':''}` : '';

  requestAnimationFrame(loop);
}

// ── Input ─────────────────────────────────────────────────
function plant(x, y) {
  if (crystals.length >= MAX_CRYSTALS) return;
  const c = new Crystal(x, y);
  crystals.push(c);
  spawnBurst(x, y, c.c, 14);
  spawnRipple(x, y, c.c);
}

cv.addEventListener('mousedown', e => {
  dragging = true;
  const now = Date.now();
  if (now - lastPlant > 80) { plant(e.clientX, e.clientY); lastPlant = now; }
});
cv.addEventListener('mousemove', e => {
  if (!dragging) return;
  const now = Date.now();
  if (now - lastPlant > 60) { plant(e.clientX, e.clientY); lastPlant = now; }
});
cv.addEventListener('mouseup', () => dragging = false);
cv.addEventListener('dblclick', e => {
  e.preventDefault();
  for (const c of crystals) spawnBurst(c.x, c.y, c.c, 10);
  crystals.length = 0;
});

// touch
cv.addEventListener('touchstart', e => {
  e.preventDefault(); dragging = true;
  const t = e.touches[0]; plant(t.clientX, t.clientY);
}, {passive:false});
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!dragging) return;
  const t = e.touches[0], now = Date.now();
  if (now - lastPlant > 60) { plant(t.clientX, t.clientY); lastPlant = now; }
}, {passive:false});
cv.addEventListener('touchend', () => dragging = false);

// keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'c' || e.key === 'C') {
    for (const cr of crystals) spawnBurst(cr.x, cr.y, cr.c, 10);
    crystals.length = 0;
  }
  if (e.key === ' ') {
    e.preventDefault();
    const keys = Object.keys(P);
    const idx = (keys.indexOf(palKey)+1) % keys.length;
    setPalette(keys[idx]);
  }
  if (e.key >= '1' && e.key <= '6') {
    const keys = Object.keys(P);
    setPalette(keys[+e.key-1]);
  }
});

// palette buttons
document.querySelectorAll('[data-palette]').forEach(btn => {
  btn.addEventListener('click', () => setPalette(btn.dataset.palette));
});
document.getElementById('clearBtn').addEventListener('click', () => {
  for (const cr of crystals) spawnBurst(cr.x, cr.y, cr.c, 10);
  crystals.length = 0;
});

function setPalette(key) {
  palKey = key;
  document.querySelectorAll('[data-palette]').forEach(b => {
    b.classList.toggle('active', b.dataset.palette === key);
  });
  // tint existing spores
  for (const s of spores) s.c = rc();
}

// ── Start ─────────────────────────────────────────────────
// Initial black fill
ctx.fillStyle = '#020208';
ctx.fillRect(0, 0, cv.width, cv.height);

requestAnimationFrame(loop);
</script>
</body>
</html>
