<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Garden — Cosmic Flora Cultivator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; cursor: crosshair; }
  #ui {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 10; flex-wrap: wrap; justify-content: center;
  }
  .btn {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
    color: #ccc; padding: 6px 14px; border-radius: 20px; font: 13px/1.4 'Courier New', monospace;
    cursor: pointer; backdrop-filter: blur(8px); transition: all 0.3s;
    user-select: none; letter-spacing: 0.5px;
  }
  .btn:hover { background: rgba(255,255,255,0.14); color: #fff; border-color: rgba(255,255,255,0.3); }
  .btn.active { background: rgba(255,255,255,0.18); color: #fff; border-color: rgba(255,255,255,0.5); box-shadow: 0 0 12px rgba(255,255,255,0.1); }
  #info {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.4); font: 11px/1.5 'Courier New', monospace;
    text-align: center; z-index: 10; pointer-events: none;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <button class="btn" data-action="palette">Palette [1-5]</button>
  <button class="btn" data-action="spores">Spores [S]</button>
  <button class="btn" data-action="storm">Storm [Space]</button>
  <button class="btn" data-action="harvest">Harvest [H]</button>
  <button class="btn" data-action="clear">Clear [C]</button>
</div>
<div id="info">
  Click to plant seeds &nbsp;|&nbsp; Hold to grow &nbsp;|&nbsp; 1-5 palette &nbsp;|&nbsp; S spores &nbsp;|&nbsp; Space storm &nbsp;|&nbsp; H harvest &nbsp;|&nbsp; C clear
</div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// ─── Palettes ─────────────────────────────────────────────
const PALETTES = [
  { name: 'Nebula',  colors: ['#ff6b9d','#c44dff','#6e5bff','#00d4ff','#ff6b9d'], bg: [2,2,8],   glow: 'rgba(200,100,255,0.04)' },
  { name: 'Aurora',  colors: ['#00ffa3','#00d4ff','#7bff00','#00ffa3','#ff00e5'], bg: [1,4,4],   glow: 'rgba(0,255,163,0.04)' },
  { name: 'Frost',   colors: ['#a0e0ff','#d0f0ff','#ffffff','#80c0ff','#a0e0ff'], bg: [4,6,10],  glow: 'rgba(160,220,255,0.04)' },
  { name: 'Ember',   colors: ['#ff4400','#ff8800','#ffcc00','#ff4400','#ff6600'], bg: [8,3,1],   glow: 'rgba(255,136,0,0.04)' },
  { name: 'Void',    colors: ['#cc44ff','#ff44aa','#44ccff','#cc44ff','#ffffff'], bg: [5,1,8],   glow: 'rgba(200,68,255,0.04)' },
];
let palette = 0;

// ─── State ─────────────────────────────────────────────────
const plants = [];
const stars = [];
const spores = [];
const shootingStars = [];
let mouse = { x: W/2, y: H/2, down: false, grow: false };
let time = 0;
let stormMode = false;
let sporeMode = false;
let frameCount = 0;

// ─── Stars ─────────────────────────────────────────────────
function initStars() {
  stars.length = 0;
  for (let i = 0; i < 200; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.2 + 0.3,
      tw: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005,
    });
  }
}
initStars();

// ─── Shooting Stars ────────────────────────────────────────
function spawnShootingStar() {
  if (shootingStars.length > 3) return;
  const angle = Math.random() * 0.8 + 0.3;
  shootingStars.push({
    x: Math.random() * W * 0.8, y: Math.random() * H * 0.3,
    vx: Math.cos(angle) * (4 + Math.random() * 4),
    vy: Math.sin(angle) * (3 + Math.random() * 3),
    life: 1, decay: 0.008 + Math.random() * 0.012,
    len: 30 + Math.random() * 60,
  });
}

// ─── Plants ────────────────────────────────────────────────
class Plant {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.branches = []; this.particles = []; this.age = 0;
    this.maxAge = 800 + Math.random() * 600;
    this.color = PALETTES[palette].colors[Math.floor(Math.random() * 5)];
    this.maxBranches = 3 + Math.floor(Math.random() * 5);
    this.growRate = 0;
    this.targetGrowRate = 0.3 + Math.random() * 0.7;
    this.swayPhase = Math.random() * Math.PI * 2;
    this.swayAmp = 0.15 + Math.random() * 0.5;
    this.height = 60 + Math.random() * 160;
    this.thickness = 1 + Math.random() * 2.5;
    this.mature = false;
    this.matureTime = 0;
    this.burstCooldown = 0;
    // Start growing
    this.growRate = this.targetGrowRate;
  }

  update(dt, windX) {
    this.age += dt;
    this.swayPhase += 0.015;

    if (this.growRate > 0 && this.branches.length < this.maxBranches) {
      this.growRate -= 0.0003;
      if (this.growRate <= 0) {
        this.growRate = 0;
        if (!this.mature) { this.mature = true; this.matureTime = this.age; }
      }
      const trunk = this.branches.length === 0;
      const segLen = trunk ? this.height * 0.2 : this.height * 0.12;
      if (this.branches.length === 0) {
        this.branches.push({ x: this.x, y: this.y, angle: -Math.PI/2, len: segLen, depth: 0, width: this.thickness });
      } else {
        const parent = this.branches[this.branches.length - 1];
        const bx = parent.x + Math.cos(parent.angle) * parent.len;
        const by = parent.y + Math.sin(parent.angle) * parent.len;
        const angleOff = (Math.random() - 0.5) * 1.2 + windX * 0.3;
        this.branches.push({
          x: bx, y: by,
          angle: parent.angle + angleOff,
          len: segLen, depth: parent.depth + 1,
          width: Math.max(0.4, parent.width * 0.65),
        });
      }
    }

    // Subtle sway
    for (const b of this.branches) {
      b.currentAngle = b.angle + Math.sin(this.swayPhase + b.depth * 0.7) * this.swayAmp * (1 + b.depth * 0.2);
    }

    // Emit spores when mature
    if (this.mature && this.burstCooldown <= 0) {
      if (Math.random() < 0.02) this.emitSpore();
      this.burstCooldown = 30 + Math.random() * 60;
    }
    if (this.burstCooldown > 0) this.burstCooldown--;

    // Update particles
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx + windX * 0.3;
      p.y += p.vy + p.vy * 0.1;
      p.vx *= 0.99;
      p.life -= 0.004;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
  }

  emitSpore() {
    const tip = this.getTip();
    const count = 2 + Math.floor(Math.random() * 4);
    for (let i = 0; i < count; i++) {
      this.particles.push({
        x: tip.x + (Math.random()-0.5) * 10,
        y: tip.y + (Math.random()-0.5) * 10,
        vx: (Math.random()-0.5) * 0.6,
        vy: -0.2 - Math.random() * 0.5,
        life: 1, r: 1 + Math.random() * 1.5,
      });
    }
  }

  getTip() {
    if (this.branches.length === 0) return { x: this.x, y: this.y };
    const b = this.branches[this.branches.length - 1];
    return { x: b.x + Math.cos(b.currentAngle || b.angle) * b.len, y: b.y + Math.sin(b.currentAngle || b.angle) * b.len };
  }

  draw(ctx) {
    // Draw branches
    for (const b of this.branches) {
      const ex = b.x + Math.cos(b.currentAngle || b.angle) * b.len;
      const ey = b.y + Math.sin(b.currentAngle || b.angle) * b.len;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(ex, ey);
      ctx.strokeStyle = this.color + '88';
      ctx.lineWidth = b.width;
      ctx.lineCap = 'round';
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 6 + b.depth * 2;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // Draw glowing tip on mature plants
    if (this.mature) {
      const tip = this.getTip();
      const pulse = Math.sin(time * 0.03 + this.swayPhase) * 0.3 + 0.7;
      const gr = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, 12 * pulse);
      gr.addColorStop(0, this.color + 'cc');
      gr.addColorStop(1, this.color + '00');
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, 12 * pulse, 0, Math.PI * 2);
      ctx.fillStyle = gr;
      ctx.fill();
    }

    // Draw particles
    for (const p of this.particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fillStyle = this.color + Math.floor(p.life * 180).toString(16).padStart(2,'0');
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 4;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }
}

// ─── Floating Spores ───────────────────────────────────────
function updateSpores(windX) {
  if (sporeMode && frameCount % 4 === 0) {
    spores.push({
      x: Math.random() * W, y: H + 10,
      vx: (Math.random()-0.5) * 0.3 + windX * 0.5,
      vy: -0.2 - Math.random() * 0.4,
      life: 1, r: 1 + Math.random() * 2,
      color: PALETTES[palette].colors[Math.floor(Math.random() * 5)],
    });
  }
  for (let i = spores.length - 1; i >= 0; i--) {
    const s = spores[i];
    s.x += s.vx + windX * 0.2; s.y += s.vy; s.life -= 0.001;
    if (s.life <= 0 || s.y < -10 || s.x < -10 || s.x > W + 10) spores.splice(i, 1);
  }
}

function drawSpores() {
  for (const s of spores) {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = s.color + Math.floor(s.life * 150).toString(16).padStart(2,'0');
    ctx.shadowColor = s.color;
    ctx.shadowBlur = 6;
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

// ─── Storm Mode ────────────────────────────────────────────
function updateStorm() {
  if (!stormMode) return;
  if (frameCount % 8 === 0) spawnShootingStar();
  if (frameCount % 30 === 0 && plants.length < 30) {
    plants.push(new Plant(Math.random() * W * 0.8 + W * 0.1, H * (0.6 + Math.random() * 0.35)));
  }
  for (const p of plants) {
    if (p.growRate < p.targetGrowRate) p.growRate = Math.min(p.targetGrowRate, p.growRate + 0.002);
  }
}

// ─── Mouse interaction ─────────────────────────────────────
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e => { mouse.down = true; mouse.grow = true; spawnPlant(e.clientX, e.clientY); });
canvas.addEventListener('mouseup', () => { mouse.down = false; mouse.grow = false; });
canvas.addEventListener('mouseleave', () => { mouse.down = false; mouse.grow = false; });
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY; mouse.down = true; mouse.grow = true;
  spawnPlant(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault(); const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY;
  if (mouse.grow && frameCount % 5 === 0) spawnPlant(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener('touchend', () => { mouse.down = false; mouse.grow = false; });

function spawnPlant(x, y) {
  if (plants.length < 50) plants.push(new Plant(x, y));
}

// ─── Keyboard ──────────────────────────────────────────────
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '5') { palette = parseInt(k) - 1; }
  else if (k === 's') { sporeMode = !sporeMode; }
  else if (k === ' ') { e.preventDefault(); stormMode = !stormMode; }
  else if (k === 'h') { harvest(); }
  else if (k === 'c') { plants.length = 0; }
});

// ─── Harvest ───────────────────────────────────────────────
function harvest() {
  for (const p of plants) {
    const tip = p.getTip();
    const count = 20 + Math.floor(Math.random() * 30);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 3;
      p.particles.push({
        x: tip.x + (Math.random()-0.5) * 6,
        y: tip.y + (Math.random()-0.5) * 6,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        life: 1.5, r: 1 + Math.random() * 2.5,
      });
    }
  }
}

// ─── Buttons ───────────────────────────────────────────────
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const a = btn.dataset.action;
    if (a === 'palette') palette = (palette + 1) % PALETTES.length;
    else if (a === 'spores') sporeMode = !sporeMode;
    else if (a === 'storm') stormMode = !stormMode;
    else if (a === 'harvest') harvest();
    else if (a === 'clear') plants.length = 0;
  });
});

// ─── Render ────────────────────────────────────────────────
function drawBackground() {
  const p = PALETTES[palette];
  // Deep gradient
  const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H, Math.max(W,H) * 0.7);
  bg.addColorStop(0, `rgb(${p.bg[0]+4},${p.bg[1]+4},${p.bg[2]+4})`);
  bg.addColorStop(1, `rgb(${p.bg[0]},${p.bg[1]},${p.bg[2]})`);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Subtle glow overlay
  ctx.fillStyle = p.glow;
  ctx.fillRect(0, 0, W, H);
}

function drawStars() {
  for (const s of stars) {
    s.tw += s.speed;
    const alpha = 0.3 + Math.sin(s.tw) * 0.3 + 0.3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }
}

function drawShootingStars() {
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const ss = shootingStars[i];
    ss.x += ss.vx; ss.y += ss.vy; ss.life -= ss.decay;
    if (ss.life <= 0) { shootingStars.splice(i, 1); continue; }
    const tailX = ss.x - ss.vx * ss.len * 0.15;
    const tailY = ss.y - ss.vy * ss.len * 0.15;
    const grad = ctx.createLinearGradient(tailX, tailY, ss.x, ss.y);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(1, `rgba(255,255,255,${ss.life})`);
    ctx.beginPath();
    ctx.moveTo(tailX, tailY); ctx.lineTo(ss.x, ss.y);
    ctx.strokeStyle = grad; ctx.lineWidth = 1.5;
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
    ctx.stroke(); ctx.shadowBlur = 0;
  }
}

function drawGround() {
  // Subtle ground line
  const groundY = H * 0.85;
  ctx.beginPath();
  for (let x = 0; x < W; x += 4) {
    const y = groundY + Math.sin(x * 0.01 + time * 0.005) * 8;
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Ground glow
  const gg = ctx.createLinearGradient(0, groundY - 20, 0, H);
  gg.addColorStop(0, 'rgba(255,255,255,0)');
  const p = PALETTES[palette];
  gg.addColorStop(1, p.colors[0] + '12');
  ctx.fillStyle = gg;
  ctx.fillRect(0, groundY - 20, W, H - groundY + 20);
}

// ─── Mouse Glow ────────────────────────────────────────────
function drawMouseGlow() {
  const p = PALETTES[palette];
  const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 60);
  g.addColorStop(0, p.colors[0] + '25');
  g.addColorStop(1, p.colors[0] + '00');
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, 60, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
}

// ─── Main Loop ─────────────────────────────────────────────
function loop() {
  frameCount++;
  time++;

  const windX = Math.sin(time * 0.003) * 0.5 + Math.sin(time * 0.007) * 0.3;

  // Hold to grow plants
  if (mouse.grow && frameCount % 8 === 0 && plants.length < 50) {
    const ox = (Math.random()-0.5) * 30, oy = (Math.random()-0.5) * 30;
    spawnPlant(mouse.x + ox, mouse.y + oy);
  }

  // Update
  for (const p of plants) p.update(1, windX);
  updateSpores(windX);
  updateStorm();
  if (frameCount % 200 === 0 && Math.random() < 0.4) spawnShootingStar();

  // Draw
  drawBackground();
  drawStars();
  drawShootingStars();
  drawGround();

  // Sort plants by Y for depth
  const sorted = [...plants].sort((a,b) => a.y - b.y);
  for (const p of sorted) p.draw(ctx);

  drawSpores();
  drawMouseGlow();

  requestAnimationFrame(loop);
}

// ─── Start ─────────────────────────────────────────────────
// Auto-plant a few demo seeds
setTimeout(() => {
  for (let i = 0; i < 5; i++) {
    setTimeout(() => spawnPlant(W * 0.15 + Math.random() * W * 0.7, H * (0.55 + Math.random() * 0.3)), i * 300);
  }
}, 200);

loop();

})();
</script>
</body>
</html>
