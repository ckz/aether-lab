<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voronoi Forge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050508;
    font-family: 'Courier New', monospace;
    color: #aaa;
    overflow: hidden;
    height: 100vh;
    cursor: crosshair;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .ui {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 10;
    background: rgba(5,5,8,.7);
    padding: 10px 16px;
    border-radius: 6px;
    border: 1px solid rgba(100,100,180,.15);
    backdrop-filter: blur(8px);
  }
  .ui button {
    background: rgba(20,20,40,.6);
    border: 1px solid rgba(120,100,200,.25);
    color: #aab;
    padding: 6px 14px;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    font-size: .7rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    transition: all .2s;
  }
  .ui button:hover { border-color: rgba(160,140,255,.5); color: #ddf; }
  .ui .info {
    position: fixed;
    top: 20px;
    left: 20px;
    font-size: .65rem;
    opacity: .4;
    letter-spacing: .1em;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="info">VORONOI FORGE // click: add seed // drag: repel // scroll: palette // r: reset</div>
<div class="ui">
  <button onclick="setPalette(0)">Ice</button>
  <button onclick="setPalette(1)">Amber</button>
  <button onclick="setPalette(2)">Obsidian</button>
  <button onclick="setPalette(3)">Emerald</button>
  <button onclick="setPalette(4)">Amethyst</button>
  <button onclick="setPalette(5)">Neon</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, offCanvas, offCtx;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  offCanvas = document.createElement('canvas');
  offCanvas.width = Math.floor(W / 3);
  offCanvas.height = Math.floor(H / 3);
  offCtx = offCanvas.getContext('2d');
}
resize();
window.addEventListener('resize', resize);

const palettes = [
  { name: 'Ice', colors: [[15,30,60],[20,50,90],[30,80,140],[60,150,200],[100,200,240],[180,230,255]], edge: [140,200,255] },
  { name: 'Amber', colors: [[40,15,5],[80,30,10],[140,50,15],[200,100,30],[240,160,60],[255,220,140]], edge: [255,200,100] },
  { name: 'Obsidian', colors: [[10,10,15],[20,15,25],[35,25,45],[50,35,70],[70,50,100],[100,80,140]], edge: [160,140,200] },
  { name: 'Emerald', colors: [[10,30,20],[15,50,35],[20,80,50],[30,140,70],[60,200,100],[140,255,160]], edge: [120,255,180] },
  { name: 'Amethyst', colors: [[25,10,40],[45,20,70],[70,30,110],[110,50,160],[160,80,210],[210,140,255]], edge: [200,160,255] },
  { name: 'Neon', colors: [[10,0,20],[30,0,50],[60,0,100],[100,0,180],[180,0,255],[255,0,200]], edge: [255,100,255] }
];

let palette = palettes[0];
let seeds = [];
let mouse = { x: -9999, y: -9999, down: false };
let time = 0;

function initSeeds() {
  seeds = [];
  for (let i = 0; i < 80; i++) {
    seeds.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: 0, vy: 0,
      r: 2 + Math.random() * 4,
      ci: Math.floor(Math.random() * palette.colors.length)
    });
  }
}
initSeeds();

function setPalette(i) {
  palette = palettes[i];
}

canvas.addEventListener('mousedown', e => { mouse.down = true; addSeed(e.clientX, e.clientY); });
canvas.addEventListener('mouseup', () => mouse.down = false);
canvas.addEventListener('mousemove', e => mouse.x = e.clientX, mouse.y = e.clientY);
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  removeNearest(e.clientX, e.clientY);
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY; mouse.down = true;
  addSeed(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY;
}, { passive: false });
canvas.addEventListener('touchend', () => mouse.down = false);

window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') initSeeds();
  if (e.key >= '1' && e.key <= '6') setPalette(parseInt(e.key) - 1);
});

function addSeed(x, y) {
  seeds.push({ x, y, vx: 0, vy: 0, r: 2 + Math.random() * 4, ci: Math.floor(Math.random() * palette.colors.length) });
}

function removeNearest(x, y) {
  let best = 0, bestD = Infinity;
  seeds.forEach((s, i) => { const d = (s.x-x)**2 + (s.y-y)**2; if (d < bestD) { bestD = d; best = i; } });
  if (seeds.length > 5) seeds.splice(best, 1);
}

function lerp(a, b, t) { return a + (b - a) * t; }

function updateSeeds() {
  const mx = mouse.x, my = mouse.y;
  seeds.forEach(s => {
    // Brownian drift
    s.vx += (Math.random() - 0.5) * 0.15;
    s.vy += (Math.random() - 0.5) * 0.15;
    // Mouse repel when down
    if (mouse.down) {
      const dx = s.x - mx, dy = s.y - my;
      const d2 = dx*dx + dy*dy;
      if (d2 < 40000 && d2 > 1) {
        const d = Math.sqrt(d2);
        const f = (200 - d) / 200 * 2;
        s.vx += (dx / d) * f;
        s.vy += (dy / d) * f;
      }
    }
    // Gentle mouse attraction when not down
    if (!mouse.down && mx > 0 && my > 0) {
      const dx = mx - s.x, dy = my - s.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < 90000 && d2 > 100) {
        const d = Math.sqrt(d2);
        s.vx += (dx / d) * 0.08;
        s.vy += (dy / d) * 0.08;
      }
    }
    // Damping
    s.vx *= 0.94;
    s.vy *= 0.94;
    // Speed limit
    const speed = Math.sqrt(s.vx*s.vx + s.vy*s.vy);
    if (speed > 3) { s.vx = (s.vx/speed)*3; s.vy = (s.vy/speed)*3; }
    s.x += s.vx;
    s.y += s.vy;
    // Wrap
    if (s.x < -20) s.x = W + 20;
    if (s.x > W + 20) s.x = -20;
    if (s.y < -20) s.y = H + 20;
    if (s.y > H + 20) s.y = -20;
  });
}

function draw() {
  const ow = offCanvas.width, oh = offCanvas.height;
  const imgData = offCtx.createImageData(ow, oh);
  const data = imgData.data;
  const edgeCol = palette.edge;
  const colors = palette.colors;

  for (let y = 0; y < oh; y++) {
    for (let x = 0; x < ow; x++) {
      const px = x * 3, py = y * 3;
      let bestD = Infinity, bestD2 = Infinity, bestCI = 0;
      // Brute-force nearest + second-nearest
      for (let i = 0; i < seeds.length; i++) {
        const s = seeds[i];
        const dx = px - s.x, dy = py - s.y;
        const d = dx*dx + dy*dy;
        if (d < bestD) {
          bestD2 = bestD;
          bestD = d;
          bestCI = s.ci;
        } else if (d < bestD2) {
          bestD2 = d;
        }
      }
      const edgeDist = Math.sqrt(bestD2) - Math.sqrt(bestD);
      const edgeFactor = Math.max(0, 1 - edgeDist / 8);
      const c = colors[bestCI % colors.length];
      // Soft cell shading: brighter near seed center
      const centerDist = Math.sqrt(bestD);
      const shade = Math.max(0.5, 1 - centerDist / 300);
      const idx = (y * ow + x) * 4;
      data[idx]     = Math.min(255, c[0] * shade + edgeCol[0] * edgeFactor * 0.6);
      data[idx + 1] = Math.min(255, c[1] * shade + edgeCol[1] * edgeFactor * 0.6);
      data[idx + 2] = Math.min(255, c[2] * shade + edgeCol[2] * edgeFactor * 0.6);
      data[idx + 3] = 255;
    }
  }
  offCtx.putImageData(imgData, 0, 0);

  // Draw scaled up to main canvas
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(offCanvas, 0, 0, W, H);

  // Draw seed points as small glowing dots
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  seeds.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * 0.8, 0, Math.PI * 2);
    ctx.fill();
    // Soft glow
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${palette.edge.join(',')},0.15)`;
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
  });

  // Draw palette name
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.font = '10px Courier New';
  ctx.fillText(palette.name.toUpperCase() + ` // ${seeds.length} seeds`, 20, 30);
}

function loop() {
  time++;
  updateSeeds();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
