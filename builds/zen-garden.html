<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Zen Garden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #1a1816;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
    background: rgba(10, 9, 8, 0.7);
    padding: 10px 16px;
    border-radius: 30px;
    border: 1px solid rgba(200, 180, 140, 0.15);
    backdrop-filter: blur(8px);
  }
  .btn {
    background: none;
    border: 1px solid rgba(200, 180, 140, 0.3);
    color: #b8a88a;
    padding: 6px 14px;
    border-radius: 16px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transition: all 0.3s;
  }
  .btn:hover {
    border-color: rgba(220, 195, 140, 0.7);
    color: #e0cc90;
    background: rgba(200, 180, 140, 0.08);
  }
  .btn.active {
    border-color: rgba(220, 195, 140, 0.9);
    color: #f0d890;
    background: rgba(200, 180, 140, 0.15);
  }
  #hint {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(180, 160, 120, 0.5);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 1.5s;
  }
  #title {
    position: fixed;
    top: 20px;
    left: 24px;
    color: rgba(180, 160, 120, 0.35);
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="garden"></canvas>
<div id="title">Digital Zen Garden</div>
<div id="hint">click to ripple · drag stones · 1-4 patterns · c clear · h hide ui</div>
<div id="ui">
  <button class="btn active" data-pattern="0">Raked</button>
  <button class="btn" data-pattern="1">Waves</button>
  <button class="btn" data-pattern="2">Mandala</button>
  <button class="btn" data-pattern="3">Empty</button>
  <button class="btn" id="clearBtn">Clear</button>
</div>

<script>
const canvas = document.getElementById('garden');
const ctx = canvas.getContext('2d');
let W, H, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', () => { resize(); initGarden(); });

// --- State ---
let pattern = 0;
let stones = [];
let ripples = [];
let particles = [];
let mouse = { x: W / 2, y: H / 2, down: false, dragStone: null };
let time = 0;
let uiVisible = true;
let sandLines = [];
let needsRedraw = true;

// --- Sand base color ---
const SAND = { r: 42, g: 38, b: 34 };
const SAND_LIGHT = { r: 55, g: 50, b: 44 };

// --- Stones ---
function createStone(x, y, r) {
  return {
    x, y, r: r || 25 + Math.random() * 40,
    vx: 0, vy: 0,
    rot: Math.random() * Math.PI * 2,
    rotV: 0,
    shape: Math.floor(Math.random() * 3),
    wobble: Math.random() * Math.PI * 2,
    color: `rgba(${30 + Math.random()*25}, ${28 + Math.random()*20}, ${25 + Math.random()*18}, 0.9)`
  };
}

function initGarden() {
  stones = [];
  const count = 3 + Math.floor(Math.random() * 4);
  for (let i = 0; i < count; i++) {
    const x = W * 0.15 + Math.random() * W * 0.7;
    const y = H * 0.15 + Math.random() * H * 0.7;
    stones.push(createStone(x, y));
  }
  generateSandPattern();
}

function generateSandPattern() {
  sandLines = [];
  const cx = W / 2, cy = H / 2;
  const maxR = Math.min(W, H) * 0.85;

  if (pattern === 0) {
    // Concentric raked circles
    const step = 18;
    for (let r = step; r < maxR; r += step) {
      const segments = Math.max(60, Math.floor(r * 0.5));
      sandLines.push({ type: 'circle', r, segments, offset: Math.random() * 0.1 });
    }
    // Radial lines
    const numRays = 24 + Math.floor(Math.random() * 18);
    for (let i = 0; i < numRays; i++) {
      const angle = (i / numRays) * Math.PI * 2 + Math.random() * 0.05;
      sandLines.push({ type: 'ray', angle, length: maxR, wobble: Math.random() * 2 });
    }
  } else if (pattern === 1) {
    // Ocean waves
    const step = 14;
    for (let y = -maxR; y < maxR; y += step) {
      sandLines.push({ type: 'wave', y, amplitude: 8 + Math.random() * 12, frequency: 0.008 + Math.random() * 0.006, phase: Math.random() * Math.PI * 2 });
    }
  } else if (pattern === 2) {
    // Mandala petals
    const petals = 8 + Math.floor(Math.random() * 8);
    for (let ring = 1; ring <= 5; ring++) {
      const r = ring * maxR / 6;
      const segments = petals * ring;
      sandLines.push({ type: 'circle', r, segments, offset: 0 });
      for (let p = 0; p < petals; p++) {
        const angle = (p / petals) * Math.PI * 2;
        sandLines.push({ type: 'petal', angle, length: r * 0.8, width: 0.15 + Math.random() * 0.1 });
      }
    }
  }
  // pattern 3 = empty, no sand lines
}

// --- Ripple ---
function addRipple(x, y, strength) {
  ripples.push({
    x, y,
    radius: 5,
    maxRadius: 80 + (strength || 30),
    strength: strength || 30,
    life: 1
  });
}

// --- Particles ---
function spawnParticle(x, y, color) {
  if (particles.length > 200) return;
  const angle = Math.random() * Math.PI * 2;
  const speed = 0.3 + Math.random() * 1.2;
  particles.push({
    x, y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    life: 1,
    decay: 0.004 + Math.random() * 0.012,
    size: 1 + Math.random() * 2,
    color: color || `rgba(200, 175, 130, `
  });
}

// --- Interaction ---
function getMousePos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('mousedown', (e) => {
  const pos = getMousePos(e);
  mouse.down = true;
  mouse.x = pos.x; mouse.y = pos.y;
  // Check if clicking a stone
  for (let i = stones.length - 1; i >= 0; i--) {
    const s = stones[i];
    const dx = pos.x - s.x, dy = pos.y - s.y;
    if (dx * dx + dy * dy < s.r * s.r * 1.5) {
      mouse.dragStone = s;
      return;
    }
  }
  addRipple(pos.x, pos.y, 40);
  // spawn particles
  for (let i = 0; i < 15; i++) spawnParticle(pos.x, pos.y);
});

canvas.addEventListener('mousemove', (e) => {
  const pos = getMousePos(e);
  const dx = pos.x - mouse.x, dy = pos.y - mouse.y;
  mouse.x = pos.x; mouse.y = pos.y;

  if (mouse.dragStone) {
    mouse.dragStone.x = pos.x;
    mouse.dragStone.y = pos.y;
    mouse.dragStone.vx = dx * 0.3;
    mouse.dragStone.vy = dy * 0.3;
  } else if (mouse.down) {
    if (Math.abs(dx) + Math.abs(dy) > 3) {
      addRipple(pos.x, pos.y, 15);
      if (Math.random() > 0.5) spawnParticle(pos.x, pos.y);
    }
  }
});

canvas.addEventListener('mouseup', () => {
  mouse.down = false;
  mouse.dragStone = null;
});

canvas.addEventListener('mouseleave', () => {
  mouse.down = false;
  mouse.dragStone = null;
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  const pos = getMousePos(t);
  mouse.down = true;
  mouse.x = pos.x; mouse.y = pos.y;
  addRipple(pos.x, pos.y, 40);
  for (let i = 0; i < 12; i++) spawnParticle(pos.x, pos.y);
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  const pos = getMousePos(t);
  const dx = pos.x - mouse.x, dy = pos.y - mouse.y;
  mouse.x = pos.x; mouse.y = pos.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) {
    addRipple(pos.x, pos.y, 15);
  }
}, { passive: false });

canvas.addEventListener('touchend', () => { mouse.down = false; });

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key >= '1' && e.key <= '4') {
    pattern = parseInt(e.key) - 1;
    updateButtons();
    generateSandPattern();
    addRipple(W / 2, H / 2, 20);
  }
  if (e.key === 'c' || e.key === 'C') {
    ripples = [];
    particles = [];
    addRipple(W / 2, H / 2, 50);
  }
  if (e.key === 'h' || e.key === 'H') {
    uiVisible = !uiVisible;
    document.getElementById('ui').style.opacity = uiVisible ? 1 : 0;
    document.getElementById('hint').style.opacity = uiVisible ? 0.5 : 0;
    document.getElementById('title').style.opacity = uiVisible ? 0.35 : 0;
  }
});

// UI buttons
document.querySelectorAll('.btn[data-pattern]').forEach(btn => {
  btn.addEventListener('click', () => {
    pattern = parseInt(btn.dataset.pattern);
    updateButtons();
    generateSandPattern();
    addRipple(W / 2, H / 2, 20);
  });
});

document.getElementById('clearBtn').addEventListener('click', () => {
  ripples = [];
  particles = [];
  addRipple(W / 2, H / 2, 50);
});

function updateButtons() {
  document.querySelectorAll('.btn[data-pattern]').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.pattern) === pattern);
  });
}

// Hide hint after a while
setTimeout(() => {
  document.getElementById('hint').style.opacity = '0';
}, 8000);

// --- Rendering ---
function drawSand() {
  // Base sand fill
  ctx.fillStyle = `rgb(${SAND.r}, ${SAND.g}, ${SAND.b})`;
  ctx.fillRect(0, 0, W, H);

  // Subtle gradient
  const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.6);
  grad.addColorStop(0, `rgba(${SAND_LIGHT.r}, ${SAND_LIGHT.g}, ${SAND_LIGHT.b}, 0.3)`);
  grad.addColorStop(1, `rgba(0, 0, 0, 0.2)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  if (sandLines.length === 0) return;

  ctx.lineWidth = 1.2;
  ctx.lineCap = 'round';

  // Apply ripple distortion
  const rippleMap = new Map();

  sandLines.forEach((line, li) => {
    const pts = [];
    const steps = line.segments || 120;
    const len = line.length || maxR();

    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      let x, y;

      if (line.type === 'circle') {
        const a = t * Math.PI * 2 + (line.offset || 0);
        x = W / 2 + Math.cos(a) * line.r;
        y = H / 2 + Math.sin(a) * line.r;
      } else if (line.type === 'ray') {
        x = W / 2 + Math.cos(line.angle) * t * len;
        y = H / 2 + Math.sin(line.angle) * t * len;
        if (line.wobble) {
          x += Math.sin(t * 10 + time * 0.5) * line.wobble;
          y += Math.cos(t * 8 + time * 0.3) * line.wobble;
        }
      } else if (line.type === 'wave') {
        x = t * W;
        y = H / 2 + line.y + Math.sin(x * line.frequency + line.phase + time * 0.3) * line.amplitude;
      } else if (line.type === 'petal') {
        const spread = (line.width || 0.2) * Math.PI;
        const a = line.angle + (t - 0.5) * spread;
        const d = t * line.length;
        x = W / 2 + Math.cos(a) * d;
        y = H / 2 + Math.sin(a) * d;
      }

      // Ripple displacement
      let dispX = 0, dispY = 0;
      for (const rp of ripples) {
        const rdx = x - rp.x, rdy = y - rp.y;
        const dist = Math.sqrt(rdx * rdx + rdy * rdy);
        const ringDist = Math.abs(dist - rp.radius);
        if (ringDist < 30) {
          const influence = (1 - ringDist / 30) * rp.life * rp.strength * 0.15;
          const nx = dist > 0.01 ? rdx / dist : 0;
          const ny = dist > 0.01 ? rdy / dist : 0;
          dispX += nx * influence * Math.sin(ringDist * 0.5);
          dispY += ny * influence * Math.sin(ringDist * 0.5);
        }
      }

      // Mouse repulsion
      const mdx = x - mouse.x, mdy = y - mouse.y;
      const mDist = Math.sqrt(mdx * mdx + mdy * mdy);
      if (mDist < 80 && mDist > 0.01) {
        const mInf = (1 - mDist / 80) * 12;
        dispX += (mdx / mDist) * mInf;
        dispY += (mdy / mDist) * mInf;
      }

      pts.push({ x: x + dispX, y: y + dispY });
    }

    // Draw line with depth-based opacity
    const depth = line.type === 'circle'
      ? (line.r / maxR())
      : line.type === 'ray' ? 0.6 : 0.5;

    const baseAlpha = 0.12 + depth * 0.2;
    ctx.strokeStyle = `rgba(${SAND_LIGHT.r + 20}, ${SAND_LIGHT.g + 18}, ${SAND_LIGHT.b + 15}, ${baseAlpha})`;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {
      const xc = (pts[i].x + pts[i + 1].x) / 2;
      const yc = (pts[i].y + pts[i + 1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
    }
    ctx.stroke();
  });
}

function maxR() { return Math.min(W, H) * 0.42; }

function drawStones() {
  stones.forEach(s => {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot + Math.sin(time * 0.3 + s.wobble) * 0.02);

    // Shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.beginPath();
    ctx.ellipse(3, 3, s.r, s.r * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Stone body
    const sg = ctx.createRadialGradient(-s.r * 0.25, -s.r * 0.25, s.r * 0.05, 0, 0, s.r);
    sg.addColorStop(0, 'rgba(90, 85, 78, 0.95)');
    sg.addColorStop(0.6, 'rgba(50, 46, 42, 0.9)');
    sg.addColorStop(1, 'rgba(25, 22, 20, 0.85)');
    ctx.fillStyle = sg;

    if (s.shape === 0) {
      // Round
      ctx.beginPath();
      ctx.ellipse(0, 0, s.r, s.r * 0.72, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (s.shape === 1) {
      // Rectangular
      const w = s.r * 1.3, h = s.r * 0.7;
      ctx.beginPath();
      ctx.roundRect(-w / 2, -h / 2, w, h, s.r * 0.2);
      ctx.fill();
    } else {
      // Irregular
      ctx.beginPath();
      ctx.moveTo(-s.r * 0.8, -s.r * 0.4);
      ctx.bezierCurveTo(-s.r * 0.9, s.r * 0.3, -s.r * 0.3, s.r * 0.7, s.r * 0.5, s.r * 0.2);
      ctx.bezierCurveTo(s.r * 0.9, -s.r * 0.1, s.r * 0.7, -s.r * 0.6, -s.r * 0.8, -s.r * 0.4);
      ctx.fill();
    }

    // Subtle highlight
    ctx.strokeStyle = 'rgba(140, 130, 115, 0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(-s.r * 0.2, -s.r * 0.25, s.r * 0.55, s.r * 0.3, -0.3, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
  });
}

function drawRipples() {
  ripples.forEach(rp => {
    ctx.strokeStyle = `rgba(200, 175, 130, ${rp.life * 0.15})`;
    ctx.lineWidth = 1.5 * rp.life;
    ctx.beginPath();
    ctx.arc(rp.x, rp.y, rp.radius, 0, Math.PI * 2);
    ctx.stroke();
  });
}

function drawParticles() {
  particles.forEach(p => {
    const a = p.life * 0.6;
    ctx.fillStyle = p.color + a + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  });
}

function update() {
  time += 0.016;

  // Update ripples
  for (let i = ripples.length - 1; i >= 0; i--) {
    const rp = ripples[i];
    rp.radius += 1.2;
    rp.life -= 0.006;
    if (rp.life <= 0) ripples.splice(i, 1);
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.98;
    p.vy *= 0.98;
    p.vy += 0.005; // gentle gravity
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Update stones (gentle drift, collide with edges)
  stones.forEach(s => {
    if (mouse.dragStone === s) return;
    s.x += s.vx;
    s.y += s.vy;
    s.vx *= 0.92;
    s.vy *= 0.92;
    s.rot += s.rotV;
    s.rotV *= 0.95;

    const margin = s.r + 10;
    if (s.x < margin) { s.x = margin; s.vx *= -0.5; }
    if (s.x > W - margin) { s.x = W - margin; s.vx *= -0.5; }
    if (s.y < margin) { s.y = margin; s.vy *= -0.5; }
    if (s.y > H - margin) { s.y = H - margin; s.vy *= -0.5; }

    // Stone collisions
    stones.forEach(other => {
      if (other === s) return;
      const dx = other.x - s.x, dy = other.y - s.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = s.r + other.r;
      if (dist < minDist && dist > 0.01) {
        const nx = dx / dist, ny = dy / dist;
        const overlap = (minDist - dist) / 2;
        if (mouse.dragStone !== s) { s.x -= nx * overlap; s.y -= ny * overlap; }
        if (mouse.dragStone !== other) { other.x += nx * overlap; other.y += ny * overlap; }
        const dvx = s.vx - other.vx, dvy = s.vy - other.vy;
        const dot = dvx * nx + dvy * ny;
        if (dot > 0) {
          s.vx -= dot * nx * 0.4;
          s.vy -= dot * ny * 0.4;
          other.vx += dot * nx * 0.4;
          other.vy += dot * ny * 0.4;
          s.rotV += (Math.random() - 0.5) * 0.01;
          other.rotV += (Math.random() - 0.5) * 0.01;
        }
      }
    });
  });

  // Ambient particles
  if (Math.random() > 0.92) {
    spawnParticle(
      Math.random() * W,
      Math.random() * H,
      `rgba(${180 + Math.random() * 40}, ${160 + Math.random() * 30}, ${120 + Math.random() * 30}, `
    );
  }

  needsRedraw = true;
}

function draw() {
  if (!needsRedraw) { requestAnimationFrame(draw); return; }
  needsRedraw = false;

  drawSand();
  drawRipples();
  drawStones();
  drawParticles();

  // Mouse glow
  if (mouse.x > 0 && mouse.y > 0) {
    const mg = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 60);
    mg.addColorStop(0, 'rgba(200, 170, 120, 0.04)');
    mg.addColorStop(1, 'rgba(200, 170, 120, 0)');
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 60, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

// --- Boot ---
initGarden();
requestAnimationFrame(draw);
</script>
</body>
</html>
