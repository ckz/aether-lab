<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Lab — Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d14;
    font-family: 'Courier New', monospace;
    color: #ccc;
    min-height: 100vh;
    padding: 40px 24px;
  }
  h1 {
    text-align: center;
    color: #fff;
    font-size: 22px;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .subtitle {
    text-align: center;
    color: #555;
    font-size: 12px;
    margin-bottom: 40px;
    letter-spacing: 2px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .card {
    background: rgba(20, 20, 35, 0.7);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    overflow: hidden;
    transition: transform 0.25s, border-color 0.25s;
    text-decoration: none;
    color: inherit;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(123, 111, 255, 0.4);
  }
  .card-preview {
    height: 160px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    position: relative;
    overflow: hidden;
  }
  .card-preview::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.4));
  }
  .card-body { padding: 14px 18px; }
  .card-title {
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .card-meta {
    color: #555;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <h1>✦ Aether Lab</h1>
  <div class="subtitle">Curious creations & generative experiments</div>
  <div class="grid">
    <a class="card" href="chromatic-flow-field.html">
      <div class="card-preview">🌊</div>
      <div class="card-body">
        <div class="card-title">Chromatic Flow Field</div>
        <div class="card-meta">Generative Art • Particles</div>
      </div>
    </a>
  </div>
</body>
</html>
